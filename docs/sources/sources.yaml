# The sources registry: one entry per siglum (docs/sources/STRUCTURE.md, *Sources*).
# The prose of each edition stays in README.md's Editions table; this file holds what a
# tool needs: the BDRC identifiers, the volumes with their page-to-image offsets and
# chapters, the licence, the rank among the sources and the role. `kb.py check` fails
# when the two lists of sigla differ.
#
# Keys. `title`, `author`: the work. `bdrc`: `work`, `etext`, `scans` (one per volume
# where volumes exist). `volumes`: per printed volume, `scan`, `image_offset`
# (image = printed page + offset; a list of exceptions where the print's numbering
# breaks), `chapters` (number: first page, from the contents pages; a chapter runs to
# the next one's first page), `pages` (the printed extent). `locator`: what a passage
# id counts by when there is no printed page: `image`, `folio`, `box`. `licence`:
# public-domain, or the licence of a modern work. `rank`: 1 WB, 2 Mipham's notes and
# writings, 3 the rest (rules .agents/rules/sources.md). `role`: source, or witness
# (read to check WB, never built or cited alone).

