# Calques from English and empty lead-ins: «стоит отметить, что», «важно понимать».
extends: existence
message: "A calque or an empty lead-in: «%s» — does the sentence stand without it?"
level: suggestion
ignorecase: true
nonword: true
tokens:
  - '\bстоит (?:отметить|помнить|подчеркнуть|упомянуть)\b'
  - '\bважно (?:понимать|помнить|отметить|подчеркнуть)\b'
  - '\bнеобходимо (?:отметить|подчеркнуть|понимать)\b'
  - '\bследует (?:отметить|учитывать|помнить|подчеркнуть)\b'
  - '\bможно (?:сказать|отметить), что\b'
  - '\bможно с уверенностью сказать\b'
  - '\bчто касается\b'
  - '\bне секрет,? что\b'
  - '\bпо мнению экспертов\b'
  - '\bспециалисты отмечают\b'
  - '\bвсё чаще\b'
  - '\bвсе чаще\b'
