# The model's hand in Russian: words a living text hardly has and a model puts into every second
# paragraph. A reading aid: an essay may need «гармония» where the original has «harmony».
extends: existence
message: "The model's hand: «%s» — is it the original's word, or the translation's habit?"
level: suggestion
ignorecase: true
nonword: true
tokens:
  - '\bподч[её]ркива(?:ет|ют|я)\b'
  - '\bакцентиру[а-яё]+'
  - '\bсвидетельству[а-яё]+\s+о\b'
  - '\bдемонстрир[а-яё]+'
  - '\bчто дела(?:ет|ют)\s+(?:его|её|ее|их|это|эту|этот)\b'
  - '\bважност[а-яё]+'
  - '\b(?:заставля[а-яё]+|стоит|стоило|повод)\s+задуматься\b'
  - '\bстал[аои]?\s+символом\b'
  - '\bнастоящ(?:им|ей|ее|ими)\s+(?:открытием|прорывом|находкой|помощником)\b'
  - '\b(?:важн|значим|ключев|решающ|смел|уверенн)[а-яё]*\s+шаг[а-яё]*'
  - '\bзаслужива(?:ет|ют)\s+(?:внимани|отдельн|особ)[а-яё]*'
  - '\bвдохнов[а-яё]+'
  - '\bнезабываем[а-яё]+'
  - '\bгармони[а-яё]+'
  - '\bоставля[а-яё]+\s+(?:[а-яё]+\s+)?впечатлени[а-яё]*'
  - '\bневероятн[а-яё]+'
  - '\bможет стать\b'
  - '\bспособ(?:ен|на|но|ны)\s+обеспечить\b'
  - '\bпризван[а-яё]*\s+(?:решить|решать|обеспечить)\b'
  - '\bпозволя(?:ет|ют)\s+достичь\b'
  - '\bиграет роль\b'
