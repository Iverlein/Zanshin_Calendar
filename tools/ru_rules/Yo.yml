# «ё» is written (a working value, docs/open-questions.md: the owner keeps it in his other Russian
# texts). The list holds only the forms that are no other word without the dots: «все» and «всё»,
# «чем» and «чём», «нем» and «нём», «берет» and «берёт», «небо» and «нёбо» cannot be told apart by a
# list and are the translator's to read.
extends: existence
message: "Written with «ё»: «%s»."
level: error
ignorecase: true
tokens:
  - 'еще'
  - 'ее'
  - 'нее'
  - 'мое'
  - 'твое'
  - 'свое'
  - 'чье'
  - '(?:у|при|на|во|вы|подо|про|до|за|пере|обо|ото|разо|со)?шел'
  - '(?:при|у|по|на|за|про|до|пере|подо|обо|со|во)?йдет'
  - 'идет'
  - 'идем'
  - '(?:от|раз|пере|вы|за|из|с|по)?дает'
  - '(?:в|о)?стается'
  - 'живет'
  - 'ведет'
  - 'несет'
  - 'зовет'
  - 'ждет'
  - 'растет'
  - 'поймет'
  - 'возьмет'
  - 'начнет'
  - 'вернет(?:ся)?'
  - 'умрет'
  - 'упадет'
  - 'объем[а-я]*'
  - 'счет[а-я]*'
  - 'учет[а-я]*'
  - 'расчет[а-я]*'
  - 'прием[а-я]*'
  - 'подъем[а-я]*'
  - 'причем'
  - 'вдвоем'
  - 'втроем'
  - 'вперед'
  - 'ребенок'
  - 'тяжел(?:ый|ая|ое|ые|ого|ой|ую|ым|ых)'
  - 'темн(?:ый|ая|ое|ые|ого|ой|ую|ым|ых)'
  - 'черн(?:ый|ая|ое|ые|ого|ой|ую|ым|ых)'
  - 'мертв(?:ый|ая|ое|ые|ого|ой|ую|ым|ых)?'
  - 'легк(?:ий|ая|ое|ие|ого|ой|ую|им|их)'
  - 'тверд(?:ый|ая|ое|ые|ого|ой|ую|ым|ых)'
  - 'далек(?:ий|ая|ое|ие|ого|ой|ую|им|их)'
