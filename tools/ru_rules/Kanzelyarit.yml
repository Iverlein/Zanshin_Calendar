# Officialese: «данный», «является», «осуществлять», «в рамках». An essay in Russian is not a
# regulation; the English original has none of it, so it is the translation's own.
extends: existence
message: "Officialese: «%s» — say it in living words."
level: warning
ignorecase: true
tokens:
  - 'данн(?:ый|ая|ое|ом|ой|ого|ую)'
  - 'явля(?:ется|ются)'
  - 'осуществ(?:ить|лять|ляется|ляются|ления|лении)'
  - 'посредством'
  - 'вышеуказанн[а-яё]*'
  - 'вышеописанн[а-яё]*'
  - 'вышеперечисленн[а-яё]*'
  - 'нижеприведённ[а-яё]*'
  - 'нижеприведенн[а-яё]*'
  - 'нижеследующ[а-яё]*'
  - 'в случае если'
  - 'в том случае, если'
  - 'имеет(?:ся)? возможность'
  - 'обеспечива[а-яё]+ возможность'
  - 'не представляется возможным'
  - 'имеет место'
  - 'при помощи'
  - 'в рамках'
  - 'с целью'
  - 'в целях'
  - 'во избежание'
  - 'на сегодняшний день'
  - 'в данный момент'
  - 'по причине'
  - 'касательно'
  - '(?:следует|стоит|важно) отметить'
  - 'необходимо отметить'
