# The Russian of the app rewritten by docs/translation-style.md, block by block (ROADMAP L5).
# A block takes the families its patterns match, first block first: a pattern is a regular expression
# matched in full against the family's name with «reading.» taken off, so «Mansion» takes the terms
# (Mansion.*) and the readings (reading.Mansion.*) of the mansions together. The last block takes what
# no other does. `python3 tools/ru_check.py --plan` prints each block's families, units and words, and
# a block's `done` is set to the date the owner approved its Russian.

[[block]]
id = 74
title = "Pilot: the screens read every day, and the catalog's vocabulary"
app = ["brief", "hours", "tib", "kyu", "menu", "theme", "notice", "widget", "works", "row", "detail", "desc", "election", "day"]
catalog = ["wording", "ReadingRow", "Activity", "ActivityFamily", "DayFactor", "ElectionalFactor", "PairList"]
done = "2026-11-21"

