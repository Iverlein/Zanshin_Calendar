EarthLordCourse.SPUG_STON=Pukton's earth lords
CourseDay.otherView=another view
reading.EarthLord.SPUG_STON=In the view of Pukton (སྤུག་སྟོན, spug ston), which the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) gives after the earth lords' (ས་བདག, sa bdag) turning, each month has a date of success, when remedies for the earth lords help, a date of vanishing, when they do not help and turn back on whoever performs them, and dates on which no wealth is given out, since giving out wealth or livestock then empties the pen: in the first month of spring success on the 5th and 30th, vanishing on the 8th and no wealth on the 1st and 6th; in the middle the 8th, 6th and 12th; in the last the 18th, 6th and 8th; in summer the 1st, 6th and 8th, the 19th, 26th and 16th, the 3rd, 26th and 28th; in autumn the 19th, 29th and 9th, the 9th, 12th and 10th, the 7th, 4th and 27th; in winter the 27th, 9th and 20th, the 30th, 2nd and 12th with the 20th, the 19th, 6th and 30th, spring counted from the 11th month. Each month also has its way for the ransom offering (ཡས, yas), toward which laying out the ransom cord is good: in spring south-west, north-west and north-east; in summer south-east, north-west and west; in autumn north-east, south-east and north-west; in winter south, east and north-east. {0}
reading.EarthLord.SPUG_STON.grub=Today is a date of success: remedies for the earth lords help.
reading.EarthLord.SPUG_STON.yal=Today is a date of vanishing: remedies for the earth lords do not help and turn back.
reading.EarthLord.SPUG_STON.nor=Today no wealth is given out.
reading.EarthLord.NAG_CHUNG.other=Nyima Nakchung (ཉི་མ་ནག་ཆུང, nyi ma nag chung), the lesser black day of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): this date is not in the text's own course but in another view it reports, in which the winter months have the 9th, 19th and 29th in turn, spring counted from the 11th month. Works for the dead, a bride, consecration, feasts and funeral rites are bad on it, above all sending wealth out of the house.
reading.EarthLord.PHUNG_ZOR.other=Pungpo Zortok (ཕུང་པོ་ཟོར་ཐོགས, phung po zor thogs), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): this date is not in the text's own course, by animal month, but in another view it reports, by the months of the seasons: in spring the 18th, 8th and 9th, in summer the 3rd, 13th and 9th, in autumn the 7th, 17th and 28th, in winter the 1st, 16th and 9th, spring counted from the 11th month. Its avoidances are the course's; destructive mantras against others are good.
reading.EarthLord.KI_KANG.other=Kikang (ཀི་ཀང, ki kang): this date is not in the first course of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) but in the second it gives: in the tiger, horse and dog months the 17th and 28th, in the pig, sheep and hare months the 2nd and 24th, in the mouse, dragon and monkey months the 8th and 28th, in the bird, ox and snake months the 16th and 26th, the tiger month being the 11th. Beginning works for the living and the dead, war, spectacles, paying debts, and peaceful and virtuous work are avoided; cruel and harsh work is good.
reading.EarthLord.KI_KANG.third=Kikang (ཀི་ཀང, ki kang): this date is not in the first course of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) but in the third, which the text calls a discordant view, given for two groups of months: in the tiger, horse and dog months the 17th and 27th, in the pig, sheep and hare months the 2nd and 22nd, the tiger month being the 11th. Beginning works for the living and the dead, war, spectacles, paying debts, and peaceful and virtuous work are avoided; cruel and harsh work is good.
reading.EarthLord.GNAM_KHYI.other=Namkyi Nakpo (གནམ་ཁྱི་ནག་པོ, gnam khyi nag po), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): this day is not in the text's first course but in the other it reports, by the date's animal: in spring sheep days at daybreak, snake and monkey days at midnight, tiger and bird days at dawn; in summer hare and monkey days late in the afternoon, sheep and pig days at sunrise, bird, monkey and horse days at dusk; in autumn snake and sheep days at nightfall, dragon, horse and pig days in the warmth of the morning, hare and monkey days in the morning; in winter dog, ox, dragon and tiger days late in the afternoon, ox, tiger, dog and snake days at sunset, tiger, hare, pig and mouse days in the afternoon, spring counted from the 11th month. Great works for the living and the dead, above all a bride, building and carrying out a corpse, are avoided.
reading.EarthLord.GZA_BDUN.other=Zadün (གཟའ་བདུན, gza' bdun), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): this date is not in the text's own course but in another it reports, the same dates in the reverse order: in spring the 28th, 18th and 8th, in summer the 27th, 17th and 7th, in autumn the 21st, 11th and 1st, in winter the 29th, 19th and 9th, spring counted from the 11th month. All white work, a corpse, funeral rites, building, a bride and taking a child out are bad; destructive mantras against others are good.
reading.EarthLord.DBUL_PO.other=Ulpo Laktong (དབུལ་པོ་ལག་སྟོང, dbul po lag stong), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): this date is not in the text's own course but in one person's view it reports, which differs in four months: the first month of spring the 6th and 16th, the last of autumn the 9th and 21st, the first of winter the 19th and the middle of winter the 10th, spring counted from the 11th month. Feasts and giving out wealth bring poverty, and most works for the living and the dead are avoided.
reading.EarthLord.SDE_BRGYAD.STRIKES_other=Today the eight classes strike, as some say: in the last month of autumn from the 8th to the 30th.
reading.EarthLord.KLU.STRIKES_other=Today the nāgas strike, as some teachings or texts say.
wording.remedies_for_the_earth_lords=remedies for the earth lords
reading.EarthLord.CLASS_TIMES.gza=Today, a date of Viṣṭi, is the planets' time.
reading.EarthLord.CLASS_TIMES.srin_po=Today, a date of Viṣṭi, is the ogres' time.
wording.work_with_mud=work with mud
wording.setting_up_growth=setting up growth (སྐྱེད་འཛུགས, skyed 'dzugs), in the text's words
wording.pulling_down_the_yak_wood=pulling down the yak wood (གཡག་ཤིང་དགོག, g.yag shing dgog), in the text's words
EarthLordCourse.NAG_CHEN=Nyima Nakchen
reading.EarthLord.NAG_CHEN.other=The great black day, Nyima Nakchen (ཉི་མ་ནག་ཆེན, nyi ma nag chen), first of the earth lords (ས་བདག, sa bdag) that the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) moves by date: this date is not in the text's own course but in one person's view it reports, the 24th of the last months of spring, autumn and winter and the 9th of the first month of winter, spring counted from the 11th month. Works for the dead and for the living are bad on it, above all sending wealth out, empowerment and consecration, a bride, building, burial and trade; harmful means go along with it.
EarthLordCourse.ZHAG_NAG=The black day
reading.EarthLord.ZHAG_NAG=The black day (ཞག་ནག, zhag nag): as the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reckons the black months, the four-slayer (བཞི་གཤེད, bzhi gshed) of the animal that rises, the animals three either side of it, so it meets the month with the day: in the mouse and horse months the bird and hare days are black, in the ox and sheep months the dog and dragon days, in the tiger and monkey months the pig and snake days, the day being the date's animal and the tiger month the 11th. When the day is black, a grave site, building, feasts, consecration, enthronement, teaching the dharma, taking new land, a bride and all important works are bad; fierce work done then strikes. Remedy: a swastika drawn on the right of the door, the sun and moon on the left.
reading.EarthLord.ZHAG_NAG.other=The black day (ཞག་ནག, zhag nag) in the view of the Paṇchen Mön'drowa (པཎ་ཆེན་སྨོན་འགྲོ་བ, paN chen smon 'gro ba), which the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reports: one date in each year, the mouse year's 7th of the middle month of spring, the ox year's 5th of the last, the tiger year's 7th of the first month of summer, the hare year's 7th of the middle month of winter, the dragon year's 26th of the last, the snake year's 9th of the first month of autumn, the horse year's 19th of the middle, the sheep year's 7th of the last, the monkey year's 16th of the first month of winter, the bird year's 10th of the middle month of spring, the dog year's 21st of the last month of summer and the pig year's 8th of the first month of spring, the year and spring counted from the 11th month. Most works are bad on it.

# The year of life: the elemental divination of a year of age (WB vol. 1, pp. 255-258, 380-411; the Moonbeams), SPEC §5.9
