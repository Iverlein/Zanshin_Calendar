HarshYear.COMBINED_NINE=combined nine-multiple
HarshYear.NINE_TOMB=nine-multiple meets the tomb
HarshYear.TRIGRAM_NINE=the trigram's nine-multiple
HarshYear.MEWA_NINE=the mewa's nine-multiple
HarshYear.TOMB_OWN_GREAT=your great tomb
HarshYear.TOMB_OWN_SMALL=your small tomb
HarshYear.TOMB_SLAYER_GREAT=the slayer's great tomb
HarshYear.TOMB_SLAYER_SMALL=the slayer's small tomb
HarshYear.BLACK_UNDERTAKER=a black undertaker
HarshYear.TOMB_SIGN=the tomb sign
SmeBaObstacle.SKY_DOOR=mewa's sky door
SmeBaObstacle.EARTH_DOOR=mewa's earth door
reading.YearDecline.VITALITY={0} With the vitality's energy waning, deaths and losses may come two at a time, and the year is to be treated in earnest.
reading.YearDecline.VITALITY.remedy=draw the life out and give up taking life; ransom death and the la, the life-spirit (བླ, bla), with the rites of long life and prosperity
reading.YearDecline.BODY={0} With the body's energy waning, grief, wounds and stiff joints may come.
reading.YearDecline.BODY.remedy=send a dog's carcass away as an effigy, towards a good direction
reading.YearDecline.DESTINY={0} With the destiny's energy waning, wealth is lost, the horse you ride may die and children are hard to raise. Enemies, robbers and thieves come.
reading.YearDecline.DESTINY.remedy=press down the spirits of loss and of enmity, and give a feast to those who cannot repay it
reading.YearDecline.LUCK={0} With the luck's energy waning, blame comes without fault, with sudden blows on high ground and low.
reading.YearDecline.LUCK.remedy=mend paths and narrow ways, make clay votive images (ཚ་ཚ, tsha tsha) and press down the spirits of enmity
reading.Harsh.COMBINED_NINE.EARTH.1=For earth and water, the first: demons (བདུད, bdud) strike.
reading.Harsh.COMBINED_NINE.EARTH.1.remedy=make the rite that turns the demons' (བདུད, bdud) face
reading.Harsh.COMBINED_NINE.EARTH.2=For earth and water, the second: a time of sudden fright.
reading.Harsh.COMBINED_NINE.EARTH.2.remedy=offer a hundred portions of meat and a hundred of dough
reading.Harsh.COMBINED_NINE.EARTH.3=For earth and water, the third: the turquoise elephant runs wild, and epidemics come to those around you.
reading.Harsh.COMBINED_NINE.EARTH.3.remedy=make purifying ablutions and recite the Uṣṇīṣa
reading.Harsh.COMBINED_NINE.EARTH.4=For earth and water, the fourth: the blue turquoise rock cracks, and for a man there is a face of enemies and thieves.
reading.Harsh.COMBINED_NINE.EARTH.4.remedy=turn back, crush and press down enemies, with dhāraṇīs and many clay votive images (ཚ་ཚ, tsha tsha)
reading.Harsh.COMBINED_NINE.EARTH.5=For earth and water, the fifth: the golden tree falls, bad for the elders of the father's line.
reading.Harsh.COMBINED_NINE.EARTH.5.remedy=ransom the la, the life-spirit (བླ, bla), recite the long-life sūtras and ransom life
reading.Harsh.COMBINED_NINE.WOOD.1=For wood, the first: a bird alights on a spear-tip, and a man goes into enemy hands.
reading.Harsh.COMBINED_NINE.WOOD.1.remedy=turn back, crush and press down enemies
reading.Harsh.COMBINED_NINE.WOOD.2=For wood, the second: two demons (བདུད, bdud) and two men fight, bad for those close to you.
reading.Harsh.COMBINED_NINE.WOOD.2.remedy=avert the demons' (བདུད, bdud) misfortune
reading.Harsh.COMBINED_NINE.WOOD.3=For wood, the third: the arrow breaks at the waist, harsh for sons, grandsons and teachers.
reading.Harsh.COMBINED_NINE.WOOD.3.remedy=give a ransom (གླུད, glud) and honour the four orders of monks
reading.Harsh.COMBINED_NINE.WOOD.4=For wood, the fourth: the arrow goes under the earth, and earth lords (ས་བདག, sa bdag) and earth spirits rise, bad for the lama and the father's kin.
reading.Harsh.COMBINED_NINE.WOOD.4.remedy=give water tormas (ཆུ་གཏོར, chu gtor) and recite the Golden Light
reading.Harsh.COMBINED_NINE.WOOD.5=For wood, the fifth: the vulture falls on the plain, a time of gossip and talk.
reading.Harsh.COMBINED_NINE.WOOD.5.remedy=drive out goblins and press down gossip
reading.Harsh.COMBINED_NINE.FIRE.1=For fire, the first: demons (བདུད, bdud) cast misfortune and throw the pebble of the dead, bad for the one it falls on.
reading.Harsh.COMBINED_NINE.FIRE.1.remedy=avert the demons (བདུད, bdud), send a zor (ཟོར, zor) thread-cross (མདོས, mdos) and recite the Avataṃsaka
reading.Harsh.COMBINED_NINE.FIRE.2=For fire, the second: the sorcery of priests harms, and a sudden fierce illness comes.
reading.Harsh.COMBINED_NINE.FIRE.2.remedy=make the hundredfold rite, with a hundred portions of meat and of dough
reading.Harsh.COMBINED_NINE.FIRE.3=For fire, the third: the child falls from the lap, and small children fall fiercely ill.
reading.Harsh.COMBINED_NINE.FIRE.3.remedy=give a small ransom (གླུད, glud) and press down the spirits
reading.Harsh.COMBINED_NINE.FIRE.4=For fire, the fourth: enemies are met, with a face of disputes.
reading.Harsh.COMBINED_NINE.FIRE.4.remedy=turn back enemies and press down their spirits
reading.Harsh.COMBINED_NINE.FIRE.5=For fire, the fifth: the arrow of life breaks at the joint, with fierce illness and much gossip.
reading.Harsh.COMBINED_NINE.FIRE.5.remedy=recite the Dhvajāgra and call long life and prosperity
reading.Harsh.COMBINED_NINE.IRON.1=For iron, the first: gold comes out from under the ground, yet wealth may run empty.
reading.Harsh.COMBINED_NINE.IRON.1.remedy=call prosperity, press down the spirits of loss and give a feast for children
reading.Harsh.COMBINED_NINE.IRON.2=For iron, the second: a load you cannot carry, great lawsuits and enemies to be paid off.
reading.Harsh.COMBINED_NINE.IRON.2.remedy=make strong averting rites with tormas (གཏོར་མ, gtor ma)
reading.Harsh.COMBINED_NINE.IRON.3=For iron, the third: the golden yoke breaks, and great men rise as enemies.
reading.Harsh.COMBINED_NINE.IRON.3.remedy=drive out misfortune and make the rite of the male god
reading.Harsh.COMBINED_NINE.IRON.4=For iron, the fourth: the demons' (བདུད, bdud) noose strikes, a harsh time for those around you.
reading.Harsh.COMBINED_NINE.IRON.4.remedy=give averting tormas (གཏོར་མ, gtor ma)
reading.Harsh.COMBINED_NINE.IRON.5=For iron, the fifth: the house of the tomb. Death and loss may come to you or to the kin of father or mother, with little merit or upheavals.
reading.Harsh.COMBINED_NINE.IRON.5.remedy=ransoms (གླུད, glud), thread-crosses (མདོས, mdos) to the lake goddesses and water offerings free you
reading.Harsh.NINE_TOMB=Your nine-multiple meets the tomb this year, by your birth animal and gender: very harmful, as if you entered the tomb yourself.
reading.Harsh.NINE_TOMB.remedy=give tormas (གཏོར་མ, gtor ma), offerings to the earth and a feast to all the lords of the charnel ground, and seal the tomb's mouth
reading.Harsh.TRIGRAM_NINE=Your trigram of the year is back where it started, on the fire trigram (ལི, li) for a man or the water trigram (ཁམ, kham) for a woman: the trigram's nine-multiple.
reading.Harsh.MEWA_NINE=Your mewa (སྨེ་བ, sme ba) of the year is back in the middle, on your natal mewa: the mewa's nine-multiple.
reading.Harsh.TOMB_OWN_GREAT=The present year is the great tomb of your birth year's element, the tomb animal in your own element. Of the eighty tomb houses it is your own tomb, the greater, and entering it is the great penalty.
reading.Harsh.TOMB_OWN_SMALL=The present year is the small tomb of your birth year's element, the seventh from the great.
reading.Harsh.TOMB_SLAYER_GREAT=The present year is the great tomb of the element that slays yours, its tomb animal in that element.
reading.Harsh.TOMB_SLAYER_SMALL=The present year is the small tomb of the element that slays yours, the seventh from its great.
reading.Harsh.BLACK_UNDERTAKER=Your great tomb is one of the four black undertakers, the water dragon, the wood sheep, the fire dog and the iron ox. When one's own element's tomb rises as one of them, it is bad.
reading.Harsh.LOG_MEN_TOMB=Your progressed sign (ལོག་མེན, log men) stands on one of your four tomb years: slightly bad.
reading.Harsh.TOMB_SIGN=Your trigram of the year stands on the tomb trigram of your vitality, and you fall into the tomb sign. For wood it is the earth trigram (ཁོན, khon), for fire the sky trigram (ཁེན, khen), for iron the mountain trigram (གིན, gin), for earth and water the wind trigram (ཟོན, zon).
reading.Harsh.TOMB_SIGN.remedy=be drawn out of the tomb sign, and make the rite of the three bones
reading.Harsh.OWN_YEAR={0} In your own animal's year, do not visit the mourning or go to a sick person's pillow, and avoid building.
reading.Harsh.OWN_YEAR.remedy=leave distractions and strive in virtue; summon life and prosperity strongly, honour the four orders of monks, and recite the Hundred Thousand, the Twenty Thousand and the Uṣṇīṣa
reading.Harsh.SEVENTH={0} The seventh is harsh with enemies and slayers: a demon stirs and wants a ransom, and sudden frights, fear and blame come.
reading.Harsh.SEVENTH.remedy=recite the protective dhāraṇīs, honour the war gods and turn back enemies, mend paths, make clay votive images (ཚ་ཚ, tsha tsha) and give a feast to those who cannot repay it
reading.Harsh.COMBINED_NINE={0} It is the combined nine-multiple, in which an aspect of your birth year reaches the tomb of its element.
reading.Harsh.TOMB.remedy=be drawn out of the tomb, offer provisions at the tombs and seal their mouth; make the great rites that ransom death, and take up the profound rites that help
reading.MewaObstacle.SKY_DOOR=It falls on the mewa's sky door, the six-white for a man and the one-white for a woman: a plague may come down from the sky. Swear no oaths, and beware of lightning and the hearth.
reading.MewaObstacle.SKY_DOOR.remedy=close the sky door with its rite
reading.MewaObstacle.EARTH_DOOR=It falls on the mewa's earth door, the two-black for a man and the four-green for a woman: spirits of ruin rise, and harm comes from low ground. Lay no foundations and dig no earth.
reading.MewaObstacle.EARTH_DOOR.remedy=close the earth door with its rite
