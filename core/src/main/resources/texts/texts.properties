reading.MatchHidden={0} The hidden (ཁུག་པ, khug pa) sets the mewas of each aspect of husband and wife on nine wheels, each mewa standing for its trigram, a man's five-yellow counted as the two-black and a woman's as the seven-red.
reading.MatchDeepHidden={0} The deeper hidden (ཡང་ཁུག, yang khug) keeps the man's mewas and draws the woman's, one and two, three and nine, four and eight to each other: the life force tells how long they stay together, the body illness and children, destiny food and wealth, and the luck people's goodwill.
reading.MatchHidden.GNAM_SMAN=The two mewas fall on the wheel of the sky goddess (གནམ་སྨན, gnam sman), one of the first three, like the sun rising in a cloudless sky: the two are at ease, end well and stay long together; harmful spirits cannot strike them, and they have many children.
reading.MatchHidden.SROG_TSHO=The two mewas fall on the wheel of sustaining life (སྲོག་འཚོ, srog 'tsho), one of the first three, like the sun rising in a cloudless sky: life is long and illness rare, harmful spirits keep away, and the household grows in number.
reading.MatchHidden.DPAL_BSKYED=The two mewas fall on the wheel of increasing glory (དཔལ་བསྐྱེད, dpal bskyed), one of the first three, like the sun rising in a cloudless sky: glory grows, the children are loving, wealth increases, illness is rare, and the house is strong and rich.
reading.MatchHidden.PHYWA_LON=The two mewas are one, nine, eight, seven or six, and fall on the wheel of fortune gained (ཕྱྭ་ལོན, phywa lon), like the sun between clouds: life is long, wealth and goods increase, gods and people are kind, the children are middling, and wishes are fulfilled.
reading.MatchHidden.PHYWA_MNYAM=The two mewas are one, one, two, three or four, meeting within, and fall on the wheel of equal fortune (ཕྱྭ་མཉམ, phywa mnyam), like the sun between clouds: wealth is found by seeking it.
reading.MatchHidden.PHYWA_MNYAM.remedy=make offerings to the goddesses of the land (སྨན་མོ, sman mo) and to a good local god (ཡུལ་ལྷ, yul lha)
reading.MatchHidden.GNOD_PA=The two mewas fall on the wheel of harm (གནོད་པ, gnod pa), like the sun between clouds, and it goes badly: losses of wealth are great and they are beggars at last; children are few, friends leave, and burdens too heavy to bear come.
reading.MatchHidden.GNOD_PA.remedy=five priests of clans not akin to the couple gather auspicious substances and call prosperity; a fierce turning back goes well
reading.MatchHidden.DRE_LNGA=The two mewas fall on the wheel of the five demons (འདྲེ་ལྔ, 'dre lnga), one of the last three, like frost on the ground: demons and harmful spirits have entered for good; the line ends, food and wealth are lost, many die, and lawsuits and blame come without end.
reading.MatchHidden.DRE_LNGA.remedy=carry butter lamps, as many as the years of age, to a holy place, and strive in the rites that raise merit
reading.MatchHidden.BDUD_GCOD=The two mewas fall on the wheel of the demon's cut (བདུད་གཅོད, bdud gcod), one of the last three, like frost on the ground: the husband dies early, illness never leaves, goods do not gather, and the woman is always in grief.
reading.MatchHidden.BDUD_GCOD.remedy=turn back the enemies, make the enemies' thread-cross (མདོས, mdos) and press them down; stamping a thousand clay votive images (ཚ་ཚ, tsha tsha) helps
reading.MatchHidden.LUS_CHAD=The two mewas fall on the wheel of the body cut (ལུས་ཆད, lus chad), one of the last three, like frost on the ground: destiny falls away from beneath them, enemies do harm, lawsuits and punishment come, illness never leaves, and nothing succeeds.
reading.MatchHidden.LUS_CHAD.remedy=press down and turn back the enemies, and strive in the means that mend existence and raise merit
reading.MatchSiblings={0} The siblings' number (སྤུན་གྲངས, spun grangs) counts each spouse's life force, body, destiny, luck and birth mewa by their elements, wood one pebble, earth two, water three, fire four and iron five, and sets the two sums against each other.
reading.MatchSiblings.EQUAL=Man and woman count the same number of pebbles: more and fewer even, the siblings' number goes well.
reading.MatchSiblings.MAN=The man counts more pebbles than the woman, and in the siblings' number the man wins.
reading.MatchSiblings.WOMAN=The woman counts more pebbles than the man, and in the siblings' number the man is defeated.
reading.MatchSiblings.WOMAN.remedy=hang the wheel of Mañjuśrī (འཇམ་དབྱངས, 'jam dbyangs) on the man
reading.MatchSiblings.AGREE=The two sums together come to an even number, and the siblings' number agrees: each holds to the other's mind and has gone into the other's heart; they quarrel little and their losses are small.
reading.MatchSiblings.DISAGREE=The two sums together come to an odd number, and the siblings' number disagrees: they always quarrel over nothing, and those who quarrel by day and are loving at night come to great resentment at last.
reading.MatchSiblings.DISAGREE.remedy=recite the scriptures of the Victor's former lives (སྐྱེས་རབས, skyes rabs)
reading.BadYearPebble={0} The bad years for marriage are not set pair by pair but read once for the couple, with one deciding pebble (བཏང་གཅོད, btang gcod): black when both are born in them, speckled when one is, white when neither is.
reading.BadYearPebble.BLACK=Man and woman are both born in bad years for marriage, and the deciding pebble is black: it goes badly.
reading.BadYearPebble.SPECKLED_WOMAN=Of the two, only the woman is born in a bad year for marriage, and the deciding pebble is speckled; yet a bad year of the woman's above all goes badly.
reading.BadYearPebble.SPECKLED_MAN=Of the two, only the man is born in a bad year for marriage, and the deciding pebble is speckled.
reading.BadYearPebble.WHITE=Neither man nor woman is born in a bad year for marriage, and the deciding pebble is white.
reading.SpouseKind={0} Each of the four aspects of the single match makes a kind of wife, in three grades, the best, the middling and the last; the match is then judged from them in general.
reading.SpouseKind.KARMA=In these aspects the woman is a wife of karma (ལས་ཀྱི་ཆུང་མ, las kyi chung ma), the best kind: the two meet as mother and son, or as earth or water meeting itself.
reading.SpouseKind.KIN=In these aspects the woman is a wife of kin (གཉེན་གྱི་ཆུང་མ, gnyen gyi chung ma), the middling kind: the two meet as friends, or as fire, iron or wood meeting itself.
reading.SpouseKind.ENMITY=In these aspects the woman is a wife of enmity (དགྲའི་ཆུང་མ, dgra'i chung ma), the last kind: the two meet as enemies.
MatchWhole.KARMA=a wife of karma
MatchWhole.KIN=a wife of kin
MatchWhole.ENMITY=a wife of enmity
MatchWhole.MIXED=kinds mixed
reading.MatchTogether={0} The match is judged in general, not summed: the four kinds with the points below, the couple's one pebble over the bad years and the siblings' number. Those whose life or vitality is spent, the chronically ill, the poor, those in danger of ill speech and those of bad karma are bad even when the match agrees.
reading.MatchTogether.KARMA=All four aspects make a wife of karma (ལས་ཀྱི་ཆུང་མ, las kyi chung ma), the best kind, and the match stands in the best grade; the points below say where it still goes badly.
reading.MatchTogether.KIN=All four aspects make a wife of kin (གཉེན་གྱི་ཆུང་མ, gnyen gyi chung ma), the middling kind, and the match stands in the middling grade; the points below say where it goes well or badly.
reading.MatchTogether.ENMITY=All four aspects make a wife of enmity (དགྲའི་ཆུང་མ, dgra'i chung ma), the last kind, and the match stands in the last grade; it is answered by the rites the points below give.
reading.MatchTogether.MIXED=The aspects make wives of different kinds, the best, the middling and the last, and these are weighed together, in general, with the points below.
reading.MatchRiseDecline={0} Each spouse's life force (སྲོག, srog) is carried onto the other's birth year and counted through its twelve stages: falling on a bad stage, a sudden fright is sure to come, and otherwise it gives happiness.
reading.MatchRiseDecline.TAKING_BREATH=The life force falls on the stage of taking breath, a middling one; joined there, children are hard to raise.
reading.MatchRiseDecline.IN_THE_WOMB=The life force falls on the stage in the womb, a middling one; joined there, illness is much.
reading.MatchRiseDecline.BODY_COMPLETE=The life force falls on the stage of the body complete, one of the best; joined there, illnesses of many kinds come all the same.
reading.MatchRiseDecline.BIRTH=The life force falls on the birth stage, a middling one; joined there, the children live.
reading.MatchRiseDecline.BATHING=The life force falls on the bathing stage, one of the best; joined there, people are kind.
reading.MatchRiseDecline.DRESSING=The life force falls on the dressing stage, one of the best; joined there, wealth and food are plentiful.
reading.MatchRiseDecline.WORKING=The life force falls on the working stage, a middling one; joined there, fullness and emptiness swing widely.
reading.MatchRiseDecline.FLOURISHING=The life force falls on the flourishing stage, one of the best; joined there, it is good.
reading.MatchRiseDecline.DECLINE=The life force falls on the stage of decline, one of the bad; joined there, people are hostile.
reading.MatchRiseDecline.ILLNESS=The life force falls on the illness stage, one of the bad; joined there, illnesses of many kinds come.
reading.MatchRiseDecline.DEATH=The life force falls on the death stage, one of the bad; joined there, deaths come.
reading.MatchRiseDecline.ENTERING_THE_TOMB=The life force falls on the tomb stage, one of the bad; joined there, it is bad.
reading.MatchParentStage={0} The breath is taken from each spouse's father's year and counted onto the spouse's own year, the outer way from the father's year animal and the secret way from his life force (སྲོག, srog); the mothers are counted the same way, the woman's side the main one.
reading.MatchParentStage.FATHER.GOOD=Counted from the father, the stage falls among the good six: joined within them, it is good, auspicious and happy, and many children come.
reading.MatchParentStage.FATHER.BAD=Counted from the father, the stage falls among the bad six: joined within them, it is bad, and at last the line is in danger of ending.
reading.MatchParentStage.FATHER.BAD.remedy=recite the Great Thousand that Destroys (སྟོང་ཆེན་རབ་འཇོམས, stong chen rab 'joms) and make the god Brahmā's thread-cross of existence (སྲིད་མདོས, srid mdos)
reading.MatchParentStage.MOTHER.GOOD=Counted from the mother, the stage is in accord: children come in a number that accords.
reading.MatchParentStage.MOTHER.BAD=Counted from the mother, the stage is not in accord: the children are of no help.
reading.MatchParentStage.MOTHER.BAD.remedy=recite the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor)
reading.RiseDecline={0} Each aspect's stage of rise and decline (དར་གུད, dar gud), counted onto one's own birth, is one of six bright and six dark, each with its name for that aspect.
reading.RiseDecline.VITALITY.FLOURISHING=In the flourishing stage, the life force has the great treasure (གཏེར་ཆེན, gter chen). It is the treasure of life. Its image is a well-grown tree.
reading.RiseDecline.BODY.FLOURISHING=In the flourishing stage, the body has the great treasure (གཏེར་ཆེན, gter chen). It is the treasure of the body. Its image is ten goats coming out onto the pass.
reading.RiseDecline.DESTINY.FLOURISHING=In the flourishing stage, destiny has the great treasure (གཏེར་ཆེན, gter chen). It is the treasure of food and wealth: power and riches come together. Its image is a banner tied to a spear.
reading.RiseDecline.LUCK.FLOURISHING=In the flourishing stage, the luck has the great treasure (གཏེར་ཆེན, gter chen). It is the treasure of contentment: one is the hope of all, and every need is met. Its image is gold adorned with turquoise.
reading.RiseDecline.VITALITY.DRESSING=In the dressing stage, the life force has withstanding (སོ་ཐུབ, so thub). The life force is not cut. Its image is life like a great river.
reading.RiseDecline.BODY.DRESSING=In the dressing stage, the body has withstanding (སོ་ཐུབ, so thub). Illnesses are cleared. Its image is a face like a flower in bloom.
reading.RiseDecline.DESTINY.DRESSING=In the dressing stage, destiny has withstanding (སོ་ཐུབ, so thub). One enjoys a treasure. Its image is wealth like the ocean's waves. It is one of the six bright suns.
reading.RiseDecline.LUCK.DRESSING=In the dressing stage, the luck has withstanding (སོ་ཐུབ, so thub). Contentment grows. Its image is a net of gold. It is one of the six bright suns.
reading.RiseDecline.VITALITY.BIRTH=In the birth stage, the life force has enjoyment (ལོངས་སྤྱོད, longs spyod). The life force is not cut. Its image is a mountain, unchanging and steady.
reading.RiseDecline.BODY.BIRTH=In the birth stage, the body has enjoyment (ལོངས་སྤྱོད, longs spyod). Enjoyments grow. Its image is a wish-granting tree grown full. It is one of the six bright suns.
reading.RiseDecline.DESTINY.BIRTH=In the birth stage, destiny has enjoyment (ལོངས་སྤྱོད, longs spyod). Goods and possessions increase. It is one of the six bright suns.
reading.RiseDecline.LUCK.BIRTH=In the birth stage, the luck has enjoyment (ལོངས་སྤྱོད, longs spyod). Contentment gathers. Its image is a tiger's bright stripes. It is one of the six bright suns.
reading.RiseDecline.VITALITY.BODY_COMPLETE=In the stage of the body complete, the life force has happiness (བདེ་ལྡན, bde ldan). Life and the life force are firm. It is one of the six bright suns.
reading.RiseDecline.BODY.BODY_COMPLETE=In the stage of the body complete, the body has happiness (བདེ་ལྡན, bde ldan). The body has great strength. It is one of the six bright suns.
reading.RiseDecline.DESTINY.BODY_COMPLETE=In the stage of the body complete, destiny has happiness (བདེ་ལྡན, bde ldan). Enjoyments increase. It is one of the six bright suns.
reading.RiseDecline.LUCK.BODY_COMPLETE=In the stage of the body complete, the luck has happiness (བདེ་ལྡན, bde ldan). One stands steady in wisdom. It is one of the six bright suns.
reading.RiseDecline.VITALITY.BATHING=In the bathing stage, the life force has wishes fulfilled (བསམ་འགྲུབ, bsam 'grub). Life is not shortened. Its image is beans of iron, rolled hard.
reading.RiseDecline.BODY.BATHING=In the bathing stage, the body has wishes fulfilled (བསམ་འགྲུབ, bsam 'grub). The body ripens. Its image is a lotus in full bloom.
reading.RiseDecline.DESTINY.BATHING=In the bathing stage, destiny has wishes fulfilled (བསམ་འགྲུབ, bsam 'grub). What one plans is achieved, and the works of skilful means are done.
reading.RiseDecline.LUCK.BATHING=In the bathing stage, the luck has wishes fulfilled (བསམ་འགྲུབ, bsam 'grub). Contentment is gained. Its image is one who handles precious gold.
reading.RiseDecline.VITALITY.WORKING=In the working stage, the life force has the long line (བརྒྱུད་རིང, brgyud ring). The line of forefathers and grandchildren runs long. Its image is a great river flowing.
reading.RiseDecline.BODY.WORKING=In the working stage, the body has the long line (བརྒྱུད་རིང, brgyud ring). Children and the lineage increase. Its image is a tree with spreading branches.
reading.RiseDecline.DESTINY.WORKING=In the working stage, destiny has the long line (བརྒྱུད་རིང, brgyud ring). The lineage keeps its wealth, and the children's wings spread. Its image is one who reaches an island of jewels.
reading.RiseDecline.LUCK.WORKING=In the working stage, the luck has the long line (བརྒྱུད་རིང, brgyud ring). Contentment increases, and one steers the realm as a chariot is steered. Its image is a tent of wisdom pitched.
reading.RiseDecline.VITALITY.TAKING_BREATH=In the stage of taking breath, the life force has the share spent (སྐལ་ཟད, skal zad). Life is cut short in haste. Its image is a cluster of flowers crushed.
reading.RiseDecline.BODY.TAKING_BREATH=In the stage of taking breath, the body has the share spent (སྐལ་ཟད, skal zad). Suffering is much. Its image is flowers killed by frost.
reading.RiseDecline.DESTINY.TAKING_BREATH=In the stage of taking breath, destiny has the share spent (སྐལ་ཟད, skal zad). There is no share, and enjoyments are small. It is one of the six dark sons.
reading.RiseDecline.LUCK.TAKING_BREATH=In the stage of taking breath, the luck has the share spent (སྐལ་ཟད, skal zad). Contentment is lost. Its image is a blind man who lets go of the ox's tail.
reading.RiseDecline.VITALITY.IN_THE_WOMB=In the stage in the womb, the life force has great misfortune (བྱུར་ཆེན, byur chen). Life is short. Its image is one thrown from a steep peak.
reading.RiseDecline.BODY.IN_THE_WOMB=In the stage in the womb, the body has great misfortune (བྱུར་ཆེན, byur chen). Illness takes hold. Its image is one carried off by a rākṣasa from a cave on the pass.
reading.RiseDecline.DESTINY.IN_THE_WOMB=In the stage in the womb, destiny has great misfortune (བྱུར་ཆེན, byur chen). One is parted from wealth. Its image is a bee at the year's end.
reading.RiseDecline.LUCK.IN_THE_WOMB=In the stage in the womb, the luck has great misfortune (བྱུར་ཆེན, byur chen). People turn their words against one. Its image is a beetle wrapped in wool.
reading.RiseDecline.VITALITY.DECLINE=In the stage of decline, the life force has parting (བྱེ་བྲལ, bye bral). The body and the life force part. It is one of the six dark sons.
reading.RiseDecline.BODY.DECLINE=In the stage of decline, the body has parting (བྱེ་བྲལ, bye bral). Suffering is much. Its image is a fish brought out onto dry land.
reading.RiseDecline.DESTINY.DECLINE=In the stage of decline, destiny has parting (བྱེ་བྲལ, bye bral). Wealth is swept away. Its image is grain picked up by birds. It is one of the six dark sons.
reading.RiseDecline.LUCK.DECLINE=In the stage of decline, the luck has parting (བྱེ་བྲལ, bye bral). The means of one's work are lost. It is one of the six dark sons.
reading.RiseDecline.VITALITY.ILLNESS=In the illness stage, the life force has ruin and lawsuits (འཕུང་གྱོད, 'phung gyod). One cuts one's own life. Its image is one's own judge who overturns one.
reading.RiseDecline.BODY.ILLNESS=In the illness stage, the body has ruin and lawsuits (འཕུང་གྱོད, 'phung gyod). Chronic illness takes hold. Its image is a beggar held to a reckoning in gold.
reading.RiseDecline.DESTINY.ILLNESS=In the illness stage, destiny has ruin and lawsuits (འཕུང་གྱོད, 'phung gyod). Ruin falls on oneself. Its image is a hunting dog that turns on its master.
reading.RiseDecline.LUCK.ILLNESS=In the illness stage, the luck has ruin and lawsuits (འཕུང་གྱོད, 'phung gyod). What one held dear goes astray, and kin turn enemies. Its image is a pool of water under a cave.
reading.RiseDecline.VITALITY.DEATH=In the death stage, the life force has fortune lost (ཕྱྭ་ཉམས, phywa nyams). Life is scattered by the wind. Its image is a vajra of ice broken.
reading.RiseDecline.BODY.DEATH=In the death stage, the body has fortune lost (ཕྱྭ་ཉམས, phywa nyams). The body's strength is lost. Its image is colour scorched by the sun.
reading.RiseDecline.DESTINY.DEATH=In the death stage, destiny has fortune lost (ཕྱྭ་ཉམས, phywa nyams). Wealth is carried off as by the wind. Its image is a city of the gandharvas (དྲི་ཟ, dri za) seen.
reading.RiseDecline.LUCK.DEATH=In the death stage, the luck has fortune lost (ཕྱྭ་ཉམས, phywa nyams). Contentment is lost. Its image is a rainbow that rises and fades.
reading.RiseDecline.VITALITY.ENTERING_THE_TOMB=In the tomb stage, the life force has the line cut (རྒྱུན་ཆད, rgyun chad). Obstacles come. Its image is a tree whose roots have rotted.
reading.RiseDecline.BODY.ENTERING_THE_TOMB=In the tomb stage, the body has the line cut (རྒྱུན་ཆད, rgyun chad). The face loses its lustre. Its image is a dog's corpse thrown into an ash pit.
reading.RiseDecline.DESTINY.ENTERING_THE_TOMB=In the tomb stage, destiny has the line cut (རྒྱུན་ཆད, rgyun chad). Wealth and goods are destroyed. Its image is white fat set on a flame.
reading.RiseDecline.LUCK.ENTERING_THE_TOMB=In the tomb stage, the luck has the line cut (རྒྱུན་ཆད, rgyun chad). The work comes to nothing. Its image is the sun set in the sky.
RaisingMonth.FATHER=heavy for the father
RaisingMonth.MOTHER=heavy for the mother
RaisingMonth.OWN=heavy for the child
RaisingMonth.GOOD=a flourishing month
RaisingDay.HARD=hard to raise
RaisingDay.EASY=easy to raise
reading.RaisingMonth={0} The child's life force (སྲོག, srog), counted onto the birth month, shows on whom the month bears: its tomb on the father, its womb on the mother, its illness and death on the child.
reading.RaisingMonth.FATHER=Born in the month where the child's life force enters its tomb, the child is born in the father's month, which bears hard on the father. A child of a mouse year born in a dragon month is one such.
reading.RaisingMonth.MOTHER=Born in the month where the child's life force dwells in the womb, the child is born in the mother's month, which bears hard on the mother. A child of a mouse year born in a horse month is one such.
reading.RaisingMonth.OWN=Born in the month of the child's life force's illness or death, the child is born in its own month, which goes badly for the child itself. A child of a mouse year born in a tiger or hare month is one such.
reading.RaisingMonth.GOOD=Born in the month where the child's life force flourishes, the child is born in a good month: every flourishing month is good for the birth.
reading.RaisingDay={0} The birth day's animal, set against the child's year animal by their elements, shows whether the child is hard or easy to raise.
reading.RaisingDay.HARD=Born on a day whose element overcomes that of the child's year animal, as an ox, sheep, dog or dragon born on a tiger or hare day, the child is hard to raise.
reading.RaisingDay.EASY=Born on a day whose element begets that of the child's year animal, as a horse or snake born on a tiger or hare day, the birth goes well and the child is easy to raise.
PreciousPebble.YEAR=the king's pebble
PreciousPebble.MONTH=the minister's pebble
PreciousPebble.DAY=the soldier's pebble
PreciousPebble.HOUR=the weapon's pebble
reading.PreciousPebble={0} The four precious pebbles (གཅེས་རྡེལ, gces rdel) take the birth's year as king, its month as minister, its day as soldier and its hour as weapon; each is white or black by its animal, with no partner to fight.
reading.PreciousPebble.YEAR.WHITE=The king's pebble, that of the birth year, is white: the king's word does not reproach one. A man prevails in the gathering, and a woman hears herself well spoken of.
reading.PreciousPebble.YEAR.BLACK=The king's pebble, that of the birth year, is black: the king's punishment strikes. Joy and sorrow are many, sorrow the greater part, and illness never leaves the body.
reading.PreciousPebble.MONTH.WHITE=The minister's pebble, that of the birth month, is white, so one does not stray from the company of the ministers.
reading.PreciousPebble.MONTH.BLACK=The minister's pebble, that of the birth month, is black: one loves the high and hates the low, and quarrels with enemies without end.
reading.PreciousPebble.DAY.WHITE=The soldier's pebble, that of the birth day, is white: one's forces spread on every side, illness is slight, life meets no obstacle, and no spirit or demon harms.
reading.PreciousPebble.DAY.BLACK=The soldier's pebble, that of the birth day, is black: disputes with people come, one pays or receives the price of a thousand men, and slander never stops.
reading.PreciousPebble.HOUR.WHITE=The weapon's pebble, that of the birth hour, is white: what people and pebbles portend is good, and people and wealth increase on every side.
reading.PreciousPebble.HOUR.BLACK=The weapon's pebble, that of the birth hour, is black: the weapon is eaten by rust, the spear of glory broken at the middle, and it bodes ill for all people and wealth.
UnchangingLuck.PARENT_YEAR=the parent's year
UnchangingLuck.MOTHER_LOG_MEN=the mother's progressed sign
UnchangingLuck.TRIGRAM=the natal trigram
UnchangingLuck.MEWA=the natal mewa
UnchangingLuck.MONTH=the birth month
HundredKin.OWN=own
HundredKin.MOTHER=mother
HundredKin.SON=son
HundredKin.FRIEND=friend
HundredKin.ENEMY=enemy
reading.HundredPebble={0} Each aspect's own element and its mother, son, friend and enemy meet the five unchanging lucks (མི་འགྱུར་ཀླུང, mi 'gyur klung) in five pebbles, and the greater of the five is the deciding pebble (བཏང་གཅོད, btang gcod).
reading.HundredPebble.VITALITY.OWN.WHITE=The vitality's own pebble white is called a jewel treasury of life: a child easy to raise, a long life in old age, and it weighs on the father and all the paternal uncles.
reading.HundredPebble.VITALITY.MOTHER.WHITE=The vitality's mother pebble white: one comes of a line in which the father and the paternal uncles thrive, and one's backing does not pass to others.
reading.HundredPebble.VITALITY.SON.WHITE=The vitality's son pebble white: a long life, the stake that holds life planted firm, and sons are born.
reading.HundredPebble.VITALITY.FRIEND.WHITE=The vitality's friend pebble white: wealth in hoofed herds thrives.
reading.HundredPebble.VITALITY.ENEMY.WHITE=The vitality's enemy pebble white, the bad one: beware of wasting and old illness, and bad food and dropsy coming.
reading.HundredPebble.VITALITY.OWN.BLACK=The vitality's own pebble black: a child hard to raise, and a short life.
reading.HundredPebble.VITALITY.OWN.BLACK.remedy=practise for long life, recite the long-life dhāraṇī and perform the long-life rite
reading.HundredPebble.VITALITY.MOTHER.BLACK=The vitality's mother pebble black: the line of the father and the paternal uncles is cut and their door left empty, and their fortunes rise and fall greatly.
reading.HundredPebble.VITALITY.SON.BLACK=The vitality's son pebble black: the stake that holds the la, the life-spirit (བླ, bla), and life is pulled out, and the herds do not thrive.
reading.HundredPebble.VITALITY.FRIEND.BLACK=The vitality's friend pebble black: many undertakings and a restless mind, unhappy to stay and glad to go; its image is feet turned by a wheel of wind.
reading.HundredPebble.VITALITY.ENEMY.BLACK=The vitality's enemy pebble black, the good one: no harm from the harmful spirits of the dead (སྲི, sri) of the old, the young or the grown.
reading.HundredPebble.BODY.OWN.WHITE=The body's own pebble white: the body thrives and stands high, fair of form and face, and the home and its land are held.
reading.HundredPebble.BODY.MOTHER.WHITE=The body's mother pebble white: one stays long in the company of the maternal aunts.
reading.HundredPebble.BODY.SON.WHITE=The body's son pebble white: sons and daughters are easy to raise.
reading.HundredPebble.BODY.FRIEND.WHITE=The body's friend pebble white: a man meets an older woman, and a woman is well suited to a man.
reading.HundredPebble.BODY.ENEMY.WHITE=The body's enemy pebble white, the bad one: much illness and flawed senses, and death comes of indigestion, a tumour or dropsy.
reading.HundredPebble.BODY.OWN.BLACK=The body's own pebble black: much illness, and the senses flawed.
reading.HundredPebble.BODY.OWN.BLACK.remedy=change and generate the body anew, and wear a protective amulet
reading.HundredPebble.BODY.MOTHER.BLACK=The body's mother pebble black: one's time in the company of the maternal aunts is short.
reading.HundredPebble.BODY.SON.BLACK=The body's son pebble black: sons and daughters are hard to raise.
reading.HundredPebble.BODY.FRIEND.BLACK=The body's friend pebble black: its image is a corpse left in a charnel ground, an old mother fallen on the plain.
reading.HundredPebble.BODY.ENEMY.BLACK=The body's enemy pebble black, the good one: the body is free of illness and wasting.
reading.HundredPebble.DESTINY.OWN.WHITE=Destiny's own pebble white: great enjoyments, and livestock, food, wealth and every wish increase.
reading.HundredPebble.DESTINY.MOTHER.WHITE=Destiny's mother pebble white: one comes of a line in which the maternal uncle's kin thrive, long in the company of uncles and nephews.
reading.HundredPebble.DESTINY.SON.WHITE=Destiny's son pebble white: a daughter wiser than her mother is born, and the daughters find many friends.
reading.HundredPebble.DESTINY.FRIEND.WHITE=Destiny's friend pebble white: good harvests, and servants, men and women, who are loving.
reading.HundredPebble.DESTINY.ENEMY.WHITE=Destiny's enemy pebble white, the bad one: wealth declines and slips into enemies' hands.
reading.HundredPebble.DESTINY.OWN.BLACK=Destiny's own pebble black: spending to no purpose on repaying the living, and great losses of wealth and herds in old age.
reading.HundredPebble.DESTINY.OWN.BLACK.remedy=keep a home in two places
reading.HundredPebble.DESTINY.MOTHER.BLACK=Destiny's mother pebble black: goats, dogs, horses and donkeys run to a single line, and the maternal uncle's kin rise and fall greatly.
reading.HundredPebble.DESTINY.SON.BLACK=Destiny's son pebble black: of daughters, only a clever one or so comes.
reading.HundredPebble.DESTINY.FRIEND.BLACK=Destiny's friend pebble black: the crops are good in general but the harvest does not come in, and sons-in-law and nephews come from near and far.
reading.HundredPebble.DESTINY.ENEMY.BLACK=Destiny's enemy pebble black, the good one: wealth does not slip into enemies' hands, and what one gathers one enjoys oneself.
reading.HundredPebble.LUCK.OWN.WHITE=The luck's own pebble white: the lamas and the noble forebears are kind, and the war gods (དགྲ་ལྷ, dgra lha) and the protectors (སྲུང་མ, srung ma) go before one.
reading.HundredPebble.LUCK.MOTHER.WHITE=The luck's mother pebble white: lords and ministers protect one, and others come to one with requests.
reading.HundredPebble.LUCK.SON.WHITE=The luck's son pebble white: horses and donkeys increase.
reading.HundredPebble.LUCK.FRIEND.WHITE=The luck's friend pebble white: one is like a minister skilled in means.
reading.HundredPebble.LUCK.ENEMY.WHITE=The luck's enemy pebble white, the bad one: no satisfaction in the work one does, and eating never fills.
reading.HundredPebble.LUCK.OWN.BLACK=The luck's own pebble black: little credit even for one's own deeds, and ill-wishers within the paternal kin.
reading.HundredPebble.LUCK.OWN.BLACK.remedy=hold a strong place
reading.HundredPebble.LUCK.MOTHER.BLACK=The luck's mother pebble black: little honour from teachers and lords; kindness is not repaid, and one has to seek backing.
reading.HundredPebble.LUCK.SON.BLACK=The luck's son pebble black: its image is the sun hidden by clouds, a vulture fallen on the plain.
reading.HundredPebble.LUCK.FRIEND.BLACK=The luck's friend pebble black: horses and donkeys do not increase, and the companion of one's life has little standing.
reading.HundredPebble.LUCK.ENEMY.BLACK=The luck's enemy pebble black, the good one: one is not pressed under others' yoke.
BirthWhole.GOOD=weighs good
BirthWhole.BAD=weighs bad
BirthWhole.EVEN=weighs even
reading.BirthTogether={0} No one or two results decide a birth: the good and the bad are weighed by force and number throughout, the rites of the moment can turn the bad, and passing conditions the good.
reading.BirthTogether.GOOD=The good deciding pebbles of the hundred are more than the bad, so by force and number the birth weighs good.
reading.BirthTogether.BAD=The bad deciding pebbles of the hundred are more than the good, so by force and number the birth weighs bad.
reading.BirthTogether.EVEN=The good and the bad deciding pebbles of the hundred are even, so by force and number the birth weighs middling.
reading.BirthSet={0} A set reads the deciding pebbles together across the four aspects, and outweighs the single readings it joins.
reading.BirthSet.MOTHERS_WHITE=The four mothers' deciding pebbles, of vitality, body, destiny and luck, are white: the parents flourish and the noble line continues.
reading.BirthSet.MOTHERS_BLACK=The four mothers' deciding pebbles are black: the forefathers decline, the father's kindness is small, and support has to be sought from others.
reading.BirthSet.MOTHERS_HALF=The four mothers' deciding pebbles are half white and half black: the forefathers know joy and sorrow, and their rise and decline are great.
reading.BirthSet.MANY_WHITE=Most of the twenty deciding pebbles are white: others carry one, works are accomplished, and one understands all of it oneself.
reading.BirthSet.MANY_BLACK=Most of the twenty deciding pebbles are black: merit is small, and one has to serve others.
reading.BirthSet.MANY_BLACK.remedy=rely on the Dharma
reading.BirthSet.SONS_WHITE=The four sons' deciding pebbles are white: a son better than his father comes, who holds the forefathers' land and castle.
reading.BirthSet.SONS_BLACK=The four sons' deciding pebbles are black: the children are hard to raise and do not come of age.
reading.BirthSet.SONS_MIXED=The four sons' deciding pebbles are mixed: of the children, half live and half do not.
reading.BirthSet.FRIENDS_WHITE=The four friends' deciding pebbles are white: standing and a great share of food; its image is the tiger's stripes.
reading.BirthSet.FRIENDS_BLACK=The four friends' deciding pebbles are black: wealth rises and falls, with great losses.
reading.BirthSet.FRIENDS_MIXED=The four friends' deciding pebbles are mixed: what is there is not real, what is not there comes, and wealth is middling.
reading.BirthSet.VITALITY_RISES=Vitality's own deciding pebble is white and its enemy's black: one's own rises while the enemy declines, which is good.
reading.BirthSet.VITALITY_FALLS=Vitality's own deciding pebble is black and its enemy's white: one's own declines while the enemy rises, and at last one dies by the blade.
reading.BirthSet.DESTINY_RISES=Destiny's own deciding pebble is white and its enemy's black: one's own rises while the enemy declines, which is good.
reading.BirthSet.DESTINY_FALLS=Destiny's own deciding pebble is black and its enemy's white: one's own declines while the enemy rises, which is bad.
reading.BirthSet.LUCK_RISES=The luck's own deciding pebble is white and its enemy's black: one's own rises while the enemy declines, which is good.
reading.BirthSet.LUCK_FALLS=The luck's own deciding pebble is black and its enemy's white: one's own declines while the enemy rises, which is bad.
reading.BirthBoard=The board is read whole by where white and black lie. Many white in the four continents' pattern is happiness: above, in the first part of life; in the middle, in power and wealth; below, in old age. Many black in squares ends the line: above, joy and sorrow; in the middle, wealth useless when needed; below, losses.
BirthSet.MOTHERS_WHITE=the four mothers white
BirthSet.MOTHERS_BLACK=the four mothers black
BirthSet.MOTHERS_HALF=the four mothers half and half
BirthSet.MANY_WHITE=many white
BirthSet.MANY_BLACK=many black
BirthSet.SONS_WHITE=the four sons white
BirthSet.SONS_BLACK=the four sons black
BirthSet.SONS_MIXED=the four sons mixed
BirthSet.FRIENDS_WHITE=the four friends white
BirthSet.FRIENDS_BLACK=the four friends black
BirthSet.FRIENDS_MIXED=the four friends mixed
BirthSet.VITALITY_RISES=vitality rising, its enemy declining
BirthSet.VITALITY_FALLS=vitality declining, its enemy rising
BirthSet.DESTINY_RISES=destiny rising, its enemy declining
BirthSet.DESTINY_FALLS=destiny declining, its enemy rising
BirthSet.LUCK_RISES=the luck rising, its enemy declining
BirthSet.LUCK_FALLS=the luck declining, its enemy rising
DeadRoot.DEATH_YEAR=the year of death
DeadRoot.LOG_MEN=the progressed sign
DeadRoot.TRIGRAM=the trigram
DeadRoot.SME_BA=the mewa
DeadRoot.SECTOR=the rise and decline
DeadRoot.MONTH=the month of death
DeadRoot.DATE=the day of death
DeadRoot.HOUR=the hour of death
DeadWhole.SPENT=the life spent
DeadWhole.UNTIMELY=an untimely death
reading.DeadPebble={0} The first examination of the reckoning for the dead (གཤིན་རྩིས, gshin rtsis) asks of each aspect's deciding pebble whether the time of death had come.
reading.DeadPebble.VITALITY.BLACK=Vitality's deciding pebble black: the post of life is broken and the wheel of life undone, the la, the life-spirit (བླ, bla), and the life were cut by a demon three years before, and the time of death had come; its image is a black bird hovering above and a black dog's teeth sunk in.
reading.DeadPebble.VITALITY.WHITE=Vitality's deciding pebble white: the time of death had not come. The god who goes before was deceived, and a black demon carried one off unnoticed; its image is the eye torn from the head, the heart from the body and the vein from the foot, none of them felt.
reading.DeadPebble.BODY.BLACK=The body's deciding pebble black: the body wished for the grave. Illness struck the illusory body as an axe strikes a wish-granting tree; half the body had entered the grave and half the life had slipped from fortune, and the time of death had come.
reading.DeadPebble.BODY.WHITE=The body's deciding pebble white: the body did not wish for the grave. One thought no axe, no sickle and no noose would come for the body's wish-granting tree; a demon seized the god's place, and one died unwilling to go to the grave.
reading.DeadPebble.DESTINY.BLACK=Destiny's deciding pebble black: the count of food was filled. What was in the mouth the tongue pushed out, what was at home went out at the door, the share of food and clothing ran out, and the time of death had come.
reading.DeadPebble.DESTINY.WHITE=Destiny's deciding pebble white: the count of food was not filled. The mouthful of food and the back's cover of clothes were not used up, standing and destiny not spent, yet the provisions were cut off at a stroke before the time of death.
reading.DeadPebble.LUCK.BLACK=The luck's deciding pebble black: the branch of the tree of the eight-petalled lotus is broken. The banner of merit has fallen, the merit gathered before is spent with no time to gather more, ill-wishers came from outside, and one died without power over it.
reading.DeadPebble.LUCK.WHITE=The luck's deciding pebble white: the branch was not broken. One thought fire could not burn it, water not carry it off and earth not rot it; a demon stole the merit unnoticed, and one died before the time had come.
reading.DeadWhole={0} The first examination is read whole by the pebbles: many black, the life ran out; many white, one died before it did.
reading.DeadWhole.SPENT=Most of the deciding pebbles are black: as earth ends in water and wood in fire, the life had run out, and a hundred physicians could not have helped one whose life is spent; the living have no cause to grieve.
reading.DeadWhole.UNTIMELY=Most of the deciding pebbles are white: like the sun and moon setting in the open sky and a flower carried off by frost, one not due to die was carried off suddenly by a harmful spirit, in return for a wrong act of the moment, before the life was spent.
reading.MomentTrigram={0} The trigram of the moment is counted from the date's own trigram at dawn, one for every three quarters of an hour, and shows the asker's house.
reading.MomentTrigram.LI=At the moment of the fire trigram (ལི, li) the house's door faces south or north; it has white horses or ruddy people, and something red brought in from outside brings harm. Its woman is ruddy and strong, red-veined of eye and close-toothed, ill-marked and sharp of tongue.
reading.MomentTrigram.LI.spirits=the theurang (ཐེའུ་བྲང, the'u brang) and the gongpo spirits (འགོང་པོ, 'gong po)
reading.MomentTrigram.LI.remedy=cut off the gyalpo (རྒྱལ་པོ, rgyal po), the gongpo and the theurang, send a gyalpo thread-cross (རྒྱལ་མདོས, rgyal mdos) and the theurang's ransom, and bind their mouths
reading.MomentTrigram.KHON=One who comes at the moment of the earth trigram (ཁོན, khon) has a household of two or four, fond of meat, with great rises and falls; the door faces south or north, horses, people and livestock are speckled or blazed, and something speckled brought from outside brings harm. Its women are yellowish, and an old woman's senses fail.
reading.MomentTrigram.KHON.remedy=press down the female spirits and cut them off
reading.MomentTrigram.DWA=One who comes at the moment of the lake trigram (དྭ, dwa) has a door facing west or north and horses, donkeys and cows with white blazes. Its woman is fair with a birthmark, short-tempered, without father or brother.
reading.MomentTrigram.KHEN=At the moment of the sky trigram (ཁེན, khen) the door faces north-west or south-west, and horses, dogs and cattle are speckled. Its woman is bluish of complexion, lame of foot or crippled of hand, ill-minded and fierce, quarrelsome and always busy.
reading.MomentTrigram.KHAM=One who comes at the moment of the water trigram (ཁམ, kham) has a door facing north or west, and horses, dogs and cows marked black; something black from outside brings harm. Its woman is dark, large and quick of step, a third wife whose child has died, noisy and careless of cleanliness, courteous and fond of beer.
reading.MomentTrigram.GIN=One who comes at the moment of the mountain trigram (གིན, gin) has a door facing west or north, and horses, dogs and cows speckled black; black livestock from outside bring harm. Its woman has fine hair and a full body, her father and brothers do not last, the household is three or one, good-hearted and kind to those around.
reading.MomentTrigram.ZIN=At the moment of the thunder trigram (ཟིན, zin) the door faces east or north, and horses, dogs and cows are marked blue. Its woman is long-toothed and short-tempered, fair of face; the maternal uncle's line is cut, there are one or three brothers, and a man who loves his uncle and father.
reading.MomentTrigram.ZON=At the moment of the wind trigram (ཟོན, zon) the door faces south-east or south. Its woman is parted from her husband or widowed, the livestock are surely speckled, the line carries madness or fits, the household is two or four, and the family is loud.
reading.MomentMewa={0} The mewa (སྨེ་བ, sme ba) of the moment is counted from the date's own at dawn, one for every two thirds of an hour, and is known as a person, as wealth and as a spirit.
reading.MomentMewa.1=At the moment of 1 white the one concerned is someone who has left his country, a guest, and the wealth meant is sheep and goats.
reading.MomentMewa.1.spirits=the theurang (ཐེའུ་བྲང, the'u brang)
reading.MomentMewa.2=At the moment of 2 black the one concerned is a widow, of a line cut off, and the wealth meant is dzo (མཛོ, mdzo).
reading.MomentMewa.2.spirits=the demons (བདུད, bdud)
reading.MomentMewa.3=At the moment of 3 blue the one concerned is a young woman, and the wealth meant is cattle.
reading.MomentMewa.3.spirits=the mu (དམུ, dmu) and the sen (བསེན, bsen)
reading.MomentMewa.4=At the moment of 4 green the one concerned is someone sick with a nāga illness, and the wealth meant is dry goods.
reading.MomentMewa.4.spirits=the nāgas (ཀླུ, klu)
reading.MomentMewa.5=At the moment of 5 yellow the one concerned is a king's man, and the wealth meant is the things of offering.
reading.MomentMewa.5.spirits=the earth lords (ས་བདག, sa bdag)
reading.MomentMewa.6=At the moment of 6 white the one concerned is one of the common people, and the wealth meant is armour and fierce weapons.
reading.MomentMewa.6.spirits=the gods (ལྷ, lha)
reading.MomentMewa.7=At the moment of 7 red the one concerned is a Bonpo (བོན་པོ, bon po), and the wealth meant is silk and brocade.
reading.MomentMewa.7.spirits=the tsen (བཙན, btsan)
reading.MomentMewa.8=At the moment of 8 white the one concerned is of a lord's line, and the wealth meant is jewels and shining wealth.
reading.MomentMewa.8.spirits=the kordak (དཀོར་བདག, dkor bdag) and the gyalpo (རྒྱལ་པོ, rgyal po)
reading.MomentMewa.9=At the moment of 9 red the one concerned is a single man or woman, and the wealth meant is livestock.
reading.MomentMewa.9.spirits=the dark purple mamo (མ་མོ, ma mo)
reading.DeadMewa={0} The sixth test of the first examination asks of the dead's mewa (སྨེ་བ, sme ba) in the year of death whether the time of death had come.
reading.DeadMewa.TIME=The dead's mewa of the year fell on its small obstacles, of the house, the bed, the land or the royal gate: by the mewa the time of death had come.
reading.DeadMewa.NONE=The dead's mewa of the year fell on none of its four small obstacles: by the mewa the death came before its time.
reading.DeadCourse={0} The seventh test of the first examination reads the course of the years in the year of death.
reading.DeadCourse.TIME=In the year of death the course of the years fell on its obstacles, and the time of death had come; its image is the year's king giving his command, the month's minister his word, the day's soldier leading his army and the hour's weapon striking, as the wind of time fells the wish-granting tree.
# The dead's second examination, the reason the death met (ROADMAP R2p; WB vol. 2, ch. 29, pp. 57–58; the notes, p. 503; the regent's reply 148).
DeadTime.YEAR=year
DeadTime.MONTH=month
DeadTime.DAY=day
DeadTime.HOUR=hour
DeadCut.IRON_CUT=iron cut by fire
DeadCut.FIRE_CUT=fire cut by water
DeadCut.EARTH_CUT=earth cut by wood
DeadCut.WATER_CUT=water cut by earth
DeadCut.WOOD_CUT=wood cut by iron
DeadCut.FIRE_INNER=two fires met within
DeadCut.WOOD_INNER=two woods met within
DeadCut.WATER_INNER=two waters met within
DeadCut.IRON_INNER=two irons met within
DeadCut.EARTH_INNER=two earths met within
reading.DeadCause={0} The second examination asks what reason (ལེ་ལན, le lan) the death met. Its outer reason is read from the four aspects' deciding pebbles, as the first examination laid them.
reading.DeadCause.VITALITY.BLACK=The vitality's deciding pebble is black, the enemy risen on it: the death met its reason in an oath broken and the white left undone.
reading.DeadCause.VITALITY.WHITE=The vitality's deciding pebble is white, met as mother or friend: the death met its reason in the ritual services (རིམ་གྲོ, rim gro) of the paternal kin and close relatives.
reading.DeadCause.BODY.BLACK=The body's deciding pebble is black: the death met its reason in an ill omen, and in wealth gathered from one possessed by a demon.
reading.DeadCause.BODY.WHITE=The body's deciding pebble is white: the death met its reason in a feast of the paternal kin, eaten.
reading.DeadCause.DESTINY.BLACK=The destiny's deciding pebble is black: the death met its reason in fortune (གཡང, g.yang) and wealth lost.
reading.DeadCause.DESTINY.WHITE=The destiny's deciding pebble is white: the death met its reason in food eaten from the wealth of a son-in-law and of sisters.
reading.DeadCause.LUCK.BLACK=The luck's deciding pebble is black: the death met its reason in a feud with Buddhist or Bon (བོན, bon) priests, a defilement, a red offering (དམར, dmar) or people's gathered talk. The gods and protectors were angered.
reading.DeadCause.LUCK.WHITE=The luck's deciding pebble is white: the death met its reason in red meat and red lungs, or in the anger of the gods and protectors.
reading.DeadCut={0} Where the pebbles turned black, the cause is the elements' enmity and their meetings within, and the one met most often among the pebbles is told.
reading.DeadCut.IRON_CUT=Iron was cut by fire in the dead's pebbles: the death met its reason in grief, to the south or the north-east.
reading.DeadCut.FIRE_CUT=Fire was cut by water in the dead's pebbles: the death met its reason in a widow's place, to the north.
reading.DeadCut.EARTH_CUT=Earth was cut by wood in the dead's pebbles: the death met its reason in relying on a red hill, to the east.
reading.DeadCut.WATER_CUT=Water was cut by earth in the dead's pebbles: the death met its reason in a feud, to the south-west.
reading.DeadCut.WOOD_CUT=Wood was cut by iron in the dead's pebbles: the death met its reason in a red offering (དམར, dmar) and the hearth, to the west.
reading.DeadCut.FIRE_INNER=Two fires met within in the dead's pebbles: the death met its reason in a red offering (དམར, dmar), the hearth and hearth smoke.
reading.DeadCut.WOOD_INNER=Two woods met within in the dead's pebbles: the death met its reason in a journey by night to the north-west.
reading.DeadCut.IRON_INNER=Two irons met within in the dead's pebbles: the death met its reason in a burning rite (སྤྱན་སྲེག, spyan sreg), or in an oath sworn by a fire offering (ཧོམ, hom).
reading.DeadCut.EARTH_INNER=Two earths met within in the dead's pebbles: the death met its reason in digging the soil (ཕྲུ་རློག, phru rlog).
reading.DeadCauseTime={0} By the animal of the year, month, day and hour of death, the demon cut the la in that animal's seventh month. Of the four, the one nearest in time weighs most.
reading.DeadCauseTime.TIGER=Died in a tiger time, the la, the life-spirit (བླ, bla), was cut in the monkey month: the gyalpo (རྒྱལ་པོ, rgyal po) and the theurang (ཐེའུ་བྲང, the'u brang) of the east carried one off, and the traces after are bad.
reading.DeadCauseTime.TIGER.remedy=suppress the harmful spirits of the dead (སྲི, sri)
reading.DeadCauseTime.RABBIT=Died in a hare time, the la, the life-spirit (བླ, bla), was cut in the bird month: the death met its reason in buying an ox and an owl.
reading.DeadCauseTime.DRAGON=Died in a dragon time, the la, the life-spirit (བླ, bla), was cut in the dog month: the death met its reason in war, and a demon of madness carried one off.
reading.DeadCauseTime.SNAKE=Died in a snake time, the la, the life-spirit (བླ, bla), was cut in the pig month: the death met its reason in meeting a demon in the north-west.
reading.DeadCauseTime.HORSE=Died in a horse time, the la, the life-spirit (བླ, bla), was cut in the mouse month: the death met its reason in a kin-killing (དམེ, dme) and a lawsuit.
reading.DeadCauseTime.SHEEP=Died in a sheep time, the la, the life-spirit (བླ, bla), was cut in the ox month: the fierce male and female demons (ཡ་བདུད་མ་བདུད, ya bdud ma bdud) carried one off. It is very bad.
reading.DeadCauseTime.SHEEP.remedy=make a ransom rite (གཏོ, gto)
reading.DeadCauseTime.MONKEY=Died in a monkey time, the la, the life-spirit (བླ, bla), was cut in the tiger month: the death met its reason in an enemy and in loss.
reading.DeadCauseTime.MONKEY.remedy=beware of enemies and of loss in the time after
reading.DeadCauseTime.BIRD=Died in a bird time, the la, the life-spirit (བླ, bla), was cut in the hare month: the death met its reason in misused offerings, and a gyalpo (རྒྱལ་པོ, rgyal po) carried one off.
reading.DeadCauseTime.DOG=Died in a dog time, the la, the life-spirit (བླ, bla), was cut in the dragon month: the death met its reason in a red offering (དམར, dmar), and a tsen (བཙན, btsan) carried one off.
reading.DeadCauseTime.PIG=Died in a pig time, the la, the life-spirit (བླ, bla), was cut in the snake month: demons rose against one in the west and the north.
reading.DeadCauseTime.MOUSE=Died in a mouse time, the la, the life-spirit (བླ, bla), was cut in the horse month: a tsen (བཙན, btsan) carried one off in the south-east.
reading.DeadCauseTime.OX=Died in an ox time, the la, the life-spirit (བླ, bla), was cut in the sheep month: the death met its reason in the stroke of a Buddhist or Bon (བོན, bon) priest's dagger, and a sorcery spirit (རྦད་འདྲེ, rbad 'dre) carried one off.
# The dead's third examination, which demon carried the dead off (ROADMAP R2q; WB vol. 2, ch. 29, pp. 58–68; the notes, p. 503).
reading.DeadDemonYear={0} The third examination reads, by the dead's own year animal, which spirit carried the dead off and where it hides.
reading.DeadDemonYear.MOUSE=The dead was born in a mouse year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in a mirror or shiny things, and leads on to the dragon-born and the horse-born. Undone, the executioner (གཤེད, gshed) falls on one's own within four months.
reading.DeadDemonYear.MOUSE.remedy=let three priests kill the executioner and make a ransom within five days, with a weapon thread-cross (མདོས, mdos)
reading.DeadDemonYear.OX=The dead was born in an ox year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in bought offering things, a bag, a speckled sack or things of unmatched colours, and leads on to the snake-born and the sheep-born. Undone, it returns within three months.
reading.DeadDemonYear.OX.remedy=kill it on a goat skull with a dummy, and make Kong tse's turning rite (ཀོང་ཙེའི་གཏོ་བསྒྱུར, kong tse'i gto bsgyur) strongly
reading.DeadDemonYear.TIGER=The dead was born in a tiger year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in a pot, and leads on to the ox-born and the bird-born. It goes to a middle sister or daughter, and undone it returns within four months.
reading.DeadDemonYear.TIGER.remedy=let five priests of different clans kill it on an ox or sheep dummy, its head to the north
reading.DeadDemonYear.RABBIT=The dead was born in a hare year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in black woollen cloth, by a tiger-born person or a fair woman. Undone, it returns in the first summer month.
reading.DeadDemonYear.RABBIT.remedy=kill it on goat, dog and pig skulls, send a bird upward and make the averting rite with tormas (གཏོར་མ, gtor ma)
reading.DeadDemonYear.DRAGON=The dead was born in a dragon year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in turquoise or a drum, and leads on to the monkey-born and the dog-born.
reading.DeadDemonYear.DRAGON.remedy=kill it on a dog skull, send a dog and a sheep upward, recite the Nāgas' Hundred Thousand (ཀླུ་འབུམ, klu 'bum) and the Uṣṇīṣa many times, and make Kong tse's turning rite (ཀོང་ཙེའི་གཏོ་བསྒྱུར, kong tse'i gto bsgyur) quickly
reading.DeadDemonYear.SNAKE=The dead was born in a snake year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in an old torn black sack, wool or fur, or a gem, and leads on to the bird-born and the pig-born. Without a thread-cross (མདོས, mdos) it goes to a woman, to a place of red meat.
reading.DeadDemonYear.SNAKE.remedy=kill it on a black yak's or goat's hide, its head to the north; pray for glory and call the fortune (གཡང, g.yang)
reading.DeadDemonYear.HORSE=The dead was born in a horse year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in a pot, and leads on to the mouse-born and the hare-born. It goes across nine valleys' waters to a red-faced woman, the paternal kin and the younger grandchildren.
reading.DeadDemonYear.HORSE.remedy=build a stūpa and press it down, avert the seventh and the obstacle, and make Kong tse's turning rite (ཀོང་ཙེའི་གཏོ་བསྒྱུར, kong tse'i gto bsgyur)
reading.DeadDemonYear.SHEEP=The dead was born in a sheep year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in an old sack of woollen cloth or leather, and leads on to the ox-born and the sheep-born. It goes west, to a household of three.
reading.DeadDemonYear.SHEEP.remedy=kill it on black yak and black sheep hides; let nine clans recite, call the fortune (གཡང, g.yang), make clay votive images (ཚ་ཚ, tsha tsha) and the four executioners' rite
reading.DeadDemonYear.MONKEY=The dead was born in a monkey year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in a pot, and leads on to the tiger-born and the pig-born. It goes to a dog-born woman, a red-faced woman and the paternal uncles' younger line.
reading.DeadDemonYear.MONKEY.remedy=clothe a stūpa and press down the harmful spirits of the dead (སྲི, sri), avert the seventh and the obstacle, and make Kong tse's turning rite (ཀོང་ཙེའི་གཏོ་བསྒྱུར, kong tse'i gto bsgyur), so that the demon goes north
reading.DeadDemonYear.BIRD=The dead was born in a bird year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in a small marked bag of leather, wool or fur-lined patches, and leads on to the hare-born and the ox-born. Undone, it returns after one month.
reading.DeadDemonYear.BIRD.remedy=give the things to a priest as his fee; else kill it in a red sheep's skull, hide the things at three graves and send a tsen (བཙན, btsan) thread-cross (མདོས, mdos)
reading.DeadDemonYear.DOG=The dead was born in a dog year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in the roof, and leads on to the dragon-born, the ox-born and the sheep-born. It goes to the priests and to a household of five.
reading.DeadDemonYear.DOG.remedy=kill it on a speckled pig, a speckled goat and a human skin, and make the averting rite with tormas (གཏོར་མ, gtor ma) and a fire offering (ཧོམ, hom)
reading.DeadDemonYear.PIG=The dead was born in a pig year: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in a vessel of iron scraps, and leads on to the pig-born and the hare-born. It goes to the female kin and the elder paternal line, and the corpse's owner risks an epidemic.
reading.DeadDemonYear.PIG.remedy=recite the Collected Dhāraṇīs (གཟུངས་བསྡུས, gzungs bsdus) many times and the Eight Appearances of Heaven and Earth (སྣང་བརྒྱད, snang brgyad), raise prayer flags on a high hill, give water tormas (ཆུ་གཏོར, chu gtor) and make the earth lords' (ས་བདག, sa bdag) turning rite
reading.DeadDemonDay={0} The third examination reads the day's animal of death; on the other days it holds no good or bad.
reading.DeadDemonDay.OX=Died on an ox day: it is bad for those close to the dead.
reading.DeadDemonDay.TIGER=Died on a tiger day: the life was cut in the bird month.
reading.DeadDemonDay.SNAKE=Died on a snake day: the life was cut in the monkey month.
reading.DeadDemonDay.HORSE=Died on a horse day: the life was cut in the bird month.
reading.DeadDemonDay.SHEEP=Died on a sheep day: the life was cut in the sheep month.
reading.DeadDemonDay.MONKEY=Died on a monkey day: the life was cut in the dog month.
reading.DeadDemonWeekday={0} The third examination reads the weekday of death: where the spirit hides, on whom the death repeats, and what is laid on the corpse.
reading.DeadDemonWeekday.SUNDAY=Died on a Sunday: the devouring spirit (ཟ་འདྲེ, za 'dre) hides east of the house, in a torn-mouthed sack with a mirror and a woman's headgear. The death repeats on a woman, and it is bad for the clan.
reading.DeadDemonWeekday.SUNDAY.remedy=lay a pig skull, a rat skull and nine water tips on the corpse, avert the planet and press down the harmful spirits of the dead (སྲི, sri)
reading.DeadDemonWeekday.MONDAY=Died on a Monday: the devouring spirit (ཟ་འདྲེ, za 'dre) hides to the west in a bag, a red one among things of unmatched colours. The death repeats on women and children.
reading.DeadDemonWeekday.MONDAY.remedy=take the bag to a crossroads; lay a sheep skull and yellow clay votive images (ཚ་ཚ, tsha tsha) on the corpse, and recite the five protections
reading.DeadDemonWeekday.TUESDAY=Died on a Tuesday: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in the lower east, in an earthen pot of tail hair. The death repeats on brother and sister, and nothing need be laid on the corpse.
reading.DeadDemonWeekday.TUESDAY.remedy=take the pot to a crossroads with a weapon thread-cross (མདོས, mdos) and a phurba (ཕུར་པ, phur pa)
reading.DeadDemonWeekday.WEDNESDAY=Died on a Wednesday: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in the south-east, in a brown or black sack, deerskin or furred cloth. The death repeats on children or a craftsman, and many die.
reading.DeadDemonWeekday.WEDNESDAY.remedy=take the sack to a crossroads, and lay sheep and ox skulls on the corpse
reading.DeadDemonWeekday.THURSDAY=Died on a Thursday: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in the north-west, in a sack, an old man's pocket or three sacks with a head or hat. The death repeats on three or four old paternal uncles.
reading.DeadDemonWeekday.THURSDAY.remedy=take the sacks to the bridge's end, lay a white cock on the corpse and avert the planet
reading.DeadDemonWeekday.FRIDAY=Died on a Friday: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in the north-west, in a black sack or a black pot of unmatched colours. The death repeats on the old.
reading.DeadDemonWeekday.FRIDAY.remedy=give the sack to a beggar or leave it by the roadside, and lay horse and snake skulls on the corpse
reading.DeadDemonWeekday.SATURDAY=Died on a Saturday: the devouring spirit (ཟ་འདྲེ, za 'dre) hides in the north-east, in an iron thing. The death repeats on a village neighbour, and it is bad for the old.
reading.DeadDemonWeekday.SATURDAY.remedy=lay a donkey skull and kinds of wood on the corpse, avert the planet, give a meal to a beggar and recite the Uṣṇīṣa
reading.DeadDemonHour={0} The third examination reads the double hour of death: the month the life was cut in, where the spirit came from, and whom it goes to next.
reading.DeadDemonHour.RABBIT=Died at dawn, the hare hour: the la, the life-spirit (བླ, bla), was cut in the monkey month. The devouring spirit (ཟ་འདྲེ, za 'dre) came in white things, white-marked cattle, cotton or wool, and goes to a household of five in the north.
reading.DeadDemonHour.RABBIT.remedy=make the crowd-turning rite and the averting rite with tormas (གཏོར་མ, gtor ma)
reading.DeadDemonHour.DRAGON=Died at sunrise, the dragon hour: a demon cut the life in the dog month. The devouring spirit (ཟ་འདྲེ, za 'dre) came from the north and hides by the house in an old sack; it is bad for a small son and the ox-born and bird-born.
reading.DeadDemonHour.DRAGON.remedy=press down a snake figure at a crossroads
reading.DeadDemonHour.SNAKE=Died in the morning, the snake hour: the devouring spirit (ཟ་འདྲེ, za 'dre) hides east of the house in an old sack, in an ox's shape. The corpse's owner holds the executioner (གཤེད, gshed), and it is bad for a child and the pig-born and mouse-born.
reading.DeadDemonHour.SNAKE.remedy=press down an ox figure, and make the crowd-turning rite, the averting rite with tormas (གཏོར་མ, gtor ma) and the Eight Appearances of Heaven and Earth (སྣང་བརྒྱད, snang brgyad)
reading.DeadDemonHour.HORSE=Died at midday, the horse hour: the devouring spirit (ཟ་འདྲེ, za 'dre) came from the north-west as an insect in a sack or sheepskin. It is bad for fair women, pregnant women and the mouse-born.
reading.DeadDemonHour.HORSE.remedy=chop an ogre (སྲིན་པོ, srin po) figure and press it down, and send a weapon thread-cross (མདོས, mdos)
reading.DeadDemonHour.SHEEP=Died past midday, the sheep hour: the life was cut in the ox or the sheep month, and the death goes on to the servants, man and woman.
reading.DeadDemonHour.SHEEP.remedy=press down a sheep figure
reading.DeadDemonHour.MONKEY=Died in the afternoon, the monkey hour: the life was cut in the dog month. The devouring spirit (ཟ་འདྲེ, za 'dre) came from the north in a pot and boots, and it is bad for a neighbour's household and the tiger-born and hare-born.
reading.DeadDemonHour.MONKEY.remedy=make the rite against the earth lords' (ས་བདག, sa bdag) turbulence
reading.DeadDemonHour.BIRD=Died at sunset, the bird hour: the life was cut in the snake month. The devouring spirit (ཟ་འདྲེ, za 'dre) came from the east in a churn or a hand-mill, and it is bad for the corpse's owner's eldest grandchild, a child and a pregnant woman.
reading.DeadDemonHour.BIRD.remedy=recite the dharma and make the ritual to the east
reading.DeadDemonHour.DOG=Died at dusk, the dog hour: the life was cut in the dragon month. The devouring spirit (ཟ་འདྲེ, za 'dre) came from the west in a pot, white cattle or white things, and the executioner (གཤེད, gshed) is in a man.
reading.DeadDemonHour.DOG.remedy=let monks recite the Sūtra of Long Life (ཚེ་མདོ, tshe mdo) and the Uṣṇīṣa, and send a thread-cross (མདོས, mdos)
reading.DeadDemonHour.PIG=Died at night, the pig hour: the la, the life-spirit (བླ, bla), was cut in the last winter month, and a demon in the ox month. A red man of the south was its pretext, and it is bad for the corpse's owner and the sheep-born.
reading.DeadDemonHour.PIG.remedy=give many averting tormas (གཏོར་མ, gtor ma)
reading.DeadDemonHour.MOUSE=Died at midnight, the mouse hour: the devouring spirit (ཟ་འདྲེ, za 'dre) came from the east and south with a white horse, a white ox or a child's body. It goes to a neighbour's household of four, and it is bad for the horse-born and snake-born.
reading.DeadDemonHour.MOUSE.remedy=make the ritual and the wrathful averting acts
reading.DeadDemonHour.OX=Died past midnight, the ox hour: a female demon came in yellow and black things or shiny things of gold or brass, and went south or west. It is bad for the sheep-born and for one of the household born in one's own year; the ritual suffices.
reading.DeadDemonHour.TIGER=Died at daybreak, the tiger hour: the devouring spirit (ཟ་འདྲེ, za 'dre) went in a bag to an eastern crossroads. It is bad for two of the household, for one with a mole on the face and for the monkey-born.
reading.DeadDemonHour.TIGER.remedy=dress the corpse in red and white clothes, and make the ritual to the east
reading.DeadDemonMansion={0} The third examination reads the mansion of death: the cause or the carrier, who is at risk, and what is laid on or under the corpse.
reading.DeadDemonMansion.ASHVINI=Died under Aśvinī, the staff: the corpse is taken out under Bharaṇī.
reading.DeadDemonMansion.BHARANI=Died under Bharaṇī: three great persons die in a row, it is bad for women, and the death comes by a knife.
reading.DeadDemonMansion.BHARANI.remedy=lay a woman's figure on three cow-bone tablets in the corpse's hollow; set an arrow and a spear to the east, shoot a bow toward the enemy, and lay a pig skull west, a dog skull north and a deer skull before the dead
reading.DeadDemonMansion.KRITTIKA=Died under Kṛttikā: the dead is not hidden for seven days and not carried. Black cattle went out, springs were hidden and the earth of the nyen (གཉན, gnyan) was dug, and the earth lords (ས་བདག, sa bdag) harm.
reading.DeadDemonMansion.KRITTIKA.remedy=lay eighteen black river stones and rat and pig skulls with the corpse; let three of other names and clans carry it east, and make the earth lords' ritual
reading.DeadDemonMansion.ROHINI=Died under Rohiṇī: white-marked cattle were sent away, and a child's death is bad for a woman born in a mouse year.
reading.DeadDemonMansion.ROHINI.remedy=for a woman, lay a yak figure; send a white bird and irons on the road east, and call the fortune (གཡང, g.yang)
reading.DeadDemonMansion.MRIGASHIRAS=Died under Mṛgaśiras: a gyalpo (རྒྱལ་པོ, rgyal po) carried one off. The corpse is not carried out for five days, and it is bad for the old.
reading.DeadDemonMansion.MRIGASHIRAS.remedy=lay a yak horn, and make the black three-headed ritual
reading.DeadDemonMansion.ARDRA=Died under Ārdrā: a tsen (བཙན, btsan) carried one off and left black traces, and it is bad for two.
reading.DeadDemonMansion.ARDRA.remedy=hold the funeral on the eleventh day; pour grains, make a white clay votive image (ཚ་ཚ, tsha tsha), and show a bowl in a ladle to the east
reading.DeadDemonMansion.PUNARVASU=Died under Punarvasu: a gyalpo (རྒྱལ་པོ, rgyal po) joined with a planet carried one off, and the hearth was the cause.
reading.DeadDemonMansion.PUSHYA=Died under Puṣya: a gyalpo (རྒྱལ་པོ, rgyal po) carried one off; else it is bad for a young man.
reading.DeadDemonMansion.PUSHYA.remedy=lay yak and sheep skulls, and show irons to the east
reading.DeadDemonMansion.ASHLESHA=Died under Āśleṣā: a red hearth and a tsen (བཙན, btsan) were the cause. A woman dies, and it is rough on small children.
reading.DeadDemonMansion.ASHLESHA.remedy=pour garlic and wheat, and cut the mouth of death
reading.DeadDemonMansion.MAGHA=Died under Maghā: a male tsen (བཙན, btsan), the planet's wolf, carried one off, and two women from the south-east or south are at risk.
reading.DeadDemonMansion.MAGHA.remedy=lay goat, dog and pig dung in a pouch, and an axe
reading.DeadDemonMansion.PURVAPHALGUNI=Died under Pūrvaphalgunī: a tsen (བཙན, btsan) carried one off, and the lord of death follows brother and sister.
reading.DeadDemonMansion.PURVAPHALGUNI.remedy=lay donkey, dzo and goat skulls
reading.DeadDemonMansion.UTTARAPHALGUNI=Died under Uttaraphalgunī: a planet's demon carried one off, through the old grave of the forefathers' clan.
reading.DeadDemonMansion.UTTARAPHALGUNI.remedy=for a small grandchild, press down the black grave's harmful spirit of the dead (སྲི, sri)
reading.DeadDemonMansion.HASTA=Died under Hasta: a black thing brought in and a neighbour's spirit were the cause.
reading.DeadDemonMansion.HASTA.remedy=hide the corpse one day and lay a cock; close the grave's mouth for a woman; make the dog, goat and pig ritual and a flour-and-butter torma (གཏོར་མ, gtor ma), and hold the funeral on the twenty-fourth
reading.DeadDemonMansion.CITRA=Died under Citrā: a spirit following wood carried one off, for no oath was kept and no white deed done.
reading.DeadDemonMansion.CITRA.remedy=offer the blood of men and cattle, and confess
reading.DeadDemonMansion.SVATI=Died under Svātī: the earth of the nyen (གཉན, gnyan) was dug, and brother and sister's food and travel were the cause.
reading.DeadDemonMansion.SVATI.remedy=hold the funeral and call the fortune (གཡང, g.yang) under Citrā
reading.DeadDemonMansion.VISHAKHA=Died under Viśākhā: a lu-tsen (ཀླུ་བཙན, klu btsan) carried one off, and it is bad for a strong or young man.
reading.DeadDemonMansion.VISHAKHA.remedy=recite the sūtras and the Uṣṇīṣa, and avert the holes of the directions
reading.DeadDemonMansion.ANURADHA=Died under Anurādhā: a planet and a gyalpo (རྒྱལ་པོ, rgyal po) carried one off, through the maternal kin's travel.
reading.DeadDemonMansion.ANURADHA.remedy=put a calf skull and a smith's black hat in a black pot, and hide the bones of a man, a horse and a dog in a dead man's boot to the north-west
reading.DeadDemonMansion.JYESHTHA=Died under Jyeṣṭhā: a gyalpo (རྒྱལ་པོ, rgyal po) demon stands behind brother and sister.
reading.DeadDemonMansion.JYESHTHA.remedy=recite the Twenty Thousand and the Eight Thousand, lay goat, dog and pig skulls, and hold the funeral under Puṣya
reading.DeadDemonMansion.MULA=Died under Mūla: a fight and a quarrel were the cause, with a planet's demon and the earth lords (ས་བདག, sa bdag).
reading.DeadDemonMansion.MULA.remedy=lay a pig skull, and hold the funeral under Abhijit
reading.DeadDemonMansion.PURVASHADHA=Died under Pūrvāṣāḍhā: food and travel were the cause.
reading.DeadDemonMansion.PURVASHADHA.remedy=make the smoke rite that averts defilement
reading.DeadDemonMansion.UTTARASHADHA=Died under Uttarāṣāḍhā: after this death the run of deaths is cut off.
reading.DeadDemonMansion.SHRAVANA=Died under Śravaṇa: it is bad for women.
reading.DeadDemonMansion.SHRAVANA.remedy=lay rat and pig skulls
reading.DeadDemonMansion.DHANISHTHA=Died under Dhaniṣṭhā: it is bad for horses and cattle.
reading.DeadDemonMansion.DHANISHTHA.remedy=lay yellow earth and clay votive images (ཚ་ཚ, tsha tsha), make the earth lords' (ས་བདག, sa bdag) rite, and send a ransom on a rat and pig figure to the north
reading.DeadDemonMansion.SHATABHISHAJ=Died under Śatabhiṣaj: it is bad for men, horses and cattle, through digging, ploughing or an ox given away.
reading.DeadDemonMansion.SHATABHISHAJ.remedy=make the rite against the earth lords' (ས་བདག, sa bdag) turbulence, and loosen the irons of the nāga demons (ཀླུ་བདུད, klu bdud)
reading.DeadDemonMansion.PURVABHADRAPADA=Died under Pūrvabhādrapadā: a tsen (བཙན, btsan), a planet and a demon carried one off, and it is bad for women.
reading.DeadDemonMansion.PURVABHADRAPADA.remedy=make the Chinese turning ritual
reading.DeadDemonMansion.UTTARABHADRAPADA=Died under Uttarabhādrapadā: the devouring spirit (ཟ་འདྲེ, za 'dre), the nāgas (ཀླུ, klu) and the earth lords (ས་བདག, sa bdag) carried one off.
reading.DeadDemonMansion.UTTARABHADRAPADA.remedy=make the rites against turbulence and the chanted rituals, and give tormas (གཏོར་མ, gtor ma)
reading.DeadDemonMansion.REVATI=Died under Revatī: the death turns back.
reading.DeadDemonMansion.REVATI.remedy=practise the holy dharma, and turn away the face of the three-headed devouring spirit (ཟ་འདྲེ, za 'dre)
# The dead's fifth and sixth examinations, the rebirth and help by virtue (ROADMAP R2s; WB vol. 2, ch. 29, pp. 70–72).
DeadRebirth.GOD=a god
DeadRebirth.ASURA=an asura
DeadRebirth.HUMAN=a human
DeadRebirth.ANIMAL=an animal
DeadRebirth.HUNGRY_GHOST=a hungry ghost
DeadRebirth.HELL=hell
reading.DeadRebirthDay={0} The fifth examination reads, by the day's animal of death, the life the dead had before and the life it goes to.
reading.DeadRebirthDay.MOUSE=Died on a mouse day: before, the dead was a snake and then a horse; next it is born a monk with a share of the Dharma.
reading.DeadRebirthDay.OX=Died on an ox day: before, the dead was a human; next it is born a good teacher.
reading.DeadRebirthDay.TIGER=Died on a tiger day: within ten days the dead takes a horse's body; next it is born a single man.
reading.DeadRebirthDay.RABBIT=Died on a hare day: before, the dead was a bird in the east; next it is born an elephant, or a single man.
reading.DeadRebirthDay.DRAGON=Died on a dragon day: before, the dead was a snake for some days; next it is born an ox, then a man of the Bon (བོན, bon) priests.
reading.DeadRebirthDay.SNAKE=Died on a snake day: before, the dead was an ox; next it is born the son of a newly married pair in the sunny south.
reading.DeadRebirthDay.HORSE=Died on a horse day: before, the dead was an ogre (སྲིན་པོ, srin po); next it is born the son of an old couple.
reading.DeadRebirthDay.SHEEP=Died on a sheep day: before, the dead was a snake; next it is born a monk.
reading.DeadRebirthDay.MONKEY=Died on a monkey day: before, the dead was a mouse in the north; next it is born a bachelor.
reading.DeadRebirthDay.BIRD=Died on a bird day: before, the dead was a goose; next it is born the middle of three brothers in the west.
reading.DeadRebirthDay.DOG=Died on a dog day: next the dead is born the middle of three brothers in the west.
reading.DeadRebirthDay.PIG=Died on a pig day: before, the dead was a mantra practitioner; next it is born a teacher.
reading.DeadRebirthHour={0} The fifth examination reads, by the double hour of death among the twelve of day and night, the realm the dead is born into.
reading.DeadRebirthHour.GOD=Died in the hare or the tiger hour: the dead is born a god.
reading.DeadRebirthHour.ASURA=Died in the dragon or the ox hour: the dead is born an asura.
reading.DeadRebirthHour.ASURA.remedy=strive at virtue for the dead: where the virtue is dear and good, it brings good results despite unlike signs
reading.DeadRebirthHour.HUMAN=Died in the snake or the mouse hour: the dead is born a human.
reading.DeadRebirthHour.ANIMAL=Died in the horse or the pig hour: the dead is born an animal.
reading.DeadRebirthHour.ANIMAL.remedy=strive at virtue for the dead: where the virtue is dear and good, it brings good results despite unlike signs
reading.DeadRebirthHour.HUNGRY_GHOST=Died in the sheep or the dog hour: the dead is born a hungry ghost.
reading.DeadRebirthHour.HUNGRY_GHOST.remedy=strive at virtue for the dead: where the virtue is dear and good, it brings good results despite unlike signs
reading.DeadRebirthHour.HELL=Died in the monkey or the bird hour: the dead is born in hell.
reading.DeadRebirthHour.HELL.remedy=strive at virtue for the dead: where the virtue is dear and good, it brings good results despite unlike signs
reading.DeadVirtue={0} The sixth examination, help by virtue (ར་མདའ, ra mda'), sets the roots of virtue to the year the dead passed. It has no pure, certain source: whatever white work can be done is best.
reading.DeadVirtue.MOUSE=The dead passed in a mouse year: its help is two dhāraṇīs recited.
reading.DeadVirtue.MOUSE.remedy=recite the Vijaya (རྣམ་འཇོམས, rnam 'joms) and the Amoghapāśa (དོན་ཞགས, don zhags) dhāraṇīs
reading.DeadVirtue.OX=The dead passed in an ox year: its help is a maṇi built and recited.
reading.DeadVirtue.OX.remedy=build a maṇi (མ་ཎི, ma Ni) and recite it twenty thousand times
reading.DeadVirtue.TIGER=The dead passed in a tiger year: its help is two texts recited and clay images made.
reading.DeadVirtue.TIGER.remedy=recite the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs) and the Diamond Cutter (རྡོར་གཅོད, rdor gcod), and make clay votive images (ཚ་ཚ, tsha tsha) of Akṣobhya of five kinds
reading.DeadVirtue.RABBIT=The dead passed in a hare year: its help is a sūtra recited and clay images made.
reading.DeadVirtue.RABBIT.remedy=recite the Diamond Cutter (རྡོར་གཅོད, rdor gcod), and make a thousand clay votive images (ཚ་ཚ, tsha tsha)
reading.DeadVirtue.DRAGON=The dead passed in a dragon year: its help is a sūtra recited.
reading.DeadVirtue.DRAGON.remedy=recite the Sūtra of the Wise and the Foolish (མཛངས་བླུན, mdzangs blun)
reading.DeadVirtue.SNAKE=The dead passed in a snake year: its help is a text recited and a stūpa restored.
reading.DeadVirtue.SNAKE.remedy=recite the Hundred Thousand Names (མཚན་འབུམ, mtshan 'bum), and restore a stūpa
reading.DeadVirtue.HORSE=The dead passed in a horse year: its help is three texts recited.
reading.DeadVirtue.HORSE.remedy=recite the Hundred Thousand Names (མཚན་འབུམ, mtshan 'bum), the Diamond Cutter (རྡོར་གཅོད, rdor gcod) and the Collected Dhāraṇīs (གཟུངས་བསྡུས, gzungs bsdus)
reading.DeadVirtue.SHEEP=The dead passed in a sheep year: its help is four texts recited.
reading.DeadVirtue.SHEEP.remedy=recite the Eight Thousand (བརྒྱད་སྟོང་པ, brgyad stong pa), the 'Bum tog (འབུམ་ཏོག, 'bum tog), the Golden Light and the Good Conduct (བཟང་སྤྱོད, bzang spyod)
reading.DeadVirtue.MONKEY=The dead passed in a monkey year: its help is two texts recited, a stūpa restored and a banner raised.
reading.DeadVirtue.MONKEY.remedy=recite the Spang skong (སྤང་སྐོང, spang skong) and the Good Conduct (བཟང་སྤྱོད, bzang spyod), restore a stūpa and raise a banner
reading.DeadVirtue.BIRD=The dead passed in a bird year: its help is water offerings and a confession.
reading.DeadVirtue.BIRD.remedy=give water tormas (ཆུ་གཏོར, chu gtor), and recite the Confession of Downfalls (ལྟུང་བཤགས, ltung bshags)
reading.DeadVirtue.DOG=The dead passed in a dog year: its help is a burning rite and a sūtra recited.
reading.DeadVirtue.DOG.remedy=make a burning rite (སྦྱིན་སྲེག, sbyin sreg), and recite the Fortunate Aeon
reading.DeadVirtue.PIG=The dead passed in a pig year: its help is two texts recited.
reading.DeadVirtue.PIG.remedy=recite the Destroyer of All Sin and Obscuration (སྡིག་སྒྲིབ་ཀུན་འཇོམས, sdig sgrib kun 'joms) and the Confession of Downfalls (ལྟུང་བཤགས, ltung bshags)
# The dead's trigram and mewa at death, by D18 the descended ones (ROADMAP R2t; WB vol. 2, ch. 29, pp. 57–63, 70–72; the notes, p. 503).
reading.DeadCauseTrigram={0} The second examination reads the inner reason by the trigram the dead had descended to: the protections of the living were neglected, and an illness or a demon struck.
reading.DeadCauseTrigram.LI=Died on the fire trigram (ལི, li): the death met its reason in a horse, turquoise, a hat or felt bought, or a horse's or wild ass's meat eaten. The demon cut in the north-west.
reading.DeadCauseTrigram.KHON=Died on the earth trigram (ཁོན, khon): the death met its reason in a jewel, turquoise, a top or a tent, or flour, mutton or a killed wolf's meat eaten. The demon cut in the north.
reading.DeadCauseTrigram.DWA=Died on the lake trigram (དྭ, dwa): the death met its reason in a load carried to a rotten hill and an empty place. The demon cut in the east, and a tsen (བཙན, btsan) carried the dead off.
reading.DeadCauseTrigram.KHEN=Died on the sky trigram (ཁེན, khen): the death met its reason in marmot's meat, the food of a feud or red wedding food. The demon cut in the south.
reading.DeadCauseTrigram.KHAM=Died on the water trigram (ཁམ, kham): the death met its reason in ox, pig, bird or fish meat eaten, or in going to a hole where corpses are hidden. The demon cut in the south-west.
reading.DeadCauseTrigram.GIN=Died on the mountain trigram (གིན, gin): the death met its reason in a red ox. The demon cut in the south-east, and a sorcery spirit (རྦད་འདྲེ, rbad 'dre) carried the dead off.
reading.DeadCauseTrigram.ZIN=Died on the thunder trigram (ཟིན, zin): the death met its reason in staying in the south-west, or in bird and hare meat. The demon cut in the west, and a gyalpo (རྒྱལ་པོ, rgyal po) carried off the la.
reading.DeadCauseTrigram.ZON=Died on the wind trigram (ཟོན, zon): the death met its reason in a leprosy demon and a leper ox's meat. The demon cut in the north-east.
reading.DeadCauseMewa={0} The second examination reads the speckled middle reason by the mewa the dead had descended to: the protections of the living were neglected.
reading.DeadCauseMewa.1=Died on the one white: the death met its reason in a widow's place and impure food.
reading.DeadCauseMewa.2=Died on the two black: the death met its reason in a journey by night.
reading.DeadCauseMewa.3=Died on the three blue: the death met its reason in a zor (ཟོར, zor) that struck.
reading.DeadCauseMewa.4=Died on the four green: the death met its reason in digging the soil (ཕྲུ་རློག, phru rlog).
reading.DeadCauseMewa.5=Died on the five yellow: the death met its reason in misused offerings.
reading.DeadCauseMewa.6=Died on the six white: the death met its reason in impurity and a seasonal offering broken.
reading.DeadCauseMewa.7=Died on the seven red: the death met its reason in the hearth, hearth smoke and a red offering (དམར, dmar).
reading.DeadCauseMewa.8=Died on the eight white: the death met its reason in the offerings of Buddhist and Bon (བོན, bon) priests and the saṅgha misused.
reading.DeadCauseMewa.9=Died on the nine red: the death met its reason in fortune and prosperity (ཕྱྭ་གཡང, phywa g.yang) declined.
reading.DeadDemonTrigram={0} The third examination reads the trigram the dead had descended to at death.
reading.DeadDemonTrigram.LI=Died on the fire trigram (ལི, li): a tsen (བཙན, btsan) and a gyalpo (རྒྱལ་པོ, rgyal po) carried the dead off. The devouring spirit (ཟ་འདྲེ, za 'dre) hides south of the house, in a pot, a churn, a sack, turquoise or a felt hat, and goes on to the maternal uncle.
reading.DeadDemonTrigram.LI.remedy=lay a pig skull and water tips on the corpse
reading.DeadDemonTrigram.KHON=Died on the earth trigram (ཁོན, khon): the earth lords (ས་བདག, sa bdag) carried the dead off, through a quarrel or a black thing brought in. The devouring spirit (ཟ་འདྲེ, za 'dre) hides in a black sack and goes on to the old and the lean within half a month.
reading.DeadDemonTrigram.KHON.remedy=carry the sack to a crossroads, and lay a hare skull and kinds of wood on the corpse
reading.DeadDemonTrigram.DWA=Died on the lake trigram (དྭ, dwa): a tsen (བཙན, btsan) king carried the dead off, the life cut in the east. The devouring spirit (ཟ་འདྲེ, za 'dre) hides in armour, a helmet or a knife, and goes on to a small child.
reading.DeadDemonTrigram.DWA.remedy=make the tsen rite that crushes the earth lords' heart
reading.DeadDemonTrigram.KHEN=Died on the sky trigram (ཁེན, khen): a life-king carried the dead off, a demon cutting in the south-east. The death goes on to the old, the cattle and the maternal uncle.
reading.DeadDemonTrigram.KHEN.remedy=if an old mother died, block the sky door, press down the harmful spirits of the dead (སྲི, sri), and recite the rite and the sūtras
reading.DeadDemonTrigram.KHAM=Died on the water trigram (ཁམ, kham): the lu-sen (ཀླུ་བསེན, klu bsen) and the lake women carried the dead off, a demon cutting in the south-west. The devouring spirit (ཟ་འདྲེ, za 'dre) hides in copper, a water jar or beer, and goes on to a small child.
reading.DeadDemonTrigram.KHAM.remedy=make the dhāraṇī ablution for the grave's threshold
reading.DeadDemonTrigram.GIN=Died on the mountain trigram (གིན, gin): the king Pehar (པེ་ཧར, pe har) carried the dead off, the life cut in the south-east. The devouring spirit (ཟ་འདྲེ, za 'dre) hides in blue horses and cattle for ten days, and goes on to a male of the paternal kin whose line is cut.
reading.DeadDemonTrigram.ZIN=Died on the thunder trigram (ཟིན, zin): a planet and a wolf carried the dead off, a demon cutting in the west. The devouring spirit (ཟ་འདྲེ, za 'dre) hides in a hide or a storeroom, and goes on to the paternal kin, a pregnant woman, or brother and sister.
reading.DeadDemonTrigram.ZIN.remedy=put the heart's tip in the corpse's mouth, make the heart-crushing rite, and send the mother-demon king's thread-cross (མདོས, mdos)
reading.DeadDemonTrigram.ZON=Died on the wind trigram (ཟོན, zon): a male gyalpo (རྒྱལ་པོ, rgyal po) carried the dead off, the life cut in the north-east. The devouring spirit (ཟ་འདྲེ, za 'dre) hides in clothes, silk or leftover food for twenty-six days, and goes on to an old paternal uncle or a pregnant woman.
reading.DeadDemonTrigram.ZON.remedy=lay a goat skull and a wooden peg; recite the Uṣṇīṣa twenty thousand times, send the mamo's (མ་མོ, ma mo) blood thread-cross (མདོས, mdos), and make the rite against the earth lords' (ས་བདག, sa bdag) turbulence
reading.DeadDemonMewa={0} The third examination reads the mewa the dead had descended to at death, and when the death came.
reading.DeadDemonMewa.1=Died on the one white: it is bad for small children, a quarrel and uncleanness being the cause. The devouring spirit (ཟ་འདྲེ, za 'dre) goes to the children, towards the maternal uncle.
reading.DeadDemonMewa.1.remedy=let three priests make the ritual, and lay a red man and a red horse on the corpse
reading.DeadDemonMewa.2=Died on the two black: beer and water were the pretext, and it is bad for women.
reading.DeadDemonMewa.2.remedy=let three people in black hats and clothes cover the corpse, and send the three-headed demon's thread-cross (མདོས, mdos)
reading.DeadDemonMewa.3=Died on the three blue, at night: the harm came from the forefathers' grave.
reading.DeadDemonMewa.3.remedy=lay a clay votive image (ཚ་ཚ, tsha tsha), a sheep's head and kinds of earth on the corpse
reading.DeadDemonMewa.4=Died on the four green: an illness of the nāgas (ཀླུ, klu) took the dead, and the devouring spirit (ཟ་འདྲེ, za 'dre) goes to the younger line.
reading.DeadDemonMewa.4.remedy=lay iron on the corpse, recite the Nāgas' Hundred Thousand (ཀླུ་འབུམ, klu 'bum), and loosen the irons of the nāga demons (ཀླུ་བདུད, klu bdud)
reading.DeadDemonMewa.5=Died on the five yellow, by day: the devouring spirit (ཟ་འདྲེ, za 'dre) goes to brother and sister's elder line, or to the nine elders of the paternal kin.
reading.DeadDemonMewa.5.remedy=make the averting rite with tormas (གཏོར་མ, gtor ma), and let three monks stamp clay votive images (ཚ་ཚ, tsha tsha)
reading.DeadDemonMewa.6=Died on the six white, by day: a tsen (བཙན, btsan) of the gods carried the dead off, a defilement being the pretext. The devouring spirit (ཟ་འདྲེ, za 'dre) hides in a hat.
reading.DeadDemonMewa.6.remedy=clear the defilement
reading.DeadDemonMewa.7=Died on the seven red, at night: it is bad for the household itself. The devouring spirit (ཟ་འདྲེ, za 'dre) hides in an old man's pocket.
reading.DeadDemonMewa.7.remedy=turn the pocket out; make the tsen (བཙན, btsan) rite and the ritual that turns back slander
reading.DeadDemonMewa.8=Died on the eight white, by day: it is bad for kin dear as the heart, a defilement having struck the god. The devouring spirit (ཟ་འདྲེ, za 'dre) hides in butter.
reading.DeadDemonMewa.8.remedy=give butter and tsampa to a beggar, and make the smoke purification and offerings
reading.DeadDemonMewa.9=Died on the nine red, by day: loss and plague come to an old woman with fortune. The devouring spirit (ཟ་འདྲེ, za 'dre) hides in a red patch or red things, and goes to wealth, cattle and sheep.
reading.DeadDemonMewa.9.remedy=send the mamo's (མ་མོ, ma mo) blood thread-cross (མདོས, mdos), avert ruin and call the fortune (གཡང, g.yang)
reading.DeadRebirthMewa={0} The fifth examination reads, by the mewa the dead had descended to at death, where it is born, and the image that turns a bad birth.
reading.DeadRebirthMewa.1=Died on the one white: the dead is born a man keen on the Dharma.
reading.DeadRebirthMewa.1.remedy=make an image of Avalokiteśvara (སྤྱན་རས་གཟིགས, spyan ras gzigs), and recite the six syllables
reading.DeadRebirthMewa.2=Died on the two black: the dead takes a bear's or a monkey's body. With the year, month, day and hour all black too, it is born in hell, hard to turn.
reading.DeadRebirthMewa.2.remedy=make a stūpa and an image of Vajrapāṇi (ཕྱག་རྡོར, phyag rdor), and the result is changed
reading.DeadRebirthMewa.3=Died on the three blue: the dead is born an ox or a snowcock; turned, a girl of another tongue in the west.
reading.DeadRebirthMewa.3.remedy=give the hundred-syllable Vajrasattva and alms
reading.DeadRebirthMewa.4=Died on the four green: the dead takes a cuckoo's body; turned, a rich man's daughter in the west.
reading.DeadRebirthMewa.4.remedy=make an image of Vajrapāṇi (ཕྱག་རྡོར, phyag rdor), and stamp clay votive images (ཚ་ཚ, tsha tsha)
reading.DeadRebirthMewa.5=Died on the five yellow: the dead is born a monkey or a cock; turned, a man in the south.
reading.DeadRebirthMewa.5.remedy=make an image of the Sage, and recite the Diamond Cutter (རྡོར་གཅོད, rdor gcod)
reading.DeadRebirthMewa.6=Died on the six white: the dead is born a bad person or a girl; turned, one with good qualities in the south.
reading.DeadRebirthMewa.6.remedy=make an image of the Sugata Uṣṇīṣa as the la's image
reading.DeadRebirthMewa.7=Died on the seven red: the dead is born a demon or a wolf; turned, a monk.
reading.DeadRebirthMewa.7.remedy=make an image of Tārā (སྒྲོལ་མ, sgrol ma)
reading.DeadRebirthMewa.8=Died on the eight white: the dead takes a woman's body; turned, a sculptor of gods.
reading.DeadRebirthMewa.8.remedy=make an image of the Teacher
reading.DeadRebirthMewa.9=Died on the nine red: the dead is born a dog or a donkey; turned, a rich man in the southern land of Mon (མོན, mon).
reading.DeadRebirthMewa.9.remedy=make an image of Mañjuśrī (འཇམ་དབྱངས, 'jam dbyangs), and recite dhāraṇīs
# The thirteen circles (ROADMAP R2u; WB vol. 2, ch. 27, pp. 3–21; the notes, p. 533; D19, D20).
Circle.KING=the white garuḍa, for the king
Circle.SPIRITUAL_FRIENDS=the white snow lioness, for spiritual friends
Circle.MANTRINS=the yellow snake, for mantra-holders
Circle.BON_PRIESTS=the turquoise dragon, for Bon (བོན, bon) priests
Circle.MINISTERS=the steadfast elephant, for ministers and officials
Circle.YOUNG_MEN=the striped iron tiger, for young men
Circle.WOMEN=the red bird, for noble ladies
Circle.CHILDREN=the blazing jewel, for children
Circle.YOUNG_WOMEN=the blue peacock, for young women
Circle.SERVANTS=the golden rat, for servants
Circle.LAND=the yellow divine sheep, for land and treasury
Circle.STORED_GOODS=the golden vase, for stored goods
Circle.LIVESTOCK=the great wild yak, for livestock
reading.CirclePebble={0} Each circle (དཔྱད་ལྡིང, dpyad lding) is counted upward from its starting year by the years one has lived, and the year reached is fought against one's own aspects.
reading.CirclePebble.KING.VITALITY.WHITE=The king's vitality pebble is white: his dynasty's seat is not empty, and his rule meets no obstacle. His life is firm as a rock of meteoric-iron vajra.
reading.CirclePebble.KING.VITALITY.BLACK=The king's vitality pebble is black: the lord and his line waste away and die out. The forefathers' grave spirits (དུར་སྲི, dur sri) were there of old, and now the spirits of the prime (དར་སྲི, dar sri) have risen.
reading.CirclePebble.KING.VITALITY.BLACK.remedy=let five or three mantra-holders or Bon (བོན, bon) priests of another clan press down the harmful spirits of the dead (སྲི, sri); ransom the life of animals and ransom death; press down the spirits of the prime (དར་སྲི, dar sri) in a lion's skull, and make the ransom rite (གཏོ, gto) of the king's seat
reading.CirclePebble.KING.BODY.WHITE=The king's body pebble is white: his tiger-and-leopard pride grows, and a prince is born who overawes appearance and existence. His own body is free of illness.
reading.CirclePebble.KING.BODY.BLACK=The king's body pebble is black: his smile fades. Discord comes between him and the queens, or father and son split the realm in two. Illness comes to his body.
reading.CirclePebble.KING.BODY.BLACK.remedy=give widely without partiality, change the body and keep the vows
reading.CirclePebble.KING.DESTINY.WHITE=The king's destiny pebble is white: his realm's affairs are not lost to outsiders, and enjoyments grow from every side. Its image is the silk knot of the rule not loosened.
reading.CirclePebble.KING.DESTINY.BLACK=The king's destiny pebble is black: the palace's affairs slip away, and wealth and livestock are scattered by loss. Its image is the white silk knot of the rule loosened.
reading.CirclePebble.KING.DESTINY.BLACK.remedy=summon fortune, give, and make feast offerings (ཚོགས, tshogs)
reading.CirclePebble.KING.LUCK.WHITE=The king's luck pebble is white: people speak kindly of him, and ministers and subjects do as they are told. Its image is the palace not lost to others.
reading.CirclePebble.KING.LUCK.BLACK=The king's luck pebble is black: gossip blows the realm about like the wind, and strife brings disputes over the rule. Its image is the palace lost to others.
reading.CirclePebble.KING.LUCK.BLACK.remedy=turn back and press down the enemy, and give the best food offerings
reading.CirclePebble.SPIRITUAL_FRIENDS.VITALITY.WHITE=The spiritual friend's vitality pebble is white: no obstacle comes to his life, and the lama's blessing enters him. Its image is the golden vajra not gone up into the sky.
reading.CirclePebble.SPIRITUAL_FRIENDS.VITALITY.BLACK=The spiritual friend's vitality pebble is black: an obstacle comes to his life before his power reaches its height. Its image is the golden vajra gone up into the sky.
reading.CirclePebble.SPIRITUAL_FRIENDS.VITALITY.BLACK.remedy=strive at approach and accomplishment, make a great confession and purification (སྤོང་དག, spong dag), read the Hundred Thousand and hold ritual services (རིམ་གྲོ, rim gro)
reading.CirclePebble.SPIRITUAL_FRIENDS.BODY.WHITE=The spiritual friend's body pebble is white: the victory banner of the saffron robes is raised, and his blessing and glory grow. Its image is the vase not slipped from his hand.
reading.CirclePebble.SPIRITUAL_FRIENDS.BODY.BLACK=The spiritual friend's body pebble is black: his Dharma line is short, a severe illness comes to his body, and no fit disciples come. Its image is the vase slipped from his hand.
reading.CirclePebble.SPIRITUAL_FRIENDS.BODY.BLACK.remedy=accomplish the dhāraṇīs, turn back the demons (བདུད, bdud), change the body and renew the vows, and recite the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs)
reading.CirclePebble.SPIRITUAL_FRIENDS.DESTINY.WHITE=The spiritual friend's destiny pebble is white: he plays in the magic dance of the profound meaning, and disciples and enjoyments flourish greatly. Its image is the crystal rosary's thread not broken.
reading.CirclePebble.SPIRITUAL_FRIENDS.DESTINY.BLACK=The spiritual friend's destiny pebble is black: disciples and enjoyments do not flourish, and helping others meets great obstacles. Its image is the crystal rosary's thread broken.
reading.CirclePebble.SPIRITUAL_FRIENDS.DESTINY.BLACK.remedy=recite diligently, give food and wealth widely, bestow empowerments, and make a threefold confession and purification (སྤོང་དག, spong dag)
reading.CirclePebble.SPIRITUAL_FRIENDS.LUCK.WHITE=The spiritual friend's luck pebble is white: his fame and qualities bloom like flowers, and students and disciples flourish. Its image is the precious turquoise maṇḍala not ruined at its rim.
reading.CirclePebble.SPIRITUAL_FRIENDS.LUCK.BLACK=The spiritual friend's luck pebble is black: gossip comes, with the fear of slander. Its image is the turquoise maṇḍala ruined at its rim.
reading.CirclePebble.SPIRITUAL_FRIENDS.LUCK.BLACK.remedy=make offerings before the three supports, offer robes and pray, clear the narrow paths, teach the Dharma and strive at white virtue
reading.CirclePebble.MANTRINS.VITALITY.WHITE=The mantra-holder's vitality pebble is white: his life is firm, he holds the line well, and his pledges are unbroken. Its image is the golden vajra not gone up into the sky.
reading.CirclePebble.MANTRINS.VITALITY.BLACK=The mantra-holder's vitality pebble is black: the line-holder may be cut off midway, and a broken pledge may bring an obstacle to life. Its image is the golden vajra gone into the sky.
reading.CirclePebble.MANTRINS.VITALITY.BLACK.remedy=practise approach and accomplishment and the phurba (ཕུར་པ, phur pa), recite, and make fulfilment and confession to the protectors, an ablution and the rite of mending broken pledges
reading.CirclePebble.MANTRINS.BODY.WHITE=The mantra-holder's body pebble is white: no illness comes, and appearance and existence gather under his power. Its image is the bell's sweet voice not broken.
reading.CirclePebble.MANTRINS.BODY.BLACK=The mantra-holder's body pebble is black: illness comes to his body, and his power stays small however he strives. Its image is the bell's voice broken.
reading.CirclePebble.MANTRINS.BODY.BLACK.remedy=paint or erect an image of the tutelary deity (ཡི་དམ, yi dam), make the rite of fulfilling what is broken, clear the path with clay votive images (ཚ་ཚ, tsha tsha) and read the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs)
reading.CirclePebble.MANTRINS.DESTINY.WHITE=The mantra-holder's destiny pebble is white: the son is better than the father, and by fierce mantras the eight classes (སྡེ་བརྒྱད, sde brgyad) are made servants. Its image is the maṇḍala's lustre not faded.
reading.CirclePebble.MANTRINS.DESTINY.BLACK=The mantra-holder's destiny pebble is black: great obstacles come when he brings out his power, and food and wealth are lost. Its image is the maṇḍala's lustre faded.
reading.CirclePebble.MANTRINS.DESTINY.BLACK.remedy=move the place of practice and strive at meditation, recite fierce mantras and strive at the rites that restore the power
reading.CirclePebble.MANTRINS.LUCK.WHITE=The mantra-holder's luck pebble is white: by wrathful action he swiftly presses down every enemy, and his fame and power stand at their height. Its image is the dagger's blade not blunted.
reading.CirclePebble.MANTRINS.LUCK.BLACK=The mantra-holder's luck pebble is black: gossip and much talk fall on him, and others' curses and spells may come. Its image is the dagger's blade blunted.
reading.CirclePebble.MANTRINS.LUCK.BLACK.remedy=make the rite of turning back spells, fulfilment and confession, an ablution and the ransom rite (གཏོ, gto) against gossip, and offer a hundred thousand lamps
reading.CirclePebble.BON_PRIESTS.VITALITY.WHITE=The Bon (བོན, bon) priest's vitality pebble is white: his line is not cut, his life is long, and fortune gathers. Its image is the meteoric-iron coral not carried off.
reading.CirclePebble.BON_PRIESTS.VITALITY.BLACK=The Bon (བོན, bon) priest's vitality pebble is black: his line declines, a small child is at risk of death, and the line may lose its holder. Its image is the meteoric-iron coral carried off.
reading.CirclePebble.BON_PRIESTS.VITALITY.BLACK.remedy=restore fortune and prosperity (ཕྱྭ་གཡང, phywa g.yang), make fulfilment and confession, and make offerings to the gods and protectors
reading.CirclePebble.BON_PRIESTS.BODY.WHITE=The Bon (བོན, bon) priest's body pebble is white: his line is longer than a river, and his descendants are unbroken. Its image is the god-arrow's white feathers not broken at the waist.
reading.CirclePebble.BON_PRIESTS.BODY.BLACK=The Bon (བོན, bon) priest's body pebble is black: his line is short and without fortune, and his descendants waste away. Its image is the god-arrow broken at the waist.
reading.CirclePebble.BON_PRIESTS.BODY.BLACK.remedy=restore the god-castle (གསས་མཁར, gsas mkhar), raise the body and fasten the wheel that holds the root of the generations
reading.CirclePebble.BON_PRIESTS.DESTINY.WHITE=The Bon (བོན, bon) priest's destiny pebble is white: he protects with power, and though the power is small his existence is wide. Its image is the drum and cymbal not slipped from his hand.
reading.CirclePebble.BON_PRIESTS.DESTINY.BLACK=The Bon (བོན, bon) priest's destiny pebble is black: his pledges are polluted, so sons and wealth are lost and livestock die. Its image is the drum and cymbal slipped from his hand.
reading.CirclePebble.BON_PRIESTS.DESTINY.BLACK.remedy=fulfil what is broken, stir the pit (དོང་དཀྲུགས, dong dkrugs), make the long-life rite and ransom death, and recite the Sūtra of Long Life (ཚེ་མདོ, tshe mdo)
reading.CirclePebble.BON_PRIESTS.LUCK.WHITE=The Bon (བོན, bon) priest's luck pebble is white: his fame and disciples spread in the ten directions. Its image is the priest of fortune (ཕྱྭ་བོན, phywa bon) firm on his seat.
reading.CirclePebble.BON_PRIESTS.LUCK.BLACK=The Bon (བོན, bon) priest's luck pebble is black: his own fortune declines, and blame and hostile talk come without fault. Its image is the priest of fortune (ཕྱྭ་བོན, phywa bon) slid from his seat.
reading.CirclePebble.BON_PRIESTS.LUCK.BLACK.remedy=make the fierce three-headed turning back, and above all meet and turn back the grave spirits (དུར་སྲི, dur sri)
reading.CirclePebble.MINISTERS.VITALITY.WHITE=The minister's vitality pebble is white: the king's affection stays with him, his intelligence knows no end, and no obstacle comes now. He carries out the lord's work and sets the subjects in happiness.
reading.CirclePebble.MINISTERS.VITALITY.BLACK=The minister's vitality pebble is black: he is parted from the king's affection, and an obstacle to life has come. Harmful spirits of the dead (སྲི, sri) are there, and his line may be cut off.
reading.CirclePebble.MINISTERS.VITALITY.BLACK.remedy=press down the harmful spirits of the dead (སྲི, sri), turn back the enemy, and read the Hundred Thousand against the spirits of enmity (དགྲ་སྲི, dgra sri)
reading.CirclePebble.MINISTERS.BODY.WHITE=The minister's body pebble is white: the god he relies on sends no punishment, and the war god (དགྲ་ལྷ, dgra lha) stands behind him as a friend. His line flourishes.
reading.CirclePebble.MINISTERS.BODY.BLACK=The minister's body pebble is black: the protectors punish him with a chronic illness or a burden beyond his strength. Harmful spirits of the dead (སྲི, sri) have risen, a sign that the clan's line will be cut.
reading.CirclePebble.MINISTERS.BODY.BLACK.remedy=honour the gods, press down the harmful spirits of the dead (སྲི, sri), make the ransom rite (གཏོ, gto) against gossip and fasten a protection against those spirits
reading.CirclePebble.MINISTERS.DESTINY.WHITE=The minister's destiny pebble is white: food and wealth grow, and every wish is fulfilled. Its image is the records' gold and turquoise not lost.
reading.CirclePebble.MINISTERS.DESTINY.BLACK=The minister's destiny pebble is black: his early flourishing is short. A punishment from the king or a loss of food and wealth may come. Its image is the records' gold and turquoise lost.
reading.CirclePebble.MINISTERS.DESTINY.BLACK.remedy=summon fortune, press down the harmful spirits of the dead (སྲི, sri), and recite the Stream of Wealth (ནོར་རྒྱུན, nor rgyun)
reading.CirclePebble.MINISTERS.LUCK.WHITE=The minister's luck pebble is white: his courage is great, his life is long and illness is rare. Its image is the arrow and spear unbroken.
reading.CirclePebble.MINISTERS.LUCK.BLACK=The minister's luck pebble is black: the la, the life-spirit (བླ, bla), of his father, his uncles and himself declines, and an obstacle to life is feared. Its image is the arrow and spear broken.
reading.CirclePebble.MINISTERS.LUCK.BLACK.remedy=ransom the la, the life-spirit (བླ, bla), praise the gods, summon fortune and ransom the life
reading.CirclePebble.YOUNG_MEN.VITALITY.WHITE=The young man's vitality pebble is white: he is brilliant and radiant with the striped tiger's pattern on him, and he lives out his life. Its image is the life-arrow not broken at the waist.
reading.CirclePebble.YOUNG_MEN.VITALITY.BLACK=The young man's vitality pebble is black: the spirits of the prime (དར་སྲི, dar sri) have risen. Weapons threaten the life of him, his father or his brothers. Its image is the life-arrow broken at the waist.
reading.CirclePebble.YOUNG_MEN.VITALITY.BLACK.remedy=ransom the life, recite, make the long-life rite, turn the weapon aside with a stag's horn, receive the long-life empowerment and press down the spirits of the prime (དར་སྲི, dar sri)
reading.CirclePebble.YOUNG_MEN.BODY.WHITE=The young man's body pebble is white: the tiger-skin adorns his body like dress, and four sons are born. Its image is the tiger-skin and leopard-quiver not loosened at the waist.
reading.CirclePebble.YOUNG_MEN.BODY.BLACK=The young man's body pebble is black: quarrels come, and after this flourishing, illness and epidemics follow. Journeys abroad go badly. Its image is the tiger-skin loosened at the waist.
reading.CirclePebble.YOUNG_MEN.BODY.BLACK.remedy=fasten the wheel that guards against epidemics and holds the root of the generations, turn back, and make clay votive images (ཚ་ཚ, tsha tsha) to the number of his years
reading.CirclePebble.YOUNG_MEN.DESTINY.WHITE=The young man's destiny pebble is white: food and wealth come together, and the paternal clan flourishes. Its image is the spear and bow unbroken, a white silk on the spear.
reading.CirclePebble.YOUNG_MEN.DESTINY.BLACK=The young man's destiny pebble is black: great rise, decline and loss come, and his wealth and lands slip away. Its image is the spear and bow broken.
reading.CirclePebble.YOUNG_MEN.DESTINY.BLACK.remedy=fasten the wheel that raises the power on his body, set up torma (གཏོར་མ, gtor ma) images for the male god and the war god (དགྲ་ལྷ, dgra lha), press down the harmful spirits of the dead (སྲི, sri) and summon fortune
reading.CirclePebble.YOUNG_MEN.LUCK.WHITE=The young man's luck pebble is white: people speak kindly of him, no strife or war comes, and his wishes are fulfilled. Its image is the young man not parted from his horse.
reading.CirclePebble.YOUNG_MEN.LUCK.BLACK=The young man's luck pebble is black: gossip strikes, and quarrels break out among brothers and sisters. Its image is the young man parted from his horse.
reading.CirclePebble.YOUNG_MEN.LUCK.BLACK.remedy=make rites, restore the luck, press down the spirits of enmity (དགྲ་སྲི, dgra sri) and set up the dhāraṇī against gossip
reading.CirclePebble.WOMEN.VITALITY.WHITE=The noble lady's vitality pebble is white: her life is long, her line gains greatly, and she achieves what she wishes. Its image is the white silk fringe not frayed at its edge.
reading.CirclePebble.WOMEN.VITALITY.BLACK=The noble lady's vitality pebble is black: the mother's spirits (མས་སྲི, mas sri) have risen, and an obstacle to life is feared. Its image is the white silk fringe frayed at its edge.
reading.CirclePebble.WOMEN.VITALITY.BLACK.remedy=restore the line's luck, fasten the wheel that holds life, plant the life-dagger, and strive at the ransom rite (གཏོ, gto) and the ritual services (རིམ་གྲོ, rim gro) that raise the vitality
reading.CirclePebble.WOMEN.BODY.WHITE=The noble lady's body pebble is white: sons and wealth come together, and no illness comes. Its image is the turquoise hanging-cord not cut.
reading.CirclePebble.WOMEN.BODY.BLACK=The noble lady's body pebble is black: harm comes to her son and husband, illness comes, and work begun is not achieved. Its image is the turquoise hanging-cord cut.
reading.CirclePebble.WOMEN.BODY.BLACK.remedy=fasten the wheel that raises the body, and recite the White Uṣṇīṣa (གཙུག་ཏོར་དཀར་མོ, gtsug tor dkar mo) many times
reading.CirclePebble.WOMEN.DESTINY.WHITE=The noble lady's destiny pebble is white: her paternal name flourishes, and her dominion and enjoyments grow. Its image is the sun of glory not set behind the hill.
reading.CirclePebble.WOMEN.DESTINY.BLACK=The noble lady's destiny pebble is black: great rise and decline come to her paternal name, and her relatives give little help. Its image is the sun of glory set.
reading.CirclePebble.WOMEN.DESTINY.BLACK.remedy=press down the spirits of losses (གོད་སྲི, god sri), fasten the raising of the power, give to the poor, and make the turning back and the rite that raises glory
reading.CirclePebble.WOMEN.LUCK.WHITE=The noble lady's luck pebble is white: her fame is great, people speak kindly of her, and her wishes are fulfilled. Its image is the spring of existence not dried.
reading.CirclePebble.WOMEN.LUCK.BLACK=The noble lady's luck pebble is black: epidemics come, her home moves, and she meets hostile talk and blame without fault. Its image is the spring of existence dried.
reading.CirclePebble.WOMEN.LUCK.BLACK.remedy=fasten the raising of the luck, build a fortune enclosure (གཡང་ར, g.yang ra), and strive at the ransom, the turning back and the raising of the luck
reading.CirclePebble.CHILDREN.VITALITY.WHITE=The child's vitality pebble is white: boys and girls grow, and no obstacle comes to the child's life. Its image is the swastika fence unbroken.
reading.CirclePebble.CHILDREN.VITALITY.BLACK=The child's vitality pebble is black: illness and suffering come. Its image is the swastika fence broken at the waist.
reading.CirclePebble.CHILDREN.VITALITY.BLACK.remedy=receive the long-life empowerment, recite the Sūtra of Long Life (ཚེ་མདོ, tshe mdo), and make the ransom rite (གཏོ, gto) with the planting of the dagger of existence
reading.CirclePebble.CHILDREN.BODY.WHITE=The child's body pebble is white: no illness or demon comes to the child's body. Its image is the golden fish not out on dry land.
reading.CirclePebble.CHILDREN.BODY.BLACK=The child's body pebble is black: oppression comes, and spirits of the mother's kin do harm. Its image is the golden fish out on dry land.
reading.CirclePebble.CHILDREN.BODY.BLACK.remedy=press down the harmful spirits of the dead (སྲི, sri), fasten the wheel that raises the body, build a stūpa and make offerings to the nāgas (ཀླུ, klu)
reading.CirclePebble.CHILDREN.DESTINY.WHITE=The child's destiny pebble is white: food and wealth grow, a sign that loving people come in pairs. Its image is the little silk garment not carried off by water.
reading.CirclePebble.CHILDREN.DESTINY.BLACK=The child's destiny pebble is black: it is a sign of a funeral, and it goes badly for both sexes. Its image is the little garment carried off by water.
reading.CirclePebble.CHILDREN.DESTINY.BLACK.remedy=press down the spirits of small children (ཆུང་སྲི, chung sri), and give the half-worn little garment to someone
reading.CirclePebble.CHILDREN.LUCK.WHITE=The child's luck pebble is white: the gods' rank is set up, and the gods keep watch over the child. Its image is the children's playground not empty.
reading.CirclePebble.CHILDREN.LUCK.BLACK=The child's luck pebble is black: the gods' rank is broken, and the god it relies on is struck by defilement (གྲིབ, grib). A death is feared. Its image is the children's playground empty.
reading.CirclePebble.CHILDREN.LUCK.BLACK.remedy=restore the luck, make an ablution and honour the gods; repair the roads, the bridges and the three narrow passes
reading.CirclePebble.YOUNG_WOMEN.VITALITY.WHITE=The young woman's vitality pebble is white: her life is long, her existence grows, and no illness or demon comes. Its image is the blue spring not dried.
reading.CirclePebble.YOUNG_WOMEN.VITALITY.BLACK=The young woman's vitality pebble is black: harm comes to her life. Its image is the blue spring dried.
reading.CirclePebble.YOUNG_WOMEN.VITALITY.BLACK.remedy=recite Amitāyus (ཚེ་དཔག་མེད, tshe dpag med) and receive the long-life empowerment; let three Bon (བོན, bon) priests of different clans ransom the life and make the long-life horse (ཚེ་རྟ, tshe rta)
reading.CirclePebble.YOUNG_WOMEN.BODY.WHITE=The young woman's body pebble is white: no illness comes, mother and children help one another, and her existence grows. Its image is the flower not carried off by frost.
reading.CirclePebble.YOUNG_WOMEN.BODY.BLACK=The young woman's body pebble is black: her existence does not grow, illness strikes, and her family rises and declines. Its image is the flower carried off by frost.
reading.CirclePebble.YOUNG_WOMEN.BODY.BLACK.remedy=fasten the wheel that changes and raises the body
reading.CirclePebble.YOUNG_WOMEN.DESTINY.WHITE=The young woman's destiny pebble is white: the lovely girl flourishes, and her ornaments and clothes grow. Its image is the swastika fence not torn.
reading.CirclePebble.YOUNG_WOMEN.DESTINY.BLACK=The young woman's destiny pebble is black: it goes badly for the girl and for her neighbours. Its image is the swastika fence torn.
reading.CirclePebble.YOUNG_WOMEN.DESTINY.BLACK.remedy=recite the dhāraṇī that increases jewels, press down the spirits of losses (གོད་སྲི, god sri), summon fortune and make many kinds of turning back
reading.CirclePebble.YOUNG_WOMEN.LUCK.WHITE=The young woman's luck pebble is white: she finds a good home, and all love her. Its image is the white silver mirror not cracked at its base.
reading.CirclePebble.YOUNG_WOMEN.LUCK.BLACK=The young woman's luck pebble is black: gossip blows about like wool, and it goes badly for her mother and sisters. Its image is the white silver mirror cracked.
reading.CirclePebble.YOUNG_WOMEN.LUCK.BLACK.remedy=fasten the wheel that raises the luck on her body, and offer a hundred lamps
reading.CirclePebble.SERVANTS.VITALITY.WHITE=The servant's vitality pebble is white: he helps greatly, and it is a sign of long life and fortune. Its image is the five arrows and the bow not lost from his hand.
reading.CirclePebble.SERVANTS.VITALITY.BLACK=The servant's vitality pebble is black: the lord's punishment threatens, his fortune declines and his life is cut off. Its image is the five arrows and the bow lost.
reading.CirclePebble.SERVANTS.VITALITY.BLACK.remedy=fasten the wheel that holds life, and press down the spirits of losses (གོད་སྲི, god sri)
reading.CirclePebble.SERVANTS.BODY.WHITE=The servant's body pebble is white: no punishment comes from lord and ministers, and he is at ease. His work goes as he wishes, and no illness comes.
reading.CirclePebble.SERVANTS.BODY.BLACK=The servant's body pebble is black: the punishment of lord and ministers falls on him, gossip follows him, and much illness and suffering come.
reading.CirclePebble.SERVANTS.BODY.BLACK.remedy=fasten the wheel that raises the body, and make offerings to the gods and protectors
reading.CirclePebble.SERVANTS.DESTINY.WHITE=The servant's destiny pebble is white: though he lacks faculties, he helps his master widely, and food and wealth come together. Its image is the man's house not covered by mist.
reading.CirclePebble.SERVANTS.DESTINY.BLACK=The servant's destiny pebble is black: great losses of wealth come, and horses and livestock are lost. Its image is the man's house covered by mist.
reading.CirclePebble.SERVANTS.DESTINY.BLACK.remedy=summon fortune, make an ablution and recite the Stream of Wealth (ནོར་རྒྱུན, nor rgyun) many times
reading.CirclePebble.SERVANTS.LUCK.WHITE=The servant's luck pebble is white: the lord does not fall to demons, and people speak kindly of the servant. Sons and wealth come to him.
reading.CirclePebble.SERVANTS.LUCK.BLACK=The servant's luck pebble is black: a burden he cannot bear, a punishment from above or gossip without fault may fall on him.
reading.CirclePebble.SERVANTS.LUCK.BLACK.remedy=dig out gossip and enemies, and repair the narrow paths
reading.CirclePebble.LAND.VITALITY.WHITE=The land's vitality pebble is white: the paternal estate and home are not moved, and the son keeps and holds this good land.
reading.CirclePebble.LAND.VITALITY.BLACK=The land's vitality pebble is black: the home and land move, and the land is split. Earth lords (ས་བདག, sa bdag) and nāgas (ཀླུ, klu) do harm, and moving from the land goes badly.
reading.CirclePebble.LAND.VITALITY.BLACK.remedy=put in the treasure of the eight great nāgas (ཀླུ, klu), and send the thread-cross (མདོས, mdos) of the earth lords (ས་བདག, sa bdag)
reading.CirclePebble.LAND.BODY.WHITE=The land's body pebble is white: the male god's banner stands on the castle, and castle and owner are not parted. Its image is the castle's peak god not gone up.
reading.CirclePebble.LAND.BODY.BLACK=The land's body pebble is black: the castle's site and line are cut off, or defilement (གྲིབ, grib) strikes. Its image is the castle's god gone up from the peak.
reading.CirclePebble.LAND.BODY.BLACK.remedy=praise the war god (དགྲ་ལྷ, dgra lha)
reading.CirclePebble.LAND.DESTINY.WHITE=The land's destiny pebble is white: though the kitchen is miserly, the guests are well satisfied. Its image is the cook not turned away.
reading.CirclePebble.LAND.DESTINY.BLACK=The land's destiny pebble is black: the nourishment of food is small. Its image is the cook turned away.
reading.CirclePebble.LAND.DESTINY.BLACK.remedy=hide the wheel of the mixed mewa (སྨེ་བ, sme ba) under the hearth, and fasten the raising of the power on the cook
reading.CirclePebble.LAND.LUCK.WHITE=The land's luck pebble is white: the father's land is firm, and no illness or gossip comes to the household. Its image is the golden pillar and turquoise beam unbroken.
reading.CirclePebble.LAND.LUCK.BLACK=The land's luck pebble is black: hostile talk comes, and the house may collapse. Its image is the golden pillar broken and the turquoise beam burnt.
reading.CirclePebble.LAND.LUCK.BLACK.remedy=gather the heart of the abode of the earth lords (ས་བདག, sa bdag), and restore the luck
reading.CirclePebble.STORED_GOODS.VITALITY.WHITE=The stored goods' vitality pebble is white: the goods spent are now an inexhaustible treasure. Its image is the golden mirror free of stain.
reading.CirclePebble.STORED_GOODS.VITALITY.BLACK=The stored goods' vitality pebble is black: dry goods decline, or a gongpo spirit (འགོང་པོ, 'gong po) follows for the sake of one shining thing. Its image is the mirror tarnished with rust and dirt.
reading.CirclePebble.STORED_GOODS.VITALITY.BLACK.remedy=press down the spirits of losses (གོད་སྲི, god sri), and recite the Stream of Wealth (ནོར་རྒྱུན, nor rgyun)
reading.CirclePebble.STORED_GOODS.BODY.WHITE=The stored goods' body pebble is white: the body is adorned with turquoise, and ornaments and clothes grow. Its image is the turquoise lake of great light not breached.
reading.CirclePebble.STORED_GOODS.BODY.BLACK=The stored goods' body pebble is black: the mouth of fortune is breached, and the shining things are lost to outsiders. Its image is the turquoise lake of great light breached.
reading.CirclePebble.STORED_GOODS.BODY.BLACK.remedy=summon fortune, accomplish the god of wealth and restore glory
reading.CirclePebble.STORED_GOODS.DESTINY.WHITE=The stored goods' destiny pebble is white: the son enjoys his father's consecrated goods, and wealth gathers from every side.
reading.CirclePebble.STORED_GOODS.DESTINY.BLACK=The stored goods' destiny pebble is black: the son lets his parents' enjoyments decline. Whatever he does shows poverty, and fortune declines.
reading.CirclePebble.STORED_GOODS.DESTINY.BLACK.remedy=put the wheel that raises the power in the storeroom, and make a fortune rite with offerings at the hearth
reading.CirclePebble.STORED_GOODS.LUCK.WHITE=The stored goods' luck pebble is white: the line is famous from before, and the son is more famous than the father. Its image is the fortune-turquoise's eye-cord not cut.
reading.CirclePebble.STORED_GOODS.LUCK.BLACK=The stored goods' luck pebble is black: a shining jewel slips to others. Its image is the fortune-turquoise's white silk eye-cord cut.
reading.CirclePebble.STORED_GOODS.LUCK.BLACK.remedy=restore the luck, press down the spirits of small children (ཆུང་སྲི, chung sri), and make the smoke offering (བསང, bsang) and the clearing
reading.CirclePebble.LIVESTOCK.VITALITY.WHITE=The livestock's vitality pebble is white: horses and donkeys are strong and useful, and good horses come in the valley below. Its image is the horse's saddle and bridle not empty.
reading.CirclePebble.LIVESTOCK.VITALITY.BLACK=The livestock's vitality pebble is black: great losses of horses come, and a horse like a lion becomes worse than a village donkey. Its image is the horse's saddle and bridle empty.
reading.CirclePebble.LIVESTOCK.VITALITY.BLACK.remedy=recite the horse dhāraṇī, and make the rite of the eight yakṣas (གནོད་སྦྱིན, gnod sbyin)
reading.CirclePebble.LIVESTOCK.BODY.WHITE=The livestock's body pebble is white: horses and livestock increase greatly into an inexhaustible treasure, and the young help much.
reading.CirclePebble.LIVESTOCK.BODY.BLACK=The livestock's body pebble is black: the herds do not increase, and foals are not conceived or are lost once conceived.
reading.CirclePebble.LIVESTOCK.BODY.BLACK.remedy=press down the horse spirits (རྟ་སྲི, rta sri), and send a livestock ransom (གླུད, glud)
reading.CirclePebble.LIVESTOCK.DESTINY.WHITE=The livestock's destiny pebble is white: divine yaks come, large livestock are not lost, and the son is better than the father. Its image is the great yak's tail-hair not shed.
reading.CirclePebble.LIVESTOCK.DESTINY.BLACK=The livestock's destiny pebble is black: it goes badly for the large livestock, and fortune declines. Its image is the great yak's tail-hair shed.
reading.CirclePebble.LIVESTOCK.DESTINY.BLACK.remedy=recite the wealth dhāraṇī, and press down the spirits of losses (གོད་སྲི, god sri)
reading.CirclePebble.LIVESTOCK.LUCK.WHITE=The livestock's luck pebble is white: large livestock increase greatly without losses, and the females conceive well. Its image is the divine female yak not rolled down the cliff.
reading.CirclePebble.LIVESTOCK.LUCK.BLACK=The livestock's luck pebble is black: the female livestock do not increase, and gossip pierces. Its image is the divine female yak rolled down the cliff.
reading.CirclePebble.LIVESTOCK.LUCK.BLACK.remedy=make many ransom rites (གཏོ, gto) against gossip
# The thirty starting points (ROADMAP R2v; WB vol. 1, ch. 26, pp. 453–473; the notes, vol. 2, pp. 532–533; D21–D23).
ThirtyPoint.LORDS=the garuḍa, for lords and kings
ThirtyPoint.SPIRITUAL_FRIENDS=the white snow lioness, for spiritual friends
ThirtyPoint.MANTRINS=the poisonous snake of existence, for mantra-holders
ThirtyPoint.BON_PRIESTS=the turquoise dragon, for Bon (བོན, bon) priests
ThirtyPoint.ELDERS=the elephant of the earth, for the chief elders
ThirtyPoint.YOUNG_MEN=the striped Chinese tiger, for young men
ThirtyPoint.WIVES=the red copper ogress, for wives and women
ThirtyPoint.SMALL_CHILDREN=the five-pointed golden vajra, for small children
ThirtyPoint.GIRLS=the adorned parrot, for young women and girls
ThirtyPoint.SUBJECTS=the palace of the nine continents, for subjects and servants
ThirtyPoint.HORSES=the precious supreme horse, for horses
ThirtyPoint.LIVESTOCK=the young wild yak on the blue goat, for wealth and livestock
ThirtyPoint.COUPLE=the golden vase, for husband and wife
ThirtyPoint.BRIDE=the Chinese peacock with crossed necks, for the bride's going
ThirtyPoint.HOUSE=the garuḍa head on the temple roof, for the house
ThirtyPoint.GROUND=the eight golden continents, for the ground
ThirtyPoint.ARMOUR_VESSEL=the blazing jewel, for armour and the copper vessel
ThirtyPoint.LA_TREE=the tree in full leaf, for the la tree (བླ་ཤིང, bla shing) or a child's existence
ThirtyPoint.HELPING_GOD=the divine owl, for the helping god
ThirtyPoint.HARMING_SPIRIT=the black grave bird, for the harming spirit
ThirtyPoint.OLD=the great deer, for the old
ThirtyPoint.SICK=the sick lying askew, for the sick
ThirtyPoint.DEAD=the red corpse, for the dead
ThirtyPoint.BURNING=the pale wooden box, for burning or keeping the remains
ThirtyPoint.GRAVE_SITE=the nine stacked skulls, for the grave site
ThirtyPoint.RITES=the three-headed earth lord (ས་བདག, sa bdag), for the rites
ThirtyPoint.MEN_LIFE_FORCE=the golden crossed vajra, for men's life force (སྲོག, srog)
ThirtyPoint.CHILDREN_BODY=the eight-spoked wheel, for children's body (ལུས, lus)
ThirtyPoint.WOMEN_POWER=the coiled swastika (གཡུང་དྲུང, g.yung drung), for women's destiny (དབང་ཐང, dbang thang)
ThirtyPoint.GREAT_MEN_LUCK=the eight-petalled lotus, for great men's luck (ཀླུང་རྟ, klung rta)
ThirtyBoard.UPPER_WHITE=the upper three white
ThirtyBoard.UPPER_BLACK=the upper three black
ThirtyBoard.LOWER_WHITE=the lower three white
ThirtyBoard.LOWER_BLACK=the lower three black
ThirtyBoard.MIDDLE_WHITE=the middle two white
ThirtyBoard.MIDDLE_BLACK=the middle two black
ThirtyBoard.UPPER_WHITE_LOWER_BLACK=the upper white, the lower black
ThirtyBoard.UPPER_BLACK_LOWER_WHITE=the upper black, the lower white
ThirtyBoard.OUTER_BLACK_MIDDLE_WHITE=the upper and lower black, the middle white
ThirtyBoard.OUTER_WHITE_MIDDLE_BLACK=the upper and lower white, the middle black
ThirtyBoard.ALL_WHITE=all eight white
ThirtyBoard.ALL_BLACK=all eight black
reading.ThirtyBoard={0} The board of a starting point (སྐོར་འགོ, skor 'go) is read whole after its eight checks, and each group is read by its greater share.
reading.ThirtyBoard.UPPER_WHITE=The upper three pebbles are white: the first part of life and the forefathers' place are good.
reading.ThirtyBoard.UPPER_BLACK=The upper three pebbles are black: a rise and decline (དར་གུད, dar gud) of oneself and the forebears has come or will come early in life.
reading.ThirtyBoard.LOWER_WHITE=The lower three pebbles are white: the last part of life is good.
reading.ThirtyBoard.LOWER_BLACK=The lower three pebbles are black: it is bad for oneself and the last part of life.
reading.ThirtyBoard.MIDDLE_WHITE=The middle two pebbles are white: no spirits harm, and food, wealth and enjoyments grow.
reading.ThirtyBoard.MIDDLE_BLACK=The middle two pebbles are black: harm from spirits (གདོན, gdon) comes, and food and wealth fare badly.
reading.ThirtyBoard.UPPER_WHITE_LOWER_BLACK=The upper three are white and the lower three black: the forebears are good and oneself weak. The first part of life is good, the last bad.
reading.ThirtyBoard.UPPER_BLACK_LOWER_WHITE=The upper three are black and the lower three white: the forebears declined and oneself has risen, and happiness is full.
reading.ThirtyBoard.OUTER_BLACK_MIDDLE_WHITE=The upper and lower pebbles are black and the middle two white: no spirits harm, no wealth is lost, and wishes are fulfilled.
reading.ThirtyBoard.OUTER_WHITE_MIDDLE_BLACK=The upper and lower pebbles are white and the middle two black: food and wealth are lost, spirits harm, and the family dwindles.
reading.ThirtyBoard.OUTER_WHITE_MIDDLE_BLACK.remedy=press down the spirits of the prime (དར་སྲི, dar sri), and make the rite of the dagger against losses
reading.ThirtyBoard.ALL_WHITE=All eight pebbles are white: an unexpected fault comes, with enemies and envy from where none were expected.
reading.ThirtyBoard.ALL_WHITE.remedy=read the Hundred Thousand, take empowerment, clear the narrow paths, and strive at virtue
reading.ThirtyBoard.ALL_BLACK=All eight pebbles are black: the sky is torn and the earth shattered. The tree and lake of the la, the life-spirit (བླ, bla), dry up, and the la is carried off. Gossip gathers.
reading.ThirtyBoard.ALL_BLACK.remedy=as the ransom rite (གཏོ, gto), send the all-gathering secret rite (གསང་བ་ཀུན་འདུས, gsang ba kun 'dus)
reading.ThirtyCheck={0} Each starting point (སྐོར་འགོ, skor 'go) is counted from its pair of years by the years of age, and each check is one fighting pebble.
reading.ThirtyCheck.LORDS.1.WHITE=The first check for lords is white: the forefathers' place is good for eight generations. Its image is the blue vault of the sky not torn.
reading.ThirtyCheck.LORDS.1.BLACK=The first check for lords is black: a great rise and decline (དར་གུད, dar gud) comes in the forefathers' place. Its image is the blue vault of the sky torn from its height.
reading.ThirtyCheck.LORDS.2.WHITE=The second check for lords is white: the forefathers' place is good, the protector gods lead, and wishes are fulfilled without obstacle. Its image is the helmet kept.
reading.ThirtyCheck.LORDS.2.BLACK=The second check for lords is black: the forefathers die by the blade, and it is bad for the father and the uncles. Its image is the king's helmet fallen to the ground.
reading.ThirtyCheck.LORDS.3.WHITE=The third check for lords is white: no illness comes, and he is free of enemies. Its image is the palace's seat not empty.
reading.ThirtyCheck.LORDS.3.BLACK=The third check for lords is black and somewhat bad: there is a great risk of leaving his own country. If it happened before, it is borne. Its image is the palace's seat empty.
reading.ThirtyCheck.LORDS.4.WHITE=The fourth check for lords is white: wishes are fulfilled. Its image is the many mouths of the country's people not speaking of emptiness.
reading.ThirtyCheck.LORDS.4.BLACK=The fourth check for lords is black: gossip and quarrels rise. Its image is the many mouths of the country's people speaking of emptiness.
reading.ThirtyCheck.LORDS.4.BLACK.remedy=make the crowd's thread-cross (མདོས, mdos) and turn back the crowd
reading.ThirtyCheck.LORDS.5.WHITE=The fifth check for lords is white: servants obey, no revolt comes, and fame is won. Its image is the subjects not risen against the lord.
reading.ThirtyCheck.LORDS.5.BLACK=The fifth check for lords is black: the subjects revolt, servants disobey, and even the near rise as enemies. Its image is the subjects risen against the lord.
reading.ThirtyCheck.LORDS.5.BLACK.remedy=as the ransom rite (གཏོ, gto), plant the tree of the luck (ཀླུང་རྟ, klung rta), and send the life-castle (སྲོག་མཁར, srog mkhar) and the life ransom (གླུད, glud)
reading.ThirtyCheck.LORDS.6.WHITE=The sixth check for lords is white: bad people do not rise as enemies. Its image is the foot pebble not lost in the sky.
reading.ThirtyCheck.LORDS.6.BLACK=The sixth check for lords is black: subjects and bad people rise as enemies. Its image is the foot pebble lost in the sky.
reading.ThirtyCheck.LORDS.6.BLACK.remedy=lay down the rite against gossip (མི་ཁ, mi kha)
reading.ThirtyCheck.LORDS.7.WHITE=The seventh check for lords is white: even if the forefathers turned bad, his own place is full of happiness. Its image is the tiger's and leopard's stripes not faded.
reading.ThirtyCheck.LORDS.7.BLACK=The seventh check for lords is black: the forefathers were good, but he himself declines. What is there now is gone now, and what rose declines. Its image is the tiger's stripes faded.
reading.ThirtyCheck.LORDS.7.BLACK.remedy=send the all-gathering secret rite (གསང་བ་ཀུན་འདུས, gsang ba kun 'dus)
reading.ThirtyCheck.LORDS.8.WHITE=The eighth check for lords is white: though the forefathers declined, he himself is good and masters the five elements. Its image is the throne cushion not empty.
reading.ThirtyCheck.LORDS.8.BLACK=The eighth check for lords is black: the forefathers were good, but he himself declines, with talk of leaving the country. He has no power over the five elements. Its image is the throne cushion empty.
reading.ThirtyCheck.LORDS.8.BLACK.remedy=turn back, press down the spirits of enmity (དགྲ་སྲི, dgra sri), and proclaim the clearing of all faults
reading.ThirtyCheck.SPIRITUAL_FRIENDS.1.WHITE=The first check for spiritual friends is white: in the long run people and the Dharma increase. Its image is the lion throne not moved.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.1.BLACK=The first check for spiritual friends is black: a great rise and decline (དར་གུད, dar gud) comes in the father's and uncles' place, and one wanders abroad. One's own place is somewhat good. Its image is the lion seat fallen.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.2.WHITE=The second check for spiritual friends is white: his reputation grows. Its image is the silk curtain not leaking.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.2.BLACK=The second check for spiritual friends is black: the deceit and obstacles of the demons (བདུད, bdud) come. Its image is the silk curtain leaking.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.2.BLACK.remedy=make the hundred-and-four offering, and strive at the white side
reading.ThirtyCheck.SPIRITUAL_FRIENDS.3.WHITE=The third check for spiritual friends is white: reputation and merit grow, and the aims in mind are achieved. Its image is the gold and turquoise maṇḍala not broken.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.3.BLACK=The third check for spiritual friends is black: his reputation falls and blame comes. Disciples rise as enemies, and aims are not achieved. Its image is the turquoise maṇḍala broken.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.3.BLACK.remedy=strive at the virtue of the white side
reading.ThirtyCheck.SPIRITUAL_FRIENDS.4.WHITE=The fourth check for spiritual friends is white: no obstacle comes to his life. Its image is the string of the pearl rosary not cut.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.4.BLACK=The fourth check for spiritual friends is black: obstacles come to his life, and circumstances sweep him away. Its image is the string of the precious rosary cut.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.4.BLACK.remedy=as the ransom rite (གཏོ, gto), make the nine turnings back
reading.ThirtyCheck.SPIRITUAL_FRIENDS.5.WHITE=The fifth check for spiritual friends is white: there is no turning from the Dharma and no broken vow. Its image is the protecting mountain not fallen.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.5.BLACK=The fifth check for spiritual friends is black: even white acts go wrong. Its image is the protecting mountain fallen.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.5.BLACK.remedy=gather the accumulations, give, and strive at the white side
reading.ThirtyCheck.SPIRITUAL_FRIENDS.6.WHITE=The sixth check for spiritual friends is white: no obstacle comes to his life. Its image is the vase of life not lost from the hand.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.6.BLACK=The sixth check for spiritual friends is black: obstacles come to his life. Its image is the vase of life lost from the hand.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.6.BLACK.remedy=make the long-life rite, ransom death and practise long life
reading.ThirtyCheck.SPIRITUAL_FRIENDS.7.WHITE=The seventh check for spiritual friends is white: the war god (དགྲ་ལྷ, dgra lha) and the local god (ཡུལ་ལྷ, yul lha) lead. Its image is the messengers' path between gods and men not cut.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.7.BLACK=The seventh check for spiritual friends is black: an obstacle comes between gods and men. The local god (ཡུལ་ལྷ, yul lha) is displeased, and the god-ogres rise. Its image is the messengers' path cut.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.7.BLACK.remedy=make fulfilment and confession (བསྐང་བཤགས, bskang bshags), and offer to the gods
reading.ThirtyCheck.SPIRITUAL_FRIENDS.8.WHITE=The eighth check for spiritual friends is white: his former karma is good, and Dharma practice and virtue grow strong. Its image is Dharma practice not left to the residue of karma.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.8.BLACK=The eighth check for spiritual friends is black: he has no mind for virtue and practises sin, and obstacles come to life and Dharma. Its image is Dharma practice left to the residue of karma.
reading.ThirtyCheck.SPIRITUAL_FRIENDS.8.BLACK.remedy=strive at white acts
reading.ThirtyCheck.MANTRINS.1.WHITE=The first check for mantra-holders is white: he meets the Dharma, and wishes are fulfilled. Its image is the golden vajra not gone up into the sky.
reading.ThirtyCheck.MANTRINS.1.BLACK=The first check for mantra-holders is black: he does not like the forefathers' Dharma, looks on it wrongly and delights in sin. Its image is the golden vajra gone up into the sky.
reading.ThirtyCheck.MANTRINS.2.WHITE=The second check for mantra-holders is white: the line of monks and mantra-holders is not cut, awareness is keen and knowledge good. Its image is the silver bell kept in the hand.
reading.ThirtyCheck.MANTRINS.2.BLACK=The second check for mantra-holders is black: mantra practice brings no result, and works are not achieved. Its image is the sweet-sounding bell slipped from the hand.
reading.ThirtyCheck.MANTRINS.2.BLACK.remedy=make the mamo's (མ་མོ, ma mo) thread-cross (མདོས, mdos) of turning back, and turn back war
reading.ThirtyCheck.MANTRINS.3.WHITE=The third check for mantra-holders is white: awareness is keen, wishes are fulfilled, and merit grows. Its image is the string of the commitment rosary not cut.
reading.ThirtyCheck.MANTRINS.3.BLACK=The third check for mantra-holders is black and bad: obstacles come. Its image is the string of the commitment rosary cut.
reading.ThirtyCheck.MANTRINS.3.BLACK.remedy=practise long life
reading.ThirtyCheck.MANTRINS.4.WHITE=The fourth check for mantra-holders is white: wishes are fulfilled, and the luck (ཀླུང་རྟ, klung rta) grows. Its image is the great canopy spread to its edges.
reading.ThirtyCheck.MANTRINS.4.BLACK=The fourth check for mantra-holders is black: monks and disciples rise as enemies. Its image is the great canopy leaking at its edges.
reading.ThirtyCheck.MANTRINS.4.BLACK.remedy=strive at turning back with the torma (གཏོར་མ, gtor ma) and at turning back enemies
reading.ThirtyCheck.MANTRINS.5.WHITE=The fifth check for mantra-holders is white: fame gathers, and people speak kindly. Its image is the great drum of existence not torn.
reading.ThirtyCheck.MANTRINS.5.BLACK=The fifth check for mantra-holders is black. Its image is the great drum of existence torn at its body.
reading.ThirtyCheck.MANTRINS.5.BLACK.remedy=mend existence and make the nine rounds
reading.ThirtyCheck.MANTRINS.6.WHITE=The sixth check for mantra-holders is white and very good: the mothers and the ḍākinīs (མཁའ་འགྲོ, mkha' 'gro) protect him.
reading.ThirtyCheck.MANTRINS.6.BLACK=The sixth check for mantra-holders is black: the punishment of the mothers and the ḍākinīs (མཁའ་འགྲོ, mkha' 'gro) comes.
reading.ThirtyCheck.MANTRINS.6.BLACK.remedy=welcome and turn back the ḍākinīs (མཁའ་འགྲོ, mkha' 'gro), and send the thread-cross (མདོས, mdos) of pollution
reading.ThirtyCheck.MANTRINS.7.WHITE=The seventh check for mantra-holders is white: no obstacle comes to life. The forefathers are like kings, and sons and grandsons like ministers. Its image is the knife, the iron and the dagger not broken.
reading.ThirtyCheck.MANTRINS.7.BLACK=The seventh check for mantra-holders is black: obstacles come, and a young man runs a great risk of death. Its image is the knife, the iron and the dagger broken.
reading.ThirtyCheck.MANTRINS.7.BLACK.remedy=press down the spirits of the prime (དར་སྲི, dar sri), and tie on protection against them
reading.ThirtyCheck.MANTRINS.8.WHITE=The eighth check for mantra-holders is white: the forefathers are like kings, and sons and grandsons like ministers. Its image is the dish of medicine, rakta and torma (གཏོར་མ, gtor ma) not empty.
reading.ThirtyCheck.MANTRINS.8.BLACK=The eighth check for mantra-holders is black: there is a great risk that the eight lines are cut. It is good now but bad at the end. Its image is the dish empty.
reading.ThirtyCheck.MANTRINS.8.BLACK.remedy=send the general thread-cross (མདོས, mdos) of the four continents and the queen's crowd thread-cross, restore the luck (ཀླུང་རྟ, klung rta), and practise medicine, rakta and torma (གཏོར་མ, gtor ma)
reading.ThirtyCheck.BON_PRIESTS.1.WHITE=The first check for Bon (བོན, bon) priests is white and very good. Its image is the meteoric-iron horn not entered by the tsen (བཙན, btsan).
reading.ThirtyCheck.BON_PRIESTS.1.BLACK=The first check for Bon (བོན, bon) priests is black. Its image is the meteoric-iron horn carried off by the tsen (བཙན, btsan).
reading.ThirtyCheck.BON_PRIESTS.1.BLACK.remedy=build the god-castle (གསས་མཁར, gsas mkhar) of the Bon (བོན, bon), and it becomes good
reading.ThirtyCheck.BON_PRIESTS.2.WHITE=The second check for Bon (བོན, bon) priests is white and good. Its image is the red god's arrow not broken.
reading.ThirtyCheck.BON_PRIESTS.2.BLACK=The second check for Bon (བོན, bon) priests is black and bad: a great rise and decline (དར་གུད, dar gud) comes for them. Its image is the red god's arrow broken.
reading.ThirtyCheck.BON_PRIESTS.3.WHITE=The third check for Bon (བོན, bon) priests is white: gods and spirits keep their places.
reading.ThirtyCheck.BON_PRIESTS.3.BLACK=The third check for Bon (བོན, bon) priests is black and bad: gods and spirits have changed places.
reading.ThirtyCheck.BON_PRIESTS.3.BLACK.remedy=mend the gods and spirits
reading.ThirtyCheck.BON_PRIESTS.4.WHITE=The fourth check for Bon (བོན, bon) priests is white: the eight lines are not cut. Its image is the stripe of the gods' swastika (གཡུང་དྲུང, g.yung drung) not faded.
reading.ThirtyCheck.BON_PRIESTS.4.BLACK=The fourth check for Bon (བོན, bon) priests is black: the eight lines are cut. Its image is the stripe of the swastika (གཡུང་དྲུང, g.yung drung) faded.
reading.ThirtyCheck.BON_PRIESTS.4.BLACK.remedy=make a rite of restoring
reading.ThirtyCheck.BON_PRIESTS.5.WHITE=The fifth check for Bon (བོན, bon) priests is white: nothing has fallen from its stand.
reading.ThirtyCheck.BON_PRIESTS.5.BLACK=The fifth check for Bon (བོན, bon) priests is black: the male god (ཕོ་ལྷ, pho lha) flees.
reading.ThirtyCheck.BON_PRIESTS.5.BLACK.remedy=call back what fled, and make fulfilment and restoring
reading.ThirtyCheck.BON_PRIESTS.6.WHITE=The sixth check for Bon (བོན, bon) priests is white: their eight lines grow. Its image is the tiger's and leopard's stripes not faded.
reading.ThirtyCheck.BON_PRIESTS.6.BLACK=The sixth check for Bon (བོན, bon) priests is black: it is bad for their lineages. Its image is the six smiles of the tiger and leopard faded.
reading.ThirtyCheck.BON_PRIESTS.6.BLACK.remedy=mend the nyen (གཉན, gnyan) of the ground
reading.ThirtyCheck.BON_PRIESTS.7.WHITE=The seventh check for Bon (བོན, bon) priests is white and very good. Its image is the vulture's feather not broken at its middle.
reading.ThirtyCheck.BON_PRIESTS.7.BLACK=The seventh check for Bon (བོན, bon) priests is black and bad. Its image is the vulture's feather broken at its middle.
reading.ThirtyCheck.BON_PRIESTS.7.BLACK.remedy=offer to the gods, call back the fortune (གཡང, g.yang), and make the long-life rite
reading.ThirtyCheck.BON_PRIESTS.8.WHITE=The eighth check for Bon (བོན, bon) priests is white: their gods lead, and they eat the food of fortune (གཡང, g.yang).
reading.ThirtyCheck.BON_PRIESTS.8.BLACK=The eighth check for Bon (བོན, bon) priests is black: their gods are angry, and in the end the generations are cut.
reading.ThirtyCheck.BON_PRIESTS.8.BLACK.remedy=make the rite of spreading the human line, and build the god-castle (གསས་མཁར, gsas mkhar)
reading.ThirtyCheck.ELDERS.1.WHITE=The first check for elders is white: a great chief son comes to the great chief father.
reading.ThirtyCheck.ELDERS.1.BLACK=The first check for elders is black: the chief's line is cut, his seat risks being empty, and the country's people fare badly. Or a tiger-like father has fox-like sons.
reading.ThirtyCheck.ELDERS.1.BLACK.remedy=make the queen's turning of the crowd
reading.ThirtyCheck.ELDERS.2.WHITE=The second check for elders is white: the chief's seat is not empty.
reading.ThirtyCheck.ELDERS.2.BLACK=The second check for elders is black: the chief's seat is empty, and it is bad for the country as a whole.
reading.ThirtyCheck.ELDERS.2.BLACK.remedy=make the queen's turning of the crowd
reading.ThirtyCheck.ELDERS.3.WHITE=The third check for elders is white and good: the town of the staff-holders is full.
reading.ThirtyCheck.ELDERS.3.BLACK=The third check for elders is black: the staff-holders' council is not filled, and head and foot risk being reversed. Blame and quarrels come, and it is bad for the country's people.
reading.ThirtyCheck.ELDERS.3.BLACK.remedy=send the general thread-cross (མདོས, mdos) of the four continents, and if that fails, make the signs and the weapon rite against enemies
reading.ThirtyCheck.ELDERS.4.WHITE=The fourth check for elders is white: the country's lord is kind, aims are achieved, and good news is heard.
reading.ThirtyCheck.ELDERS.4.BLACK=The fourth check for elders is black: the lord's punishment and quarrels come.
reading.ThirtyCheck.ELDERS.4.BLACK.remedy=press down the spirits of enmity (དགྲ་སྲི, dgra sri), and make the enemy pit
reading.ThirtyCheck.ELDERS.5.WHITE=The fifth check for elders is white: merit and wealth grow. Its image is the crystal fortress not broken.
reading.ThirtyCheck.ELDERS.5.BLACK=The fifth check for elders is black: it is bad for the country and the estate, above all for the sons of aunts and sisters. Its image is the crystal fortress broken.
reading.ThirtyCheck.ELDERS.6.WHITE=The sixth check for elders is white: companions and near kin are kind.
reading.ThirtyCheck.ELDERS.6.BLACK=The sixth check for elders is black: through idle talk, those who did no wrong rise as enemies against his counsel.
reading.ThirtyCheck.ELDERS.7.WHITE=The seventh check for elders is white: there is no ground for gossip (མི་ཁ, mi kha).
reading.ThirtyCheck.ELDERS.7.BLACK=The seventh check for elders is black: many people talk of emptiness, and gossip and quarrels abound.
reading.ThirtyCheck.ELDERS.7.BLACK.remedy=make the enemy pit, and turn the gossip (མི་ཁ, mi kha) by rites
reading.ThirtyCheck.ELDERS.8.WHITE=The eighth check for elders is white: wishes are fulfilled, and nothing obstructs what is planned.
reading.ThirtyCheck.ELDERS.8.BLACK=The eighth check for elders is black: the demons (བདུད, bdud) deceive the counsel. The three courtiers rise as enemies, and every kind of counsel goes astray.
reading.ThirtyCheck.YOUNG_MEN.1.WHITE=The first check for young men is white. Its image is the hat-helmet not fallen.
reading.ThirtyCheck.YOUNG_MEN.1.BLACK=The first check for young men is black: a great rise and decline (དར་གུད, dar gud) comes in the father's and uncles' place. Much shame comes in his own. Its image is the hat-helmet fallen.
reading.ThirtyCheck.YOUNG_MEN.2.WHITE=The second check for young men is white and good. Its image is the supreme white bow not broken.
reading.ThirtyCheck.YOUNG_MEN.2.BLACK=The second check for young men is black: it is bad for himself. Its image is the white bow broken.
reading.ThirtyCheck.YOUNG_MEN.2.BLACK.remedy=carry the protection that raises the life force (སྲོག, srog)
reading.ThirtyCheck.YOUNG_MEN.3.WHITE=The third check for young men is white: his courage is complete. Its image is the sharp knife not eaten by the tsen (བཙན, btsan).
reading.ThirtyCheck.YOUNG_MEN.3.BLACK=The third check for young men is black: it is bad for the long knife and the short, and his courage is small. Its image is the weapon sheath carried off by the tsen (བཙན, btsan).
reading.ThirtyCheck.YOUNG_MEN.3.BLACK.remedy=make the rite of raising the life force (སྲོག, srog) and the like
reading.ThirtyCheck.YOUNG_MEN.4.WHITE=The fourth check for young men is white. Its image is the mount's saddle not fled.
reading.ThirtyCheck.YOUNG_MEN.4.BLACK=The fourth check for young men is black: thieves come. Its image is the mount's saddle fled.
reading.ThirtyCheck.YOUNG_MEN.4.BLACK.remedy=press down the spirits of enmity (དགྲ་སྲི, dgra sri)
reading.ThirtyCheck.YOUNG_MEN.5.WHITE=The fifth check for young men is white: it is good for sons and grandsons. Its image is the spear not broken.
reading.ThirtyCheck.YOUNG_MEN.5.BLACK=The fifth check for young men is black and bad. Its image is the spear broken at its middle.
reading.ThirtyCheck.YOUNG_MEN.5.BLACK.remedy=hold ritual services (རིམ་གྲོ, rim gro) for sons and grandsons
reading.ThirtyCheck.YOUNG_MEN.6.WHITE=The sixth check for young men is white: it is good for sons, sisters and wives. Its image is the stripe of the tiger skin not faded.
reading.ThirtyCheck.YOUNG_MEN.6.BLACK=The sixth check for young men is black: it is bad for sons, sisters and wives. Its image is the stripe of the tiger skin faded.
reading.ThirtyCheck.YOUNG_MEN.7.WHITE=The seventh check for young men is white: food, wealth and clothes are good. Its image is the leopard-skin bow case not parted from the bow.
reading.ThirtyCheck.YOUNG_MEN.7.BLACK=The seventh check for young men is black: food and wealth are there now and gone now. Its image is the bow case parted from the bow.
reading.ThirtyCheck.YOUNG_MEN.7.BLACK.remedy=send the golden-light protection of the fortune (གཡང, g.yang) and the livestock ransom (གླུད, glud)
reading.ThirtyCheck.YOUNG_MEN.8.WHITE=The eighth check for young men is white: servants and retinue are good. Its image is the strap of the cane shield not cut.
reading.ThirtyCheck.YOUNG_MEN.8.BLACK=The eighth check for young men is black: it is bad for subjects, retinue and servants. Its image is the strap of the cane shield cut.
reading.ThirtyCheck.WIVES.1.WHITE=The first check for wives is white. Its image is the sun of glory rising on her head.
reading.ThirtyCheck.WIVES.1.BLACK=The first check for wives is black: it is bad for both children and wealth. Its image is the sun of glory setting at the door.
reading.ThirtyCheck.WIVES.2.WHITE=The second check for wives is white and good. Its image is the white silk skirt not frayed.
reading.ThirtyCheck.WIVES.2.BLACK=The second check for wives is black: she looks at two or three men, and it is bad for her lifelong companion. Widowhood comes to her. Its image is the skirt frayed at its edge.
reading.ThirtyCheck.WIVES.3.WHITE=The third check for wives is white and good. Its image is the cord of the lake turquoise not cut.
reading.ThirtyCheck.WIVES.3.BLACK=The third check for wives is black: many daughters come and few sons. Its image is the cord of the gold and turquoise cut.
reading.ThirtyCheck.WIVES.4.WHITE=The fourth check for wives is white: it is good, with children and descendants. Its image is the spring of existence not dried.
reading.ThirtyCheck.WIVES.4.BLACK=The fourth check for wives is black: sons and grandsons do not increase, and deaths cut the line. Its image is the spring of gold and turquoise dried.
reading.ThirtyCheck.WIVES.5.WHITE=The fifth check for wives is white: sons settle in her lap, and no loss comes among sons and grandsons.
reading.ThirtyCheck.WIVES.5.BLACK=The fifth check for wives is black: spirits carry off the children. Its image is the son lost from the mother's lap.
reading.ThirtyCheck.WIVES.6.WHITE=The sixth check for wives is white: no living spirit (གསོན་འདྲེ, gson 'dre) harms her.
reading.ThirtyCheck.WIVES.6.BLACK=The sixth check for wives is black: a living spirit (གསོན་འདྲེ, gson 'dre) harms her continually, and the children do not survive.
reading.ThirtyCheck.WIVES.6.BLACK.remedy=turn the living spirit's (གསོན་འདྲེ, gson 'dre) face and press it down, and the children survive and grow
reading.ThirtyCheck.WIVES.7.WHITE=The seventh check for wives is white: the spirits of small children (ཆུང་སྲི, chung sri) have not risen.
reading.ThirtyCheck.WIVES.7.BLACK=The seventh check for wives is black: the spirits of small children (ཆུང་སྲི, chung sri) have risen.
reading.ThirtyCheck.WIVES.7.BLACK.remedy=press down the spirits of small children (ཆུང་སྲི, chung sri) and turn their face
reading.ThirtyCheck.WIVES.8.WHITE=The eighth check for wives is white: the theurang (ཐེའུ་བྲང, the'u brang) do no harm, and children grow.
reading.ThirtyCheck.WIVES.8.BLACK=The eighth check for wives is black: the theurang (ཐེའུ་བྲང, the'u brang) steal one after another.
reading.ThirtyCheck.WIVES.8.BLACK.remedy=send the theurang's (ཐེའུ་བྲང, the'u brang) thread-cross (མདོས, mdos)
reading.ThirtyCheck.SMALL_CHILDREN.1.WHITE=The first check for small children is white: the tree of the life force grows. Its image is the children's playground not empty.
reading.ThirtyCheck.SMALL_CHILDREN.1.BLACK=The first check for small children is black: the family's numbers dwindle. Its image is the children's playground empty.
reading.ThirtyCheck.SMALL_CHILDREN.2.WHITE=The second check for small children is white: spirits have not carried off the small la, the life-spirit (བླ, bla), and sons and grandsons multiply.
reading.ThirtyCheck.SMALL_CHILDREN.2.BLACK=The second check for small children is black: spirits carry off the small la, the life-spirit (བླ, bla).
reading.ThirtyCheck.SMALL_CHILDREN.2.BLACK.remedy=ransom the life of animals, ransom the la, the life-spirit (བླ, bla), and make the long-life rite
reading.ThirtyCheck.SMALL_CHILDREN.3.WHITE=The third check for small children is white. Its image is the toy bow and arrow not broken.
reading.ThirtyCheck.SMALL_CHILDREN.3.BLACK=The third check for small children is black. Its image is the toy bow and arrow burnt by fire.
reading.ThirtyCheck.SMALL_CHILDREN.3.BLACK.remedy=release from fright, and strive at virtue
reading.ThirtyCheck.SMALL_CHILDREN.4.WHITE=The fourth check for small children is white. Its image is the castle of life standing.
reading.ThirtyCheck.SMALL_CHILDREN.4.BLACK=The fourth check for small children is black: it is good now but bad in the long run. Its image is the castle of life collapsed.
reading.ThirtyCheck.SMALL_CHILDREN.4.BLACK.remedy=free the narrow paths
reading.ThirtyCheck.SMALL_CHILDREN.5.WHITE=The fifth check for small children is white: life is long and free of illness, and offering to the gods goes well. Its image is the dagger of life not broken.
reading.ThirtyCheck.SMALL_CHILDREN.5.BLACK=The fifth check for small children is black: small children die off. Its image is the dagger of life broken.
reading.ThirtyCheck.SMALL_CHILDREN.5.BLACK.remedy=plant the dagger of the la, the life-spirit (བླ, bla), and the dagger of life
reading.ThirtyCheck.SMALL_CHILDREN.6.WHITE=The sixth check for small children is white: the leading god protects, with long life, health and happiness.
reading.ThirtyCheck.SMALL_CHILDREN.6.BLACK=The sixth check for small children is black: the god who holds life has fallen to the demons (བདུད, bdud).
reading.ThirtyCheck.SMALL_CHILDREN.6.BLACK.remedy=offer to the gods, make an ablution and fulfilment and confession (བསྐང་བཤགས, bskang bshags), and carry the protection of the life-holder
reading.ThirtyCheck.SMALL_CHILDREN.7.WHITE=The seventh check for small children is white and good: mother and child are in harmony.
reading.ThirtyCheck.SMALL_CHILDREN.7.BLACK=The seventh check for small children is black: the spirit of the mother (མ་འདྲེ, ma 'dre) contests the child's years of life.
reading.ThirtyCheck.SMALL_CHILDREN.7.BLACK.remedy=turn back the living spirit (གསོན་འདྲེ, gson 'dre) and the mamo (མ་མོ, ma mo)
reading.ThirtyCheck.SMALL_CHILDREN.8.WHITE=The eighth check for small children is white: children are easy to raise, happy and growing.
reading.ThirtyCheck.SMALL_CHILDREN.8.BLACK=The eighth check for small children is black: the spirits of small children (ཆུང་སྲི, chung sri) rise.
reading.ThirtyCheck.SMALL_CHILDREN.8.BLACK.remedy=press down the spirits of small children (ཆུང་སྲི, chung sri) and turn their face
reading.ThirtyCheck.GIRLS.1.WHITE=The first check for girls is white: she comes to the fore. Its image is the wool on the spindle not used up.
reading.ThirtyCheck.GIRLS.1.BLACK=The first check for girls is black: unwished sorrow comes to the household and its old women. Its image is the wool on the spindle used up.
reading.ThirtyCheck.GIRLS.2.WHITE=The second check for girls is white: her own kindness is greater than her parents'. Its image is the neck turquoise not faded.
reading.ThirtyCheck.GIRLS.2.BLACK=The second check for girls is black: her head is weak, and illness and chronic disease come. Its image is the small turquoise without lustre.
reading.ThirtyCheck.GIRLS.2.BLACK.remedy=strive at rites such as raising the glory (དཔལ, dpal)
reading.ThirtyCheck.GIRLS.3.WHITE=The third check for girls is white and good. Its image is the flower not carried off by frost.
reading.ThirtyCheck.GIRLS.3.BLACK=The third check for girls is black: gossip or obstacles come. Its image is the flower carried off by frost.
reading.ThirtyCheck.GIRLS.3.BLACK.remedy=strive at ritual services (རིམ་གྲོ, rim gro)
reading.ThirtyCheck.GIRLS.4.WHITE=The fourth check for girls is white. Its image is the white silver mirror not broken at its back.
reading.ThirtyCheck.GIRLS.4.BLACK=The fourth check for girls is black and bad. Its image is the white silver mirror broken.
reading.ThirtyCheck.GIRLS.5.WHITE=The fifth check for girls is white: it is good in the father's line's place. Its image is the silk clothes not faded.
reading.ThirtyCheck.GIRLS.5.BLACK=The fifth check for girls is black: it is bad for the father's line. Its image is the silk's lustre faded.
reading.ThirtyCheck.GIRLS.5.BLACK.remedy=strive at ritual services (རིམ་གྲོ, rim gro)
reading.ThirtyCheck.GIRLS.6.WHITE=The sixth check for girls is white and good. Its image is the gold and turquoise head ornament not cast off.
reading.ThirtyCheck.GIRLS.6.BLACK=The sixth check for girls is black: her time with both parents is short, and in the end it is bad for her lifelong companion. Its image is the head ornament parted from her.
reading.ThirtyCheck.GIRLS.6.BLACK.remedy=make the nine turnings back of sorrow and the black ransom rite (གཏོ, gto)
reading.ThirtyCheck.GIRLS.7.WHITE=The seventh check for girls is white and good. Its image is the string of the conch-shell rosary not cut.
reading.ThirtyCheck.GIRLS.7.BLACK=The seventh check for girls is black: it is bad for her life. Its image is the strings of the iron and conch rosaries cut.
reading.ThirtyCheck.GIRLS.8.WHITE=The eighth check for girls is white: belt, short knife and neck ornaments are good. Its image is the eyelet of the waist ornament not worn.
reading.ThirtyCheck.GIRLS.8.BLACK=The eighth check for girls is black: it is bad for the household's old women. Its image is the belt's eyelet worn.
reading.ThirtyCheck.GIRLS.8.BLACK.remedy=strive at ritual services (རིམ་གྲོ, rim gro) that turn these back
reading.ThirtyCheck.SUBJECTS.1.WHITE=The first check for subjects is white and good. Its image is the five arrows and the one bow not lost.
reading.ThirtyCheck.SUBJECTS.1.BLACK=The first check for subjects is black: subjects and retinue fall out, and kin-killing (དམེ, dme) comes. Its image is the five arrows and the bow lost from the hand.
reading.ThirtyCheck.SUBJECTS.2.WHITE=The second check for subjects is white: the demons (བདུད, bdud) do not deceive the servants.
reading.ThirtyCheck.SUBJECTS.2.BLACK=The second check for subjects is black: the demons (བདུད, bdud) deceive the servants' minds. There is a great risk that their hearts go astray.
reading.ThirtyCheck.SUBJECTS.3.WHITE=The third check for subjects is white: subjects and retinue are loyal, and servants grow.
reading.ThirtyCheck.SUBJECTS.3.BLACK=The third check for subjects is black: companions bind by bribes, and people come who steal and lure minds.
reading.ThirtyCheck.SUBJECTS.3.BLACK.remedy=take great care
reading.ThirtyCheck.SUBJECTS.4.WHITE=The fourth check for subjects is white: merit and wealth grow. Its image is the yoke of misfortune (བྱུར, byur) not carried.
reading.ThirtyCheck.SUBJECTS.4.BLACK=The fourth check for subjects is black and bad. Its image is the yoke of misfortune (བྱུར, byur) carried.
reading.ThirtyCheck.SUBJECTS.4.BLACK.remedy=strive at the rites of expelling misfortune (བྱུར, byur) and increasing glory (དཔལ་བསྐྱེད, dpal bskyed)
reading.ThirtyCheck.SUBJECTS.5.WHITE=The fifth check for subjects is white and good. Its image is the mountain of misfortune (བྱུར, byur) never lifted into the lap.
reading.ThirtyCheck.SUBJECTS.5.BLACK=The fifth check for subjects is black and bad. Its image is the mountain of misfortune (བྱུར, byur) lifted into the lap.
reading.ThirtyCheck.SUBJECTS.5.BLACK.remedy=make the rite of expelling misfortune (བྱུར, byur) and increasing glory (དཔལ་བསྐྱེད, dpal bskyed)
reading.ThirtyCheck.SUBJECTS.6.WHITE=The sixth check for subjects is white and good. Its image is the black load of misfortune (བྱུར, byur) not carried.
reading.ThirtyCheck.SUBJECTS.6.BLACK=The sixth check for subjects is black: others' misfortune (བྱུར, byur) falls on oneself. Its image is the black load of misfortune carried.
reading.ThirtyCheck.SUBJECTS.7.WHITE=The seventh check for subjects is white and good. Its image is the black road of misfortune (བྱུར, byur) not walked.
reading.ThirtyCheck.SUBJECTS.7.BLACK=The seventh check for subjects is black: blame comes for faults not committed, and sorrow among the near ones. Its image is the black road of misfortune (བྱུར, byur) walked.
reading.ThirtyCheck.SUBJECTS.7.BLACK.remedy=make the nine turnings back of sorrow
reading.ThirtyCheck.SUBJECTS.8.WHITE=The eighth check for subjects is white: the she-demon's discord has not entered.
reading.ThirtyCheck.SUBJECTS.8.BLACK=The eighth check for subjects is black and bad: the she-demon's discord has entered, and wealth goes as if swept by a broom.
reading.ThirtyCheck.HORSES.1.WHITE=The first check for horses is white: the horse herds grow in the forefathers' place. Its image is the golden bit not lost from the stallion's mouth.
reading.ThirtyCheck.HORSES.1.BLACK=The first check for horses is black and bad: the bit is broken or lost. Its image is the golden bit lost from the mouth.
reading.ThirtyCheck.HORSES.2.WHITE=The second check for horses is white: the stallion's life is firm. Its image is the leaping peg not gone up into the sky.
reading.ThirtyCheck.HORSES.2.BLACK=The second check for horses is black and bad. Its image is the leaping peg gone up into the sky.
reading.ThirtyCheck.HORSES.3.WHITE=The third check for horses is white. Its image is the golden saddle not fallen down the precipice.
reading.ThirtyCheck.HORSES.3.BLACK=The third check for horses is black: the gyalpo (རྒྱལ་པོ, rgyal po) harm the horses continually. Its image is the golden saddle fallen down the precipice and broken.
reading.ThirtyCheck.HORSES.3.BLACK.remedy=throw the horse ransom (གླུད, glud) and the gyalpo's (རྒྱལ་པོ, rgyal po) thread-cross (མདོས, mdos) to the east
reading.ThirtyCheck.HORSES.4.WHITE=The fourth check for horses is white. Its image is the hair of the nape not fallen out.
reading.ThirtyCheck.HORSES.4.BLACK=The fourth check for horses is black: the fortune (གཡང, g.yang) is said to decline. Its image is the hair of the nape fallen out.
reading.ThirtyCheck.HORSES.4.BLACK.remedy=recite the call and the protection of the horses' fortune (གཡང, g.yang)
reading.ThirtyCheck.HORSES.5.WHITE=The fifth check for horses is white and good. Its image is the halter rings of the turquoise bridle not worn.
reading.ThirtyCheck.HORSES.5.BLACK=The fifth check for horses is black: it is good for white and yellow horses, bad for red and black ones. Its image is the halter rings worn.
reading.ThirtyCheck.HORSES.6.WHITE=The sixth check for horses is white and good. Its image is the horse cloth not gone.
reading.ThirtyCheck.HORSES.6.BLACK=The sixth check for horses is black: when there is a horse, there is no saddle cloth. Its image is the horse cushion of the pasture stripped.
reading.ThirtyCheck.HORSES.6.BLACK.remedy=recite the horses' dhāraṇī, and give the horse ransom (གླུད, glud)
reading.ThirtyCheck.HORSES.7.WHITE=The seventh check for horses is white and good. Its image is the tail tip of the great horse not leaking.
reading.ThirtyCheck.HORSES.7.BLACK=The seventh check for horses is black: an old horse and owner bear it, or horse disease comes. Take care. Its image is the tail tip of the great horse leaking.
reading.ThirtyCheck.HORSES.8.WHITE=The eighth check for horses is white: the horses' fortune (གཡང, g.yang) has not declined.
reading.ThirtyCheck.HORSES.8.BLACK=The eighth check for horses is black: a thief carries them off, and the horses' fortune (གཡང, g.yang) has declined.
reading.ThirtyCheck.HORSES.8.BLACK.remedy=call back the fortune (གཡང, g.yang)
reading.ThirtyCheck.LIVESTOCK.1.WHITE=The first check for livestock is white and good. Its image is the white god-yak not leaking at its edge.
reading.ThirtyCheck.LIVESTOCK.1.BLACK=The first check for livestock is black: it is bad in the place of wealth, and wealth is lost. Its image is the white god-yak leaking at its edge.
reading.ThirtyCheck.LIVESTOCK.1.BLACK.remedy=bind the livestock's pledge, and call back the fortune (གཡང, g.yang)
reading.ThirtyCheck.LIVESTOCK.2.WHITE=The second check for livestock is white: it is good for mounts. Its image is the fortune (གཡང, g.yang) of the divine female yak not declined.
reading.ThirtyCheck.LIVESTOCK.2.BLACK=The second check for livestock is black: the livestock are there now and gone now. Its image is the fortune (གཡང, g.yang) of the divine female yak declined.
reading.ThirtyCheck.LIVESTOCK.2.BLACK.remedy=in the enclosure, recite the protection of the fortune (གཡང, g.yang) and plant its dagger
reading.ThirtyCheck.LIVESTOCK.3.WHITE=The third check for livestock is white: the sheep grow. Its image is the tether of the white sheep of fortune (གཡང, g.yang) not cut.
reading.ThirtyCheck.LIVESTOCK.3.BLACK=The third check for livestock is black: the sheep's fortune (གཡང, g.yang) declines. Its image is the tether of the white sheep cut.
reading.ThirtyCheck.LIVESTOCK.3.BLACK.remedy=recite the sheep's dhāraṇī, and send the sheep ransom (གླུད, glud)
reading.ThirtyCheck.LIVESTOCK.4.WHITE=The fourth check for livestock is white: the goats grow. Its image is the ogre goats not chased by the wolf.
reading.ThirtyCheck.LIVESTOCK.4.BLACK=The fourth check for livestock is black: it is bad for goats. Its image is the ogre goats chased by the wolf.
reading.ThirtyCheck.LIVESTOCK.4.BLACK.remedy=send the goat ransom (གླུད, glud) to every direction, above all to the west
reading.ThirtyCheck.LIVESTOCK.5.WHITE=The fifth check for livestock is white: food, wealth, the treasury and enjoyments are good. Its image is the wish-granting cow not dried.
reading.ThirtyCheck.LIVESTOCK.5.BLACK=The fifth check for livestock is black: wealth is there now and gone now. Its image is the wish-granting cow dried like a cut stream.
reading.ThirtyCheck.LIVESTOCK.5.BLACK.remedy=summon the cow's wind and the livestock's fortune (གཡང, g.yang)
reading.ThirtyCheck.LIVESTOCK.6.WHITE=The sixth check for livestock is white: it is good for the dzo (མཛོ, mdzo). Its image is the golden nose rope of the turquoise dzo not gone.
reading.ThirtyCheck.LIVESTOCK.6.BLACK=The sixth check for livestock is black and bad. Its image is the golden nose rope of the turquoise dzo (མཛོ, mdzo) gone.
reading.ThirtyCheck.LIVESTOCK.7.WHITE=The seventh check for livestock is white: spirits do not carry off the milk. Its image is the bottom of the curd pail not broken.
reading.ThirtyCheck.LIVESTOCK.7.BLACK=The seventh check for livestock is black: the white spirits carry off the white liquids. Its image is the bottom of the curd pail broken.
reading.ThirtyCheck.LIVESTOCK.7.BLACK.remedy=separate off the white spirits
reading.ThirtyCheck.LIVESTOCK.8.WHITE=The eighth check for livestock is white and good. Its image is the lump of butter of fortune (གཡང, g.yang) not lost down the precipice.
reading.ThirtyCheck.LIVESTOCK.8.BLACK=The eighth check for livestock is black: the fortune (གཡང, g.yang) declines, and reputation is small. Its image is the lump of butter lost down the precipice.
reading.ThirtyCheck.LIVESTOCK.8.BLACK.remedy=call back the fortune (གཡང, g.yang), and the like
reading.ThirtyCheck.COUPLE.1.WHITE=The first check for husband and wife is white and good. Its image is the vase of life not lost from their hands.
reading.ThirtyCheck.COUPLE.1.BLACK=The first check for husband and wife is black: sudden obstacles come to life. Its image is the vase of life lost from their hands.
reading.ThirtyCheck.COUPLE.1.BLACK.remedy=practise long life, and the like
reading.ThirtyCheck.COUPLE.2.WHITE=The second check for husband and wife is white and good. Its image is the river of life not cut at its middle.
reading.ThirtyCheck.COUPLE.2.BLACK=The second check for husband and wife is black: their time together is short. Its image is the river of life cut at its middle.
reading.ThirtyCheck.COUPLE.2.BLACK.remedy=sweep and clear the narrow paths
reading.ThirtyCheck.COUPLE.3.WHITE=The third check for husband and wife is white: hatred has not entered, and they agree and love each other.
reading.ThirtyCheck.COUPLE.3.BLACK=The third check for husband and wife is black: hatred has entered, and separation comes. If it came before, it is borne. If not, take great care.
reading.ThirtyCheck.COUPLE.4.WHITE=The fourth check for husband and wife is white and good: no gossip (མི་ཁ, mi kha) parts them.
reading.ThirtyCheck.COUPLE.4.BLACK=The fourth check for husband and wife is black and bad: the many mouths talk of emptiness, and gossip (མི་ཁ, mi kha) parts them.
reading.ThirtyCheck.COUPLE.4.BLACK.remedy=make the queen's turning of the crowd and the turning of the elephant's nose
reading.ThirtyCheck.COUPLE.5.WHITE=The fifth check for husband and wife is white: no wrong food has gone inside.
reading.ThirtyCheck.COUPLE.5.BLACK=The fifth check for husband and wife is black and bad: food and medicine are stirred with poison.
reading.ThirtyCheck.COUPLE.6.WHITE=The sixth check for husband and wife is white: no one comes to bring harm. Its image is the mountain of misery not climbed.
reading.ThirtyCheck.COUPLE.6.BLACK=The sixth check for husband and wife is black: sorrow, separation and the tearing of hair come. Its image is the mountain of misery climbed.
reading.ThirtyCheck.COUPLE.6.BLACK.remedy=as ritual services (རིམ་གྲོ, rim gro), read the Hundred Thousand, take empowerment and stamp clay votive images (ཚ་ཚ, tsha tsha)
reading.ThirtyCheck.COUPLE.7.WHITE=The seventh check for husband and wife is white and good: no turning back meets them on the road. Its image is the net of turning back not cast.
reading.ThirtyCheck.COUPLE.7.BLACK=The seventh check for husband and wife is black: one goes the wrong way, and a separation comes. If forefathers went abroad, that bears it. Its image is the net of turning back cast.
reading.ThirtyCheck.COUPLE.8.WHITE=The eighth check for husband and wife is white: the spirits of small children (ཆུང་སྲི, chung sri) do not rise, and children grow.
reading.ThirtyCheck.COUPLE.8.BLACK=The eighth check for husband and wife is black: the spirits of small children (ཆུང་སྲི, chung sri) have entered the womb, and children wither and die off.
reading.ThirtyCheck.COUPLE.8.BLACK.remedy=strive to separate and press down the spirits of small children (ཆུང་སྲི, chung sri)
reading.ThirtyCheck.BRIDE.1.WHITE=The first check for the bride is white and good: the fire of existence has not taken her power-mountain.
reading.ThirtyCheck.BRIDE.1.BLACK=The first check for the bride is black: there is a great risk of sorrow in the father's line's place. Its image is the mountain of existence burning.
reading.ThirtyCheck.BRIDE.1.BLACK.remedy=turn the torma (གཏོར་མ, gtor ma)
reading.ThirtyCheck.BRIDE.2.WHITE=The second check for the bride is white and good: her directions are not reversed.
reading.ThirtyCheck.BRIDE.2.BLACK=The second check for the bride is black: her directions are reversed, and it is bad for her.
reading.ThirtyCheck.BRIDE.2.BLACK.remedy=strive at ritual services (རིམ་གྲོ, rim gro) and the ransom rite (གཏོ, gto)
reading.ThirtyCheck.BRIDE.3.WHITE=The third check for the bride is white. Its image is the lustre of gold and turquoise not faded.
reading.ThirtyCheck.BRIDE.3.BLACK=The third check for the bride is black: facing the bride herself is bad. Its image is the lustre of gold and turquoise faded.
reading.ThirtyCheck.BRIDE.3.BLACK.remedy=protect the fortune (གཡང, g.yang), and the like
reading.ThirtyCheck.BRIDE.4.WHITE=The fourth check for the bride is white and good. Its image is the silk skirt not frayed at its edge.
reading.ThirtyCheck.BRIDE.4.BLACK=The fourth check for the bride is black: it is bad for both the bride and the household. Its image is the silk skirt frayed.
reading.ThirtyCheck.BRIDE.5.WHITE=The fifth check for the bride is white and very good: the back-mountain of the father's line has not fallen.
reading.ThirtyCheck.BRIDE.5.BLACK=The fifth check for the bride is black: the father's line declines or helps little. Its image is the back-mountain of the father's line gone bad.
reading.ThirtyCheck.BRIDE.5.BLACK.remedy=send the life ransom (གླུད, glud), and set up the life-castle (སྲོག་མཁར, srog mkhar)
reading.ThirtyCheck.BRIDE.6.WHITE=The sixth check for the bride is white: it is good in the household's place. Its image is the house of glory pitched where she dwells.
reading.ThirtyCheck.BRIDE.6.BLACK=The sixth check for the bride is black: it is bad in the household's place. Its image is the house of glory not pitched.
reading.ThirtyCheck.BRIDE.6.BLACK.remedy=strive at expelling misfortune (བྱུར, byur) and raising the glory (དཔལ, dpal)
reading.ThirtyCheck.BRIDE.7.WHITE=The seventh check for the bride is white and good: she obtains the food of glory herself.
reading.ThirtyCheck.BRIDE.7.BLACK=The seventh check for the bride is black: the food of glory is lost to the enemy. It is bad, above all for wealth in the later part of life.
reading.ThirtyCheck.BRIDE.7.BLACK.remedy=tie on the protection that raises the eating fortune
reading.ThirtyCheck.BRIDE.8.WHITE=The eighth check for the bride is white and good: there is no fear of talk of emptiness.
reading.ThirtyCheck.BRIDE.8.BLACK=The eighth check for the bride is black and bad: the many mouths have talked of emptiness.
reading.ThirtyCheck.BRIDE.8.BLACK.remedy=press down, turn back and turn the gossip (མི་ཁ, mi kha)
reading.ThirtyCheck.HOUSE.1.WHITE=The first check for the house is white, from the north: it is good for the house. Its image is the turquoise bird not entered on the silver road.
reading.ThirtyCheck.HOUSE.1.BLACK=The first check for the house is black, from the north: it is very bad for the house and the household. Its image is the turquoise bird running downward.
reading.ThirtyCheck.HOUSE.2.WHITE=The second check for the house is white and good, from the north-east: no king's palace is built in that direction.
reading.ThirtyCheck.HOUSE.2.BLACK=The second check for the house is black and bad, from the north-east: a king's palace is built there.
reading.ThirtyCheck.HOUSE.2.BLACK.remedy=lay the fort of the gyalpo (རྒྱལ་པོ, rgyal po), send their thread-cross (མདོས, mdos), and the like
reading.ThirtyCheck.HOUSE.3.WHITE=The third check for the house is white and good, from the east: the garuḍa head does not press the temple.
reading.ThirtyCheck.HOUSE.3.BLACK=The third check for the house is black and bad, from the east: the garuḍa head presses the temple.
reading.ThirtyCheck.HOUSE.3.BLACK.remedy=strive at white ritual services (རིམ་གྲོ, rim gro)
reading.ThirtyCheck.HOUSE.4.WHITE=The fourth check for the house is white and good, from the south-east: the black demon wind has not risen.
reading.ThirtyCheck.HOUSE.4.BLACK=The fourth check for the house is black and bad, from the south-east: the black demon wind has risen.
reading.ThirtyCheck.HOUSE.4.BLACK.remedy=build a stupa or a temple
reading.ThirtyCheck.HOUSE.5.WHITE=The fifth check for the house is white and good, from the south: the tree of fortune (གཡང, g.yang) on the mountain has grown.
reading.ThirtyCheck.HOUSE.5.BLACK=The fifth check for the house is black and bad, from the south: the tree of fortune (གཡང, g.yang) on the mountain has not grown.
reading.ThirtyCheck.HOUSE.5.BLACK.remedy=call back and protect the fortune (གཡང, g.yang)
reading.ThirtyCheck.HOUSE.6.WHITE=The sixth check for the house is white and good, from the south-west: the sunny and shady sides are not reversed.
reading.ThirtyCheck.HOUSE.6.BLACK=The sixth check for the house is black, from the south-west: the sunny and shady sides are reversed. It is bad for the local lord and the house owner.
reading.ThirtyCheck.HOUSE.7.WHITE=The seventh check for the house is white, from the west: the old live long, and the young gain glory. Its image is the black road of the dead not opened.
reading.ThirtyCheck.HOUSE.7.BLACK=The seventh check for the house is black, from the west: it is bad abroad. Its image is the black road of the dead open from the west.
reading.ThirtyCheck.HOUSE.7.BLACK.remedy=cut the joined hands of the living and the dead
reading.ThirtyCheck.HOUSE.8.WHITE=The eighth check for the house is white and good, from the north-west: the grave store of the sasin (ས་སྲིན, sa srin) does not gather.
reading.ThirtyCheck.HOUSE.8.BLACK=The eighth check for the house is black, from the north-west: the house is lost to the sasin (ས་སྲིན, sa srin), and the grave's mouth opens.
reading.ThirtyCheck.HOUSE.8.BLACK.remedy=turn back life at the grave's mouth, and press down the leper skull of the sasin (ས་སྲིན, sa srin)
reading.ThirtyCheck.GROUND.1.WHITE=The first check for the ground is white: the ground is stable, and merit grows.
reading.ThirtyCheck.GROUND.1.BLACK=The first check for the ground is black and bad: the ground is not stable.
reading.ThirtyCheck.GROUND.1.BLACK.remedy=make the rite of raising merit
reading.ThirtyCheck.GROUND.2.WHITE=The second check for the ground is white: on the mountain of merit the trees of food and wealth grow.
reading.ThirtyCheck.GROUND.2.BLACK=The second check for the ground is black: it is bad in the place of merit and enjoyment. Its image is the tree of enjoyments dried.
reading.ThirtyCheck.GROUND.3.WHITE=The third check for the ground is white: the site for a castle or house is good, and merit and wealth grow.
reading.ThirtyCheck.GROUND.3.BLACK=The third check for the ground is black: the site for a castle or house is bad.
reading.ThirtyCheck.GROUND.3.BLACK.remedy=give the earth lords (ས་བདག, sa bdag) the chanted rite, and the like
reading.ThirtyCheck.GROUND.4.WHITE=The fourth check for the ground is white: the offerings and the grain grow well.
reading.ThirtyCheck.GROUND.4.BLACK=The fourth check for the ground is black: the five grains grow weakly, and there is a fault.
reading.ThirtyCheck.GROUND.5.WHITE=The fifth check for the ground is white and good: the mountain's lamp and the rock's lamp do not fight.
reading.ThirtyCheck.GROUND.5.BLACK=The fifth check for the ground is black: the mountain's lamp and the rock's lamp fight, and merit is somewhat less.
reading.ThirtyCheck.GROUND.5.BLACK.remedy=build a stupa
reading.ThirtyCheck.GROUND.6.WHITE=The sixth check for the ground is white and good: no mountain cuts the sun's road from the east.
reading.ThirtyCheck.GROUND.6.BLACK=The sixth check for the ground is black: a mountain cuts the sun's road from the east. Old women rise as enemies, and loss comes.
reading.ThirtyCheck.GROUND.7.WHITE=The seventh check for the ground is white and good: no broom strikes the valley lane from the valley mouth.
reading.ThirtyCheck.GROUND.7.BLACK=The seventh check for the ground is black: a broom strikes the valley lane, and it is bad in the place of food and wealth.
reading.ThirtyCheck.GROUND.8.WHITE=The eighth check for the ground is white and good: the sunny and shady sides are not reversed.
reading.ThirtyCheck.GROUND.8.BLACK=The eighth check for the ground is black and bad: the sunny and shady sides are reversed.
reading.ThirtyCheck.GROUND.8.BLACK.remedy=face the door toward one's own and the mother, or toward the clan's mother
reading.ThirtyCheck.ARMOUR_VESSEL.1.WHITE=The first check for armour and the copper vessel is white and good: the two treasuries are full of gold, silver and wealth.
reading.ThirtyCheck.ARMOUR_VESSEL.1.BLACK=The first check for armour and the copper vessel is black: the treasury is empty, and it is bad in the place of wealth.
reading.ThirtyCheck.ARMOUR_VESSEL.2.WHITE=The second check for armour and the copper vessel is white and good: the house is heaped with the light of jewels.
reading.ThirtyCheck.ARMOUR_VESSEL.2.BLACK=The second check for armour and the copper vessel is black and bad: the castle and the place of power have no light of jewels.
reading.ThirtyCheck.ARMOUR_VESSEL.2.BLACK.remedy=protect the fortune (གཡང, g.yang)
reading.ThirtyCheck.ARMOUR_VESSEL.3.WHITE=The third check for armour and the copper vessel is white and good. Its image is the silk-tiger throne standing high.
reading.ThirtyCheck.ARMOUR_VESSEL.3.BLACK=The third check for armour and the copper vessel is black and bad. Its image is the throne standing low.
reading.ThirtyCheck.ARMOUR_VESSEL.3.BLACK.remedy=strive at ritual services (རིམ་གྲོ, rim gro)
reading.ThirtyCheck.ARMOUR_VESSEL.4.WHITE=The fourth check for armour and the copper vessel is white and good. Its image is the ocean of butter swirling.
reading.ThirtyCheck.ARMOUR_VESSEL.4.BLACK=The fourth check for armour and the copper vessel is black and bad. Its image is the ocean of food and wealth not swirling but dried.
reading.ThirtyCheck.ARMOUR_VESSEL.5.WHITE=The fifth check for armour and the copper vessel is white and good. Its image is the cheese mountain heaped.
reading.ThirtyCheck.ARMOUR_VESSEL.5.BLACK=The fifth check for armour and the copper vessel is black: it is bad in the place of dairy. Its image is the cheese mountain not formed.
reading.ThirtyCheck.ARMOUR_VESSEL.6.WHITE=The sixth check for armour and the copper vessel is white and good. Its image is the meat mountain heaped, not collapsed.
reading.ThirtyCheck.ARMOUR_VESSEL.6.BLACK=The sixth check for armour and the copper vessel is black: it is bad in the place of livestock. Its image is the meat mountain collapsed.
reading.ThirtyCheck.ARMOUR_VESSEL.7.WHITE=The seventh check for armour and the copper vessel is white and good. Its image is the beer pot's bottom not broken.
reading.ThirtyCheck.ARMOUR_VESSEL.7.BLACK=The seventh check for armour and the copper vessel is black: utensils and enjoyments are lost. Its image is the beer pot's bottom broken.
reading.ThirtyCheck.ARMOUR_VESSEL.8.WHITE=The eighth check for armour and the copper vessel is white and good. Its image is the dough not lost down the precipice.
reading.ThirtyCheck.ARMOUR_VESSEL.8.BLACK=The eighth check for armour and the copper vessel is black: it is bad for food and wealth in the later part of life. Its image is the dough lost down the precipice.
reading.ThirtyCheck.ARMOUR_VESSEL.8.BLACK.remedy=make the hundred-and-four giving, protect and call back the fortune (གཡང, g.yang), gather the first share of food, and protect the food's fortune
reading.ThirtyCheck.LA_TREE.1.WHITE=The first check for the la tree (བླ་ཤིང, bla shing) is white and good: the spring of existence is full.
reading.ThirtyCheck.LA_TREE.1.BLACK=The first check for the la tree (བླ་ཤིང, bla shing) is black: it is bad for the whole circle of women. Its image is the water of existence dried.
reading.ThirtyCheck.LA_TREE.2.WHITE=The second check for the la tree (བླ་ཤིང, bla shing) is white and good: the dagger of existence stands and has not gone up into the sky.
reading.ThirtyCheck.LA_TREE.2.BLACK=The second check for the la tree (བླ་ཤིང, bla shing) is black: children are hard to raise. Its image is the dagger of existence gone up into the sky.
reading.ThirtyCheck.LA_TREE.2.BLACK.remedy=make the rite of existence, and plant the dagger of existence
reading.ThirtyCheck.LA_TREE.3.WHITE=The third check for the la tree (བླ་ཤིང, bla shing) is white and good: the fire spirit and the water spirit do no harm.
reading.ThirtyCheck.LA_TREE.3.BLACK=The third check for the la tree (བླ་ཤིང, bla shing) is black: the fire spirit and the water spirit harm, and it is bad for people and wealth.
reading.ThirtyCheck.LA_TREE.4.WHITE=The fourth check for the la tree (བླ་ཤིང, bla shing) is white: the theurang (ཐེའུ་བྲང, the'u brang) and the senmo (བསེན་མོ, bsen mo) do not take the place of son and husband.
reading.ThirtyCheck.LA_TREE.4.BLACK=The fourth check for the la tree (བླ་ཤིང, bla shing) is black: the theurang (ཐེའུ་བྲང, the'u brang) and the senmo (བསེན་མོ, bsen mo) enter the womb, and it is bad for children and descendants.
reading.ThirtyCheck.LA_TREE.4.BLACK.remedy=hold ritual services (རིམ་གྲོ, rim gro), and the like
reading.ThirtyCheck.LA_TREE.5.WHITE=The fifth check for the la tree (བླ་ཤིང, bla shing) is white: it is good for sons and wealth. Its image is the ocean of existence swirling.
reading.ThirtyCheck.LA_TREE.5.BLACK=The fifth check for the la tree (བླ་ཤིང, bla shing) is black and bad. Its image is the ocean of existence dried.
reading.ThirtyCheck.LA_TREE.5.BLACK.remedy=strive at the rites of expelling misfortune (བྱུར, byur) and increasing glory (དཔལ་བསྐྱེད, dpal bskyed)
reading.ThirtyCheck.LA_TREE.6.WHITE=The sixth check for the la tree (བླ་ཤིང, bla shing) is white: nothing harms, the life force (སྲོག, srog) is firm, and sons and grandsons are good.
reading.ThirtyCheck.LA_TREE.6.BLACK=The sixth check for the la tree (བླ་ཤིང, bla shing) is black: a spirit harms continually.
reading.ThirtyCheck.LA_TREE.7.WHITE=The seventh check for the la tree (བླ་ཤིང, bla shing) is white and good: no harm comes from the place of the mother's father's line.
reading.ThirtyCheck.LA_TREE.7.BLACK=The seventh check for the la tree (བླ་ཤིང, bla shing) is black: the local spirits of the maternal uncle's side always harm.
reading.ThirtyCheck.LA_TREE.7.BLACK.remedy=as the ransom rite (གཏོ, gto), turn the crowd of spirits
reading.ThirtyCheck.LA_TREE.8.WHITE=The eighth check for the la tree (བླ་ཤིང, bla shing) is white and good: the theurang (ཐེའུ་བྲང, the'u brang) and the senmo (བསེན་མོ, bsen mo) have not entered the womb door.
reading.ThirtyCheck.LA_TREE.8.BLACK=The eighth check for the la tree (བླ་ཤིང, bla shing) is black and bad: the theurang (ཐེའུ་བྲང, the'u brang) and the senmo (བསེན་མོ, bsen mo) have entered the womb door.
reading.ThirtyCheck.LA_TREE.8.BLACK.remedy=send the gyalpo's (རྒྱལ་པོ, rgyal po) thread-cross (མདོས, mdos), and lay down the theurang's (ཐེའུ་བྲང, the'u brang) thread-cross
reading.ThirtyCheck.HELPING_GOD.1.WHITE=The first check for the helping god is white and good: the row of the male god (ཕོ་ལྷ, pho lha) is not broken.
reading.ThirtyCheck.HELPING_GOD.1.BLACK=The first check for the helping god is black: the row of the male god (ཕོ་ལྷ, pho lha) is broken, and the male god flees.
reading.ThirtyCheck.HELPING_GOD.1.BLACK.remedy=call back what fled, and make the mending rite
reading.ThirtyCheck.HELPING_GOD.2.WHITE=The second check for the helping god is white and good: the maternal uncle's god (ཞང་ལྷ, zhang lha) leads and does not wander in the human realm.
reading.ThirtyCheck.HELPING_GOD.2.BLACK=The second check for the helping god is black: the maternal uncle's god (ཞང་ལྷ, zhang lha) wanders in the human realm, and sorrow comes on the uncle's side.
reading.ThirtyCheck.HELPING_GOD.2.BLACK.remedy=send the black three-headed nine-fold thread-cross (མདོས, mdos)
reading.ThirtyCheck.HELPING_GOD.3.WHITE=The third check for the helping god is white and good: the war god (དགྲ་ལྷ, dgra lha) protects.
reading.ThirtyCheck.HELPING_GOD.3.BLACK=The third check for the helping god is black: the war god (དགྲ་ལྷ, dgra lha) has fallen to the demons (བདུད, bdud).
reading.ThirtyCheck.HELPING_GOD.3.BLACK.remedy=offer to the war god (དགྲ་ལྷ, dgra lha), press down the spirits of enmity (དགྲ་སྲི, dgra sri), and make the rite of expelling misfortune (བྱུར, byur) and increasing glory (དཔལ་བསྐྱེད, dpal bskyed)
reading.ThirtyCheck.HELPING_GOD.4.WHITE=The fourth check for the helping god is white: pollution does not press the shoulder god (ཕྲག་ལྷ, phrag lha), and enjoyments are good.
reading.ThirtyCheck.HELPING_GOD.4.BLACK=The fourth check for the helping god is black: pollution presses the shoulder god (ཕྲག་ལྷ, phrag lha).
reading.ThirtyCheck.HELPING_GOD.4.BLACK.remedy=wash the gods, offer to them and make the fumigation offering, call back what fled, and the like
reading.ThirtyCheck.HELPING_GOD.5.WHITE=The fifth check for the helping god is white: no enemy presses the local god (ཡུལ་ལྷ, yul lha), and it protects one.
reading.ThirtyCheck.HELPING_GOD.5.BLACK=The fifth check for the helping god is black: an enemy presses the local god (ཡུལ་ལྷ, yul lha).
reading.ThirtyCheck.HELPING_GOD.5.BLACK.remedy=offer to the local god (ཡུལ་ལྷ, yul lha), ransom death and the la, the life-spirit (བླ, bla), press down the spirits of enmity (དགྲ་སྲི, dgra sri), and make the enemy pit and the fumigation offering
reading.ThirtyCheck.HELPING_GOD.6.WHITE=The sixth check for the helping god is white and good: no lawsuit presses the peak god (རྩེ་ལྷ, rtse lha) of the castle.
reading.ThirtyCheck.HELPING_GOD.6.BLACK=The sixth check for the helping god is black: a lawsuit presses the peak god (རྩེ་ལྷ, rtse lha) of the castle.
reading.ThirtyCheck.HELPING_GOD.6.BLACK.remedy=make offerings and the fumigation offering
reading.ThirtyCheck.HELPING_GOD.7.WHITE=The seventh check for the helping god is white: the pollution of widowhood does not strike the mother god (མ་ལྷ, ma lha), and the mother's place is good.
reading.ThirtyCheck.HELPING_GOD.7.BLACK=The seventh check for the helping god is black: the pollution of widowhood strikes the mother god (མ་ལྷ, ma lha). It is somewhat bad for being married into another country.
reading.ThirtyCheck.HELPING_GOD.7.BLACK.remedy=offer to the mother god (མ་ལྷ, ma lha), protect the fortune (གཡང, g.yang), and call back what fled
reading.ThirtyCheck.HELPING_GOD.8.WHITE=The eighth check for the helping god is white and good: the life god (སྲོག་ལྷ, srog lha) and the inner god (ནང་ལྷ, nang lha) do not lurk at a corpse.
reading.ThirtyCheck.HELPING_GOD.8.BLACK=The eighth check for the helping god is black and bad: the life god (སྲོག་ལྷ, srog lha) disputes over a corpse.
reading.ThirtyCheck.HELPING_GOD.8.BLACK.remedy=make the fumigation offering, the rite of removing the corpse and the white rite of summoning life
reading.ThirtyCheck.HARMING_SPIRIT.1.WHITE=The first check for the harming spirit is white and good: the male demon (བདུད, bdud) has not risen as a spirit.
reading.ThirtyCheck.HARMING_SPIRIT.1.BLACK=The first check for the harming spirit is black: the male demon (བདུད, bdud) has risen as a spirit. It is bad for the men of the male line.
reading.ThirtyCheck.HARMING_SPIRIT.2.WHITE=The second check for the harming spirit is white and good: the female demon does not rise as an enemy, and the female line grows.
reading.ThirtyCheck.HARMING_SPIRIT.2.BLACK=The second check for the harming spirit is black: the female demon has risen as a spirit, and it is bad for the female line.
reading.ThirtyCheck.HARMING_SPIRIT.2.BLACK.remedy=make the rite of turning back, turn the elements by rite, and press down enemies
reading.ThirtyCheck.HARMING_SPIRIT.3.WHITE=The third check for the harming spirit is white: nothing steals, and food and wealth grow.
reading.ThirtyCheck.HARMING_SPIRIT.3.BLACK=The third check for the harming spirit is black: a spirit steals one after another.
reading.ThirtyCheck.HARMING_SPIRIT.3.BLACK.remedy=make the laying-down rite against the stealing gongpo spirits (འགོང་པོ, 'gong po)
reading.ThirtyCheck.HARMING_SPIRIT.4.WHITE=The fourth check for the harming spirit is white: no spirit has entered the womb door, and the human line grows.
reading.ThirtyCheck.HARMING_SPIRIT.4.BLACK=The fourth check for the harming spirit is black: a spirit has entered the womb door, and the human line does not grow.
reading.ThirtyCheck.HARMING_SPIRIT.4.BLACK.remedy=make the theurang's (ཐེའུ་བྲང, the'u brang) laying-down rite, and the like
reading.ThirtyCheck.HARMING_SPIRIT.5.WHITE=The fifth check for the harming spirit is white: nothing attacks the life force (སྲོག, srog), and life is firm.
reading.ThirtyCheck.HARMING_SPIRIT.5.BLACK=The fifth check for the harming spirit is black: a spirit attacks the life force (སྲོག, srog), and obstacles come to life.
reading.ThirtyCheck.HARMING_SPIRIT.6.WHITE=The sixth check for the harming spirit is white and good: nothing steals the la, the life-spirit (བླ, bla), and life.
reading.ThirtyCheck.HARMING_SPIRIT.6.BLACK=The sixth check for the harming spirit is black and bad: a spirit steals the la, the life-spirit (བླ, bla), and life.
reading.ThirtyCheck.HARMING_SPIRIT.7.WHITE=The seventh check for the harming spirit is white: it is good for oneself.
reading.ThirtyCheck.HARMING_SPIRIT.7.BLACK=The seventh check for the harming spirit is black, and it is bad.
reading.ThirtyCheck.HARMING_SPIRIT.7.BLACK.remedy=make the rite of pressing down the spirits of the prime (དར་སྲི, dar sri)
reading.ThirtyCheck.HARMING_SPIRIT.8.WHITE=The eighth check for the harming spirit is white and good: no royal castle of a spirit is built in one's own place.
reading.ThirtyCheck.HARMING_SPIRIT.8.BLACK=The eighth check for the harming spirit is black and bad: a royal castle of a spirit is built.
reading.ThirtyCheck.HARMING_SPIRIT.8.BLACK.remedy=make the laying-down rite of the gyalpo (རྒྱལ་པོ, rgyal po)
reading.ThirtyCheck.OLD.1.WHITE=The first check for the old is white and good: the white bkra (བཀྲ, bkra) sees the great-grandchildren.
reading.ThirtyCheck.OLD.1.BLACK=The first check for the old is black: the white bkra (བཀྲ, bkra) does not see the great-grandchildren, and it is bad for the human line.
reading.ThirtyCheck.OLD.1.BLACK.remedy=call back the fortune (གཡང, g.yang) of the bkra (བཀྲ, bkra), and the like
reading.ThirtyCheck.OLD.2.WHITE=The second check for the old is white and very good: the speckled bkra (བཀྲ, bkra) sees the grandsons.
reading.ThirtyCheck.OLD.2.BLACK=The second check for the old is black and bad: the speckled bkra (བཀྲ, bkra) does not see the grandsons.
reading.ThirtyCheck.OLD.2.BLACK.remedy=make the rite of calling back the fortune (གཡང, g.yang) of the bkra (བཀྲ, bkra)
reading.ThirtyCheck.OLD.3.WHITE=The third check for the old is white and good: the black bkra (བཀྲ, bkra) does not see daughters.
reading.ThirtyCheck.OLD.3.BLACK=The third check for the old is black: the black bkra (བཀྲ, bkra) sees daughters, and it is bad for the human line.
reading.ThirtyCheck.OLD.3.BLACK.remedy=make a rite of turning back
reading.ThirtyCheck.OLD.4.WHITE=The fourth check for the old is white: the black spirit of the bkra (བཀྲ, bkra) does not press, and it is good for the human line.
reading.ThirtyCheck.OLD.4.BLACK=The fourth check for the old is black and bad: the black spirit of the bkra (བཀྲ, bkra) presses.
reading.ThirtyCheck.OLD.4.BLACK.remedy=as the ransom rite (གཏོ, gto), summon the fortune (གཡང, g.yang) of the bkra (བཀྲ, bkra) to grow
reading.ThirtyCheck.OLD.5.WHITE=The fifth check for the old is white and very good: the king of the bkra (བཀྲ, bkra) has come forth to the royal place.
reading.ThirtyCheck.OLD.5.BLACK=The fifth check for the old is black and bad: the king of the bkra (བཀྲ, bkra) has not come forth to the royal place.
reading.ThirtyCheck.OLD.5.BLACK.remedy=summon the fortune (གཡང, g.yang) of the bkra (བཀྲ, bkra), and make other rites of good fortune
reading.ThirtyCheck.OLD.6.WHITE=The sixth check for the old is white and very good: the auspicious castle has been built.
reading.ThirtyCheck.OLD.6.BLACK=The sixth check for the old is black and bad: the auspicious castle has not been built.
reading.ThirtyCheck.OLD.6.BLACK.remedy=make the chanted rite and empowerment, and recite the Heap of Auspiciousness (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa)
reading.ThirtyCheck.OLD.7.WHITE=The seventh check for the old is white and good: the black bkra (བཀྲ, bkra) does not cut the generations, and sons and grandsons are seen.
reading.ThirtyCheck.OLD.7.BLACK=The seventh check for the old is black: the black bkra (བཀྲ, bkra) cuts the generations.
reading.ThirtyCheck.OLD.7.BLACK.remedy=make the rite of increasing the auspicious human line
reading.ThirtyCheck.OLD.8.WHITE=The eighth check for the old is white: auspicious sons and grandsons are gathered.
reading.ThirtyCheck.OLD.8.BLACK=The eighth check for the old is black and bad: auspicious sons and grandsons are not gathered.
reading.ThirtyCheck.OLD.8.BLACK.remedy=summon the fortune (གཡང, g.yang) of the bkra (བཀྲ, bkra)
reading.ThirtyCheck.SICK.1.WHITE=The first check for the sick is white and good: the theurang (ཐེའུ་བྲང, the'u brang) and their kind are not the lords of the illness.
reading.ThirtyCheck.SICK.1.BLACK=The first check for the sick is black: the lord of the illness is present, and pains come.
reading.ThirtyCheck.SICK.1.BLACK.remedy=make the mamo's (མ་མོ, ma mo) turning back, and the like
reading.ThirtyCheck.SICK.2.WHITE=The second check for the sick is white and good: no fever spreads in the upper body of oneself or the household.
reading.ThirtyCheck.SICK.2.BLACK=The second check for the sick is black: fever spreads in the upper body, and the upper door of the corpse is open. Take care.
reading.ThirtyCheck.SICK.3.WHITE=The third check for the sick is white and good: no cold disease has fallen into the lower body.
reading.ThirtyCheck.SICK.3.BLACK=The third check for the sick is black: cold disease has fallen into the lower body, with the disease of the nāgas (ཀླུ, klu) and dropsy.
reading.ThirtyCheck.SICK.3.BLACK.remedy=offer a water torma (ཆབ་གཏོར, chab gtor), make the rite of the nāgas (ཀླུ, klu), and the like
reading.ThirtyCheck.SICK.4.WHITE=The fourth check for the sick is white and good: neither madness nor dizziness comes to oneself or the household.
reading.ThirtyCheck.SICK.4.BLACK=The fourth check for the sick is black: madness and dizziness come.
reading.ThirtyCheck.SICK.4.BLACK.remedy=strive at the gyalpo's (རྒྱལ་པོ, rgyal po) thread-cross (མདོས, mdos) and the blood thread-cross
reading.ThirtyCheck.SICK.5.WHITE=The fifth check for the sick is white and good: neither god disease nor heaviness comes.
reading.ThirtyCheck.SICK.5.BLACK=The fifth check for the sick is black: god disease and heaviness come.
reading.ThirtyCheck.SICK.5.BLACK.remedy=offer to the gods, make the fumigation offering, and wash the gods
reading.ThirtyCheck.SICK.6.WHITE=The sixth check for the sick is white and good: no god-demons have risen as spirits, and no sign of illness shows.
reading.ThirtyCheck.SICK.6.BLACK=The sixth check for the sick is black and bad: god-demons have risen as spirits.
reading.ThirtyCheck.SICK.6.BLACK.remedy=send the pure gods' thread-cross (མདོས, mdos) to turn it back
reading.ThirtyCheck.SICK.7.WHITE=The seventh check for the sick is white and good: no sign of blood disease shows.
reading.ThirtyCheck.SICK.7.BLACK=The seventh check for the sick is black: blood disease comes, spreading its red.
reading.ThirtyCheck.SICK.7.BLACK.remedy=send the mamo's (མ་མོ, ma mo) blood thread-cross (མདོས, mdos), the weapon thread-cross and the like
reading.ThirtyCheck.SICK.8.WHITE=The eighth check for the sick is white and good: no tumours or dropsy come below to oneself or the household.
reading.ThirtyCheck.SICK.8.BLACK=The eighth check for the sick is black: there is a risk of tumours and dropsy below.
reading.ThirtyCheck.SICK.8.BLACK.remedy=make the rite of the nāgas (ཀླུ, klu) and the many cures of the nāgas
reading.ThirtyCheck.DEAD.1.WHITE=The first check for the dead is white and good: the death's eye does not look at the living.
reading.ThirtyCheck.DEAD.1.BLACK=The first check for the dead is black and bad: the death's eye looks at the living.
reading.ThirtyCheck.DEAD.1.BLACK.remedy=make the rite for the dead and reconcile the earth lords (ས་བདག, sa bdag), and where the trigram (སྤར་ཁ, spar kha) and mewa (སྨེ་བ, sme ba) meet on one seat, cut the joined hands of the living and the dead
reading.ThirtyCheck.DEAD.2.WHITE=The second check for the dead is white: the living and the dead have not joined hands, and it is good for those after.
reading.ThirtyCheck.DEAD.2.BLACK=The second check for the dead is black: the living and the dead meet on the seat of the trigram (སྤར་ཁ, spar kha) and mewa (སྨེ་བ, sme ba).
reading.ThirtyCheck.DEAD.2.BLACK.remedy=apply the means of cutting their joined hands
reading.ThirtyCheck.DEAD.3.WHITE=The third check for the dead is white: the earth lord (ས་བདག, sa bdag) of the corpse has not fallen to the demons (བདུད, bdud).
reading.ThirtyCheck.DEAD.3.BLACK=The third check for the dead is black and bad: the earth lord (ས་བདག, sa bdag) of the corpse has fallen to the demons (བདུད, bdud).
reading.ThirtyCheck.DEAD.3.BLACK.remedy=strive at the rite of turning the earth lords (ས་བདག, sa bdag) with a ransom rite (གཏོ, gto)
reading.ThirtyCheck.DEAD.4.WHITE=The fourth check for the dead is white: the dead does not desire the food of the corpse, and it is good for those after.
reading.ThirtyCheck.DEAD.4.BLACK=The fourth check for the dead is black: the dead desires the food of the corpse.
reading.ThirtyCheck.DEAD.4.BLACK.remedy=rely on white food, and give food and the like in full
reading.ThirtyCheck.DEAD.5.WHITE=The fifth check for the dead is white and good: the corpse's head is not reversed but turned to the enemy's direction.
reading.ThirtyCheck.DEAD.5.BLACK=The fifth check for the dead is black: the face shows the friend's direction, and the head's direction is reversed.
reading.ThirtyCheck.DEAD.5.BLACK.remedy=make Kong tse's turning rite (ཀོང་ཙེའི་གཏོ་བསྒྱུར, kong tse'i gto bsgyur), and the like
reading.ThirtyCheck.DEAD.6.WHITE=The sixth check for the dead is white and good: the dead is born among gods, men and the like.
reading.ThirtyCheck.DEAD.6.BLACK=The sixth check for the dead is black: the dead is born in the three bad realms.
reading.ThirtyCheck.DEAD.6.BLACK.remedy=strive at the white side of virtue
reading.ThirtyCheck.DEAD.7.WHITE=The seventh check for the dead is white and good: the great strike does not return on the household.
reading.ThirtyCheck.DEAD.7.BLACK=The seventh check for the dead is black: the great strike falls on the household.
reading.ThirtyCheck.DEAD.7.BLACK.remedy=make the planets' rite, mend the strike, and the like
reading.ThirtyCheck.DEAD.8.WHITE=The eighth check for the dead is white and good: no star strike has fallen on the country.
reading.ThirtyCheck.DEAD.8.BLACK=The eighth check for the dead is black: the star strike falls on the whole country, above all on the townspeople. Many die at that time.
reading.ThirtyCheck.DEAD.8.BLACK.remedy=mend the star strike, and make other cures
reading.ThirtyCheck.BURNING.1.WHITE=The first check for burning or keeping the remains is white: a fire corpse and a fever corpse are good to burn.
reading.ThirtyCheck.BURNING.1.BLACK=The first check for burning or keeping the remains is black: the corpse may not be burnt.
reading.ThirtyCheck.BURNING.2.WHITE=The second check for burning or keeping the remains is white: an earth corpse or a water corpse may be cast into water.
reading.ThirtyCheck.BURNING.2.BLACK=The second check for burning or keeping the remains is black: the corpse may not be cast into water. Avoid it.
reading.ThirtyCheck.BURNING.3.WHITE=The third check for burning or keeping the remains is white: an iron corpse is burnt at the foot of a rock. Its head is not shown to the east.
reading.ThirtyCheck.BURNING.3.BLACK=The third check for burning or keeping the remains is black: an iron corpse is not burnt at the foot of a rock. Avoid it and the like.
reading.ThirtyCheck.BURNING.4.WHITE=The fourth check for burning or keeping the remains is white and good: the killer's corpse does not cling to livestock and wealth.
reading.ThirtyCheck.BURNING.4.BLACK=The fourth check for burning or keeping the remains is black: the corpse clings to the goods and utensils struck by the planets and stars.
reading.ThirtyCheck.BURNING.4.BLACK.remedy=turn the killer's face
reading.ThirtyCheck.BURNING.5.WHITE=The fifth check for burning or keeping the remains is white: the road of the corpse is not blocked.
reading.ThirtyCheck.BURNING.5.BLACK=The fifth check for burning or keeping the remains is black: the road of the corpse is faulty, and a spirit blocks it.
reading.ThirtyCheck.BURNING.5.BLACK.remedy=turn the face of the spirit that blocks it, and the like
reading.ThirtyCheck.BURNING.6.WHITE=The sixth check for burning or keeping the remains is white and good: the earth lords (ས་བདག, sa bdag) are tamed.
reading.ThirtyCheck.BURNING.6.BLACK=The sixth check for burning or keeping the remains is black and bad: the earth lords (ས་བདག, sa bdag) are not tamed.
reading.ThirtyCheck.BURNING.7.WHITE=The seventh check for burning or keeping the remains is white: the corpse load does no harm.
reading.ThirtyCheck.BURNING.7.BLACK=The seventh check for burning or keeping the remains is black: the corpse load's strength is spent.
reading.ThirtyCheck.BURNING.8.WHITE=The eighth check for burning or keeping the remains is white: sending one bone to the ground is allowed.
reading.ThirtyCheck.BURNING.8.BLACK=The eighth check for burning or keeping the remains is black: no bone is sent to the ground.
reading.ThirtyCheck.GRAVE_SITE.1.WHITE=The first check for the grave site is white: the dead does not go into the forefathers' grave.
reading.ThirtyCheck.GRAVE_SITE.1.BLACK=The first check for the grave site is black and bad: the dead goes into the forefathers' grave.
reading.ThirtyCheck.GRAVE_SITE.2.WHITE=The second check for the grave site is white: by the good grave site, the living have good fortune.
reading.ThirtyCheck.GRAVE_SITE.2.BLACK=The second check for the grave site is black: it is somewhat bad for the living.
reading.ThirtyCheck.GRAVE_SITE.3.WHITE=The third check for the grave site is white: the ornament is not tied.
reading.ThirtyCheck.GRAVE_SITE.3.BLACK=The third check for the grave site is black and bad: the ornament is tied.
reading.ThirtyCheck.GRAVE_SITE.4.WHITE=The fourth check for the grave site is white: one's own ornament wins over the grave's misfortune (བྱུར, byur).
reading.ThirtyCheck.GRAVE_SITE.4.BLACK=The fourth check for the grave site is black and bad: the spirit of misfortune (བྱུར, byur) wins.
reading.ThirtyCheck.GRAVE_SITE.5.WHITE=The fifth check for the grave site is white: no child's la, the life-spirit (བླ, bla), is stolen.
reading.ThirtyCheck.GRAVE_SITE.5.BLACK=The fifth check for the grave site is black and bad: a child's la, the life-spirit (བླ, bla), is stolen.
reading.ThirtyCheck.GRAVE_SITE.5.BLACK.remedy=send the spirits of small children (ཆུང་སྲི, chung sri) the small ransom (གླུད, glud)
reading.ThirtyCheck.GRAVE_SITE.6.WHITE=The sixth check for the grave site is white and good: the grave spirits (དུར་སྲི, dur sri) have not entered the castle or stolen existence.
reading.ThirtyCheck.GRAVE_SITE.6.BLACK=The sixth check for the grave site is black: the grave spirits (དུར་སྲི, dur sri) have entered and stolen.
reading.ThirtyCheck.GRAVE_SITE.6.BLACK.remedy=make the laying-down rite of the grave
reading.ThirtyCheck.GRAVE_SITE.7.WHITE=The seventh check for the grave site is white: spirits and ogres do not obscure the ornament.
reading.ThirtyCheck.GRAVE_SITE.7.BLACK=The seventh check for the grave site is black: spirits and ogres obscure the ornament, and the spirits of downfall (འཕུང་སྲི, 'phung sri) harm.
reading.ThirtyCheck.GRAVE_SITE.7.BLACK.remedy=lay down the rite against the spirits of downfall (འཕུང་སྲི, 'phung sri), and the like
reading.ThirtyCheck.GRAVE_SITE.8.WHITE=The eighth check for the grave site is white: the spirits of downfall (འཕུང་སྲི, 'phung sri) do not open the grave.
reading.ThirtyCheck.GRAVE_SITE.8.BLACK=The eighth check for the grave site is black: the spirits of downfall (འཕུང་སྲི, 'phung sri) open the grave.
reading.ThirtyCheck.GRAVE_SITE.8.BLACK.remedy=make the laying-down rite against downfall
reading.ThirtyCheck.RITES.1.WHITE=The first check for the rites is white: by the white rite, the king of the earth lords (ས་བདག, sa bdag) is offered to.
reading.ThirtyCheck.RITES.1.BLACK=The first check for the rites is black: the king of the earth lords (ས་བདག, sa bdag) is not offered to.
reading.ThirtyCheck.RITES.1.BLACK.remedy=offer to the king of the earth lords (ས་བདག, sa bdag), and take care
reading.ThirtyCheck.RITES.2.WHITE=The second check for the rites is white and good: by the speckled rite, the earth lords (ས་བདག, sa bdag) are not disturbed.
reading.ThirtyCheck.RITES.2.BLACK=The second check for the rites is black: the earth lords (ས་བདག, sa bdag) are disturbed.
reading.ThirtyCheck.RITES.2.BLACK.remedy=make the great rite for the disturbed earth lords (ས་བདག, sa bdag)
reading.ThirtyCheck.RITES.3.WHITE=The third check for the rites is white and good: by the black rite, Rudra (རུ་ཏྲ, ru tra) is liberated.
reading.ThirtyCheck.RITES.3.BLACK=The third check for the rites is black: Rudra (རུ་ཏྲ, ru tra) is not liberated.
reading.ThirtyCheck.RITES.3.BLACK.remedy=make the black rites that turn back enemies
reading.ThirtyCheck.RITES.4.WHITE=The fourth check for the rites is white and good: the name-sound tames the enemy.
reading.ThirtyCheck.RITES.4.BLACK=The fourth check for the rites is black: the name-sound does not tame the enemy.
reading.ThirtyCheck.RITES.4.BLACK.remedy=press down the spirits of enmity (དགྲ་སྲི, dgra sri)
reading.ThirtyCheck.RITES.5.WHITE=The fifth check for the rites is white: the rite against gossip (མི་ཁ, mi kha) has been sent. There is no fault, and one has met the gods.
reading.ThirtyCheck.RITES.5.BLACK=The fifth check for the rites is black: the rite against gossip (མི་ཁ, mi kha) has not been sent.
reading.ThirtyCheck.RITES.5.BLACK.remedy=turn and turn back the crowd's gossip (མི་ཁ, mi kha)
reading.ThirtyCheck.RITES.6.WHITE=The sixth check for the rites is white and good: the male line's turning back of the crowd is done.
reading.ThirtyCheck.RITES.6.BLACK=The sixth check for the rites is black: the male line's turning back of the crowd is not done.
reading.ThirtyCheck.RITES.6.BLACK.remedy=strive at turning back for the male line
reading.ThirtyCheck.RITES.7.WHITE=The seventh check for the rites is white and good: the female line's turning back is done.
reading.ThirtyCheck.RITES.7.BLACK=The seventh check for the rites is black: the female line's turning back is not done.
reading.ThirtyCheck.RITES.7.BLACK.remedy=strive at the kinds of turning back for the female line
reading.ThirtyCheck.RITES.8.WHITE=The eighth check for the rites is white: the path of the earth lords (ས་བདག, sa bdag) is mended.
reading.ThirtyCheck.RITES.8.BLACK=The eighth check for the rites is black: the path of the earth lords (ས་བདག, sa bdag) is not mended.
reading.ThirtyCheck.RITES.8.BLACK.remedy=strive at the rites
reading.ThirtyCheck.MEN_LIFE_FORCE.1.WHITE=The first check for men's life force (སྲོག, srog) is white: the tree of life grows.
reading.ThirtyCheck.MEN_LIFE_FORCE.1.BLACK=The first check for men's life force (སྲོག, srog) is black: the tree of life is broken.
reading.ThirtyCheck.MEN_LIFE_FORCE.1.BLACK.remedy=plant the dagger that supports the life of people and wealth
reading.ThirtyCheck.MEN_LIFE_FORCE.2.WHITE=The second check for men's life force (སྲོག, srog) is white: the demons (བདུད, bdud) do not deceive life.
reading.ThirtyCheck.MEN_LIFE_FORCE.2.BLACK=The second check for men's life force (སྲོག, srog) is black: the demons (བདུད, bdud) deceive life.
reading.ThirtyCheck.MEN_LIFE_FORCE.2.BLACK.remedy=offer to the gods, ransom the la, the life-spirit (བླ, bla), and the like
reading.ThirtyCheck.MEN_LIFE_FORCE.3.WHITE=The third check for men's life force (སྲོག, srog) is white: spirits have not carried off the la, the life-spirit (བླ, bla), and life.
reading.ThirtyCheck.MEN_LIFE_FORCE.3.BLACK=The third check for men's life force (སྲོག, srog) is black: spirits have carried off the la, the life-spirit (བླ, bla), and life. The life ransom and the life-castle (སྲོག་མཁར, srog mkhar) have collapsed.
reading.ThirtyCheck.MEN_LIFE_FORCE.3.BLACK.remedy=set up the life-castle (སྲོག་མཁར, srog mkhar), and the like
reading.ThirtyCheck.MEN_LIFE_FORCE.4.WHITE=The fourth check for men's life force (སྲོག, srog) is white: the forefathers' death spirits do no harm.
reading.ThirtyCheck.MEN_LIFE_FORCE.4.BLACK=The fourth check for men's life force (སྲོག, srog) is black: the forefathers' death spirits lurk and harm.
reading.ThirtyCheck.MEN_LIFE_FORCE.4.BLACK.remedy=make offerings to the dead of the grave
reading.ThirtyCheck.MEN_LIFE_FORCE.5.WHITE=The fifth check for men's life force (སྲོག, srog) is white: the luck-spirit of the maternal uncle does no harm.
reading.ThirtyCheck.MEN_LIFE_FORCE.5.BLACK=The fifth check for men's life force (སྲོག, srog) is black: one has fallen into the mouth of the maternal uncle's luck-spirit, and it harms.
reading.ThirtyCheck.MEN_LIFE_FORCE.5.BLACK.remedy=bind it with the life dagger and the life peg
reading.ThirtyCheck.MEN_LIFE_FORCE.6.WHITE=The sixth check for men's life force (སྲོག, srog) is white: the outer net of the trigram (སྤར་ཁ, spar kha) is not torn.
reading.ThirtyCheck.MEN_LIFE_FORCE.6.BLACK=The sixth check for men's life force (སྲོག, srog) is black: the outer net of the trigram (སྤར་ཁ, spar kha) is torn.
reading.ThirtyCheck.MEN_LIFE_FORCE.6.BLACK.remedy=make the rite of the trigram (སྤར་ཁ, spar kha)
reading.ThirtyCheck.MEN_LIFE_FORCE.7.WHITE=The seventh check for men's life force (སྲོག, srog) is white: the year-house has not entered the tomb.
reading.ThirtyCheck.MEN_LIFE_FORCE.7.BLACK=The seventh check for men's life force (སྲོག, srog) is black: the inner life has entered the year's tomb.
reading.ThirtyCheck.MEN_LIFE_FORCE.8.WHITE=The eighth check for men's life force (སྲོག, srog) is white: the secret nine-multiple (དགུ་མིག, dgu mig) has not entered, and the body has no illness.
reading.ThirtyCheck.MEN_LIFE_FORCE.8.BLACK=The eighth check for men's life force (སྲོག, srog) is black: the lasting nine-multiple (དགུ་མིག, dgu mig) has entered.
reading.ThirtyCheck.MEN_LIFE_FORCE.8.BLACK.remedy=make the rite of the year-star's nine-multiple (དགུ་མིག, dgu mig)
reading.ThirtyCheck.CHILDREN_BODY.1.WHITE=The first check for children's body (ལུས, lus) is white: the body has not entered the tomb, and there is happiness without illness.
reading.ThirtyCheck.CHILDREN_BODY.1.BLACK=The first check for children's body (ལུས, lus) is black and bad: the body has entered the tomb, with illness of body and suffering of mind.
reading.ThirtyCheck.CHILDREN_BODY.1.BLACK.remedy=change the body and change the name
reading.ThirtyCheck.CHILDREN_BODY.2.WHITE=The second check for children's body (ལུས, lus) is white: no illness comes. Its image is the body's mountain not collapsed.
reading.ThirtyCheck.CHILDREN_BODY.2.BLACK=The second check for children's body (ལུས, lus) is black: illness comes. Its image is the body's mountain collapsed.
reading.ThirtyCheck.CHILDREN_BODY.3.WHITE=The third check for children's body (ལུས, lus) is white: the body's supporting god has not parted, and the body's mountain grows.
reading.ThirtyCheck.CHILDREN_BODY.3.BLACK=The third check for children's body (ལུས, lus) is black and bad: the body's supporting god has parted.
reading.ThirtyCheck.CHILDREN_BODY.4.WHITE=The fourth check for children's body (ལུས, lus) is white: the body is not caught in the demon's net.
reading.ThirtyCheck.CHILDREN_BODY.4.BLACK=The fourth check for children's body (ལུས, lus) is black and bad: the body is caught in the demon's net.
reading.ThirtyCheck.CHILDREN_BODY.4.BLACK.remedy=entrust the child to the gods
reading.ThirtyCheck.CHILDREN_BODY.5.WHITE=The fifth check for children's body (ལུས, lus) is white: sons and grandsons increase.
reading.ThirtyCheck.CHILDREN_BODY.5.BLACK=The fifth check for children's body (ལུས, lus) is black, and it is bad.
reading.ThirtyCheck.CHILDREN_BODY.5.BLACK.remedy=recite the death's eye
reading.ThirtyCheck.CHILDREN_BODY.6.WHITE=The sixth check for children's body (ལུས, lus) is white: no evil spirits have risen against the body. There is no illness, and one meets the gods.
reading.ThirtyCheck.CHILDREN_BODY.6.BLACK=The sixth check for children's body (ལུས, lus) is black: evil spirits have risen against the body.
reading.ThirtyCheck.CHILDREN_BODY.6.BLACK.remedy=recite the long-life empowerment and the long-life dhāraṇī
reading.ThirtyCheck.CHILDREN_BODY.7.WHITE=The seventh check for children's body (ལུས, lus) is white: misfortune (བྱུར, byur) and lawsuits do not press.
reading.ThirtyCheck.CHILDREN_BODY.7.BLACK=The seventh check for children's body (ལུས, lus) is black: misfortune (བྱུར, byur) and lawsuits press. If a daughter died before, that bears it. If not, half the children survive and half do not.
reading.ThirtyCheck.CHILDREN_BODY.8.WHITE=The eighth check for children's body (ལུས, lus) is white: the demon's noose has not struck, and children, wealth and livestock grow.
reading.ThirtyCheck.CHILDREN_BODY.8.BLACK=The eighth check for children's body (ལུས, lus) is black and bad: the demon's noose has struck.
reading.ThirtyCheck.CHILDREN_BODY.8.BLACK.remedy=recite the dhāraṇī, and ransom the la, the life-spirit (བླ, bla)
reading.ThirtyCheck.WOMEN_POWER.1.WHITE=The first check for women's destiny (དབང་ཐང, dbang thang) is white: food, wealth and enjoyments gather. Its image is the lake of destiny not dried.
reading.ThirtyCheck.WOMEN_POWER.1.BLACK=The first check for women's destiny (དབང་ཐང, dbang thang) is black. Its image is the lake of destiny dried.
reading.ThirtyCheck.WOMEN_POWER.1.BLACK.remedy=make the rite of raising the destiny
reading.ThirtyCheck.WOMEN_POWER.2.WHITE=The second check for women's destiny (དབང་ཐང, dbang thang) is white. Its image is the mountain of destiny not burnt by fire.
reading.ThirtyCheck.WOMEN_POWER.2.BLACK=The second check for women's destiny (དབང་ཐང, dbang thang) is black: fire and water and the maternal luck harm. Its image is the mountain of destiny burnt by fire.
reading.ThirtyCheck.WOMEN_POWER.2.BLACK.remedy=make the raising rites and cures of the destiny
reading.ThirtyCheck.WOMEN_POWER.3.WHITE=The third check for women's destiny (དབང་ཐང, dbang thang) is white and good: sons, grandsons, brothers and sisters grow. Its image is the sons not lost from the mother's lap.
reading.ThirtyCheck.WOMEN_POWER.3.BLACK=The third check for women's destiny (དབང་ཐང, dbang thang) is black: it is bad for the woman's sons and wealth. Its image is the sons lost from the mother's lap.
reading.ThirtyCheck.WOMEN_POWER.3.BLACK.remedy=make the thread-cross (མདོས, mdos) of auspicious glory
reading.ThirtyCheck.WOMEN_POWER.4.WHITE=The fourth check for women's destiny (དབང་ཐང, dbang thang) is white and good: the destiny is not caught in the demon's net.
reading.ThirtyCheck.WOMEN_POWER.4.BLACK=The fourth check for women's destiny (དབང་ཐང, dbang thang) is black: the field gives no harvest, and there is no curd. Eating does not fill, and giving does not please.
reading.ThirtyCheck.WOMEN_POWER.4.BLACK.remedy=expel misfortune (བྱུར, byur), raise the glory (དཔལ, dpal), and turn the gossip (མི་ཁ, mi kha)
reading.ThirtyCheck.WOMEN_POWER.5.WHITE=The fifth check for women's destiny (དབང་ཐང, dbang thang) is white and good. Its image is the treasury of destiny not empty.
reading.ThirtyCheck.WOMEN_POWER.5.BLACK=The fifth check for women's destiny (དབང་ཐང, dbang thang) is black: it is bad in the father's line's place. Its image is the treasury of destiny empty.
reading.ThirtyCheck.WOMEN_POWER.6.WHITE=The sixth check for women's destiny (དབང་ཐང, dbang thang) is white and good: the destiny has not entered the spirits' road.
reading.ThirtyCheck.WOMEN_POWER.6.BLACK=The sixth check for women's destiny (དབང་ཐང, dbang thang) is black and bad: the destiny has entered the spirits' road.
reading.ThirtyCheck.WOMEN_POWER.7.WHITE=The seventh check for women's destiny (དབང་ཐང, dbang thang) is white: great enjoyment and eating fortune come. Its image is the enclosure of destiny full.
reading.ThirtyCheck.WOMEN_POWER.7.BLACK=The seventh check for women's destiny (དབང་ཐང, dbang thang) is black: it is bad for enjoyments. Its image is the castle of destiny collapsed.
reading.ThirtyCheck.WOMEN_POWER.8.WHITE=The eighth check for women's destiny (དབང་ཐང, dbang thang) is white: grain, wealth and enjoyments grow, and one father has a hundred sons.
reading.ThirtyCheck.WOMEN_POWER.8.BLACK=The eighth check for women's destiny (དབང་ཐང, dbang thang) is black: the demon's noose binds. It is good now but bad in the long run.
reading.ThirtyCheck.WOMEN_POWER.8.BLACK.remedy=untie the demon's noose, offer clothes and whitewash to stupas, circumambulate, offer lamps and mend the roads
reading.ThirtyCheck.GREAT_MEN_LUCK.1.WHITE=The first check for great men's luck (ཀླུང་རྟ, klung rta) is white: the forefathers are like kings. Its image is the luck's flagpole growing.
reading.ThirtyCheck.GREAT_MEN_LUCK.1.BLACK=The first check for great men's luck (ཀླུང་རྟ, klung rta) is black: the near rise as enemies unexpectedly, and enemies and thieves rob. The forefathers' country is lost, and one wanders elsewhere. Its image is the flagpole broken.
reading.ThirtyCheck.GREAT_MEN_LUCK.1.BLACK.remedy=strive at the rite of raising the luck (ཀླུང་རྟ, klung rta)
reading.ThirtyCheck.GREAT_MEN_LUCK.2.WHITE=The second check for great men's luck (ཀླུང་རྟ, klung rta) is white and good: no hostile gossip strikes from the country's people.
reading.ThirtyCheck.GREAT_MEN_LUCK.2.BLACK=The second check for great men's luck (ཀླུང་རྟ, klung rta) is black: though there is no fault, gossip hates. Giving pleases no one, and acts bear no fruit.
reading.ThirtyCheck.GREAT_MEN_LUCK.2.BLACK.remedy=strive at white acts, offer clothes to stupas, sweep the narrow paths, and strive at whatever roots of virtue can be done
reading.ThirtyCheck.GREAT_MEN_LUCK.3.WHITE=The third check for great men's luck (ཀླུང་རྟ, klung rta) is white: it declines now but is good in the long run. Its image is the luck's banner standing.
reading.ThirtyCheck.GREAT_MEN_LUCK.3.BLACK=The third check for great men's luck (ཀླུང་རྟ, klung rta) is black: the country's people mock, and obstacles come to life. Its image is the luck's banner faded.
reading.ThirtyCheck.GREAT_MEN_LUCK.3.BLACK.remedy=make fulfilment and restoring, and many practices of approach and accomplishment
reading.ThirtyCheck.GREAT_MEN_LUCK.4.WHITE=The fourth check for great men's luck (ཀླུང་རྟ, klung rta) is white and good: all aims are achieved. Its image is the luck not caught in the demon's net.
reading.ThirtyCheck.GREAT_MEN_LUCK.4.BLACK=The fourth check for great men's luck (ཀླུང་རྟ, klung rta) is black: blame comes. Its image is the luck caught in the demon's net.
reading.ThirtyCheck.GREAT_MEN_LUCK.4.BLACK.remedy=send the enemy thread-cross (མདོས, mdos), and lay down the rite against gossip (མི་ཁ, mi kha)
reading.ThirtyCheck.GREAT_MEN_LUCK.5.WHITE=The fifth check for great men's luck (ཀླུང་རྟ, klung rta) is white and good.
reading.ThirtyCheck.GREAT_MEN_LUCK.5.BLACK=The fifth check for great men's luck (ཀླུང་རྟ, klung rta) is black and bad: wealth has no fortune (གཡང, g.yang), and food no essence. Acts bear no fruit, and wealth does not stay.
reading.ThirtyCheck.GREAT_MEN_LUCK.5.BLACK.remedy=offer to the gods, summon the fortune (གཡང, g.yang), practise long life, bind the livestock's pledge, and the like
reading.ThirtyCheck.GREAT_MEN_LUCK.6.WHITE=The sixth check for great men's luck (ཀླུང་རྟ, klung rta) is white: spirits do not carry off the luck's food.
reading.ThirtyCheck.GREAT_MEN_LUCK.6.BLACK=The sixth check for great men's luck (ཀླུང་རྟ, klung rta) is black and bad: spirits carry off the food and wealth.
reading.ThirtyCheck.GREAT_MEN_LUCK.7.WHITE=The seventh check for great men's luck (ཀླུང་རྟ, klung rta) is white and good: the gods do not give the person away. Its image is the cord between gods and men not cut.
reading.ThirtyCheck.GREAT_MEN_LUCK.7.BLACK=The seventh check for great men's luck (ཀླུང་རྟ, klung rta) is black: the gods sell the person, and the protectors fall to the demons (བདུད, bdud). It is bad in the forefathers' place.
reading.ThirtyCheck.GREAT_MEN_LUCK.7.BLACK.remedy=offer to the gods and the protectors
reading.ThirtyCheck.GREAT_MEN_LUCK.8.WHITE=The eighth check for great men's luck (ཀླུང་རྟ, klung rta) is white: the banner of fame flies, and men and women are happy in old age.
reading.ThirtyCheck.GREAT_MEN_LUCK.8.BLACK=The eighth check for great men's luck (ཀླུང་རྟ, klung rta) is black: love comes from above and hate from below.
reading.ThirtyCheck.GREAT_MEN_LUCK.8.BLACK.remedy=make the ransom rite (གཏོ, gto) that raises the luck (ཀླུང་རྟ, klung rta)
reading.MomentPeriod={0} The time of day the asker comes, counted from dawn in the hare's hour, names the god who leads for them and what their house is like.
reading.MomentPeriod.DAWN=One who comes at dawn has the country god leading. Of two homes one stands empty, the household splits with gossip, little is given to guests, the women talk much and the men like to roam, and the cattle suffer losses.
reading.MomentPeriod.DAWN.spirits=the theurang (ཐེའུ་བྲང, the'u brang) and the earth lords (ས་བདག, sa bdag); oath-breaker spirits (མནའ་འདྲེ, mna' 'dre) on the paternal kin
reading.MomentPeriod.SUNRISE=One who comes at sunrise has the tsen (བཙན, btsan) leading. The line has sudden deaths, the lands are many but little is held, the household is quarrelsome, the women deft with gossip and the men ill-natured and petty; a line has ended, and the livestock suffer losses.
reading.MomentPeriod.SUNRISE.spirits=the eating demon of an empty house
reading.MomentPeriod.WARMTH=One who comes with the sun's warmth has the lords of wealth (ནོར་བདག, nor bdag) leading. The household holds two or three homes, old and young together, or has split; brothers, sisters and gatherings bring gossip, food is eaten in secret, and the livestock and harvest are middling.
reading.MomentPeriod.WARMTH.spirits=the gyalpo (རྒྱལ་པོ, rgyal po) on the line, the earth lords (ས་བདག, sa bdag) on the forefathers
reading.MomentPeriod.NOON=One who comes at noon has the nāgas (ཀླུ, klu) and the tsen (བཙན, btsan) leading. The house holds lands up and down the valley, many are ill and the paternal kin is pressed; outsiders are kind and their own hostile, fortune wanes, the women talk much, children are hard to raise, and deaths come near.
reading.MomentPeriod.NOON.spirits=leprosy spirits and the gongpo spirits (འགོང་པོ, 'gong po), and the earth lords (ས་བདག, sa bdag)
reading.MomentPeriod.PAST_NOON=One who comes past noon has the god-tsen (ལྷ་བཙན, lha btsan) leading. Risen high the house comes down low; the husband is old and the wife young, wealth grows early and drains later, much is spent on others, and in old age there is much business and no dharma.
reading.MomentPeriod.PAST_NOON.spirits=the gyalpo (རྒྱལ་པོ, rgyal po) and the gongpo spirits (འགོང་པོ, 'gong po) on the line, with deaths by water, blade and poison
reading.MomentPeriod.LATE=One who comes in the late afternoon has the nāgas (ཀླུ, klu) of the mountain spurs leading. The young die in their prime, the household's graves lie open, the children are dull, wealth is gathered like a crow's hoard, many eat and few work, and there is a thief within the fields and wealth.
reading.MomentPeriod.LATE.spirits=a monastery's hungry gyalpo (རྒྱལ་པོ, rgyal po); sorcery on the line's priests
reading.MomentPeriod.SUNSET=One who comes at sunset has the rock tsen (བཙན, btsan) leading. The paternal kin quarrels and its line breaks, a house was lost to fire, the family moves again and again and serves another lord, the children are many and the food little, and there are quarrels within and without.
reading.MomentPeriod.SUNSET.spirits=the drewo (གྲེ་བོ, gre bo), with deaths by the blade in the female line; the spirit of one who took their own life (ལྕེབ་འདྲེ, lceb 'dre) on the women
MomentPeriod.DAWN=dawn
MomentPeriod.SUNRISE=sunrise
MomentPeriod.WARMTH=the sun's warmth
MomentPeriod.NOON=noon
MomentPeriod.PAST_NOON=past noon
MomentPeriod.LATE=late afternoon
MomentPeriod.SUNSET=sunset
reading.MomentElement={0} The element of the hour's power, the son of the day's at dawn and each hour the son of the one before, tells the asker's line, house and wealth.
reading.MomentElement.WOOD=At an hour of wood the father and uncles are of a noble line, though some lines have ended; they are big-bodied, loud and long-haired; enemies fall and kin rise, the children are few and half of them die, and wealth comes and goes, at times three hundred horse-loads and at times a measure of buckwheat.
reading.MomentElement.WOOD.livestock=a pale yellow and blue speckled watchdog and riding horse
reading.MomentElement.WOOD.spirits=the gyalpo (རྒྱལ་པོ, rgyal po), the demons (བདུད, bdud) and the tsen (བཙན, btsan) on their path; an earth lord in the field
reading.MomentElement.FIRE=At an hour of fire the people are of a noble or potter's line, with a death by the blade in it; short-tempered and white-hearted, proud of speech, with great rises and falls and brothers in accord; the children are ruddy, three or so, deals succeed and quarrels are many.
reading.MomentElement.FIRE.livestock=a red-marked or white watchdog and riding horse
reading.MomentElement.FIRE.illness=sudden mishaps, a broken head or a burn
reading.MomentElement.FIRE.spirits=the nāgas (ཀླུ, klu) and the tsen (བཙན, btsan), the gyalpo (རྒྱལ་པོ, rgyal po)
reading.MomentElement.FIRE.remedy=send a thread-cross (མདོས, mdos) of a hundred meats and a hundred doughs to the gyalpo and the tsen
reading.MomentElement.EARTH=At an hour of earth the person is yellow of complexion, of a mantrin's or tsen line, holding land, with a birthmark as the forefathers had; the children are few and flawed of limb or sense, wealth is lost, the father and uncles are little kind, a fortune was lost to the east, and deals are middling with no enemies.
reading.MomentElement.EARTH.livestock=yellow and black dogs and horses; sheep and cows do well
reading.MomentElement.EARTH.spirits=the earth lords (ས་བདག, sa bdag) and the gyalpo (རྒྱལ་པོ, rgyal po), the nāgas (ཀླུ, klu) and the sen (བསེན, bsen)
reading.MomentElement.EARTH.remedy=repair the earth lords' offence, invoke the gods and make offerings to them
reading.MomentElement.IRON=At an hour of iron the person is fair of complexion, of a line under a stain, loud and given to talk; the sons are hard to raise and the daughters easy, fortune wanes towards the west, the kin offend the earth lords, a hunchback, cripple or wasting sufferer is in the house, deals succeed and quarrels come.
reading.MomentElement.IRON.livestock=a white or blue watchdog and riding horse, white-marked livestock; goats do well
reading.MomentElement.IRON.illness=lung illness, stabbing pains and sudden illness, fright at dusk
reading.MomentElement.IRON.spirits=the gyalpo (རྒྱལ་པོ, rgyal po), the nyen (གཉན, gnyan) and the earth lords (ས་བདག, sa bdag), a drewo (གྲེ་བོ, gre bo)
reading.MomentElement.IRON.remedy=white rites, a gyalpo thread-cross (རྒྱལ་མདོས, rgyal mdos) and the tsen's offering cake, turning back the crowd and ransoming the life
reading.MomentElement.WATER=At an hour of water the person is dark of complexion, of a Bonpo (བོན་པོ, bon po) line or a low one, roaming and changeable; the women are widowed or parted, distant kin are kinder than near, things go better abroad than at home, enemies and quarrels come, and food and wealth are enough.
reading.MomentElement.WATER.livestock=a black and red watchdog and riding horse; female yaks and yaks do well
reading.MomentElement.WATER.illness=cold in the belly, yellow fluid and swellings
reading.MomentElement.WATER.spirits=a female spirit of the dead who broke their pledges (དམ་སྲི, dam sri), the nāgas (ཀླུ, klu) and the earth lords (ས་བདག, sa bdag)
reading.MomentElement.WATER.remedy=the nine thread-crosses of the lake goddesses, repaying debts and kindness to the nāgas and their goddesses, and bringing the clans together
# The moment's mewa as a spirit claiming its share, and wealth, illness and demon by the moment's element (ROADMAP R2w; WB vol. 2, ch. 30, pp. 164–165, 168–170; D24).
reading.MomentSpirit={0} At the moment the mewa speaks as a spirit claiming its share, and unpaid it sends its harm.
reading.MomentSpirit.1=The moment's mewa is the one white: a spirit moving in sky, sea and space, dwelling on the snow peak, claims its share. Unpaid, it sends dizziness and stabbing pains above.
reading.MomentSpirit.2=The moment's mewa is the two black: a demon on a black horse, with a black dog and a black bird, claims its share. Unpaid, it sends obstacles and sudden misfortune.
reading.MomentSpirit.2.remedy=reverse the trap and turn its face away
reading.MomentSpirit.3=The moment's mewa is the three blue: the chief of the senmo (བསེན་མོ, bsen mo), the oath-breaking spirit of lonely places, claims its share. Unpaid, it sends lame hands and feet, sores and dysentery.
reading.MomentSpirit.3.remedy=send the senmo's (བསེན་མོ, bsen mo) nine thread-crosses (མདོས, mdos), and the black one's ransom
reading.MomentSpirit.4=The moment's mewa is the four green: the four great nāgas (ཀླུ, klu), chief of the eight, claim their share. Unpaid, they send the nāgas' illnesses: swellings, dropsy, mottled skin and sores.
reading.MomentSpirit.4.remedy=make offerings to the nāgas (ཀླུ, klu), and their cures
reading.MomentSpirit.5=The moment's mewa is the five yellow: the lord of the land, its channels, fields and house ground, claims its share. Unpaid, it sends frost, hail, famine, cattle plague and heavy illness.
reading.MomentSpirit.5.remedy=make offerings to the local god (ཡུལ་ལྷ, yul lha), and give the earth lords' (ས་བདག, sa bdag) treasure
reading.MomentSpirit.6=The moment's mewa is the six white: a men (སྨན, sman) of snow, slate, meadow and lake, riding a deer, claims her share. Unpaid, she sends illness on people and cattle.
reading.MomentSpirit.6.remedy=send the lake men's nine thread-crosses (མདོས, mdos)
reading.MomentSpirit.7=The moment's mewa is the seven red: the tsen (བཙན, btsan) of the red rock claims its share. Unpaid, it sends knife fights and stabbing pains.
reading.MomentSpirit.7.remedy=make the tsen's (བཙན, btsan) ransom and liberation
reading.MomentSpirit.8=The moment's mewa is the eight white: the lord of the Dharma's offerings claims his share. Unpaid, he sends madness, the gyalpo's (རྒྱལ་པོ, rgyal po) illness and the heart's wind.
reading.MomentSpirit.8.remedy=make the gyalpo's (རྒྱལ་པོ, rgyal po) rites and many ransoms
reading.MomentSpirit.9=The moment's mewa is the nine red: a woman on a black mule from the charnel grounds claims her share. Unpaid, she sends epidemic and quarrels among the father's brothers.
reading.MomentSpirit.9.remedy=make the black one's thousand ransoms
reading.MomentWealth={0} By the moment's element the asker's wealth, illness and harming spirit are read.
reading.MomentWealth.WOOD=The moment's element is wood: wealth lies in dry goods and wooden ware in the east of the store, and in donkeys, goats, sheep and a blue dog.
reading.MomentWealth.WOOD.spirits=the theurang (ཐེའུ་བྲང, the'u brang), oath-breaking harmful spirits of the dead (སྲི, sri) or the nāgas (ཀླུ, klu), following wooden ware
reading.MomentWealth.WOOD.illness=wind, the sinews, the stomach and liver, the eyes and the right ribs
reading.MomentWealth.WOOD.remedy=turn them back from the east
reading.MomentWealth.FIRE=The moment's element is fire: wealth lies in copper ware, red cloven-hoofed animals, a horse or a chestnut.
reading.MomentWealth.FIRE.spirits=the tsen (བཙན, btsan), the mu (དམུ, dmu) and the senmo (བསེན་མོ, bsen mo) of the rock, following copper, horses and red things
reading.MomentWealth.FIRE.illness=the heart, the intestines, the blood, the tongue, the chest and neck, and fevers
reading.MomentWealth.FIRE.remedy=send a tsen thread-cross (བཙན་མདོས, btsan mdos)
reading.MomentWealth.EARTH=The moment's element is earth: wealth lies in yellow dry goods, a good field, a yellow dog and greys.
reading.MomentWealth.EARTH.spirits=the earth lords (ས་བདག, sa bdag) and the oath-breaking gongpo spirits (འགོང་པོ, 'gong po) from the south-west and east, following yellow animals
reading.MomentWealth.EARTH.illness=the stomach and spleen, the flesh, sores and boils, a blocked nose, water illness, colds and the left hand
reading.MomentWealth.EARTH.remedy=cure the earth lords (ས་བདག, sa bdag)
reading.MomentWealth.IRON=The moment's element is iron: wealth lies in iron or silver ware, white goods, sheep, dogs and white cloth.
reading.MomentWealth.IRON.spirits=a demon or a gyalpo (རྒྱལ་པོ, rgyal po)
reading.MomentWealth.IRON.illness=the lungs, tumours, the bones, the ears and lung fever
reading.MomentWealth.IRON.remedy=send their thread-crosses (མདོས, mdos)
reading.MomentWealth.WATER=The moment's element is water: wealth lies in baskets and black things in the north of the store, and in mares, black horses, yaks, cattle and dogs.
reading.MomentWealth.WATER.spirits=a demon or oath-breaking harmful spirits of the dead (སྲི, sri) from the north, following a widow's goods
reading.MomentWealth.WATER.illness=water illness, the kidneys and waist, the knees and legs, the teeth and ears
reading.MomentWealth.WATER.remedy=send the lake men's (སྨན, sman) thread-cross (མདོས, mdos)
# The dead's later examinations (ROADMAP R2x; WB vol. 2, ch. 29, pp. 75–132; the notes, pp. 505–517; D18).
reading.DeadProvisions={0} The ninth examination lays the corpse's provisions (རོ་རྫོངས, ro rdzongs) by the trigram the dead had descended to. They are the dead's share of goods, matched to the grave's account.
reading.DeadProvisions.LI=Died on the fire trigram (ལི, li): the provisions' tree is the rose and their bird the magpie.
reading.DeadProvisions.LI.remedy=lay rice, turquoise, a hat, felt, and head meat with butter broth with the corpse
reading.DeadProvisions.KHON=Died on the earth trigram (ཁོན, khon): the provisions' tree is the willow.
reading.DeadProvisions.KHON.remedy=lay sesame and a warming medicine with the corpse
reading.DeadProvisions.DWA=Died on the lake trigram (དྭ, dwa): the provisions' bird is the jolmo (འཇོལ་མོ, 'jol mo).
reading.DeadProvisions.DWA.remedy=lay a feather of the jolmo (འཇོལ་མོ, 'jol mo), a donkey's cloth, blood and the left rib with the corpse
reading.DeadProvisions.KHEN=Died on the sky trigram (ཁེན, khen): the provisions' bird is the crane.
reading.DeadProvisions.KHEN.remedy=lay buckwheat, dog meat, marmot meat, the left leg's meat and cloth boots with the corpse
reading.DeadProvisions.KHAM=Died on the water trigram (ཁམ, kham): the provisions' bird is the crow.
reading.DeadProvisions.KHAM.remedy=lay peas, buckwheat, dried meat, goat-hair cloth, ox, pig and fish meat, entrails and a short coat with the corpse
reading.DeadProvisions.GIN=Died on the mountain trigram (གིན, gin): the provisions' tree is the juniper and their bird the owl.
reading.DeadProvisions.GIN.remedy=lay brocade, wheat and the right leg with the corpse
reading.DeadProvisions.ZIN=Died on the thunder trigram (ཟིན, zin): the provisions' bird is the parrot.
reading.DeadProvisions.ZIN.remedy=lay a belt with the corpse
reading.DeadProvisions.ZON=Died on the wind trigram (ཟོན, zon): the provisions' tree is the spruce and their bird the hoopoe.
reading.DeadProvisions.ZON.remedy=lay the meat of a dzo (མཛོ, mdzo) bull with the corpse
reading.DeadGraveProvisions={0} The fifteenth examination lays the grave provisions (དུར་རྫོངས, dur rdzongs) by the dead's trigram, as the dead's share, so that the living's share is not stolen.
reading.DeadGraveProvisions.LI=Died on the fire trigram (ལི, li): the grave's tree is the rose and its bird the magpie. The water trigram's (ཁམ, kham) seal presses down from above.
reading.DeadGraveProvisions.LI.remedy=lay head meat, butter, good grain and rice, a hat, a felt cloak and a horse hide, copper vessels, turquoise, the brother's and sister's wealth, an old horse and a reddish mare; break the grave's mouth with a horse and a dog; put the earth lords' (ས་བདག, sa bdag) wheel in a horse's skull under the stūpa's path to the south, and bind the threshold at the potter's
reading.DeadGraveProvisions.KHON=Died on the earth trigram (ཁོན, khon): the grave's tree is the willow.
reading.DeadGraveProvisions.KHON.remedy=lay a warming medicine, sesame and left foreleg meat, the old woman's left sleeve and her wealth, a cow and a sheep; break the grave's mouth with a sheep and a pig; put the earth lords' (ས་བདག, sa bdag) wheel in a sheep's skull under the stūpa's path to the south-west
reading.DeadGraveProvisions.DWA=Died on the lake trigram (དྭ, dwa): the grave's bird is the jolmo (འཇོལ་མོ, 'jol mo). The fire trigram's (ལི, li) seal presses down from above.
reading.DeadGraveProvisions.DWA.remedy=lay bird meat and left ribs, armour, a belt and a cloak, the smith's tools, a knife, a spear and an arrow, and an old bearded goat; break the grave's mouth with a goat and a donkey; put the earth lords' (ས་བདག, sa bdag) wheel in a goat's skull under the stūpa's path to the west
reading.DeadGraveProvisions.KHEN=Died on the sky trigram (ཁེན, khen): the grave's bird is the crane. The fire trigram's (ལི, li) seal presses down from above.
reading.DeadGraveProvisions.KHEN.remedy=lay marmot meat, buckwheat and the left hindleg, white cotton and the old man's left boot, the Bon (བོན, bon) priest's drum and cymbal, the old man's wealth, an old dog and a puppy; break the grave's mouth with a dog and a horse; put the earth lords' (ས་བདག, sa bdag) wheel in a dog's skull under the stūpa's path to the north-west, and bind the threshold at the old man's
reading.DeadGraveProvisions.KHAM=Died on the water trigram (ཁམ, kham): the earth trigram's (ཁོན, khon) seal presses down on the grave from above.
reading.DeadGraveProvisions.KHAM.remedy=lay fish, pork, goat meat and entrails, leggings and a yak-hair tent cloth, a bowl, a ladle and broken pots, a rat, an ox and a pig; break the grave's mouth with a pig and a sheep; put the earth lords' (ས་བདག, sa bdag) wheel in a pig's skull under the stūpa's path to the north, and bind the threshold at the ferryman's
reading.DeadGraveProvisions.GIN=Died on the mountain trigram (གིན, gin): the grave's tree is the juniper and its bird the owl. The wind trigram's (ཟོན, zon) seal presses down from above.
reading.DeadGraveProvisions.GIN.remedy=lay ox meat, the right hindleg, good grain and wheat, the monk's shawl and the great meditator's robes, a vajra and bell, offering substances and exchanged wealth, and a red ox with a white head; break the grave's mouth with an ox and a dzo (མཛོ, mdzo); put the earth lords' (ས་བདག, sa bdag) wheel in an ox's skull under the stūpa's path to the north-east, and bind the threshold at the fallen monk's
reading.DeadGraveProvisions.ZIN=Died on the thunder trigram (ཟིན, zin): the lake trigram's (དྭ, dwa) seal presses down on the grave from above.
reading.DeadGraveProvisions.ZIN.remedy=lay donkey meat and the right ribs, a belt and tiger, leopard and donkey hides, the tiger-skin quiver and the carpenter's tools, and a speckled donkey with tiger stripes; break the grave's mouth with a donkey and a goat; put the earth lords' (ས་བདག, sa bdag) wheel in a donkey's skull under the stūpa's path to the east, and bind the threshold at the carpenter's
reading.DeadGraveProvisions.ZON=Died on the wind trigram (ཟོན, zon): the grave's tree is the spruce and its bird the hoopoe. The mountain trigram's (གིན, gin) seal presses down from above.
reading.DeadGraveProvisions.ZON.remedy=lay sesame, dzo (མཛོ, mdzo) meat and the right foreleg, five-coloured silk and brocade, a drum and self-woven cloth, and a dzo bull and calf; break the grave's mouth with a dzo and an ox; put the earth lords' (ས་བདག, sa bdag) wheel in a dzo's skull under the stūpa's path to the south-east, and bind the threshold at the madwoman's
reading.DeadRitesTrigram={0} The thirteenth examination cuts off the run of deaths by the trigram the dead had descended to, with a white rite and a black rite.
reading.DeadRitesTrigram.LI=Died on the fire trigram (ལི, li): the death is called the blind (མིག་ལོང, mig long). Its rites cut the run of deaths for nine years.
reading.DeadRitesTrigram.LI.remedy=let a blind or squint-eyed priest recite the Uṣṇīṣa goddess (གཙུག་ཏོར་ལྷ་མོ, gtsug tor lha mo) in the south; put the earth lords' (ས་བདག, sa bdag) wheel in a horse's or a snake's skull, press it on a three-cornered road to the south, build a red stūpa of four steps on it, and recite the Eight Thousand (བརྒྱད་སྟོང་པ, brgyad stong pa)
reading.DeadRitesTrigram.KHON=Died on the earth trigram (ཁོན, khon): the death is called the mountain behind collapses (རྒྱབ་རི་ཉིལ, rgyab ri nyil). Its rites cut the run of deaths for ten years.
reading.DeadRitesTrigram.KHON.remedy=let a hunchbacked priest recite the Questions of the Old Woman (བགྲེས་མོས་ཞུས, bgres mos zhus), the Avataṃsaka (ཕལ་པོ་ཆེ, phal po che) and the Laṅkāvatāra (ལང་དཀར་གཤེགས་པ, lang dkar gshegs pa) in the south-west; put the earth lords' (ས་བདག, sa bdag) wheel in an old woman's skull, press it at a road's mouth in the south-west, and build a yellow stūpa of two steps on it
reading.DeadRitesTrigram.DWA=Died on the lake trigram (དྭ, dwa): the death is called the heart's strike (སྙིང་འགྲམས, snying 'grams). Its rites cut the run of deaths for eleven years.
reading.DeadRitesTrigram.DWA.remedy=let a left-handed priest, or one with a mole on the face, say the names and read the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs) in the west; put the earth lords' (ས་བདག, sa bdag) wheel in an unclean smith's skull, press it on a road to the west, and build a white stūpa of five steps on it
reading.DeadRitesTrigram.KHEN=Died on the sky trigram (ཁེན, khen): the death is called the falling of the sky's plague (དལ་ཡམས, dal yams). Its rites cut the run of deaths for twelve years.
reading.DeadRitesTrigram.KHEN.remedy=let a lame priest proclaim the Sky-Iron Beak (གནམ་ལྕགས་མཆུ, gnam lcags mchu), the Golden Light and the Avataṃsaka (ཕལ་པོ་ཆེ, phal po che) in the north-west; put the earth lords' (ས་བདག, sa bdag) wheel in a blind or lame dog's skull, press it at a road's mouth in the north-west, and build a yellow stūpa of two steps on it
reading.DeadRitesTrigram.KHAM=Died on the water trigram (ཁམ, kham): the death is called the demon's belly undone. Its rites keep the grave's mouth closed for thirteen years.
reading.DeadRitesTrigram.KHAM.remedy=let a hunchbacked or crawling priest proclaim the Vijaya (རྣམ་འཇོམས, rnam 'joms), the Great Cloud Sūtra and the Mahābala (སྟོབས་ཆེན, stobs chen) to the north; put the earth lords' (ས་བདག, sa bdag) wheel in a night-born's, a rat's or a pig's skull, press it on a road to the north, and build a black stūpa of three steps on it
reading.DeadRitesTrigram.GIN=Died on the mountain trigram (གིན, gin): the death's rites give ease from the run of deaths for fourteen years.
reading.DeadRitesTrigram.GIN.remedy=let a mute priest proclaim the Good Conduct (བཟང་སྤྱོད, bzang spyod) and the Prophecy of Ox Horn (གླང་རུ་ལུང་བསྟན, glang ru lung bstan) to the north-east; put the earth lords' (ས་བདག, sa bdag) wheel in an exchanged ox's skull, press it on a road to the north-east, and build a yellow stūpa of two steps on it
reading.DeadRitesTrigram.ZIN=Died on the thunder trigram (ཟིན, zin): the death is called the corpse of the heart's strike. Its rites cut the run of deaths for fifteen years.
reading.DeadRitesTrigram.ZIN.remedy=let a twin as priest proclaim the Twenty Thousand (ཉི་ཁྲི, nyi khri) and the Questions of the Tigress (སྟག་མོས་ཞུས, stag mos zhus) to the east; put the earth lords' (ས་བདག, sa bdag) wheel in a twin's, a donkey's, a tiger's or a hare's skull, press it on a road to the east, and let four carpenters build a green stūpa with five irons on it
reading.DeadRitesTrigram.ZON=Died on the wind trigram (ཟོན, zon): the death is called the robe's hem torn (ཟོ་བ་ཞབས་རྡོལ, zo ba zhabs rdol). Its rites cut the run of deaths for sixteen years.
reading.DeadRitesTrigram.ZON.remedy=let a mad priest proclaim the Benefits of a Stūpa (མཆོད་རྟེན་ཕན་ཡོན, mchod rten phan yon) to the south-east; put the earth lords' (ས་བདག, sa bdag) wheel in a madwoman's or a hybrid's skull, press it on a road to the south-east, and build a yellow stūpa of two steps on it
reading.DeadRitesMewa={0} For a death on a bad mewa (སྨེ་བ, sme ba), the thirteenth examination draws a wheel round the dead's own square. The mewa's own thread-cross (མདོས, mdos) then reverses it.
reading.DeadRitesMewa.1=Died on the one white: the wheel goes into a yak's skull with horse blood, and is hidden at a crossroads in the north.
reading.DeadRitesMewa.2=Died on the two black: the wheel goes into a sheep's skull, and is hidden inside a mountain in the south-west.
reading.DeadRitesMewa.3=Died on the three blue: the wheel goes into an ox's skull, and is hidden at a rock in the east.
reading.DeadRitesMewa.4=Died on the four green: the wheel goes into a bird's skull, and is hidden at a mountain in the south-east.
reading.DeadRitesMewa.5=Died on the five yellow: the wheel goes into an ox's skull, and is hidden in the north-east corner.
reading.DeadRitesMewa.6=Died on the six white: the wheel goes into a dog's skull, and is hidden in the north-west.
reading.DeadRitesMewa.7=Died on the seven red: the wheel goes into a man's skull, and is hidden in the west.
reading.DeadRitesMewa.8=Died on the eight white: the wheel goes into a horse's skull, and is hidden in the north-east corner.
reading.DeadRitesMewa.9=Died on the nine red: the wheel goes into a man's skull, and is hidden at a mountain in the south.
reading.DeadRitesPlanet={0} The thirteenth examination presses down a death on a planet's (གཟའ, gza') day with a wheel put into a skull.
reading.DeadRitesPlanet.SUNDAY=Died on a Sunday, the Sun's day: after it nine repeat and nine are led. The wheel goes into a horse's skull wrapped in horse hair, pressed at a river bank in the north.
reading.DeadRitesPlanet.SUNDAY.remedy=draw a water wheel above and the Moon's heart-syllable below; turn the corpse head to foot and hide it; put nine fires and nine ladles of water into nine holes, and lay nine black clay votive images (ཚ་ཚ, tsha tsha) on top
reading.DeadRitesPlanet.MONDAY=Died on a Monday, the Moon's day: the wheel goes into a sheep's skull in rat hair, pressed in a mountain hollow in the south-west.
reading.DeadRitesPlanet.MONDAY.remedy=draw Saturn's figure above and the earth's heart-syllable below; press five men of pea and clay, an owl's feather in each head, with yellow clay votive images (ཚ་ཚ, tsha tsha)
reading.DeadRitesPlanet.TUESDAY=Died on a Tuesday, Mars's day: the wheel goes into a horse's skull, pressed at a river bank in the north.
reading.DeadRitesPlanet.TUESDAY.remedy=draw the Moon's figure and heart-syllable and a water wheel on the head; fill a dog's skull with blood for the corpse-bearer, hide a tamarisk beam in the armpit, and light nine fires and put them out at once
reading.DeadRitesPlanet.WEDNESDAY=Died on a Wednesday, Mercury's day: the wheel goes into a pig's skull, pressed in a mountain in the south-west.
reading.DeadRitesPlanet.WEDNESDAY.remedy=pour earths of five colours above, and beneath do Saturn's work; press it with three yellow clay votive images (ཚ་ཚ, tsha tsha)
reading.DeadRitesPlanet.THURSDAY=Died on a Thursday, Jupiter's day: the wheel goes into a bird's skull, pressed at a white rock mountain in the west. Iron powder is strewn on it.
reading.DeadRitesPlanet.THURSDAY.remedy=draw Venus's figure above; tie the dead's name to the fingers of the four limbs; bind an iron man's figure with a name-card and cut it with axe and saw; recite the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor) many times
reading.DeadRitesPlanet.FRIDAY=Died on a Friday, Venus's day: the wheel goes into a snake's skull, pressed at the foot of a red rock in the south.
reading.DeadRitesPlanet.FRIDAY.remedy=draw Mars's figure above, and burn a fire of thorns below with an iron beam in its middle
reading.DeadRitesPlanet.SATURDAY=Died on a Saturday, Saturn's day: the wheel goes into a hare's skull, pressed at the foot of a tree in the east.
reading.DeadRitesPlanet.SATURDAY.remedy=put five men of black grain and clay into five holes, draw Jupiter's figure above, and drive a barberry peg into the heart
reading.DeadRitesDate={0} The thirteenth examination reads the lunar date of death: on whom the death falls next, and what is done on the corpse.
reading.DeadRitesDate.1=Died on the 1st: it is bad for small children.
reading.DeadRitesDate.1.remedy=set the pressing wheel in the market
reading.DeadRitesDate.2=Died on the 2nd: it is bad for young wives.
reading.DeadRitesDate.2.remedy=plant a wooden sword towards the enemy, and lay a black ransom (གླུད, glud) beside the corpse
reading.DeadRitesDate.3=Died on the 3rd: it is bad for women in their prime.
reading.DeadRitesDate.3.remedy=drive an acacia peg into the ransom (གླུད, glud), and an iron peg into the eyes
reading.DeadRitesDate.4=Died on the 4th: it is bad for young men.
reading.DeadRitesDate.4.remedy=press an iron man and horse beneath, and burn a name-card on the dead's head
reading.DeadRitesDate.5=Died on the 5th: it is bad for a monk.
reading.DeadRitesDate.5.remedy=set a saw at the neck
reading.DeadRitesDate.6=Died on the 6th: it is bad for a man in his prime.
reading.DeadRitesDate.6.remedy=press an effigy of the gongpo spirits (འགོང་པོ, 'gong po) under the corpse
reading.DeadRitesDate.7=Died on the 7th: it is bad for a monk.
reading.DeadRitesDate.7.remedy=turn the corpse's head downward
reading.DeadRitesDate.8=Died on the 8th: the war god (དགྲ་ལྷ, dgra lha) was angered, and it is bad for a wise man.
reading.DeadRitesDate.8.remedy=put a juniper beam in the right armpit
reading.DeadRitesDate.9=Died on the 9th: it is bad for a nun.
reading.DeadRitesDate.10=Died on the 10th: it is bad for a small child.
reading.DeadRitesDate.10.remedy=draw one wrathful eye on the chest
reading.DeadRitesDate.11=Died on the 11th: it is bad for a sinful man.
reading.DeadRitesDate.11.remedy=hang a vajra and bell at the neck
reading.DeadRitesDate.12=Died on the 12th: it is bad for a man in his prime.
reading.DeadRitesDate.12.remedy=put a dough corpse in the armpit
reading.DeadRitesDate.13=Died on the 13th: it is bad for an old woman.
reading.DeadRitesDate.13.remedy=burn incense in the armpit
reading.DeadRitesDate.14=Died on the 14th: it is bad for an old working woman.
reading.DeadRitesDate.14.remedy=draw a swastika on the corpse
reading.DeadRitesDate.15=Died on the 15th, the full moon: it is bad for men and women in turn.
reading.DeadRitesDate.15.remedy=tie a ring and a beam at the armpit
reading.DeadRitesDate.16=Died on the 16th: it is bad for a woman.
reading.DeadRitesDate.16.remedy=tie a broom to the corpse
reading.DeadRitesDate.17=Died on the 17th: it is bad for a well-dressed bride.
reading.DeadRitesDate.17.remedy=draw the sun and moon on the corpse in butter
reading.DeadRitesDate.18=Died on the 18th: it is bad for a lama (བླ་མ, bla ma) or a geshe (དགེ་བཤེས, dge bshes).
reading.DeadRitesDate.18.remedy=tie a golden ornament to the corpse
reading.DeadRitesDate.19=Died on the 19th: it is bad for a young man.
reading.DeadRitesDate.19.remedy=strike clay votive images (ཚ་ཚ, tsha tsha) on the corpse
reading.DeadRitesDate.20=Died on the 20th: it is bad for a woman.
reading.DeadRitesDate.20.remedy=fumigate the corpse with all fragrances
reading.DeadRitesDate.21=Died on the 21st: it is bad for a young son.
reading.DeadRitesDate.21.remedy=offer fine flowers to the corpse
reading.DeadRitesDate.22=Died on the 22nd: it is bad for a mother or an old woman.
reading.DeadRitesDate.23=Died on the 23rd: it is bad for a mother or a man in his prime.
reading.DeadRitesDate.23.remedy=make the general circuit of the four continents for the corpse
reading.DeadRitesDate.24=Died on the 24th: it is bad for a corpse-companion of the paternal kin.
reading.DeadRitesDate.24.remedy=tie thirteen things of the harmful spirits of the dead (སྲི, sri) to the corpse
reading.DeadRitesDate.25=Died on the 25th: it is bad for a geshe (དགེ་བཤེས, dge bshes) or a monk.
reading.DeadRitesDate.25.remedy=cover the corpse with the five families' images
reading.DeadRitesDate.26=Died on the 26th: it is bad for a well-dressed man.
reading.DeadRitesDate.26.remedy=draw dice-eyes on the corpse's body
reading.DeadRitesDate.27=Died on the 27th: it is bad for a small boy of the paternal kin.
reading.DeadRitesDate.27.remedy=cover the corpse with white silk lined in vermilion
reading.DeadRitesDate.28=Died on the 28th: it is bad for one born in the dead's own year.
reading.DeadRitesDate.29=Died on the 29th: it is bad for the men and women of the household.
reading.DeadRitesDate.29.remedy=hang the wheel of the eight classes (སྡེ་བརྒྱད, sde brgyad) above the corpse, and roll three black substances
reading.DeadRitesDate.30=Died on the 30th: it is bad for all eight kinds of paternal kin.
reading.DeadNineEye={0} The tenth examination's count strike falls on every ninth year of age. A man's death then repeats six times, a woman's three or five.
reading.DeadNineEye.9=Died in the 9th year of age, a nine-multiple (དགུ་མིག, dgu mig), on the fire trigram (ལི, li) or the water trigram (ཁམ, kham): four corpses follow, and beyond them eight die.
reading.DeadNineEye.9.remedy=burn the corpse and cast the eight fires of the burning to the south; cast away the hat and felt of one's own loom, and give an old horse and an ox as the fee
reading.DeadNineEye.18=Died in the 18th year of age, a nine-multiple (དགུ་མིག, dgu mig), on the sky trigram (ཁེན, khen) or the earth trigram (ཁོན, khon): it is rough for seven.
reading.DeadNineEye.18.remedy=hold no funeral feast for three years, and let the younger of an old one and a girl lead the dead
reading.DeadNineEye.27=Died in the 27th year of age, a nine-multiple (དགུ་མིག, dgu mig), on the lake trigram (དྭ, dwa): the strike calls for nine black rites.
reading.DeadNineEye.27.remedy=make nine black rites: let a Bon (བོན, bon) priest with bell and cymbal subdue it, and a monk with a bell wash it
reading.DeadNineEye.36=Died in the 36th year of age, a nine-multiple (དགུ་མིག, dgu mig), on the sky trigram (ཁེན, khen) or the earth trigram (ཁོན, khon): the death repeats four or eight times.
reading.DeadNineEye.36.remedy=let an old woman lead the dead; cover the corpse from the sky, and bury it upright or burn it facing east, a crossed vajra on its soles; let no monks perform the rites
reading.DeadNineEye.45=Died in the 45th year of age, a nine-multiple (དགུ་མིག, dgu mig), on the water trigram (ཁམ, kham) or the fire trigram (ལི, li): it is bad for three, five or eleven.
reading.DeadNineEye.45.remedy=let a small boy or an old one lead the dead; hold no feast for three years; wrap the corpse in coarse cloth, tie it to wood and cast it into the river
reading.DeadNineEye.54=Died in the 54th year of age, a nine-multiple (དགུ་མིག, dgu mig), on the mountain trigram (གིན, gin) or the wind trigram (ཟོན, zon): twelve die.
reading.DeadNineEye.54.remedy=let the elder son or daughter lead the dead; scatter earth or stones, or change the road; at the funeral let monks make the feast, and avoid Bon (བོན, bon) priests
reading.DeadNineEye.63=Died in the 63rd year of age, a nine-multiple (དགུ་མིག, dgu mig), on the lake trigram (དྭ, dwa) or the thunder trigram (ཟིན, zin): three or seven die rough deaths.
reading.DeadNineEye.63.remedy=let a grown man lead the dead; put the corpse in a box, and let a mantra-holder make the feast
reading.DeadNineEye.72=Died in the 72nd year of age, a nine-multiple (དགུ་མིག, dgu mig), on the mountain trigram (གིན, gin) or the wind trigram (ཟོན, zon): it is rough for four, eight or twelve.
reading.DeadNineEye.72.remedy=let a twin (མཚེ་མ, mtshe ma) lead the dead; bind the corpse to wood in a box, and make a mantra feast
reading.DeadNineEye.81=Died in the 81st year of age, a nine-multiple (དགུ་མིག, dgu mig), on the fire trigram (ལི, li) or the water trigram (ཁམ, kham): nine die.
reading.DeadNineEye.81.remedy=wrap a horse's harness in brocade with turquoise on its forehead, load one felt and give it as the fee; slaughter four sheep and send their lungs to the four directions
reading.DeadGraveDay={0} The tenth examination counts it the strike of illness, death and grave, one of the eight great strikes by which a death repeats.
reading.DeadGraveDay.STRIKE=Died on a grave day, the 6th of a season's first month, the 16th of its middle month or the 26th of its last.
