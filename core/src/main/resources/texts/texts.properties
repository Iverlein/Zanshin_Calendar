# A person's own days by the birth date (WB vol. 2, pp. 330, 337–338, 346)
OwnDay.BIRTH_WEEKDAY=Birth weekday
OwnDay.OWN_WEEKDAY=Own weekday
OwnDay.MOTHER_WEEKDAY=Mother weekday
OwnDay.FRIEND_WEEKDAY=Friend weekday
OwnDay.CHILD_WEEKDAY=Child weekday
OwnDay.ENEMY_WEEKDAY=Enemy weekday
OwnDay.BIRTH_MANSION=Birth mansion
reading.OwnDay.BIRTH_WEEKDAY=The weekday you were born on. The White Beryl counts a person's own weekdays and mansions as of particular importance: on the birth weekday, as on one's own weekday, peaceful and fierce works in general go well, and above all those listed here.
reading.OwnDay.OWN_WEEKDAY=The weekday of your own element, counted from the life force (srog) of your birth year; the White Beryl also calls it the la weekday and the power weekday. It is not always the luck day of your birth animal, which the same chapter also calls the la weekday. On it, as on the birth weekday, peaceful and fierce works in general go well, and above all those listed here.
reading.OwnDay.MOTHER_WEEKDAY=A weekday of the element that gives birth to your own, counted from the life force (srog) of your birth year. The White Beryl calls anything good on the weekdays of the mother and the friend.
reading.OwnDay.FRIEND_WEEKDAY=A weekday of the element your own overcomes, counted from the life force (srog) of your birth year. The White Beryl calls anything good on the weekdays of the mother and the friend.
reading.OwnDay.CHILD_WEEKDAY=A weekday of the element your own gives birth to, counted from the life force (srog) of your birth year. The White Beryl calls the child's weekday middling.
reading.OwnDay.ENEMY_WEEKDAY=A weekday of the element that overcomes your own, counted from the life force (srog) of your birth year. The White Beryl says that every work is to be avoided on it.
reading.OwnDay.BIRTH_MANSION=The mansion the moon was passing through on your birth date, as the almanac gives it for that day; the hour of birth would allow a finer reckoning, which the app does not make. When the moon is in it again, peaceful and fierce works in general go well, and above all those listed here.
