reading.YearPebble={0} The White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) lays twenty-four pebbles for a year: each of the four aspects of your birth year set against the present year, your progressed sign (ལོག་མེན, log men), your trigram (སྤར་ཁ, spar kha) and your mewa (སྨེ་བ, sme ba) for the year, your sector of growth and decline, and the hour you reckon in. Mother three white, friend two white, son one white and one black, enemy two black; the same element one white for earth and water, one black for wood, fire and iron; the sectors by their rank. The prediction quoted is the one it gives for such pebbles of this aspect.
reading.YearPebble.VITALITY.W3=Three white on the vitality: the tree of life grows and a golden bridge of jewels is raised; good kin of the father's side warm your back, lesser demons (བདུད, bdud) are pressed down, the sun of glory rises before you and the protecting gods hover above like birds. No worry of death or loss: the vitality flourishes like a bound iron trunk that no spirit can shake.
reading.YearPebble.VITALITY.W2=Two white on the vitality: it meets a friend. Food to fill the mouth and sights to fill the eyes, every wish fulfilled, merit for all needs grows; good protecting gods come to meet you. The wheel of life holds, and no obstacle to life can come.
reading.YearPebble.VITALITY.W1=One white on the vitality: nothing stands in the way of the life it holds.
reading.YearPebble.VITALITY.B2=Two black on the vitality: in the year the king's punishment, in the month a minister's troops; the element meets the end of its time, the tree of life breaks and the golden bridge falls from its foundation. A black bird of the demons (བདུད, bdud) hovers above and the black dog of the harmful spirits of the dead who broke their pledges (དམ་སྲི, dam sri) bites below; you dream of sleeping in strange lands; there is a face of the knife and of prison, and no joy at heart though you did no wrong. Remedies: save lives that were to be taken, honour the tombs and press down their spirits, long-life rites and the ransoming of the la, the life-spirit (བླ, bla), long-life dhāraṇīs, and no killing.
reading.YearPebble.VITALITY.B1=One black on the vitality: the root of the tree of life dries; a spirit of ruin rises from the snow peaks that divination does not see and reckoning does not find, and rites do not take hold. Remedies: ransom the la, the life-spirit (བླ, bla) a hundredfold with long-life rites, press down the spirit of ruin and move your bed.
reading.YearPebble.VITALITY.WB=One white and one black on the vitality: the good goddesses and the black birds of the demons (བདུད, bdud) both play dice for the precious life; white and black are not yet told apart, and mouths wrangle. Make rites for your person quickly and turn aside misfortune and losses.
reading.YearPebble.BODY.W3=Three white on the body: strength and vigour grow, helping gods go before you; no illness of body, no sorrow of mind. Though fevers blaze like fire you do not take to the sickbed, though weapons rain your blood is not shed; though the land suffers you are at ease and free of disputes; a child is born a boy.
reading.YearPebble.BODY.W2=Two white on the body: illness clears and the mind is free of sorrow; grief passes and quarrels calm. The body's support is good: no sickness.
reading.YearPebble.BODY.W1=One white on the body: no god guards it, but no harmful spirit either; it stands like a spreading tree.
reading.YearPebble.BODY.B2=Two black on the body: illness circles it and the mind suffers much; the sickbed wears out, doctors are constant guests and spirits are worshipped as gods; illness lasts long. Remedies: take vows or change your outward form, keep the vows and wear protection, mend paths, make clay votive images (ཚ་ཚ, tsha tsha), restore the clothing of stūpas and offer lamps.
reading.YearPebble.BODY.B1=One black on the body: its element declines; illness and sharp suffering come; half your store goes to the spirits, half your food to medicine; flesh, bone and skin are uneasy and the mind restless. Remedies: change your form and name, give and offer, keep vows, and strong rites to strengthen the body.
reading.YearPebble.BODY.WB=One white and one black on the body: gods and other spirits contend over it as at dice; fear and fright may come, and good and bad are not yet told apart. Change your outward form and wear protection; for a woman it is a sign of childbirth, which she will come through.
reading.YearPebble.DESTINY.W3=Three white on the destiny: nectar falls into its enclosure; the fruits of desire ripen, harvest and herds are good, income is great and trade brings great profit; turquoise shoots bear fruit on golden ground, the prosperity of gods and spirits descends and you gain field, house and land. Wealth swells like milk overflowing a white copper bowl.
reading.YearPebble.DESTINY.W2=Two white on the destiny: it meets a friend. Harvest and herds are good and what you intend is achieved; people, wealth, herds and children increase; you find all you need, and wishes are fulfilled.
reading.YearPebble.DESTINY.W1=One white on the destiny: what you seek outside is not found, but what is within is not lost; a rich man's storehouse is not emptied; income is middling.
reading.YearPebble.DESTINY.B2=Two black on the destiny: its enclosure breaks at the edge, wealth leaks out and the store of food is emptied; a spirit of ruin that robs wealth rises and goods are lost; food falls from the plate and the child from the lap, the horse you ride dies and so does the dog at the door; harvests fail and trade brings little. Remedies: honour monks of pure discipline, offer lamps in temples, give a feast for children, release animals, mend paths, make many clay votive images (ཚ་ཚ, tsha tsha) and give water offerings and alms.
reading.YearPebble.DESTINY.B1=One black on the destiny: its food and wealth are turned upside down; spirits of hunger and of loss rise; the herds give no milk and goblins steal from the stores; food and wealth are not found and merit shrinks. Rites to raise the destiny, honour ordained monks and give a large feast to those who cannot repay it.
reading.YearPebble.DESTINY.WB=One white and one black on the destiny: food and wealth overflow and spill away, and losses come; wealth is unsteady like a mirage in the heat, here one day and gone the next, like riches in a dream; it cannot be trusted.
reading.YearPebble.LUCK.W3=Three white on the luck: it is full and merit grows; a leader holds his seat, a priest takes his place among the gods, a mantra-holder's power shows and anyone takes a place among people; your standing is higher than the sky and your rule longer than a river; journeys go well and your words carry; whatever you have in mind is achieved, and nothing hinders your work.
reading.YearPebble.LUCK.W2=Two white on the luck: others do not slight you and in your prime your standing is higher than the sky; this year a man wins in the assembly and a woman earns a good name; you find the wealth you seek and escape your enemies, and you have no rival. Pray, and the gods help; practise against enemies, and they fall.
reading.YearPebble.LUCK.W1=One white on the luck: it is like gold and turquoise strung together; no enemies, robbers or sudden misfortune, and no gossip or quarrels.
reading.YearPebble.LUCK.B2=Two black on the luck: the merit of luck breaks and the sun of destiny sets at the door; a bone turns up in the butter, the king of teeth breaks his tusk and a thief rises from the treasury, so locking the outer door helps little; those you thought kin turn enemies, those you thought friends work against you, and enemies come from among those close, to your shame. Remedies: press down the spirits of enmity and turn enemies back, build bridges and mend paths, honour monks, and raise the luck.
reading.YearPebble.LUCK.B1=One black on the luck: clothes are worn but fortune is empty, half the food spoils; kin you cared for turn enemies, your service displeases your lord and the lama's rebuke shrinks your merit; a hundred men and a hundred women gossip about you. Remedies: mend paths and bridges, turn away gossip, press down the spirits of enmity and raise the luck.
reading.YearPebble.LUCK.WB=One white and one black on the luck: white and black play dice on the banner of its merit; great men are kind yet the bad rise against you; a hundred men talk, but to one end; you are not heard and not given a high place, and a blow may come from your own relatives. Keep away from enemies and recite the protective dhāraṇīs.
reading.YearPredictive={0} For each aspect the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) counts the white and the black of its six pebbles, "not the threes and twos but those that are there", and lays its predictive pebble on whichever are more; when they are even, none is laid.
reading.YearPredictive.VITALITY.WHITE=The predictive pebble of the vitality is white: the tree of life does not break; no black bird above and no black dog below; no obstacle to life, no spirit takes hold, and there is no face of death or loss.
reading.YearPredictive.BODY.WHITE=The predictive pebble of the body is white: the tree of the body does not fall; no face of illness or fever; journeys go well, things are achieved as soon as thought of, and no sudden illness comes.
reading.YearPredictive.DESTINY.WHITE=The predictive pebble of the destiny is white: food to fill the mouth, wealth to fill the hand, clothes to cover the back; good harvests and herds, food and wealth increase; even in an empty valley you find your share of food.
reading.YearPredictive.LUCK.WHITE=The predictive pebble of the luck is white: the net of luck does not fall and merit can be raised; no enemies and no gossip; no misfortune falls on you, glory stays, and whatever you do succeeds.
reading.YearPredictive.VITALITY.BLACK=The predictive pebble of the vitality is black: the tree of life breaks and the wheel of life falls apart; a bird hovers above and a black dog bites below; bad divinations and dreams, harshness to life and the face of a knife. Remedies: save animals that were to die, ransom prisoners and build bridges; ransom the la, the life-spirit (བླ, bla) and summon life; clothe stūpas, mend paths and make rites to restore a declining vitality.
reading.YearPredictive.BODY.BLACK=The predictive pebble of the body is black: the tree of the body falls; illness comes and evenings and mornings are joyless; one foot on dry ground and one in the wet; when you would stay you want to go, and illness lingers. Remedies: invite the Saṅgha to teach, wear your mother's clothes, change your name, keep the fasting vow and make rites for a declining body.
reading.YearPredictive.DESTINY.BLACK=The predictive pebble of the destiny is black: the enclosure of its happiness breaks; it goes badly for a man's horses and oxen, a woman's cows and yaks, a child's goats and sheep; bad harvests, bad trade, losses and thieves, and enemies rise unexpectedly. Remedies: press down the spirits of enmity and beware of quarrels; summon life and prosperity, and make rites to restore the destiny.
reading.YearPredictive.LUCK.BLACK=The predictive pebble of the luck is black: the net of its protection falls and misfortune comes on you; those close turn enemies and neighbours thieves; gossip and blame without fault; a load you cannot carry or a debt you did not make falls on you; your head and upper body are uneasy. Remedies: clay votive images (ཚ་ཚ, tsha tsha) and water offerings, one for each year of your age, effigies of people and beasts sent towards the enemy, care in speech and conduct, especially away from home, and rites to restore the luck.
reading.YearPredictive.ALL_WHITE=All four predictive pebbles are white: "crossing the pass of happiness". It is very bad if it comes to the old; for the young it brings losses and grief close by.
reading.YearPredictive.ALL_BLACK=All four predictive pebbles are black: very bad. Change your name, practise for long life and receive a long-life empowerment, and give purely, without holding to giver, gift or receiver.
reading.YearSector={0} Each element has twelve sectors of growth and decline, round the twelve animals: earth and water take breath at the snake, fire at the pig, iron at the tiger, wood at the monkey, and the rest follow in order. Each of the four aspects of your birth year falls in the sector of the present year's animal. The White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) calls six good and six bad; the Moonbeams (འབྱུང་རྩིས་མན་ངག་ཟླ་བའི་འོད་ཟེར, 'Byung rtsis man ngag zla ba'i 'od zer) of Lochen Dharmaśrī (ལོ་ཆེན་དྷརྨ་ཤྲཱི, lo chen d+har+ma shrI) ranks them for the pebbles.
reading.YearSector.FLOURISHING=Flourishing: finding a great treasure. The best of the good: three white pebbles.
reading.YearSector.WORKING=Working: long-lasting. The best of the good: three white pebbles.
reading.YearSector.DRESSING=Dressing: able to sustain. The middle of the good: two white pebbles.
reading.YearSector.BATHING=Bathing: wishes fulfilled. The middle of the good: two white pebbles.
reading.YearSector.BODY_COMPLETE=Body complete: endowed with happiness. The least of the good: one white pebble.
reading.YearSector.BIRTH=Birth: great wealth. The least of the good: one white pebble.
reading.YearSector.TAKING_BREATH=Taking breath: fortune exhausted. The best of the bad: one white and one black pebble.
reading.YearSector.IN_THE_WOMB=In the womb: falling into misfortune. The best of the bad: one white and one black pebble.
reading.YearSector.DECLINE=Decline: separation. The middle of the bad: one black pebble.
reading.YearSector.ILLNESS=Illness: ruin and disputes. The middle of the bad: one black pebble.
reading.YearSector.DEATH=Death: prosperity lost. The worst: two black pebbles.
reading.YearSector.ENTERING_THE_TOMB=Entering the tomb: the line is cut off; it is the great penalty, the seventh from one's own the lesser. The worst: two black pebbles.
reading.LogMen={0} The progressed sign (ལོག་མེན, log men) moves one sign a year through the sixty: for a man from the tiger whose element your birth year's element feeds, counting forward; for a woman from the monkey whose element feeds your birth year's, counting back. Its element shows whose matters it touches: wood the father, his brothers and the grandfather; fire children, grandchildren and the women's line; earth the grandmother, the home and the house; iron wealth, friends and the protecting gods; water the nyen (གཉན, gnyan), the roads and the four borders.
reading.LogMen.SKY_DOOR=On the sky door (a man's dog, a woman's dragon): a plague may come down from the sky. Close the sky door with its rite; put no new roof on a house, swear no oaths, beware of lightning and the hearth, take in no new dog, and recite the hundred names of Ākāśagarbha and the Uṣṇīṣa's averting.
reading.LogMen.EARTH_DOOR=On the earth door (a man's pig, a woman's snake): spirits of ruin rise and harm comes from low ground; illnesses of the nāgas (ཀླུ, klu), leprosy, sores and boils spread. Lay no foundations and dig no earth; recite the Kṣitigarbha dhāraṇīs, press down the spirits of ruin and close the earth door; three people of different clans recite the Mahāmāyūrī thirteen times.
reading.LogMen.RUIN=On the ruins (ox and sheep): disputes come; take care in trade abroad and with enemies, thieves and robbers. Make clay votive images (ཚ་ཚ, tsha tsha), turn back enemies, recite the Hundred Thousand, honour the wealth gods and the local god, and press down the spirits of loss.
reading.LogMen.SEPARATION=On the separations (bird and monkey): a married couple may part; beware of fights, quarrels and strife between spouses, or of illness and prison. Make rites against separation, leave your own mill open three days, receive a long-life empowerment and send away a thread-cross (མདོས, mdos).
reading.LogMen.LINEAGE_CUT=On the lineage-cuttings (mouse and horse): gossip, and misfortune in the father's line; give up robbery and ambush, theft, fights, disputes and secret works great and small. Recite the Vajra Claw Uṣṇīṣa and the averting rites, beat down gossip, and press down and turn back enemies.
reading.LogMen.GAIN=On the gains (tiger and hare): very good. Pray, and the gods help; seek, and wealth is found; practise against enemies, and they fall.
reading.LogMen.NONE=Its animal is neither a door nor one of the fives for you.
reading.Harsh={0} The White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) names harsh years for the precious human body: the year of your own animal, its seventh, your triad, the fourth up and the fourth down, and the years the progressed sign (ལོག་མེན, log men) comes to your own sign, to its seventh or to the enemy of your vitality. Others need the signs of a spouse, the parents or the dead, which the app does not have.
reading.Harsh.OWN_YEAR.SON=Your own animal has risen as the year. Do not visit the mourning or go to a sick person's pillow, and avoid building; leave distractions and strive in virtue; summon life and prosperity strongly, honour the four orders of monks and recite the Hundred Thousand, the Twenty Thousand and the Uṣṇīṣa. In the 13th year (and the 73rd), its element the son of yours: illness, and enemies rise against your prosperity; the body and the destiny matter most. Recite the Eight Appearances and the five great dhāraṇīs, raise your glory and turn back and press down enemies.
reading.Harsh.OWN_YEAR.FRIEND=Your own animal has risen as the year. Do not visit the mourning or go to a sick person's pillow, and avoid building; leave distractions and strive in virtue; summon life and prosperity strongly, honour the four orders of monks and recite the Hundred Thousand, the Twenty Thousand and the Uṣṇīṣa. In the 25th year, its element the friend of yours: the obstacle of reviving breath, well one day and unwell the next; ruin, disputes and the spirits of misfortune rise. For a man the vitality matters most, for a woman the destiny; recite the Dhvajāgra, the Vajravidāraṇa and the Sūtra of Amitāyus.
reading.Harsh.OWN_YEAR.ENEMY=Your own animal has risen as the year. Do not visit the mourning or go to a sick person's pillow, and avoid building; leave distractions and strive in virtue; summon life and prosperity strongly, honour the four orders of monks and recite the Hundred Thousand, the Twenty Thousand and the Uṣṇīṣa. In the 37th year, its element the enemy of yours: the obstacle of the demon's cutting; for the young, illness and losses; the destiny matters most. Recite the Prajñāpāramitā and the Dhvajāgra, ransom life with long-life dhāraṇīs, press down the spirits of loss and drive them out.
reading.Harsh.OWN_YEAR.MOTHER=Your own animal has risen as the year. Do not visit the mourning or go to a sick person's pillow, and avoid building; leave distractions and strive in virtue; summon life and prosperity strongly, honour the four orders of monks and recite the Hundred Thousand, the Twenty Thousand and the Uṣṇīṣa. In the 49th year, its element the mother of yours: glory descends; trade, friends and income are great; the luck matters most.
reading.Harsh.OWN_YEAR.IDENTITY=Your own animal has risen as the year. Do not visit the mourning or go to a sick person's pillow, and avoid building; leave distractions and strive in virtue; summon life and prosperity strongly, honour the four orders of monks and recite the Hundred Thousand, the Twenty Thousand and the Uṣṇīṣa. In the 61st year, its element your own: the obstacle of separation; separation, illness and suffering come; for a man the demon's cutting; the vitality matters most. People of five clans recite the Hundred Thousand, make clay votive images (ཚ་ཚ, tsha tsha) and rites against separation, avert illness and raise glory.
reading.Harsh.SEVENTH.ENEMY=The seventh from your animal has risen as the year, as a horse year for one born in a mouse year: harsh with enemies and slayers; a demon stirs and wants a ransom. Sudden frights, fear and blame come; recite the protective dhāraṇīs, honour the war gods and turn back enemies, mend paths, make clay votive images (ཚ་ཚ, tsha tsha) and give a feast to those who cannot repay it. In the 7th year (and the 67th): the slayer that cuts life; ransoming life with prayers suits it.
reading.Harsh.SEVENTH.MOTHER=The seventh from your animal has risen as the year, as a horse year for one born in a mouse year: harsh with enemies and slayers; a demon stirs and wants a ransom. Sudden frights, fear and blame come; recite the protective dhāraṇīs, honour the war gods and turn back enemies, mend paths, make clay votive images (ཚ་ཚ, tsha tsha) and give a feast to those who cannot repay it. In the 19th year (and the 79th): gaining glory, a time when trade and wealth succeed.
reading.Harsh.SEVENTH.IDENTITY=The seventh from your animal has risen as the year, as a horse year for one born in a mouse year: harsh with enemies and slayers; a demon stirs and wants a ransom. Sudden frights, fear and blame come; recite the protective dhāraṇīs, honour the war gods and turn back enemies, mend paths, make clay votive images (ཚ་ཚ, tsha tsha) and give a feast to those who cannot repay it. In the 31st year: separation; make the rites against separation and the general remedies.
reading.Harsh.SEVENTH.SON=The seventh from your animal has risen as the year, as a horse year for one born in a mouse year: harsh with enemies and slayers; a demon stirs and wants a ransom. Sudden frights, fear and blame come; recite the protective dhāraṇīs, honour the war gods and turn back enemies, mend paths, make clay votive images (ཚ་ཚ, tsha tsha) and give a feast to those who cannot repay it. In the 43rd year: the enemy of prosperity; summon prosperity and raise the destiny.
reading.Harsh.SEVENTH.FRIEND=The seventh from your animal has risen as the year, as a horse year for one born in a mouse year: harsh with enemies and slayers; a demon stirs and wants a ransom. Sudden frights, fear and blame come; recite the protective dhāraṇīs, honour the war gods and turn back enemies, mend paths, make clay votive images (ཚ་ཚ, tsha tsha) and give a feast to those who cannot repay it. In the 55th year: the enemy of reviving breath, a time when good and bad change places.
reading.Harsh.TRIAD=One of the two other animals of your triad (for the tiger the horse and the dog, and so on) has risen as the year, with the same luck as yours: wealth and nourishment are lost, trouble comes from the mother's side, with gossip, illness and disputes. Do not pull down dark houses and avoid long journeys; beware of killing and of the pollution of the dead; honour the male god and the war gods and make rites to turn back enemies.
reading.Harsh.FOURTH_UP=The fourth animal counted up from yours has risen as the year (the ox for a dragon): one of the four slayers, which brings illness. Recite for the sick and make white rites; avert by ransom and recite the Twenty Thousand.
reading.Harsh.FOURTH_DOWN=The fourth animal counted down from yours has risen as the year (the sheep for a dragon): one of the four slayers, which brings death. Ransom life and avert it, and recite the Twenty Thousand.
reading.Harsh.LOG_MEN_OWN=The progressed sign has come to your own birth sign: your own body cannot carry you, and a load you cannot bear falls on you.
reading.Harsh.LOG_MEN_SEVENTH=The progressed sign stands on the seventh from your birth sign: it reaches the seat before the life-cutter; bad.
reading.Harsh.LOG_MEN_ENEMY=The progressed sign's element is the enemy of your vitality: the demon's cutting; bad.
reading.NineMultiple={0} The nine-multiples (དགུ་མིག, dgu mig) are the 9th, 18th and every ninth year to the 81st; a man's are counted up from the mouse, a woman's from the bird, each with its animal and trigram (སྤར་ཁ, spar kha). The year is worse when its sign is also an enemy, a slayer or a tomb.
reading.NineMultiple.MALE.9=The 9th (dragon, under the fire trigram (ལི, li)): the sky's medicine drops the child from its lap; bad for small children, the great disgrace of the young: the gods' playground left empty.
reading.NineMultiple.MALE.18=The 18th (sheep, under the earth trigram (ཁོན, khon)): prosperity declines and the bucket leaks at the bottom; for a man in his prime, knives and stabbing pains.
reading.NineMultiple.MALE.27=The 27th (dog, under the lake trigram (དྭ, dwa)): the vulture tied to a stone; the destiny is carried off by thieves; a face of knives and weapons.
reading.NineMultiple.MALE.36=The 36th (ox, under the sky trigram (ཁེན, khen)): sudden fright and loss of wealth; the turquoise bee's wing breaks and fortune declines; pollution and misfortune come, with a face of knives. The great disgrace of a man in his prime: enemies, and the three things lost.
reading.NineMultiple.MALE.45=The 45th (dragon, under the water trigram (ཁམ, kham)): a fierce illness rises; the lion has fallen into a pit of water; pollution and poison.
reading.NineMultiple.MALE.54=The 54th (sheep, under the mountain trigram (གིན, gin)): illness from the gods; a time of death and loss.
reading.NineMultiple.MALE.63=The 63rd (dog, under the thunder trigram (ཟིན, zin)): a time of stabbing pains and blockages; the sky's load tears at the narrow place. The great disgrace of an old man: the old dog dies.
reading.NineMultiple.MALE.72=The 72nd (ox, under the wind trigram (ཟོན, zon)): madness and fainting; enemies, threats of war and knives lying in wait.
reading.NineMultiple.MALE.81=The 81st (dragon, under the fire trigram (ལི, li)): a face of red and blood; the old fear epidemics; a time when what falls from the sky comes down.
reading.NineMultiple.FEMALE.9=The 9th (ox, under the water trigram (ཁམ, kham)): the string of the turquoise rosary breaks; talk, pollution, illness and epidemics; danger to mother and child.
reading.NineMultiple.FEMALE.18=The 18th (dragon, under the sky trigram (ཁེན, khen)): an oath sworn by a woman brings a child's death; a devouring gyalpo (རྒྱལ་པོ, rgyal po) rises; a fall from a horse or a cliff, landslides and knives. The great disgrace of a young woman: the spring of life dries.
reading.NineMultiple.FEMALE.27=The 27th (sheep, under the lake trigram (དྭ, dwa)): stabbing pains, misfortune, strife and pollution; the women's line breaks and the child dies.
reading.NineMultiple.FEMALE.36=The 36th (dog, under the earth trigram (ཁོན, khon)): the iron she-wolf bites; sores harm the bearing of children; grief comes.
reading.NineMultiple.FEMALE.45=The 45th (ox, under the fire trigram (ལི, li)): the old earth-lord woman of former times reaches the narrow place: cut the ties; knives, landslides and miscarriage. The great disgrace of a woman in her prime: the white silk skirt leaks at the hem.
reading.NineMultiple.FEMALE.54=The 54th (dragon, under the wind trigram (ཟོན, zon)): epidemics, gossip, miscarriage and illness. The great disgrace of an old woman: the sun of glory sets.
reading.NineMultiple.FEMALE.63=The 63rd (sheep, under the thunder trigram (ཟིན, zin)): paralysis, illnesses of hunger, losses; the mistress of the house may die by the knife.
reading.NineMultiple.FEMALE.72=The 72nd (dog, under the mountain trigram (གིན, gin)): earth lords (ས་བདག, sa bdag) and curses do harm, and tumours come; the son's element falls, and a son born dies.
reading.NineMultiple.FEMALE.81=The 81st (ox, under the water trigram (ཁམ, kham)): widowhood comes to your own door.
reading.MewaObstacle={0} The White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) names four small obstacles of the mewa (སྨེ་བ, sme ba) of your year of age.
reading.MewaObstacle.HOUSE=It falls on the mewa of the present year: the house obstacle. Building and repairs, and raising a gate or a lintel, are bound; there is a face of illness: recite the Golden Light and make averting rites.
reading.MewaObstacle.BED=It falls on your natal mewa: the bed obstacle, the mewa's own bones gathered in. Move where you sleep and where you give birth. Born white and falling on white: quarrels and danger, your own demon (བདུད, bdud) comes down, and for a woman a gyalpo (རྒྱལ་པོ, rgyal po) harms; black on black, the male demons harm; blue on blue, gods and spirits bring illness; green on green, cutting trees and impurity anger the nāga (ཀླུ, klu) kings; yellow on yellow, building works stir the nyen (གཉན, gnyan) and the earth lords (ས་བདག, sa bdag); red on red, gossip, for a man a face of red, for a woman a miscarriage.
reading.MewaObstacle.LAND=It falls on the two-black: the land obstacle, "the black tent pitched over the head": a wish for a corpse threatens old or young, with sudden illness and fright. Make the mewa's own rites.
reading.MewaObstacle.ROYAL_GATE=It is the enemy of your natal mewa, or the two are fire and iron: the royal gate blocked. Guard that direction and send a ransom effigy there, one for each year of your age.
reading.YearTrigram={0} The trigram (སྤར་ཁ, spar kha) of your year of age moves one place a year: for a man from the fire trigram (ལི, li) towards the earth trigram (ཁོན, khon), for a woman from the water trigram (ཁམ, kham) towards the sky trigram (ཁེན, khen). The White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) says what to bind and avoid under each, the spirits that harm, the illnesses, the directions to guard and the remedies.
reading.YearTrigram.LI=A year under the fire trigram (ལི, li): bind gossip and fights, roofing a house, sending or receiving a bride, polluting the hearth, burning corpses and firing pottery. Demons (བདུད, bdud), nāgas (ཀླུ, klu), tsen (བཙན, btsan), mamo (མ་མོ, ma mo) and gyalpo (རྒྱལ་པོ, rgyal po) harm, and the ghosts of those killed by knife or horse; illnesses of the head and senses, eyes and heart, blood fevers and the throat, and for a woman bleeding and miscarriage. Buy no red goods, copper or red pottery; the dangerous time is autumn, when the grass turns yellow; guard the west and the north-west. Recite the Uṣṇīṣa, the Vajravidāraṇa and the Sūtra of Amitāyus, and send a thread-cross (མདོས, mdos).
reading.YearTrigram.KHON=A year under the earth trigram (ཁོན, khon): bind building walls, laying foundations, opening the earth and raising an outer gate, and keep away from graves and the pollution of the dead. Earth lords (ས་བདག, sa bdag), mamo (མ་མོ, ma mo), demons (བདུད, bdud), nyen (གཉན, gnyan) and nāgas (ཀླུ, klu) harm; illnesses of the spleen, bile and phlegm, swellings, skin diseases and long inner illnesses. Avoid old cattle and sheep and an old woman's gold and turquoise; guard the north and the south-east. Recite the Pañcarakṣā, the Kṣitigarbha and the Avataṃsaka, and send a ransom shaped as a sheep to the south-west.
reading.YearTrigram.DWA=A year under the lake trigram (དྭ, dwa): bind sorcery, burnt offerings, war, breaking rock, burning corpses, going to the smithy, marriage, fights and red mountains. Tsen (བཙན, btsan) and the ghosts of the violently killed harm, with arrows and knives; stabbing pains, illnesses of the lungs, heart and bones, sudden tumours and pains in the left side. Buy no iron goods, weapons or armour; beware of the smith's tools and of midnight; guard the east and the south. Recite the Nāmasaṅgīti and long-life dhāraṇīs, make many clay votive images (ཚ་ཚ, tsha tsha), and send a ransom shaped as a bird or a monkey to the west.
reading.YearTrigram.KHEN=A year under the sky trigram (ཁེན, khen): bind burning on mountains, war, dangerous paths, pulling down or roofing a house and funeral rites. The gyalpo (རྒྱལ་པོ, rgyal po), curses, spirits of ruin and the spirits of the ancestors' tombs harm; head injuries, dog bites on the left leg, falls, lightning, lung illness, stiff joints and epidemics. Do not trade in dogs or white horses and do not sleep in temples; guard the south and the east. Recite the Golden Light, the Avataṃsaka and the Heart Sūtra, press down the spirits of the tombs, build stūpas and clay votive images (ཚ་ཚ, tsha tsha), and send a ransom shaped as a dog to the north-west.
reading.YearTrigram.KHAM=A year under the water trigram (ཁམ, kham): do not dig into the lakes and springs of the nyen (གཉན, gnyan), cut new channels or cross great rivers; avoid polluting water and travelling at night. Lake goddesses, nāgas (ཀླུ, klu) and gods offended by impurity harm; dropsy, kidney illness, cold tumours and diarrhoea. Wear no black lower garments and eat no fish or pork; guard the south-west and the north-east. Recite the Great Cloud Sūtra and the Golden Light, make the nāgas' rites, bathe with the Vidāraṇa ablution, and send a ransom shaped as a mouse or a pig to the north.
reading.YearTrigram.GIN=A year under the mountain trigram (གིན, gin): bind damaging temples and stūpas, hurling zor (ཟོར, zor), breaking rock, building and works in the earth. Earth lords (ས་བདག, sa bdag), nāgas (ཀླུ, klu), sorcery and the spirits of neglected offerings harm; illnesses of the spleen and lymph, leprosy, sores, boils and itching, and pains in the right leg. Do not trade in pigs, oxen or monks' goods; beware of oxen at sunrise; guard the south-east and the north. Recite the Hundred Thousand and the Mahāmāyūrī, give many tormas (གཏོར་མ, gtor ma), make clay votive images (ཚ་ཚ, tsha tsha), one for each year of your age, and send a ransom shaped as an ox to the north-east.
reading.YearTrigram.ZIN=A year under the thunder trigram (ཟིན, zin): do not cut the trees or break the rocks of the nyen (གཉན, gnyan), bring out black wood or buy carpenters' tools; avoid oaths and the crossbow. Nāgas (ཀླུ, klu), hungry spirits, demons (བདུད, bdud) of the suicides and tsen (བཙན, btsan) harm; stabbing pains, phlegm, liver illness, pains in the right side and sudden illness. Buy no donkeys and eat no hare; beware of arrows in the morning; guard the west and the north-west. Recite the Gaṇḍavyūha and the confession of downfalls, make the nāgas' rites and water tormas (གཏོར་མ, gtor ma), dig ponds and wells, and send a ransom shaped as a tiger or a hare east or west.
reading.YearTrigram.ZON=A year under the wind trigram (ཟོན, zon): bind sending or receiving a bride, oaths, carrying gold and turquoise and raising banners, and beware of contagious illness. Mamo (མ་མོ, ma mo), spirits of madness and the gyalpo (རྒྱལ་པོ, rgyal po) harm; epidemics, trembling of heart and breath, disorders of the channels and winds, dizziness, madness and fainting. Do not buy yak hybrids or mules; guard the north-east and the south-west. Recite the Uṣṇīṣa and the dhāraṇīs that avert epidemics, send thread-crosses (མདོས, mdos) and water offerings, give a feast for children, and send a ransom shaped as a dragon to the south-east.
reading.YearMewa={0} Your natal mewa (སྨེ་བ, sme ba), the year's of your birth, stands in the middle of the square, and the mewa of each year of age moves out from it to the east, one place a year: a male birth year turns on to the north-east, a female one to the south-east, "whether the person is male or female". The White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads where it falls by the mewa you were born under.
reading.YearMewa.N2.C3=Born under the two-black, falling on the three-blue: livestock is lost and losses bring fright; ghosts of beasts killed by the knife harm, and there is danger of being struck by stones. Avoid quarrels and fights, and recite the Dhvajāgra and the long-life dhāraṇīs.
reading.YearMewa.N2.C4=Born under the two-black, falling on the four-green: nāgas (ཀླུ, klu) and demons (བདུད, bdud) together harm from a stream or a valley. Confession and fulfilment rites help; in illness, offerings of medicine and the nāgas' thread-cross (མདོས, mdos).
reading.YearMewa.N2.C5=Born under the two-black, falling on the five-yellow: yellow fluid, stomach and liver illnesses of cold; an old illness returns and grief comes. In illness a spirit of a painted image or a hermitage harms: long-life sūtras, a vase ablution and a long-life ransom; do not fight with monks.
reading.YearMewa.N2.C7=Born under the two-black, falling on the seven-red: beasts of prey, the strike of weapons, wounds and blood; the harmful spirits of the dead who broke their pledges (དམ་སྲི, dam sri) harm; the upper body is uneasy, with vomiting; moxa helps, bloodletting harms. Enemies and thieves lie in wait; make confession and fulfilment rites.
reading.YearMewa.N2.C6=Born under the two-black, falling on the six-white: it does not fall on the life; small gains grow; in illness, defilement from the north-east: confession and purification.
reading.YearMewa.N2.C18=Born under the two-black, falling on the one-white or eight-white: it does not fall on the life; quarrels at home or danger from red; each mewa's own spirit harms. A nāga (ཀླུ, klu) thread-cross (མདོས, mdos) and a golden thread-cross help.
reading.YearMewa.N2.C9=Born under the two-black, falling on the nine-red: for a man fights and enemies, for a woman childbirth, for both a face of red; in illness the protectors harm, and confession and fulfilment rites matter most.
reading.YearMewa.N3.C2=Born under the three-blue, falling on the two-black: demons (བདུད, bdud) and hearth spirits harm together; madness and fainting; an illness brings fright but not death; earth spirits of old ruins cause pains in the upper body. Make rites against the demons.
reading.YearMewa.N3.C4=Born under the three-blue, falling on the four-green: suffering comes to a man; in illness, long sickness from the mother's side; make the nāgas' (ཀླུ, klu) rites, keep away from slaughter, and avoid red people and horses from the north-east; bleeding from nose and mouth.
reading.YearMewa.N3.C5=Born under the three-blue, falling on the five-yellow: bile and wind rise; grief comes among the men of your kin; harm from the south and the east; eat no food from those who come from there.
reading.YearMewa.N3.C7=Born under the three-blue, falling on the seven-red: turn back enemies; sorcery from the south or the east harms; press down the harmful spirits of the dead (སྲི, sri); in illness, the ghosts of the north-east.
reading.YearMewa.N3.C68=Born under the three-blue, falling on the six-white or eight-white: a spirit from a tree in the south-west harms, with fever above and diarrhoea below; make rites for the gods and offer lamps.
reading.YearMewa.N3.C19=Born under the three-blue, falling on the one-white or nine-red: a spirit joined with the harmful spirits of the dead (སྲི, sri) harms from beyond two rivers, and those who died by water or the knife rise; give a ransom (གླུད, glud) to the water and press down its spirits; an illness passes in nine days.
reading.YearMewa.N4.C2=Born under the four-green, falling on the two-black: harm from a black rock and from the east; illnesses and deaths caused by the nāgas (ཀླུ, klu); rites of fulfilment and averting help.
reading.YearMewa.N4.C3=Born under the four-green, falling on the three-blue: stabbing pains and stiff joints; hard to live though one does not die; make offerings to the gods and remedy the harm of the water spirits; trembling of the upper body.
reading.YearMewa.N4.C4=Born under the four-green, falling on the four-green: the hearth is polluted in the north-east, or the earth of the nyen (གཉན, gnyan) has been dug; no death, but nāga (ཀླུ, klu) spirits harm and the gods are displeased; purify, and recite the Dhvajāgra.
reading.YearMewa.N4.C5=Born under the four-green, falling on the five-yellow: tumours and fevers rise; in illness, from the hearth or dug earth; recite the Dhvajāgra and the Vajra Mouth; one recovers in twelve days.
reading.YearMewa.N4.C7=Born under the four-green, falling on the seven-red: from the south the spirits of forefathers killed by the knife harm, and for a woman a spirit of the dead in childbirth.
reading.YearMewa.N4.C18=Born under the four-green, falling on the one-white or eight-white: enemies rise; illnesses of the sinews and bones; nāgas (ཀླུ, klu) and the gyalpo (རྒྱལ་པོ, rgyal po) harm; give a ransom of grain and make confession and fulfilment rites.
reading.YearMewa.N4.C69=Born under the four-green, falling on the six-white or nine-red: it does not fall on the life; in illness, a sour or bitter spirit harms; purification, ablution and fulfilment rites help.
reading.YearMewa.N5.C2=Born under the five-yellow, falling on the two-black: a rock spirit, or the ghosts of the mother's brothers, harm; from the north they come with a black horse and black clothes, bringing food; send a ransom of dough to the north.
reading.YearMewa.N5.C3=Born under the five-yellow, falling on the three-blue: stomach pains, madness and fainting; recite the Mahāmāyūrī and make a vase ablution; for women, blue sorcery comes.
reading.YearMewa.N5.C4=Born under the five-yellow, falling on the four-green: earth lords (ས་བདག, sa bdag) and nāgas (ཀླུ, klu) bring illness; press down the earth lords and undo the nāgas' sorcery.
reading.YearMewa.N5.C5=Born under the five-yellow, falling on the five-yellow: epidemics and blame; in illness a spirit of a ruined valley harms, and an old widowed woman of the south-west; a tantric priest averts it with tormas (གཏོར་མ, gtor ma).
reading.YearMewa.N5.C7=Born under the five-yellow, falling on the seven-red: thieves and enemies lie in wait; turn enemies back in the north-east at midnight; in illness, the demons (བདུད, bdud) of lords harm.
reading.YearMewa.N5.C1689=Born under the five-yellow, falling on one of the three whites or the nine-red: honour the gods, call prosperity at its times, and beware of impurity and defilement.
reading.YearMewa.N7.C2=Born under the seven-red, falling on the two-black: examine it with care: in illness the nyen (གཉན, gnyan) bring a face of red, and there is danger of killing.
reading.YearMewa.N7.C3=Born under the seven-red, falling on the three-blue: fright and sudden misfortune; danger of being killed through a horse; the lords of offered wealth harm, and the remedy is to cut their claims.
reading.YearMewa.N7.C4=Born under the seven-red, falling on the four-green: cold illnesses of the stomach and stiff joints; a spirit of madness of the neighbours harms; with the rites one is free in twenty-one days.
reading.YearMewa.N7.C5=Born under the seven-red, falling on the five-yellow: limbs, paralysis and yellow fluid; a spirit attached to dried wealth harms; ablution and averting rites help.
reading.YearMewa.N7.C7=Born under the seven-red, falling on the seven-red: a tsen (བཙན, btsan) ghost harms from a red rock mountain; in illness, from the south, where one was killed by the knife; a face of blood and of separation.
reading.YearMewa.N7.C1689=Born under the seven-red, falling on one of the three whites or the nine-red: wealth is spent and grows again; beware of impurity; an illness is easy to survive; make offerings to the nāgas (ཀླུ, klu).
reading.YearMewa.NW.C2=Born under one of the three whites, falling on the two-black: meeting a black man leading a black dog from the south-east; make the rites of the gyalpo (རྒྱལ་པོ, rgyal po); an illness does not kill, but take care for eighteen days.
reading.YearMewa.NW.C3=Born under one of the three whites, falling on the three-blue: the nyen (གཉན, gnyan) and the gyalpo (རྒྱལ་པོ, rgyal po) of the south-west harm, and danger rises from red in the south-west; remedy the nāgas (ཀླུ, klu), the nyen and the gyalpo.
reading.YearMewa.NW.C4=Born under one of the three whites, falling on the four-green: lung illness from within; the gyalpo (རྒྱལ་པོ, rgyal po) and the war gods harm; sorcery harms, so undo it and give up feuds.
reading.YearMewa.NW.C5=Born under one of the three whites, falling on the five-yellow: pox and joint pains; a harmful spirit of the east; a thread-cross (མདོས, mdos) to the mamo (མ་མོ, ma mo) saves within three days.
reading.YearMewa.NW.C7=Born under one of the three whites, falling on the seven-red: a red hearth: avoid pottery, burnt offerings and the smithy; ghosts of hunted game harm; one recovers in nine or ten days.
reading.YearMewa.NW.C168=Born under one of the three whites, falling on one of the three whites: good; in illness, an old woman in grey clothes, of the near kin, harms, and food brings it on.
reading.YearMewa.NW.C9=Born under one of the three whites, falling on the nine-red: food and wealth are met with; avoid impurity and defilement; in illness, make the fulfilment thread-cross of the mamo (མ་མོ, ma mo).
reading.YearMewa.N9.C2=Born under the nine-red, falling on the two-black: bad omens are met; epidemics and the harmful spirits of the dead (སྲི, sri) rise; avert them, and remedy the harm of fire, knives and the lords of offered wealth.
reading.YearMewa.N9.C3=Born under the nine-red, falling on the three-blue: thrown by a horse, an enemy's arrow strikes; losses come; draw a thread and call prosperity.
reading.YearMewa.N9.C4=Born under the nine-red, falling on the four-green: illnesses of the lungs, phlegm and bile from quarrels; undoing sorcery matters most.
reading.YearMewa.N9.C5=Born under the nine-red, falling on the five-yellow: long illness, pox, sores and itching; corpse pollution strikes; purify and bathe.
reading.YearMewa.N9.C7=Born under the nine-red, falling on the seven-red: the protectors stir; send a ransom (གླུད, glud) to the south-west; in illness a face of blood and ghosts of the violently killed; remedy them.
reading.YearMewa.N9.C168=Born under the nine-red, falling on one of the three whites: wishes are fulfilled; it goes well abroad; in illness, confession and fulfilment rites; one recovers in nine or thirteen days.
reading.YearMewa.N9.C9=Born under the nine-red, falling on the nine-red: a face of the hearth, and yet wishes are achieved.
