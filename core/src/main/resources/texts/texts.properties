reading.Weekday.SUNDAY.illness=the demons (བདུད, bdud), tsen (བཙན, btsan) and drewo (གྲེ་བོ, gre bo) who followed after something white harm; send the tsen's and the demons' thread-crosses (མདོས, mdos), make offerings to the eight nāgas (ཀླུ, klu) and a water offering, feast as many children as the sick one's years, and at dusk send a ransom (གླུད, glud) wrapped in a fragrant undergarment
reading.Weekday.MONDAY.illness=the nāga-ogres and the spirits of the dead who followed after a house of mourning harm; treat it with a water offering and the mamo's (མ་མོ, ma mo) thread-cross; pour a measure for each of the sick one's years into a sheep's stomach and a water bowl, with figures of fish and snakes and a ransom (གླུད, glud), and send them at dusk to where waters meet
reading.Weekday.TUESDAY.illness=illness comes from red, flesh and blood, and from slaughter; the tsen (བཙན, btsan) and the drewo (གྲེ་བོ, gre bo) who followed the red of a defiled hearth, impurity and a bad direction harm; dhāraṇī rites, offerings to the gods and the tsen's rite
reading.Weekday.WEDNESDAY.illness=illness from the curse of a monk or a Bonpo (བོན་པོ, bon po), or from the nāgas (ཀླུ, klu) who followed after a son or a sister; clearing the defilement and a nāga rite are good
reading.Weekday.THURSDAY.illness=the nāga-ogres and the gyalpo (རྒྱལ་པོ, rgyal po) who followed after a journey by night harm; a zor (ཟོར, zor) thread-cross and offerings to the eight nāgas (ཀླུ, klu) help
reading.Weekday.FRIDAY.illness=the gyalpo (རྒྱལ་པོ, rgyal po) and tsen (བཙན, btsan) who followed after trade harm; reading scripture, fumigation and clearing, and the tsen's rite
reading.Weekday.SATURDAY.illness=Yama's host (གཤིན་རྗེ, gshin rje), the earth lords (ས་བདག, sa bdag), the theurang (ཐེའུ་བྲང, the'u brang) and the mamo (མ་མོ, ma mo) harm; it answers a seasonal rite broken, carrying and burnt offerings (གསུར, gsur); recite dhāraṇīs and treat the eight nāgas (ཀླུ, klu) and the earth lords
reading.TwelveLinks.IGNORANCE.illness=if it is not fatal within half a month, recovery comes three days after; take great care
reading.TwelveLinks.FORMATION.illness=if it is not fatal within seven days, life returns three days after
reading.TwelveLinks.CONSCIOUSNESS.illness=if it is not fatal on the third or fifth day, life returns on the seventh or eighth
reading.TwelveLinks.NAME_AND_FORM.illness=if it is not fatal on the third or fifth day, one is freed of it after the seventh; past the eighth there is no recovery
reading.TwelveLinks.SOURCES.illness=it strikes on the third or fourth day; if it is not fatal, life returns on the tenth
reading.TwelveLinks.CONTACT.illness=if it is not fatal within three days, life returns from the eighth, and for long
reading.TwelveLinks.FEELING.illness=if it is not fatal within five days, one is up on the ninth and recovered on the tenth
reading.TwelveLinks.CRAVING.illness=if it is not fatal on the eighth day, life returns on the tenth; without recovery by then, death
reading.TwelveLinks.GRASPING.illness=if it is not fatal within eight days, recovery comes on the tenth, and life if death does not follow soon after
reading.TwelveLinks.BECOMING.illness=if it is not fatal on the third or ninth day, recovery
reading.TwelveLinks.BIRTH.illness=if it is not fatal within five days, recovery comes on the eighth
reading.TwelveLinks.AGEING_AND_DEATH.illness=if it is not fatal on the third or seventh day, a decoction frees one of it
