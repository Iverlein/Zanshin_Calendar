reading.EarthLord.NAG_CHUNG=The lesser black day, Nyima Nakchung (ཉི་མ་ནག་ཆུང, nyi ma nag chung), the course of Jama Gunggyal (བྱ་མ་གུང་རྒྱལ, bya ma gung rgyal). Avoid works for the dead, a bride, consecration, feasts and funeral rites, and above all sending wealth out of the house.
reading.EarthLord.NAG_CHUNG.remedy=set dough figures of a tiger, a horse, a sheep and a dog to the south, west, north and east with offerings; or burn white butter, scatter white earth on the roof and red earth to the four sides
reading.EarthLord.PI_LING=Piling Parma (པི་ལིང་འཕར་མ, pi ling 'phar ma), an earth lord (ས་བདག, sa bdag) with eleven ministers, moves today. Every work great and small goes badly, and digging the ground brings deaths; fierce work done along with it strikes hard.
reading.EarthLord.PI_LING.remedy=read the scriptures, raise a yellow banner and make a thread-cross (མདོས, mdos) for the earth lords
reading.EarthLord.ZIN_PHUNG=Zinpung (ཟིན་ཕུང, zin phung), an earth lord (ས་བདག, sa bdag), {0} Great works bring great harm and small ones small; bad means go along with it, and it is never faced.
reading.EarthLord.ZIN_PHUNG.0=moves today from south to north.
reading.EarthLord.ZIN_PHUNG.1=moves today from west to east.
reading.EarthLord.ZIN_PHUNG.2=moves today from north to south.
reading.EarthLord.ZIN_PHUNG.3=moves today from east to west.
reading.EarthLord.ZIN_PHUNG.middle=sits today in the middle, and nothing is to be done.
reading.EarthLord.ZIN_PHUNG.birth=the child turns back
reading.EarthLord.PHUNG_ZOR=Pungpo Zortok (ཕུང་པོ་ཟོར་ཐོགས, phung po zor thogs), an earth lord (ས་བདག, sa bdag), moves today. Works for the living and the dead go badly, virtuous work among them, and destructive mantras against others go well.
reading.EarthLord.PHUNG_ZOR.remedy=set up a man with a tiger quiver and a zor (ཟོར, zor), or turn it outward or burn it
reading.EarthLord.KI_KANG=Kikang (ཀི་ཀང, ki kang), the general demon of the elements, the wild and fierce planet Rāhu, moves today. White work brings a king down, a bride goes badly both ways, a building soon falls, and a feast becomes a funeral feast.
reading.EarthLord.KI_KANG.illness=an illness that comes today does not heal
reading.EarthLord.KI_KANG.birth=the child soon turns back
reading.EarthLord.HAL_KHYI=Halkyi Nakpo (ཧལ་ཁྱི་ནག་པོ, hal khyi nag po), the panting black dog, an earth lord (ས་བདག, sa bdag), seeks food today. Every virtuous work goes badly; directing magic and harmful work go well.
reading.EarthLord.HAL_KHYI.remedy=at its hour hang a whole dog's or sheep's head with silk on the roof, or point a black dog of grain its way
reading.EarthLord.GNAM_KHYI=The black sky dog (གནམ་ཁྱི་ནག་པོ, gnam khyi nag po), an earth lord (ས་བདག, sa bdag), seeks food today. Great works for the living and the dead go badly, as on the days of Halkyi Nakpo (ཧལ་ཁྱི་ནག་པོ, hal khyi nag po).
reading.EarthLord.GNAM_SBYOR=Namjor (གནམ་སྦྱོར, gnam sbyor), an earth lord (ས་བདག, sa bdag), falls today. It bears on marriage and on the dead: whatever joins a couple or moves a corpse goes badly.
reading.EarthLord.GZA_RGOD=Zagö (གཟའ་རྒོད, gza' rgod), the wild planet, an earth lord (ས་བདག, sa bdag), seeks food today. Giving or taking a bride goes badly, and fierce work goes well.
reading.EarthLord.GZA_RGOD.remedy=hoist silk in the colour of the weekday and burn white butter
reading.EarthLord.GZA_RGOD.illness=an illness that comes today does not heal
reading.EarthLord.GZA_RGOD.birth=one of the parents dies, or the child turns back
reading.EarthLord.GZA_RGOD.death=a corpse sent out repeats five times
reading.EarthLord.DBUL_PO=Ulpo Laktong (དབུལ་པོ་ལག་སྟོང, dbul po lag stong), the empty-handed pauper, an earth lord (ས་བདག, sa bdag), moves today. Feasts and giving out wealth bring poverty, and most works for the living and the dead go badly.
reading.EarthLord.DBUL_PO.remedy=take wealth from three rich men, make dough figures of a hand and a tortoise, and give a trader's grain away
reading.EarthLord.GZA_BDUN=Zadün (གཟའ་བདུན, gza' bdun), the seven planets seeking food and sending out messengers, an earth lord (ས་བདག, sa bdag), moves today. White work goes badly, and destructive mantras against others go well; its results are those of Kikang (ཀི་ཀང, ki kang).
reading.EarthLord.GZA_BDUN.remedy=recite the planets' consort and the supreme planet, hoist yellow silk and scatter yellow earth
reading.EarthLord.GZA_BDUN.birth=goes badly, and a boy's birth feast too
reading.EarthLord.NGAM_SHING=Ngamshing (ངམ་ཤིང, ngam shing), an earth lord (ས་བདག, sa bdag), moves today. Honouring a spiritual friend, the teacher and the teaching go well on it, and a bride is not allowed.
reading.EarthLord.BAR_KHYI=Barkyi (བར་ཁྱི, bar khyi), an earth lord (ས་བདག, sa bdag), moves today, on the dates of Zadün (གཟའ་བདུན, gza' bdun). Great works such as a bride, building and consecration go badly, and seeking one's aims too.
reading.EarthLord.BAR_KHYI.remedy=hang a dog's or sheep's head with silk on the roof, or point a black dog of grain its way, as for Halkyi Nakpo (ཧལ་ཁྱི་ནག་པོ, hal khyi nag po); or set a wooden tablet with the twelve years and eight trigrams, and a black dog, on the threshold
reading.EarthLord.KA_KHYUNG=Kakhyung Kikang (ཀ་ཁྱུང་ཀི་ཀང, ka khyung ki kang), an earth lord (ས་བདག, sa bdag), moves today. Nothing is to be done on it but fierce work: every other work is to be avoided.
reading.EarthLord.DRA_CHEN=Drachen (དྲ་ཆེན, dra chen), an earth lord (ས་བདག, sa bdag), moves today. The rough works of the living and the dead go badly, above all feasts, a bride and war.
reading.EarthLord.SDE_BRGYAD=The eight classes (སྡེ་བརྒྱད, sde brgyad) move by date with the earth lords (ས་བདག, sa bdag). {0} When they strike (ཐེབས, thebs), fierce work goes well; when they turn back (བཟློག, bzlog), it goes badly.
reading.EarthLord.SDE_BRGYAD.STRIKES=Today they strike.
reading.EarthLord.SDE_BRGYAD.TURNS_BACK=Today they turn back.
reading.EarthLord.SA_BDAG_BZLOG=The earth lords (ས་བདག, sa bdag) turn back (བཟློག, bzlog) today. Works against others and with the nāgas (ཀླུ, klu) then turn back on whoever begins them: no son, wealth lost, a short life and poverty.
reading.EarthLord.GNYAN=The nyen (གཉན, gnyan) move by date with the earth lords (ས་བདག, sa bdag). {0}
reading.EarthLord.GNYAN.MOVES=Today they move: whatever is begun has to be done again, so works go badly, but offerings to the nyen go well.
reading.EarthLord.GNYAN.STRIKES=Today they strike, and the day is judged as the eight classes' strikes are: fierce work goes well.
reading.EarthLord.GNYAN.TURNS_BACK=Today they turn back, and the day is judged as the eight classes' turnings are: fierce work goes badly.
reading.EarthLord.KLU=The nāgas (ཀླུ, klu) move by date with the earth lords (ས་བདག, sa bdag). {0} When they strike (ཐེབས, thebs), tormas (གཏོར་མ, gtor ma) for the nāgas, rainmaking and other works with them go well; when they turn back (བཟློག, bzlog), none of these may be done.
reading.EarthLord.KLU.STRIKES=Today they strike.
reading.EarthLord.KLU.TURNS_BACK=Today they turn back.
reading.EarthLord.CLASS_TIMES=The classes also have their own times, when works in accord with each go well. {0} Work done as a strike or turning nears flourishes, done ahead of it declines.
reading.EarthLord.CLASS_TIMES.klu=Today is the time of the nāgas (ཀླུ, klu), as the sun's rays rise.
reading.EarthLord.CLASS_TIMES.rgyal_po=Today is the time of the gyalpo (རྒྱལ་པོ, rgyal po), at dawn.
reading.EarthLord.CLASS_TIMES.lam_mo=Today is the time of the lamo (ལམ་མོ, lam mo), at dusk.
reading.EarthLord.CLASS_TIMES.btsan=Today is the time of the tsen (བཙན, btsan), as the sun's rays rise.
reading.EarthLord.CLASS_TIMES.gnod_sbyin=Today is the time of the yakṣas (གནོད་སྦྱིན, gnod sbyin), at midday and midnight.
reading.EarthLord.CLASS_TIMES.bdud=Today is the time of the demons (བདུད, bdud), at dusk.
reading.EarthLord.CLASS_TIMES.gshin_rje=Today is the time of Yama's host (གཤིན་རྗེ, gshin rje), late in the afternoon.
reading.EarthLord.GNAM_SGO=Every date has its sky door (གནམ་སྒོ, gnam sgo), by the last figure of its number, and on each door its own work goes badly. {0}
reading.EarthLord.GNAM_SGO.mgron_po=Today is the guests' door: seeking one's aims and receiving guests leave the house in want.
reading.EarthLord.GNAM_SGO.mgron_po.remedy=make offerings to the gods, strike down harmful talk, press the demon's name under your own handmill, wave a bird effigy to the northern sky and recite a dhāraṇī
reading.EarthLord.GNAM_SGO.tshong=Today is trade's door: trading brings losses without end.
reading.EarthLord.GNAM_SGO.tshong.remedy=press figures under an effigy, put a trader's flour in a shoe under a yak horn, scatter roasted grain in the sky, recite a dhāraṇī and wave a dharma book
reading.EarthLord.GNAM_SGO.bu_chung=Today is small children's door: a small child born, feasted or first taken out meets with obstacles.
reading.EarthLord.GNAM_SGO.bu_chung.remedy=put a child's corpse in a sack and strike it with a killer's weapon, recite a dhāraṇī and send harmful talk away
reading.EarthLord.GNAM_SGO.dmag=Today is war's door: an army led out is defeated nine times over.
reading.EarthLord.GNAM_SGO.dmag.remedy=hold the general's name and effigy captive, burn the tip of the armour, cut the tip of a stallion's ear, raise spears and banners and recite a dhāraṇī
reading.EarthLord.GNAM_SGO.gnyen=Today is alliances' door: an alliance made turns to quarrel, and a feast to loss.
reading.EarthLord.GNAM_SGO.gnyen.remedy=bind a cock, put it in salt and cover it with a low-born's shoe, talk of alliance with someone of no consequence, recite a long auspicious dhāraṇī and give good food to a beggar
reading.EarthLord.GNAM_SGO.mkhar=Today is the forts' door: building brings disputes before the mortar is dry.
reading.EarthLord.GNAM_SGO.mkhar.remedy=wave a basket in the sky, press a bean figure of a blind old man with the enemy's name inside into the village pen or a wall's foundation, and recite a dhāraṇī
reading.EarthLord.GNAM_SGO.bag_ma=Today is a bride's door: a bride taken is widowed again and again.
reading.EarthLord.GNAM_SGO.bag_ma.remedy=dress an old woman finely and give her bride's dough and beggar's dough, cast harmful talk into a measure, and recite a sūtra
reading.EarthLord.GNAM_SGO.dur=Today is the grave's door: a burial brings harmful spirits of the dead (སྲི, sri) from the grave, and ruin in the end.
reading.EarthLord.GNAM_SGO.dur.remedy=wave a wolf's skull to the sky and hide a pig's skull in the ground, give dough and beer, and recite dhāraṇīs
reading.EarthLord.GNAM_SGO.shid=Today is the funeral rites' door: funeral rites done bring disputes before the grass has dried.
reading.EarthLord.GNAM_SGO.shid.remedy=make the figure of a black ogress mounted on a skull, recite the black goddess's dhāraṇī and cleanse the village
reading.EarthLord.GNAM_SGO.spyi=Today is the general door: whatever is done goes wrong, above all the works of the community.
reading.EarthLord.GNAM_SGO.spyi.remedy=wave skulls to the four directions and recite dhāraṇīs
reading.RahuSeason=Rāhu seeks food today among the earth lords (ས་བདག, sa bdag) that move by date. Works great and small for the living and the dead go badly, above all work with earth and mud, and fierce work goes well.
reading.RahuSeason.remedy=recite the planets' consort and show Vajrapāṇi's image
wording.sending_hail=sending down hail
wording.making_tsatsas=clay votive images (ཚ་ཚ, tsha tsha)
wording.seeking_a_grave_site=seeking a grave site
wording.seeking_ones_aims=seeking one's aims
wording.taking_a_child_out=taking a child out for the first time
wording.a_new_couple_joining=a new couple joining
wording.giving_and_taking_dogs=giving and taking dogs
wording.a_small_childs_birth_feast_and_first_outing=a small child's birth, its feast and its first outing
wording.offerings_to_the_gnyan=offerings to the nyen (གཉན, gnyan)
wording.naga_tormas_and_offerings=nāga tormas (གཏོར་མ, gtor ma) and offerings to the eight nāgas
EarthLordCourse.SPUG_STON=Pukton's earth lords
reading.EarthLord.SPUG_STON=Pukton (སྤུག་སྟོན, spug ston) marks dates for the earth lords (ས་བདག, sa bdag) in each month: of success, of vanishing, and of no wealth given out. {0}
reading.EarthLord.SPUG_STON.grub=Today is a date of success: remedies for the earth lords help.
reading.EarthLord.SPUG_STON.yal=Today is a date of vanishing: remedies for the earth lords do not help, and turn back on whoever performs them.
reading.EarthLord.SPUG_STON.nor=Today no wealth is given out: wealth or livestock given out empties the pen.
wording.remedies_for_the_earth_lords=remedies for the earth lords
reading.EarthLord.CLASS_TIMES.gza=Today, a Viṣṭi date, is the time of the planets (གཟའ, gza').
reading.EarthLord.CLASS_TIMES.srin_po=Today, a Viṣṭi date, is the time of the ogres (སྲིན་པོ, srin po).
wording.work_with_mud=work with mud
wording.setting_up_growth=setting up growth (སྐྱེད་འཛུགས, skyed 'dzugs), word for word
wording.pulling_down_the_yak_wood=pulling down the yak wood (གཡག་ཤིང་དགོག, g.yag shing dgog), word for word
EarthLordCourse.NAG_CHEN=Nyima Nakchen
EarthLordCourse.ZHAG_NAG=The black day
reading.EarthLord.ZHAG_NAG=Today is a black day (ཞག་ནག, zhag nag): the day's animal is a four-slayer (བཞི་གཤེད, bzhi gshed) of the month's. Every important work goes badly, and fierce work done today strikes.
reading.EarthLord.ZHAG_NAG.remedy=draw a swastika on the right of the door, and the sun and the moon on the left
EarthLordCourse.ZLA_NAG=The black month
reading.EarthLord.ZLA_NAG=The black month (ཟླ་ནག, zla nag): a third of this month is black, as months of the year's four-slayers (བཞི་གཤེད, bzhi gshed) are. Works for the living and the dead go badly, and fierce rites go well.
reading.EarthLord.ZLA_NAG.remedy=carry three dough figures of the black months to a crossroads with the substances against gossip, saying "this is no black month but a white one, may works and deeds be auspicious", and recite the prayer of the goddess Mārīcī (འོད་ཟེར་ཅན་མ, 'od zer can ma); or hoist white silk, make a white burnt offering (གསུར, gsur), scatter red earth to the four directions, adorn a white-headed yak or sheep with white silk, make many water offerings and recite the Collected Dhāraṇīs (གཟུངས་བསྡུས, gzungs bsdus)
reading.EarthLord.ZLA_NAG.UPPER.falls=the upper third, the 1st to the 10th, in a first month of its season
reading.EarthLord.ZLA_NAG.MIDDLE.falls=the middle (སྒང, sgang), the 11th to the 20th, in a middle month of its season
reading.EarthLord.ZLA_NAG.LOWER.falls=the lower third, the 21st to the 30th, in a last month of its season
EarthLordCourse.KI_KANG_ZLA_NAG=Kikang's black month
reading.EarthLord.KI_KANG_ZLA_NAG=Kikang's black month (ཀི་ཀང་ཟླ་ནག, ki kang zla nag) falls today: one day in two months of each year, on which one work goes badly. It is very potent, so care matters. {0}
reading.EarthLord.KI_KANG_ZLA_NAG.TIGER=Funeral rites done today reopen death for the dead person's household.
reading.EarthLord.KI_KANG_ZLA_NAG.TIGER.falls=the 8th of the first months of summer and winter in a tiger year, at dawn
reading.EarthLord.KI_KANG_ZLA_NAG.RABBIT=Funeral rites done today bring ruin.
reading.EarthLord.KI_KANG_ZLA_NAG.RABBIT.falls=the 18th of the middle months of summer and winter in a hare year, at sunrise
reading.EarthLord.KI_KANG_ZLA_NAG.DRAGON=Funeral rites go badly today.
reading.EarthLord.KI_KANG_ZLA_NAG.DRAGON.falls=the full moon of the last months of summer and winter in a dragon year
reading.EarthLord.KI_KANG_ZLA_NAG.SNAKE=Funeral rites go badly today.
reading.EarthLord.KI_KANG_ZLA_NAG.SNAKE.falls=the 30th of the first months of autumn and spring in a snake year
reading.EarthLord.KI_KANG_ZLA_NAG.HORSE=Building a fort today goes badly for the reckoner, the spiritual teacher and the householder.
reading.EarthLord.KI_KANG_ZLA_NAG.HORSE.falls=the full moon of the middle months of autumn and spring in a horse year
reading.EarthLord.KI_KANG_ZLA_NAG.SHEEP=Trade done today brings loss of wealth.
reading.EarthLord.KI_KANG_ZLA_NAG.SHEEP.falls=the 22nd of the last months of autumn and spring in a sheep year, at dusk when the birds sleep
reading.EarthLord.KI_KANG_ZLA_NAG.MONKEY=A burial today ruins the household.
reading.EarthLord.KI_KANG_ZLA_NAG.MONKEY.falls=the 8th of the first months of summer and winter in a monkey year, at dawn
reading.EarthLord.KI_KANG_ZLA_NAG.BIRD=Virtuous work goes badly today.
reading.EarthLord.KI_KANG_ZLA_NAG.BIRD.falls=the 18th of the middle months of summer and winter in a bird year, at sunrise
reading.EarthLord.KI_KANG_ZLA_NAG.DOG=Work with earth, stone and mud goes badly today.
reading.EarthLord.KI_KANG_ZLA_NAG.DOG.falls=the 8th of the last months of summer and winter in a dog year
reading.EarthLord.KI_KANG_ZLA_NAG.PIG=Work with wood and carrying out a corpse go badly today.
reading.EarthLord.KI_KANG_ZLA_NAG.PIG.falls=the 30th of the first months of autumn and spring in a pig year
reading.EarthLord.KI_KANG_ZLA_NAG.MOUSE=Funeral rites go badly today.
reading.EarthLord.KI_KANG_ZLA_NAG.MOUSE.falls=the full moon of the middle months of autumn and spring in a mouse year
reading.EarthLord.KI_KANG_ZLA_NAG.OX=Wealth sent out of the house today makes the household's fortune (གཡང, g.yang) wane, and it falls into poverty.
reading.EarthLord.KI_KANG_ZLA_NAG.OX.falls=the 22nd of the last months of autumn and spring in an ox year, at dusk when the birds sleep
reading.EarthLord.KI_KANG_ZLA_NAG.remedy=draw a swastika on the right of the door, and the sun and the moon on the left, as for the black days
reading.SeasonSign.RISHI=The sage's seven days (དྲང་སྲོང་རི་ཏི, drang srong ri ti): when the sage's star first rises at dawn, for seven days the waters take on their eight qualities, by the sage's curse.
reading.SeasonSign.RISHI.falls=from the date on which the mean sun of the true reckoning reaches 10 mansions, 43 chutsö (ཆུ་ཚོད, chu tshod) and 30 chusang (ཆུ་སྲང, chu srang)
reading.SeasonSign.PIG=The pig's seven days (ཕག་ཞག, phag zhag): the rain falls as poison and the grain's essence fails. In the story of the Wise and Foolish (མཛངས་བླུན, mdzangs blun), the pig of the charnel ground (དུར་ཕག, dur phag) climbs a tree by Mount Meru (རི་རབ, ri rab). It takes three days up, a day at the top and three days down.
reading.SeasonSign.PIG.falls=from the date on which the mean sun of the true reckoning reaches 5 mansions, 46 chutsö (ཆུ་ཚོད, chu tshod) and 30 chusang (ཆུ་སྲང, chu srang)
reading.Comet=A long-tailed comet (དུ་བ་མཇུག་རིང, du ba mjug ring) is marked for this month by the count, a portent of good and ill. It may also come when the count does not mark it. It shows first as a star, then with its smoky tail, then as a star again, and does not fade before three months are out.
reading.Comet.falls=from the rabjung's (རབ་བྱུང, rab byung) elapsed years and the months since the 3rd, the corrected month count with 3 added leaves nothing over 75

# The year of life: the elemental divination of a year of age (WB vol. 1, pp. 255-258, 380-411; the Moonbeams), SPEC §5.9
BasicSign.PRESENT_YEAR=present year
BasicSign.LOG_MEN=progressed sign
BasicSign.TRIGRAM=trigram
BasicSign.SME_BA=mewa
BasicSign.SECTOR=energy stage
BasicSign.HOUR=hour of reckoning
Sector.TAKING_BREATH=stage of taking breath
Sector.IN_THE_WOMB=stage in the womb
Sector.BODY_COMPLETE=stage of the body complete
Sector.BIRTH=birth stage
Sector.BATHING=bathing stage
Sector.DRESSING=dressing stage
Sector.WORKING=working stage
Sector.FLOURISHING=flourishing stage
Sector.DECLINE=stage of decline
Sector.ILLNESS=illness stage
Sector.DEATH=death stage
Sector.ENTERING_THE_TOMB=tomb stage
HarshYear.OWN_YEAR=your own year
HarshYear.SEVENTH=the seventh
HarshYear.TRIAD=your triad
HarshYear.FOURTH_UP=the fourth counted up
HarshYear.FOURTH_DOWN=the fourth counted down
HarshYear.LOG_MEN_OWN=progressed sign on your own
HarshYear.LOG_MEN_SEVENTH=progressed sign on the seventh
HarshYear.LOG_MEN_ENEMY=progressed sign against your vitality
LogMenPlace.SKY_DOOR=sky door
LogMenPlace.EARTH_DOOR=earth door
LogMenPlace.RUIN=ruin
LogMenPlace.SEPARATION=separation
LogMenPlace.LINEAGE_CUT=lineage cut
LogMenPlace.GAIN=gain
SmeBaObstacle.HOUSE=house obstacle
SmeBaObstacle.BED=bed obstacle
SmeBaObstacle.LAND=land obstacle
SmeBaObstacle.ROYAL_GATE=royal gate blocked
reading.YearCare={0} Whatever the year shows, its black pebbles are to be treated in earnest, and the rites fitted to what matters most, to one's means, the place and the time. For people of rank or learning the luck matters most.
reading.YearCare.MAN=For a man the vitality is held the most precious: its pebbles are reckoned first, and its black ones mended first.
reading.YearCare.WOMAN=For a woman the destiny is held the most precious: its pebbles are reckoned first, and its black ones mended first.
reading.YearCare.CHILD=For a child the body is held the most precious: its pebbles are reckoned first, and its black ones mended first.
reading.YearCare.GENERAL=The vitality is held the most precious for a man, the body for a child and the destiny for a woman.
reading.YearPebble={0} Each sign of the year lays its pebbles on the aspect: white where it feeds the aspect's element or is its friend, black where it fights it.
reading.YearPebble.VITALITY.W3=Three white pebbles on the vitality, the best it can hold: the life force flourishes. Its image is the tree of life growing and a golden bridge of jewels raised. Good kin of the father's side back you, demons (བདུད, bdud) are pressed down and the protecting gods hover above. There is no worry of death or loss.
reading.YearPebble.VITALITY.W2=Two white pebbles on the vitality: it meets a friend, and no obstacle to life can come. Food fills the mouth and sights fill the eyes. Wishes are fulfilled, merit grows, and the good protecting gods come to meet you.
reading.YearPebble.VITALITY.W1=One white pebble on the vitality: lucky. Nothing stands in the way of the life it holds.
reading.YearPebble.VITALITY.B2=Two black pebbles on the vitality, the worst it can hold: the life force is under strain this year, to be treated in earnest. Its image is the tree of life breaking and the golden bridge falling from its foundation. The element meets the end of its time, and sorrow comes though you did no wrong.
reading.YearPebble.VITALITY.B2.remedy=save lives that were to be taken and kill nothing; honour the tombs and press down their spirits; make long-life rites, ransom the la, the life-spirit (བླ, bla), and recite long-life dhāraṇīs
reading.YearPebble.VITALITY.B2.spirits=a black bird of the demons (བདུད, bdud) hovers above, and the black dog of the harmful spirits of the dead who broke their pledges (དམ་སྲི, dam sri) bites below
reading.YearPebble.VITALITY.B1=One black pebble on the vitality: unlucky, and to be mended. Its image is the root of the tree of life drying. A spirit of ruin rises from the snow peaks, hidden from divination and reckoning.
reading.YearPebble.VITALITY.B1.remedy=ransom the la, the life-spirit (བླ, bla), a hundredfold with long-life rites, press down the spirit of ruin and move your bed
reading.YearPebble.VITALITY.WB=One white and one black pebble on the vitality: mixed, and not yet decided. Its image is the good goddesses and the black birds of the demons (བདུད, bdud) playing dice for the precious life, while mouths wrangle.
reading.YearPebble.VITALITY.WB.remedy=make rites for your person quickly, and turn aside misfortune and losses
reading.YearPebble.BODY.W3=Three white pebbles on the body, the best it can hold: strength and vigour grow, and helping gods go before you. Though fevers blaze you do not take to the sickbed. Though weapons rain your blood is not shed. You are at ease and free of disputes, and a child is born a boy.
reading.YearPebble.BODY.W2=Two white pebbles on the body: lucky. Illness clears and the mind is free of sorrow. Grief passes, quarrels calm, and the body's support is good.
reading.YearPebble.BODY.W1=One white pebble on the body: no god guards it, but no harmful spirit either. It stands like a spreading tree.
reading.YearPebble.BODY.B2=Two black pebbles on the body, the worst it can hold: illness circles it this year, to be treated in earnest. The mind suffers and the sickbed wears out. Doctors are constant guests, spirits are worshipped as gods, and illness lasts long.
reading.YearPebble.BODY.B2.remedy=take vows or change your outward form, keep the vows and wear protection; mend paths, make clay votive images (ཚ་ཚ, tsha tsha), restore the clothing of stūpas and offer lamps
reading.YearPebble.BODY.B1=One black pebble on the body: its element declines, and illness and sharp suffering come. Half your store goes to the spirits and half your food to medicine. Flesh, bone and skin are uneasy, and the mind is restless.
reading.YearPebble.BODY.B1.remedy=change your form and name, give and offer, keep vows, and make strong rites to strengthen the body
reading.YearPebble.BODY.WB=One white and one black pebble on the body: mixed. Gods and other spirits contend over it as at dice, and fear and fright may come. For a woman it is a sign of childbirth, which she comes through.
reading.YearPebble.BODY.WB.remedy=change your outward form and wear protection
reading.YearPebble.DESTINY.W3=Three white pebbles on the destiny, the best it can hold: the fruits of desire ripen. Harvests and herds are good, income is great and trade brings great profit. You gain field, house and land, and wealth swells like milk overflowing a white copper bowl.
reading.YearPebble.DESTINY.W2=Two white pebbles on the destiny: it meets a friend. Harvest and herds are good, and what you intend is achieved. People, wealth, herds and children increase, and wishes are fulfilled.
reading.YearPebble.DESTINY.W1=One white pebble on the destiny: what you seek outside is not found, but what is within is not lost. A rich man's storehouse is not emptied, and income is middling.
reading.YearPebble.DESTINY.B2=Two black pebbles on the destiny, the worst it can hold: wealth leaks away this year, to be treated in earnest. A spirit of ruin that robs wealth rises. The store of food empties, the horse you ride dies, harvests fail and trade brings little.
reading.YearPebble.DESTINY.B2.remedy=honour monks of pure discipline, offer lamps in temples, give a feast for children and release animals; mend paths, make many clay votive images (ཚ་ཚ, tsha tsha), and give water offerings and alms
reading.YearPebble.DESTINY.B1=One black pebble on the destiny: its food and wealth are turned upside down. Spirits of hunger and of loss rise, the herds give no milk and goblins steal from the stores. Food and wealth are not found, and merit shrinks.
reading.YearPebble.DESTINY.B1.remedy=make rites to raise the destiny, honour ordained monks, and give a large feast to those who cannot repay it
reading.YearPebble.DESTINY.WB=One white and one black pebble on the destiny: mixed. Food and wealth overflow and spill away, and losses come. Wealth is unsteady like a mirage in the heat, here one day and gone the next, and cannot be trusted.
reading.YearPebble.LUCK.W3=Three white pebbles on the luck, the best it can hold: merit grows, and your standing is higher than the sky. Leaders hold their seats and a mantra-holder's power shows. Journeys go well, your words carry, and nothing hinders your work.
reading.YearPebble.LUCK.W2=Two white pebbles on the luck: no one slights you, and in your prime your standing is higher than the sky. A man wins in the assembly and a woman earns a good name. Prayers to the gods are answered, and practice against enemies takes effect.
reading.YearPebble.LUCK.W1=One white pebble on the luck: it is like gold and turquoise strung together. No enemies, robbers or sudden misfortune come, and no gossip or quarrels.
reading.YearPebble.LUCK.B2=Two black pebbles on the luck, the worst it can hold: its merit breaks this year, to be treated in earnest. Those you thought kin or friends turn against you, and enemies come from among those close. A thief rises from the treasury, and locking the outer door helps little.
reading.YearPebble.LUCK.B2.remedy=press down the spirits of enmity and turn enemies back, build bridges and mend paths, honour monks and raise the luck
reading.YearPebble.LUCK.B1=One black pebble on the luck: clothes are worn but fortune is empty. Kin you cared for turn enemies, your service displeases your lord, and the lama's rebuke shrinks your merit. Many people gossip about you.
reading.YearPebble.LUCK.B1.remedy=mend paths and bridges, turn away gossip, press down the spirits of enmity and raise the luck
reading.YearPebble.LUCK.WB=One white and one black pebble on the luck: mixed. White and black play dice on the banner of its merit. Great men are kind, yet the bad rise against you, and a blow may come from your own relatives.
reading.YearPebble.LUCK.WB.remedy=keep away from enemies and recite the protective dhāraṇīs
reading.YearPredictive={0} The predictive pebble counts each sign's place on the aspect once, by its colour, a place of both colours for neither side; it is laid on whichever places are more, white or black, speckled when they are even, and gives the aspect's prediction for the year.
reading.YearPredictive.VITALITY.WHITE=The predictive pebble of the vitality is white: lucky. The tree of life does not break, and no black bird hovers above or black dog bites below. No obstacle to life comes, no spirit takes hold, and there is no face of death or loss.
reading.YearPredictive.BODY.WHITE=The predictive pebble of the body is white: lucky. The tree of the body does not fall, and there is no face of illness or fever. Journeys go well, things are achieved as soon as thought of, and no sudden illness comes.
reading.YearPredictive.DESTINY.WHITE=The predictive pebble of the destiny is white: lucky. Food fills the mouth, wealth the hand and clothes the back. Harvests and herds are good, and even in an empty valley you find your share of food.
reading.YearPredictive.LUCK.WHITE=The predictive pebble of the luck is white: lucky. The net of luck does not fall, merit can be raised, and no enemies or gossip come. No misfortune falls on you, glory stays, and whatever you do succeeds.
reading.YearPredictive.VITALITY.BLACK=The predictive pebble of the vitality is black: unlucky, and the vitality is to be mended this year. Its image is the tree of life breaking and the wheel of life falling apart. Divinations and dreams are bad, and there is a face of the knife.
reading.YearPredictive.VITALITY.BLACK.remedy=save animals that were to die, ransom prisoners and build bridges; ransom the la, the life-spirit (བླ, bla), and summon life; clothe stūpas, mend paths and make the rites that restore a declining vitality
reading.YearPredictive.VITALITY.BLACK.spirits=a bird hovers above, and a black dog bites below
reading.YearPredictive.BODY.BLACK=The predictive pebble of the body is black: unlucky, and the body is to be mended this year. Illness comes and lingers, and evenings and mornings are joyless. One foot is on dry ground and one in the wet, and when you would stay you want to go.
reading.YearPredictive.BODY.BLACK.remedy=invite the Saṅgha to teach, wear your mother's clothes, change your name, keep the fasting vow and make the rites for a declining body
reading.YearPredictive.DESTINY.BLACK=The predictive pebble of the destiny is black: unlucky, and the destiny is to be mended this year. The enclosure of its happiness breaks. Herds and harvests go badly, trade brings losses, thieves come and enemies rise unexpectedly.
reading.YearPredictive.DESTINY.BLACK.remedy=press down the spirits of enmity and beware of quarrels; summon life and prosperity, and make the rites that restore the destiny
reading.YearPredictive.LUCK.BLACK=The predictive pebble of the luck is black: unlucky, and the luck is to be mended this year. The net of its protection falls. Those close turn enemies and neighbours thieves, blame comes without fault, and a load you cannot carry or a debt you did not make falls on you.
reading.YearPredictive.LUCK.BLACK.remedy=make clay votive images (ཚ་ཚ, tsha tsha) and water offerings, one for each year of your age; send effigies of people and beasts towards the enemy; take care in speech and conduct, above all away from home, and make the rites that restore the luck
reading.YearPredictive.LUCK.BLACK.illness=unease in the head and the upper body
reading.YearPredictive.VITALITY.SPECKLED=The predictive pebble of the vitality is speckled, its white and black places even. It reads as one white and one black pebble: mixed, and not yet decided; the good goddesses and the black birds of the demons (བདུད, bdud) play dice for the precious life. Counted for neither side, it is somewhat weak, leaning to the bad.
reading.YearPredictive.VITALITY.SPECKLED.remedy=make rites for your person quickly, and turn aside misfortune and losses
reading.YearPredictive.BODY.SPECKLED=The predictive pebble of the body is speckled, its white and black places even. It reads as one white and one black pebble: mixed; gods and other spirits contend over it as at dice, and fear and fright may come; for a woman, a childbirth she comes through. Counted for neither side, it is somewhat weak, leaning to the bad.
reading.YearPredictive.BODY.SPECKLED.remedy=change your outward form and wear protection
reading.YearPredictive.DESTINY.SPECKLED=The predictive pebble of the destiny is speckled, its white and black places even. It reads as one white and one black pebble: mixed; food and wealth overflow and spill away, and wealth is unsteady like a mirage in the heat. Counted for neither side, it is somewhat weak, leaning to the bad.
reading.YearPredictive.LUCK.SPECKLED=The predictive pebble of the luck is speckled, its white and black places even. It reads as one white and one black pebble: mixed; white and black play dice on the banner of its merit, and a blow may come from your own relatives. Counted for neither side, it is somewhat weak, leaning to the bad.
reading.YearPredictive.LUCK.SPECKLED.remedy=keep away from enemies and recite the protective dhāraṇīs
reading.YearPredictive.ALL_WHITE=All four predictive pebbles are white: its image is crossing the pass of happiness. It is very bad if it comes to the old. For the young it brings losses and grief close by.
reading.YearPredictive.ALL_BLACK=All four predictive pebbles are black: very bad, and the whole year is to be treated in earnest.
reading.YearPredictive.ALL_BLACK.remedy=change your name, practise for long life and receive a long-life empowerment, and give purely, without holding to giver, gift or receiver
# The year of age together (ROADMAP R4, D17): the four classes gathered (WB vol. 1, p. 385) and each obstacle graded by the notes (vol. 2, pp. 492–495).
ObstacleGrade.GRAVE=grave
ObstacleGrade.MILD=mild
ObstacleGrade.GRAVE.HARSH=harsh for you
ObstacleGrade.GRAVE.TOMB=a great danger
ObstacleGrade.MILD.TOMB=a small danger
ObstacleGrade.GRAVE.NINE_TOMB=bad
ObstacleGrade.MILD.NINE_TOMB=mild
ObstacleGrade.GRAVE.UNDERTAKER=bad
reading.YearTogether={0} The obstacles of the year are many, but in brief they come to four, vitality, body, destiny and luck. Above all, the verdicts of these four classes (སྡེ་བཞི, sde bzhi) are gathered.
reading.YearTogether.WHITE=The aspect that matters most for you is white this year: lucky, and the year's other verdicts are read beside it.
reading.YearTogether.BLACK=The aspect that matters most for you is black this year: unlucky, and it is to be mended first.
reading.YearTogether.SPECKLED=The aspect that matters most for you is speckled this year: mixed and leaning to the bad, and it is to be mended first.
reading.YearGrade={0} Each obstacle of the year is weighed by fighting its year against your own vitality, body, destiny and luck, as a pebble is laid. The vitality is taken as the chief.
reading.YearGrade.HARSH.GRAVE=This harsh year meets one or more of your aspects as their enemy, and so for you it is harsh in earnest.
reading.YearGrade.TOMB.GRAVE=The tomb year meets your vitality as itself, your own tomb, or as its enemy, the slayer's tomb: a great danger.
reading.YearGrade.TOMB.MILD=The tomb year meets your vitality as its mother, friend or son: only a small danger.
reading.YearGrade.NINE_TOMB.GRAVE=Your vitality fights the destiny of this nine-multiple's tomb year and meets it as itself or as its enemy: bad.
reading.YearGrade.NINE_TOMB.MILD=Your vitality fights the destiny of this nine-multiple's tomb year and meets it as its mother, friend or son: mild.
reading.YearGrade.UNDERTAKER.GRAVE=The undertaker year meets one or more of your aspects as their enemy: bad, above all for the vitality.
reading.YearSector={0} The element's energy passes through twelve stages, as a life does, from taking breath to the tomb, one for each year animal. Six of the stages are good and six bad.
reading.YearSector.FLOURISHING=The element's energy is in its flourishing stage this year: a great treasure found. The best of the good stages, it lays three white pebbles.
reading.YearSector.WORKING=The element's energy is in its working stage this year: long-lasting. The best of the good stages, it lays three white pebbles.
reading.YearSector.DRESSING=The element's energy is in its dressing stage this year: able to sustain. The middle of the good stages, it lays two white pebbles.
reading.YearSector.BATHING=The element's energy is in its bathing stage this year: wishes fulfilled. The middle of the good stages, it lays two white pebbles.
reading.YearSector.BODY_COMPLETE=The element's energy is in its stage of the body complete this year: endowed with happiness. The least of the good stages, it lays one white pebble.
reading.YearSector.BIRTH=The element's energy is in its birth stage this year: great wealth. The least of the good stages, it lays one white pebble.
reading.YearSector.TAKING_BREATH=The element's energy is in its stage of taking breath this year: fortune is spent. The best of the bad stages, it lays one white and one black pebble.
reading.YearSector.TAKING_BREATH.remedy=send the black woman's nine thread-crosses (མདོས, mdos) or a fulfilment thread-cross
reading.YearSector.TAKING_BREATH.spirits=a great black woman on a black sheep, carrying a black bird and wanting red tormas (གཏོར་མ, gtor ma) and a feast, backs the harm; a black woman with a red torma harms, the spirit of ruin of the mother's kin
reading.YearSector.IN_THE_WOMB=The element's energy is in its stage in the womb this year: falling into misfortune. The best of the bad stages, it lays one white and one black pebble.
reading.YearSector.IN_THE_WOMB.remedy=send the man's secret thread-cross (མདོས, mdos)
reading.YearSector.IN_THE_WOMB.spirits=Dorje Legpa (རྡོ་རྗེ་ལེགས་པ, rdo rje legs pa), on a great ram with a nine-pointed iron vajra, backs the harm; the great kordak (དཀོར་བདག, dkor bdag), on a blue lion, harms the herds
reading.YearSector.DECLINE=The element's energy is in its stage of decline this year: separation. The middle of the bad stages, it lays one black pebble.
reading.YearSector.DECLINE.remedy=above all, make the rite that turns the demons' (བདུད, bdud) face, and press them down under a stūpa
reading.YearSector.DECLINE.spirits=a lustreless black demon (བདུད, bdud), a black man on a black horse with a noose, backs the harm; a black demon holding a rope of gold and turquoise, lord of the obstructing spirits, harms
reading.YearSector.ILLNESS=The element's energy is in its illness stage this year: ruin and disputes. The middle of the bad stages, it lays one black pebble.
reading.YearSector.ILLNESS.remedy=send a gyalpo thread-cross (རྒྱལ་མདོས, rgyal mdos), hurl a fierce torma (གཏོར་མ, gtor ma) and make a burnt offering
reading.YearSector.ILLNESS.spirits=the gyalpo (རྒྱལ་པོ, rgyal po) spirits of the between, a white man on a white horse waving white silk, back the harm; a black man with an iron beard casts a black noose on people and livestock
reading.YearSector.DEATH=The element's energy is in its death stage this year, the eleventh of twelve: prosperity wanes. The worst of the stages, it lays two black pebbles.
reading.YearSector.DEATH.remedy=make offerings to the sky dog (གནམ་ཁྱི, gnam khyi) and do its approach practice (བསྙེན་པ, bsnyen pa)
reading.YearSector.DEATH.spirits=a black son of the demons (བདུད, bdud), in a white mask and leading a red lu-tsen (ཀླུ་བཙན, klu btsan), backs the harm; spirits that leap like tigers, monkeys and vultures dance in the gods' seat
reading.YearSector.ENTERING_THE_TOMB=The element's energy is in its tomb stage this year, the last of twelve: the line is cut, the great penalty. The worst of the stages, it lays two black pebbles.
reading.YearSector.ENTERING_THE_TOMB.remedy=send the thread-cross (མདོས, mdos) of the three mamo (མ་མོ, ma mo), the chief and her attendants; make the nine circles against the harmful spirits of the dead who broke their pledges (དམ་སྲི, dam sri) and the senmo (བསེན་མོ, bsen mo), and hurl a fierce torma (གཏོར་མ, gtor ma)
reading.YearSector.ENTERING_THE_TOMB.spirits=the glorious black Remati (རེ་མ་ཏི, re ma ti), on a three-legged mule with the bag of diseases, backs the harm; black spirit women with matted hair and red eyes harm the children
reading.LogMen={0} The progressed sign (ལོག་མེན, log men) moves one sign a year through the sixty. Its element shows whose matters it touches: wood the father's line, fire the children and the women's line, earth the home and the house, iron wealth, friends and the protecting gods, water the nyen (གཉན, gnyan), the roads and the four borders.
reading.LogMen.SKY_DOOR=On the sky door, a man's dog or a woman's dragon, a plague may come down from the sky. Put no new roof on a house, swear no oaths and take in no new dog. Beware of lightning and the hearth.
reading.LogMen.SKY_DOOR.remedy=close the sky door with its rite, and recite the hundred names of Ākāśagarbha and the Uṣṇīṣa's averting
reading.LogMen.EARTH_DOOR=On the earth door, a man's pig or a woman's snake, spirits of ruin rise and harm comes from low ground. Illnesses of the nāgas (ཀླུ, klu), leprosy, sores and boils spread. Lay no foundations and dig no earth.
reading.LogMen.EARTH_DOOR.remedy=recite the Kṣitigarbha dhāraṇīs, press down the spirits of ruin and close the earth door; let three people of different clans recite the Mahāmāyūrī thirteen times
reading.LogMen.RUIN=On the ruins, the ox and the sheep, disputes come. Take care in trade abroad, and with enemies, thieves and robbers.
reading.LogMen.RUIN.remedy=make clay votive images (ཚ་ཚ, tsha tsha), turn back enemies, recite the Hundred Thousand, honour the wealth gods and the local god, and press down the spirits of loss
reading.LogMen.SEPARATION=On the separations, the bird and the monkey, a married couple may part. Beware of fights, quarrels and strife between spouses, of illness and of prison.
reading.LogMen.SEPARATION.remedy=make the rites against separation, leave your own mill open three days, receive a long-life empowerment and send away a thread-cross (མདོས, mdos)
reading.LogMen.LINEAGE_CUT=On the lineage-cuttings, the mouse and the horse, gossip and misfortune come in the father's line. Give up robbery and ambush, theft, fights, disputes and secret works great and small.
reading.LogMen.LINEAGE_CUT.remedy=recite the Vajra Claw Uṣṇīṣa and the averting rites, beat down gossip, and press down and turn back enemies
reading.LogMen.GAIN=On the gains, the tiger and the hare, the year is very good. Prayers to the gods are answered, the wealth you seek is found, and practice against enemies takes effect.
reading.LogMen.NONE=Its animal is neither a door nor one of the fives for you.
reading.Harsh={0} It is one of the obstacles that fall on the precious human body in a year.
reading.Harsh.OWN_YEAR.SON=Your own animal has risen as the year, in your 13th or 73rd year, its element the son of yours. Illness comes, and enemies rise against your prosperity. The body and the destiny matter most.
reading.Harsh.OWN_YEAR.SON.remedy=recite the Eight Appearances and the five great dhāraṇīs, raise your glory, and turn back and press down enemies
reading.Harsh.OWN_YEAR.FRIEND=Your own animal has risen as the year, in your 25th, its element the friend of yours: the obstacle of reviving breath, well one day and unwell the next. Ruin, disputes and the spirits of misfortune rise. For a man the vitality matters most, for a woman the destiny.
reading.Harsh.OWN_YEAR.FRIEND.remedy=recite the Dhvajāgra, the Vajravidāraṇa and the Sūtra of Amitāyus
reading.Harsh.OWN_YEAR.ENEMY=Your own animal has risen as the year, in your 37th, its element the enemy of yours: the obstacle of the demon's cutting. For the young it brings illness and losses. The destiny matters most.
reading.Harsh.OWN_YEAR.ENEMY.remedy=recite the Prajñāpāramitā and the Dhvajāgra, ransom life with long-life dhāraṇīs, and press down and drive out the spirits of loss
reading.Harsh.OWN_YEAR.MOTHER=Your own animal has risen as the year, in your 49th, its element the mother of yours: glory descends. Trade, friends and income are great, and the luck matters most.
reading.Harsh.OWN_YEAR.IDENTITY=Your own animal has risen as the year, in your 61st, its element your own: the obstacle of separation. Separation, illness and suffering come, and for a man the demon's cutting. The vitality matters most.
reading.Harsh.OWN_YEAR.IDENTITY.remedy=let people of five clans recite the Hundred Thousand; make clay votive images (ཚ་ཚ, tsha tsha) and the rites against separation, avert illness and raise glory
reading.Harsh.SEVENTH.ENEMY=The seventh from your animal has risen as the year, as a horse year does for one born in a mouse year. In your 7th or 67th year it is the slayer that cuts life.
reading.Harsh.SEVENTH.ENEMY.remedy=ransom life with prayers
reading.Harsh.SEVENTH.MOTHER=The seventh from your animal has risen as the year, as a horse year does for one born in a mouse year. In your 19th or 79th year it brings glory, a time when trade and wealth succeed.
reading.Harsh.SEVENTH.IDENTITY=The seventh from your animal has risen as the year, as a horse year does for one born in a mouse year. In your 31st year it brings separation.
reading.Harsh.SEVENTH.IDENTITY.remedy=make the rites against separation
reading.Harsh.SEVENTH.SON=The seventh from your animal has risen as the year, as a horse year does for one born in a mouse year. In your 43rd year it is the enemy of prosperity.
reading.Harsh.SEVENTH.SON.remedy=summon prosperity and raise the destiny
reading.Harsh.SEVENTH.FRIEND=The seventh from your animal has risen as the year, as a horse year does for one born in a mouse year. In your 55th year it is the enemy of reviving breath, a time when good and bad change places.
reading.Harsh.TRIAD=One of the other two animals of your triad has risen as the year, with the same luck as yours: wealth and nourishment are lost, and trouble comes from the mother's side, with gossip, illness and disputes. Do not pull down dark houses and avoid long journeys.
reading.Harsh.TRIAD.remedy=beware of killing and of the pollution of the dead; honour the male god and the war gods, and make the rites that turn back enemies
reading.Harsh.FOURTH_UP=The fourth animal counted up from yours has risen as the year, as the ox does for a dragon. It is one of the four slayers, the one that brings illness.
reading.Harsh.FOURTH_UP.remedy=recite for the sick and make white rites; avert it by ransom and recite the Twenty Thousand
reading.Harsh.FOURTH_DOWN=The fourth animal counted down from yours has risen as the year, as the sheep does for a dragon. It is one of the four slayers, the one that threatens death.
reading.Harsh.FOURTH_DOWN.remedy=ransom life and avert it, and recite the Twenty Thousand
reading.Harsh.LOG_MEN_OWN=The progressed sign has come to your own birth sign: your own body cannot carry you, and a load you cannot bear falls on you.
reading.Harsh.LOG_MEN_SEVENTH=The progressed sign stands on the seventh from your birth sign: it reaches the seat before the life-cutter, and the year is bad.
reading.Harsh.LOG_MEN_ENEMY=The progressed sign's element is the enemy of your vitality: the demon's cutting, and the year is bad.
reading.NineMultiple={0} Every ninth year of age, from the 9th to the 81st, is a nine-multiple (དགུ་མིག, dgu mig). It is worse when its sign is also an enemy, a slayer or a tomb.
reading.NineMultiple.MALE.9=The 9th, the dragon under the fire trigram (ལི, li), is the great disgrace of the young, bad for small children. Its image is the sky's medicine dropping the child from its lap, the gods' playground left empty.
reading.NineMultiple.MALE.18=The 18th, the sheep under the earth trigram (ཁོན, khon), brings a man in his prime knives and stabbing pains. Prosperity declines, its image the bucket leaking at the bottom.
reading.NineMultiple.MALE.27=The 27th, the dog under the lake trigram (དྭ, dwa), carries the destiny off to thieves, with a face of knives and weapons. Its image is the vulture tied to a stone.
reading.NineMultiple.MALE.36=The 36th, the ox under the sky trigram (ཁེན, khen), is the great disgrace of a man in his prime: enemies, and the three things lost. Sudden fright and loss of wealth come, with pollution and a face of knives. Its image is the turquoise bee's wing breaking.
reading.NineMultiple.MALE.45=The 45th, the dragon under the water trigram (ཁམ, kham), raises a fierce illness, with pollution and poison. Its image is the lion fallen into a pit of water.
reading.NineMultiple.MALE.54=The 54th, the sheep under the mountain trigram (གིན, gin), brings illness from the gods, a time of death and loss.
reading.NineMultiple.MALE.63=The 63rd, the dog under the thunder trigram (ཟིན, zin), is the great disgrace of an old man, a time of stabbing pains and blockages. Its image is the sky's load tearing at the narrow place, and the old dog dying.
reading.NineMultiple.MALE.72=The 72nd, the ox under the wind trigram (ཟོན, zon), brings madness and fainting, enemies, threats of war and knives lying in wait.
reading.NineMultiple.MALE.81=The 81st, the dragon under the fire trigram (ལི, li), brings a face of red and blood, and the old fear epidemics. It is a time when what falls from the sky comes down.
reading.NineMultiple.FEMALE.9=The 9th, the ox under the water trigram (ཁམ, kham), brings talk, pollution, illness and epidemics, and danger to mother and child. Its image is the string of the turquoise rosary breaking.
reading.NineMultiple.FEMALE.18=The 18th, the dragon under the sky trigram (ཁེན, khen), is the great disgrace of a young woman: the spring of life dries. A devouring gyalpo (རྒྱལ་པོ, rgyal po) rises, an oath sworn by a woman brings a child's death, and falls from a horse or a cliff, landslides and knives threaten.
reading.NineMultiple.FEMALE.27=The 27th, the sheep under the lake trigram (དྭ, dwa), brings stabbing pains, misfortune, strife and pollution. The women's line breaks, and the child dies.
reading.NineMultiple.FEMALE.36=The 36th, the dog under the earth trigram (ཁོན, khon), brings grief, and sores harm the bearing of children. Its image is the iron she-wolf biting.
reading.NineMultiple.FEMALE.45=The 45th, the ox under the fire trigram (ལི, li), is the great disgrace of a woman in her prime, with knives, landslides and miscarriage. Its image is the old earth-lord woman reaching the narrow place, and the white silk skirt leaking at the hem.
reading.NineMultiple.FEMALE.45.remedy=cut the boundaries (མཚམས་གཅོད, mtshams gcod) when it reaches the narrow place
reading.NineMultiple.FEMALE.54=The 54th, the dragon under the wind trigram (ཟོན, zon), is the great disgrace of an old woman, with epidemics, gossip, miscarriage and illness. Its image is the sun of glory setting.
reading.NineMultiple.FEMALE.63=The 63rd, the sheep under the thunder trigram (ཟིན, zin), brings paralysis, illnesses of hunger and losses. The mistress of the house may die by the knife.
reading.NineMultiple.FEMALE.72=The 72nd, the dog under the mountain trigram (གིན, gin), brings the harm of earth lords (ས་བདག, sa bdag) and curses, and tumours. The son's element falls, and a son born dies.
reading.NineMultiple.FEMALE.81=The 81st, the ox under the water trigram (ཁམ, kham), brings widowhood to your own door.
reading.NineMultiple.remedy=offer lamps, food offerings to the gods, clay votive images (ཚ་ཚ, tsha tsha), the Uṣṇīṣa and water tormas (ཆུ་གཏོར, chu gtor), nine of each; set up an arrow for a man, a spindle for a woman; pile nine stones with nine prostrations, saying "freed from the nine-multiple of illness and death"
reading.MewaObstacle={0} The mewa (སྨེ་བ, sme ba) of your year of age has four small obstacles, and two doors.
reading.MewaObstacle.HOUSE=It falls on the mewa of the present year: the house obstacle. Building and repairs, and raising a gate or a lintel, are bound, and there is a face of illness.
reading.MewaObstacle.HOUSE.remedy=recite the Golden Light and make averting rites
reading.MewaObstacle.BED=It falls on your natal mewa: the bed obstacle, the mewa's own bones gathered in. The harm it brings goes by the colour you were born under.
reading.MewaObstacle.BED.remedy=move where you sleep and where you give birth
reading.MewaObstacle.BED.spirits=born white and falling on white, your own demon (བདུད, bdud) comes down, with quarrels and danger, and for a woman a gyalpo (རྒྱལ་པོ, rgyal po) harms; black on black, the male demons; blue on blue, gods and spirits bring illness; green on green, the nāga (ཀླུ, klu) kings, angered by cut trees and impurity; yellow on yellow, the nyen (གཉན, gnyan) and the earth lords (ས་བདག, sa bdag), stirred by building; red on red, gossip, for a man a face of red and for a woman a miscarriage
reading.MewaObstacle.LAND=It falls on the two-black: the land obstacle, its image the black tent pitched over the head. A wish for a corpse threatens old or young, with sudden illness and fright.
reading.MewaObstacle.LAND.remedy=make the mewa's own rites
reading.MewaObstacle.ROYAL_GATE=It is the enemy of your natal mewa, or the two are fire and iron: the royal gate is blocked, and that direction is to be guarded.
reading.MewaObstacle.ROYAL_GATE.remedy=send a ransom effigy towards it, one for each year of your age
reading.YearTrigram={0} The trigram (སྤར་ཁ, spar kha) of your year of age moves one place a year, a man's from the fire trigram (ལི, li) and a woman's from the water trigram (ཁམ, kham).
reading.YearTrigram.LI=A year under the fire trigram (ལི, li) binds gossip and fights, roofing a house, sending or receiving a bride, polluting the hearth, burning corpses and firing pottery. Buy no red goods, copper or red pottery. The dangerous time is autumn, when the grass turns yellow, and the west and the north-west are to be guarded.
reading.YearTrigram.LI.remedy=recite the Uṣṇīṣa, the Vajravidāraṇa and the Sūtra of Amitāyus, and send a thread-cross (མདོས, mdos)
reading.YearTrigram.LI.spirits=demons (བདུད, bdud), nāgas (ཀླུ, klu), tsen (བཙན, btsan), mamo (མ་མོ, ma mo) and gyalpo (རྒྱལ་པོ, rgyal po), and the ghosts of those killed by knife or horse
reading.YearTrigram.LI.illness=illnesses of the head and the senses, the eyes and the heart, blood fevers and the throat, and for a woman bleeding and miscarriage
reading.YearTrigram.KHON=A year under the earth trigram (ཁོན, khon) binds building walls, laying foundations, opening the earth and raising an outer gate. Keep away from graves and the pollution of the dead, and avoid old cattle and sheep and an old woman's gold and turquoise. The north and the south-east are to be guarded.
reading.YearTrigram.KHON.remedy=recite the Pañcarakṣā, the Kṣitigarbha and the Avataṃsaka, and send a ransom shaped as a sheep to the south-west
reading.YearTrigram.KHON.spirits=earth lords (ས་བདག, sa bdag), mamo (མ་མོ, ma mo), demons (བདུད, bdud), nyen (གཉན, gnyan) and nāgas (ཀླུ, klu)
reading.YearTrigram.KHON.illness=illnesses of the spleen, bile and phlegm, swellings, skin diseases and long inner illnesses
reading.YearTrigram.DWA=A year under the lake trigram (དྭ, dwa) binds sorcery, burnt offerings, war, breaking rock, burning corpses, going to the smithy, marriage, fights and red mountains. Buy no iron goods, weapons or armour, and beware of the smith's tools and of midnight. The east and the south are to be guarded.
reading.YearTrigram.DWA.remedy=recite the Nāmasaṅgīti and long-life dhāraṇīs, make many clay votive images (ཚ་ཚ, tsha tsha), and send a ransom shaped as a bird or a monkey to the west
reading.YearTrigram.DWA.spirits=tsen (བཙན, btsan) and the ghosts of the violently killed, with arrows and knives
reading.YearTrigram.DWA.illness=stabbing pains, illnesses of the lungs, heart and bones, sudden tumours and pains in the left side
reading.YearTrigram.KHEN=A year under the sky trigram (ཁེན, khen) binds burning on mountains, war, dangerous paths, pulling down or roofing a house and funeral rites. Do not trade in dogs or white horses, and do not sleep in temples. The south and the east are to be guarded.
reading.YearTrigram.KHEN.remedy=recite the Golden Light, the Avataṃsaka and the Heart Sūtra, press down the spirits of the tombs, build stūpas and clay votive images (ཚ་ཚ, tsha tsha), and send a ransom shaped as a dog to the north-west
reading.YearTrigram.KHEN.spirits=the gyalpo (རྒྱལ་པོ, rgyal po), curses, spirits of ruin and the spirits of the ancestors' tombs
reading.YearTrigram.KHEN.illness=head injuries, dog bites on the left leg, falls, lightning, lung illness, stiff joints and epidemics
reading.YearTrigram.KHAM=A year under the water trigram (ཁམ, kham) binds digging into the lakes and springs of the nyen (གཉན, gnyan), cutting new channels and crossing great rivers. Avoid polluting water and travelling at night. Wear no black lower garments and eat no fish or pork. The south-west and the north-east are to be guarded.
reading.YearTrigram.KHAM.remedy=recite the Great Cloud Sūtra and the Golden Light, make the nāgas' (ཀླུ, klu) rites, bathe with the Vidāraṇa ablution, and send a ransom shaped as a mouse or a pig to the north
reading.YearTrigram.KHAM.spirits=lake goddesses, nāgas (ཀླུ, klu), and gods offended by impurity
reading.YearTrigram.KHAM.illness=dropsy, kidney illness, cold tumours and diarrhoea
reading.YearTrigram.GIN=A year under the mountain trigram (གིན, gin) binds damaging temples and stūpas, hurling zor (ཟོར, zor), breaking rock, building and works in the earth. Do not trade in pigs, oxen or monks' goods, and beware of oxen at sunrise. The south-east and the north are to be guarded.
reading.YearTrigram.GIN.remedy=recite the Hundred Thousand and the Mahāmāyūrī, give many tormas (གཏོར་མ, gtor ma), make clay votive images (ཚ་ཚ, tsha tsha), one for each year of your age, and send a ransom shaped as an ox to the north-east
reading.YearTrigram.GIN.spirits=earth lords (ས་བདག, sa bdag), nāgas (ཀླུ, klu), sorcery and the spirits of neglected offerings
reading.YearTrigram.GIN.illness=illnesses of the spleen and lymph, leprosy, sores, boils and itching, and pains in the right leg
reading.YearTrigram.ZIN=A year under the thunder trigram (ཟིན, zin) binds cutting the trees or breaking the rocks of the nyen (གཉན, gnyan), bringing out black wood and buying carpenters' tools. Avoid oaths and the crossbow, buy no donkeys and eat no hare, and beware of arrows in the morning. The west and the north-west are to be guarded.
reading.YearTrigram.ZIN.remedy=recite the Gaṇḍavyūha and the confession of downfalls, make the nāgas' (ཀླུ, klu) rites and water tormas (ཆུ་གཏོར, chu gtor), dig ponds and wells, and send a ransom shaped as a tiger or a hare east or west
reading.YearTrigram.ZIN.spirits=nāgas (ཀླུ, klu), hungry spirits, demons (བདུད, bdud) of the suicides and tsen (བཙན, btsan)
reading.YearTrigram.ZIN.illness=stabbing pains, phlegm, liver illness, pains in the right side and sudden illness
reading.YearTrigram.ZON=A year under the wind trigram (ཟོན, zon) binds sending or receiving a bride, oaths, carrying gold and turquoise and raising banners. Beware of contagious illness, and do not buy yak hybrids or mules. The north-east and the south-west are to be guarded.
reading.YearTrigram.ZON.remedy=recite the Uṣṇīṣa and the dhāraṇīs that avert epidemics, send thread-crosses (མདོས, mdos) and water offerings, give a feast for children, and send a ransom shaped as a dragon to the south-east
reading.YearTrigram.ZON.spirits=mamo (མ་མོ, ma mo), spirits of madness and the gyalpo (རྒྱལ་པོ, rgyal po)
reading.YearTrigram.ZON.illness=epidemics, trembling of heart and breath, disorders of the channels and winds, dizziness, madness and fainting
reading.YearMewa={0} Your mewa (སྨེ་བ, sme ba) of the year moves out from your natal one, one place a year, and where it falls is read by the mewa you were born under.
reading.YearMewa.N2.C3=Born under the two-black, falling on the three-blue: livestock is lost, and losses bring fright. Ghosts of beasts killed by the knife harm, and there is danger of being struck by stones.
reading.YearMewa.N2.C3.remedy=avoid quarrels and fights, and recite the Dhvajāgra and the long-life dhāraṇīs
reading.YearMewa.N2.C4=Born under the two-black, falling on the four-green: nāgas (ཀླུ, klu) and demons (བདུད, bdud) together harm from a stream or a valley.
reading.YearMewa.N2.C4.remedy=make the confession and fulfilment rites; in illness, offerings of medicine and the nāgas' (ཀླུ, klu) thread-cross (མདོས, mdos)
reading.YearMewa.N2.C5=Born under the two-black, falling on the five-yellow: yellow fluid, stomach and liver illnesses of cold come, an old illness returns, and grief comes. In illness a spirit of a painted image or a hermitage harms.
reading.YearMewa.N2.C5.remedy=recite the long-life sūtras, make a vase ablution and a long-life ransom, and do not fight with monks
reading.YearMewa.N2.C7=Born under the two-black, falling on the seven-red: beasts of prey, the strike of weapons, wounds and blood. The harmful spirits of the dead who broke their pledges (དམ་སྲི, dam sri) harm, and enemies and thieves lie in wait.
reading.YearMewa.N2.C7.remedy=make the confession and fulfilment rites; moxa helps, and bloodletting harms
reading.YearMewa.N2.C7.illness=unease in the upper body, with vomiting
reading.YearMewa.N2.C6=Born under the two-black, falling on the six-white: it does not fall on the life, and small gains grow. In illness, defilement comes from the north-east.
reading.YearMewa.N2.C6.remedy=confession and purification
reading.YearMewa.N2.C18=Born under the two-black, falling on the one-white or the eight-white: it does not fall on the life. Quarrels come at home, or danger from red, and each mewa's own spirit harms.
reading.YearMewa.N2.C18.remedy=send a nāga (ཀླུ, klu) thread-cross (མདོས, mdos) and a golden thread-cross
reading.YearMewa.N2.C9=Born under the two-black, falling on the nine-red: for a man fights and enemies, for a woman childbirth, for both a face of red. In illness the protectors harm.
reading.YearMewa.N2.C9.remedy=above all, the confession and fulfilment rites
reading.YearMewa.N3.C2=Born under the three-blue, falling on the two-black: demons (བདུད, bdud) and hearth spirits harm together, with madness and fainting. An illness brings fright but not death, and earth spirits of old ruins cause pains in the upper body.
reading.YearMewa.N3.C2.remedy=make rites against the demons (བདུད, bdud)
reading.YearMewa.N3.C4=Born under the three-blue, falling on the four-green: suffering comes to a man, and an illness is long, from the mother's side. Avoid red people and horses from the north-east.
reading.YearMewa.N3.C4.remedy=make the nāgas' (ཀླུ, klu) rites and keep away from slaughter
reading.YearMewa.N3.C4.illness=bleeding from the nose and the mouth
reading.YearMewa.N3.C5=Born under the three-blue, falling on the five-yellow: bile and wind rise, and grief comes among the men of your kin. Harm comes from the south and the east: eat no food from those who come from there.
reading.YearMewa.N3.C7=Born under the three-blue, falling on the seven-red: sorcery from the south or the east harms. In illness, the ghosts of the north-east harm.
reading.YearMewa.N3.C7.remedy=turn back enemies, and press down the harmful spirits of the dead (སྲི, sri)
reading.YearMewa.N3.C68=Born under the three-blue, falling on the six-white or the eight-white: a spirit from a tree in the south-west harms, with fever above and diarrhoea below.
reading.YearMewa.N3.C68.remedy=make rites for the gods and offer lamps
reading.YearMewa.N3.C19=Born under the three-blue, falling on the one-white or the nine-red: a spirit joined with the harmful spirits of the dead (སྲི, sri) harms from beyond two rivers, and those who died by water or the knife rise. An illness passes in nine days.
reading.YearMewa.N3.C19.remedy=give a ransom (གླུད, glud) to the water and press down its spirits
reading.YearMewa.N4.C2=Born under the four-green, falling on the two-black: harm comes from a black rock and from the east, with illnesses and deaths caused by the nāgas (ཀླུ, klu).
reading.YearMewa.N4.C2.remedy=the rites of fulfilment and averting
reading.YearMewa.N4.C3=Born under the four-green, falling on the three-blue: stabbing pains and stiff joints, and trembling of the upper body. Life is hard, though one does not die.
reading.YearMewa.N4.C3.remedy=make offerings to the gods and remedy the harm of the water spirits
reading.YearMewa.N4.C4=Born under the four-green, falling on the four-green: the hearth is polluted in the north-east, or the earth of the nyen (གཉན, gnyan) has been dug. No death comes, but nāga (ཀླུ, klu) spirits harm and the gods are displeased.
reading.YearMewa.N4.C4.remedy=purify, and recite the Dhvajāgra
reading.YearMewa.N4.C5=Born under the four-green, falling on the five-yellow: tumours and fevers rise, an illness from the hearth or from dug earth. One recovers in twelve days.
reading.YearMewa.N4.C5.remedy=recite the Dhvajāgra and the Vajra Mouth
reading.YearMewa.N4.C7=Born under the four-green, falling on the seven-red: from the south the spirits of forefathers killed by the knife harm, and for a woman a spirit of the dead in childbirth.
reading.YearMewa.N4.C18=Born under the four-green, falling on the one-white or the eight-white: enemies rise, with illnesses of the sinews and bones. Nāgas (ཀླུ, klu) and the gyalpo (རྒྱལ་པོ, rgyal po) harm.
reading.YearMewa.N4.C18.remedy=give a ransom of grain and make the confession and fulfilment rites
reading.YearMewa.N4.C69=Born under the four-green, falling on the six-white or the nine-red: it does not fall on the life. In illness, a sour or bitter spirit harms.
reading.YearMewa.N4.C69.remedy=purification, ablution and the fulfilment rites
reading.YearMewa.N5.C2=Born under the five-yellow, falling on the two-black: a rock spirit, or the ghosts of the mother's brothers, harm. They come from the north with a black horse and black clothes, bringing food.
reading.YearMewa.N5.C2.remedy=send a ransom of dough to the north
reading.YearMewa.N5.C3=Born under the five-yellow, falling on the three-blue: stomach pains, madness and fainting, and for women blue sorcery comes.
reading.YearMewa.N5.C3.remedy=recite the Mahāmāyūrī and make a vase ablution
reading.YearMewa.N5.C4=Born under the five-yellow, falling on the four-green: earth lords (ས་བདག, sa bdag) and nāgas (ཀླུ, klu) bring illness.
reading.YearMewa.N5.C4.remedy=press down the earth lords (ས་བདག, sa bdag) and undo the nāgas' (ཀླུ, klu) sorcery
reading.YearMewa.N5.C5=Born under the five-yellow, falling on the five-yellow: epidemics and blame. In illness a spirit of a ruined valley harms, and an old widowed woman of the south-west.
reading.YearMewa.N5.C5.remedy=let a tantric priest avert it with tormas (གཏོར་མ, gtor ma)
reading.YearMewa.N5.C7=Born under the five-yellow, falling on the seven-red: thieves and enemies lie in wait. In illness, the demons (བདུད, bdud) of lords harm.
reading.YearMewa.N5.C7.remedy=turn enemies back in the north-east at midnight
reading.YearMewa.N5.C1689=Born under the five-yellow, falling on one of the three whites or the nine-red: beware of impurity and defilement.
reading.YearMewa.N5.C1689.remedy=honour the gods and call prosperity at its times
reading.YearMewa.N7.C2=Born under the seven-red, falling on the two-black: examine it with care. In illness the nyen (གཉན, gnyan) bring a face of red, and there is danger of killing.
reading.YearMewa.N7.C3=Born under the seven-red, falling on the three-blue: fright and sudden misfortune, and danger of being killed through a horse. The lords of offered wealth harm.
reading.YearMewa.N7.C3.remedy=cut their claims
reading.YearMewa.N7.C4=Born under the seven-red, falling on the four-green: cold illnesses of the stomach and stiff joints. A spirit of madness of the neighbours harms, and with the rites one is free in twenty-one days.
reading.YearMewa.N7.C5=Born under the seven-red, falling on the five-yellow: the limbs, paralysis and yellow fluid. A spirit attached to dried wealth harms.
reading.YearMewa.N7.C5.remedy=ablution and averting rites
reading.YearMewa.N7.C7=Born under the seven-red, falling on the seven-red: a tsen (བཙན, btsan) ghost harms from a red rock mountain. In illness it comes from the south, where one was killed by the knife, with a face of blood and of separation.
reading.YearMewa.N7.C1689=Born under the seven-red, falling on one of the three whites or the nine-red: wealth is spent and grows again. Beware of impurity, and an illness is easy to survive.
reading.YearMewa.N7.C1689.remedy=make offerings to the nāgas (ཀླུ, klu)
reading.YearMewa.NW.C2=Born under one of the three whites, falling on the two-black: you meet a black man leading a black dog from the south-east. An illness does not kill, but take care for eighteen days.
reading.YearMewa.NW.C2.remedy=make the rites of the gyalpo (རྒྱལ་པོ, rgyal po)
reading.YearMewa.NW.C3=Born under one of the three whites, falling on the three-blue: the nyen (གཉན, gnyan) and the gyalpo (རྒྱལ་པོ, rgyal po) of the south-west harm, and danger rises from red in the south-west.
reading.YearMewa.NW.C3.remedy=remedy the nāgas (ཀླུ, klu), the nyen (གཉན, gnyan) and the gyalpo (རྒྱལ་པོ, rgyal po)
reading.YearMewa.NW.C4=Born under one of the three whites, falling on the four-green: lung illness comes from within. The gyalpo (རྒྱལ་པོ, rgyal po), the war gods and sorcery harm.
reading.YearMewa.NW.C4.remedy=undo the sorcery and give up feuds
reading.YearMewa.NW.C5=Born under one of the three whites, falling on the five-yellow: pox and joint pains, from a harmful spirit of the east.
reading.YearMewa.NW.C5.remedy=a thread-cross (མདོས, mdos) to the mamo (མ་མོ, ma mo) saves within three days
reading.YearMewa.NW.C7=Born under one of the three whites, falling on the seven-red: a red hearth. Ghosts of hunted game harm, and one recovers in nine or ten days.
reading.YearMewa.NW.C7.remedy=avoid pottery, burnt offerings and the smithy
reading.YearMewa.NW.C168=Born under one of the three whites, falling on one of the three whites: good. In illness, an old woman of the near kin in grey clothes harms, and food brings it on.
reading.YearMewa.NW.C9=Born under one of the three whites, falling on the nine-red: food and wealth are met with. Avoid impurity and defilement.
reading.YearMewa.NW.C9.remedy=in illness, make the fulfilment thread-cross (མདོས, mdos) of the mamo (མ་མོ, ma mo)
reading.YearMewa.N9.C2=Born under the nine-red, falling on the two-black: bad omens are met, and epidemics and the harmful spirits of the dead (སྲི, sri) rise.
reading.YearMewa.N9.C2.remedy=avert them, and remedy the harm of fire, knives and the lords of offered wealth
reading.YearMewa.N9.C3=Born under the nine-red, falling on the three-blue: thrown by a horse, an enemy's arrow strikes, and losses come.
reading.YearMewa.N9.C3.remedy=draw a thread and call prosperity
reading.YearMewa.N9.C4=Born under the nine-red, falling on the four-green: illnesses of the lungs, phlegm and bile come from quarrels.
reading.YearMewa.N9.C4.remedy=above all, undo sorcery
reading.YearMewa.N9.C5=Born under the nine-red, falling on the five-yellow: long illness, pox, sores and itching, and corpse pollution strikes.
reading.YearMewa.N9.C5.remedy=purify and bathe
reading.YearMewa.N9.C7=Born under the nine-red, falling on the seven-red: the protectors stir. In illness there is a face of blood, and ghosts of the violently killed harm.
reading.YearMewa.N9.C7.remedy=send a ransom (གླུད, glud) to the south-west, and remedy the ghosts
reading.YearMewa.N9.C168=Born under the nine-red, falling on one of the three whites: wishes are fulfilled, and it goes well abroad. One recovers from an illness in nine or thirteen days.
reading.YearMewa.N9.C168.remedy=in illness, the confession and fulfilment rites
reading.YearMewa.N9.C9=Born under the nine-red, falling on the nine-red: a face of the hearth, and yet wishes are achieved.
