reading.LunarDate.14.birth=a boy is bad for his mother; girls follow
reading.LunarDate.15=The 15th of the month is a full day (རྫོགས་པ, rdzogs pa), not a virtuous one: in general work goes badly, but building a fort and hiding treasure go well. It is a perilous day, when the māra king Garap Wangchuk (དགའ་རབ་དབང་ཕྱུག, dga' rab dbang phyug) leads his hosts against the gods. Falling ill on it is dangerous, and great gatherings and anything grand or forceful go badly.
