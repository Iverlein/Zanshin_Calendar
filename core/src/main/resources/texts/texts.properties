# Readings: ROKUYO
reading.Rokuyo={0} The six days (六曜) in their present form are first found in an almanac of 1747. Through the Edo period they were one annotation among many; they rose to weight after 1873, when the Meiji government struck the luck annotations from the almanac and the 六曜 stayed beside it.
reading.Rokuyo.SENSHO=Act early: the morning is lucky, the afternoon unlucky. Taken as good for urgent business and lawsuits.
reading.Rokuyo.TOMOBIKI=A draw: neither side wins. Good for celebrations; lucky in the morning and evening, unlucky at noon. Funerals are customarily avoided, a folk belief from the similar-sounding 友曳.
reading.Rokuyo.SENBU=Wait quietly and avoid haste: the morning is unlucky, the afternoon lucky. Disputes and urgent matters are best avoided.
reading.Rokuyo.BUTSUMETSU=Nothing comes to fruition; the worst of the six, and weddings are avoided. Despite the name it has nothing to do with Buddhism: the old name meant "empty".
reading.Rokuyo.TAIAN=Great peace: success in everything — travel, moving house, marriage, opening a shop.
reading.Rokuyo.SHAKKO=Unlucky for celebrations; only the hour of the Horse, about 11:00–13:00, is lucky. Take care with fire and blades.

# Readings: CHOKU
reading.Choku.TATSU=Very lucky, good for everything.
reading.Choku.NOZOKU=A day to ward off what is bad.
reading.Choku.MITSU=A full day.
reading.Choku.TAIRA=Good and bad are level; very good for talks.
reading.Choku.SADAN=A day for settling things.
reading.Choku.TORU=A day for taking things in.
reading.Choku.YABURU=A breaking day.
reading.Choku.AYAUSHI=A precarious day.
reading.Choku.NARU=A day of completion.
reading.Choku.OSAN=A day of gathering in; no obstacle to ordinary affairs.
reading.Choku.HIRAKU=An opening day: what you begin finds its way.
reading.Choku.TOZU=A closing day, bad for most things.

# Readings: SHUKU
reading.Shuku.BO=Very lucky.
reading.Shuku.KI=Funerals and interments bring great misfortune.
reading.Shuku.TO=Wells and storehouses built today fill with treasure.
reading.Shuku.GYU=Good for everything.
reading.Shuku.JO=A bad day.
reading.Shuku.KYO=Misfortune follows at once.
reading.Shuku.KIH=A very bad day: these bring poverty.
reading.Shuku.RO=Very good for weddings.
reading.Shuku.I=Funerals are especially to be avoided.
reading.Shuku.SHI=A bad day: a wedding scatters wealth and brings illness. Be restrained.
reading.Shuku.SEI=A calm, lucky day.
reading.Shuku.KI2=A very lucky day, good for everything.
reading.Shuku.RYU=A funeral brings seven misfortunes.
reading.Shuku.SEI2=A very bad day for these.
reading.Shuku.CHO=These lay the foundation of the family's prosperity.
reading.Shuku.YOKU=A bad day.

# Readings: SENJITSU
reading.Senjitsu.TENSHA=The hundred gods rise to heaven and heaven forgives all wrongs: the best day of the year, noted as "good for all". Five or six times a year.
reading.Senjitsu.ICHIRYU_MANBAI=A single grain grows into ten thousand: taken as good for beginnings. A Japanese selection without a classical Chinese source; its credibility is low.
reading.Senjitsu.DAIMYO=Heaven and earth open and the sun reaches every corner: very good for all good deeds.
reading.Senjitsu.TENON=A day of heaven's grace: very good for happy occasions, not to be used for sad ones.
reading.Senjitsu.BOSO=Heaven cherishes people as a mother her child: good for everything, marriage especially.
reading.Senjitsu.SETTOKU=Good for work that touches the earth, such as extending or rebuilding a house.
reading.Senjitsu.KISHUKU=The day of the lodge 鬼, which the almanac counts very lucky.
reading.Senjitsu.TORA=The Tiger day of the twelve-day cycle. A tiger goes a thousand ri and comes back a thousand ri, so weddings were avoided. The festival day of Bishamonten.
reading.Senjitsu.MI=The Snake day of the twelve-day cycle.
reading.Senjitsu.TSUCHINOTO_MI=The festival day of Benzaiten, once every sixty days.
reading.Senjitsu.KINOE_NE=The first of the sixty days and the festival day of Daikokuten. On 甲子待 people stayed up until the hour of the Rat and offered soybeans, black beans and forked radish for worldly fortune.
reading.Senjitsu.TENICHI_TENJO=For these sixteen days the direction god Ten'ichi-jin is back in heaven, so no direction is blocked and any journey is fine. Nichiyū-jin stays in the house instead: keep it clean.
reading.Senjitsu.JUSHI=The black day, the worst of all: no other annotation need be read, and the lower band of the almanac printed nothing else on it. An illness begun today is said to be fatal. Funerals alone are not affected.
reading.Senjitsu.JISSHI=Next after the black day: bad for everything, funerals included. Like the black day, it stood alone in the lower band of the almanac.
reading.Senjitsu.KIKO=The spirit of the star Tianbang stands at the door and keeps people from coming home.
reading.Senjitsu.CHIIMI=Seeing blood is unlucky.
reading.Senjitsu.TENKA=Heaven's fire is fierce: raising a roof today is said to bring fire.
reading.Senjitsu.JIKA=The earth's fire is fierce.
reading.Senjitsu.OMO="Go and perish": once the day armies did not march.
reading.Senjitsu.FUJOJU=Nothing is accomplished: starting anything is unlucky.
reading.Senjitsu.SANRINBO=Building today is said to ruin three neighbours. Some almanacs add that climbing high brings injury.
reading.Senjitsu.JIPPOGURE=Ten days when the energies of heaven and earth clash and nothing goes well: much toil, little result.
reading.Senjitsu.HASSEN=Twelve days in which eight have stem and branch of the same element: good grows better and bad grows worse, and later almanacs stressed only the bad.
reading.Senjitsu.HASSEN_MABI=One of the four days within 八専 whose stem and branch do not share an element: free of its influence.
reading.Senjitsu.OTSUCHI=The earth god Dokujin is in the ground: do not disturb the soil.
reading.Senjitsu.KOTSUCHI=The earth god Dokujin is in the ground: do not disturb the soil.
reading.Senjitsu.TSUCHI_MABI=The day between the great and lesser earth taboos, without their restrictions.
reading.Senjitsu.SAIGEJIKI=The star spirit Tenkō comes down to eat; what people eat loses its strength. A light bad day: when another annotation names the day good it need not be kept, but with another bad day it weighs more. A guide of 1901 puts it so: it does no harm on a day whose stem and branch feed one another and which falls on no other bad day.
reading.Senjitsu.JUNICHI=What is done today happens again: good for good things, bad for bad ones. Weddings are avoided, as they would repeat.
reading.Senjitsu.FUKUNICHI=Good deeds today are doubled and so are bad ones. Weddings are avoided, as they would repeat.
reading.Senjitsu.KANOE_SARU=Kōshin night: the three worms in the body rise to heaven while one sleeps and report one's misdeeds, so people stayed awake together (庚申待).
reading.Senjitsu.TAIKA=The worst of the three bad days for your birth year. The classical rule gives the three bad days by the solar month, each to the person born in a year of that month's branch, as the app shows them; later almanacs mostly treat them as bad for everyone.
reading.Senjitsu.ROSHAKU=One of the three bad days for your birth year: everything is said to fail. The classical rule gives the three bad days by the solar month, each to the person born in a year of that month's branch, as the app shows them; later almanacs mostly treat them as bad for everyone.
reading.Senjitsu.METSUMON=One of the three bad days for your birth year: said to ruin a whole house. The classical rule gives the three bad days by the solar month, each to the person born in a year of that month's branch, as the app shows them; later almanacs mostly treat them as bad for everyone.

# Readings: ZASSETSU
reading.Zassetsu.SETSUBUN=The day before 立春. Once the eve of every season, now only of spring; the bean-throwing comes from the Chinese exorcism 追儺.
reading.Zassetsu.HIGAN_IRI=First day of the seven days centred on the equinox.
reading.Zassetsu.HIGAN=Within the seven days centred on the equinox.
reading.Zassetsu.HIGAN_AKE=Last day of higan.
reading.Zassetsu.SHANICHI=The 戊 day nearest the equinox, dedicated to the earth deity. Dropped from the official ephemeris after the war.
reading.Zassetsu.HACHIJUHACHIYA=The 88th day from 立春: the end of the frost season — beware the late frost.
reading.Zassetsu.NYUBAI=The sun at longitude 80°: the calendar start of the rainy season.
reading.Zassetsu.HANGESHO=The sun at longitude 100°.
reading.Zassetsu.DOYO_IRI=Start of the eighteen or so days before a season begins, which five-element theory gives to earth.
reading.Zassetsu.DOYO=Within the earth season before a new season begins.
reading.Zassetsu.DOYO_USHI=An Ox day within doyō.
reading.Zassetsu.NIHYAKUTOKA=The 210th day from 立春, when rice is in flower and typhoons approach.
reading.Zassetsu.NIHYAKUHATSUKA=The 220th day from 立春, still in the typhoon season.

# Readings: the 24 solar terms (ROADMAP K6, block 56; docs/sources/kyureki.md, K6-R): what each marks,
# glossed after the こよみ便覧 (1787) and the NAOJ, the solar month a 節 opens or the lunar month a 中
# names, and what hangs on it; in the shape of SPEC §8.1, every one with its month's name as Also called
reading.SolarTerm.RISSHUN=The start of spring and of the 1st solar month, 寅月: spring's qi rises, though the cold has only just passed its peak. From this day the year's 干支, the year star and the 恵方 change, and 節分 is the day before.
reading.SolarTerm.RISSHUN.also_called=正月節, the 節 of the 1st month
reading.SolarTerm.USUI=The yang qi comes out above the ground: snow and ice melt into water, and snow turns to rain. The lunar month that holds 雨水 is the 1st, the month of 旧正月.
reading.SolarTerm.USUI.also_called=正月中, the 中 of the 1st month
reading.SolarTerm.KEICHITSU=The start of the 2nd solar month, 卯月: the yang qi stirs in the earth. Insects that wintered curled up underground open their holes and come out.
reading.SolarTerm.KEICHITSU.also_called=二月節, the 節 of the 2nd month
reading.SolarTerm.SHUNBUN=The spring equinox: the Sun rises due east and sets due west, and day and night are about equal. It is the middle day of the spring 彼岸, and the spring 社日 is the 戊 day nearest it. The lunar month that holds it is the 2nd.
reading.SolarTerm.SHUNBUN.also_called=二月中, the 中 of the 2nd month
reading.SolarTerm.SEIMEI=The start of the 3rd solar month, 辰月: all things come forth pure and bright, so that each bud shows which plant it is. The name means pure and bright.
reading.SolarTerm.SEIMEI.also_called=三月節, the 節 of the 3rd month
reading.SolarTerm.KOKUU=Spring rain falls and brings the hundred grains to life. The spring 土用 begins about three days before it and runs to the day before 立夏, and 八十八夜 falls within its span. The lunar month that holds it is the 3rd.
reading.SolarTerm.KOKUU.also_called=三月中, the 中 of the 3rd month
reading.SolarTerm.RIKKA=The start of summer and of the 4th solar month, 巳月: summer rises, and it runs to the day before 立秋. The spring 土用 ends the day before.
reading.SolarTerm.RIKKA.also_called=四月節, the 節 of the 4th month
reading.SolarTerm.SHOMAN=All things grow and begin to fill heaven and earth, and plants grow thick in branch and leaf. They are filled a little, hence the name. The lunar month that holds it is the 4th.
reading.SolarTerm.SHOMAN.also_called=四月中, the 中 of the 4th month
reading.SolarTerm.BOSHU=The start of the 5th solar month, 午月: the time to sow the awned grains, such as rice. 入梅, the calendar start of the rainy season, falls within its span.
reading.SolarTerm.BOSHU.also_called=五月節, the 節 of the 5th month
reading.SolarTerm.GESHI=The summer solstice: the yang heat reaches its peak, and the day is the longest of the year. From the 甲子 day nearest it the day stars count downwards. 半夏生 falls within its span, and the lunar month that holds it is the 5th.
reading.SolarTerm.GESHI.also_called=五月中, the 中 of the 5th month
reading.SolarTerm.SHOSHO=The start of the 6th solar month, 未月: the heat sets in, before the great heat, and the rainy season ends about now. Summer greetings are sent from here to the day before 立秋.
reading.SolarTerm.SHOSHO.also_called=六月節, the 節 of the 6th month
reading.SolarTerm.TAISHO=The summer heat is at its height. The summer 土用 begins about three days before it and runs to the day before 立秋, and its ox days are the 土用の丑の日. The lunar month that holds it is the 6th.
reading.SolarTerm.TAISHO.also_called=六月中, the 中 of the 6th month
reading.SolarTerm.RISSHU=The start of autumn and of the 7th solar month, 申月: autumn's qi rises for the first time. It falls in the hottest weeks, but from here the heat only wanes. The summer 土用 ends the day before.
reading.SolarTerm.RISSHU.also_called=七月節, the 節 of the 7th month
reading.SolarTerm.SHOSHO_HEAT=The yang qi stops and begins to withdraw, and the heat abates. 二百十日, a day of storms, falls within its span. The lunar month that holds it is the 7th, the month of 七夕.
reading.SolarTerm.SHOSHO_HEAT.also_called=七月中, the 中 of the 7th month
reading.SolarTerm.HAKURO=The start of the 8th solar month, 酉月: the yin qi gathers, and dew settles white on the grass. 二百二十日, still in the season of storms, falls within its span.
reading.SolarTerm.HAKURO.also_called=八月節, the 節 of the 8th month
reading.SolarTerm.SHUBUN=The autumn equinox: yin and yang are halved, and day and night are about equal. It is the middle day of the autumn 彼岸, and the autumn 社日 is the 戊 day nearest it. The lunar month that holds it is the 8th, the month of 十五夜.
reading.SolarTerm.SHUBUN.also_called=八月中, the 中 of the 8th month
reading.SolarTerm.KANRO=The start of the 9th solar month, 戌月: autumn deepens. Meeting the cold yin qi, dew forms on the wild grasses and is about to freeze.
reading.SolarTerm.KANRO.also_called=九月節, the 節 of the 9th month
reading.SolarTerm.SOKO=Dew, bound by the yin qi, becomes frost and falls. The autumn 土用 begins about three days before it and runs to the day before 立冬. The lunar month that holds it is the 9th, the month of 重陽 and 十三夜.
reading.SolarTerm.SOKO.also_called=九月中, the 中 of the 9th month
reading.SolarTerm.RITTO=The start of winter and of the 10th solar month, 亥月: winter's qi begins to rise, and it grows ever colder. Winter runs to the day before 立春, and the autumn 土用 ends the day before.
reading.SolarTerm.RITTO.also_called=十月節, the 節 of the 10th month
reading.SolarTerm.SHOSETSU=It grows cold, so that rain too falls as snow, but in this month the snow is still little. The lunar month that holds it is the 10th.
reading.SolarTerm.SHOSETSU.also_called=十月中, the 中 of the 10th month
reading.SolarTerm.TAISETSU=The start of the 11th solar month, 子月: snow now falls on snow and piles up. It is the counterpart of 小雪, the lesser snow.
reading.SolarTerm.TAISETSU.also_called=十一月節, the 節 of the 11th month
reading.SolarTerm.TOJI=The winter solstice: the Sun goes at its southern limit, and the day is the shortest of the year. From the 甲子 day nearest it the day stars count upwards. The lunar month that holds it is the 11th.
reading.SolarTerm.TOJI.also_called=十一月中, the 中 of the 11th month
reading.SolarTerm.SHOKAN=The start of the 12th solar month, 丑月, and the entry into the cold. One yang has risen since 冬至 and goes against the yin qi, so it grows colder still. The cold season runs from here to 節分.
reading.SolarTerm.SHOKAN.also_called=十二月節, the 節 of the 12th month
reading.SolarTerm.DAIKAN=The cold is at its extreme, and after it the weather begins to warm. The winter 土用 begins about three days before it and runs to 節分, the day before 立春. The lunar month that holds it is the 12th.
reading.SolarTerm.DAIKAN.also_called=十二月中, the 中 of the 12th month

# Readings: ELEMENT_PAIR
reading.ElementPair={0} The pair makes every work good or bad: even when the weekday and the mansion are each good, a bad pair gives its own result, and a good pair gives its own where they are bad.
reading.ElementPair.EARTH_EARTH=Earth meets earth: attainment (དངོས་གྲུབ, dngos grub), with which whatever is wished for succeeds.
reading.ElementPair.EARTH_EARTH.rank=one of the three good
reading.ElementPair.WATER_WATER=Water meets water: nectar (བདུད་རྩི, bdud rtsi), which increases life and strength.
reading.ElementPair.WATER_WATER.rank=one of the three good
reading.ElementPair.EARTH_WATER=Earth meets water: youth (ལང་ཚོ, lang tsho), which brings great happiness.
reading.ElementPair.EARTH_WATER.rank=one of the three good
reading.ElementPair.FIRE_FIRE=Fire meets fire: growth (འཕེལ་འགྱུར, 'phel 'gyur), which brings food and clothes.
reading.ElementPair.FIRE_FIRE.rank=one of the three that sustain (གསོ་ཐུབ, gso thub), after the three good
reading.ElementPair.WIND_WIND=Wind meets wind: perfection (ཕུན་ཚོགས, phun tshogs), with which wishes are quickly accomplished. Anything to be done quickly goes well.
reading.ElementPair.WIND_WIND.rank=one of the three that sustain (གསོ་ཐུབ, gso thub), after the three good
reading.ElementPair.FIRE_WIND=Fire meets wind: strength (སྟོབས་ལྡན, stobs ldan), which brings good omens.
reading.ElementPair.FIRE_WIND.rank=one of the three that sustain (གསོ་ཐུབ, gso thub), after the three good
reading.ElementPair.EARTH_WIND=Earth meets wind: incompatibility (མི་འཕྲོད, mi 'phrod), which exhausts food and wealth. Robbery and grief come, and aims are not achieved.
reading.ElementPair.EARTH_WIND.rank=one of the three bad
reading.ElementPair.WATER_WIND=Water meets wind: discord (མི་མཐུན, mi mthun), which parts relatives and friends. It serves to sow dissension and to drive enemies out.
reading.ElementPair.WATER_WIND.rank=one of the three bad
reading.ElementPair.EARTH_FIRE=Earth meets fire: burning (སྲེག་པ, sreg pa), which creates suffering. Work that makes others suffer goes well on it.
reading.ElementPair.EARTH_FIRE.rank=one of the three bad
reading.ElementPair.FIRE_WATER=Fire meets water: death (འཆི་བ, 'chi ba), which robs life away.
reading.ElementPair.FIRE_WATER.rank=the worst (ཐ་ཆད, tha chad) of the ten

# Readings: SPECIAL_DAY
reading.SpecialDay.EIGHTH=The 8th of the month is a special day for any wholesome action, as are the full moon, the new moon and the days of an eclipse. Lay practitioners are recommended to take the eight precepts on it.
reading.SpecialDay.TENTH=Guru Rinpoche (གུ་རུ་རིན་པོ་ཆེ, gu ru rin po che) promised to come to Tibet on every tenth day, so each tenth day is a festival of his enlightened activity. It is kept with feast offerings (ཚོགས, tshogs) and guru pūjā.
reading.SpecialDay.FULL_MOON=The full moon is a special day for any wholesome action, and lay practitioners are recommended to take the eight precepts on it. It is a Sojong (གསོ་སྦྱོང, gso sbyong) day, when monastic communities confess.
reading.SpecialDay.TWENTY_FIFTH=The 25th of the month, like the 10th, is a day for the feast offerings (ཚོགས, tshogs) of tantra. Guru pūjā is especially recommended on it.
reading.SpecialDay.NEW_MOON=The new moon is a special day for any wholesome action, and lay practitioners are recommended to take the eight precepts on it. It is a Sojong (གསོ་སྦྱོང, gso sbyong) day, when monastic communities confess.

# Readings: TIBETAN_FESTIVAL
reading.TibetanFestival={0} It is one of the great occasions (དུས་ཆེན, dus chen) the almanac writes at the head of its month.
reading.TibetanFestival.LOSAR=Losar (ལོ་གསར, lo gsar), the first day of the Tibetan year, is celebrated in every joyous way. The first fifteen days are the days of the Buddha's miracles.
reading.TibetanFestival.CHOTRUL_DUCHEN=Chötrul Düchen (ཆོ་འཕྲུལ་དུས་ཆེན, cho 'phrul dus chen) is the day of Buddha Śākyamuni's great miracles. Every positive or negative action done on it is strongly multiplied.
reading.TibetanFestival.KALACAKRA=The full moon of the third month is the day of the revelation of the Kālacakra Tantra (དུས་ཀྱི་འཁོར་ལོའི་རྒྱུད, dus kyi 'khor lo'i rgyud).
reading.TibetanFestival.BIRTH=The 7th of the fourth month is the day of the Buddha's birth.
reading.TibetanFestival.SAGA_DAWA_DUCHEN=The full moon of Saga Dawa (ས་ག་ཟླ་བ, sa ga zla ba), the fourth month, is the day on which the Buddha took birth, attained enlightenment and passed into parinirvāṇa. Every positive or negative action done on it is strongly multiplied.
reading.TibetanFestival.ZAMLING_CHISANG=Zamling Chisang (འཛམ་གླིང་སྤྱི་བསང, 'dzam gling spyi bsang), the 15th of the fifth month, is the day of the universal smoke offering (བསང, bsang) to all the protectors.
reading.TibetanFestival.CHOKHOR_DUCHEN=Chökhor Düchen (ཆོས་འཁོར་དུས་ཆེན, chos 'khor dus chen) is the day on which Buddha Śākyamuni turned the wheel of Dharma for the first time. Every positive or negative action done on it is strongly multiplied.
reading.TibetanFestival.ENTRY_INTO_WOMB=The full moon of the sixth month is the day of the Buddha's entry into his mother's womb.
reading.TibetanFestival.LHABAB_DUCHEN=Lhabab Düchen (ལྷ་བབས་དུས་ཆེན, lha babs dus chen) is the day on which Buddha Śākyamuni returned from the realm of the gods. Every positive or negative action done on it is strongly multiplied.
reading.TibetanFestival.GADEN_NGAMCHO=Gaden Ngamchö (དགའ་ལྡན་ལྔ་མཆོད, dga' ldan lnga mchod) is the day of the parinirvāṇa of Je Tsongkhapa (རྗེ་ཙོང་ཁ་པ, rje tsong kha pa). Every positive or negative action done on it is strongly multiplied.
reading.TibetanFestival.PROTECTORS=The 29th of the twelfth month, at the close of the year, is the day of thanksgiving to the Dharma protectors.

# Readings: PERSONAL_DAY
reading.PersonalDay.LUCK=Today is your la weekday (བླ་གཟའ, bla gza'), the luck day of your birth year's animal: a lucky day for starting projects and for celebrations. When its planet is strong, activities go well.
reading.PersonalDay.LIFE=Today is your life-force weekday (སྲོག་གཟའ, srog gza'), by the animal of your birth year: a lucky and virtuous day for starting projects and for celebrations.
reading.PersonalDay.ANTI=Today is your slayer weekday (གཤེད་གཟའ, gshed gza'), by the animal of your birth year: an unlucky day, to be avoided for starting things and for celebrations. Forceful rites against an enemy take effect quickly when your slayer weekday is strong and the enemy's la weekday (བླ་གཟའ, bla gza') weak.
reading.PersonalMansion={0} It is one of the six personal mansions of your birth year's animal.
reading.PersonalMansion.BLA=Today the moon is in your la mansion (བླ་སྐར, bla skar), the mansion of the life-spirit: work, undertakings and anything else go well.
reading.PersonalMansion.BLA.birth=a child whose own la mansion it is lives long
reading.PersonalMansion.SROG=Today the moon is in your life mansion (སྲོག་སྐར, srog skar): anything goes well on it.
reading.PersonalMansion.DBANG=Today the moon is in your power mansion (དབང་སྐར, dbang skar): anything goes well on it.
reading.PersonalMansion.DBANG.birth=a child whose own power mansion it is gains great merit
reading.PersonalMansion.SKEG=Today the moon is in your obstacle mansion (སྐེག་སྐར, skeg skar): an unlucky mansion for you, on which anything goes badly.
reading.PersonalMansion.BDUD=Today the moon is in your demon mansion (བདུད་སྐར, bdud skar): an unlucky mansion for you.
reading.PersonalMansion.GSHED=Today the moon is in your slayer mansion (གཤེད་སྐར, gshed skar), which is the death mansion (འཆི་བའི་སྐར་མ, 'chi ba'i skar ma): anything goes badly, but subduing obstructing spirits goes well.
reading.PersonalMansion.GSHED.birth=a child whose own slayer mansion it is has a short life

# Readings: JAPANESE_FESTIVAL
reading.Festival.旧正月=The first day of the first month of the old lunisolar calendar.
reading.Festival.人日の節句=One of the five seasonal festivals (五節句), on the 7th day of the 1st month. The five were official holidays until 1872.
reading.Festival.上巳の節句=One of the five seasonal festivals, on the 3rd day of the 3rd month.
reading.Festival.端午の節句=One of the five seasonal festivals, on the 5th day of the 5th month.
reading.Festival.七夕=One of the five seasonal festivals, on the 7th day of the 7th month. Kept on the old-calendar date it is the "traditional Tanabata".
reading.Festival.十五夜=The mid-autumn moon of the 15th night of the 8th month, the moon-viewing night.
reading.Festival.重陽の節句=One of the five seasonal festivals, on the 9th day of the 9th month.
reading.Festival.十三夜=A second moon-viewing on the 13th night of the 9th month, a custom found only in Japan, said to begin with a moon-viewing held by the retired emperor Uda in 919. Also called the later moon, chestnut moon or bean moon.
reading.Festival.お盆=The festival of the ancestors' spirits, once held around the 15th day of the 7th month of the old calendar. Since the solar calendar was adopted in the Meiji era, most regions keep it a month late (月遅れ), 13–16 August, around the 15th shown here, because mid-July fell in the busy farming season; Tokyo keeps 15 July, and Okinawa and Amami the old-calendar date.

# Readings: lunar mansions (Henning's kind of work and nature, in the White Beryl's seven classes, pp. 328–329; its class alone where Henning's line contradicts it)
reading.Mansion.ASHVINI=Aśvinī is one of the four unstable and changing mansions, light and swift in nature: trade, the fine arts and the like go well. Its nature is linked with enemies.
reading.Mansion.ASHVINI.planet=the Sun
reading.Mansion.ASHVINI.foods=meat and honey
reading.Mansion.BHARANI=Bharaṇī is successful in stable aims and severe in nature: destruction, deceit and the like go well. Its nature is linked with pollution.
reading.Mansion.BHARANI.planet=the Moon
reading.Mansion.BHARANI.foods=sesame and rice
reading.Mansion.KRITTIKA=Kṛttikā is one of the two neutral mansions, balanced and mixed in nature: mixed work goes well. Its nature is linked with repetition.
reading.Mansion.KRITTIKA.planet=Mars
reading.Mansion.KRITTIKA.foods=curd
reading.Mansion.ROHINI=Rohiṇī is one of the four very stable mansions, permanent in nature: coronations, sowing and other lasting works go well. Its nature is linked with good fortune.
reading.Mansion.ROHINI.planet=Mercury
reading.Mansion.ROHINI.foods=yoghurt or honey
reading.Mansion.MRIGASHIRAS=Mṛgaśiras is one of the four quick and good mansions, mild and tender in nature: love, making friends, ornaments and marriage go well. Its nature is linked with pollution.
reading.Mansion.MRIGASHIRAS.planet=Jupiter
reading.Mansion.MRIGASHIRAS.foods=wild game
reading.Mansion.ARDRA=Ārdrā is one of the four mansions of bad result, dreadful in nature: attacks, incantations, killing and the parting of friends go well. Its nature is linked with the traveller.
reading.Mansion.ARDRA.planet=Venus
reading.Mansion.ARDRA.foods=blood and water
reading.Mansion.PUNARVASU=Punarvasu is one of the five quick and changing mansions, ephemeral in nature: temporary works go well. Its nature is linked with good fortune.
reading.Mansion.PUNARVASU.planet=Saturn
reading.Mansion.PUNARVASU.foods=pastry
reading.Mansion.PUSHYA=Puṣya is one of the four unstable and changing mansions, light and swift in nature: trade, love, the fine arts and the like go well. Its nature is linked with accomplishment.
reading.Mansion.PUSHYA.planet=the Sun
reading.Mansion.PUSHYA.foods=honey and rabbit
reading.Mansion.ASHLESHA=Āśleṣā is one of the four mansions of bad result, dreadful in nature: incantations, attacks and the like go well. Its nature is linked with the traveller.
reading.Mansion.ASHLESHA.planet=the Moon
reading.Mansion.ASHLESHA.foods=snake meat
reading.Mansion.MAGHA=Maghā is one of the four stable and accomplishing mansions, severe in nature: destruction, deceit and the like go well. Its nature is linked with enemies.
reading.Mansion.MAGHA.planet=Mars
reading.Mansion.MAGHA.foods=sesame soup
reading.Mansion.PURVAPHALGUNI=Pūrvaphalgunī is one of the four stable and accomplishing mansions, severe in nature: destruction, deceit and the like go well. Its nature is linked with pollution.
reading.Mansion.PURVAPHALGUNI.planet=Mercury
reading.Mansion.PURVAPHALGUNI.foods=rice and roasted sesame
reading.Mansion.UTTARAPHALGUNI=Uttaraphalgunī is one of the four very stable mansions, permanent in nature: coronations, sowing and other lasting works go well. Its nature is linked with enemies.
reading.Mansion.UTTARAPHALGUNI.planet=Jupiter
reading.Mansion.UTTARAPHALGUNI.foods=millet
reading.Mansion.HASTA=Hasta is one of the four unstable and changing mansions, light and swift in nature: trade, love, the fine arts and the like go well. Its nature is linked with death.
reading.Mansion.HASTA.planet=Venus
reading.Mansion.HASTA.foods=bird meat and ears of grain
reading.Mansion.CITRA=Citrā is one of the four quick and good mansions, mild and tender in nature: marriage, ornaments, love and the like go well. Its nature is linked with repetition.
reading.Mansion.CITRA.planet=Saturn
reading.Mansion.CITRA.foods=fruit
reading.Mansion.SVATI=Svātī is one of the five quick and changing mansions, ephemeral in nature: temporary works go well. Its nature is linked with accomplishment.
reading.Mansion.SVATI.planet=the Sun
reading.Mansion.SVATI.foods=flour, sesame soup and Nepalese dal
reading.Mansion.VISHAKHA=Viśākhā is one of the two neutral mansions, balanced and mixed in nature: mixed work goes well. Its nature is linked with enemies.
reading.Mansion.VISHAKHA.planet=the Moon
reading.Mansion.VISHAKHA.foods=sesame, flowers and Indian dal
reading.Mansion.ANURADHA=Anurādhā is one of the four quick and good mansions, mild and tender in nature: love, making friends, ornaments and marriage go well. Its nature is linked with repetition.
reading.Mansion.ANURADHA.planet=Mars
reading.Mansion.ANURADHA.foods=alcohol, small pulses and honey
reading.Mansion.JYESHTHA=Jyeṣṭhā is one of the four mansions of bad result, dreadful in nature: incantations, attacks and the like go well. Its nature is linked with the traveller.
reading.Mansion.JYESHTHA.planet=Mercury
reading.Mansion.JYESHTHA.foods=red rice and rice soup
reading.Mansion.MULA=Mūla is one of the four mansions of bad result, dreadful in nature: incantations, attacks and the like go well. Its nature is linked with pollution.
reading.Mansion.MULA.planet=Jupiter
reading.Mansion.MULA.foods=milk, among others
reading.Mansion.PURVASHADHA=Pūrvāṣāḍhā is one of the four stable and accomplishing mansions, severe in nature: destruction, deceit and the like go well. Its nature is linked with good fortune.
reading.Mansion.PURVASHADHA.planet=Venus
reading.Mansion.PURVASHADHA.foods=banyan
reading.Mansion.UTTARASHADHA=Uttarāṣāḍhā is one of the four very stable mansions, permanent in nature: coronations, sowing and other lasting works go well. Its nature is linked with accomplishment.
reading.Mansion.UTTARASHADHA.planet=Saturn
reading.Mansion.UTTARASHADHA.foods=honey and rabbit
reading.Mansion.SHRAVANA=Śravaṇa is one of the five quick and changing mansions, ephemeral in nature: temporary works go well. Its nature is linked with repetition.
reading.Mansion.SHRAVANA.planet=the Sun
reading.Mansion.SHRAVANA.foods=fresh butter and bird meat
reading.Mansion.DHANISHTHA=Dhaniṣṭhā is one of the five quick and changing mansions, ephemeral in nature: temporary works go well. Its nature is linked with the traveller.
reading.Mansion.DHANISHTHA.planet=Mars
reading.Mansion.DHANISHTHA.foods=Indian dal and mouse meat
reading.Mansion.SHATABHISHAJ=Śatabhiṣaj is one of the four very stable mansions: taking new land, appointing new chiefs, rites of great stability, gardens and groves and building go well. Its nature is linked with good fortune.
reading.Mansion.SHATABHISHAJ.planet=Mercury
reading.Mansion.SHATABHISHAJ.foods=goat meat
reading.Mansion.PURVABHADRAPADA=Pūrvabhādrapadā is one of the four stable and accomplishing mansions, severe in nature: destruction, deceit and the like go well. Its nature is linked with death.
reading.Mansion.PURVABHADRAPADA.planet=Jupiter
reading.Mansion.PURVABHADRAPADA.foods=bloody mutton
reading.Mansion.UTTARABHADRAPADA=Uttarabhādrapadā is one of the four quick and good mansions: ornaments, games, field work and all quick work go well. Its nature is linked with death.
reading.Mansion.UTTARABHADRAPADA.planet=Venus
reading.Mansion.UTTARABHADRAPADA.foods=Nepalese dal
reading.Mansion.REVATI=Revatī is one of the four unstable and changing mansions: offering rites, teaching the dharma, giving vows, presenting petitions and gifts to superiors and quick aims of one's own go well. Its nature is linked with accomplishment.
reading.Mansion.REVATI.planet=Saturn
reading.Mansion.REVATI.foods=mince
reading.EarthLord={0} This reckoning is for the dead, and learned commentators keep it to funerals; for other works the day animal's own results hold.
reading.EarthLord.MOUSE=The earth lord sits in the beer jar: straining beer for the dead goes badly for the brewer and the children.
reading.EarthLord.MOUSE.remedy=scatter the first of the mash as an offering and screen the jar
reading.EarthLord.MOUSE.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the north of the house; the hearth god in the lane (སྲང, srang), who takes offence at work there, above all at a corpse
reading.EarthLord.MOUSE.death=repeats three times, as Nyentra (གཉན་ཁྲ, gnyan khra) witnesses the day; a corpse sent to the lower north brings harm
reading.EarthLord.OX=The earth lord sits in the granary: taking barley out for the dead goes badly for whoever takes it out and for the measurer.
reading.EarthLord.OX.remedy=scatter the first of the grain to the four directions and take it out through a hole pierced in the granary
reading.EarthLord.OX.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the north-east of the house; the hearth god under the hearth, who takes offence at work there, above all at a corpse
reading.EarthLord.OX.death=repeats, as Nyenjang (གཉན་ལྗང, gnyan ljang) witnesses the day; dig no grave, and avoid the funeral gathering
reading.EarthLord.TIGER=The earth lord sits in the door: a corpse carried out through it goes badly for the head of the house.
reading.EarthLord.TIGER.remedy=take the corpse out through the roof or a hole
reading.EarthLord.TIGER.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the upper east of the house; the hearth god in the south, who takes offence at work there, above all at a corpse
reading.EarthLord.TIGER.death=the white garuda witnesses the day: no cremation, and the corpse's road not to the upper east
reading.EarthLord.RABBIT=The earth lord sits in the door bolt: a corpse-bearer who grasps it brings harm to sons, grandsons and daughters.
reading.EarthLord.RABBIT.remedy=let the bearer leave the bolt untouched, or take it out first
reading.EarthLord.RABBIT.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the east of the house; the hearth god in the east, who takes offence at work there, above all at a corpse
reading.EarthLord.RABBIT.death=the earth's turtle witnesses the day: the funeral road not to the lower east
reading.EarthLord.DRAGON=The earth lord sits in the mill: if tsampa (རྩམ་པ, rtsam pa) for the dead is ground on it, the miller and the maternal uncle die.
reading.EarthLord.DRAGON.remedy=open the mill and scatter flour from its centre
reading.EarthLord.DRAGON.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the south-east of the house; the hearth god in the west, who takes offence at work there, above all at a corpse
reading.EarthLord.DRAGON.death=Nyentra Baden (གཉན་ཁྲ་བ་དན, gnyan khra ba dan) witnesses the day: no wailing in mourning, and the corpse's road not to the south-east
reading.EarthLord.SNAKE=The earth lord sits in the rope: if a corpse is dragged with a rope, the bearer dies.
reading.EarthLord.SNAKE.remedy=cut the rope in three, tie it again to carry, and cut it again where the road begins
reading.EarthLord.SNAKE.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the south of the house; the hearth god in the north, who takes offence at work there, above all at a corpse
reading.EarthLord.SNAKE.death=Tsangkün (ཙང་ཀུན, tsang kun) witnesses the day: avoid slaughter and a funeral door to the upper south, and take the corpse by the main road
reading.EarthLord.HORSE=The earth lord sits in the saddle: a corpse loaded on a saddle goes badly for the horse.
reading.EarthLord.HORSE.death=repeats, as Jilam (བྱི་ལམ, byi lam) witnesses the day; the messenger who carries the news goes without a horse, and the funeral door and horseback are avoided
reading.EarthLord.HORSE.remedy=carry the corpse without a saddle
reading.EarthLord.HORSE.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the south of the house; the hearth god in the east, who takes offence at work there, above all at a corpse
reading.EarthLord.SHEEP=The earth lord sits in the trough: kneading dough for the dead in it goes badly for the one who kneads.
reading.EarthLord.SHEEP.remedy=knead in copper or on a cloth, and set a human figure of dough at the place of death
reading.EarthLord.SHEEP.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the south-west of the house; the hearth god in the west, who takes offence at work there, above all at a corpse
reading.EarthLord.SHEEP.death=repeats, as Bena (བེ་སྣ, be sna) witnesses the day; if ground is broken, seven die; bad for the dead and for graves; corpse and funeral door not to the south-west
reading.EarthLord.MONKEY=The earth lord sits in the knife and the axe: whoever cuts meat with them dies.
reading.EarthLord.MONKEY.remedy=put the knives and axes through fire
reading.EarthLord.MONKEY.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the west of the house; the hearth god in the north, who takes offence at work there, above all at a corpse
reading.EarthLord.MONKEY.death=Zikjuk (གཟིག་མཇུག, gzig mjug) witnesses the day: no funeral gathering, and the funeral road not to the upper west
reading.EarthLord.BIRD=The earth lord sits in the plates: serving food for the dead on plates goes badly for the host or brings sudden misfortune.
reading.EarthLord.BIRD.remedy=use flat stones, or lay the dough on a felt
reading.EarthLord.BIRD.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the west of the house; the hearth god in the west, who takes offence at work there, above all at a corpse
reading.EarthLord.BIRD.death=Hetön Gyelpo (ཧེ་ཐོན་རྒྱལ་པོ, he thon rgyal po) witnesses the day: a funeral feast goes badly for wealth, and the corpse not to the lower west
reading.EarthLord.DOG=The earth lord sits in the lintel and the threshold: a corpse that touches the threshold goes badly for the father's bearer, or the bearer dies.
reading.EarthLord.DOG.remedy=wrap the threshold in cloth, and drink no mourning beer
reading.EarthLord.DOG.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the north-west of the house; the hearth god in the north, who takes offence at work there, above all at a corpse
reading.EarthLord.DOG.death=repeats away from home, as Tekhyim (ཐེ་ཁྱིམ, the khyim) witnesses the day; the funeral road not to the north-west
reading.EarthLord.PIG=The earth lord sits in the hoe: if the grave pit is dug with a pick, the grandmother and the one who breaks ground die; so too in building work.
reading.EarthLord.PIG.remedy=open the ground with a bone
reading.EarthLord.PIG.spirits=Serdzö Serpo (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), the earth lord, to the north of the house; the hearth god in the south, who takes offence at work there, above all at a corpse
reading.EarthLord.PIG.death=Nyenbé (གཉན་བེ, gnyan be) witnesses the day: no mourning, and the corpse's road not to the upper north
reading.BlaMkhyen=The astrologer spirit (བླ་མཁྱེན, bla mkhyen) of the day dwells where the day's seven-red mewa (སྨེ་བ, sme ba) stands, today: {0}. Works towards it go badly, as the year's rules for it say. It takes offence at astrologers, at the head of the household and at vajra masters.
reading.BlaMkhyen.also_called=Sewa Lakhyen (སེ་བ་བླ་མཁྱེན, se ba bla mkhyen), the astrologer among the year's spirits, in a monk's form, red and yellow, holding a magic mirror
reading.BlaMkhyen.remedy=if it is harmed, send a torma (གཏོར་མ, gtor ma) in its direction and recite five texts: the White Parasol of the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor), the Eight Appearances of Heaven and Earth (སྣང་བརྒྱད, snang brgyad), Reciting the Names of Mañjuśrī (མཚན་བརྗོད, mtshan brjod), the Collected Dhāraṇīs (གཟུངས་བསྡུས, gzungs bsdus) and the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs), all five in one printed Collected Dhāraṇīs

# Readings: yogas (the White Beryl, pp. 347–349): the short reading, the gist of the longer verse, the avoidance verse (whole length in the paragraph, the start as a row)
reading.Yoga.VISHKAMBHA=A mixed yoga: it clears the way, and removing obstacles goes well. Consecration, offerings to the gods, confession and counsel with friends go well too.
reading.Yoga.VISHKAMBHA.avoid_start=the first three chutsö (ཆུ་ཚོད, chu tshod), 1 h 12 min
reading.Yoga.PRITI=A lucky yoga of friendship with everyone: every work goes well, above all work that is pure, pleasing and for good fortune. Music and celebration go especially well.
reading.Yoga.AYUSHMAN=A lucky yoga of long life and glory: fame, people, wealth, cattle, strength, jewels and sons are gained under it. Work for a living goes well.
reading.Yoga.SAUBHAGYA=A lucky yoga of abundance: travel goes well, ornaments and jewels last, and what was gathered bears pleasing fruit. Long life, dharma, wealth and happiness grow under it.
reading.Yoga.SHOBHANA=A lucky yoga, pleasing to everyone: ornaments, song and dance go well. Power comes from past merit, and virtue and fulfilled wishes grow.
reading.Yoga.ATIGANDA=An unlucky yoga: wealth and cattle run out under it. Entering bad ways goes well, and bringing virtue to completion goes badly. Good conduct bears a bad result.
reading.Yoga.ATIGANDA.avoid_start=the first six chutsö (ཆུ་ཚོད, chu tshod), 2 h 24 min
reading.Yoga.SUKARMAN=A lucky yoga that secures the way to the next life: aspiration and engagement go well, and so do friendship, clothes and travel. Defeating enemy forces and protection go well too.
reading.Yoga.DHRITI=A lucky yoga: jewels and riches are gained, and afflictions are removed. War, women, taking land and forts, raising treasure and forceful work of power go well.
reading.Yoga.SHULA=An unlucky yoga: what is undertaken does great harm. Children, teachers, ornaments and clothes fare badly. War and thieves come, the sick die, and talk brings trouble.
reading.Yoga.SHULA.avoid_start=the first five chutsö (ཆུ་ཚོད, chu tshod), 2 h
reading.Yoga.GANDA=An unlucky yoga: illness from the nāgas breaks out under it. The la, the life-spirit (བླ, bla), and the span of life are lost, and seats of power are lost to enemies.
reading.Yoga.GANDA.avoid_start=the first six chutsö (ཆུ་ཚོད, chu tshod), 2 h 24 min
reading.Yoga.VRIDDHI=A lucky yoga of growth: wealth grows and every work goes well. Enemies are subdued, what is good is kept safe, and work with friends and kin goes well.
reading.Yoga.DHRUVA=A lucky yoga: enemies are always overcome under it, and every wish is fulfilled. It is a treasury of intelligence, beauty, long life and a fine voice, the glory of gods and men.
reading.Yoga.VYAGHATA=A mixed yoga: leprosy breaks out under it. Births and deaths go badly, and so do land, forts and goods. Study fails, and quarrels and wounds come.
reading.Yoga.VYAGHATA.avoid_start=the first nine chutsö (ཆུ་ཚོད, chu tshod), 3 h 36 min
reading.Yoga.HARSHANA=A mixed yoga of joy in life: dharma, wealth and a glad mind grow under it. A place, support, a road and friends are found, and house, merit and glory increase.
reading.Yoga.VAJRA=A mixed yoga: every wish is fulfilled under it, and its image is the thunderbolt of the sky. Fierce rites against others go well, and peaceful work for good fortune goes badly. It brings fear and terror.
reading.Yoga.VAJRA.avoid_start=the first nine chutsö (ཆུ་ཚོད, chu tshod), 3 h 36 min
reading.Yoga.SIDDHI=A lucky yoga: whatever is intended is accomplished. Glory, a good name, clear faculties and skill in means come under it, and victory blazes with strength.
reading.Yoga.VYATIPATA=An unlucky yoga, avoided for its whole length: going abroad goes badly. By skilful means it overcomes demons and armies. Ordination, temples and the work of the gods fall under it, with misfortune and gossip.
reading.Yoga.VARIYAS=A lucky yoga of victory over enemies: a teacher keeps discipline, and power in the dharma and the path is gained. It leads to the city of liberation, with wisdom.
reading.Yoga.PARIGHA=An unlucky yoga, avoided for its whole length: its image is death in prison. Dealings with māras, fear of enemies, stolen glory, illness and unforeseen ruin come under it.
reading.Yoga.SHIVA=A lucky yoga of peace: the result is surely gained, and it is gentle within and without. Life, wealth and lineage stay secure, enemies are pacified and aims are achieved.
reading.Yoga.SIDDHA=A lucky yoga: every intention is accomplished. Wishes, life and riches are fulfilled under it, faith and aspiration bring glory, and the lineage is a treasure of life.
reading.Yoga.SADHYA=A lucky yoga: going to trade goes well, and so does all coming and going. Beauty, faith, medicine, dharma, wealth, happiness, refuge and allies come under it.
reading.Yoga.SHUBHA=A lucky yoga, good by nature: a feast for the living goes well. Whatever is done has meaning, and people, wealth and the happiness of the dharma are gained.
reading.Yoga.SHUKLA=A lucky yoga: going and staying both go well. Bright faculties, light, fame and glory come under it, with an intelligence that does not run out.
reading.Yoga.BRAHMA=A lucky yoga: the rank of a god is reached. Long life, glory, fame, happiness and wealth are found, and rites of power and practices of long life go well.
reading.Yoga.INDRA=A lucky yoga: study goes well, wishes are accomplished and wealth is found, and work for good fortune has meaning. The king shows favour, and ministers find a garland of jewels.
reading.Yoga.VAIDHRITI=An unlucky yoga, avoided for its whole length: its image is meeting a woman friend. The retinue declines, fame and rule are in danger, servants, children and goods decay, and deeds end badly.

# Readings: karaṇas (the White Beryl, pp. 349–351), where the verse says more than its list, and Viṣṭi's common remedy
reading.Karana.VISHTI=An unlucky karaṇa: harsh work goes well in it, and virtuous work goes badly. Its fierce rites go well, but the direction it faces is to be avoided.
reading.Karana.VISHTI.remedy=raise an image or a painted scroll (ཐང་ཀ, thang ka) of Vajrapāṇi (ཕྱག་རྡོར, phyag rdor), read the Eight Appearances of Heaven and Earth (སྣང་བརྒྱད, snang brgyad) and make averting rites

# Readings: lunar dates (the White Beryl, pp. 297–304): the five-fold cycle, a birth and death, the perilous dates, the place of the la (bla gnas)
reading.LunarDate.1=The 1st of the month is a virtuous day, the day of joy (དགའ་བ, dga' ba): pacifying rites, crafts, games and all white work go well.
reading.LunarDate.1.also_called=Nandā
reading.LunarDate.1.la=the la, the life-spirit (བླ, bla), sits in the big toe; in horses and other livestock, in the sole of the foot; no bloodletting, moxibustion or other treatment there
reading.LunarDate.1.birth=children follow one another, and wide learning
reading.LunarDate.1.death=bad
reading.LunarDate.1.livestock=bought today, increases a thousandfold
reading.LunarDate.2=The 2nd of the month is a virtuous day, the excellent day (བཟང་པོ, bzang po): above all, seeking friends and sowing seed go well.
reading.LunarDate.2.also_called=Bhadrā
reading.LunarDate.2.la=the la, the life-spirit (བླ, bla), sits in the ankle joint; in horses and other livestock, in the fat; no bloodletting, moxibustion or other treatment there
reading.LunarDate.2.birth=a boy is good, a girl bad
reading.LunarDate.2.livestock=bought today, increases a thousandfold
reading.LunarDate.3=The 3rd of the month is a virtuous day, the victorious day (རྒྱལ་བ, rgyal ba): war, raids, attacking enemies, thread-crosses (མདོས, mdos), tormas (གཏོར་མ, gtor ma) and other fierce rites go well.
reading.LunarDate.3.also_called=Jayā
reading.LunarDate.3.la=the la, the life-spirit (བླ, bla), sits in the calf; in horses and other livestock, in the dardong (དར་གདོང, dar gdong); no bloodletting, moxibustion or other treatment there
reading.LunarDate.3.birth=whoever is born today dies or fares badly
reading.LunarDate.3.death=good
reading.LunarDate.3.livestock=bought today, increases
reading.LunarDate.4=The 4th of the month is an empty day (སྟོང་པ, stong pa), not a virtuous one: in general, any work goes badly on it.
reading.LunarDate.4.also_called=Riktā
reading.LunarDate.4.remedy=raise an empty vase into the air as the rite prescribes, recite the Stream of Wealth (ནོར་རྒྱུན, nor rgyun) and bind the wealth pledge
reading.LunarDate.4.la=the la, the life-spirit (བླ, bla), sits in the waist; in horses and other livestock, in the hock (སྲེ་ལོང, sre long); no bloodletting, moxibustion or other treatment there
reading.LunarDate.4.birth=a boy is bad for his mother; girls follow
reading.LunarDate.4.livestock=bought today, increases
reading.LunarDate.5=The 5th of the month is a full day (རྫོགས་པ, rdzogs pa), not a virtuous one: in general work goes badly, but building a fort and hiding treasure go well.
reading.LunarDate.5.also_called=Pūrṇā
reading.LunarDate.5.remedy=make rites that raise glory and recite the Heap of Auspiciousness (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa)
reading.LunarDate.5.la=the la, the life-spirit (བླ, bla), sits in the hollow of the knee; in horses and other livestock, in the sera bone (སེ་ར, se ra); no bloodletting, moxibustion or other treatment there
reading.LunarDate.5.birth=a boy will be rich; a girl dies or lives alone
reading.LunarDate.5.livestock=bought today, increases
reading.LunarDate.6=The 6th of the month is a virtuous day, the day of joy (དགའ་བ, dga' ba): pacifying rites, crafts, games and all white work go well.
reading.LunarDate.6.also_called=Nandā
reading.LunarDate.6.la=the la, the life-spirit (བླ, bla), sits in the groove of the thigh; in horses and other livestock, in the hip socket; no bloodletting, moxibustion or other treatment there
reading.LunarDate.6.birth=no more children follow
reading.LunarDate.6.death=bad
reading.LunarDate.7=The 7th of the month is a virtuous day, the excellent day (བཟང་པོ, bzang po): above all, seeking friends and sowing seed go well.
reading.LunarDate.7.also_called=Bhadrā
reading.LunarDate.7.la=the la, the life-spirit (བླ, bla), sits in the hip joint; in horses and other livestock, in the point of the elbow; no bloodletting, moxibustion or other treatment there
reading.LunarDate.7.birth=a boy has sharp faculties; a girl follows her husband away
reading.LunarDate.7.death=good for those left behind
reading.LunarDate.8=The 8th of the month is a virtuous day, the victorious day (རྒྱལ་བ, rgyal ba): war, raids, attacking enemies, thread-crosses (མདོས, mdos), tormas (གཏོར་མ, gtor ma) and other fierce rites go well. It is a perilous day, when Indra holds a feast of dharma among the gods. Falling ill on it is dangerous, and great gatherings and anything grand or forceful go badly.
reading.LunarDate.8.also_called=Jayā
reading.LunarDate.8.la=the la, the life-spirit (བླ, bla), sits above the kidneys; in horses and other livestock, in the hollow of the kidneys; no bloodletting, moxibustion or other treatment there
reading.LunarDate.8.birth=a child is hard to raise
