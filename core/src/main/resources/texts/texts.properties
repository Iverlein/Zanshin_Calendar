reading.HourBlaMkhyen=The astrologer spirit (བླ་མཁྱེན, bla mkhyen) of the hour dwells on the luck (ཀླུང་རྟ, klung rta) of the hour's three animals, as the year's does on the year's. Works towards it go badly, as the year's rules for it say. It takes offence at astrologers, at the head of the household and at vajra masters.
reading.HourBlaMkhyen.remedy=if it is harmed, send a torma (གཏོར་མ, gtor ma) in its direction and recite the five texts, as for the day's astrologer spirit
reading.HourSaRgyal=The earth king (ས་རྒྱལ, sa rgyal) of the hour stands on the four-slayer (བཞི་གཤེད, bzhi gshed) in front of it, three animals on. If it is harmed, the chief and the lord of the land suffer, and one who did corpse rites dies before long.
reading.HourSaRgyal.remedy=though no remedy is named for it, confer empowerment, practise the generation and completion stages and gather a great feast offering (ཚོགས, tshogs)
reading.HourHidden.MOUSE=Nyentra (གཉན་ཁྲ, gnyan khra)
reading.HourHidden.OX=Nyenjang (གཉན་ལྗང, gnyan ljang)
reading.HourHidden.TIGER=the garuda (བྱ་ཁྱུང, bya khyung)
reading.HourHidden.RABBIT=the yellow turtle (རུས་སྦལ་སེར་པོ, rus sbal ser po)
reading.HourHidden.DRAGON=the yellow banner (བ་དན་སེར་པོ, ba dan ser po)
reading.HourHidden.SNAKE=Tsangkün (ཙང་ཀུན, tsang kun)
reading.HourHidden.HORSE=Jilam (བྱི་ལམ, byi lam)
reading.HourHidden.SHEEP=Bena Lakchen (བེ་སྣ་ལག་ཆེན, be sna lag chen)
reading.HourHidden.MONKEY=Zikjuk (གཟིག་མཇུག, gzig mjug)
reading.HourHidden.BIRD=Hetön (ཧེ་ཐོན, he thon)
reading.HourHidden.DOG=Jidur (བྱི་དུར, byi dur)
reading.HourHidden.PIG=Chukpo (ཕྱུག་པོ, phyug po)
reading.HourHidden=The hidden earth lord (གབ་པའི་ས་བདག, gab pa'i sa bdag) of this hour's animal, {0}, sits on its place. The hidden earth lords are fierce, and a corpse is not led their way.
reading.HourHidden.remedy=if it is harmed, treat it with the general remedies
reading.HourGnamKhyi=The black sky dog (གནམ་ཁྱི་ནག་པོ, gnam khyi nag po) lies round the twelve places, its head on this hour's place, its tail on the seventh. Towards its head burial, forts and leading out an army go badly, and towards its tail removing a corpse, war and robbery. A bride goes badly above all, and it takes offence at everyone, corpse-bearers most.
reading.HourGnamKhyi.remedy=if it is harmed, make the sky dog's thread-cross (མདོས, mdos) and recite the White Parasol of the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor)
RoughTime.SUNRISE=the sun's rays rising
RoughTime.NOON=noon
RoughTime.SUNSET=the sun's rays gathering
RoughTime.MIDNIGHT=midnight
wording.guarding_curd_and_beer=guarding curd and beer
wording.binding_the_gongpo=binding the mouths of the gongpo spirits (འགོང་པོ, 'gong po)
wording.raising_fortune_and_prosperity=raising fortune and prosperity (ཕྱྭ་གཡང, phywa g.yang)
wording.mantras_taming_the_earth_lords=reciting the mantras that tame the earth lords (ས་བདག, sa bdag)
wording.fierce_averting_recitation=fierce recitation that turns harm back
wording.taming_madness_and_fainting=work that tames madness and fainting fits
wording.expelling_adversity=work that drives out adversity
wording.fulfilling_the_protectors=rites that fulfil the protectors (སྲུང་མ, srung ma) and make offerings to them
wording.binding_the_serak=binding the mouths of the serak (བསེ་རག, bse rag)
wording.taming_the_gremo=taming the dremo (གྲེ་མོ, gre mo)
wording.mantras_summoning_fortune_and_prosperity=reciting the mantras that summon fortune and prosperity (ཕྱྭ་གཡང, phywa g.yang)
wording.fierce_mantras=fierce mantras
wording.mantras_slaying_enemies=mantras to slay enemies
wording.averting_killing_and_fierce_work=averting, killing and fierce work
wording.confrontations=confrontations
wording.great_displays=great displays of might
reading.HourWorks={0} Where the hour and the day's animal sign (ཉི་མ, nyi ma) differ, the hour leads within its time: the hour is a sharp weapon.
reading.HourWorks.RABBIT=In the hare hour guarding curd and beer and binding the mouths of the gongpo spirits (འགོང་པོ, 'gong po) go well.
reading.HourWorks.DRAGON=In the dragon hour, at sunrise (ཉི་ཤར, nyi shar), raising fortune and prosperity (ཕྱྭ་གཡང, phywa g.yang) goes well.
reading.HourWorks.SNAKE=In the snake hour, when the sun is warm (ཉི་དྲོས, nyi dros), reciting the mantras that tame the earth lords (ས་བདག, sa bdag) goes well.
reading.HourWorks.HORSE=In the horse hour, at noon (ཉི་ཕྱེད, nyi phyed), fierce recitation that turns harm back goes well.
reading.HourWorks.SHEEP=In the sheep hour, past the half (ཕྱེད་ཡོལ, phyed yol), as the sun declines, work that tames madness and fainting fits goes well.
reading.HourWorks.MONKEY=In the monkey hour, late in the afternoon (མྱུར་སྨད, myur smad), work that drives out adversity goes well.
reading.HourWorks.BIRD=In the bird hour, as the sun grows old (ཉི་རྒས, nyi rgas), rites that fulfil the protectors (སྲུང་མ, srung ma) and make offerings to them go well.
reading.HourWorks.DOG=When the dog hour comes, at dusk (ས་སྲོད, sa srod), work that binds the mouths of the serak (བསེ་རག, bse rag) goes well.
reading.HourWorks.PIG=In the pig hour, as night comes on (སྲོད་འཁོར, srod 'khor), work that tames the dremo (གྲེ་མོ, gre mo) goes well.
reading.HourWorks.MOUSE=When the mouse rises at midnight (ནམ་ཕྱེད, nam phyed), reciting the mantras that summon fortune and prosperity (ཕྱྭ་གཡང, phywa g.yang) goes well.
reading.HourWorks.OX=In the ox hour, past the half (ཕྱེད་ཡོལ, phyed yol), after midnight, fierce mantras go well.
reading.HourWorks.TIGER=In the tiger hour mantras to slay enemies go well.
reading.RoughTime=This is one of the four rough times (དུས་རྩུབ་མོ, dus rtsub mo), when the four māras (བདུད་བཞི, bdud bzhi) move. Nothing goes well in it but averting, killing and fierce work: the hour is a sharp weapon.
reading.OwnYearHour=This is the hour of your own year, the hour of your birth year's animal. Fierce and harsh work, gatherings, confrontations and great displays of might go badly in it.
reading.HourOverDay=Where the day's animal sign (ཉི་མ, nyi ma) and the hour differ, the hour leads: the hour is a sharp weapon. Within this hour a work the animal sign alone decided takes the side the hour gives it.

