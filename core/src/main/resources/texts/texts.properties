reading.TwelveLinks.IGNORANCE=The day of ignorance (མ་རིག་པ, ma rig pa), the first of the twelve links, is a day for building and for offerings; it is pictured as a blind old woman. Washing the head and the body goes well, and new clothes go badly.
reading.TwelveLinks.IGNORANCE.setting_out=east goes well; south brings disputes and west unwelcome talk, and in both the aim fails; north brings pleasant news
reading.TwelveLinks.IGNORANCE.birth=a child that lives through its ninth year, month and day has wealth and many words, quarrels with its kin, is unhappy and lustful, and learns writing, reckoning and the sciences; it lives 81 years and dies on formation's day
reading.TwelveLinks.IGNORANCE.remedy=make an old woman's figure of the five grains, write on paper on the figure's back that the harm of ignorance, great attachment and the dangers turn onto it, and send it off; set up a white torma (གཏོར་མ, gtor ma), a white arrow with silk and the grains to the east
reading.TwelveLinks.FORMATION=The day of formation (འདུ་བྱེད, 'du byed), the second link, is a day for learning, building and virtuous work; it is pictured as a potter. Washing the head or putting on new clothes today brings illness and sudden fright.
reading.TwelveLinks.FORMATION.setting_out=east brings wealth and a happy return; south clears sorrow and brings one back unharmed; west brings food; north, the aim is reached
reading.TwelveLinks.FORMATION.birth=a child that lives through its eighth year, month and day grows rich, with two siblings; it is seldom ill and long-lived, with many friends yet chaste, and skilled in the crafts; it lives 81 years and dies on consciousness's day
reading.TwelveLinks.FORMATION.remedy=make a potter's figure of dough; raise silk, the grains and a yellow arrow with silk, and make a burnt offering (གསུར, gsur) of flour and butter
reading.TwelveLinks.CONSCIOUSNESS=The day of consciousness (རྣམ་པར་ཤེས་པ, rnam par shes pa), the third link, is a day for rites, empowerments, medicine and subduing enemies; it is pictured as a monkey. Washing the head is pleasing, and washing the body brings fright.
reading.TwelveLinks.CONSCIOUSNESS.setting_out=east brings affliction and west dispute; south goes unharmed; north brings wealth from within and without
reading.TwelveLinks.CONSCIOUSNESS.birth=a child that lives through its fifth year, month and day without sudden death has long cheer; it is learned and very proud, fond of wrongdoing, harsh of speech, brave and poor, small in the mind of awakening; it lives 62 years and dies by a weapon on name and form's day
reading.TwelveLinks.CONSCIOUSNESS.remedy=make a monkey's figure of clay with a turning-back mantra inside and send it with medicines and the grains to a meeting of three roads; raise red silk to the sky
reading.TwelveLinks.NAME_AND_FORM=The day of name and form (མིང་གཟུགས, ming gzugs), the fourth link, is a day for words of good fortune, white work and medicine; it is pictured as a boat. Washing the head greys the hair, washing the body frightens one's kin, and new clothes soon wear out.
reading.TwelveLinks.NAME_AND_FORM.setting_out=east brings glory and south fulfils wishes; west finds nothing; north brings loss and confusion
reading.TwelveLinks.NAME_AND_FORM.birth=a child that lives through its twelfth year, month and sixth day is seldom ill but hard put to live, with much hatred and ever fearful, and a son does not live; it is fierce and proud, rich late in life, with three wives, living by trade; it lives 81 years and dies of a wasting illness on the sense sources' day
reading.TwelveLinks.NAME_AND_FORM.remedy=make a boatman of dough and a figure from an image-maker, and set them toward the south with silk, medicines, the grains, the three whites and a blue arrow with silk, with the smoke of white incense
reading.TwelveLinks.SOURCES=The day of the sense sources (སྐྱེ་མཆེད, skye mched), the fifth link, is a day for a royal seat, a bride and setting up supports; it is pictured as an empty house. Washing the head brings splendour and new clothes beauty, but washing the body frightens the parents.
reading.TwelveLinks.SOURCES.setting_out=east is futile; south brings glory and joy; west and north fulfil one's hopes
reading.TwelveLinks.SOURCES.birth=a child that lives through its eighth or tenth year, third month and fifth day is very miserly, brave, poor and full of craving; it lives 64 years and dies at home on contact's day
reading.TwelveLinks.SOURCES.remedy=make a castle's figure of black flour; raise silk, medicines, the grains and green silk to the sky, and throw a broken arrow on the road
reading.TwelveLinks.CONTACT=The day of contact (རེག་པ, reg pa), the sixth link, is a day for fierce and harsh work; it is pictured as an embracing couple. Washing the head means fewer disputes. New clothes bring harm from a friend: if they must be worn, prostrate before a monk first and the harm is softened.
reading.TwelveLinks.CONTACT.setting_out=east brings illness and west clamour and fright; south brings beauty; north, what is sought is found, but late
reading.TwelveLinks.CONTACT.birth=a child that lives through its ninth year, fifth day and the ninth, fifth or third month is always held by illness; it has many friends and is eloquent, intelligent and very proud, light-fingered, fond of the dharma, very jealous, rich and lustful; it lives 63 years and dies by punishment on feeling's day
reading.TwelveLinks.CONTACT.remedy=make a deer and a blue hound of dough and throw them out with silk, medicines, the grains and the substances against harmful talk; wrap silk, medicines, jewels and iron filings and put them under the base of a sacred image
reading.TwelveLinks.FEELING=The day of feeling (ཚོར་བ, tshor ba), the seventh link, is a day for peaceful works, friends, trade and crossing water; it is pictured as an arrow in the eye. Washing the head, shaving and washing the body bring unhappiness, and new clothes fright.
reading.TwelveLinks.FEELING.setting_out=east clears sorrow and brings content; south brings illness; west, ill news of a death; north, pleasant news and ease
reading.TwelveLinks.FEELING.birth=a child that lives through its eighth year and eighth month, or its second month and twelfth day, is honoured and served by others, a place of offering, yet fond of guile and wrongdoing; it is rich in grain, skilled in crafts, with two wives; it lives 60 years and dies of fever on craving's day
reading.TwelveLinks.FEELING.remedy=make an arrow-maker of dough, raise the grains, a small knife and an arrow with silk together, and burn guggul
reading.TwelveLinks.CRAVING=The day of craving (སྲེད་པ, sred pa), the eighth link, is a day for a bride, gathering wealth and trade; it is pictured as a drinker. New clothes, good at other times, are not put on today, and washing and shaving bring great fear.
reading.TwelveLinks.CRAVING.setting_out=east brings a need; south brings wealth with small sorrows; west, news of a death; north, unease
reading.TwelveLinks.CRAVING.birth=a child that lives through its ninth year, fifth month and the third or tenth day becomes a town's chief, with many children and much wealth, seldom ill and handsome, with many enemies and friends; it lives 84 years and dies of poison on grasping's day
reading.TwelveLinks.CRAVING.remedy=write the objects of desire on paper, put it into a brand of straw with the grains and silk and send it to a crossroads; raise red silk to the sky and burn fat
reading.TwelveLinks.GRASPING=The day of grasping (ལེན་པ, len pa), the ninth link, is a day for medicine, envoys and acting against enemies; it is pictured as a fruit-picker. Whatever else is begun bears no fruit. Washing the head brings good fortune and washing the body wealth, but new clothes shorten life.
reading.TwelveLinks.GRASPING.setting_out=east brings fear and west some fear; south brings beauty; north fulfils wishes
reading.TwelveLinks.GRASPING.birth=a child that lives through its ninth day, second month and eighth or ninth year is ugly and faint-hearted, deep, fond of guile, very lustful and breaks its vows; it lives 64 years and dies by water or leprosy in its own land on becoming's day
reading.TwelveLinks.GRASPING.remedy=lay a book of the dharma on a woollen cloth, a measure of white barley on it and a butter lamp in front, and burn incense
reading.TwelveLinks.BECOMING=The day of becoming (སྲིད་པ, srid pa), the tenth link, is a day for welcoming women and friends, and every other work goes well; it is pictured as a couple. Washing the head brings food and provisions, and washing the body beauty. New clothes are not worn, and quarrels are avoided.
reading.TwelveLinks.BECOMING.setting_out=east is futile and meets fear; south fulfils every wish; west brings great fear; north brings wealth
reading.TwelveLinks.BECOMING.birth=a child that lives through its ninth day, second or third month and ninth year lusts after others' wives, sleeps little and becomes a chief and a general, powerful and rich, skilled in the crafts, with two wives; it lives 60 years and dies by a weapon in a foreign land on birth's day
reading.TwelveLinks.BECOMING.remedy=make a beer-drinker of dough with the grains, silk, jewels and black cloth, and raise juniper
reading.TwelveLinks.BIRTH=The day of birth (སྐྱེ་བ, skye ba), the eleventh link, is a day for averting rites, a house and the affairs of state; it is pictured as a woman in childbirth. Washing the head brings honour and washing the body friends, but new clothes do not last.
reading.TwelveLinks.BIRTH.setting_out=east brings wealth soon lost; south brings pleasant news; west goes unharmed; north brings wealth
reading.TwelveLinks.BIRTH.birth=a child that lives through its ninth day, ninth month and tenth year is always sickly, keeps neither herds nor estate, and becomes a place of offering for others; it lives 60 years and dies by water on ageing and death's day
reading.TwelveLinks.BIRTH.remedy=make a woman in childbirth of clay; raise silk, the grains, medicines, twisted coloured wool and five arrows with silk together from above, and make a burnt offering (གསུར, gsur) of molasses
reading.TwelveLinks.AGEING_AND_DEATH=The day of ageing and death (རྒ་ཤི, rga shi), the last of the twelve links, is a day for taking in and for offerings; it is pictured as an old man. Washing the head brings clothes, food and drink, and washing the body much loss; new clothes do not last.
reading.TwelveLinks.AGEING_AND_DEATH.setting_out=east brings a quick return; south, friends and pleasant news; west, fright; north, ease
reading.TwelveLinks.AGEING_AND_DEATH.birth=a child that lives through its second day, first month and ninth year is much ill in childhood, the illness clearing as it grows; it is upright, loving to its kin, with many enemies; it lives 64 years and dies by a weapon on ignorance's day
reading.TwelveLinks.AGEING_AND_DEATH.remedy=make a figure of the enemy in dough with the words ageing and death put inside, wrap it in black cloth, bind it with the five precious things and press it under a hand-mill; raise yellow silk to the sky and read the great dhāraṇīs of power
reading.HundredFeet={0} The sun, Mars, Saturn and Rāhu are the malefics; the moon, Mercury, Jupiter and Venus are the benefics.
reading.HundredFeet.falls=each body's right fang (མཆེ་བ, mche ba) runs corner-wise across the wheel of the mansions' quarters, eighty-one cells, from the mansion the body stands in, and strikes the mansion it ends on
reading.Eclipse.MOON=A lunar eclipse (ཟླ་འཛིན, zla 'dzin): Rāhu (སྒྲ་གཅན, sgra gcan) seizes the moon at the full moon. Whatever is done today, good or bad, multiplies seventy million times, against a hundred times on the ordinary good days.
reading.Eclipse.MOON.falls=the full moon's moon, half a circle from the sun of the karaṇa reckoning (བྱེད་རྩིས, byed rtsis), within 57 chutsö (ཆུ་ཚོད, chu tshod) past Rāhu's head (གདོང, gdong), 50 before the head or the tail (དུས་མེ, dus me), or 45 past the tail
reading.Eclipse.SUN=A solar eclipse (ཉི་འཛིན, nyi 'dzin): Rāhu (སྒྲ་གཅན, sgra gcan) seizes the sun at the new moon. Whatever is done today, good or bad, multiplies a million million times, against a hundred times on the ordinary good days.
reading.Eclipse.SUN.falls=the new moon's sun of the karaṇa reckoning (བྱེད་རྩིས, byed rtsis) within 52 chutsö (ཆུ་ཚོད, chu tshod) past Rāhu's head (གདོང, gdong) or 5 before it, 7 past the tail (དུས་མེ, dus me) or 40 before it
reading.HourEarthLords=Yudzö Ngönmo (གཡུ་མཛོད་སྔོན་མོ, g.yu mdzod sngon mo) sits on this hour's place with the earth lords (ས་བདག, sa bdag) Khangtsek (ཁང་བརྩེགས, khang brtsegs) and Tsongön (མཚོ་སྔོན, mtsho sngon). Works for a bride, the dead and building go badly, and with Khangtsek storeyed houses and rows of seats. Yudzö Ngönmo takes offence at children and the keepers and bearers of the dead, the other two at the house's head and paternal kin.
reading.HourEarthLords.also_called=the god of the hours, Yudzö Ngönmo (གཡུ་མཛོད་སྔོན་མོ, g.yu mdzod sngon mo), man-bodied and tiger-headed
reading.HourEarthLords.remedy=if Yudzö Ngönmo (གཡུ་མཛོད་སྔོན་མོ, g.yu mdzod sngon mo) is harmed, recite the Eight Appearances of Heaven and Earth (སྣང་བརྒྱད, snang brgyad) and the White Parasol of the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor), and screen it with a blue silk banner and a copper digging tool; if the other two are, recite the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs), the Eight Appearances and the Collected Dhāraṇīs (གཟུངས་བསྡུས, gzungs bsdus)
reading.BlackHour=This is a black hour, the hour of a four-slayer (བཞི་གཤེད, bzhi gshed) of the date's animal: every important work goes badly in it. Fierce work that meets the hour strikes home.
reading.BlackHour.remedy=draw a swastika on the right of the door and the sun and moon on the left
wording.important_works=all important works
