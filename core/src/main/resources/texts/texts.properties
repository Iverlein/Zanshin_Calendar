reading.HourHidden=The hidden earth lords (གབ་པའི་ས་བདག, gab pa'i sa bdag), twelve, as the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) gives them for the year, month, day and hour of each animal, each on its animal's place: in the time of the mouse Nyentra (གཉན་ཁྲ, gnyan khra), of the ox Nyenjang (གཉན་ལྗང, gnyan ljang), of the tiger the garuda (བྱ་ཁྱུང, bya khyung), of the hare the yellow turtle (རུས་སྦལ་སེར་པོ, rus sbal ser po), of the dragon the yellow banner (བ་དན་སེར་པོ, ba dan ser po), of the snake Tsangkün (ཙང་ཀུན, tsang kun), of the horse Jilam (བྱི་ལམ, byi lam), of the sheep Bena Lakchen (བེ་སྣ་ལག་ཆེན, be sna lag chen), of the monkey Zikjuk (གཟིག་མཇུག, gzig mjug), of the bird Hetön (ཧེ་ཐོན, he thon), of the dog Jidur (བྱི་དུར, byi dur), of the pig Chukpo (ཕྱུག་པོ, phyug po). The hour's is reckoned as the month's. This hour's: {0}. They are fierce, and a corpse is not led their way; if one is harmed, the general remedies serve.
reading.HourGnamKhyi=The black sky dog (གནམ་ཁྱི་ནག་པོ, gnam khyi nag po) of the hour, as the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reckons it for the year, the month, the day and the hour alike by the new Chinese reckoning: its head lies on the place of the hour's own animal and its tail on the seventh from it, the body in order clockwise (ཆོས་སྐོར, chos skor), on through the animals, round the twelve places: 1 the head, 2 the mouth, 3 the throat (གྲེ་བ, gre ba) with the nam 'dzong (ནམ་འཛོང, nam 'dzong) below it, 4 the spro stod (སྤྲོ་སྟོད, spro stod), 5 the belly and the genitals, 6 the spang khung (སྤང་ཁུང, spang khung), 7 the tail, 8 the buttocks, 9 the lower back, 10 the shul pa (ཤུལ་པ, shul pa), 11 the upper back, 12 the neck. Generally rites, building forts, funerals and corpses, and above all a bride, are bad with it, and it takes offence at everyone, at corpse-bearers most. At the head no corpse or burial, no fort building and no army led out; a bride taken there loses her husband or harms both parents. At the mouth trade and sowing are bad, and a bride dies; at the throat paying out wealth; below the throat war and expelling are bad, though a bride's wishes are fulfilled; at the fourth place leading an army and mixing poison, though a bride has many sons and it is very good; at the belly a bride is bad for her father's line; at the genitals laying a house's foundation is avoided, and a bride turns wanton; at the sixth place moving a grave or a house is bad, and a bride bears dull children; at the tail removing a corpse, war and robbery are bad, and a bride's line is cut; at the buttocks stupas and forts are bad; at the lower back ploughing and virtuous work, and a bride is parted, though the authoritative texts call it good; at the tenth place seeking a grave site and great rites are bad, and a bride's parents die, though this too is said to bring good; at the upper back removing a corpse, forts and pursuing an aim are bad, and a bride is good; at the neck forts, stupas, building houses and weaving are bad, and a bride is bad for both families. If it is harmed, the remedies named include the sky dog's thread-cross (མདོས, mdos) and the White Parasol of the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor). The old Chinese reckoning lays the tail on the month's own animal and the head on the seventh; the White Beryl gives the new one for all four times.
reading.HourSaRgyalOther=The earth king (ས་རྒྱལ, sa rgyal) of the hour, the other way the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) gives: in each season-month it comes on one hour and one place, which is the course of Piling Parma (པི་ལིང་འཕར་མ, pi ling 'phar ma). In the first month of spring the snake hour on the upper south, the middle the horse hour on the monkey's place, the last the sheep hour on the pig's; in summer the monkey hour on the snake's, the bird hour on the pig's, the dog hour on the upper north; in autumn the pig hour on the dragon's, the mouse hour on the south-west, the ox hour on the dog's; in winter the tiger hour on the lower east, the hare hour on the lower south, the dragon hour on the bird's. The seasons are counted as the earth lords' chapter counts them, spring from the 11th month. Spectacles, corpse rites and building a fort are avoided, as with the earth king.
