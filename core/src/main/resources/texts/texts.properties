reading.DateSmeBa=The date's mewa (སྨེ་བ, sme ba) is one of the nine numbers of the magic square, each with its colour, and the almanac writes it under the date's trigram. The activity lists name works good and bad for each of the nine. These count after every other factor of the day, as the trigram's and the link's do.
reading.HundredFeet.DEATH=Today the fangs (མཆེ་བ, mche ba) of the hundred feet (རྐང་བརྒྱ, rkang brgya) threaten you with death. Three malefics strike your birth mansion, or malefics strike it, your place of work (ལས་ཀྱི་ས, las kyi sa) and the Destroyer (བི་ན་ཤ་ག, bi na sha ga) at once.
reading.HundredFeet.ILLNESS=Today the fangs (མཆེ་བ, mche ba) of two malefics of the hundred feet (རྐང་བརྒྱ, rkang brgya) strike your birth mansion: they bring illness.
reading.HundredFeet.AIMS_FAIL=Today the fang (མཆེ་བ, mche ba) of one malefic of the hundred feet (རྐང་བརྒྱ, rkang brgya) strikes your birth mansion: your aims fail.
reading.HundredFeet.EPIDEMIC=Today the fangs (མཆེ་བ, mche ba) of three benefics of the hundred feet (རྐང་བརྒྱ, rkang brgya) strike your birth mansion: they bring epidemics and loss of wealth.
reading.HundredFeet.WANT=Today the fangs (མཆེ་བ, mche ba) of one or two benefics of the hundred feet (རྐང་བརྒྱ, rkang brgya) strike your birth mansion: food and drink run short.
reading.Spear=The face-on (གདོང་ཚུགས, gdong tshugs) of a benefic falls on the moon's mansion today: the spear (མདུང་སྦྱོར, mdung sbyor), to be avoided. An enemy who comes wins, aims fail, the mind is troubled. {0}
reading.Spear.MERCURY=By Mercury a bride goes without food and drink.
reading.Spear.JUPITER=By Jupiter a bride's wealth declines, with suffering not known before.
reading.Spear.VENUS=By Venus a bride leaves her husband and shaves her head.
reading.Spear.setting_out=abroad, death within two months
reading.Spear.birth=the child soon dies
reading.GreatSpear=The face-on (གདོང་ཚུགས, gdong tshugs) of a malefic falls on the moon's mansion today: the great spear (མདུང་ཆེན, mdung chen), to be avoided. An enemy who comes wins, aims fail, the mind is troubled. {0}
reading.GreatSpear.SUN=By the sun a bride's husband dies.
reading.GreatSpear.MARS=By Mars a bride is childless, or her child dies.
reading.GreatSpear.SATURN=By Saturn a bride falls to selling herself.
reading.GreatSpear.RAHU=By Rāhu a bride is parted from friends and kin.
reading.GreatSpear.setting_out=abroad, death within two months
reading.GreatSpear.birth=the child soon dies

# The Health screen (SPEC §10.10, ROADMAP H1; docs/sources/health.md): the day's illness rows of the date,
# weekday and link, the element's mansions, the la, the year on the seven-red, the Four Tantras' humours and seasons
reading.LunarDate.1.illness=it answers a defiled hearth, felled trees and journeys early and late; the dremo (གྲེ་མོ, gre mo) and the nāgas (ཀླུ, klu) joined with the tsen (བཙན, btsan) harm; pain in the upper body, eye illness and an empty feeling inside; the rite named is a tsen thread-cross (བཙན་མདོས, btsan mdos)
reading.LunarDate.2.illness=it answers a grudge, food of the dead and impurity; the gods (ལྷ, lha), the gretsen (གྲེ་བཙན, gre btsan) and the earth lords (ས་བདག, sa bdag) harm; the stomach and liver are uneasy, with stabbing pains, swellings and lumps; worship the mamo (མ་མོ, ma mo) and make the rites of fulfilment and confession (བསྐང་བཤགས, bskang bshags)
reading.LunarDate.3.illness=it answers a hearth handled and burnt; the gods (ལྷ, lha), the gyalpo (རྒྱལ་པོ, rgyal po) and the drewo (གྲེ་བོ, gre bo) harm; weakness, a sickness within, pain in the kidneys and a dry mouth; make a smoke offering (བསང, bsang), an ablution and a water offering, and send a gyalpo thread-cross (རྒྱལ་མདོས, rgyal mdos)
reading.LunarDate.4.illness=it answers an oath, a house of mourning and a spoilt hearth; the gyengong (རྒྱལ་འགོང, rgyal 'gong), the dead and the earth lords (ས་བདག, sa bdag) harm; send a gyalpo thread-cross (རྒྱལ་མདོས, rgyal mdos) and one for the planets
reading.LunarDate.5.illness=it answers food from a house of mourning; the chest and back are hot and the throat dry; female demons, demons of lust and the earth lords (ས་བདག, sa bdag) harm; make an ablution and send a thread-cross (མདོས, mdos) for the nyen (གཉན, gnyan) and one for the earth lords
reading.LunarDate.6.illness=it answers a journey; the gretsen (གྲེ་བཙན, gre btsan), curses and the protectors harm; stabbing pain in the lungs, madness and fainting, vomiting and fever; send the tsen's and the crowd's thread-crosses (མདོས, mdos) and worship the war god
reading.LunarDate.7.illness=it answers a bad direction and food of meat and butter; pains in the breasts, the liver and the ribs; the nāgas (ཀླུ, klu) harm; send the general thread-cross (མདོས, mdos), worship the nāgas and strike the dremo (གྲེ་མོ, gre mo)
reading.LunarDate.8.illness=eye illness, pain in the kidneys and the waist, and the heart wind rises; the temple's protectors and the gyalpo (རྒྱལ་པོ, rgyal po) harm; send a gyalpo thread-cross (རྒྱལ་མདོས, rgyal mdos); today is one of the four perilous days, when falling ill, gatherings and any great or fierce work are bad
