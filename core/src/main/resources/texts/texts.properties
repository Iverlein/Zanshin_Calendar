reading.HourBlaMkhyen=The astrologer spirit (བླ་མཁྱེན, bla mkhyen) of the hour, as the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) places it: on the luck (ཀླུང་རྟ, klung rta) of the hour's triad, as the year's is on the year's. The White Beryl names each triad's luck: the tiger, horse and dog's the iron monkey, the pig, sheep and hare's the fire snake, the mouse, dragon and monkey's the wood tiger, the bird, ox and snake's the water pig, each on its animal's place, the monkey's the upper west, the snake's the upper south, the tiger's the upper east, the pig's the upper north. What is avoided towards it, whom it harms and its remedy are the year's: it takes offence at astrologers, at the head of the household and at vajra masters; if it is harmed, a torma (གཏོར་མ, gtor ma) is sent in its direction and five texts are recited, the White Parasol of the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor), the Eight Appearances of Heaven and Earth (སྣང་བརྒྱད, snang brgyad), Reciting the Names of Mañjuśrī (མཚན་བརྗོད, mtshan brjod), the Collected Dhāraṇīs (གཟུངས་བསྡུས, gzungs bsdus) and the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs).
reading.HourSaRgyal=The earth king (ས་རྒྱལ, sa rgyal) of the hour, as the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) places it: on the four-slayer (བཞི་གཤེད, bzhi gshed) in front of the hour. The White Beryl counts an animal's four-slayers upwards and downwards, the mouse's upward one the hare and its downward one the bird; the one in front is the upward, three animals on: in the mouse hour on the hare, as the Clear Jewel Mirror of Elemental Reckoning (འབྲས་རྩིས་རབ་གསལ་ནོར་བུའི་མེ་ལོང, 'bras rtsis rab gsal nor bu'i me long) works it, and in the hare hour on the horse's place. Spectacles, corpse rites and building a fort are avoided; if it is harmed, it is bad for the chief and the lord of the land, and one who did the corpse rites dies before long. The text names no remedy for it, but empowerment, the generation and completion stages and a great gathering of offerings (ཚོགས, tshogs) are done. Another way, which some give, sets it by the season-month on one hour and place each, the course of Piling Parma (པི་ལིང་འཕར་མ, pi ling 'phar ma), which the app does not follow.
