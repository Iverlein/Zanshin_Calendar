reading.YearDecline.VITALITY={0} With the vitality in one of the bad sectors, in decline: deaths come two by two and losses two by two. Draw the life out, give up taking life, and ransom death and the la, the life-spirit (བླ, bla), with rites of long life and prosperity.
reading.YearDecline.BODY={0} With the body in one of the bad sectors, in decline: grief, wounds and stiff joints may come. Send a dog's carcass away as an effigy, towards a good direction.
reading.YearDecline.DESTINY={0} With the destiny in one of the bad sectors, in decline: wealth is lost, the horse you ride dies, children are hard to raise, and enemies, robbers and thieves come. Press down the spirits of loss and of enmity, and give a feast to those who cannot repay it.
reading.YearDecline.LUCK={0} With the luck in one of the bad sectors, in decline: blame without fault, and sudden blows on high ground and low. Mend paths and narrow ways, make clay votive images (ཚ་ཚ, tsha tsha) and press down the spirits of enmity.
reading.Harsh.COMBINED_NINE.EARTH.1=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For earth and water, the first: demons (བདུད, bdud) strike; make the rite that turns the demons' face.
reading.Harsh.COMBINED_NINE.EARTH.2=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For earth and water, the second: a time of sudden fright; offer a hundred portions of meat and a hundred of dough.
reading.Harsh.COMBINED_NINE.EARTH.3=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For earth and water, the third: the turquoise elephant runs wild, and epidemics come to those around you; purifying ablutions and the Uṣṇīṣa.
reading.Harsh.COMBINED_NINE.EARTH.4=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For earth and water, the fourth: the blue turquoise rock cracks; for a man a face of enemies and thieves; turn back, crush and press down enemies, with dhāraṇīs and many clay votive images (ཚ་ཚ, tsha tsha).
reading.Harsh.COMBINED_NINE.EARTH.5=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For earth and water, the fifth: the golden tree falls, bad for the elders of the father's line; ransom the la, the life-spirit (བླ, bla), recite the long-life sūtras and ransom life.
reading.Harsh.COMBINED_NINE.WOOD.1=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For wood, the first: a bird alights on a spear-tip, and a man goes into enemy hands; turn back, crush and press down enemies.
reading.Harsh.COMBINED_NINE.WOOD.2=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For wood, the second: two demons (བདུད, bdud) and two men fight, bad for those close to you; avert the demons' misfortune.
reading.Harsh.COMBINED_NINE.WOOD.3=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For wood, the third: the arrow breaks at the waist, harsh for sons, grandsons and teachers; give a ransom (གླུད, glud) and honour the four orders of monks.
reading.Harsh.COMBINED_NINE.WOOD.4=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For wood, the fourth: the arrow goes under the earth, and earth lords (ས་བདག, sa bdag) and earth spirits rise, bad for the lama and the father's kin; water tormas (གཏོར་མ, gtor ma) and the Golden Light.
reading.Harsh.COMBINED_NINE.WOOD.5=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For wood, the fifth: the vulture falls on the plain, a time of gossip and talk; drive out goblins and press down gossip.
reading.Harsh.COMBINED_NINE.FIRE.1=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For fire, the first: demons (བདུད, bdud) cast misfortune and throw the pebble of the dead, bad for the one it falls on; avert the demons, send a zor (ཟོར, zor) thread-cross (མདོས, mdos) and recite the Avataṃsaka.
reading.Harsh.COMBINED_NINE.FIRE.2=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For fire, the second: the sorcery of priests harms and a sudden fierce illness comes; the hundredfold rite, with a hundred portions of meat and of dough.
reading.Harsh.COMBINED_NINE.FIRE.3=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For fire, the third: the child falls from the lap, and small children fall fiercely ill; give a small ransom (གླུད, glud) and press down the spirits.
reading.Harsh.COMBINED_NINE.FIRE.4=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For fire, the fourth: enemies are met, with a face of disputes; turn back enemies and press down their spirits.
reading.Harsh.COMBINED_NINE.FIRE.5=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For fire, the fifth: the arrow of life breaks at the joint, with fierce illness and much gossip; recite the Dhvajāgra and call long life and prosperity.
reading.Harsh.COMBINED_NINE.IRON.1=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For iron, the first: gold comes out from under the ground, yet wealth may run empty; call prosperity, press down the spirits of loss and give a feast for children.
reading.Harsh.COMBINED_NINE.IRON.2=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For iron, the second: a load you cannot carry, great lawsuits and enemies to be paid off; strong averting rites with tormas (གཏོར་མ, gtor ma).
reading.Harsh.COMBINED_NINE.IRON.3=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For iron, the third: the golden yoke breaks, and great men rise as enemies; drive out misfortune and make the rite of the male god.
reading.Harsh.COMBINED_NINE.IRON.4=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For iron, the fourth: the demons' (བདུད, bdud) noose strikes, a harsh time for those around you; averting tormas (གཏོར་མ, gtor ma).
reading.Harsh.COMBINED_NINE.IRON.5=The combined nine-multiple: counted up from each element's key (earth and water from the wood mouse, wood from the fire hare, fire from the iron horse, iron from the water bird), every aspect of your birth year reaches its tomb in the 9th, 21st, 33rd, 45th, 57th, 69th and 81st years, and the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads each by its element; the 6th and 7th read as the 1st and 2nd. For iron, the fifth: the house of the tomb; death and loss for you or the kin of father or mother, little merit, or upheavals; ransoms (གླུད, glud), thread-crosses (མདོས, mdos) to the lake goddesses and water offerings free you.
reading.Harsh.NINE_TOMB=Your nine-multiple meets the tomb this year (by your birth animal and gender, p. 410): very harmful, as if you entered the tomb yourself. Give tormas (གཏོར་མ, gtor ma), offerings to the earth and a feast to all the lords of the charnel ground, and seal the tomb's mouth (p. 415).
reading.Harsh.TRIGRAM_NINE=Your trigram of the year is back on where it started, the fire trigram (ལི, li) for a man or the water trigram (ཁམ, kham) for a woman: the trigram's nine-multiple (p. 413). The remedies of the nine-multiples (p. 414): lamps, food offerings to the gods, clay votive images (ཚ་ཚ, tsha tsha), the Uṣṇīṣa and water tormas (གཏོར་མ, gtor ma), nine of each; an arrow for a man, a spindle for a woman; nine stones piled with nine prostrations, saying "freed from the nine-multiple of illness and death".
reading.Harsh.MEWA_NINE=Your mewa (སྨེ་བ, sme ba) of the year is back in the middle, on your natal mewa: the mewa's nine-multiple (p. 413). The remedies of the nine-multiples (p. 414): lamps, food offerings to the gods, clay votive images (ཚ་ཚ, tsha tsha), the Uṣṇīṣa and water tormas (གཏོར་མ, gtor ma), nine of each; an arrow for a man, a spindle for a woman; nine stones piled with nine prostrations, saying "freed from the nine-multiple of illness and death".
reading.Harsh.TOMB_OWN_GREAT=The present year is the great tomb of your birth year's element, the tomb animal in your own element: of the eighty tomb houses, your own tomb, the greater (p. 412); entering the tomb is the great penalty (p. 258). Remedies (p. 415): be drawn out of the tomb, offer at the tombs and seal their mouth, and the great rites that ransom death.
reading.Harsh.TOMB_OWN_SMALL=The present year is the small tomb of your birth year's element, the seventh from the great (p. 412). Remedies (p. 415): be drawn out of the tomb, offer at the tombs and seal their mouth, and the great rites that ransom death.
reading.Harsh.TOMB_SLAYER_GREAT=The present year is the great tomb of the element that slays yours, its tomb animal in that element (p. 412). Remedies (p. 415): be drawn out of the tomb, offer at the tombs and seal their mouth, and the great rites that ransom death.
reading.Harsh.TOMB_SLAYER_SMALL=The present year is the small tomb of the element that slays yours, the seventh from its great (p. 412). Remedies (p. 415): be drawn out of the tomb, offer at the tombs and seal their mouth, and the great rites that ransom death.
reading.Harsh.BLACK_UNDERTAKER=Your great tomb is one of the four black undertakers, the water dragon, the wood sheep, the fire dog and the iron ox: when one's own element's tomb rises as one of them, it is bad (p. 412).
reading.Harsh.LOG_MEN_TOMB=Your progressed sign (ལོག་མེན, log men) stands on one of your four tomb years: slightly bad (p. 412).
reading.Harsh.TOMB_SIGN=Your trigram of the year stands on the tomb trigram of your vitality: for wood the earth trigram (ཁོན, khon), for fire the sky trigram (ཁེན, khen), for iron the mountain trigram (གིན, gin), for earth and water the wind trigram (ཟོན, zon); you fall into the tomb sign (p. 415). Remedies: be drawn out of the tomb sign, offer at the tombs and seal their mouth, the rite of the three bones and the great rites that ransom death.
reading.MewaObstacle.SKY_DOOR=It falls on the mewa's sky door, the six-white for a man, the one-white for a woman (p. 409). The White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads the sky door with the progressed sign (p. 387): a plague may come down from the sky; close the sky door with its rite, swear no oaths, and beware of lightning and the hearth.
reading.MewaObstacle.EARTH_DOOR=It falls on the mewa's earth door, the two-black for a man, the four-green for a woman (p. 409). The White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reads the earth door with the progressed sign (p. 387): spirits of ruin rise and harm comes from low ground; lay no foundations and dig no earth, and close the earth door.
SunTermKind.DBUGS_THOB=breath term
SunTermKind.KHYIM_PHO=sign entry
SunTermKind.SGANG=middle term
reading.SunTerm=The almanac writes the sun's terms on the date they fall in, and one that comes before daybreak on the date before, as the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) reckons them in its fifteenth chapter. Each term has its measure, a place of the true sun counted in mansions and chutsö (ཆུ་ཚོད, chu tshod), and falls when the sun reaches it. The sun is the almanac's own, taken at the end of each lunar date; where it has passed the measure at a date's end, the excess, its chutsö multiplied by fourteen as the chapter says, is taken in chutsö from the date's end, which can carry the term into the day before. The time is rough, counted in chutsö of 24 minutes from daybreak at 5 o'clock. {0} The White Beryl leaves either custom open, the present one or the earlier, which reckoned the terms from the mean sun; the app keeps the measures it lists. It names no works for them.
reading.SunTerm.DBUGS_THOB=The breath term (དབུགས་ཐོབ, dbugs thob) is the first of each month's two terms: the chapter lists one for each Hor month, the 3rd month's at 26 mansions 28 chutsö, each a twelfth of the sun's course after the one before, with the signs of the season, such as the cuckoo coming with the 4th month's.
reading.SunTerm.KHYIM_PHO=The sign entry (ཁྱིམ་འཕོ, khyim 'pho) is the sun passing into the next of the twelve signs, every 2 mansions 15 chutsö of its course; it enters Aries when the round of the mansions is complete, and the almanac writes the sign's name on the date.
reading.SunTerm.SGANG=The middle term (སྒང, sgang) of each Hor month comes a little over a mansion after its breath term: the 3rd month's at 36 chutsö into the first mansion. The chapter calls the 5th month's the summer solstice and the 11th month's the winter solstice, and gives day and night as equal at the 2nd's and the 8th's; it adds that the fine solstice for Tibet is reckoned apart.
reading.HourEarthLords=The earth lords (ས་བདག, sa bdag) of the hour, as the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) gives them after those that move by date. Yudzö Ngönmo (གཡུ་མཛོད་སྔོན་མོ, g.yu mdzod sngon mo), the god of the hours, man-bodied and tiger-headed, stays outside, turns to the left and sits on the place of whatever hour it is: at dawn, in the tiger hour, on the tiger's, the upper east, and so on round in order. The earth lords Khangtsek (ཁང་བརྩེགས, khang brtsegs) and Tsongön (མཚོ་སྔོན, mtsho sngon) likewise keep each to its hour's place. With Yudzö Ngönmo sending or receiving a bride, the rites for a corpse, the hearth, burial, building a fort and moving house are bad; with Khangtsek rites, storeyed houses and rows of seats are avoided; with Tsongön a bride and work with a corpse are bad. Yudzö Ngönmo takes offence at children and at those who keep or carry the dead; if it is harmed, the remedy is to recite the Eight Appearances of Heaven and Earth (སྣང་བརྒྱད, snang brgyad) and the White Parasol of the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor), among others, and to screen it, to set up a blue silk banner and a copper digging tool. The other two take offence at the head of the household and the father's kin; if they are harmed, recite the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs), the Eight Appearances and the Collected Dhāraṇīs (གཟུངས་བསྡུས, gzungs bsdus).
reading.BlackHour=A black hour: as the black days meet the month with the date, the black hours meet the date with the hour, the hour of the four-slayer (བཞི་གཤེད, bzhi gshed) of the date's animal, three either side of it; on a mouse or horse day the bird and hare hours are black. The White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) calls every important work bad in it: a grave site, building a fort, feasts, consecration, enthronement, teaching the dharma, taking a new land, a bride. Fierce work that meets the hour strikes home. The remedy is to draw a swastika on the right of the door and the sun and moon on the left.
