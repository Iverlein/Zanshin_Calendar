# Zanshin Calendar — text of the engines and readings (SPEC §8.2), English.
# The source language: every translation (texts_<language>.properties) has the
# same keys. Keys: <Term>.<NAME> for the name of a term, reading.* for readings,
# wording.* for the wordings of the "good for" and "avoid" lists. {0}, {1} are
# filled in by the app. Tibetan and Japanese terms, Wylie, phonetics and romaji
# are not here: they are not translated.
# Readings are summaries of their cited sources: a translation is checked
# against the source, not only against this English (ROADMAP L3).

