reading.ElementQuarter.OWN=Today's mansion is one of your own: it stands in the quarter of the sky whose element is that of your life force (སྲོག, srog). These mansions are also called the mansions of power and of the la, the life-spirit (བླ, bla). On them work and undertakings succeed, and anything is good.
reading.ElementQuarter.MOTHER=Today's mansion stands in the quarter of the element that gives birth to your own, counted from the life force (སྲོག, srog) of your birth year, as water gives birth to wood. The mansions of the mother and of the friend are good.
reading.ElementQuarter.FRIEND=Today's mansion stands in the quarter of the element your own overcomes, counted from the life force (སྲོག, srog) of your birth year, as wood overcomes earth. The mansions of the mother and of the friend are good.
reading.ElementQuarter.CHILD=Today's mansion stands in the quarter of the element your own gives birth to, counted from the life force (སྲོག, srog) of your birth year, as wood gives birth to fire. The child's mansions are middling.
reading.ElementQuarter.ENEMY=Today's mansion stands in the quarter of the element that overcomes your own, counted from the life force (སྲོག, srog) of your birth year, as iron overcomes wood. Unlike the enemy's weekday, on which every work is to be avoided, the enemy's mansions have no reading of their own.
reading.GraveMansion.GREAT=Today's mansion is the great grave mansion (དུར་སྐར, dur skar) of your element, counted from the life force (སྲོག, srog) of your birth year. The grave mansions are reckoned for the dead, at funerals; for the living they have no reading of their own.
reading.GraveMansion.SMALL=Today's mansion is the small grave mansion (དུར་སྐར, dur skar) of your element, counted from the life force (སྲོག, srog) of your birth year. The grave mansions are reckoned for the dead, at funerals; for the living they have no reading of their own.
reading.LaElement=The la, the life-spirit (བླ, bla), is reckoned as the mother of the life force (སྲོག, srog): its element gives birth to the life force's, water to wood, fire to earth. The life force is that of the birth year's animal: tiger and hare wood, horse and snake fire, bird and monkey iron, mouse and pig water, the other four earth.
reading.LaHours=Within any day the la, the life-spirit (བླ, bla), moves through the body: from both feet at daybreak up to the middle of the chest at noon, down to both feet again at sunset, and through the night it is spread above the navel. Where it stands, bloodletting, moxibustion and other treatment are avoided.
reading.SevenRedYear=Your year of age falls on the seven-red, the mirror of the tsen (བཙན, btsan): stabbing pains, blood and bile illness, swellings and fever come. In one reckoning bloodletting and moxa are avoided this year, in another they will be done on the body; take no life, beware of illness and make a tsen thread-cross (བཙན་མདོས, btsan mdos).
reading.Humour.WIND=Wind (རླུང, rlung) illness rises in summer, in the evening and before dawn. The old are wind people, and a cold, windy place is wind's country. For wind illness, keep to a warm place and pleasant company.
reading.Humour.BILE=Bile (མཁྲིས་པ, mkhris pa) illness rises in autumn, at midday and at midnight. Adults are bile people, and a dry, very hot place is bile's country. For bile illness, stay at ease in a cool place.
reading.Humour.PHLEGM=Phlegm (བད་ཀན, bad kan) illness rises in spring, at dusk and in the morning. Children are phlegm people, and a damp, oily place is phlegm's country. For phlegm illness, exert yourself and keep to a warm place.
reading.ElementIllness={0} However many kinds of illness are told, they gather into the five elements: wood is wind, fire blood, earth bile, iron phlegm and water cold, and each element's illness has its seat, its door and its signs.
reading.ElementIllness.WOOD=An illness of wood is wind's (རླུང, rlung). It lies in the waist outwardly and in the stomach and liver within, and its door is the eye: once it has entered, clouds come into the eye, which turns red, and black plaque forms on the teeth. Its sick keep away from loose, torn ground, crevices, a draughty house and forest.
reading.ElementIllness.WOOD.illness=taken hold at wood's time: the heart is unhappy, with stomach illness, vomiting and diarrhoea and swelling; wind and phlegm (བད་ཀན, bad kan) are the greater share
reading.ElementIllness.FIRE=An illness of fire is blood's. It lies in the upper body outwardly and in the heart and bowels within, and its door is the tongue: once it has entered, the root of the tongue and the teeth turn black and the tongue dries. Its sick keep away from rough red ground with thorns that faces the sun.
reading.ElementIllness.FIRE.illness=taken hold at fire's time: the mouth is dry and the chest and back ache; bile (མཁྲིས་པ, mkhris pa), stupor and phlegm (བད་ཀན, bad kan) arise, and it is known as a hot illness
reading.ElementIllness.EARTH=An illness of earth is bile's (མཁྲིས་པ, mkhris pa). It lies in the head and limbs outwardly and in the spleen and intestines within, and its door is the lips: once it has entered, the lips swell and flake. Those with phlegm (བད་ཀན, bad kan) and bile keep away from level, yellow, heavy ground.
reading.ElementIllness.EARTH.illness=taken hold at earth's time: heaviness, dizziness and a weak mouth, the rotting kind of illness, burning and pain; easier by day, while at night stupor and bile (མཁྲིས་པ, mkhris pa) rise
reading.ElementIllness.IRON=An illness of iron is phlegm's (བད་ཀན, bad kan). It moves in the bones outwardly and lies in the lungs within, and its door is the nose: once it has entered, the nose is blocked and pus and yellow water drip. Those with bad wind (རླུང, rlung) keep away from shaded holes, cliffs and ruined walls.
reading.ElementIllness.IRON.illness=taken hold at iron's time: the body is heavy and the upper body uneasy, heat pinches the vessels and pus comes, with anger and desire, or phlegm (བད་ཀན, bad kan) alone
reading.ElementIllness.WATER=An illness of water is cold. It lies below the navel outwardly and in the kidneys within, and its door is the ear: once it has entered, the ear weeps, with pus and flaking. Its sick keep away from soft, dark hollows, damp ground, swamps and rivers, where cold grows.
reading.ElementIllness.WATER.illness=taken hold at water's time: body and limbs are stiff or tremble, or the body is tender; vomiting and an unhappy heart, yellow water, cold and illness of the vessels
reading.MedicalSeason.EARLY_WINTER=In early winter (དགུན་སྟོད, dgun stod) the cold closes the pores and the digestive heat grows strong, and too little food wears the body down. Take sweet, sour and salty food, meat broth and fat; anoint yourself with sesame oil, wear skins and boots, warm yourself by fire and sun, and keep to an inner room.
reading.MedicalSeason.LATE_WINTER=Late winter (དགུན་སྨད, dgun smad) is colder still, and the conduct of early winter is praised for it too: sweet, sour and salty food, meat broth and fat, sesame oil, skins and boots, the warmth of fire and sun and an inner room. Through the winter phlegm gathers in the body.
reading.MedicalSeason.SPRING=In spring (དཔྱིད་ཀ, dpyid ka) the phlegm gathered in winter rises as the sun's warmth weakens the digestive heat. Take bitter, pungent and astringent food, old barley, meat of dry country and honey, boiled water and ginger broth; drive the phlegm out by exercise and rubbing, and sit in the shade of a fragrant garden.
reading.MedicalSeason.SO_GA=In early summer (སོ་ག, so ga) the very hot sun steals strength. Eat sweet, light, oily and cool food, and give up salty, hot and sour food, exertion and the sun; wash in cool water, drink beer cut with water, wear thin clothes and keep to cool, fragrant rooms, shade and breezes.
reading.MedicalSeason.SUMMER=In summer (དབྱར, dbyar), the rains, clouds and rain, wind and cold, the earth's vapour and muddy water harm the digestive heat. Take sweet, sour and salty food, light, warm and oily, and beer of dry country; live upstairs, away from the cool. Through the rains bile gathers in the body.
reading.MedicalSeason.AUTUMN=In autumn (སྟོན་ཀ, ston ka) the bile gathered in the rains rises. Take sweet, bitter and astringent food, wear clothes scented with camphor, sandalwood and khus grass, and live in houses sprinkled with water. Purgation in autumn and emesis in spring are praised, and a mild enema in summer.

# The year of age's readings that need a relative's signs (ROADMAP P2, SPEC §5.9.1): the natal trigram
# (WB vol. 1, ch. 22, pp. 261, 286–288; the Moonbeams, f. 9a) and chapter 24's obstacles with a spouse,
# a parent or a son (pp. 388, 390, 409; the notes, vol. 2, p. 492); docs/sources/year-of-life.md, RD13–RD14
KinObstacle.LOG_MEN_ON_WIFE=progressed sign on the wife's year
KinObstacle.LOG_MEN_ON_HUSBAND=progressed sign on the husband's year
KinObstacle.LOG_MEN_ON_FATHER=progressed sign on the father's year
KinObstacle.LOG_MEN_ON_SON=progressed sign on the son's year
KinObstacle.LOG_MEN_ON_DEATH=progressed sign on a parent's death
KinObstacle.SPOUSES=spouses' obstacle
KinObstacle.BRIDGE_END=bridge's end
KinObstacle.SECRET=secret obstacle
KinObstacle.SPOUSES_TWO_BLACK=spouses on the two-black
reading.NatalTrigram={0} The natal trigram (སྐྱེས་སྤར, skyes spar) is the trigram the mother stands on in the year of the birth, the mother's luck (མ་ཀླུང, ma klung). It tells of the forefathers' fault, the nature of the one born on it, and the gods and spirits that go with them.
reading.NatalTrigram.LI=Born on the fire trigram (ལི, li), the place of blades and the hearth, one loves gossip, takes the father's seat and is blamed without fault. The forefathers flourished, then split into four or five lines, and many fell by the blade. The family's land and tombs face south and west.
reading.NatalTrigram.LI.spirits=the gyalpo (རྒྱལ་པོ, rgyal po), the tsen (བཙན, btsan) and the demons (བདུད, bdud) lead as its gods; the gongpo spirits (འགོང་པོ, 'gong po) harm, and the harm of the earth lords (ས་བདག, sa bdag) is hard to turn back
reading.NatalTrigram.LI.illness=faults of the head and the senses; for a man signs of blood, for a woman miscarriage and a child's death; nyen (གཉན, gnyan) illness from grudges over the hearth, and great faults in the children
reading.NatalTrigram.KHON=Born on the earth trigram (ཁོན, khon), the place of the tomb spirit, one speaks softly but is proud and fierce, rich early and poor late. A fault in laying the forefathers' tomb, two generations back, brought great loss. Children are hard to raise, and corpses and impurity call for care.
reading.NatalTrigram.KHON.spirits=black-brown nāga (ཀླུ, klu) goddesses lead as its gods; the earth lords (ས་བདག, sa bdag) and the nāga women harm
reading.NatalTrigram.KHON.illness=a line foolish and mute and at odds with the nāgas (ཀླུ, klu), hunchbacked and lame; deaths by the blade; grudges and illness, and curses that come fast
reading.NatalTrigram.DWA=Born on the lake trigram (དྭ, dwa), the place of the blade of kin-killing (དམེ, dme), one is kind but quick to anger, bold and brave, and gains in learning. Three or four generations back, the forefathers killed by foul means and took in one polluted by it. Wealth runs thin, and an oath broken on the mother's side costs land.
reading.NatalTrigram.DWA.spirits=the tsen (བཙན, btsan) lead as its gods; the drewo (གྲེ་བོ, gre bo) harm
reading.NatalTrigram.DWA.illness=stabbing pains, and a death by the blade
reading.NatalTrigram.KHEN=Born on the sky trigram (ཁེན, khen), the place of the lame and of loss, one is proud and clever but seldom satisfied, however hard one strives. Among the forefathers, two or four generations back, were hunchbacks, the lame and the mute. The home moves, joy is lost more than people, and a few enemies appear.
reading.NatalTrigram.KHEN.spirits=the gongpo spirits (འགོང་པོ, 'gong po) lead as its gods; the gyalpo (རྒྱལ་པོ, rgyal po) harm
reading.NatalTrigram.KHAM=Born on the water trigram (ཁམ, kham), the place of impurity and black gifts, one is quick to suffer, hard to agree with, troubled within and smooth without. Four or five generations back, the forefathers lost one of theirs to others or took one in through incest. The father's name stands low, the brothers' high, and daughters-in-law leave.
reading.NatalTrigram.KHAM.spirits=the nāgas (ཀླུ, klu), the tsen (བཙན, btsan), the white goddesses and the mamo (མ་མོ, ma mo) lead as its gods; the senmo (བསེན་མོ, bsen mo) harm
reading.NatalTrigram.GIN=Born on the mountain trigram (གིན, gin), the place of the earth lords (ས་བདག, sa bdag) and the hearth, one is stubborn, heavy, and of few and firm words. Two or three generations back, forefathers died of leprosy, of nyen (གཉན, gnyan) illness, or by the blade through the hearth. The line runs thin, one father to one son.
reading.NatalTrigram.GIN.spirits=the fierce war gods (དགྲ་ལྷ, dgra lha) and Yama's host (གཤིན་རྗེ, gshin rje) lead as its gods; the earth lords (ས་བདག, sa bdag) harm
reading.NatalTrigram.ZIN=Born on the thunder trigram (ཟིན, zin), the place of the cut line and the foundation spirit (རྨང་འདྲེ, rmang 'dre), one is skilled and crafty, reckless and mean at home. Children and wealth come with great power. One or three generations back, a nyen (གཉན, gnyan) tree was felled, and many died by wood and the blade.
reading.NatalTrigram.ZIN.spirits=the nāgas (ཀླུ, klu), the demons (བདུད, bdud) and the local lords lead as its gods; the foundation spirit (རྨང་འདྲེ, rmang 'dre) harms
reading.NatalTrigram.ZON=Born on the wind trigram (ཟོན, zon), the place of the sorcery spirit (རྦད་འདྲེ, rbad 'dre) and the nāgas (ཀླུ, klu), one loves scorn and anger and strives to equal the high. Two or four generations back, the forefathers quarrelled with a master or sent sorcery spirits, and madness and violent deaths followed. The line is now very thin.
reading.NatalTrigram.ZON.spirits=the men (སྨན, sman) lead as its gods; the gyalpo (རྒྱལ་པོ, rgyal po) and the gongpo spirits (འགོང་པོ, 'gong po) harm
reading.NatalTrigram.ZON.illness=sudden illness at the end of life
reading.KinObstacle={0} These obstacles of the year of age come from another's signs: a spouse's, a parent's or a son's birth year, the year a parent died, or the mother's trigram at the birth.
reading.KinObstacle.LOG_MEN_ON_WIFE=The husband's progressed sign (ལོག་མེན, log men) stands on the wife's birth year. It bodes ill for the wife, and its image is "gone into the trap".
reading.KinObstacle.LOG_MEN_ON_HUSBAND=The wife's progressed sign (ལོག་མེན, log men) stands on the husband's birth year. It bodes ill for the husband, and its image is "wearing the demon's hat".
reading.KinObstacle.LOG_MEN_ON_FATHER=The son's progressed sign (ལོག་མེན, log men) stands on the father's birth year. It bodes ill for the father, and its image is "leading the ghost".
reading.KinObstacle.LOG_MEN_ON_SON=The father's progressed sign (ལོག་མེན, log men) stands on the son's birth year. It bodes ill for the son, and its image is "the father holding the son's corpse".
reading.KinObstacle.LOG_MEN_ON_DEATH=The progressed sign (ལོག་མེན, log men) stands on the year in which the father or the mother died. It bodes ill, and its image is "gone into the existence of the dead".
reading.KinObstacle.SPOUSES=Husband and wife stand on one trigram (སྤར་ཁ, spar kha) of the year: the harsh year of spouses (བཟའ་ཤུག, bza' shug), a time when joy and sorrow both come. It helps if the one with the attachment goes away from home.
reading.KinObstacle.SPOUSES.remedy=make the trigram's and the mewa's (སྨེ་བ, sme ba) rites, pay the tax of the dead and do the rite of taking out the corpse
reading.KinObstacle.BRIDGE_END=Two of one household who are not husband and wife stand on one trigram (སྤར་ཁ, spar kha) of the year. No harsh year of spouses (བཟའ་ཤུག, bza' shug) falls between them, only the lesser fault of the bridge's end (ཟམ་ཐུག, zam thug).
reading.KinObstacle.SECRET=The trigram (སྤར་ཁ, spar kha) of the year has come onto the natal trigram: the secret obstacle (གསང་ཀེག, gsang keg), the thief, hard to notice. Fright, sudden epidemics and disputes come, and an illness of body or mind is certain.
reading.KinObstacle.SECRET.remedy=go to no sick person's pillow, do not mourn and keep from oaths; recite the Sūtra of Amitāyus a hundred thousand times and send the demon's thread-cross (མདོས, mdos)
reading.KinObstacle.SECRET.rites=while the mother lives, the trigram's and the mewa's (སྨེ་བ, sme ba) rites suited to her luck; after her death, a luck rite with merit made for her and her name card
reading.KinObstacle.SPOUSES_TWO_BLACK=Husband and wife both stand on the two-black mewa (སྨེ་བ, sme ba) of the year. It bodes ill for both, a year to beware, and its image is "holding the corpse, shoulder and fang exchanged".
# The birth reckoning (ROADMAP R2, SPEC §5.9.2): the five children by the natal trigram (WB vol. 1, ch. 22, p. 294)
# and the parents' trigrams at the birth (p. 326); docs/sources/year-of-life.md, RD13
BirthChild.PARENTS_GOD=the parents' god
BirthChild.CHILDRENS_GLORY=the children's glory
BirthChild.LIFE=harmony that is life
BirthChild.SPIRIT=a spirit that can be survived
BirthChild.DEMON=a demon that cannot be survived
reading.BirthChild={0} The element of the natal trigram (སྐྱེས་སྤར, skyes spar), set against the life force (སྲོག, srog) of the birth year, tells which of five the one born is.
reading.BirthChild.PARENTS_GOD=Born on the trigram of the life force's mother, one is the parents' god (ཕ་མ་ལྷ, pha ma lha). Its image is the sun of life risen.
reading.BirthChild.CHILDRENS_GLORY=Born on the trigram of the life force's son, one is the children's glory (བུ་ཚ་དཔལ, bu tsha dpal). Its image is a sun without clouds.
reading.BirthChild.LIFE=Born on a trigram of the life force's own element, one is harmony that is life (མཐུན་པ་ཚེ, mthun pa tshe). Its image is a sun moved by the wind, a middling share of life.
reading.BirthChild.SPIRIT=Born on the trigram of the element the life force overcomes, one is a spirit that can be survived (ཐུབ་པ་འདྲེ, thub pa 'dre). Its image is a clouded sun.
reading.BirthChild.DEMON.WOOD=Born on the trigram of the life force's enemy, one is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud). Its image is the sun set, the share of life cut: for the tiger and hare years, death at fifteen.
reading.BirthChild.DEMON.IRON=Born on the trigram of the life force's enemy, one is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud). Its image is the sun set, the share of life cut: for the bird and monkey years, death at twelve.
reading.BirthChild.DEMON.FIRE=Born on the trigram of the life force's enemy, one is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud). Its image is the sun set, the share of life cut: for the horse and snake years, death at nine.
reading.BirthChild.DEMON.WATER=Born on the trigram of the life force's enemy, one is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud). Its image is the sun set, the share of life cut: for the mouse and pig years, death at six.
reading.BirthChild.DEMON.EARTH=Born on the trigram of the life force's enemy, one is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud). Its image is the sun set, the share of life cut: for the ox, dragon, sheep and dog years, death at three.
BirthOmen.FATHER_DIES=the father's death
BirthOmen.MOTHER_DIES=the mother's death
BirthOmen.SKY_BAD_FOR_FATHER=ill for the father, on the sky trigram
BirthOmen.FATHER_SKY_SON_FIRE=ill for the father, a son on the fire trigram
BirthOmen.EARTH_BAD_FOR_MOTHER=ill for the mother, on the earth trigram
BirthOmen.WIND_NO_SISTER=no sister, on the wind trigram
BirthOmen.MOUNTAIN_NO_SISTER=no sister, on the mountain trigram
BirthOmen.MOUNTAIN_BAD_FOR_BROTHERS=ill for the brothers
BirthOmen.HEARTHS=counting hearthstones
reading.BirthOmen={0} The parents' trigrams (སྤར་ཁ, spar kha) in the year of the birth, the mother's being the natal trigram, are read against the child's sex and year.
reading.BirthOmen.FATHER_DIES=A son is born while the father stands on the thunder trigram (ཟིན, zin) and the mother on the lake trigram (དྭ, dwa). The father soon dies.
reading.BirthOmen.MOTHER_DIES=A daughter is born while the father stands on the mountain trigram (གིན, gin) and the mother on the thunder trigram (ཟིན, zin). The mother soon dies.
reading.BirthOmen.SKY_BAD_FOR_FATHER=A child born on the sky trigram (ཁེན, khen) bodes ill for the father when it is a son of a mother of a dog or dragon year, or is itself of a dog or dragon year.
reading.BirthOmen.FATHER_SKY_SON_FIRE=A son is born on the fire trigram (ལི, li) while the father stands on the sky trigram (ཁེན, khen). It bodes ill for the father.
reading.BirthOmen.EARTH_BAD_FOR_MOTHER=A daughter born on the earth trigram (ཁོན, khon) bodes ill for the mother when the mother is of an ox or sheep year, or the daughter is.
reading.BirthOmen.WIND_NO_SISTER=A child born on the wind trigram (ཟོན, zon) to a mother of a dog or dragon year, or a son of a dog or dragon year born on it, has no sister to call one.
reading.BirthOmen.MOUNTAIN_NO_SISTER=A child born on the mountain trigram (གིན, gin) to a mother of an ox or sheep year has no sister to call one.
reading.BirthOmen.MOUNTAIN_BAD_FOR_BROTHERS=A daughter of an ox or sheep year born on the mountain trigram (གིན, gin) bodes ill for her brothers.
reading.BirthOmen.HEARTHS=A daughter of this year born on this trigram counts hearthstones (སྐྱེད་པོ་བགྲང, skyed po bgrang): she sets up house again and again.
Clan.KEG=Keg
Clan.JI=Ji
Clan.KUNGS=Kungs
Clan.SHANG=Shang
Clan.U='U
ClanYear.GREAT_PENALTY=the clan's great-penalty year
ClanYear.SMALL_PENALTY=the clan's small-penalty year
ClanYear.MOTHER=the clan's mother year
ClanYear.POWER=the clan's own power year
ClanYear.SON=the clan's son year
ClanYear.FRIEND=the clan's friend year
ClanYear.ENEMY=the clan's enemy year
reading.ClanYear={0} The special pebble (སྒོས་རྡེལ, sgos rdel) sets the birth year against the element of one's clan (རུས, rus), and the year falls as one of seven.
reading.ClanYear.GREAT_PENALTY=Born in the clan's great-penalty year (ཆད་ཆེན, chad chen), one becomes a great man, good and strong, leader of five men and herder of five pens. Take no robes: stay a householder.
reading.ClanYear.SMALL_PENALTY=Born in the clan's small-penalty year (ཆད་ཆུང, chad chung), one sees many lines of the father's kin cut, and great rise and fall. Taking an enemy as kin brings ruin.
reading.ClanYear.MOTHER=Born in the clan's mother year, one has great power from a good mother's side. Quarrels with kin bring one near to leaving home, and grudges rise among the father's kin.
reading.ClanYear.POWER=Born in the clan's own power year (དབང་ལོ, dbang lo), one receives the attainment (དངོས་གྲུབ, dngos grub) of power and eats the luck of the father's kin. Too much clever talk brings ruin.
reading.ClanYear.SON=Born in the clan's son year, one rises on the father's support, with food, wealth and power in old age. The father's kin protects one, and living in the middle of the village goes well.
reading.ClanYear.FRIEND=Born in the clan's friend year, a year the element strikes, one gains nothing from the parents' wealth. Food and wealth rise as enemies, and rise and fall and moves are many.
reading.ClanYear.ENEMY=Born in the clan's enemy year, one meets enemies that killing does not end: its image is a hundred sons rising for a hundred fathers killed. Holding one's will back a little goes well.
PowerYear.KHA_YAN=life force and destiny one
PowerYear.KHONG_NONG=destiny begetting the life force
PowerYear.SE_ZHIG=the life force begetting destiny
PowerYear.DUN_KHUR=destiny cutting the life force
PowerYear.KHA_RAL=the life force cutting destiny
reading.PowerYear={0} The destiny (དབང་ཐང, dbang thang) of the birth year, set against its life force (སྲོག, srog), makes it one of five years, a pebble that cannot be lacking.
reading.PowerYear.KHA_YAN=Born in a kha yan (ཁ་ཡན, kha yan) year, whose life force and destiny are one element, one is raised high by no one and stays low for no one. Rise and fall are great, and fame comes.
reading.PowerYear.KHA_YAN.spirits=the ghosts of those slain by the blade, and the earth lords (ས་བདག, sa bdag)
reading.PowerYear.KHONG_NONG=Born in a khong nong (ཁོང་ནོང, khong nong) year, whose destiny begets its life force, one lives long, but children and wealth rarely come together. The first half of life is empty; then happiness dawns.
reading.PowerYear.KHONG_NONG.spirits=the earth lords (ས་བདག, sa bdag), and a spirit that followed wealth taken from the house
reading.PowerYear.SE_ZHIG=Born in a se zhig (སེ་ཞིག, se zhig) year, whose life force begets its destiny, one stands above the many, and the war gods (དགྲ་ལྷ, dgra lha) protect one. The luck of fields and wealth declines.
reading.PowerYear.SE_ZHIG.illness=cold illnesses
reading.PowerYear.DUN_KHUR=Born in a 'dun khur (འདུན་ཁུར, 'dun khur) year, whose destiny cuts its life force, one is clear of mind. Yet whatever one trades, wealth never rises, kin turn into enemies, and grief is much.
reading.PowerYear.DUN_KHUR.spirits=the earth lords (ས་བདག, sa bdag), the nāgas (ཀླུ, klu) and the nyen (གཉན, gnyan)
reading.PowerYear.KHA_RAL=Born in a kha ral (ཁ་རལ, kha ral) year, whose life force cuts its destiny, one sees a fine line split apart. Time with the mother is short; its image is a snow lion parted from its snows.
reading.PowerYear.KHA_RAL.remedy=send a gyalpo thread-cross (རྒྱལ་མདོས, rgyal mdos)
reading.PowerYear.KHA_RAL.spirits=the spirits of the dead who broke their pledges (དམ་སྲི, dam sri) and the gongpo spirits (འགོང་པོ, 'gong po), who carry children off
reading.PowerYearOf={0} By its element, each kind of year falls on one side of the family.
reading.PowerYearOf.KHA_YAN.WOOD=This kha yan (ཁ་ཡན, kha yan) is the father's brothers'. The forefathers divided their land or graves, so death by the blade or a kin-killing (དམེ, dme) threatens; a strong uncle is with one only briefly.
reading.PowerYearOf.KHA_YAN.FIRE=This kha yan (ཁ་ཡན, kha yan) is the household's. Born strong, man or woman, one still sees the house split; people and wealth rise and fall, joy and sorrow take turns, and children are hard to raise.
reading.PowerYearOf.KHA_YAN.WATER=This kha yan (ཁ་ཡན, kha yan) is the children's. Many children are lost, and those who live may lack a sense; one life knows three joys and sorrows, and a parent may be lost early.
reading.PowerYearOf.KHA_YAN.IRON=This kha yan (ཁ་ཡན, kha yan) is the relatives' and the maternal uncle's. There is a good uncle, but quarrels with kin over armour and weapons come; the later life is happier than the first.
reading.PowerYearOf.KHA_YAN.EARTH=This kha yan (ཁ་ཡན, kha yan) is the mother's and grandmother's. While they live there is plenty, and one's time with them is long; a badly placed grave for them harms, so choose it well.
reading.PowerYearOf.KHONG_NONG.WATER=This khong nong (ཁོང་ནོང, khong nong) is the children's: a child of incest or impurity may be born lacking a sense. The field of an ended line or a ruined house, once held, brings help.
reading.PowerYearOf.KHONG_NONG.WOOD=This khong nong (ཁོང་ནོང, khong nong) is the father's brothers': they may die abroad, by the blade, or leave no line. Many sons are born, but few stay.
reading.PowerYearOf.KHONG_NONG.EARTH=This khong nong (ཁོང་ནོང, khong nong) is the mother's and grandmother's: they parted from their house, or a child of impurity is born lacking a sense.
reading.PowerYearOf.KHONG_NONG.IRON=This khong nong (ཁོང་ནོང, khong nong) is the maternal uncle's: on his side rise and fall are very great.
reading.PowerYearOf.KHONG_NONG.FIRE=This khong nong (ཁོང་ནོང, khong nong) is one's own and the household's: some children are hard to raise, or one is left alone; oaths broken over people and wealth eat into the herds and the household.
reading.PowerYearOf.SE_ZHIG.FIRE=This se zhig (སེ་ཞིག, se zhig) is the household's: the forefathers prospered, but in one's own time losses are great, like a wolf among sheep. A spouse dies first, yet alone one still wins a good name.
reading.PowerYearOf.SE_ZHIG.EARTH=This se zhig (སེ་ཞིག, se zhig) is the mother's and grandmother's: on their side the house split, or someone died by the blade or a wasting illness. The children's power is small: many are born, few stay.
reading.PowerYearOf.SE_ZHIG.WATER=This se zhig (སེ་ཞིག, se zhig) is wealth's: the forefathers were rich, yet one goes hungry. Others take the credit for one's work, and graves and homes move often.
reading.PowerYearOf.SE_ZHIG.WOOD=This se zhig (སེ་ཞིག, se zhig) is the father's brothers': in their time losses, rises and falls are very great. One's own kindness outweighs the forefathers', and strangers love one more than one's own people.
reading.PowerYearOf.SE_ZHIG.IRON=This se zhig (སེ་ཞིག, se zhig) is the maternal uncle's: on his side rise, fall and loss are great, homes move and split, and quarrels with kin come.
reading.PowerYearOf.DUN_KHUR.IRON=This 'dun khur (འདུན་ཁུར, 'dun khur) is the maternal uncle's and the relatives': rise and fall are great with them. Rich, one's life is short; long-lived, one is poor.
reading.PowerYearOf.DUN_KHUR.WATER=This 'dun khur (འདུན་ཁུར, 'dun khur) is wealth's: loss, rise and fall of goods are very great, near ones turn hostile, and in the household grief and joy take turns.
reading.PowerYearOf.DUN_KHUR.FIRE=This 'dun khur (འདུན་ཁུར, 'dun khur) is the household's: it splits, or deaths come, or a parent is lost early; children are very hard to raise, and a sudden fright threatens.
reading.PowerYearOf.DUN_KHUR.EARTH=This 'dun khur (འདུན་ཁུར, 'dun khur) is the mother's and grandmother's: they die young, by the blade or of nyen (གཉན, gnyan) illness, and their help is small.
reading.PowerYearOf.DUN_KHUR.WOOD=This 'dun khur (འདུན་ཁུར, 'dun khur) is the father's brothers': time with them is short and their help small. The father's kin hold separate lands, near ones rise as enemies, and children are hard to raise.
reading.PowerYearOf.KHA_RAL.EARTH=This kha ral (ཁ་རལ, kha ral) is the mother's and grandmother's: their help is small and time with them short. What one plans fails, and what one never planned comes about.
reading.PowerYearOf.KHA_RAL.IRON=This kha ral (ཁ་རལ, kha ral) is the maternal uncle's and the relatives': time with them is short, or a grudge threatens. The earth lords (ས་བདག, sa bdag) and the gyalpo (རྒྱལ་པོ, rgyal po) harm one.
reading.PowerYearOf.KHA_RAL.WOOD=This kha ral (ཁ་རལ, kha ral) is the father's brothers': time with them is short, or a grudge threatens. In their line a kin-killing (དམེ, dme), an ended line, death by the blade or plague threaten.
reading.PowerYearOf.KHA_RAL.FIRE=This kha ral (ཁ་རལ, kha ral) is one's own: incest may come into the line, and its children may lack a sense. Even when rich, one is hard to help.
reading.PowerYearOf.KHA_RAL.WATER=This kha ral (ཁ་རལ, kha ral) is wealth's and friends': goods rise and fall, quarrels with kin and blame without fault come, and what one gathers never becomes wealth.
reading.LuckTriad={0} The birth year's triad, the three animals of one luck (ཀླུང་རྟ, klung rta), is read on its own.
reading.LuckTriad.WOOD=Born in a mouse, dragon or monkey year, one has a father, uncles and grandfather strong as the tsen (བཙན, btsan), wise and of merit. Under their shelter slander does no harm, and one never falls below others.
reading.LuckTriad.IRON=Born in a tiger, horse or dog year, one's wealth is an iron mountain no thief's chisel breaks. Good protector gods pull one out even from the hearth, and on the relatives' side merit abounds.
reading.LuckTriad.WATER=Born in a bird, ox or snake year, one is like a king come to the throne, guarded and praised by retinue and kin. Though one's own merit is small, wealth and luck are one's own.
reading.LuckTriad.FIRE=Born in a pig, sheep or hare year, one can only enjoy for the moment what the mother and grandmother gathered, and the gongpo spirits (འགོང་པོ, 'gong po) of poverty keep it from growing. Children flourish.
YearPlace.FIRST=a first year
YearPlace.MIDDLE=a middle year
YearPlace.LAST=a last year
reading.YearPlace={0} The twelve years fall into first, middle and last (ར་འབྲིང་ཐ་མ, ra 'bring tha ma), four in each.
reading.YearPlace.FIRST=Born in a first year, the tiger, monkey, pig or snake, one risks being left orphaned at the end by brothers and parents. The forefathers fell out with the priests, and a son may not keep the father's house.
reading.YearPlace.MIDDLE=Born in a middle year, the mouse, horse, bird or hare, one owes little to father and mother and much to oneself. The first half of life is empty and the end good; quarrels with kin and wandering abroad come.
reading.YearPlace.LAST=Born in a last year, the ox, sheep, dog or dragon, one sees home and castle moved or torn down, and quarrels over fields and house. The son does not keep the father's house, but one is diligent in work and farming.
reading.YearPlaceFull={0} This is the full reading of the first, middle and last (ར་འབྲིང་ཐ་མ, ra 'bring tha ma) years.
reading.YearPlaceFull.FIRST=Born in a first year, one's life force eats the mother, the body the father and destiny one's wealth. Rough of hand and strong of word, one hears much blame early, but later life is happy, warm as the sun in old age.
reading.YearPlaceFull.MIDDLE=Born in a middle year, one's own kindness outweighs the parents', and their wealth is of no help. One neither poisons food nor lies; quick to anger, clear of word and white of heart, one does not go to hell even in death.
reading.YearPlaceFull.LAST=Born in a last year, one runs a great risk of moving land and house, and lives in two places. One loves noble teachers and dislikes a low-born wife; near ones hate one and those far away love one.
BirthCut.VITALITY_BODY=the life force cuts the body
BirthCut.VITALITY_DESTINY=the life force cuts destiny
BirthCut.VITALITY_LUCK=the life force cuts the luck
BirthCut.BODY_VITALITY=the body cuts the life force
BirthCut.BODY_DESTINY=the body cuts destiny
BirthCut.BODY_LUCK=the body cuts the luck
BirthCut.DESTINY_BODY=destiny cuts the body
BirthCut.DESTINY_VITALITY=destiny cuts the life force
BirthCut.DESTINY_LUCK=destiny cuts the luck
BirthCut.LUCK_BODY=the luck cuts the body
reading.BirthCut={0} The aspects of one's own birth year cut one another, the cutting and tearing (གཅོད་འདྲལ, gcod 'dral); where one begets the other instead, the reading turns to good.
reading.BirthCut.VITALITY_BODY=When the life force cuts the body, one repays the parents' kindness little and lives in youth on the kindness of the maternal kin. Much is attempted and little achieved, and many children are lost.
reading.BirthCut.VITALITY_DESTINY=When the life force cuts destiny, the forefathers' land and fields pass to others and one's own wealth leaks away. Moves of house are many, and one is unskilled in one's own counsel.
reading.BirthCut.VITALITY_LUCK=When the life force cuts the luck, others are hard to please however hard one strives, and rise and fall are great on the maternal kin's side. One life knows two joys and sorrows, and half the children survive.
reading.BirthCut.BODY_VITALITY=When the body cuts the life force, of a line of four brothers only three now hold its root, and children are hard to raise, half living and half dying. Sudden frights and illness are many.
reading.BirthCut.BODY_DESTINY=When the body cuts destiny, near ones of the father's kin rise as enemies, wealth runs out and the house splits. Many children are lost, and great grudges run in the father's kin.
reading.BirthCut.BODY_LUCK=When the body cuts the luck, the maternal kin rise as enemies and spirits of ruin harm mother and child. Those one helps show no gratitude, and two joys and sorrows come in one day.
reading.BirthCut.DESTINY_BODY=When destiny cuts the body, the line's elders scatter, near ones become enemies and food turns to poison. The gongpo spirits (འགོང་པོ, 'gong po) harm, and illness abounds.
reading.BirthCut.DESTINY_VITALITY=When destiny cuts the life force, a bad match joins the family, and a child may be mute or blind. The house splits, and stabbing pains or blood illness rise in old age.
reading.BirthCut.DESTINY_LUCK=When destiny cuts the luck, what the forefathers earned is lost, brothers and sisters bear an ill name, and wealth always brings quarrels.
reading.BirthCut.LUCK_BODY=When the luck cuts the body, the loss of wealth is great, and the children's line runs empty.
GroupCut.PAIR_BODY=destiny and the life force cut the body
GroupCut.PAIR_DESTINY=the life force and the body cut destiny
GroupCut.PAIR_LUCK=destiny and the life force cut the luck
GroupCut.STAR_DESTINY=three cut destiny
GroupCut.STAR_VITALITY=three cut the life force
GroupCut.STAR_LUCK=three cut the luck
GroupCut.STAR_NOURISH=three nourish the life force
reading.GroupCut={0} Two or three of the birth year's aspects may act on one together, and these are read apart from the single cuts.
reading.GroupCut.PAIR_BODY=When destiny and the life force together cut the body, the body's strength never comes, children are hard to raise, and one ends as a servant. Its image is the ox of a corpse.
reading.GroupCut.PAIR_DESTINY=When the life force and the body together cut destiny, the children grow poor though the parents leave great wealth. Food and wealth are a rainbow in the sky, and at the end one serves others.
reading.GroupCut.PAIR_LUCK=When destiny and the life force together cut the luck, many sons each keep a hearth of their own, and illness abounds.
reading.GroupCut.STAR_DESTINY=When the life force, the body and the luck together cut destiny, one may own a hundred yaks and a thousand sheep, yet at the end goes a beggar. Its image is the star of the wheel of a thousand lights.
reading.GroupCut.STAR_VITALITY=When the body, destiny and the luck together cut the life force, one may meditate and practise all one's life, yet at the end dies by the blade.
reading.GroupCut.STAR_LUCK=When the life force, the body and destiny together cut the luck, sons and grandsons may be many, yet at the end the line risks being cut. Its image is the star of the red bird taking fire.
reading.GroupCut.STAR_NOURISH=When the body, destiny and the luck together nourish the life force, even a woman who has reached sixty does not see her line cut. Its image is the star crossing the river of the dead.
reading.YearNature={0} Each of the twelve year animals gives the one born in it a nature, the measure of the life force (སྲོག, srog) at birth.
reading.YearNature.MOUSE=Born in a mouse year, one holds deep grudges and finds no rest for the mind. Quick to steal by night, one has many foes. Loose outside and careful within, light of tongue and tight of hand, one drops great tasks for small ones.
reading.YearNature.OX=Born in an ox year, one is stubborn and hard to set to work, loves lying down and handles things badly. Hard to turn and heavy in counsel, one is slow and patient, broad of mind and fond of eating.
reading.YearNature.TIGER=Born in a tiger year, one is brave, agile and fierce, clear of mind and great of heart, and says that no one is better. One leans on kin, is rough in conduct and harsh of word, and loves trade and dice.
reading.YearNature.RABBIT=Born in a hare year, one eats little and is content with little: a mouthful of food and clothes against the cold are enough. One is crafty and skilled at means, bad within but smiling.
reading.YearNature.RABBIT.illness=phlegm and bile, and ailments of the mouth and teeth
reading.YearNature.DRAGON=Born in a dragon year, one is neither fierce nor loud, yet never slighted, and never puts work off. Quick to tire, white of heart and noisy, one listens to others and trusts oneself little. Illness is rare, but grave when it comes.
reading.YearNature.SNAKE=Born in a snake year, one is cruel, rough and full of anger, and burns one's own mind. Strength sits in the heart, and others' envy does not harm one. Stubborn and dark of heart, one is not turned once decided.
reading.YearNature.SNAKE.illness=illnesses of the stomach and the liver
reading.YearNature.HORSE=Born in a horse year, one has the force of magic and great diligence, and ends life happy whatever evildoers pursue. One loves horses and games, walks fast, sets one's own affairs aside for others' and sleeps little. Rise and fall are great.
reading.YearNature.SHEEP=Born in a sheep year, one speaks little, is dull of mind, stubborn and fond of eating. One harms no one, helps no one and repays no kindness. Patient and white of heart, one is slow and has good luck with food.
reading.YearNature.MONKEY=Born in a monkey year, one is impatient, light of body and weak of heart, with a mind like a feather on a mountain pass. One loves jests, keeps no word, talks much and lies, and thinks much of oneself.
reading.YearNature.BIRD=Born in a bird year, one squanders the father's wealth and buries the mother's. Proud and boastful, one knows others' measure but not one's own. Passionate, one cannot be without friends, loves washing, sleeps little and goes out well groomed.
reading.YearNature.DOG=Born in a dog year, one is proud, angry and fierce, with little love at home or abroad, and goes straight at one's aims. Finding no rest for the mind, one burns oneself like firewood. One is principled though stubborn, and loves the noble.
reading.YearNature.PIG=Born in a pig year, one is dull of mind and cares little whether food is clean, which makes a good ground for a yogi. One loves eating, speaks roughly and fears no one, boasts and tells needless lies.
reading.SixtyYear={0} Each of the sixty years gives the one born in it a nature, a span of life, a number of obstacles (བར་ཆད, bar chad) and a share of children.
reading.SixtyYear.WOOD_MOUSE=Born in a wood mouse year, one is clear of mind and skilled in crafts, crafty and glib, and deceives people by cunning. Food and wealth are middling. Life lasts 75 years, with seven obstacles and five or three children.
reading.SixtyYear.WOOD_MOUSE.illness=many nāga illnesses (ཀླུ་ནད, klu nad)
reading.SixtyYear.WOOD_OX=Born in a wood ox year, one sleeps much at night, and is honest of mind but very stingy. Food and wealth gather. Life lasts a full 60 years, with six obstacles.
reading.SixtyYear.WOOD_OX.spirits=the earth lords (ས་བདག, sa bdag), roused by digging a grave, or the earth lords of the trees
reading.SixtyYear.FIRE_TIGER=Born in a fire tiger year, one is angry and fierce, strong of body, round-eyed and very proud, with little faith or patience. One helps neither oneself nor one's friends, and becomes the husband of two wives. Life lasts 79 years, with five obstacles and four children.
reading.SixtyYear.FIRE_TIGER.illness=chronic inner illness, wounds of the blade, leprosy, nāga illnesses (ཀླུ་ནད, klu nad) and phlegm
reading.SixtyYear.FIRE_RABBIT=Born in a fire hare year, one is faulty of mind and harsh of speech, crafty and untruthful. One watches others' faults, praises one's own gifts and loves women. Food, wealth and enjoyments are great. Life lasts 75 years, with seven obstacles.
reading.SixtyYear.FIRE_RABBIT.spirits=the earth lords (ས་བདག, sa bdag) and the gyalpo (རྒྱལ་པོ, rgyal po)
reading.SixtyYear.FIRE_RABBIT.illness=lymph and cold illnesses, and much wind of the heart
reading.SixtyYear.EARTH_DRAGON=Born in an earth dragon year, one is untruthful and lazy, fond of beer and of other men's wives, yet content of mind. Light of mind and crafty, one is little harmed by illness. Life lasts 55 years, with six obstacles and five or seven children.
reading.SixtyYear.EARTH_SNAKE=Born in an earth snake year, one is strong of heart and skilled, with great food, wealth and enjoyments, but thieves, robbers and enemies are to be feared. Proud, angry and jealous, one loves bad company or turns white to the Dharma. Life lasts 79 years, with four obstacles and six children.
reading.SixtyYear.EARTH_SNAKE.spirits=the earth lords (ས་བདག, sa bdag) of water and wood
reading.SixtyYear.IRON_HORSE=Born in an iron horse year, one is very lazy and loves kin, looks at others' faults and drops one's own, and loves food. Wealth is lost heavily and children are hard to raise. Life lasts 57 years, with nine obstacles and four children.
reading.SixtyYear.IRON_HORSE.spirits=the earth lords (ས་བདག, sa bdag), roused by building a fort
reading.SixtyYear.IRON_HORSE.illness=mostly cold and wind
reading.SixtyYear.IRON_SHEEP=Born in an iron sheep year, one is full of body and tame of senses, but weak of memory. Enemies harm much and slander is frequent. Life lasts 81 years, with four obstacles and few children.
reading.SixtyYear.IRON_SHEEP.spirits=the lu-tsen (ཀླུ་བཙན, klu btsan)
reading.SixtyYear.IRON_SHEEP.illness=eye disease
reading.SixtyYear.WATER_MONKEY=Born in a water monkey year, one is artful, sharp of sense and of good memory, and becomes master of five towns. An earth lord (ས་བདག, sa bdag) like a blazing heap of fire protects rather than harms. Kin-killing (དམེ, dme) and violence threaten. Life lasts 57 years, with seven obstacles and about three children.
reading.SixtyYear.WATER_BIRD=Born in a water bird year, one is scattered of body and mind, unsteady and forgetful, loves going about and has many friends. Friends, neighbours and near ones rise as enemies, and one falls into others' power. Life lasts 60 years, with nine obstacles and two children.
reading.SixtyYear.WATER_BIRD.spirits=the earth lords (ས་བདག, sa bdag) of the trees, the lu-men (ཀླུ་སྨན, klu sman) of springs and meadows, and the gongpo spirits (འགོང་པོ, 'gong po) of the townsfolk
reading.SixtyYear.WATER_BIRD.illness=wind and fever
reading.SixtyYear.WOOD_DOG=Born in a wood dog year, one is artful, sharp of sense, of good memory and fine of body, and becomes lord of a town. Good lu-tsen (ཀླུ་བཙན, klu btsan) befriend one. Kin-killing (དམེ, dme) and foul deeds threaten. Life lasts 79 years, with five obstacles and three children.
reading.SixtyYear.WOOD_PIG=Born in a wood pig year, one is big of body and flesh, very angry and fierce, and light with pride inside. Friends and lovers deceive one, and one risks turning bad. Wealth from a line that ended brings help. Life lasts 64 years, with five obstacles.
reading.SixtyYear.FIRE_MOUSE=Born in a fire mouse year, one has great resolve and much memory, great craving for wealth and food, and skill at telling others' faults. One is busy at theft and killing. Life lasts 68 years, with five obstacles.
reading.SixtyYear.FIRE_MOUSE.spirits=the lu-men (ཀླུ་སྨན, klu sman) from the peaks of slate and snow mountains
reading.SixtyYear.FIRE_MOUSE.illness=stomach disease, spreading fever and heart disease
reading.SixtyYear.FIRE_OX=Born in a fire ox year, one is big of body, sleeps much and is dull of mind, and the eyes weaken. Food and enjoyments are great, and grain and servants increase. Life lasts 71 years, with eight obstacles, one son and two daughters.
reading.SixtyYear.FIRE_OX.spirits=the gyalpo (རྒྱལ་པོ, rgyal po) of temples
reading.SixtyYear.FIRE_OX.illness=mostly phlegm
reading.SixtyYear.EARTH_TIGER=Born in an earth tiger year, one is full of body, angry and fond of killing, greedy for food and skilled at lies. Harm from enemies and demons is small. Life lasts 72 years, with seven obstacles and about two children.
reading.SixtyYear.EARTH_TIGER.spirits=the earth lords (ས་བདག, sa bdag) of the fields, and the lu-tsen (ཀླུ་བཙན, klu btsan) from the foot of rock mountains
reading.SixtyYear.EARTH_TIGER.illness=tumours and dropsy
reading.SixtyYear.EARTH_RABBIT=Born in an earth hare year, one is talkative and very wise, and knows grammar and the treatises. Food and wealth are small. One lies with other men's wives and has many quarrels with kin on every side. Life lasts 50 years, with six obstacles and one child.
reading.SixtyYear.EARTH_RABBIT.illness=disease of the lungs
reading.SixtyYear.IRON_DRAGON=Born in an iron dragon year, one is full of body and strong, proud and skilled in speech. One is busy at evil and puts off virtue, smooth of tongue and bad of heart. Wealth is lost heavily, yet enjoyments are very great. Life lasts 80 years, with three obstacles and one or five children.
reading.SixtyYear.IRON_DRAGON.spirits=the gyalpo (རྒྱལ་པོ, rgyal po) and others that bring madness and fits
reading.SixtyYear.IRON_SNAKE=Born in an iron snake year, one is clear of mind and skilled in crafts, and likes to probe others' faults. Robbers and enemies harm much. Food and wealth are small at first and great later, and time with the parents is short. Life lasts 78 years, with six obstacles and three children.
reading.SixtyYear.IRON_SNAKE.spirits=sorcery aimed at one (གཏད་ཕུར, gtad phur)
reading.SixtyYear.IRON_SNAKE.illness=throat disease, sudden illness, or madness and fits
reading.SixtyYear.WATER_HORSE=Born in a water horse year, one is very wise, little deluded and glorious. Straight within and little deceitful, one falls under no one's power. Farming comes and goes, but food and wealth are great. Life lasts 77 or 57 years, with eight obstacles and three or four children.
reading.SixtyYear.WATER_HORSE.spirits=the earth lords (ས་བདག, sa bdag), and the spirit of ruin (འཕུང་འདྲེ, 'phung 'dre) of wealth from a line that ended
reading.SixtyYear.WATER_HORSE.illness=wind of the heart that wanders
reading.SixtyYear.WATER_SHEEP=Born in a water sheep year, one is of little wisdom, loves going about and craves much. Food and enjoyments are not great, and thieves and enemies are to be feared. Horses and cattle are lost. Life lasts 73 years, with five obstacles and few children.
reading.SixtyYear.WATER_SHEEP.spirits=the earth lords (ས་བདག, sa bdag) that are nyen (གཉན, gnyan) of wood and water
reading.SixtyYear.WATER_SHEEP.illness=much phlegm
reading.SixtyYear.WOOD_MONKEY=Born in a wood monkey year, one is full of body and very melancholy, loves bad company, sleeps little, has many enemies and is crafty. Caring little for oneself, one keeps two homes. Food rises and falls greatly. Life lasts 78 years, with seven obstacles and five children or one.
reading.SixtyYear.WOOD_MONKEY.spirits=the tsen (བཙན, btsan), the earth lords (ས་བདག, sa bdag) and the gyalpo (རྒྱལ་པོ, rgyal po) of river valleys and steep peaks
reading.SixtyYear.WOOD_MONKEY.illness=many illnesses
reading.SixtyYear.WOOD_BIRD=Born in a wood bird year, one is pale of body and has many chronic illnesses. Kin quarrel, and friends and kinsfolk rise as enemies. One loves fighting. Life lasts a full 60 years, with one or three children.
reading.SixtyYear.WOOD_BIRD.spirits=female demons (འདྲེ་མོ, 'dre mo), and the dremo (གྲེ་མོ, gre mo) who broke their pledges
reading.SixtyYear.FIRE_DOG=Born in a fire dog year, one has many illnesses, as if the line were ending, yet is virtuous of mind and above all patient. Fire threatens to burn one's house. Life lasts 68 years, with seven obstacles and three children.
reading.SixtyYear.FIRE_DOG.spirits=the earth lords (ས་བདག, sa bdag) of lonely places, the drewo (གྲེ་བོ, gre bo) and the tsen (བཙན, btsan)
reading.SixtyYear.FIRE_DOG.illness=fever and bile
reading.SixtyYear.FIRE_PIG=Born in a fire pig year, one is poor of body and much harmed by illness, and the noble of the line rise as enemies. Fire threatens to burn one's house. Life lasts 68 years, with seven obstacles and three children.
reading.SixtyYear.FIRE_PIG.spirits=the drewo (གྲེ་བོ, gre bo), the tsen (བཙན, btsan) and the earth lords (ས་བདག, sa bdag)
reading.SixtyYear.FIRE_PIG.illness=mostly fever and bile
reading.SixtyYear.EARTH_MOUSE=Born in an earth mouse year, one is short of body and likes killing, honest yet faulty of mind, smooth of tongue and self-willed. Death by a weapon or the blade threatens. Life lasts 68 years, with seven obstacles and one child.
reading.SixtyYear.EARTH_MOUSE.illness=phlegm pressing on the stomach
reading.SixtyYear.EARTH_OX=Born in an earth ox year, one is heavy of body, proud and fault-finding, rough, stubborn and fierce of mind, and people dislike one a little. Food and wealth are small. Life lasts a full 50 years, with seven obstacles and one child.
reading.SixtyYear.EARTH_OX.spirits=the earth lords (ས་བདག, sa bdag) of the estate
reading.SixtyYear.IRON_TIGER=Born in an iron tiger year, one is angry and fierce, fond of killing and of giving, fine of body and fair of skin. One craves meat, beer and pleasure, and speaks harshly. Food and enjoyments are unsteady. Life lasts 60 years, with five sudden mishaps and two or four children.
reading.SixtyYear.IRON_TIGER.spirits=the tsen (བཙན, btsan) and the gyalpo (རྒྱལ་པོ, rgyal po)
reading.SixtyYear.IRON_RABBIT=Born in an iron hare year, one is broad of mind, faithful and honest, diligent and sharp of wisdom, loving and generous, with great gifts. Death by the blade threatens. Food and wealth are modest. Life lasts 61 years, with five obstacles and five children.
reading.SixtyYear.IRON_RABBIT.spirits=kin-killing (དམེ, dme), the earth lords (ས་བདག, sa bdag), and the senmo (བསེན་མོ, bsen mo) of empty forts and temples
reading.SixtyYear.IRON_RABBIT.illness=many stabbing pains
reading.SixtyYear.WATER_DRAGON=Born in a water dragon year, one bears a mole on the body, changes land and house again and again, and loves archery and games. Many lines of wealth and children end. Food and wealth swing between full and empty. Life lasts 62 years, with six obstacles and five children or one.
reading.SixtyYear.WATER_SNAKE=Born in a water snake year, one bears great anger at heart and slanders. Many lines of the family end. Light of tongue and small of heart, one has few children. Life lasts 68 years.
reading.SixtyYear.WATER_SNAKE.spirits=the gyalpo (རྒྱལ་པོ, rgyal po), who harm wealth, and the earth lords (ས་བདག, sa bdag) of red rocks
reading.SixtyYear.WATER_SNAKE.illness=cold and wind
reading.SixtyYear.WOOD_HORSE=Born in a wood horse year, one is crafty and hard to live with, angry and dull of mind, with little faith or longing. One has great strength and austerity, loves friends and talks much. Life lasts 60 years, with one child.
reading.SixtyYear.WOOD_HORSE.spirits=the gyalpo (རྒྱལ་པོ, rgyal po) and the earth lords (ས་བདག, sa bdag)
reading.SixtyYear.WOOD_HORSE.illness=wind and phlegm
reading.SixtyYear.WOOD_SHEEP=Born in a wood sheep year, one is full of body and clear of senses, but dull of mind and fond of food. Life lasts 60 years, with three obstacles and two children.
reading.SixtyYear.FIRE_MONKEY=Born in a fire monkey year, one loves clothes and ornaments and becomes the caravan leader of five towns. Bold of face and strong, one is lustful, proud, bad with wealth and quick to see others' faults. Food and enjoyments are great. Life lasts 67 years, with five obstacles and five children.
reading.SixtyYear.FIRE_MONKEY.illness=much wind and bile
reading.SixtyYear.FIRE_BIRD=Born in a fire bird year, one is many-minded, crafty and talkative, deft of hand and bold of face, and busy at theft and killing. Forgetful and full of wants, one is very fond of cats. The blade and illness are much to be feared. Life lasts 65 years, with six obstacles.
reading.SixtyYear.FIRE_BIRD.spirits=female demons (འདྲེ་མོ, 'dre mo) of charnel grounds and temples
reading.SixtyYear.EARTH_DOG=Born in an earth dog year, one is impatient and angry, full of plans and of great desire, and loves mocking people. One dreams of keeping company with the dead, is unhappy at heart and has little to enjoy. Life lasts 70 years, with seven obstacles and three or four children.
reading.SixtyYear.EARTH_DOG.spirits=the devouring spirit (ཟ་འདྲེ, za 'dre) of a great-grandfather
reading.SixtyYear.EARTH_DOG.illness=very much wind and bile
reading.SixtyYear.EARTH_PIG=Born in an earth pig year, one knows little, is much harmed by enemies and gets little help from kin and friends. Food and enjoyments are great. Life lasts 67 years, with six obstacles and two children.
reading.SixtyYear.EARTH_PIG.spirits=a male spirit (ཕོ་འདྲེ, pho 'dre) served in the past, and the earth lords (ས་བདག, sa bdag) of a field shaped like a fish
reading.SixtyYear.IRON_MOUSE=Born in an iron mouse year, one is full of body and clear of mind, fond of jests, faithful and able to help or harm, with few enemies. One loves fighting and works more for others than for oneself, and all hold one in honour. Life lasts 57 years, with six obstacles and five children.
reading.SixtyYear.IRON_OX=Born in an iron ox year, one is light of body, knows every craft and understands much. Illness and enemies harm little. One sleeps much and is lazy, fierce and very stubborn, yet friends and the king are pleased. Life lasts 55 years, with seven obstacles and two children.
reading.SixtyYear.IRON_OX.spirits=the earth lords (ས་བདག, sa bdag) of the waters
reading.SixtyYear.WATER_TIGER=Born in a water tiger year, one is coarse of body and vigorous, admires oneself and loves praise, with faults of mind hard to mend. White of mouth and black beneath, one steals other men's wives and parts from one's own. Life lasts 71 years, with seven obstacles and one child.
reading.SixtyYear.WATER_RABBIT=Born in a water hare year, one trusts no one, turns away when speaking and keeps bad company. Fond of beer and sleep, forgetful and stingy, one takes the father's seat. One dreams of great abysses. Life lasts 72 years.
reading.SixtyYear.WATER_RABBIT.spirits=the gyalpo (རྒྱལ་པོ, rgyal po) of charnel grounds and temples
reading.SixtyYear.WOOD_DRAGON=Born in a wood dragon year, one is skilled in crafts, soft and eloquent of speech and easy company, busy coming and going, and very jealous. Food, wealth and power come. Life lasts 66 years, with six obstacles and few children.
reading.SixtyYear.WOOD_DRAGON.spirits=the earth lords (ས་བདག, sa bdag) of small springs
reading.SixtyYear.WOOD_DRAGON.illness=mostly bile
reading.SixtyYear.WOOD_SNAKE=Born in a wood snake year, one is small of mind, thin of body and very self-willed, and loves the noble and dislikes the low. Illness is slight, children come and enjoyments are great. Wide of mouth and narrow beneath, one is bad with wealth. Life lasts 77 years, with four obstacles.
reading.SixtyYear.FIRE_HORSE=Born in a fire horse year, one is angry, fierce and light with pride, of great gain and fame, and loves fighting. Fond of horses and dogs, one harms people but works hard for friends. Wealth is small in the end. Life lasts 78 years, with seven obstacles and two children.
reading.SixtyYear.FIRE_HORSE.spirits=the gyalpo (རྒྱལ་པོ, rgyal po)
reading.SixtyYear.FIRE_HORSE.illness=stabbing pains of the lungs, and much fever
reading.SixtyYear.FIRE_SHEEP=Born in a fire sheep year, one is full of body, upright and far-seeing, and achieves what one plans. Pleasant of voice, one craves wealth. Children and grandchildren are many, but enemies and spirits harm much. Life lasts 77 years, with seven obstacles.
reading.SixtyYear.FIRE_SHEEP.spirits=the earth lords (ས་བདག, sa bdag) of a three-cornered field
reading.SixtyYear.FIRE_SHEEP.illness=illness of the kidneys, and chronic illness
reading.SixtyYear.EARTH_MONKEY=Born in an earth monkey year, one is easy company and fair in conduct, calm of mind and skilled in speech. Every deed bears fruit, pride is small, and all hold one worthy of honour. Life lasts 78 years, with nine perils of life and three children.
reading.SixtyYear.EARTH_MONKEY.spirits=the earth lords (ས་བདག, sa bdag) of round fields, of a lordly race
reading.SixtyYear.EARTH_MONKEY.illness=wind and phlegm
reading.SixtyYear.EARTH_BIRD=Born in an earth bird year, one is clear of mind and loving to people, yet jealous, stingy, proud and lustful. The eyes and senses weaken. Life lasts 70 years, with seven obstacles and six children.
reading.SixtyYear.EARTH_BIRD.spirits=the earth lords (ས་བདག, sa bdag) of houses and fields
reading.SixtyYear.EARTH_BIRD.illness=mostly bile
reading.SixtyYear.IRON_DOG=Born in an iron dog year, one is clear of mind and fair in conduct, white of heart and busy at virtue, but knows little of the world. One knows shame, sleeps much and sees grain and wealth increase. Robbers are to be feared. Life lasts 77 years, with seven obstacles and three or four children.
reading.SixtyYear.IRON_PIG=Born in an iron pig year, one is clear of mind and fair in conduct, one to whom all men bring offerings, with two wives and very great glory. Life lasts 70 years, with seven obstacles and two or four children.
reading.SixtyYear.WATER_MOUSE=Born in a water mouse year, one is very fair and enduring of mind, lustful and fond of cats. Within, one is full of deceit and very greedy for food and wealth. Life lasts 72 years, with seven obstacles and two or five children.
reading.SixtyYear.WATER_MOUSE.spirits=the earth lords (ས་བདག, sa bdag) that are nyen (གཉན, gnyan) of the trees, from the east
reading.SixtyYear.WATER_OX=Born in a water ox year, one is very dull, sleeps much and is lazy, ill-willed and harsh of speech, and very self-willed. One sees many children die. Life lasts 70 years, with seven obstacles.
reading.SixtyYear.WATER_OX.spirits=the earth lords (ས་བདག, sa bdag) of the burning grounds
reading.SixtyYear.WOOD_TIGER=Born in a wood tiger year, one is angry and fierce and loves fighting. Lustful, envious and self-willed, one silences all who are not one's own. Food and wealth are great. Death by the blade threatens. Life lasts 66 years, with five obstacles and three children.
reading.SixtyYear.WOOD_TIGER.spirits=the earth lords (ས་བདག, sa bdag), and the gyalpo (རྒྱལ་པོ, rgyal po) and the theurang (ཐེའུ་བྲང, the'u brang) that came following goats and donkeys
reading.SixtyYear.WOOD_TIGER.illness=tumours, dropsy and throat disease
reading.SixtyYear.WOOD_RABBIT=Born in a wood hare year, one is very crafty, very fond of women, and steals other men's wives. Admiring oneself, one has many plans. Illness and enemies are much to be feared. Life lasts 67 years, with six obstacles, and children come early and late.
reading.SixtyYear.WOOD_RABBIT.spirits=the serak (བསེ་རག, bse rag) and others that came following goats and donkeys
reading.SixtyYear.FIRE_DRAGON=Born in a fire dragon year, one is full of body and has wealth. Kin quarrel, and thieves and enemies harm much. Greedy and careless with things, one is deft of hand. Food and enjoyments are great. Life lasts 71 years, with seven obstacles and two children.
reading.SixtyYear.FIRE_DRAGON.spirits=the theurang (ཐེའུ་བྲང, the'u brang) that came following wealth
reading.SixtyYear.FIRE_DRAGON.illness=wind and bile
reading.SixtyYear.FIRE_SNAKE=Born in a fire snake year, one is full of body, rarely ill and rich in companions. Wealthy, one becomes lord of a town and is upheld by all. One is skilled in crafts and the treatises. At the end, death by the blade comes. Life lasts 71 years, with seven obstacles and two children.
reading.SixtyYear.FIRE_SNAKE.spirits=the nāgas (ཀླུ, klu) and the earth lords (ས་བདག, sa bdag) of empty forts and ruins, and of a forefather's grave dug up by birds and dogs
reading.SixtyYear.FIRE_SNAKE.illness=wind and bile
reading.SixtyYear.EARTH_HORSE=Born in an earth horse year, one is brave, impatient and unsteady of word, and the learned and the low alike put their hope in one. Merit meets great obstacles, and enemies and illness harm much. Life lasts 75 years, with seven obstacles and two children.
reading.SixtyYear.EARTH_HORSE.spirits=the earth lords (ས་བདག, sa bdag) of a crescent-shaped field
reading.SixtyYear.EARTH_SHEEP=Born in an earth sheep year, one is often ill and fears enemies, and brothers and sisters grow hostile over wealth. Joy and sorrow take turns. One is bold, self-willed and proud, and the mind strays to the other sex. Life lasts 60 years, with four obstacles.
reading.SixtyYear.EARTH_SHEEP.spirits=the spirits of leprosy and of the blade
reading.SixtyYear.IRON_MONKEY=Born in an iron monkey year, one is handsome and pleasing, a delight to all who see one, with great wealth. Skilled yet wasteful, one may commit a kin-killing (དམེ, dme). War and enemies are to be feared, but old age is happy. Life lasts 70 years, with eight obstacles and five children or one.
reading.SixtyYear.IRON_MONKEY.spirits=the mamo (མ་མོ, ma mo), and harm from grudges and defilement (གྲིབ, grib)
reading.SixtyYear.IRON_BIRD=Born in an iron bird year, one has great glory and power, much wealth and grain, and eats and drinks much. Passionate, one becomes chief among people and lives always in plenty. Life lasts 70 years, with seven obstacles and four children.
reading.SixtyYear.IRON_BIRD.spirits=the spirit of kin-killing (དམེ་འདྲེ, dme 'dre) and the spirit of leprosy (མཛེ་འདྲེ, mdze 'dre)
reading.SixtyYear.IRON_BIRD.illness=wind and fever
reading.SixtyYear.WATER_DOG=Born in a water dog year, one is always stingy, bears many unlovely marks and is busy at evil deeds. Illness, weapons, enemies and the king are to be feared, and kin and friends do not know one. The share of children and wealth is small. Life lasts 63 years.
reading.SixtyYear.WATER_DOG.spirits=the obstructers (བགེགས, bgegs), the earth lords (ས་བདག, sa bdag), the serak (བསེ་རག, bse rag) and the gyalpo (རྒྱལ་པོ, rgyal po)
reading.SixtyYear.WATER_PIG=Born in a water pig year, one is broad of knowledge and steady of mind, openly proud and jealous, and has wealth. One becomes owner of cattle, food and grain. Life lasts 60 years, with five obstacles and four children.
reading.SixtyYear.WATER_PIG.spirits=the nāgas (ཀླུ, klu), struck when a grave was dug, or the earth lords (ས་བདག, sa bdag) of the trees, or harm from the maternal uncle's side
reading.BodyNature={0} The element of the body (ལུས, lus) of the birth year gives one of five bodies, each with the lot of the one born with it.
reading.BodyNature.WOOD=A wood body is wealth that wanders: hollow within, it roams everywhere. Harm to the forefathers' gods keeps work from bearing fruit. What one has seems untrue and what one lacks seems false, and wealth swings between full and empty. Its image is a city of the gandharvas (དྲི་ཟ, dri za) laid waste.
reading.BodyNature.FIRE=A fire body is existence that wanders: man or woman, one is widowed early or late. Its images are a bird's corpse borne off by the wind, a fish's carried off by the water, a broken bowl, a broken ladle, and broken arrows and bow bound together.
reading.BodyNature.EARTH=An earth body moves like a hill of sand, and its house stands on a wheel of graves. Graves open at the head and the foot of the family's valley. Like horses leaving the stable, the family scatters after others' shelter and herds, and holding its own home to the end is hard.
reading.BodyNature.IRON=An iron body is the wide and hollow sky, fond of kin-killing (དམེ, dme) and fighting. Fierce though it is, its own life is short. Among the father's kin someone was killed by the blade on an empty pass; failing that, the blade turns toward oneself. Its image is the sun and moon fallen to earth.
reading.BodyNature.IRON.remedy=tie on a protection against weapons, press down the harmful spirit of the blade, and do much to lengthen life and to save lives
reading.BodyNature.WATER=A water body is a river swirling with suffering, wandering among illness and spirits; the former life ended in the womb. A mark such as an eye of the sun, or a pattern of flame or vajra, should show on the body. Without one, a nāginī grips the stomach with both hands, and the spine and ribs are in danger.
reading.BodyNature.WATER.remedy=offer the nāga torma (ཀླུ་གཏོར, klu gtor) and the water torma (ཆུ་གཏོར, chu gtor) with great care
reading.KhaSrog={0} The thirty paired-year elements (ཁ་སྲོག, kha srog) give each pair of years a body, cut from a part of the turtle (རུས་སྦལ, rus sbal), and the forefathers' fault behind its ills.
reading.KhaSrog.WOOD_MOUSE=Born in a wood mouse or wood ox year, one has a body of iron melted from stone, cut from the turtle's hip and thigh. The forefathers did wrong against something of iron. The house falls to ruin and children die young. Born on the lake trigram (དྭ, dwa), one is weak in the feet and loins.
reading.KhaSrog.WOOD_MOUSE.spirits=the clan's spirit (རུས་འདྲེ, rus 'dre), from a spirit of one's own making kept in the house
reading.KhaSrog.WOOD_MOUSE.illness=diarrhoea, pain of the hips and thighs, gout, lameness and dropsy
reading.KhaSrog.FIRE_TIGER=Born in a fire tiger or fire hare year, one has a body of fire most rough, cut from the warmth of the turtle's bowels. The forefathers were fierce, but a man was struck by poison and a woman let the hearth be defiled, and the god was cast off. Born on the water trigram (ཁམ, kham), one's body has little warmth.
reading.KhaSrog.FIRE_TIGER.spirits=the nāgas (ཀླུ, klu) that cling to the maternal grandmother
reading.KhaSrog.FIRE_TIGER.illness=epidemic fever
reading.KhaSrog.EARTH_DRAGON=Born in an earth dragon or earth snake year, one has a body of wood lying in the forest, cut from the turtle's womb. The forefathers cut a nyen (གཉན, gnyan) tree with an axe or burned an old shrine's wood. Twins or weak children come. Born on the thunder trigram (ཟིན, zin), one falls chronically ill.
reading.KhaSrog.EARTH_DRAGON.spirits=spirits and earth demons that cling to cracked troughs and vessels
reading.KhaSrog.EARTH_DRAGON.illness=tumours, sudden mishaps, and weak loins
reading.KhaSrog.IRON_HORSE=Born in an iron horse or iron sheep year, one has a body of earth from the deep middle, cut from the flesh of the turtle's throat. The forefathers stirred the earth and stones of a silent spring. The house moves from time to time. Born on the water trigram (ཁམ, kham), one has heart illness and wind of the heart.
reading.KhaSrog.IRON_HORSE.spirits=the nāgas (ཀླུ, klu), the earth lords (ས་བདག, sa bdag) or the lu-tsen (ཀླུ་བཙན, klu btsan) of the maternal uncle's house and fields
reading.KhaSrog.IRON_HORSE.illness=pain of the throat, tumours, stammering and muteness
reading.KhaSrog.WATER_MONKEY=Born in a water monkey or water bird year, one has a body of iron of the sword's edge, cut from the bones of the turtle's neck. The father and grandfather dealt in a sword and kept the mother's wealth. The house is built and falls apart. Born on the fire trigram (ལི, li), it goes badly.
reading.KhaSrog.WATER_MONKEY.spirits=the gods and spirits that cling to the fields
reading.KhaSrog.WATER_MONKEY.illness=illness of the head and cheeks, tumours, pain of the neck, and arrow wounds to the neck
reading.KhaSrog.WOOD_DOG=Born in a wood dog or wood pig year, one has a body of fire on a mountain peak, cut from the turtle's gall. The forefathers let the hearth's defilement reach a spring at a crossing of three ways. Small children die. Born on the earth trigram (ཁོན, khon), a woman is lustful and never content.
reading.KhaSrog.WOOD_DOG.spirits=the nāgas (ཀླུ, klu) and the gongpo spirits (འགོང་པོ, 'gong po)
reading.KhaSrog.WOOD_DOG.illness=bile, heat illness and epidemics
reading.KhaSrog.FIRE_MOUSE=Born in a fire mouse or fire ox year, one has a body of water poured out, cut from the water of the turtle's eyes. The forefathers defiled the hearth, took a widow as a bride, or let their people go to others. Grudges and defilement (གྲིབ, grib) cling to the family.
reading.KhaSrog.FIRE_MOUSE.spirits=the gongpo spirits (འགོང་པོ, 'gong po) and the drewo (གྲེ་བོ, gre bo)
reading.KhaSrog.FIRE_MOUSE.illness=arrow wounds to the eyes, blindness and failing sight
reading.KhaSrog.EARTH_TIGER=Born in an earth tiger or earth hare year, one has a body of earth of a broken threshold, cut from the turtle's flesh. The forefathers let their house fall to ruin or dug into a cliff. Children die grown, and lines among near kin may end. Born on the fire trigram (ལི, li), it goes badly for the brothers.
reading.KhaSrog.EARTH_TIGER.spirits=the demon of ended lines from the grandfather's and the uncle's time
reading.KhaSrog.EARTH_TIGER.illness=illness from the water gods, and demon illness in women
reading.KhaSrog.IRON_DRAGON=Born in an iron dragon or iron snake year, one has a body of white silver iron, cut from the bone at the turtle's heart. The forefathers used the goods of an old Dharma circle, and the spirit of misused offerings harms. Born on the fire trigram (ལི, li), the head is always held by illness.
reading.KhaSrog.IRON_DRAGON.spirits=the demon of madness and the earth lords (ས་བདག, sa bdag)
reading.KhaSrog.IRON_DRAGON.illness=heartbreak, heart and lung illness, and madness
reading.KhaSrog.WATER_HORSE=Born in a water horse or water sheep year, one has a body of willow wood, cut from the sinews of the turtle's limbs. The forefathers cut nyen (གཉན, gnyan) trees in a nyen field and stirred its boundaries and doorways. Born on the lake trigram (དྭ, dwa), one's hair is poor.
reading.KhaSrog.WATER_HORSE.spirits=earth demons joined with the nāgas (ཀླུ, klu), the earth lords (ས་བདག, sa bdag) and the nyen (གཉན, gnyan)
reading.KhaSrog.WATER_HORSE.illness=lameness and broken limbs
reading.KhaSrog.WOOD_MONKEY=Born in a wood monkey or wood bird year, one has a body of water in a canal, cut from the water in the turtle's channels. The forefathers cut a canal across the land or stirred a meadow. Born on the mountain trigram (གིན, gin), the child's nose is ill-shaped.
reading.KhaSrog.WOOD_MONKEY.spirits=the nāga demons and the earth lords (ས་བདག, sa bdag)
reading.KhaSrog.WOOD_MONKEY.illness=faulty senses, and death from the body's channels cut
reading.KhaSrog.FIRE_DOG=Born in a fire dog or fire pig year, one has a body of earth that holds the gods, cut from the flesh of the turtle's spleen. The forefathers took a god's image, a stupa or a temple. Born on the water trigram (ཁམ, kham), wind of the heart rises strongly.
reading.KhaSrog.FIRE_DOG.spirits=the gods' spirits and the gyalpo (རྒྱལ་པོ, rgyal po)
reading.KhaSrog.FIRE_DOG.illness=madness and fits, epidemics, and stabbing pains of the upper body
reading.KhaSrog.EARTH_MOUSE=Born in an earth mouse or earth ox year, one has a body of fire born of lightning, cut from the turtle's bowels and breath. The forefathers set fire on a mountain or at the meeting of three valleys, or burned a town. Born on the water trigram (ཁམ, kham), the head has no warmth.
reading.KhaSrog.EARTH_MOUSE.spirits=the tsen (བཙན, btsan), the gongpo spirits (འགོང་པོ, 'gong po) or the earth lords (ས་བདག, sa bdag)
reading.KhaSrog.EARTH_MOUSE.illness=indigestion and poisoning
reading.KhaSrog.IRON_TIGER=Born in an iron tiger or iron hare year, one has a body of juniper on the plain, cut from the channels of the turtle's kidneys and feet. The forefathers built on a ruined house or field, or covered a black rock. Born on the lake trigram (དྭ, dwa), the joints always ache.
reading.KhaSrog.IRON_TIGER.spirits=the elemental spirits and the gongpo spirits (འགོང་པོ, 'gong po)
reading.KhaSrog.IRON_TIGER.illness=pain of the joints for four generations, and disease of the kidneys
reading.KhaSrog.WATER_DRAGON=Born in a water dragon or water snake year, one has a body of water from the mountain peaks, cut from the water of the turtle's feet. The forefathers stirred a spring and dug wet fields. Born on the water trigram (ཁམ, kham), cold is strong and the kidneys fall ill.
reading.KhaSrog.WATER_DRAGON.spirits=the earth lords (ས་བདག, sa bdag) and the nāga demons
reading.KhaSrog.WATER_DRAGON.illness=pain of the bladder, blocked urine, and lasting cold illness
reading.KhaSrog.WOOD_HORSE=Born in a wood horse or wood sheep year, one has a body of iron in the earth, cut from the turtle's ankles. The forefathers roused a marked nyen (གཉན, gnyan) place of stones, boundaries or meadows. Born on the lake trigram (དྭ, dwa), the body takes faults and ages early.
reading.KhaSrog.WOOD_HORSE.spirits=a spirit risen from a nyen (གཉན, gnyan) place
reading.KhaSrog.WOOD_HORSE.illness=pain of the ankle bones, and nāga illness (ཀླུ་ནད, klu nad)
reading.KhaSrog.FIRE_MONKEY=Born in a fire monkey or fire bird year, one has a body of fire blazing in the hearth, cut from the warmth of the turtle's nose. The forefathers took a masterless man's goods, or hid a corpse's remains in the house. Born on the water trigram (ཁམ, kham), speech stammers.
reading.KhaSrog.FIRE_MONKEY.spirits=the nyen (གཉན, gnyan) lord of the place
reading.KhaSrog.FIRE_MONKEY.illness=blue pocks on the face
reading.KhaSrog.EARTH_DOG=Born in an earth dog or earth pig year, one has a body of juniper of the flat land, cut from the channels of the turtle's lungs, liver and groin. The forefathers cut trees on three peaks or dug out a nyen (གཉན, gnyan) stone where three valleys meet. Born on the thunder trigram (ཟིན, zin), one has little splendour.
reading.KhaSrog.EARTH_DOG.spirits=the lu-tsen (ཀླུ་བཙན, klu btsan) and the lu-sen (ཀླུ་བསེན, klu bsen)
reading.KhaSrog.EARTH_DOG.illness=heart illness, ills of the stomach and liver, and violent stomach pain
reading.KhaSrog.IRON_MOUSE=Born in an iron mouse or iron ox year, one has a body of earth on a mountain peak, cut from the turtle's stomach and spleen. The forefathers stirred the boundaries of fields, or dug into ruins and graves. Born on the fire trigram (ལི, li), it goes badly for the stomach.
reading.KhaSrog.IRON_MOUSE.spirits=the grave demons and the earth lords (ས་བདག, sa bdag)
reading.KhaSrog.IRON_MOUSE.illness=swelling of the spleen, poison in the stomach, and pain of the kidneys and loins
reading.KhaSrog.WATER_TIGER=Born in a water tiger or water hare year, one has a body of iron dwelling in water, cut from the turtle's ribs. The grave was laid on a nyen (གཉན, gnyan) boulder, or the clan's bones were scattered. Young or old, one may die by the blade. Born on the fire trigram (ལི, li), the teeth grow bad and crooked.
reading.KhaSrog.WATER_TIGER.spirits=the spirits that cling to marked earth and stones around the house
reading.KhaSrog.WATER_TIGER.illness=crippled shoulders and arms
reading.KhaSrog.WOOD_DRAGON=Born in a wood dragon or wood snake year, one has a body of the fire of the sky's rain, cut from the warmth of the turtle's brain. Kin-killing (དམེ, dme) defiled the forefathers' hearth, and the protecting luck was lost. Born on the thunder trigram (ཟིན, zin), one has illness of the lungs and liver.
reading.KhaSrog.WOOD_DRAGON.spirits=the demon of the hearth and the nāgas (ཀླུ, klu) below
reading.KhaSrog.WOOD_DRAGON.illness=pain of the brain and illness of the head
reading.KhaSrog.FIRE_HORSE=Born in a fire horse or fire sheep year, one has a body of the water of the sky's rain, cut from the marrow of the turtle's bones. The forefathers destroyed a canal or an old pond. The young die before their elders, and children are orphaned. Born on the earth trigram (ཁོན, khon), the mouth and nose are always dry.
reading.KhaSrog.FIRE_HORSE.spirits=the demons of ponds and canals
reading.KhaSrog.EARTH_MONKEY=Born in an earth monkey or earth bird year, one has a body of earth within a mountain, cut from the turtle's chest and ribs. The forefathers went about at night and shed blood. Born on the thunder trigram (ཟིན, zin), the body is always stiff.
reading.KhaSrog.EARTH_MONKEY.spirits=the spirits that cling to meadows where three or four ways meet
reading.KhaSrog.EARTH_MONKEY.illness=stiffness, pain of the upper back, and vomiting blood
reading.KhaSrog.IRON_DOG=Born in an iron dog or iron pig year, one has a body of iron of the blade's edge, cut from the teeth in the turtle's mouth. The forefathers kept a haunted sword or spear, or a thorny nyen (གཉན, gnyan) stone lay unnoticed in the house. Born on the fire trigram (ལི, li), the teeth are uneven.
reading.KhaSrog.IRON_DOG.spirits=the demon of the shelter or the earth lords (ས་བདག, sa bdag)
reading.KhaSrog.IRON_DOG.illness=illness of the cheeks and teeth, a stiff neck, and vomiting
reading.KhaSrog.WATER_MOUSE=Born in a water mouse or water ox year, one has a body of a wish-granting tree with water, cut from the channels of the turtle's liver. The forefathers cut nyen (གཉན, gnyan) trees, fought at a nyen place, or used an old temple's goods. Born on the lake trigram (དྭ, dwa), the spine falls ill.
reading.KhaSrog.WATER_MOUSE.spirits=the nāga nyen of old temples and of springs where three ways meet
reading.KhaSrog.WATER_MOUSE.illness=illness of the liver, lameness, a crippled hand and tumours of the stomach
reading.KhaSrog.WOOD_TIGER=Born in a wood tiger or wood hare year, one has a body of water in the dust, cut from the dust's water in the turtle. The forefathers wandered abroad and left an old canal to cut a new one. A son may die before the father. Born on the earth trigram (ཁོན, khon), the kidneys and loins fall ill.
reading.KhaSrog.WOOD_TIGER.spirits=the earth demons
reading.KhaSrog.FIRE_DRAGON=Born in a fire dragon or fire snake year, one has a body of earth of a marsh, cut from the channels of the turtle's head. The forefathers broke eggs, cut trees full of sap and dug at a spring where three ways meet. Born on the thunder trigram (ཟིན, zin), one falls ill in the lungs.
reading.KhaSrog.FIRE_DRAGON.spirits=the nāgas (ཀླུ, klu) and the earth lords (ས་བདག, sa bdag)
reading.KhaSrog.EARTH_HORSE=Born in an earth horse or earth sheep year, one has a body of fire of a blazing bird, cut from the warmth of the turtle's brain. The hearth's fire got loose and its defilement brought danger.
reading.KhaSrog.EARTH_HORSE.spirits=the demon of one's own house
reading.KhaSrog.EARTH_HORSE.illness=illness of the brain, a stiff neck, and arrow wounds to the neck and head
reading.KhaSrog.IRON_MONKEY=Born in an iron monkey or iron bird year, one has a body of Chinese juniper, cut from the turtle's spine and loins. A defilement angered the nāgas (ཀླུ, klu). Born on the lake trigram (དྭ, dwa), no hair grows on the face.
reading.KhaSrog.IRON_MONKEY.spirits=the nāga spirits
reading.KhaSrog.IRON_MONKEY.illness=nāga illness (ཀླུ་ནད, klu nad), swellings, itching, gout and stiffness
reading.KhaSrog.WATER_DOG=Born in a water dog or water pig year, one has a body of the great ocean's water, cut from the blood of the channels of the turtle's lower belly. A child born of incest was buried in a grave, or the forefathers committed incest. Twins come, or a child of incest is taken in.
reading.KhaSrog.WATER_DOG.spirits=the great spirits of graves and places of execution
reading.KhaSrog.WATER_DOG.illness=diarrhoea and itching illness
reading.BirthMewa={0} The natal mewa (སྨེ་བ, sme ba), the birth year's, tells whose child one is, the former life and the next, and the image to make for a better rebirth.
reading.BirthMewa.N1=Born under the one-white, one is a child given by the gods, once a king among men and then a god. The line runs to a single child. Driven as if by the wind, one is busy going about. Early life knows much sorrow, and the later happiness. Life lasts 71 years, with four perils of life.
reading.BirthMewa.N1.remedy=make an image of Avalokiteśvara (སྤྱན་རས་གཟིགས, spyan ras gzigs), so that the next life is a wealthy man's, a god's or a brahmin's
reading.BirthMewa.N1.spirits=the gyalpo (རྒྱལ་པོ, rgyal po), the theurang (ཐེའུ་བྲང, the'u brang) and the gongpo spirits (འགོང་པོ, 'gong po), which unsettle the mind
reading.BirthMewa.N1.illness=lameness, gout, faults of the eyes, and pains of the upper body, the nose and the eyes
reading.BirthMewa.N2=Born under the two-black, one is a child of the demons (བདུད, bdud), passed from hell, and was a demon and a rakṣasa before. Parted early from the parents, one moves house again and again. Smooth of tongue and stubborn within, one sheds many tears of grief. Life lasts 61 years, with three obstacles, and two or three children.
reading.BirthMewa.N2.remedy=make an image of Vajrapāṇi (ཕྱག་རྡོར, phyag rdor) and a stupa, and practise the Dharma in measure, so that one is born in Brahmā's realm or as a minister
reading.BirthMewa.N2.spirits=demons of the father's and the mother's side, the earth lords (ས་བདག, sa bdag) and the drewo (གྲེ་བོ, gre bo)
reading.BirthMewa.N2.illness=much illness in childhood; rarely ill later, but an illness that strikes is one of life or death
reading.BirthMewa.N3=Born under the three-blue, one is a child of the senmo (བསེན་མོ, bsen mo) and the nāga demons, once a rock demon and then an elephant. One loves lying asleep, is strong of heart, stingy and crafty. Prosperity wanes from birth, and what one gains is like a bubble. Life lasts 50 years, with three hindrances.
reading.BirthMewa.N3.remedy=give generously and make images of Vajrasattva (རྡོར་སེམས, rdor sems), so that one is born a rich man's daughter in the west
reading.BirthMewa.N3.spirits=the drewo (གྲེ་བོ, gre bo) and the senmo (བསེན་མོ, bsen mo) from birth, the earth demons, and the earth lords (ས་བདག, sa bdag) of hearth, house and fields
reading.BirthMewa.N4=Born under the four-green, one is a child given by a white nāginī, once a nāga and then a white deer. Fond of going about and of great plans, one is deep and venomous within. Quarrels and lawsuits are many, and faults touch the children's senses. Life lasts 65 years, with four hindrances, and four children.
reading.BirthMewa.N4.remedy=offer grain, the lu-men (ཀླུ་སྨན, klu sman) and milk to the nāgas (ཀླུ, klu) and keep from defiling them; make an image of Vajrapāṇi (ཕྱག་རྡོར, phyag rdor) and recite his mantra
reading.BirthMewa.N4.spirits=the nyen (གཉན, gnyan) and the earth lords (ས་བདག, sa bdag), and an earth lord dwelling in one's field or house
reading.BirthMewa.N4.illness=gout, crooked limbs, swellings, sores, madness and fits, and pains of the side
reading.BirthMewa.N5=Born under the five-yellow, one is a child of the royal caste given by the demon lord, a monk in the former life. Steady of mind, learned and faithful in the Dharma, one stays in the father's line. Being white in the Dharma, one lives long. Life lasts 50 years, or ends two years past it, and children are five.
reading.BirthMewa.N5.remedy=make strong rites of fulfilment and confession (བསྐང་བཤགས, bskang bshags) to the protectors one has neglected; make an image of the Buddha and the Vajra Cutter (རྡོར་གཅོད, rdor gcod), so that one is born a mantra practitioner
reading.BirthMewa.N5.spirits=the earth lords (ས་བདག, sa bdag) and the gyalpo (རྒྱལ་པོ, rgyal po) of the forefathers' line, the guardians of temple wealth and the Dharma protectors
reading.BirthMewa.N5.illness=lymph and bile, epidemics, madness and fits
reading.BirthMewa.N6=Born under the six-white, one is a child of the gods' gongpo spirits (འགོང་པོ, 'gong po), passed from the hungry ghosts. Wise but unsteady of face, one loves going about, and keeps a home in two places. The father's line ends. Rarely ill, one falls gravely ill when it comes. Life lasts 70 years, with five hindrances, and five or three children.
reading.BirthMewa.N6.remedy=make the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor) rite and an image of the lama, so that one is born learned in the south or among the gods
reading.BirthMewa.N6.spirits=the gods' spirits, the gongpo spirits (འགོང་པོ, 'gong po), the serak (བསེ་རག, bse rag) and the spirits of the dead who broke their pledges (དམ་སྲི, dam sri)
reading.BirthMewa.N7=Born under the seven-red, one is a child of the tsen (བཙན, btsan), a butcher bearing a blade, and the blade threatens one at the last. Thousands of men and horses come and go. Bold, forgetful, fond of red meat and self-willed, one loves fighting. Life lasts 80 years, with four obstacles, and seven children.
reading.BirthMewa.N7.remedy=make an image of Tārā (སྒྲོལ་མ, sgrol ma), so that one gains a man's body and holds the Vinaya
reading.BirthMewa.N7.spirits=the tsen (བཙན, btsan) and the drewo (གྲེ་བོ, gre bo) worshipped as demons, and the tsen of the blade
reading.BirthMewa.N7.illness=sores and blisters in childhood, sudden pains of the blood, and colic
reading.BirthMewa.N8=Born under the eight-white, one is a child of the gods of Tuṣita (དགའ་ལྡན, dga' ldan), born in Mon (མོན, mon) before and then among the gods. Patient and close within, proud and fair, one is happy in old age, like a river greatest where it ends. Grudges are many. Life lasts 50 years, with three obstacles.
reading.BirthMewa.N8.remedy=make an image of the Teacher, so that one is born a maker of images or a practitioner and then among the gods again; keep from defilement (གྲིབ, grib) and pray to the gods always
reading.BirthMewa.N8.spirits=angered protectors, and the gongpo spirits (འགོང་པོ, 'gong po) and the gyalpo (རྒྱལ་པོ, rgyal po) of the neighbours
reading.BirthMewa.N9=Born under the nine-red, one is a child of the men (སྨན, sman), given by the great sky-men. Holding the seven flowers of prosperity in both hands, one grows rich by one's own skill. Early life is hard and the later happy, but near kin turn hostile. Life lasts 73 years, with five obstacles, two sons and many daughters.
reading.BirthMewa.N9.remedy=make an image of Mañjuśrī (འཇམ་དབྱངས, 'jam dbyangs) and recite dhāraṇīs, so that one is born a wealthy son in Mon (མོན, mon) to the south; perform rites to call prosperity
reading.BirthMewa.N9.spirits=spirits of headlands, springs and thickets
reading.BirthAspect={0} The natal trigram's element, set against the element of each of the birth year's aspects, makes that aspect's share one of the same five; the natal mewa's element is set against the life force (སྲོག, srog) the same way.
reading.BirthAspect.BODY.PARENTS_GOD=Born on the trigram of the body's mother, one's body is the parents' god (ཕ་མ་ལྷ, pha ma lha): the body's share is more than full. One is fair of form and face, and great in vigour.
reading.BirthAspect.BODY.CHILDRENS_GLORY=Born on the trigram of the body's son, one's body is the children's glory (བུ་ཚ་དཔལ, bu tsha dpal): the body's share is full. One is easy to raise when small, and vigour comes easily.
reading.BirthAspect.BODY.LIFE=Born on a trigram of the body's own element, one's body is harmony that is life (མཐུན་པ་ཚེ, mthun pa tshe): the body's share is middling. One is fair of form and face, and carries one's own body.
reading.BirthAspect.BODY.SPIRIT=Born on the trigram of the element the body overcomes, one's body is a spirit that can be survived (ཐུབ་པ་འདྲེ, thub pa 'dre): the body's share is weak. One is hard to raise when small, and often ill.
reading.BirthAspect.BODY.DEMON.IRON=Born on the trigram of the body's enemy, one's body is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): the body's share is cut. One is ill-formed, without fat or flesh, and held by chronic illness. Its image is a broken tree.
reading.BirthAspect.BODY.DEMON.IRON.illness=chronic illness of the lungs
reading.BirthAspect.BODY.DEMON.FIRE=Born on the trigram of the body's enemy, one's body is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): the body's share is cut. One is ill-formed, without fat or flesh, and held by chronic illness. Its image is a broken tree.
reading.BirthAspect.BODY.DEMON.FIRE.illness=fever, heart illness and illness of the flesh
reading.BirthAspect.BODY.DEMON.WATER=Born on the trigram of the body's enemy, one's body is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): the body's share is cut. One is ill-formed, without fat or flesh, and held by chronic illness. Its image is a broken tree.
reading.BirthAspect.BODY.DEMON.WATER.illness=kidney illness, water illness and dropsy
reading.BirthAspect.BODY.DEMON.EARTH=Born on the trigram of the body's enemy, one's body is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): the body's share is cut. One is ill-formed, without fat or flesh, and held by chronic illness. Its image is a broken tree.
reading.BirthAspect.BODY.DEMON.EARTH.illness=illness of the spleen, and haemorrhoids
reading.BirthAspect.BODY.DEMON.WOOD=Born on the trigram of the body's enemy, one's body is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): the body's share is cut. One is ill-formed, without fat or flesh, and held by chronic illness. Its image is a broken tree.
reading.BirthAspect.BODY.DEMON.WOOD.illness=liver illness, crippling and colic
reading.BirthAspect.DESTINY.PARENTS_GOD=Born on the trigram of destiny's mother, one's destiny is the parents' god (ཕ་མ་ལྷ, pha ma lha): its share is more than full. Like a full lake, one has children and wealth, and brothers and servants are many.
reading.BirthAspect.DESTINY.CHILDRENS_GLORY=Born on the trigram of destiny's son, one's destiny is the children's glory (བུ་ཚ་དཔལ, bu tsha dpal): the share of power is full. Children are good and wealth is middling, and rites to call prosperity always go well.
reading.BirthAspect.DESTINY.LIFE=Born on a trigram of destiny's own element, one's destiny is harmony that is life (མཐུན་པ་ཚེ, mthun pa tshe): the share of food and wealth is middling. Wealth is good and children middling, and one gains the peg that raises glory.
reading.BirthAspect.DESTINY.SPIRIT=Born on the trigram of the element destiny overcomes, one's destiny is a spirit that can be survived (ཐུབ་པ་འདྲེ, thub pa 'dre): the share of power is low. Many children are lost young, and wealth swings between full and empty.
reading.BirthAspect.DESTINY.DEMON.IRON=Born on the trigram of destiny's enemy, one's destiny is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): the share is cut, like a lake run dry. Even with seven sons, the line ends; even with herds by the hundred, one ends a beggar. No children of tiger or hare years are born.
reading.BirthAspect.DESTINY.DEMON.FIRE=Born on the trigram of destiny's enemy, one's destiny is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): the share is cut, like a lake run dry. Even with seven sons, the line ends; even with herds by the hundred, one ends a beggar. No children of bird or monkey years are born.
reading.BirthAspect.DESTINY.DEMON.WATER=Born on the trigram of destiny's enemy, one's destiny is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): the share is cut, like a lake run dry. Even with seven sons, the line ends; even with herds by the hundred, one ends a beggar. No children of horse or snake years are born.
reading.BirthAspect.DESTINY.DEMON.EARTH=Born on the trigram of destiny's enemy, one's destiny is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): the share is cut, like a lake run dry. Even with seven sons, the line ends; even with herds by the hundred, one ends a beggar. No children of mouse or pig years are born.
reading.BirthAspect.DESTINY.DEMON.WOOD=Born on the trigram of destiny's enemy, one's destiny is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): the share is cut, like a lake run dry. Even with seven sons, the line ends; even with herds by the hundred, one ends a beggar. No children of ox, dragon, sheep or dog years are born.
reading.BirthAspect.LUCK.PARENTS_GOD=Born on the trigram of the luck's mother, one's luck (ཀླུང་རྟ, klung rta) is the parents' god (ཕ་མ་ལྷ, pha ma lha): its share is more than full. One leads the way, the hope of all around, and gains all one needs. No spell can touch one: its image is an iron pillar.
reading.BirthAspect.LUCK.CHILDRENS_GLORY=Born on the trigram of the luck's son, one's luck (ཀླུང་རྟ, klung rta) is the children's glory (བུ་ཚ་དཔལ, bu tsha dpal): its share is full. Clear of mind, one rises among the noble, is loved, and works for beings without taking sides.
reading.BirthAspect.LUCK.LIFE=Born on a trigram of the luck's own element, one's luck (ཀླུང་རྟ, klung rta) is harmony that is life (མཐུན་པ་ཚེ, mthun pa tshe): its share is middling. One gains means and contentment, decides for oneself, and lets no one else hold the lead rope.
reading.BirthAspect.LUCK.SPIRIT=Born on the trigram of the element the luck overcomes, one's luck (ཀླུང་རྟ, klung rta) is a spirit that can be survived (ཐུབ་པ་འདྲེ, thub pa 'dre): its share is weak. What one does pleases no one, one never rests, and one's words are not heeded.
reading.BirthAspect.LUCK.DEMON.IRON=Born on the trigram of the luck's enemy, one's luck (ཀླུང་རྟ, klung rta) is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): its share is cut. Like a tree's leaves, it grows up while its fruit falls under the ground. Wishes go unmet and near ones turn enemies. The weapons of strife gather.
reading.BirthAspect.LUCK.DEMON.FIRE=Born on the trigram of the luck's enemy, one's luck (ཀླུང་རྟ, klung rta) is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): its share is cut. Like a tree's leaves, it grows up while its fruit falls under the ground. Wishes go unmet and near ones turn enemies. Land and house burn.
reading.BirthAspect.LUCK.DEMON.WATER=Born on the trigram of the luck's enemy, one's luck (ཀླུང་རྟ, klung rta) is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): its share is cut. Like a tree's leaves, it grows up while its fruit falls under the ground. Wishes go unmet and near ones turn enemies. Harm comes from water.
reading.BirthAspect.LUCK.DEMON.EARTH=Born on the trigram of the luck's enemy, one's luck (ཀླུང་རྟ, klung rta) is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): its share is cut. Like a tree's leaves, it grows up while its fruit falls under the ground. Wishes go unmet and near ones turn enemies. One moves from land to land.
reading.BirthAspect.LUCK.DEMON.WOOD=Born on the trigram of the luck's enemy, one's luck (ཀླུང་རྟ, klung rta) is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud): its share is cut. Like a tree's leaves, it grows up while its fruit falls under the ground. Wishes go unmet and near ones turn enemies. The house rots.
reading.BirthAspect.MEWA.PARENTS_GOD=Born under the mewa of the life force's mother, one is the parents' god (ཕ་མ་ལྷ, pha ma lha) by the mewa (སྨེ་བ, sme ba): the share is more than full. Gods and spirits are kind, life meets no obstacle, and enjoyments are very great.
reading.BirthAspect.MEWA.CHILDRENS_GLORY=Born under the mewa of the life force's son, one is the children's glory (བུ་ཚ་དཔལ, bu tsha dpal) by the mewa (སྨེ་བ, sme ba): the share is full. One is never parted from happiness, and it lasts long and steady.
reading.BirthAspect.MEWA.LIFE=Born under a mewa of the life force's own element, one is harmony that is life (མཐུན་པ་ཚེ, mthun pa tshe) by the mewa (སྨེ་བ, sme ba): the share and the enjoyments are middling, and staying in one place wearies one.
reading.BirthAspect.MEWA.SPIRIT=Born under the mewa of the element the life force overcomes, one is a spirit that can be survived (ཐུབ་པ་འདྲེ, thub pa 'dre) by the mewa (སྨེ་བ, sme ba): the share is weak. The body has much illness, and wealth swings between full and empty.
reading.BirthAspect.MEWA.DEMON.IRON=Born under the mewa of the life force's enemy, one is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud) by the mewa (སྨེ་བ, sme ba): the share is cut, and gods and spirits are hostile. Half the wealth goes to spirits and half to enemies. Happiness does not last, and a woman is widowed again and again.
reading.BirthAspect.MEWA.DEMON.IRON.spirits=the tsen (བཙན, btsan) and the drewo (གྲེ་བོ, gre bo)
reading.BirthAspect.MEWA.DEMON.FIRE=Born under the mewa of the life force's enemy, one is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud) by the mewa (སྨེ་བ, sme ba): the share is cut, and gods and spirits are hostile. Half the wealth goes to spirits and half to enemies. Happiness does not last, and a woman is widowed again and again.
reading.BirthAspect.MEWA.DEMON.FIRE.spirits=the demons (བདུད, bdud) and the mamo (མ་མོ, ma mo)
reading.BirthAspect.MEWA.DEMON.WATER=Born under the mewa of the life force's enemy, one is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud) by the mewa (སྨེ་བ, sme ba): the share is cut, and gods and spirits are hostile. Half the wealth goes to spirits and half to enemies. Happiness does not last, and a woman is widowed again and again.
reading.BirthAspect.MEWA.DEMON.WATER.spirits=the nāgas (ཀླུ, klu) and the men (སྨན, sman) of the lakes
reading.BirthAspect.MEWA.DEMON.EARTH=Born under the mewa of the life force's enemy, one is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud) by the mewa (སྨེ་བ, sme ba): the share is cut, and gods and spirits are hostile. Half the wealth goes to spirits and half to enemies. Happiness does not last, and a woman is widowed again and again.
reading.BirthAspect.MEWA.DEMON.EARTH.spirits=the nyen (གཉན, gnyan) and the earth lords (ས་བདག, sa bdag)
reading.BirthAspect.MEWA.DEMON.WOOD=Born under the mewa of the life force's enemy, one is a demon that cannot be survived (མི་ཐུབ་བདུད, mi thub bdud) by the mewa (སྨེ་བ, sme ba): the share is cut, and gods and spirits are hostile. Half the wealth goes to spirits and half to enemies. Happiness does not last, and a woman is widowed again and again.
reading.BirthAspect.MEWA.DEMON.WOOD.spirits=the planets (གཟའ, gza') and the gyalpo (རྒྱལ་པོ, rgyal po)
DpalByur.GLORY=glory falls
DpalByur.MISFORTUNE=misfortune falls
DpalByur.OWN_FOOT=on its own foot
DpalByur.LUSTRE_LOST=lustre lost
DpalByur.LIFE_TAKEN=life taken
reading.DpalByur={0} Glory and misfortune (དཔལ་བྱུར, dpal byur) set one's life force and luck against the father's, and one's body and destiny against the mother's: each meeting is one of five.
reading.DpalByur.VITALITY.GLORY=The father's life force is the mother of one's own, so glory falls (དཔལ་བབས, dpal babs) on the life force. Noble, one is heard in council; humble, one still sees the sky. At the gathering one wins the debate, and the lord is kind. Life stands firmer than a mountain.
reading.DpalByur.BODY.GLORY=The mother's body is the mother of one's own, so glory falls (དཔལ་བབས, dpal babs) on the body. The body thrives and illness is rare. Its image is a fort on a high mountain, ringed by a moat, that enemies gathering from four sides cannot frighten.
reading.DpalByur.DESTINY.GLORY=The mother's destiny is the mother of one's own, so glory falls (དཔལ་བབས, dpal babs) on destiny. Food, wealth and enjoyments are great. Its image is one who finds food on a dry hillside and water in a dry valley.
reading.DpalByur.LUCK.GLORY=The father's luck (ཀླུང་རྟ, klung rta) is the mother of one's own, so glory falls (དཔལ་བབས, dpal babs) on the luck. One is honoured abroad more than at home; three words spoken carry weight, and people are kind wherever one goes. Merit is great.
reading.DpalByur.VITALITY.MISFORTUNE=The father's life force is the enemy of one's own, so misfortune falls (བྱུར་བབས, byur babs) on the life force, and long life is hard. A forefather died abroad, unburied, and laments that he has no place. The life force longs for three things: life, sons and goods.
reading.DpalByur.VITALITY.MISFORTUNE.remedy=turn the wheel of Dharma with the body, make a golden Amitāyus (ཚེ་དཔག་མེད, tshe dpag med), recite the long-life dhāraṇī once each day, plant the life dagger and count the long-life practice; release lives and take none
reading.DpalByur.BODY.MISFORTUNE=The mother's body is the enemy of one's own, so misfortune falls (བྱུར་བབས, byur babs) on the body. The forefathers' graves split three ways and the family into three lines: one thrives, one barely lasts and one nearly ends. The body has a little illness.
reading.DpalByur.BODY.MISFORTUNE.remedy=ransom the body, and offer clothing to a stupa
reading.DpalByur.DESTINY.MISFORTUNE=The mother's destiny is the enemy of one's own, so misfortune falls (བྱུར་བབས, byur babs) on destiny. What is in the mouth the tongue gives away, and what is in the hand falls to the ground. Wealth is small.
reading.DpalByur.DESTINY.MISFORTUNE.remedy=restore destiny, and honour the ordained
reading.DpalByur.LUCK.MISFORTUNE=The father's luck (ཀླུང་རྟ, klung rta) is the enemy of one's own, so misfortune falls (བྱུར་བབས, byur babs) on the luck. What one does pleases no one, the lord is not content, and others take the credit for one's good. People dislike one without cause.
reading.DpalByur.LUCK.MISFORTUNE.remedy=restore the luck, and repair a dangerous path
reading.DpalByur.VITALITY.OWN_FOOT.WOOD=The father's life force is of one's own element, wood, so the life force stands on its own foot (རང་རྐང, rang rkang). The forefathers' line runs to a single heir, and sorcery aimed at the family harms.
reading.DpalByur.VITALITY.OWN_FOOT.FIRE=The father's life force is of one's own element, fire, so the life force stands on its own foot (རང་རྐང, rang rkang). Husband and wife part, and one sets up house again and again.
reading.DpalByur.VITALITY.OWN_FOOT.EARTH=The father's life force is of one's own element, earth, so the life force stands on its own foot (རང་རྐང, rang rkang). One moves land and house often, and holds two places or more.
reading.DpalByur.VITALITY.OWN_FOOT.IRON=The father's life force is of one's own element, iron, so the life force stands on its own foot (རང་རྐང, rang rkang). Rise and fall are great on the maternal uncle's side, or wealth swings between full and empty.
reading.DpalByur.VITALITY.OWN_FOOT.WATER=The father's life force is of one's own element, water, so the life force stands on its own foot (རང་རྐང, rang rkang). The bride and the sisters have chronic illness, and one's own stomach and liver fall ill.
reading.DpalByur.VITALITY.OWN_FOOT.WATER.spirits=the earth lords (ས་བདག, sa bdag), the nāgas (ཀླུ, klu) and the nyen (གཉན, gnyan)
reading.DpalByur.BODY.OWN_FOOT=The mother's body is of the same element as one's own, so the body stands on its own foot (རང་རྐང, rang rkang): its rise and fall are middling.
reading.DpalByur.DESTINY.OWN_FOOT=The mother's destiny is of the same element as one's own, so destiny stands on its own foot (རང་རྐང, rang rkang): food and wealth are middling.
reading.DpalByur.LUCK.OWN_FOOT=The father's luck (ཀླུང་རྟ, klung rta) is of the same element as one's own, so the luck stands on its own foot (རང་རྐང, rang rkang): merit is middling.
reading.DpalByur.VITALITY.LUSTRE_LOST=One's life force is the mother of the father's, so the life force loses its lustre (མདངས་ཤོར, mdangs shor) to it. Life is short.
reading.DpalByur.VITALITY.LUSTRE_LOST.remedy=release lives, and take no other's life
reading.DpalByur.BODY.LUSTRE_LOST=One's body is the mother of the mother's body, so the body loses its lustre (མདངས་ཤོར, mdangs shor) to it. Illness is frequent.
reading.DpalByur.BODY.LUSTRE_LOST.remedy=ransom the body, and offer clothing to a stupa
reading.DpalByur.DESTINY.LUSTRE_LOST=One's destiny is the mother of the mother's destiny, so destiny loses its lustre (མདངས་ཤོར, mdangs shor) to it. Food and wealth are small.
reading.DpalByur.DESTINY.LUSTRE_LOST.remedy=restore destiny, and honour the ordained
reading.DpalByur.LUCK.LUSTRE_LOST=One's luck (ཀླུང་རྟ, klung rta) is the mother of the father's, so the luck loses its lustre (མདངས་ཤོར, mdangs shor) to it. People dislike one.
reading.DpalByur.LUCK.LUSTRE_LOST.remedy=restore the luck, and repair a dangerous path
reading.DpalByur.VITALITY.LIFE_TAKEN=One's life force overcomes the father's, so it takes life (ཚེ་ལེན, tshe len) from it. One lives into the upper middle of a full span.
reading.DpalByur.BODY.LIFE_TAKEN=One's body overcomes the mother's body, so it takes life (ཚེ་ལེན, tshe len) from it. One is rarely ill, and the body fares well.
reading.DpalByur.DESTINY.LIFE_TAKEN=One's destiny overcomes the mother's destiny, so it takes life (ཚེ་ལེན, tshe len) from it. Food and wealth are great.
reading.DpalByur.LUCK.LIFE_TAKEN=One's luck (ཀླུང་རྟ, klung rta) overcomes the father's, so it takes life (ཚེ་ལེན, tshe len) from it. People are kind to one.
LineStage.CROWDED=crowded
LineStage.EMPTY=empty
LineStage.STAYING=staying
LineStage.TORN=torn
reading.BirthLine={0} The line of births (རྒྱ་མ, rgya ma) counts a forefather's life force (སྲོག, srog) through its twelve stages onto one's birth year: on illness the line is crowded, on death empty, on the tomb's seventh it stays, and on the tomb it is torn.
reading.BirthLine.EMPTY=The forefather's life force, counted onto one's birth year, falls on its death: the line is empty. Its luck goes to the daughters.
reading.BirthLine.EMPTY.remedy=send the quick rite of the nine wheels, which fills what is empty, as water fills a vessel
reading.BirthLine.STAYING=The forefather's life force, counted onto one's birth year, falls on the seventh from its tomb: the line stays (སྡོད་པ, sdod pa). Its existence dries up and the shelter of births is cut, and the mouth of death opens when the sky's year or one's progressed sign (ལོག་མེན, log men) brings this year.
reading.BirthLine.STAYING.remedy=send the rite that shakes the earth lords (ས་བདག, sa bdag), like a stroke of the whip; in such a year, make the rite that cuts the shelter of death (ཤི་སྒབ་གཅོད, shi sgab gcod)
reading.BirthLine.TORN=The forefather's life force, counted onto one's birth year, falls on its tomb: the line is kha ral (ཁ་རལ, kha ral), torn. It turns back, and the mouth of death opens where the shelter of death is not cut, above all when the sky's year or one's progressed sign (ལོག་མེན, log men) brings this year.
reading.BirthLine.TORN.remedy=send the quick rite of the five wheels, which binds the line; in such a year, make the rite that cuts the shelter of death (ཤི་སྒབ་གཅོད, shi sgab gcod)
reading.BirthLine.CROWDED.HORSE_SNAKE=Born in a monkey year to a forefather of a horse or snake year, one crowds the line (འཚོམས་པ, 'tshoms pa). Unless the crowding is released, the line's fault shows: priests' sorcery, incest among siblings, and wealth bought from lines that ended. The family's numbers crowd at ten and fourteen and never pass sixteen.
reading.BirthLine.CROWDED.HORSE_SNAKE.remedy=send effigies of a horse and a snake with the count of years; press the demons of crowding and want on the skulls of a bird, a monkey, a dog and a dragon; bind the line's mouth on a lion's head; send the all-gathering secret rite (གསང་བ་ཀུན་འདུས, gsang ba kun 'dus)
reading.BirthLine.CROWDED.TIGER_RABBIT=Born in a snake year to a forefather of a tiger or hare year, one crowds the line (འཚོམས་པ, 'tshoms pa). Unless the crowding is released, the line's fault shows: the nāga demons (ཀླུ་བདུད, klu bdud) of a black spring harm, and haunted wood and black goods are in the house. The numbers hold at seven and nine and never pass eleven.
reading.BirthLine.CROWDED.TIGER_RABBIT.remedy=send effigies of a tiger and a hare with the count of years; press the demons of crowding and want on the skulls of a horse, a snake, an ox and a sheep; send the dong tse (དོང་ཙེ, dong tse) rite; bind the line's mouth on a lion's right shoulder
reading.BirthLine.CROWDED.BIRD_MONKEY=Born in a pig year to a forefather of a bird or monkey year, one crowds the line (འཚོམས་པ, 'tshoms pa). Unless the crowding is released, the line's fault shows: a haunted piece of iron, and a maternal uncle's line ended by kin-killing (དམེ, dme); so the gyalpo (རྒྱལ་པོ, rgyal po) harm. The numbers crowd at four and six, hold at ten and never pass twelve.
reading.BirthLine.CROWDED.BIRD_MONKEY.remedy=turn the blade's edge aside and bind the blade; press the demons of crowding and want on the skulls of a mouse, a pig, an ox and a sheep; bind the line's mouth on a lion's left shoulder; make the dong tse (དོང་ཙེ, dong tse) rite of the thousand-petalled lotus
reading.BirthLine.CROWDED.MOUSE_PIG=Born in a tiger year to a forefather of a mouse or pig year, one crowds the line (འཚོམས་པ, 'tshoms pa). Unless the crowding is released, the line's fault shows: black goods, a quarrel with the earth lords (ས་བདག, sa bdag) and the nāgas (ཀླུ, klu), and a child of incest. The numbers crowd at five and seven and never pass them.
reading.BirthLine.CROWDED.MOUSE_PIG.remedy=send effigies of a mouse and a pig with the count of years; press the demon of crowding on a mule's skull; bind the line's mouth at a lion's haunch; send a black pig's head as the rite
reading.BirthLine.CROWDED.OX=Born in a tiger year to a forefather of an ox year, one crowds the line (འཚོམས་པ, 'tshoms pa). Unless the crowding is released, the line's fault shows: a broken oath is repaid, and a grave was badly placed. The numbers do not grow: they hold at four and six and crowd at sixteen.
reading.BirthLine.CROWDED.OX.spirits=the white theurang (ཐེའུ་བྲང, the'u brang), the gongpo spirits (འགོང་པོ, 'gong po), water demons, and the house's nāgas (ཀླུ, klu)
reading.BirthLine.CROWDED.OX.remedy=send an ox's effigy with the count of years; press the demons of crowding and want on a skull; bind the line's mouth on the right of a lion's belly; make the earth lords' golden thread-cross (གསེར་མདོས, gser mdos) and the dong tse (དོང་ཙེ, dong tse) rite
reading.BirthLine.CROWDED.SHEEP=Born in a tiger year to a forefather of a sheep year, one crowds the line (འཚོམས་པ, 'tshoms pa). Unless the crowding is released, the line's fault shows: an old stupa, and the earth lords (ས་བདག, sa bdag) of old ruined hills, square fields and walls. The numbers hold at one and three, crowd at five and seven, and never pass eight or ten.
reading.BirthLine.CROWDED.SHEEP.remedy=send a dragon's effigy with the count of years; press the demons of crowding and want on a skull; bind the line's mouth in a lion's hands; make the rite that turns the earth lords aside
reading.BirthLine.CROWDED.DOG=Born in a tiger year to a forefather of a dog year, one crowds the line (འཚོམས་པ, 'tshoms pa). Unless the crowding is released, the line's fault shows: offerings to the war gods (དགྲ་ལྷ, dgra lha) and protectors were cut off, a teacher's pledge was broken, and oaths were eaten. The numbers hold at nine and eleven, crowd at fifteen and seventeen, and never pass nineteen.
reading.BirthLine.CROWDED.DOG.spirits=the gyalpo (རྒྱལ་པོ, rgyal po) from the east, and the gyalpo and gongpo spirits (འགོང་པོ, 'gong po) at home and abroad
reading.BirthLine.CROWDED.DOG.remedy=press the demons of crowding and want on a mule's skull; press the skulls of a tiger, a hare and a dragon under a lion's right foot; make the rite that sets the elements right
reading.BirthLine.CROWDED.DRAGON=Born in a tiger year to a forefather of a dragon year, one crowds the line (འཚོམས་པ, 'tshoms pa). Unless the crowding is released, the line's fault shows: a sibling of incest came to the father's brothers' place, and wealth of an ended line was kept. The numbers hold at four and six and never pass eleven.
reading.BirthLine.CROWDED.DRAGON.spirits=the nāga demons and the earth demons
reading.BirthLine.CROWDED.DRAGON.remedy=press the demons of crowding and want on a defiled skull; bind the line's mouth with a tiger, a hare and a dragon on a lion's left hand; send the all-gathering secret rite (གསང་བ་ཀུན་འདུས, gsang ba kun 'dus) and the dong tse (དོང་ཙེ, dong tse) rite
MatchMeeting.AGREE=agrees
MatchMeeting.MIDDLING=middling
MatchMeeting.DISAGREE=disagrees
reading.MatchAspect={0} The single match (རྐྱང་པ, rkyang pa) sets the man's life force and luck against the woman's, and the woman's body and destiny against the man's: mother, son and friend meet well, the enemy badly, and the same element well for earth and water.
reading.MatchAspect.VITALITY.AGREE=The man's life force meets the woman's well: both live long, and their time together is very long. What one says the other takes up, and what one cares for the other carries.
reading.MatchAspect.VITALITY.DISAGREE=The man's life force meets the woman's badly: their time together is short, life is short and illness is much, and nothing they do succeeds.
reading.MatchAspect.VITALITY.DISAGREE.remedy=tie the wheel that raises the life force on the man; ransom life, press down the harmful spirit of the grave, make the long-life rite and set up a fort of life
reading.MatchAspect.BODY.AGREE=The woman's body meets the man's well: children increase, no child dies in the bed, and they are born with sound senses and fair faces.
reading.MatchAspect.BODY.DISAGREE=The woman's body meets the man's badly: chronic illness comes, and children are born with faulty senses.
reading.MatchAspect.BODY.DISAGREE.remedy=the woman wears the wheel that raises the body; make the rites that restore the body, and set up a fort of existence
reading.MatchAspect.DESTINY.AGREE=The woman's destiny meets the man's well: wealth, harvests and livestock increase, no hand need open to others, and food and wealth are abundant.
reading.MatchAspect.DESTINY.DISAGREE=The woman's destiny meets the man's badly: wealth does not stay. Its image is gold dust found outside that turns to earth and stone at home.
reading.MatchAspect.DESTINY.DISAGREE.remedy=make the rites that raise destiny and call prosperity, set up a support of the wealth gods, gather merit and give widely, and offer the torma of Vaiśravaṇa (རྣམ་སྲས, rnam sras)
reading.MatchAspect.LUCK.AGREE=The man's luck (ཀླུང་རྟ, klung rta) meets the woman's well: people are kind, outsiders and insiders alike, and the noble above all protect the two. Horses and donkeys thrive.
reading.MatchAspect.LUCK.DISAGREE=The man's luck (ཀླུང་རྟ, klung rta) meets the woman's badly: people dislike the two, slander never stops, and others take the credit for their good.
reading.MatchAspect.LUCK.DISAGREE.remedy=tie the wheel that raises the luck on the man; turn back the luck's enemies, and repair roads and bridges
reading.MatchAspect.MIDDLING=The two aspects meet in the same element, fire, iron or wood: such a meeting is middling, where the same element in earth or water would meet well.
reading.MatchAspect.KARMA=All four aspects meet as mother and son: the woman is the wife of karma (ལས་ཀྱི་ཆུང་མ, las kyi chung ma), a match that former deeds have brought together.
reading.MatchDestiny={0} The two destinies' elements, set together, tell of the children born to the couple and the household's fortune.
reading.MatchDestiny.WOOD_FIRE=When the destinies are wood and fire, farming on the plain goes happily, and three sons and two daughters are born. It is best when the man's destiny begets the woman's.
reading.MatchDestiny.FIRE_EARTH=When the destinies are fire and earth, about three sons and three daughters are born. It is best when the man's destiny begets the woman's, middling the other way.
reading.MatchDestiny.EARTH_IRON=When the destinies are earth and iron, about three sons and three daughters are born. It is best when the man's destiny begets the woman's, middling the other way.
reading.MatchDestiny.IRON_WATER=When the destinies are iron and water, about three sons and three daughters are born, and wealth gathers, so the household is happy. It is best when the man's destiny begets the woman's.
reading.MatchDestiny.WOOD_WATER=When the destinies are water and wood, one son and one daughter are born, of great benefit. It is best when the man's destiny begets the woman's, middling the other way.
reading.MatchDestiny.WOOD_WOOD=When both destinies are wood, one bold son and one daughter are born. Its image is a grove of willows growing up together.
reading.MatchDestiny.FIRE_FIRE=When both destinies are fire, the two do not suit each other, and are poor and troubled; three sons are born.
reading.MatchDestiny.EARTH_EARTH=When both destinies are earth, the two become lords of the land, and three sons and three daughters are born. Its image is building a fort of earth.
reading.MatchDestiny.IRON_IRON=When both destinies are iron, one bold son and one daughter are born. Making a living is hard, and servants and livestock are lost.
reading.MatchDestiny.WATER_WATER=When both destinies are water, a brother and a sister are born. Its image is small streams that reach the sea together.
reading.MatchDestiny.FIRE_IRON=When the destinies are fire and iron, five sons are born and four die, and the couple's time together is short. It goes worst when the man's destiny cuts the woman's.
reading.MatchDestiny.WOOD_IRON=When the destinies are wood and iron, three sons are born and two die, and two daughters are born too. It goes worst when the man's destiny cuts the woman's.
reading.MatchDestiny.EARTH_WATER=When the destinies are earth and water, five sons are born and three die. It goes worst when the man's destiny cuts the woman's.
reading.MatchDestiny.WOOD_EARTH=When the destinies are wood and earth, six sons are born and four die; the maternal grandmother fares badly and harvests fail. It goes worst when the man's destiny cuts the woman's.
reading.MatchDestiny.FIRE_WATER=When the destinies are fire and water, three daughters are born and the one son born dies; farming is hard and harvests are poor. It goes worst when the man's destiny cuts the woman's.
reading.MatchNiSha={0} The ni sha (ཎི་ཤ, Ni sha) reckoning wants the man of a male year and older, and the woman of a female year and younger.
reading.MatchNiSha.GOOD=The man is of a male year and older, and the woman of a female year and younger: the match is not reversed, and it goes well.
reading.MatchNiSha.REVERSED=The match is reversed: the man is younger than the woman, or her year is male and his female. The man's line is small and the woman's grows, and her word prevails over his.
reading.MatchNiSha.REVERSED.remedy=make an image of Vajrapāṇi (ཕྱག་རྡོར, phyag rdor) for the man, and tie his protective amulet on him
BadYear.HARSH_RNGA_ZOR=a harsh year
BadYear.HARSH_RO_KHUR=a harsh year
BadYear.HARSH_RUS_GCOD=a harsh year
BadYear.HARSH_MDUN_BSDEBS=a harsh year
BadYear.HARSH_GRU_KHYER=a harsh year
BadYear.HARSH_BYE_BRAL=a harsh year
BadYear.BAD_OMEN=a year of bad omen
BadYear.LITTLE_WHITE=a little white year
BadYear.THAN=a year of ill omen
BadYear.BYA_RA=a watchman of sky and earth
BadYear.GRAVE_MEN=a black man of the grave
BadYear.LDING_NAG=a black lding son
BadYear.SRIN_KHYER=carried off by rākṣasas
BadYear.THER_DRE=a year of the ther 'dre (ཐེར་འདྲེ, ther 'dre)
BadYear.WIDOWHOOD=a year of widowhood
BadYear.AVOID=a year to avoid
BadYear.BLACK_FANGS=a black year with fangs
reading.BadYear={0} The bad years (ལོ་ངན, lo ngan) are named lists of birth years, each harmful in a marriage; whoever is born in one brings its harm to the match.
reading.BadYear.HARSH_RNGA_ZOR=Born in an iron dog or iron pig year, one is of the rnga zor (རྔ་ཟོར, rnga zor) years. Iron's four and fire's eight are the harsh years (རྩུབ་པ, rtsub pa), the vicious ones for marriage.
reading.BadYear.HARSH_RNGA_ZOR.remedy=pile seven cairns, offer a measure of grain and five portions of food; when the bride arrives, raise a shout as at an enemy's coming and chase each other in turn; each spouse makes their own rite
reading.BadYear.HARSH_RO_KHUR=Born in an iron mouse or iron ox year, one is of the corpse-carrier years (རོ་ཁུར, ro khur). Iron's four and fire's eight are the harsh years (རྩུབ་པ, rtsub pa), the vicious ones for marriage.
reading.BadYear.HARSH_RO_KHUR.remedy=pile seven cairns, offer a measure of grain and five portions of food; when the bride arrives, raise a shout as at an enemy's coming and chase each other in turn; each spouse makes their own rite
reading.BadYear.HARSH_RUS_GCOD=Born in a fire tiger or fire hare year, one is of the clan-cutter years (རུས་གཅོད, rus gcod). Iron's four and fire's eight are the harsh years (རྩུབ་པ, rtsub pa), the vicious ones for marriage.
reading.BadYear.HARSH_RUS_GCOD.remedy=pile seven cairns, offer a measure of grain and five portions of food; when the bride arrives, raise a shout as at an enemy's coming and chase each other in turn; each spouse makes their own rite
reading.BadYear.HARSH_MDUN_BSDEBS=Born in a fire dragon or fire snake year, one is of the mdun bsdebs (མདུན་བསྡེབས, mdun bsdebs) years. Iron's four and fire's eight are the harsh years (རྩུབ་པ, rtsub pa), the vicious ones for marriage.
reading.BadYear.HARSH_MDUN_BSDEBS.remedy=pile seven cairns, offer a measure of grain and five portions of food; when the bride arrives, raise a shout as at an enemy's coming and chase each other in turn; each spouse makes their own rite
reading.BadYear.HARSH_GRU_KHYER=Born in a fire horse or fire sheep year, one is of the gru khyer (གྲུ་ཁྱེར, gru khyer) years. Iron's four and fire's eight are the harsh years (རྩུབ་པ, rtsub pa), the vicious ones for marriage.
reading.BadYear.HARSH_GRU_KHYER.remedy=pile seven cairns, offer a measure of grain and five portions of food; when the bride arrives, raise a shout as at an enemy's coming and chase each other in turn; each spouse makes their own rite
reading.BadYear.HARSH_BYE_BRAL=Born in a fire monkey or fire bird year, one is of the years of parting (བྱེ་བྲལ, bye bral). Iron's four and fire's eight are the harsh years (རྩུབ་པ, rtsub pa), the vicious ones for marriage.
reading.BadYear.HARSH_BYE_BRAL.remedy=pile seven cairns, offer a measure of grain and five portions of food; when the bride arrives, raise a shout as at an enemy's coming and chase each other in turn; each spouse makes their own rite
reading.BadYear.BAD_OMEN=The fire snake, water pig, water bird, wood bird, iron sheep, earth bird and iron pig, all female years, are the seven years of bad omen (ལྟས་ངན, ltas ngan), each with its own name, among the bad years for marriage.
reading.BadYear.LITTLE_WHITE=The iron dog, iron bird, fire ox, fire monkey, earth dragon and water snake are the six little white years (དཀར་ཆུང, dkar chung), each with its own name, among the bad years for marriage.
reading.BadYear.THAN=The earth dragon, iron sheep, earth monkey, iron bird, iron dog, fire pig and fire ox are the seven persons of ill omen (ཐན་པ, than pa), among the bad years for marriage.
reading.BadYear.BYA_RA=The fire horse and the water mouse are the watchmen of sky and earth (བྱ་ར, bya ra), two years counted among the bad years for marriage.
reading.BadYear.GRAVE_MEN=The iron ox, wood sheep, fire dog and water dragon are the four black men of the grave (དུར་མི་ནག་པོ, dur mi nag po), among the bad years for marriage.
reading.BadYear.LDING_NAG=The water tiger, water snake and iron monkey are the three black lding (ལྡིང་ནག, lding nag) sons, among the bad years for marriage.
reading.BadYear.SRIN_KHYER=The water mouse, horse, bird and hare, the earth pig, snake, bird and hare, the fire dragon and bird and the water ox are the eleven years carried off by rākṣasas (སྲིན་ཁྱེར, srin khyer). They are bad for the one born in them.
reading.BadYear.THER_DRE=The fire horse, water bird, wood hare and iron bird are the four ther 'dre (ཐེར་འདྲེ, ther 'dre) years. They are bad for the one born in them.
reading.BadYear.WIDOWHOOD=The iron monkey and pig, the fire dragon and snake, the earth sheep, the iron dog, the wood snake and the earth bird are the eight years of widowhood (ཡུགས་ས, yugs sa), among the bad years for marriage.
reading.BadYear.AVOID=The wood tiger, iron monkey, water tiger, water monkey, fire tiger, water snake, water dog and water pig are eight bad years: a match that joins one of them is to be avoided above all.
reading.BadYear.BLACK_FANGS=Born under the two-black, one is of the black years with fangs (ལོ་ནག་མཆེ་བ་ཅན, lo nag mche ba can). Taken as a bride, she moves through nine households or parts nine times; or the husband dies by the blade, widowhood falls five times, or her line ends.
MewaPathYear.FIVE_ELEMENTS=a year of all five elements
MewaPathYear.TWO_ELEMENTS=a year of two elements
reading.MewaPathYear={0} The years are also read by the mewa path (སྨེ་ལམ, sme lam), the first, middle or lower sixty years of the mewa's round, and by how many elements the year holds.
reading.MewaPathYear.FIVE_ELEMENTS=Born in such a year of the mewa path, a woman is of the years that hold all five elements: very harsh and bad as a bride, she devours her husband and bares her fangs at him.
reading.MewaPathYear.TWO_ELEMENTS=Born in such a year of the mewa path, one is of the nine years that hold two elements: even with a hundred sons, at last the line ends.
reading.MatchSameKind={0} Two spouses of the same kind of year, by destiny against life force, are not joined: each kind brings its own harm.
reading.MatchSameKind.KHA_YAN=Both are born in kha yan (ཁ་ཡན, kha yan) years, which are not joined: children are born blind, deaf, lame or stammering, or the parents part early. Even if the line survives, only daughters live.
reading.MatchSameKind.KHA_YAN.remedy=if they are joined, make the thread-cross of the khyung's wing and recite the Ratnakūṭa (དཀོན་བརྩེགས, dkon brtsegs)
reading.MatchSameKind.KHONG_NONG=Both are born in khong nong (ཁོང་ནོང, khong nong) years, which are not joined: three sons die. The first half of life is bad and the later happy.
reading.MatchSameKind.KHONG_NONG.remedy=send a ransom for the earlier children
reading.MatchSameKind.SE_ZHIG=Both are born in se zhig (སེ་ཞིག, se zhig) years, which are not joined: the household is merged with another, land and house move, and slander comes.
reading.MatchSameKind.SE_ZHIG.remedy=make the dagger rite and the five sūtras, and recite the Kṣitigarbha (ས་སྙིང, sa snying)
reading.MatchSameKind.KHA_RAL=Both are born in kha ral (ཁ་རལ, kha ral) years, which are not joined: sons are hard to raise, and only daughters live.
reading.MatchSameKind.KHA_RAL.remedy=make the rite of existence's white cow, which clears misfortune
reading.MatchSameKind.DUN_KHUR=Both are born in 'dun khur (འདུན་ཁུར, 'dun khur) years, which are not joined: the pair is broken, and the father's brothers die by the blade.
reading.MatchSameKind.DUN_KHUR.remedy=recite the White Lotus of Compassion (སྙིང་རྗེ་པདྨ་དཀར་པོ, snying rje padma dkar po) and make a tsen thread-cross (བཙན་མདོས, btsan mdos)
reading.MatchPlanet={0} Husband and wife born on the same weekday are joined in one of the planets (གཟའ, gza'), and each planet brings its own harm to the household.
reading.MatchPlanet.SATURDAY=Husband and wife are both born on a Saturday, so they are joined in Saturn: many in the household die, and children are hard to raise.
reading.MatchPlanet.SUN_TUE=Husband and wife are both born on a Sunday, or both on a Tuesday, so they are joined in the Sun or Mars: people and wealth fare badly, life is short, children are hard to raise, and goods are lost.
reading.MatchPlanet.THURSDAY=Husband and wife are both born on a Thursday, so they are joined in Jupiter: few children are born to the household.
reading.MatchPlanet.MON_WED=Husband and wife are both born on a Monday, or both on a Wednesday, so they are joined in the Moon or Mercury: livestock is lost, dry goods do not stay in hand, and farming fails.
reading.MatchPlanet.FRIDAY=Husband and wife are both born on a Friday, so they are joined in Venus: people speak against them, and enemies and lawsuits are many.
YearSexes.MALE_MALE=both male years
YearSexes.FEMALE_FEMALE=both female years
YearSexes.MIXED=a male and a female year
reading.MatchSameAnimal={0} Husband and wife of one year animal meet within it (ནང་ཕྲད, nang phrad), and each animal brings its own lot to the household.
reading.MatchSameAnimal.MOUSE=Husband and wife are both born in mouse years, so they meet in one animal: many children are born, but the household is poor.
reading.MatchSameAnimal.OX=Husband and wife are both born in ox years, so they meet in one animal: children have defects, eating does not fill and saving does not gather, and illness is much and life short.
reading.MatchSameAnimal.TIGER=Husband and wife are both born in tiger years, so they meet in one animal: the household moves from land to land, and the house catches fire.
reading.MatchSameAnimal.RABBIT=Husband and wife are both born in hare years, so they meet in one animal: a son dies and power, food and wealth fail; daughters are many and living is easy, but at the last the line ends.
reading.MatchSameAnimal.DRAGON=Husband and wife are both born in dragon years, so they meet in one animal: food and wealth swing between full and empty.
reading.MatchSameAnimal.SNAKE=Husband and wife are both born in snake years, so they meet in one animal: things are harsh at first and good at last, but quarrels and parting are to be feared.
reading.MatchSameAnimal.HORSE=Husband and wife are both born in horse years, so they meet in one animal: making a living is a long chase, illness and deaths are many, and children are few.
reading.MatchSameAnimal.SHEEP=Husband and wife are both born in sheep years, so they meet in one animal: the first half of life is happy, but in old age there is no leisure and decline is to be feared.
reading.MatchSameAnimal.BIRD=Husband and wife are both born in bird years, so they meet in one animal: children are hard to raise, wealth and livestock are poor, and half the riches are carried off by a demon.
reading.MatchSameAnimal.DOG=Husband and wife are both born in dog years, so they meet in one animal: fights are many, the time together is short, and half the sons die.
reading.MatchSameAnimal.PIG=Husband and wife are both born in pig years, so they meet in one animal: the minds are gentle, children are many, and wealth and enjoyments are great.
reading.MatchSameElement={0} Husband and wife of one element meet within it, and each element brings its own lot by the sexes of their years; years alike in every aspect leave little to eat.
reading.MatchSameElement.IRON_MALE_MALE=Husband and wife are both born in iron years, both of male years, so they meet in one element: it goes badly for the sons, and wealth suffers losses, middling to low.
reading.MatchSameElement.IRON_FEMALE_FEMALE=Husband and wife are both born in iron years, both of female years, so they meet in one element: it goes badly for the daughters.
reading.MatchSameElement.WATER_MALE_MALE=Husband and wife are both born in water years, both of male years, so they meet in one element: daughters are many, and food and wealth suffer losses.
reading.MatchSameElement.EARTH_MALE_MALE=Husband and wife are both born in earth years, both of male years, so they meet in one element: children are many, but daughters are few and hard to raise.
reading.MatchSameElement.EARTH_FEMALE_FEMALE=Husband and wife are both born in earth years, both of female years, so they meet in one element: daughters are many.
reading.MatchSameElement.FIRE_MALE_MALE=Husband and wife are both born in fire years, both of male years, so they meet in one element: the two agree, but sons die and wealth suffers great losses.
reading.MatchSameElement.FIRE_FEMALE_FEMALE=Husband and wife are both born in fire years, both of female years, so they meet in one element: children are many and the household large.
reading.MatchSameElement.WOOD_FEMALE_FEMALE=Husband and wife are both born in wood years, both of female years, so they meet in one element: children do not thrive and are hard to raise.
reading.MatchSameElement.WOOD_MIXED=Husband and wife are both born in wood years, one of a male and one of a female year, so they meet in one element: there is a danger of broken arms and legs.
reading.MatchSameElement.FIRE_MIXED=Husband and wife are both born in fire years, one of a male and one of a female year, so they meet in one element: the first half of life is good and the later bad.
reading.MatchSameElement.EARTH_MIXED=Husband and wife are both born in earth years, one of a male and one of a female year, so they meet in one element: children are many.
reading.MatchSameElement.IRON_MIXED=Husband and wife are both born in iron years, one of a male and one of a female year, so they meet in one element: the prosperity they hold to is small.
reading.MatchSameElement.WATER_MIXED=Husband and wife are both born in water years, one of a male and one of a female year, so they meet in one element: it goes well.
PairList.HEART=close at heart
PairList.CHILDREN=many children
PairList.WEALTH=rich and strong
PairList.PARTING=parting
PairList.HARD_CHILDREN=children hard to raise
PairList.RUIN=the six of ruin
PairList.DESTRUCTION=the six of destruction
PairList.OMEN_GREAT=a great bad omen
PairList.OMEN_MIDDLING=a middling bad omen
reading.MatchPairList={0} Pairs of year animals also fall in named lists: a couple whose two years make up one of a list's pairs shares its lot, whichever of the two is the man.
reading.MatchPairList.HEART=The mouse, the dragon and the monkey are three close at heart that agree: any two of them, joined as husband and wife, suit each other.
reading.MatchPairList.CHILDREN=The hare and pig, bird and snake, ox and sheep, monkey and dragon, and horse and dog, joined two by two, are said to bring many children.
reading.MatchPairList.WEALTH=The bird and ox, tiger and horse, hare and sheep, dragon and pig, and monkey and snake, joined two by two, are held to be rich and strong.
reading.MatchPairList.PARTING=The bird and tiger, monkey and hare, dragon and ox, mouse and snake, dog and sheep, and tiger and pig, joined in turn, bring parting, so they are avoided.
reading.MatchPairList.HARD_CHILDREN=The ox and dog, pig and sheep, and dragon and snake, joined two by two: children are hard to raise.
reading.MatchPairList.RUIN=The bird and dog, horse and ox, and snake and tiger are the pairs of the six of ruin (འཕུང་དྲུག, 'phung drug): joined, they are held to be bad.
reading.MatchPairList.DESTRUCTION=The dog and sheep, ox and hare, and bird and mouse are the pairs of the six of destruction (འཇིག་དྲུག, 'jig drug), and they are bad.
reading.MatchPairList.OMEN_GREAT=The sheep and the snake joined are a great bad omen (ལྟས་ངན, ltas ngan): whatever is done does not work.
reading.MatchPairList.OMEN_GREAT.remedy=make the middling rite of the earth lords' nine rounds
reading.MatchPairList.OMEN_MIDDLING=The horse and dragon, and the horse and snake, joined, are a middling bad omen (ལྟས་ངན, ltas ngan): what they wish for is not fulfilled.
reading.MatchPairList.OMEN_MIDDLING.remedy=make the raven's clearing rite (ཕོ་རོག་གི་རྐྱང་སེལ, pho rog gi rkyang sel), and set up a torma (གཏོར་མ, gtor ma) image of the local god
reading.MatchPairLine={0} Pairs of year animals are read one by one; where one is said to take the other, the first is the man and the second the woman, and elsewhere either may be the man.
reading.MatchPairLine.DOG_MONKEY=A man of a dog year takes a woman of a monkey year: they live long and are rich, and many children are born.
reading.MatchPairLine.BIRD_SNAKE=A man of a bird year takes a woman of a snake year: many children are born, they are rich, and long life and virtue come.
reading.MatchPairLine.PIG_MOUSE=A man of a pig year takes a woman of a mouse year: quarrels are many.
reading.MatchPairLine.TIGER_SNAKE=A man of a tiger year takes a woman of a snake year: many children are born, but enmity arises.
reading.MatchPairLine.SNAKE_TIGER=A man of a snake year takes a woman of a tiger year: lawsuits are many, and at last lawsuits and quarrels ruin them.
reading.MatchPairLine.SHEEP_MOUSE=A man of a sheep year takes a woman of a mouse year: it goes badly for the parents.
reading.MatchPairLine.MONKEY_MOUSE=A man of a monkey year takes a woman of a mouse year: power is small, and at last the line ends.
reading.MatchPairLine.RABBIT_PIG_MOUSE=A man of a hare year takes a woman of a pig or a mouse year: they live long, many children are born, and their means of living are great.
reading.MatchPairLine.DRAGON_BIRD_MONKEY=A man of a dragon year takes a woman of a bird or a monkey year: it goes badly for the parents.
reading.MatchPairLine.SHEEP_OX=A man of a sheep year takes a woman of an ox year: it goes badly for the parents: both are short-lived, and the children are left orphans.
reading.MatchPairLine.MONKEY_WITH_DRAGON=Husband and wife of a monkey year and a dragon year are joined: they live long, many children are born, and they are rich.
reading.MatchPairLine.DOG_WITH_HORSE=Husband and wife of a dog year and a horse year are joined: many children are born, they are rich and live long.
reading.MatchPairLine.PIG_RABBIT=A man of a pig year takes a woman of a hare year: they live long, and many children are born.
reading.MatchPairLine.OX_MOUSE_BIRD=A man of an ox year takes a woman of a mouse or a bird year: they live long, are rich in wealth, have many children and few enemies.
reading.MatchPairLine.TIGER_HORSE=A man of a tiger year takes a woman of a horse year: many children are born, they are rich and live long.
reading.MatchPairLine.DRAGON_WITH_MOUSE_PIG=Husband and wife of a dragon year and a mouse or a pig year are joined: both parents live long, but it goes badly for the children.
reading.MatchPairLine.MONKEY_SNAKE=A man of a monkey year takes a woman of a snake year: they live long, many children are born, and they are rich.
reading.MatchPairLine.BIRD_OX=A man of a bird year takes a woman of an ox year: many children are born, they are rich, and long life comes.
reading.MatchPairLine.SHEEP_SNAKE=A man of a sheep year takes a woman of a snake year: they find contentment.
reading.MatchPairLine.SNAKE_SHEEP=A man of a snake year takes a woman of a sheep year: they live long and are rich.
reading.MatchPairLine.DRAGON_OX=A man of a dragon year takes a woman of an ox year: they are rich in wealth.
reading.MatchPairLine.SNAKE_MOUSE=A man of a snake year takes a woman of a mouse year: nothing they do works.
reading.MatchPairLine.HORSE_OX=A man of a horse year takes a woman of an ox year: they prosper and are rich.
reading.MatchPairLine.OX_WITH_RABBIT=Husband and wife of an ox year and a hare year are joined: they live long, wealth is great, and they find contentment.
reading.MatchPairLine.DOG_TIGER=A man of a dog year takes a woman of a tiger year: it is auspicious.
reading.MatchPairLine.MOUSE_SNAKE=A man of a mouse year takes a woman of a snake year: children die, and those who live are hard to raise.
reading.MatchPairLine.OX_DRAGON=A man of an ox year takes a woman of a dragon year: at last the household is ruined.
reading.MatchPairLine.SHEEP_DOG=A man of a sheep year takes a woman of a dog year: it goes badly for the parents.
reading.MatchPairLine.DOG_SHEEP=A man of a dog year takes a woman of a sheep year: enemies and deaths come.
reading.MatchPairLine.DOG_OX=A man of a dog year takes a woman of an ox year: slander and disputes never stop.
reading.MatchPairLine.OX_DOG=A man of an ox year takes a woman of a dog year: at last the household is ruined.
reading.MatchPairLine.DRAGON_SHEEP=A man of a dragon year takes a woman of a sheep year: they part, and they never see children.
reading.MatchPairLine.SHEEP_DRAGON=A man of a sheep year takes a woman of a dragon year: deaths come, and the punishment of lords and officials falls on them.
reading.MatchPairLine.PIG_WITH_SNAKE=Husband and wife of a pig year and a snake year are joined: the line ends, and quarrels are many.
reading.MatchPairLine.DOG_WITH_DRAGON=Husband and wife of a dog year and a dragon year are joined: losses never stop.
reading.MatchPairLine.DOG_DRAGON=A man of a dog year takes a woman of a dragon year: enmity and disputes are many.
reading.MatchPairLine.MOUSE_WITH_HORSE=Husband and wife of a mouse year and a horse year are joined: there is no peace of mind, and suffering is much.
reading.MatchPairLine.HORSE_MOUSE=A man of a horse year takes a woman of a mouse year: losses are great, and children do not survive.
reading.MatchPairLine.OX_WITH_SHEEP=Husband and wife of an ox year and a sheep year are joined: harvests fail, and trade suffers losses.
reading.MatchPairLine.TIGER_WITH_MONKEY=Husband and wife of a tiger year and a monkey year are joined: enemies gather and the tiger's life is cut short; at odds with all, they are ruined at last.
reading.MatchPairLine.MONKEY_TIGER=A man of a monkey year takes a woman of a tiger year: no children come.
reading.MatchPairLine.SNAKE_HORSE=A man of a snake year takes a woman of a horse year: the line ends.
reading.MatchPairLine.MOUSE_WITH_SHEEP=Husband and wife of a mouse year and a sheep year are joined: quarrels and losses come.
reading.MatchPairLine.SHEEP_PIG=A man of a sheep year takes a woman of a pig year: many children are born.
MatchMewa.SAME=one mewa
MatchMewa.BYUR_DUS=misfortune gathered
MatchMewa.MOTHER_SON=mother and son
MatchMewa.ENEMY=enemies
MatchMewa.DEMON=the mewa's demon
reading.MatchMewa={0} The birth mewas (སྨེ་བ, sme ba) of husband and wife are set together: though the mewas of all four aspects may be compared, the birth mewa is the main one.
reading.MatchMewa.SAME=Husband and wife are born on one mewa and are joined within it: they will have little to eat.
reading.MatchMewa.BYUR_DUS=Man and woman alike are born on the two-black: born together there, misfortune gathers (བྱུར་འདུས, byur 'dus).
reading.MatchMewa.MOTHER_SON=The two birth mewas meet as mother and son, the element of one giving birth to the other's, and such a meeting is good.
reading.MatchMewa.ENEMY=The two birth mewas meet as enemies, the element of one overcoming the other's, and such a meeting is bad.
reading.MatchMewa.DEMON=The man is born on the seven-red and the woman on the three-blue: their mewas meet as enemies, and this is the mewa's demon (སྨེ་བའི་བདུད, sme ba'i bdud), so the two are not joined.
reading.MatchMewa.DEMON.remedy=if they are joined, make the seven rite (བདུན་ཚོག, bdun tshog)
MatchTrigramKind.GNAM_SMAN=the sky goddess
MatchTrigramKind.DPAL_BSKYED=increasing glory
MatchTrigramKind.SROG_TSHO=sustaining life
MatchTrigramKind.BDUD_GCOD=the demon's cut
MatchTrigramKind.LUS_CHAD=the body cut
MatchTrigramKind.DRE_LNGA=the five demons
MatchTrigramKind.GNOD_PA=harm
MatchTrigramKind.ONE=one trigram
reading.MatchTrigram={0} The natal trigrams (སྐྱེས་སྤར, skyes spar) of husband and wife are set together: meeting in the good ways, they are blessed in sons and grandchildren, and in the four bad ways, the children fare badly at last.
reading.MatchTrigram.GNAM_SMAN=The two natal trigrams meet as the sky goddess (གནམ་སྨན, gnam sman), fire with water, earth with sky, lake with mountain, or thunder with wind: a good joining, adorned like gold eyes with turquoise, auspicious, of great glory, with children and wealth.
reading.MatchTrigram.DPAL_BSKYED=The two natal trigrams meet as increasing glory (དཔལ་བསྐྱེད, dpal bskyed), fire with wind, earth with lake, sky with mountain, or water with thunder: good as well, the glory of the gods falls on the people, gods and people are kind, and children and wealth come.
reading.MatchTrigram.SROG_TSHO=The two natal trigrams meet as sustaining life (སྲོག་འཚོ, srog 'tsho), fire with thunder, earth with mountain, or lake with sky: long life and merit come, an auspicious swastika coiled.
reading.MatchTrigram.BDUD_GCOD.LI_KHEN=The fire and sky trigrams meet as the demon's cut (བདུད་གཅོད, bdud gcod), which is bad: each guards an empty house for the other; rich now, they are beggars at last, and a lake of grief and suffering bursts.
reading.MatchTrigram.BDUD_GCOD.LI_KHEN.remedy=turn back the demons' crossroads; as the offering, give food, clothes, medicine and nourishment; drive off the dead who broke their pledges (དམ་སྲི, dam sri) and give water tormas (ཆུ་གཏོར, chu gtor)
reading.MatchTrigram.BDUD_GCOD.DWA_ZIN=The lake and thunder trigrams meet as the demon's cut (བདུད་གཅོད, bdud gcod), which is bad: a knife and a dagger are struck in, and at last one of the couple dies by the blade.
reading.MatchTrigram.BDUD_GCOD.DWA_ZIN.remedy=recite the Eight Appearances of Heaven and Earth (སྣང་བརྒྱད, snang brgyad) and Reciting the Names of Mañjuśrī (མཚན་བརྗོད, mtshan brjod)
reading.MatchTrigram.BDUD_GCOD.KHON_KHAM=The earth and water trigrams meet as the demon's cut (བདུད་གཅོད, bdud gcod), which is bad: born in a house that falls in, they are ever the root of losses.
reading.MatchTrigram.BDUD_GCOD.KHON_KHAM.remedy=make the turning of the face, the turning back at the crossroads and the general thread-cross (མདོས, mdos); recite the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs) and make the cleansing ablution; wind round a willow the size of the body a black thread knotted once for each year of age, and plant it by a water in the north
reading.MatchTrigram.BDUD_GCOD.GIN_ZON=The mountain and wind trigrams meet as the demon's cut (བདུད་གཅོད, bdud gcod), which is bad: the black sky dog: even with a hundred sons, the line ends at last.
reading.MatchTrigram.BDUD_GCOD.GIN_ZON.remedy=recite the Avataṃsaka (ཕལ་པོ་ཆེ, phal po che) and the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs), and make the black sky dog's thread-cross (མདོས, mdos)
reading.MatchTrigram.LUS_CHAD.LI_KHON=The fire and earth trigrams meet as the body cut (ལུས་ཆད, lus chad), which is bad: they part as if the wind carried them off, and in the end the fields fail and the couple are parted.
reading.MatchTrigram.LUS_CHAD.LI_KHON.remedy=recite the Perfection of Wisdom and the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor); draw the fire trigram's seal on a horse's skull, put a hat on a ransom effigy and send them south; send a sheep's skull with its seal and a ransom of clothes to the south-west
reading.MatchTrigram.LUS_CHAD.DWA_ZON=The lake and wind trigrams meet as the body cut (ལུས་ཆད, lus chad), which is bad: a butcher holding a knife, who at last comes riding a donkey and leading a dog.
reading.MatchTrigram.LUS_CHAD.DWA_ZON.remedy=make the earth lords' treasure thread-cross (གཏེར་མདོས, gter mdos) and the long-life rite, and give a feast of lamps that asks for no return; draw the lake's and the wind's seals on a goat's skull and send it with a ransom effigy by the count of years
reading.MatchTrigram.LUS_CHAD.GIN_ZIN=The mountain and thunder trigrams meet as the body cut (ལུས་ཆད, lus chad), which is bad: lawsuits mix with impurity, and though they agree now, they part at last.
reading.MatchTrigram.LUS_CHAD.GIN_ZIN.remedy=set a hawk's feather in a red ransom effigy a span high and send it towards the enemy; draw the thunder's seal on a donkey's skull and send it east with the effigy, silk and pieces of cloth; recite the benefits of circling a stupa
reading.MatchTrigram.LUS_CHAD.KHEN_KHAM=The sky and water trigrams meet as the body cut (ལུས་ཆད, lus chad), which is bad: bound by the robbers of the tsen (བཙན, btsan), they are in danger of losing men and horses.
reading.MatchTrigram.LUS_CHAD.KHEN_KHAM.remedy=press down the harmful spirits of the dead (སྲི, sri) that bring enemies and turn back enemies; tie silk strips on a dog, set a ransom effigy on it and send it north-west; set an effigy on a pig, put a lower garment on it and send it north
reading.MatchTrigram.DRE_LNGA.LI_DWA=The fire and lake trigrams meet as the five demons (འདྲེ་ལྔ, 'dre lnga), which is bad: children, wealth and goods are swept away as by a broom, and loss and emptiness are very great.
reading.MatchTrigram.DRE_LNGA.LI_DWA.remedy=read the Five Dhāraṇīs and the Stream of Wealth; press down the harmful spirits of the dead (སྲི, sri) that bring loss and drive off the tsen demons; send skulls of a horse and a goat with seals and ransom effigies to the south and west
reading.MatchTrigram.DRE_LNGA.KHON_ZON=The earth and wind trigrams meet as the five demons (འདྲེ་ལྔ, 'dre lnga), which is bad: the grave wants them at night: life is harmed, they part, and heirs are few.
reading.MatchTrigram.DRE_LNGA.KHON_ZON.remedy=read the Five Dhāraṇīs and the long-life sūtra and make the rite against parting; tie silk on a sheep, set an effigy on it, cover it right and left with cloth, draw each one's seal and send each to its own direction
reading.MatchTrigram.DRE_LNGA.GIN_KHAM=The mountain and water trigrams meet as the five demons (འདྲེ་ལྔ, 'dre lnga), which is bad: a house of the demons (བདུད, bdud): their happiness is cut off in the middle.
reading.MatchTrigram.DRE_LNGA.GIN_KHAM.remedy=turn back the Lord of Death with an ox's and a pig's skulls; press down the harmful spirits of the dead (སྲི, sri) that bring enemies and offer lamps
reading.MatchTrigram.DRE_LNGA.KHEN_ZIN=The sky and thunder trigrams meet as the five demons (འདྲེ་ལྔ, 'dre lnga), which is bad: the grave wants their life, and lawsuits, slander and deaths come.
reading.MatchTrigram.DRE_LNGA.KHEN_ZIN.remedy=recite the Fortunate Aeon, the Great Strength and the Uṣṇīṣa (གཙུག་ཏོར, gtsug tor); make tsatsas and offer lamps; shape an old man's figure from the earth of a fallen bank in the north-west, and send it with an effigy by the count of years and a dog's skull with its seal to the north-west
reading.MatchTrigram.GNOD_PA.LI_GIN=The fire and mountain trigrams meet as harm (གནོད་པ, gnod pa), which is bad: called fire blazing in the sky: power devours wealth.
reading.MatchTrigram.GNOD_PA.LI_GIN.remedy=give a feast that asks for no return and call the prosperity of wealth; set effigies on figures of a horse and an ox, cover them with an upper garment and a garment for the right leg, and send them south and north-east
reading.MatchTrigram.GNOD_PA.KHEN_ZON=The sky and wind trigrams meet as harm (གནོད་པ, gnod pa), which is bad: the black dog of sky and earth: the line ends, and ogres carry off the body.
reading.MatchTrigram.GNOD_PA.KHEN_ZON.remedy=read the Five Dhāraṇīs, the Ratnaketu Dhāraṇī (ཏོག་གཟུངས, tog gzungs) and the Avataṃsaka (ཕལ་པོ་ཆེ, phal po che)
reading.MatchTrigram.GNOD_PA.DWA_KHAM=The lake and water trigrams meet as harm (གནོད་པ, gnod pa), which is bad: a river cut at the waist: clans break up, and partings and ruin are many.
reading.MatchTrigram.GNOD_PA.DWA_KHAM.remedy=make the rite against parting and recite the Ratnakūṭa (དཀོན་བརྩེགས, dkon brtsegs); set effigies on figures of a goat and a pig, stick in their own feathered arrows and send them north-west
reading.MatchTrigram.GNOD_PA.KHON_ZIN=The earth and thunder trigrams meet as harm (གནོད་པ, gnod pa), which is bad: like robbers setting out: men and horses are lost at once.
reading.MatchTrigram.GNOD_PA.KHON_ZIN.remedy=press down the harmful spirits of the dead (སྲི, sri) that bring enemies and turn back enemies; tie silk strips on a hare's figure, set a ransom effigy on it and send it east; set an effigy on a yellow-headed sheep, put a collar and a sheepskin on it and send it south-west
reading.MatchTrigram.ONE.LI=Husband and wife are both born on the fire trigram, and one trigram joined within is bad: the mouth turned down. Such a joining has its power carried off as by robbers.
reading.MatchTrigram.ONE.KHON=Husband and wife are both born on the earth trigram, and one trigram joined within is bad: the earth churned. Such a joining has its power carried off as by robbers.
reading.MatchTrigram.ONE.DWA=Husband and wife are both born on the lake trigram, and one trigram joined within is bad: a knife and a dagger struck in. Such a joining has its power carried off as by robbers.
reading.MatchTrigram.ONE.KHEN=Husband and wife are both born on the sky trigram, and one trigram joined within is bad: vanished into the sky. Such a joining has its power carried off as by robbers.
reading.MatchTrigram.ONE.KHAM=Husband and wife are both born on the water trigram, and one trigram joined within is bad: burst at the foot. Such a joining has its power carried off as by robbers.
reading.MatchTrigram.ONE.GIN=Husband and wife are both born on the mountain trigram, and one trigram joined within is bad: carried off to the mountain. Such a joining has its power carried off as by robbers.
reading.MatchTrigram.ONE.ZIN=Husband and wife are both born on the thunder trigram, and one trigram joined within is bad: lost in the nest. Such a joining has its power carried off as by robbers.
reading.MatchTrigram.ONE.ZON=Husband and wife are both born on the wind trigram, and one trigram joined within is bad: struck by defilement. Such a joining has its power carried off as by robbers.
reading.MatchTrigramChildren={0} The natal trigrams joined also tell how many children come. Some hold that two male trigrams bring many sons and two female ones many daughters, which is to be examined.
reading.MatchTrigramChildren.LI_KHON=When the natal trigrams are fire and earth, five children are born.
reading.MatchTrigramChildren.KHON_DWA=When the natal trigrams are earth and lake, eight or nine children are born.
reading.MatchTrigramChildren.DWA_GIN=When the natal trigrams are lake and mountain, three or five children come.
reading.MatchTrigramChildren.GIN_KHAM=When the natal trigrams are mountain and water, three or two children are born, or else five sons.
reading.MatchTrigramChildren.GIN_ZIN=When the natal trigrams are mountain and thunder, one son and one daughter are born.
reading.MatchTrigramChildren.ZON_ZIN=When the natal trigrams are wind and thunder, two sons are born.
reading.MatchTrigramChildren.KHAM_ZON=When the natal trigrams are water and wind, three sons come.
reading.MatchTrigramChildren.DWA_KHEN=When the natal trigrams are lake and sky, three or five children come.
reading.MatchTrigramChildren.LI_KHEN=When the natal trigrams are fire and sky, two brothers come.
reading.MatchTrigramChildren.LI_ZON=When the natal trigrams are fire and wind, many daughters are born.
reading.MatchTrigramChildren.KHAM_ZIN=When the natal trigrams are water and thunder, one son and two daughters are born.
reading.MatchHandWaver={0} Eight births, each in a pair of year animals on one trigram, are named the eight hand-wavers (ལག་གཡབ་བརྒྱད, lag g.yab brgyad), and a joining with one of them is bad.
reading.MatchHandWaver.GIN=Born in the year of an ox or a tiger on the mountain trigram, one is of the eight hand-wavers (ལག་གཡབ་བརྒྱད, lag g.yab brgyad): a joining with them goes badly.
reading.MatchHandWaver.ZON=Born in the year of a dragon or a snake on the wind trigram, one is of the eight hand-wavers (ལག་གཡབ་བརྒྱད, lag g.yab brgyad): a joining with them goes badly.
reading.MatchHandWaver.KHON=Born in the year of a sheep or a monkey on the earth trigram, one is of the eight hand-wavers (ལག་གཡབ་བརྒྱད, lag g.yab brgyad): a joining with them goes badly.
reading.MatchHandWaver.KHEN=Born in the year of a mouse or a pig on the sky trigram, one is of the eight hand-wavers (ལག་གཡབ་བརྒྱད, lag g.yab brgyad): a joining with them goes badly.
MatchTrigramLine.WOOD_WOMAN_KHON=a wood woman on the earth trigram
MatchTrigramLine.IRON_HUSBAND_GIN=an iron husband on the mountain trigram
MatchTrigramLine.KHEN_WOMAN_ZON_MAN=sky and wind
reading.MatchTrigramLine={0} Some births on a natal trigram are read one by one: through the earth lords (ས་བདག, sa bdag) they harm the spouse, or they harm the household's wealth.
reading.MatchTrigramLine.WOOD_WOMAN_KHON=A woman of a wood tiger or wood hare year, born on the earth trigram: the earth lords harm her husband.
reading.MatchTrigramLine.WOOD_WOMAN_KHON.remedy=make the rite that sets the earth lords right
reading.MatchTrigramLine.IRON_HUSBAND_GIN=A husband of an iron bird or iron monkey year, born on the mountain trigram: the earth lords harm his wife.
reading.MatchTrigramLine.IRON_HUSBAND_GIN.remedy=make the rite that sets the earth lords right, and recite the Eight Appearances of Heaven and Earth (སྣང་བརྒྱད, snang brgyad)
reading.MatchTrigramLine.KHEN_WOMAN_ZON_MAN=The woman is born on the sky trigram and the man on the wind trigram: the later years go badly, and so does wealth.
reading.MatchTrigramLine.KHEN_WOMAN_ZON_MAN.remedy=make the practice that gathers wealth
