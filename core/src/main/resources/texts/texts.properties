# Readings: ROKUYO
reading.Rokuyo.SENSHO=Act early: the morning is lucky, the afternoon unlucky. Taken as good for urgent business and lawsuits.
reading.Rokuyo.TOMOBIKI=A draw: neither side wins. Good for celebrations; lucky in the morning and evening, unlucky at noon. Funerals are customarily avoided, a folk belief from the similar-sounding 友曳.
reading.Rokuyo.SENBU=Wait quietly and avoid haste: the morning is unlucky, the afternoon lucky. Disputes and urgent matters are best avoided.
reading.Rokuyo.BUTSUMETSU=Nothing comes to fruition; the worst of the six, and weddings are avoided. Despite the name it has nothing to do with Buddhism: the old name meant "empty".
reading.Rokuyo.TAIAN=Great peace: success in everything — travel, moving house, marriage, opening a shop.
reading.Rokuyo.SHAKKO=Unlucky for celebrations; only the hour of the Horse, about 11:00–13:00, is lucky. Take care with fire and blades.

# Readings: CHOKU
reading.Choku.TATSU=Very lucky, good for everything.
reading.Choku.NOZOKU=A day to ward off what is bad.
reading.Choku.MITSU=A full day.
reading.Choku.TAIRA=Good and bad are level; very good for talks.
reading.Choku.SADAN=A day for settling things.
reading.Choku.TORU=A day for taking things in.
reading.Choku.YABURU=A breaking day.
reading.Choku.AYAUSHI=A precarious day.
reading.Choku.NARU=A day of completion.
reading.Choku.OSAN=A day of gathering in; no obstacle to ordinary affairs.
reading.Choku.HIRAKU=An opening day: what you begin finds its way.
reading.Choku.TOZU=A closing day, bad for most things.

# Readings: SHUKU
reading.Shuku.BO=Very lucky.
reading.Shuku.KI=Funerals and interments bring great misfortune.
reading.Shuku.TO=Wells and storehouses built today fill with treasure.
reading.Shuku.GYU=Good for everything.
reading.Shuku.JO=A bad day.
reading.Shuku.KYO=Misfortune follows at once.
reading.Shuku.KIH=A very bad day: these bring poverty.
reading.Shuku.RO=Very good for weddings.
reading.Shuku.I=Funerals are especially to be avoided.
reading.Shuku.SHI=A bad day: a wedding scatters wealth and brings illness. Be restrained.
reading.Shuku.SEI=A calm, lucky day.
reading.Shuku.KI2=A very lucky day, good for everything.
reading.Shuku.RYU=A funeral brings seven misfortunes.
reading.Shuku.SEI2=A very bad day for these.
reading.Shuku.CHO=These lay the foundation of the family's prosperity.
reading.Shuku.YOKU=A bad day.

# Readings: SENJITSU
reading.Senjitsu.TENSHA=The hundred gods rise to heaven and heaven forgives all wrongs: the best day of the year, noted as "good for all". Five or six times a year.
reading.Senjitsu.ICHIRYU_MANBAI=A single grain grows into ten thousand: taken as good for beginnings. A Japanese selection without a classical Chinese source; its credibility is low.
reading.Senjitsu.DAIMYO=Heaven and earth open and the sun reaches every corner: very good for all good deeds.
reading.Senjitsu.TENON=A day of heaven's grace: very good for happy occasions, not to be used for sad ones.
reading.Senjitsu.BOSO=Heaven cherishes people as a mother her child: good for everything, marriage especially.
reading.Senjitsu.SETTOKU=Good for work that touches the earth, such as extending or rebuilding a house.
reading.Senjitsu.KISHUKU=The day of the lodge 鬼, which the almanac counts very lucky.
reading.Senjitsu.TORA=The Tiger day of the twelve-day cycle. A tiger goes a thousand ri and comes back a thousand ri, so weddings were avoided. The festival day of Bishamonten.
reading.Senjitsu.MI=The Snake day of the twelve-day cycle.
reading.Senjitsu.TSUCHINOTO_MI=The festival day of Benzaiten, once every sixty days.
reading.Senjitsu.KINOE_NE=The first of the sixty days and the festival day of Daikokuten. On 甲子待 people stayed up until the hour of the Rat and offered soybeans, black beans and forked radish for worldly fortune.
reading.Senjitsu.TENICHI_TENJO=For these sixteen days the direction god Ten'ichi-jin is back in heaven, so no direction is blocked and any journey is fine. Nichiyū-jin stays in the house instead: keep it clean.
reading.Senjitsu.JUSHI=The black day, the worst of all: no other annotation need be read, and the lower band of the almanac printed nothing else on it. An illness begun today is said to be fatal. Funerals alone are not affected.
reading.Senjitsu.JISSHI=Next after the black day: bad for everything, funerals included. Like the black day, it stood alone in the lower band of the almanac.
reading.Senjitsu.KIKO=The spirit of the star Tianbang stands at the door and keeps people from coming home.
reading.Senjitsu.CHIIMI=Seeing blood is unlucky.
reading.Senjitsu.TENKA=Heaven's fire is fierce: raising a roof today is said to bring fire.
reading.Senjitsu.JIKA=The earth's fire is fierce.
reading.Senjitsu.OMO="Go and perish": once the day armies did not march.
reading.Senjitsu.FUJOJU=Nothing is accomplished: starting anything is unlucky.
reading.Senjitsu.SANRINBO=Building today is said to ruin three neighbours. Some almanacs add that climbing high brings injury.
reading.Senjitsu.JIPPOGURE=Ten days when the energies of heaven and earth clash and nothing goes well: much toil, little result.
reading.Senjitsu.HASSEN=Twelve days in which eight have stem and branch of the same element: good grows better and bad grows worse, and later almanacs stressed only the bad.
reading.Senjitsu.HASSEN_MABI=One of the four days within 八専 whose stem and branch do not share an element: free of its influence.
reading.Senjitsu.OTSUCHI=The earth god Dokujin is in the ground: do not disturb the soil.
reading.Senjitsu.KOTSUCHI=The earth god Dokujin is in the ground: do not disturb the soil.
reading.Senjitsu.TSUCHI_MABI=The day between the great and lesser earth taboos, without their restrictions.
reading.Senjitsu.SAIGEJIKI=The star spirit Tenkō comes down to eat; what people eat loses its strength. A light bad day: when another annotation names the day good it need not be kept, but with another bad day it weighs more. A guide of 1901 puts it so: it does no harm on a day whose stem and branch feed one another and which falls on no other bad day.
reading.Senjitsu.JUNICHI=What is done today happens again: good for good things, bad for bad ones. Weddings are avoided, as they would repeat.
reading.Senjitsu.FUKUNICHI=Good deeds today are doubled and so are bad ones. Weddings are avoided, as they would repeat.
reading.Senjitsu.KANOE_SARU=Kōshin night: the three worms in the body rise to heaven while one sleeps and report one's misdeeds, so people stayed awake together (庚申待).
reading.Senjitsu.TAIKA=The worst of the three bad days for your birth year. The Hoki naiden, the classical source, gives the three bad days by the solar month, each to the person born in a year of that month's branch, as the app shows them; later almanacs mostly treat them as bad for everyone.
reading.Senjitsu.ROSHAKU=One of the three bad days for your birth year: everything is said to fail. The Hoki naiden, the classical source, gives the three bad days by the solar month, each to the person born in a year of that month's branch, as the app shows them; later almanacs mostly treat them as bad for everyone.
reading.Senjitsu.METSUMON=One of the three bad days for your birth year: said to ruin a whole house. The Hoki naiden, the classical source, gives the three bad days by the solar month, each to the person born in a year of that month's branch, as the app shows them; later almanacs mostly treat them as bad for everyone.

# Readings: ZASSETSU
reading.Zassetsu.SETSUBUN=The day before 立春. Once the eve of every season, now only of spring; the bean-throwing comes from the Chinese exorcism 追儺.
reading.Zassetsu.HIGAN_IRI=First day of the seven days centred on the equinox.
reading.Zassetsu.HIGAN=Within the seven days centred on the equinox.
reading.Zassetsu.HIGAN_CHUNICHI=The equinox itself, middle day of higan.
reading.Zassetsu.HIGAN_AKE=Last day of higan.
reading.Zassetsu.SHANICHI=The 戊 day nearest the equinox, dedicated to the earth deity. Dropped from the official ephemeris after the war.
reading.Zassetsu.HACHIJUHACHIYA=The 88th day from 立春: the end of the frost season — beware the late frost.
reading.Zassetsu.NYUBAI=The sun at longitude 80°: the calendar start of the rainy season.
reading.Zassetsu.HANGESHO=The sun at longitude 100°.
reading.Zassetsu.DOYO_IRI=Start of the eighteen or so days before a season begins, which five-element theory gives to earth.
reading.Zassetsu.DOYO=Within the earth season before a new season begins.
reading.Zassetsu.DOYO_USHI=An Ox day within doyō.
reading.Zassetsu.NIHYAKUTOKA=The 210th day from 立春, when rice is in flower and typhoons approach.
reading.Zassetsu.NIHYAKUHATSUKA=The 220th day from 立春, still in the typhoon season.

# Readings: ELEMENT_PAIR
reading.ElementPair.EARTH_EARTH=Earth meets earth: attainment (dngos grub), and with it whatever is wished succeeds; good for raising supports, building, buying fields, increasing rites, councils and lasting work. Of the ten, the White Beryl counts it among the three good.
reading.ElementPair.WATER_WATER=Water meets water: nectar (bdud rtsi), which increases life and strength; good for trade, field work, preparing medicine, bathing, taking a bride and long-life rites. Of the ten, the White Beryl counts it among the three good.
reading.ElementPair.EARTH_WATER=Earth meets water: youth (lang tsho), which brings great happiness; good for wearing fine clothes and ornaments, games and music, and feasts. Of the ten, the White Beryl counts it among the three good.
reading.ElementPair.FIRE_FIRE=Fire meets fire: growth ('phel 'gyur), which brings food and clothes; good for trade, sowing, giving, rites for wealth and virtuous work. Of the ten, the White Beryl counts it among the three that sustain (gso thub), which come after the three good.
reading.ElementPair.WIND_WIND=Wind meets wind: perfection (phun tshogs), and quick accomplishment of wishes; good for travel, settling quarrels, work on the move, fierce work and anything to be done quickly. Of the ten, the White Beryl counts it among the three that sustain (gso thub), which come after the three good.
reading.ElementPair.FIRE_WIND=Fire meets wind: strength (stobs ldan), which brings good omens; good for rituals, offerings to deities, dharma practice, and pacifying, increasing and controlling rites. Of the ten, the White Beryl counts it among the three that sustain (gso thub), which come after the three good.
reading.ElementPair.EARTH_WIND=Earth meets wind: incompatibility (mi 'phrod), which exhausts food and wealth; robbery and grief come, and aims are not achieved. Of the ten, the White Beryl counts it among the three bad.
reading.ElementPair.WATER_WIND=Water meets wind: discord (mi mthun), which separates relatives and friends; it serves to sow dissension and drive enemies out. Of the ten, the White Beryl counts it among the three bad.
reading.ElementPair.EARTH_FIRE=Earth meets fire: burning (sreg pa), which creates suffering; it serves for war, defeating enemies, fierce work and disputes. Of the ten, the White Beryl counts it among the three bad.
reading.ElementPair.FIRE_WATER=Fire meets water: death ('chi ba), which robs life away; it serves for killing, directing magic and poison. Of the ten, the White Beryl counts it the worst (tha chad).

# Readings: SPECIAL_DAY
reading.SpecialDay.EIGHTH=A special day for any wholesome action; recommended for lay practitioners to take the eight precepts.
reading.SpecialDay.TENTH=Guru Rinpoche promised to come to Tibet on every tenth day, so each tenth day is a festival of his enlightened activity, kept with tsok offerings and guru pūjā (after Jigme Lingpa's prayer on the benefits of the tenth day).
reading.SpecialDay.FULL_MOON=Full moon: a special day for any wholesome action, and a Sojong day of monastic confession.
reading.SpecialDay.TWENTY_FIFTH=A day for tsok offerings, especially recommended for guru pūjā.
reading.SpecialDay.NEW_MOON=New moon: a special day for any wholesome action, and a Sojong day of monastic confession.

# Readings: TIBETAN_FESTIVAL
reading.TibetanFestival.LOSAR=The first day of the Tibetan year, celebrated in every auspicious and joyous way; the first fifteen days commemorate the Buddha's miracles.
reading.TibetanFestival.CHOTRUL_DUCHEN=The day of Buddha Śākyamuni's great miracles. Positive and negative actions on such days multiply.
reading.TibetanFestival.KALACAKRA=The revelation of the Kālacakra Tantra.
reading.TibetanFestival.BIRTH=The birth of the Buddha.
reading.TibetanFestival.SAGA_DAWA_DUCHEN=The full moon of Saga Dawa, the fourth month: the day on which the Buddha took birth, attained enlightenment and passed into parinirvāṇa.
reading.TibetanFestival.ZAMLING_CHISANG=The universal smoke offering (sang) to all the protectors.
reading.TibetanFestival.CHOKHOR_DUCHEN=Buddha Śākyamuni turns the wheel of Dharma for the first time.
reading.TibetanFestival.ENTRY_INTO_WOMB=The Buddha's entry into the womb of his mother.
reading.TibetanFestival.LHABAB_DUCHEN=Buddha Śākyamuni returns from the realm of the gods.
reading.TibetanFestival.GADEN_NGAMCHO=The parinirvāṇa of Je Tsongkhapa.
reading.TibetanFestival.SANGPO_CHUZOM=The day of the ten good omens: for turning inauspicious circumstances into auspicious ones, and for merrymaking.
reading.TibetanFestival.PROTECTORS=Thanksgiving to the Dharma protectors at the close of the year.

# Readings: PERSONAL_DAY
reading.PersonalDay.LUCK=A harmonious weekday for your birth year: suitable for starting projects and celebrating auspicious events.
reading.PersonalDay.LIFE=A harmonious weekday for your birth year: suitable for starting projects and celebrating auspicious events.
reading.PersonalDay.ANTI=A disharmonious weekday for your birth year: generally unsuitable for starting things or celebrations.
reading.PersonalMansion.BLA=One of your six personal mansions, by the animal of your birth year. Work and undertakings succeed on it, and it is good for anything. Someone born when the moon stands in their own la mansion, the mansion of the life-spirit, lives long.
reading.PersonalMansion.SROG=One of your six personal mansions, by the animal of your birth year. It is good for anything.
reading.PersonalMansion.DBANG=One of your six personal mansions, by the animal of your birth year. It is good for anything. Someone born when the moon stands in their own power mansion gains great merit.
reading.PersonalMansion.SKEG=One of your six personal mansions, by the animal of your birth year. It is bad; the Sakya manual calls it bad for anything.
reading.PersonalMansion.BDUD=One of your six personal mansions, by the animal of your birth year. It is bad.
reading.PersonalMansion.GSHED=One of your six personal mansions, by the animal of your birth year. It is good for subduing obstructing spirits and bad otherwise. Someone born when the moon stands in their own slayer mansion has a short life: it is the same as the death mansion ('chi skar).

# Readings: JAPANESE_FESTIVAL
reading.Festival.旧正月=The first day of the first month of the old lunisolar calendar.
reading.Festival.人日の節句=One of the five seasonal festivals (五節句), on the 7th day of the 1st month. The five were official holidays until 1872.
reading.Festival.上巳の節句=One of the five seasonal festivals, on the 3rd day of the 3rd month.
reading.Festival.端午の節句=One of the five seasonal festivals, on the 5th day of the 5th month.
reading.Festival.七夕=One of the five seasonal festivals, on the 7th day of the 7th month. Kept on the old-calendar date it is the "traditional Tanabata".
reading.Festival.十五夜=The mid-autumn moon of the 15th night of the 8th month, the moon-viewing night.
reading.Festival.重陽の節句=One of the five seasonal festivals, on the 9th day of the 9th month.
reading.Festival.十三夜=A second moon-viewing on the 13th night of the 9th month, a custom found only in Japan, said to begin with a moon-viewing held by the retired emperor Uda in 919. Also called the later moon, chestnut moon or bean moon.
reading.Festival.お盆=The festival of the ancestors' spirits, once held around the 15th day of the 7th month of the old calendar. Since the solar calendar was adopted in the Meiji era, most regions keep it a month late (月遅れ), 13–16 August, around the 15th shown here, because mid-July fell in the busy farming season; Tokyo keeps 15 July, and Okinawa and Amami the old-calendar date.

# Readings: lunar mansions and the activity lists (Henning)
reading.Mansion={0} The lists join the White Beryl's verse on the mansion, first, with what the list of lunar mansions names it good for and the activity lists that follow the White Beryl; where they disagree both are shown, and the day in brief weighs neither. Activities not named are neutral.
reading.Mansion.ASHVINI=Suited to trade, the fine arts and the like. Its nature is unstable, light and swift, linked with enemies. Planet: Sun. Foods: meat and honey.
reading.Mansion.BHARANI=Suited to destruction, deceit and the like. Its nature is successful in stable aims, and severe, linked with pollution. Planet: Moon. Foods: sesame and rice.
reading.Mansion.KRITTIKA=Suited to mixed work. Its nature is balanced and mixed, linked with repetition. Planet: Mars. Foods: curd.
reading.Mansion.ROHINI=Suited to coronations, sowing and other lasting works. Its nature is very stable and permanent, linked with good fortune. Planet: Mercury. Foods: yoghurt or honey.
reading.Mansion.MRIGASHIRAS=Suited to love, making friends, ornaments and marriage. Its nature is quickly good, mild and tender, linked with pollution. Planet: Jupiter. Foods: wild game.
reading.Mansion.ARDRA=Suited to attacks, incantations, killing and the parting of friends. Its nature is bad and dreadful, linked with the traveller. Planet: Venus. Foods: blood and water.
reading.Mansion.PUNARVASU=Suited to temporary works. Its nature is quickly changing and ephemeral, linked with good fortune. Planet: Saturn. Foods: pastry.
reading.Mansion.PUSHYA=Suited to trade, love, the fine arts and the like. Its nature is unstable, light and swift, linked with accomplishment. Planet: Sun. Foods: honey and rabbit.
reading.Mansion.ASHLESHA=Suited to incantations, attacks and the like. Its nature is bad and dreadful, linked with the traveller. Planet: Moon. Foods: snake meat.
reading.Mansion.MAGHA=Suited to destruction, deceit and the like. Its nature is successful in stable aims, and severe, linked with enemies. Planet: Mars. Foods: sesame soup.
reading.Mansion.PURVAPHALGUNI=Suited to destruction, deceit and the like. Its nature is successful in stable aims, and severe, linked with pollution. Planet: Mercury. Foods: rice and roasted sesame.
reading.Mansion.UTTARAPHALGUNI=Suited to coronations, sowing and other lasting works. Its nature is very stable and permanent, linked with enemies. Planet: Jupiter. Foods: millet.
reading.Mansion.HASTA=Suited to trade, love, the fine arts and the like. Its nature is unstable, light and swift, linked with death. Planet: Venus. Foods: bird meat and ears of grain.
reading.Mansion.CITRA=Suited to marriage, ornaments, love and the like. Its nature is quickly good, mild and tender, linked with repetition. Planet: Saturn. Foods: fruit.
reading.Mansion.SVATI=Suited to temporary works. Its nature is quickly changing and ephemeral, linked with accomplishment. Planet: Sun. Foods: flour, sesame soup and Nepalese dal.
reading.Mansion.VISHAKHA=Suited to mixed work. Its nature is balanced and mixed, linked with enemies. Planet: Moon. Foods: sesame, flowers and Indian dal.
reading.Mansion.ANURADHA=Suited to love, making friends, ornaments and marriage. Its nature is quickly good, mild and tender, linked with repetition. Planet: Mars. Foods: alcohol, small pulses and honey.
reading.Mansion.JYESHTHA=Suited to incantations, attacks and the like. Its nature is bad and dreadful, linked with the traveller. Planet: Mercury. Foods: red rice and rice soup.
reading.Mansion.MULA=Suited to incantations, attacks and the like. Its nature is bad and dreadful, linked with pollution. Planet: Jupiter. Foods: milk, among others.
reading.Mansion.PURVASHADHA=Suited to destruction, deceit and the like. Its nature is successful in stable aims, and severe, linked with good fortune. Planet: Venus. Foods: banyan.
reading.Mansion.UTTARASHADHA=Suited to coronations, sowing and other lasting works. Its nature is very stable and permanent, linked with accomplishment. Planet: Saturn. Foods: honey and rabbit.
reading.Mansion.SHRAVANA=Suited to temporary works. Its nature is quickly changing and ephemeral, linked with repetition. Planet: Sun. Foods: fresh butter and bird meat.
reading.Mansion.DHANISHTHA=Suited to temporary works. Its nature is quickly changing and ephemeral, linked with the traveller. Planet: Mars. Foods: Indian dal and mouse meat.
reading.Mansion.SHATABHISHAJ=Suited to temporary works. Its nature is very stable and ephemeral, linked with good fortune. Planet: Mercury. Foods: goat meat. The White Beryl's own list of classes puts it among the four very stable mansions, with Rohiṇī, Uttaraphalgunī and Uttarāṣāḍhā, good for taking new land, appointing chiefs and works meant to last; the nature named first joins that class with another.
reading.Mansion.PURVABHADRAPADA=Suited to destruction, deceit and the like. Its nature is successful in stable aims, and severe, linked with death. Planet: Jupiter. Foods: bloody mutton.
reading.Mansion.UTTARABHADRAPADA=Suited to coronations, sowing and other lasting works. Its nature is quickly changing and permanent, linked with death. Planet: Venus. Foods: Nepalese dal. The White Beryl's own list of classes puts it among the four quick and good mansions, with Mṛgaśiras, Citrā and Anurādhā, good for ornaments, games, field work and all quick work; the nature named first joins that class with another.
reading.Mansion.REVATI=Suited to love, making friends, ornaments and marriage. Its nature is quickly good, mild and tender, linked with accomplishment. Planet: Saturn. Foods: mince. The White Beryl's own list of classes puts it among the unstable and changing mansions, with Aśvinī, Puṣya and Hasta, good for offering rites, teaching the dharma, giving vows, presenting gifts to superiors and quick aims of one's own.
reading.Electional={0} Activities not named are neutral. The lists follow the methods of the White Beryl and also weigh the rising sign, which the app does not calculate, so they give no verdict on the day as a whole.
reading.Electional.weekday=What the activity lists name this weekday good or bad for.
reading.Electional.date=What the activity lists name this lunar date good or bad for.
reading.Electional.animal=What the activity lists name a day of this animal good or bad for.
reading.Electional.trigram=What the activity lists name this trigram good or bad for.
reading.EarthLord=The White Beryl's reckoning for the dead on a day of this animal; its learned commentators apply it to funerals only. {0} The lists are what the activity lists name a day of this animal good or bad for; activities not named are neutral.
reading.EarthLord.MOUSE=The earth lord sits in the beer jar: straining beer for the dead is bad for the brewer and the children, unless the first of the mash is scattered as an offering and the jar screened. This earth lord, Gser mdzod ser po, keeps to the north of the house, and the hearth god is in the srang (the word means a lane), taking offence at work there, above all at a corpse. The earth lord Gnyan khra witnesses the day: a death repeats three times, and a corpse sent to the lower north brings harm.
reading.EarthLord.OX=The earth lord sits in the granary: taking barley out for the dead is bad for whoever takes it out and for the measurer; scatter the first of the grain to the four directions and take it out through a hole pierced in the granary. This earth lord, Gser mdzod ser po, keeps to the north-east of the house, and the hearth god is under the hearth, taking offence at work there, above all at a corpse. Gnyan ljang witnesses the day: a death repeats, no grave is dug, and the funeral gathering is avoided.
reading.EarthLord.TIGER=The earth lord sits in the door: a corpse carried out through it is bad for the head of the house; take it out through the roof or a hole. This earth lord, Gser mdzod ser po, keeps to the east of the house, the upper east, and the hearth god is in the south, taking offence at work there, above all at a corpse. The white garuda witnesses the day: no cremation, and the corpse's road not to the upper east.
reading.EarthLord.RABBIT=The earth lord sits in the door bolt: a corpse-bearer who grasps it brings harm to sons, grandsons and daughters; the bearer does not touch it, or the bolt is taken out first. This earth lord, Gser mdzod ser po, keeps to the east of the house, and the hearth god is in the east, taking offence at work there, above all at a corpse. The earth's turtle witnesses the day: the funeral road not to the lower east.
reading.EarthLord.DRAGON=The earth lord sits in the mill: grinding tsampa for the dead on it, the miller and the maternal uncle die; open the mill and scatter flour from its centre. This earth lord, Gser mdzod ser po, keeps to the south-east of the house, and the hearth god is in the west, taking offence at work there, above all at a corpse. Gnyan khra ba dan witnesses the day: no wailing in mourning, and the corpse's road not to the south-east.
reading.EarthLord.SNAKE=The earth lord sits in the rope: if a corpse is dragged with a rope, the bearer dies; cut the rope in three, tie it again to carry, and cut it again where the road begins. This earth lord, Gser mdzod ser po, keeps to the south of the house, and the hearth god is in the north, taking offence at work there, above all at a corpse. Tsang kun witnesses the day: slaughter is avoided, and a funeral door to the upper south; the corpse is best taken by the main road.
reading.EarthLord.HORSE=The earth lord sits in the saddle: a corpse loaded on a saddle is bad for the horse; carry it without one. This earth lord, Gser mdzod ser po, keeps to the south of the house, and the hearth god is in the east, taking offence at work there, above all at a corpse. Byi lam witnesses the day: a death repeats.
reading.EarthLord.SHEEP=The earth lord sits in the trough: kneading dough for the dead in it is bad for the one who kneads; knead it in copper or on a cloth, and set a human figure of dough at the place of death. This earth lord, Gser mdzod ser po, keeps to the south-west of the house, and the hearth god is in the west, taking offence at work there, above all at a corpse. Be sna witnesses the day: a death repeats; if ground is broken, seven die; bad for the dead and for graves; corpse and funeral door not to the south-west.
reading.EarthLord.MONKEY=The earth lord sits in the knife and the axe: whoever cuts meat with them dies; put the knives and axes through fire. This earth lord, Gser mdzod ser po, keeps to the west of the house, and the hearth god is in the north, taking offence at work there, above all at a corpse. Gzig mjug witnesses the day: no funeral gathering, and the funeral road not to the upper west.
reading.EarthLord.BIRD=The earth lord sits in the plates: serving food for the dead on plates is bad for the host or brings sudden misfortune; use flat stones, or lay the dough on a felt. This earth lord, Gser mdzod ser po, keeps to the west of the house, and the hearth god is in the west, taking offence at work there, above all at a corpse. He thon rgyal po witnesses the day: a funeral feast is bad for wealth, and the corpse not to the lower west.
reading.EarthLord.DOG=The earth lord sits in the lintel and the threshold: a corpse that touches the threshold is bad for the father's bearer, or the bearer dies; wrap the threshold in cloth, and drink no mourning beer. This earth lord, Gser mdzod ser po, keeps to the north-west of the house, and the hearth god is in the north, taking offence at work there, above all at a corpse. The khyim witnesses the day: a death repeats away from home, and the funeral road not to the north-west.
reading.EarthLord.PIG=The earth lord sits in the hoe: digging the grave pit with a pick, the grandmother and the one who breaks ground die; open the ground with a bone; the same holds for building work. This earth lord, Gser mdzod ser po, keeps to the north of the house, and the hearth god is in the south, taking offence at work there, above all at a corpse. Gnyan be witnesses the day: no mourning, and the corpse's road not to the upper north.
reading.BlaMkhyen=The bla mkhyen of the day dwells in the direction of the day's seven-red: the sme ba 7, where it stands when the day's own sme ba is put in the middle of the square of nine. Today: {0}. It is Se ba bla mkhyen, the astrologer among the year's spirits, in a monk's form, red and yellow, holding a magic mirror; the White Beryl applies the year's rules to the day. Towards it the works below are avoided. It takes offence at astrologers, at the head of the household and at vajra masters; if it is harmed, the remedy is to recite the gtsug tor, the Eight Appearances, the Litany of Names, the collected dhāraṇīs and the tog gzungs, and to send a torma in its direction. The day's sme ba counts on day by day from a wood-mouse day: up after the winter solstice, down after the summer solstice.

# Readings: yogas (the White Beryl, pp. 347–349): the short reading, the gist of the longer verse, the avoidance verse
reading.Yoga.VISHKAMBHA=Clears the way: good for removing obstacles. The longer verse adds naming, harmony and glory, consecration, offerings to the gods, confession and counsel with friends. Its first three chu tshod, 1 h 12 min from its start, are to be avoided.
reading.Yoga.PRITI=Friendship with everyone. All work succeeds, above all what is pure, auspicious and pleasing; music and celebration.
reading.Yoga.AYUSHMAN=Long life and glory. Fame, people, wealth, cattle and strength; good for making a living.
reading.Yoga.SAUBHAGYA=Abundance. Auspicious for travel; wealth lasts, and long life, dharma and happiness grow.
reading.Yoga.SHOBHANA=Pleasing to everyone. Ornaments, song and dance; power from past merit; virtue grows.
reading.Yoga.ATIGANDA=Wealth and cattle run out. Good for entering bad ways, bad for bringing good things to completion: good conduct, bad result. Its first six chu tshod, 2 h 24 min from its start, are to be avoided.
reading.Yoga.SUKARMAN=Secures the way to the next life. Good for aspiration and setting out, for friends, clothes and travel, for defeating enemy forces and for protection.
reading.Yoga.DHRITI=Jewels and riches are gained. Removes afflictions; good for war, women, taking land and forts, raising treasure, and forceful, powerful work.
reading.Yoga.SHULA=What is undertaken does great harm. Bad for children, teachers, ornaments and clothes; war and thieves; the sick die; trouble comes from talk. Its first five chu tshod, 2 h from its start, are to be avoided.
reading.Yoga.GANDA=Illness from the nāgas breaks out. The la, the life-spirit, and the span of life are lost, and seats of power are lost to enemies. Its first six chu tshod, 2 h 24 min from its start, are to be avoided.
reading.Yoga.VRIDDHI=Wealth grows; good for everything. Enemies are subdued, what is good is kept safe, and work with friends succeeds.
reading.Yoga.DHRUVA=Enemies are always overcome. A treasury of intelligence; beauty, long life and a fine voice; every wish succeeds.
reading.Yoga.VYAGHATA=Middling: leprosy breaks out. Bad for births and deaths, for land, forts and goods; study fails; quarrels and wounds. Its first nine chu tshod, 3 h 36 min from its start, are to be avoided.
reading.Yoga.HARSHANA=Middling: joy in life. Dharma, wealth and a glad mind; a place, support, road and friends; house and merit.
reading.Yoga.VAJRA=Every wish is fulfilled. Fear and terror; good for forceful rites against others, while peaceful and auspicious work fails. Its first nine chu tshod, 3 h 36 min from its start, are to be avoided.
reading.Yoga.SIDDHI=Whatever is intended succeeds. Glory, a good name and clear faculties; skill in means; victory.
reading.Yoga.VYATIPATA=Bad for going abroad. By skilful means it overcomes demons and armies; ordination, temples and the work of the gods; misfortune and gossip. To be avoided for its whole length.
reading.Yoga.VARIYAS=Victory over enemies. A teacher with discipline; authority in dharma; liberation reached; wisdom.
reading.Yoga.PARIGHA=Death in prison. Dealings with māras, fear of enemies, glory stolen, illness and ruin from nowhere. To be avoided for its whole length.
reading.Yoga.SHIVA=The result is surely gained. Gentle within and without; life, wealth and lineage secure; enemies pacified and aims achieved.
reading.Yoga.SIDDHA=Every intention succeeds. Wishes, life and riches fulfilled; faith; lineage.
reading.Yoga.SADHYA=Good for going trading. Beauty, faith and medicine; dharma, wealth, refuge and allies; all coming and going.
reading.Yoga.SHUBHA=Good for a feast for the living. Whatever is done has meaning: people, wealth, dharma.
reading.Yoga.SHUKLA=Good for going and for staying. Bright faculties; light, fame and glory; intelligence that does not run out.
reading.Yoga.BRAHMA=The rank of a god is reached. Glory and fame are found; happiness and wealth.
reading.Yoga.INDRA=Good for study. Auspicious and meaningful; the king's favour; a garland of jewels is found.
reading.Yoga.VAIDHRITI=Meeting a woman friend. The retinue declines; fame and rule are in danger; servants, children and goods decay; deeds end badly. To be avoided for its whole length.

# Readings: karaṇas (the White Beryl, pp. 349–351), where the verse says more than its list
reading.Karana.VISHTI=Its fierce rites succeed, but the direction it faces is to be avoided; the White Beryl leaves the details, and the remedies, to the dbyangs 'char.
reading.Karana.CATUSHPADA=The weapon tormas are read so in the Derge print and in the kun phan me long, where the word ends as weapon (mtshon) does; the Beijing edition prints it small.

# Readings: lunar dates (the White Beryl, pp. 297–304): the five-fold cycle, a birth and death, the perilous dates, the place of the la (bla gnas)
reading.LunarDate.1=A day of joy (dga' ba, Nandā), one of the virtuous days: good for pacifying rites, crafts, games and all white work. A child born today: children follow one another, and wide learning. A death today is bad. Livestock bought today increases a thousandfold. The la (bla), the life-spirit, sits in the big toe today, and in horses and other livestock in the sole of the foot: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.2=An excellent day (bzang po, Bhadrā), one of the virtuous days: good for seeking friends and for sowing. A boy born today is good, a girl bad. Livestock bought today increases a thousandfold. The la (bla), the life-spirit, sits in the ankle joint today, and in horses and other livestock in the fat: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.3=A victorious day (rgyal ba, Jayā), one of the virtuous days: good for war, raids, attacking enemies, mdos and gtor ma and other fierce rites. Whoever is born today dies or fares badly. A death today is good. Livestock bought today increases. The la (bla), the life-spirit, sits in the calf today, and in horses and other livestock in the dar gdong (not identified): no bloodletting, moxibustion or other treatment there.
reading.LunarDate.4=An empty day (stong pa, Riktā), not virtuous: any work is called bad. The remedy is to raise an empty vase into the air as the rite prescribes, recite the nor rgyun and bind the wealth pledge. A boy born today is bad for his mother; girls follow. Livestock bought today increases. The la (bla), the life-spirit, sits in the waist today, and in horses and other livestock in the hock (sre long): no bloodletting, moxibustion or other treatment there.
reading.LunarDate.5=A full day (rdzogs pa, Pūrṇā): in general bad for work, but good for building a fort and hiding treasure. The remedy is rites that raise glory and reciting the Bkra shis brtsegs pa. A boy born today will be rich; a girl dies or lives alone. Livestock bought today increases. The la (bla), the life-spirit, sits in the hollow of the knee today, and in horses and other livestock in the se ra bone (not identified): no bloodletting, moxibustion or other treatment there.
reading.LunarDate.6=A day of joy (dga' ba, Nandā), one of the virtuous days: good for pacifying rites, crafts, games and all white work. No more children follow one born today. A death today is bad. The la (bla), the life-spirit, sits in the groove of the thigh today, and in horses and other livestock in the hip socket: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.7=An excellent day (bzang po, Bhadrā), one of the virtuous days: good for seeking friends and for sowing. A boy born today has sharp faculties; a girl follows her husband away. A death today is good for those left behind. The la (bla), the life-spirit, sits in the hip joint today, and in horses and other livestock in the point of the elbow: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.8=A victorious day (rgyal ba, Jayā), one of the virtuous days: good for war, raids, attacking enemies, mdos and gtor ma and other fierce rites. A child born today is hard to raise. One of the four perilous days of the month: Indra holds a feast of dharma among the gods. Falling ill today is dangerous, and great gatherings and anything grand or forceful are bad. The la (bla), the life-spirit, sits above the kidneys today, and in horses and other livestock in the hollow of the kidneys: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.9=An empty day (stong pa, Riktā), not virtuous: any work is called bad. The remedy is to raise an empty vase into the air as the rite prescribes, recite the nor rgyun and bind the wealth pledge. A child born today brings misfortune. The la (bla), the life-spirit, sits in the flank of the ribs today, and in horses and other livestock in the “palm” of the foreleg (lag mthil): no bloodletting, moxibustion or other treatment there.
reading.LunarDate.10=A full day (rdzogs pa, Pūrṇā): in general bad for work, but good for building a fort and hiding treasure. The remedy is rites that raise glory and reciting the Bkra shis brtsegs pa. A child born today will be poor. A death today is bad. The la (bla), the life-spirit, sits in the top of the shoulder today, and in horses and other livestock in the nape (ltag sgor): no bloodletting, moxibustion or other treatment there.
reading.LunarDate.11=A day of joy (dga' ba, Nandā), one of the virtuous days: good for pacifying rites, crafts, games and all white work. A child born today: children follow, and wide learning. A death today is bad. The la (bla), the life-spirit, sits in the forearm today, and in horses and other livestock in the fat: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.12=An excellent day (bzang po, Bhadrā), one of the virtuous days: good for seeking friends and for sowing. A boy born today is good, a girl bad. The la (bla), the life-spirit, sits in the palm today, and in horses and other livestock in the forearm: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.13=A victorious day (rgyal ba, Jayā), one of the virtuous days: good for war, raids, attacking enemies, mdos and gtor ma and other fierce rites. Whoever is born today dies or fares badly. A death today is good. The la (bla), the life-spirit, sits in the neck today, and in horses and other livestock in the white channels (rtsa dkar): no bloodletting, moxibustion or other treatment there.
reading.LunarDate.14=An empty day (stong pa, Riktā), not virtuous: any work is called bad. The remedy is to raise an empty vase into the air as the rite prescribes, recite the nor rgyun and bind the wealth pledge. A boy born today is bad for his mother; girls follow. The la (bla), the life-spirit, sits behind the ear and in the jaw today, and in horses and other livestock in the shoulder: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.15=A full day (rdzogs pa, Pūrṇā): in general bad for work, but good for building a fort and hiding treasure. The remedy is rites that raise glory and reciting the Bkra shis brtsegs pa. A boy born today will be rich; a girl dies or lives alone. Livestock bought today increases sevenfold. The six rites (drug las) are named good too. One of the four perilous days of the month: the māra king Dga' rab dbang phyug leads his hosts against the gods. Falling ill today is dangerous, and great gatherings and anything grand or forceful are bad. The la (bla), the life-spirit, sits in the shoulder blade today, and in horses and other livestock in the whole body: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.16=A day of joy (dga' ba, Nandā), one of the virtuous days: good for pacifying rites, crafts, games and all white work. Children born today are followed by more later. A death today is bad. Livestock bought today increases. The la (bla), the life-spirit, sits in the nape and jaw today, and in horses and other livestock in the neck: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.17=An excellent day (bzang po, Bhadrā), one of the virtuous days: good for seeking friends and for sowing. A boy born today has a sharp mind; a girl follows her husband away. A death today is good for the living and the dead. The la (bla), the life-spirit, sits in the neck today, in horses and other livestock too: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.18=A victorious day (rgyal ba, Jayā), one of the virtuous days: good for war, raids, attacking enemies, mdos and gtor ma and other fierce rites. A child born today is hard to raise. The la (bla), the life-spirit, sits in the palm today, and in horses and other livestock in the mane: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.19=An empty day (stong pa, Riktā), not virtuous: any work is called bad. The remedy is to raise an empty vase into the air as the rite prescribes, recite the nor rgyun and bind the wealth pledge. A boy born today brings misfortune. The la (bla), the life-spirit, sits in the forearm today, and in horses and other livestock in the nape (ltag sgor): no bloodletting, moxibustion or other treatment there.
reading.LunarDate.20=A full day (rdzogs pa, Pūrṇā): in general bad for work, but good for building a fort and hiding treasure. The remedy is rites that raise glory and reciting the Bkra shis brtsegs pa. A child born today will be poor. The la (bla), the life-spirit, sits in the shoulder blade today, in horses and other livestock too: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.21=A day of joy (dga' ba, Nandā), one of the virtuous days: good for pacifying rites, crafts, games and all white work. A child born today: children follow, and wide learning. A death today is bad. Livestock bought today increases fivefold. The la (bla), the life-spirit, sits in the flank of the ribs today, and in horses and other livestock in the teeth: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.22=An excellent day (bzang po, Bhadrā), one of the virtuous days: good for seeking friends and for sowing. A boy born today is good, a girl bad. Livestock bought today increases fivefold. Also to avoid: shwa rags, building dikes against flash floods. One of the four perilous days of the month: Viṣṇu and his retinue descend on the crowds of beings. Falling ill today is dangerous, and great gatherings and anything grand or forceful are bad. The la (bla), the life-spirit, sits above the kidneys today, and in horses and other livestock in the upper and lower palate: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.23=A victorious day (rgyal ba, Jayā), one of the virtuous days: good for war, raids, attacking enemies, mdos and gtor ma and other fierce rites. Whoever is born today dies or fares badly. A death today is good. The la (bla), the life-spirit, sits in the hip joint today, and in horses and other livestock in the tongue: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.24=An empty day (stong pa, Riktā), not virtuous: any work is called bad. The remedy is to raise an empty vase into the air as the rite prescribes, recite the nor rgyun and bind the wealth pledge. A boy born today is bad for his mother; girls follow. The la (bla), the life-spirit, sits in the groove of the thigh today, and in horses and other livestock in the forehead: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.25=A full day (rdzogs pa, Pūrṇā): in general bad for work, but good for building a fort and hiding treasure. The remedy is rites that raise glory and reciting the Bkra shis brtsegs pa. A boy born today will be rich; a girl dies or lives alone. Livestock bought today increases. The la (bla), the life-spirit, sits in the hollow of the knee today, and in horses and other livestock in the chest and neck (brang ske): no bloodletting, moxibustion or other treatment there.
reading.LunarDate.26=A day of joy (dga' ba, Nandā), one of the virtuous days: good for pacifying rites, crafts, games and all white work. Girls follow a girl born today. A death today is bad. The la (bla), the life-spirit, sits above the knee today, and in horses and other livestock in the hollow of the throat (ol stong): no bloodletting, moxibustion or other treatment there.
reading.LunarDate.27=An excellent day (bzang po, Bhadrā), one of the virtuous days: good for seeking friends and for sowing. A boy born today has a sharp mind; a girl fares badly and follows her husband away. A death today is good. Buying livestock is middling. Also to avoid: shwa rags, building dikes against flash floods. The la (bla), the life-spirit, sits in the calf today, and in horses and other livestock in the genitals: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.28=A victorious day (rgyal ba, Jayā), one of the virtuous days: good for war, raids, attacking enemies, mdos and gtor ma and other fierce rites. A child born today is hard to raise. A death today is bad. The la (bla), the life-spirit, sits in the ankle joint today, and in horses and other livestock in the scrotum (sgro ba): no bloodletting, moxibustion or other treatment there.
reading.LunarDate.29=An empty day (stong pa, Riktā), not virtuous: any work is called bad. The remedy is to raise an empty vase into the air as the rite prescribes, recite the nor rgyun and bind the wealth pledge. A child born today brings misfortune. Also named good: thag ser, read as thog ser, casting lightning and hail, a fierce rite. The la (bla), the life-spirit, sits in the shin today, and in horses and other livestock in the passages of the nostrils: no bloodletting, moxibustion or other treatment there.
reading.LunarDate.30=A full day (rdzogs pa, Pūrṇā): in general bad for work, but good for building a fort and hiding treasure. The remedy is rites that raise glory and reciting the Bkra shis brtsegs pa. A child born today will be poor. One of the four perilous days of the month: the nāgas gather in turmoil under their king Ma dros. Falling ill today is dangerous, and great gatherings and anything grand or forceful are bad. The la (bla), the life-spirit, pervades the whole body today, in horses and other livestock too: no bloodletting, moxibustion or other treatment there.

# Readings: weekdays (the White Beryl, pp. 308–312)
reading.Weekday.SUNDAY=The Sun: the bla gza' of kings, of the royal caste; peaceful, pale red, of fire. It is strong in the waning half of the month, by day, and in Leo. Setting out is bad in general, above all to the south, the north and the intermediate directions. A boy born today who lives through seven days and seven months lives long and is loved by the great; a girl will be rich, but more girls follow her, so some hold her birth bad. A death today is repeated nine or seven times. Even when the Sun is strong, hold no funeral on it: it is the door of heaven. The chapter's closing verse puts the Sun with Mars and Saturn among the days on which virtuous work is avoided.
reading.Weekday.MONDAY=The Moon: the bla gza' of women and nāgas, of the noble caste; peaceful, white and yellow, of water. It is strong in Cancer and at night. Setting out is bad in general, to the south-west above all. A boy born today will be rich and very strong; a girl beautiful and pleasing. A death today is not repeated. Even when the Moon is strong, burn no hom offering on it: it is the door of the nāgas.
reading.Weekday.TUESDAY=Mars, called bkra shis: the bla gza' of asuras and of generals, of the royal caste; fierce, red and black, of fire. It is strong in Aries and Scorpio. Setting out is bad in general, very bad to the south, the north and the intermediate directions; peaceful, increasing and other white works are mostly bad. A boy born today is hard to raise, given to evil, divisive, proud and quick to anger; a girl dies young. A death today is repeated three times. Virtuous work is avoided on it.
reading.Weekday.WEDNESDAY=Mercury: the yakṣa, a neuter planet, the bla gza' of kings, of the commoner caste; peaceful, blue and green, of water. It is strong at the start of the waxing half and the end of the waning half, and in Gemini and Virgo; increasing rites are especially auspicious. Setting out is good in general, but bad to the east, the north and the intermediate directions. A boy born today is bad, harsh to his mother and sickly; a girl makes her parents poor but has food, wealth and power herself. A death today is bad five times over, and a prisoner is not freed. Some forbid burial today, and even when Mercury is strong, dig no grave on it: it ends the lineage.
reading.Weekday.THURSDAY=Jupiter: the bla gza' of lamas, bodhisattvas, ministers and monks, of the brahmin caste; mixed peaceful and fierce, yellow, of wind. It is strong in Pisces and Sagittarius. Setting out is good in general; avoid the west. A boy born today is plain of face but clear-minded and learned, and practises the dharma; a girl lives long and has good friends. A death today is only a little bad for those left behind. Funeral rites are bad, but a funeral feast is good. Even when Jupiter is strong, hurl no zor on it: it is the planet of funerals.
reading.Weekday.FRIDAY=Venus: the bla gza' of kings, ministers and women, of the brahmin caste; peaceful, many-coloured, of earth. It is strong in the waning half of the month and in Taurus and Libra; rites of power succeed. Setting out is good in general, but bad to the south, the north and the west. A boy born today lives long and is sharp and rich; a girl is sickly but of great glory. A death today is repeated seven times. Some forbid burning hom offerings today, and even when Venus is strong, send no livestock away: it is the planet of livestock.
reading.Weekday.SATURDAY=Saturn: poor, neuter, a servant, the bla gza' of children, of the caṇḍāla caste; fierce, grey and yellow, of earth. It is strong at night, in the waning half of the month, and in Capricorn and Aquarius; killing succeeds. Setting out is bad in general, above all to the intermediate directions, the east and the west. One born today is handsome but of little merit; a boy is middling, a girl short-lived. A death today is not repeated; a prisoner loses all he owns. Virtuous work is avoided on it, and even when Saturn is strong, give no wealth away: it is the planet of earth.
reading.Trigram.LI=The day of 'Od 'bar ma, first of the eight goddesses the White Beryl counts through the month; her day is the li day. An illness that comes on today is traced to digging up or breaking a hearth, felling trees, going about at dusk or before dawn, or work on water channels; klu, btsan, gre bo and gre mo spirits harm. It shows as swelling of the belly and stabbing pains from the upper body. The rites named are a bong ra, a btsan mdos and one to drive off the chu gri.
reading.Trigram.KHON=The day of Bstan ma, one of the eight goddesses the White Beryl counts through the month; her day is the khon day. An illness that comes on today is traced to going to an unclean place or a place of quarrel; lha, gri btsan and sa bdag spirits harm. The stomach and liver are unwell, with stabbing pains, swellings and eruptions (shu thor). The rites named are smoke offerings, confession, a btsan mdos and a gzhong rgyas.
reading.Trigram.DWA=The day of Dkar gsal ma, one of the eight goddesses the White Beryl counts through the month; her day is the dwa day. An illness that comes on today is traced to cooking or burning flesh and blood on the hearth; lha, rgyal po and gre bo spirits harm. It shows as wasting, swelling of the belly and kidney illness. The rites named are confession, ablution, water tormas and a rgyal mdos.
reading.Trigram.KHEN=The day of Mdangs ldan ma, one of the eight goddesses the White Beryl counts through the month; her day is the khen day. An illness that comes on today is traced to clean and unclean food; gnam the, sa bdag, bse rag, rgyal 'gong and spirits of the dead harm. It shows as pain in the side, diarrhoea, and trouble in the lungs, the heart and the joints. The rites named are a ransom (glud) and water tormas.
reading.Trigram.KHAM=The day of Char 'bebs ma, one of the eight goddesses the White Beryl counts through the month; her day is the kham day. An illness that comes on today is traced to beer and the food of a widow's house; mo, gnyan and water gre spirits harm. It shows as stabbing pains front and back, a dry mouth, cold illness, dropsy, diarrhoea and vomiting. The rites named are a blue mdos and the nine-fold rite against the sa srin.
reading.Trigram.GIN=The day of G.yo med ma, one of the eight goddesses the White Beryl counts through the month; her day is the gin day. An illness that comes on today is traced to wandering empty valleys in a storm; grib btsan and brje thod gtong spirits harm. It shows as contagious fever, exhaustion and madness. The rites named are a mdos against contagion and the rites of fulfilment and confession (bskang bshags).
reading.Trigram.ZIN=The day of 'Od 'chang ma, one of the eight goddesses the White Beryl counts through the month; her day is the zin day. An illness that comes on today is traced to food from an unlucky direction and to flesh and blood; sa bdag, klu, gnyan and gre mo spirits harm. It shows as stabbing pains in the liver and ribs, a sick stomach and swellings. The rites named are a klu rite and one to drive off the gre mo.
reading.Trigram.ZON=The day of Skyob byed ma, last of the eight goddesses the White Beryl counts through the month; her day is the zon day. An illness that comes on today is traced to the property of a temple or of Buddhist or Bon priests; Pe har, dkor bdag and the dam sri, harmful spirits of the dead who broke their pledges, harm. It shows as pain in the kidneys and waist, eye illness, heart wind and exhaustion. The rites named are a rgyal mdos, the rites of fulfilment and confession, and one to drive off the dam sri.
reading.GreatCombination.KUN_DGA=Wealth is found. Life, lustre and splendour grow, glory, riches and merit blaze, and work and plans succeed.
reading.GreatCombination.DUS_DBYIG=Great fear. The sky's brightness fades and flowers wither, trees and waters dry up; a feared enemy comes and there is killing.
reading.GreatCombination.DUL=Much wealth. Wishes are fulfilled, with ease, long life and happiness.
reading.GreatCombination.SKYE_DGU=Happiness through women. Work that is wished for succeeds, with good fortune in people and wealth.
reading.GreatCombination.GZHON=Every undertaking succeeds; the enemy is defeated and the battle won.
reading.GreatCombination.BYA_ROG=Quarrels, fear and hunger. Life's lustre wanes, food and drink do not nourish, and joy turns to suffering.
reading.GreatCombination.RGYAL_MTSHAN=Wealth and clothes in plenty, with lustre, glory and good fortune.
reading.GreatCombination.DPAL_BEU=Jewels gather; power, sons, and a glory that grows to the end.
reading.GreatCombination.RDO_RJE=Fear of lightning and hail. One is ill at ease and others are ruined; enemies, thieves and epidemics bring fear.
reading.GreatCombination.THO_BA=Fear of death. Hatred cuts life; weeping and disputes, and harm to four-footed animals.
reading.GreatCombination.GDUGS=Enemies are overcome; strength and might win over hatred and disputes.
reading.GreatCombination.GROGS=One meets friends; glory, kindness and the aims one wishes for are achieved.
reading.GreatCombination.YID=Glory is gained, with jewels, power and the good path; one's aims succeed.
reading.GreatCombination.DOD=Work goes as one wishes; what is merely thought of comes about.
reading.GreatCombination.MGAL_ME=Fights and disputes; fear, gossip, and quarrels with relatives.
reading.GreatCombination.RTSA_BTON=Life runs out; good fortune and plans are ruined, and dharma wealth, empowerment and consecration fail.
reading.GreatCombination.CHI_BDAG=Death comes; enemies and thieves, and being led into places and roads of fear.
reading.GreatCombination.MDA=The nose and the limbs are weakened; lustre fades, life is cut short, and work and good fortune decline.
reading.GreatCombination.GRUB=Work that is begun succeeds; good words and possessions, joy, wisdom and courage.
reading.GreatCombination.MDUNG=Fear of illness.
reading.GreatCombination.BDUD_RTSI=Enemies are ruined. Mostly pleasing and the best for healing; enemies are spent, and glory and wealth are gained.
reading.GreatCombination.GTUN_SHING=Understand it as pounding: life, wealth and the gods are spent, good fortune ends and heads are broken.
reading.GreatCombination.GLANG_PO=Every aim succeeds; coming, going and resting are at ease, with renown.
reading.GreatCombination.RTAG_MYOS=A mount is found; long life and happiness, good work succeeds, with mounts, people and wealth.
reading.GreatCombination.ZAD_PA=Wealth and people run out; life, strength, food and goods are spent, and the fruit of work and merit.
reading.GreatCombination.GYO=The king's work succeeds; one is a master of people, and fierce work succeeds.
reading.GreatCombination.BRTAN=The state is ruined; the enemy wins, and it is ill-omened for the retinue.
reading.GreatCombination.PHEL=Wealth increases; the mind and wisdom grow, and lustre and splendour.
reading.CombinationDay.GRUB_SBYOR=The accomplishment combination, which the White Beryl also calls the nectar combination: whatever work is undertaken on it turns out well.
reading.CombinationDay.ZUNG_SBYOR=A paired combination: like the accomplishment combination, all pacifying, increasing and controlling work is virtuous on it, but for its own exceptions and for harmful fierce work. Except on Thursday it falls on the same weekday and mansion as the day to avoid entirely, and the text says that what to take up and what to avoid then matters.
reading.CombinationDay.BDUD_RGYAL=The demon king: good for offerings to the war gods, for burying and suppressing enemies and for attacking them; rough, fierce work succeeds.
reading.CombinationDay.GRUB_NYI=One of the seven days of accomplishment: any important work and virtuous, good work succeed; harmful, sinful work is to be avoided. Where it falls with the demon king, it is good for attacking.
reading.CombinationDay.BKRA_SHIS_NYI=An auspicious day: happiness; good for empowerment, consecration, offerings to deities and virtuous work.
reading.CombinationDay.PHEL_NYI=One of the seven days of growth: good for virtuous work, for learning writing, astrology and the arts, for bringing water, digging wells, field work and sowing.
reading.CombinationDay.CHUB_NYI=A day of fulfilment, like the paired combination: nearly all good work is good.
reading.CombinationDay.MTHUN_NYI=A day of harmony: good for settling quarrels, making alliances and helpful work.
reading.CombinationDay.SBYOR_NYI=One of the seven days of union: good for offerings to deities, arranging marriages, spectacles, virtuous work and work that increases; harmful, destructive work is bad.
reading.CombinationDay.BDUD_NYI=One of the seven demon days, each named for the work it harms (offerings to the gods on Sunday, queens on Monday, generals on Tuesday, measuring grain on Wednesday, priests on Thursday, nobles on Friday, horse dealers on Saturday), with a rite to suppress it. The day's own work and all work of the powerful are bad; taking a bride is bad for the father-in-law and the husband, a funeral for the family of the dead, and the day is bad for daughters-in-law and the head of the house; do not set out. Black magic succeeds.
reading.CombinationDay.CHI_SBYOR=The death combination, which the verse pictures as the planet striking its mansion (the Sun burns the fingers, the Moon overpowers Kṛttikā …): building, consecration, rites for long life, sending or taking a bride, setting out and moving the sick are mostly avoided.
reading.CombinationDay.MI_PHROD_NYI=A day of incompatibility: good for subduing enemies and causing division; taking a bride is bad for the mother-in-law, a funeral for the bride's siblings; medicine and work that makes harmony are avoided.
reading.CombinationDay.MI_MTHUN_NYI=A day of discord: good for separating and harmful work; marriage is bad for oneself, one's father and the mother-in-law, a funeral for young men; most good work is bad.
reading.CombinationDay.JIG_NYI=A day of destruction: bad for a bride, relatives and horses; a funeral is bad for the household and the nephews; do not set out. It suits harmful work.
reading.CombinationDay.GTAN_SPANG=A day to avoid entirely, also called the burning combination: every important work is avoided, and bloodletting and moxibustion. Except on Thursday it falls on the same weekday and mansion as the paired combination.
reading.BurningDate=A burning date: the weekday meets one of its two dates, one in each half of the month (Sunday the 12th and 27th, Monday the 11th and 26th, Tuesday the 10th and 25th, Wednesday the 3rd and 18th, Thursday the 6th and 21st, Friday the 2nd and 17th, Saturday the 7th and 22nd). Bloodletting, moxibustion and virtuous work do not succeed and are to be given up at once; cremation is bad, but fierce work turns out well. Whatever is done then bears no fruit, as burnt silk leaves only ash. As a remedy the text names hoisting a large flag in the colour of the day's planet and a burnt offering of white butter. The White Beryl's chapter on the works one by one counts it among the times to avoid for bloodletting and moxibustion, funerals, setting up supports and temples, and accomplishing health and wealth.
reading.GtsugLagDay.GRUB_NYI=A day of accomplishment as the rdo rje gtsug lag reckons it, which the White Beryl quotes after its own table, with other mansions under the same names. That text gives this day to approach and accomplishment, the retreat practice of a deity. The White Beryl's own reading of the day: {0}
reading.GtsugLagDay.BDUD_NYI=A demon day as the rdo rje gtsug lag reckons it, which the White Beryl quotes after its own table, with other mansions under the same names. That text reckons each demon day against the work it harms. The White Beryl's own reading of the day: {0}
reading.GtsugLagDay.MI_PHROD_NYI=A day of incompatibility as the rdo rje gtsug lag reckons it, which the White Beryl quotes after its own table, with other mansions under the same names. That text calls the day an ill omen. The White Beryl's own reading of the day: {0}
reading.GtsugLagDay.MI_MTHUN_NYI=A day of discord as the rdo rje gtsug lag reckons it, which the White Beryl quotes after its own table, with other mansions under the same names. The White Beryl's own reading of the day: {0}
reading.GtsugLagDay.JIG_NYI=A day of destruction as the rdo rje gtsug lag reckons it, which the White Beryl quotes after its own table, with other mansions under the same names. The White Beryl's own reading of the day: {0}
reading.Rahu={0} Over the hours of every day it moves too: at first sun from east to north-west, in the warm of the morning from north-west to south, at noon from south to north-east, in the late afternoon from north-east to west, at sunset from west to south-east, at dusk from south-east to north, at midnight from north to south-west, and from dawn to daybreak from south-west to east. Fierce work goes along with its course, and nothing should face it.
reading.DusSbyor={0} The White Beryl holds the combination period above every factor of the day, since all their works are complete in its house.
reading.DusSbyor.ARIES=Aries rises: a period to avoid. It brings disputes and loss of wealth and is shunned by all; unvirtuous deeds prosper, and only war and fierce work go well.
reading.DusSbyor.TAURUS=Taurus rises: a period to accomplish. Wealth and glory are found, good fortune and renown, and offerings and services come.
reading.DusSbyor.GEMINI=Gemini rises: a good period. Wishes and renown are gained, friends are found, and gains come even unlooked for.
reading.DusSbyor.CANCER=Cancer rises: a period to avoid. Wealth and gains surely decline, what is merely touched is spoilt, and afflictions, disputes and fear are great.
reading.DusSbyor.LEO=Leo rises: a period to accomplish. Harmful spirits weaken and one goes in comfort; there is no fear in any work, and kings honour one.
reading.DusSbyor.VIRGO=Virgo rises: a period to accomplish. Wishes are fulfilled as intended, with good fortune and plenty.
reading.DusSbyor.LIBRA=Libra rises: a period to avoid. Obstacles meet one's aims, sorrow comes among friends, and gains come hard.
reading.DusSbyor.SCORPIO=Scorpio rises: a period to avoid. Great dangers meet a journey, wealth declines and the mind is weary.
reading.DusSbyor.SAGITTARIUS=Sagittarius rises: a period to accomplish. Going and coming are sure, one is brave, aims are achieved, enemies weaken and disputes are won.
reading.DusSbyor.CAPRICORN=Capricorn rises: a period to avoid. Fights and disputes arise, with great affliction and harm from the planets.
reading.DusSbyor.AQUARIUS=Aquarius rises: a period to accomplish. Glory and power are gained, wealth comes later, and every need is met.
reading.DusSbyor.PISCES=Pisces rises: a period to accomplish. Renown is won where it is needed, every work succeeds, and the hardest aims are reached.
reading.RahuMonth={0} Any fierce work is good on this day.
reading.RahuMonth.earlySpring.6=In the first month of spring Rāhu moves like a messenger turning its head; on the 6th it is in its eye.
reading.RahuMonth.earlySpring.9=In the first month of spring Rāhu moves like a messenger turning its head; on the 9th it is in its right shoulder.
reading.RahuMonth.earlySpring.11=In the first month of spring Rāhu moves like a messenger turning its head; on the 11th it is in its left shoulder.
reading.RahuMonth.earlySpring.13=In the first month of spring Rāhu moves like a messenger turning its head; on the 13th it is in its heart.
reading.RahuMonth.midSpring.16=In the middle month of spring Rāhu moves like a messenger turning its head; on the 16th it is in its eye.
reading.RahuMonth.midSpring.9=In the middle month of spring Rāhu moves like a messenger turning its head; on the 9th it is in its head.
reading.RahuMonth.midSpring.11=In the middle month of spring Rāhu moves like a messenger turning its head; on the 11th it is in its heart.
reading.RahuMonth.midSpring.13=In the middle month of spring Rāhu moves like a messenger turning its head; on the 13th it is in its left shoulder.
reading.RahuMonth.midSpring.19=In the middle month of spring Rāhu moves like a messenger turning its head; on the 19th it is in its right shoulder.
reading.RahuMonth.autumn.15=In the three months of autumn, at noon on the 15th, Rāhu takes the form of the ma mo Bitipatra and moves from north-east to south-west.
reading.RahuMonth.autumn.11=In the three months of autumn, at midnight on the 11th, Rāhu takes the form of a sman and moves from south to north.
reading.RahuMonth.autumn.8=In the three months of autumn, at daybreak on the 8th, Rāhu takes the form of a bdud and moves from south-west to north-east.
reading.RahuMonth.autumn.4=In the three months of autumn, at nightfall on the 4th, Rāhu takes the form of a gnyan and moves from north-west to south-east.
reading.RahuMonth.autumn.22=In the three months of autumn, in the late afternoon of the 22nd, Rāhu takes the form of a dmu and moves from east to west.
reading.RahuMonth.autumn.25=In the three months of autumn, at dusk on the 25th, Rāhu takes the form of a srin po and moves from north to south.
reading.RahuMonth.autumn.29=In the three months of autumn, in the late afternoon of the 29th, Rāhu takes the form of the Lord of Death and moves within Lake Ma dros.
reading.NectarPeriods=Each of the twelve double hours is split in two, and each half has a ruling planet. By day the first half of dawn belongs to the weekday's own planet and each next half to the planet six on in the order of the weekdays; by night, from sunset, the weekday's planet again and each next half to the planet five on. The halves ruled by Jupiter are the nectar periods, which the activity tables name good for the works below. The hours are clock time at your place, from the hare hour at 05:00.
reading.Rahu.1=Rāhu turns back at daybreak, with its retinue: good for casting hail and hurling zor.
reading.Rahu.4=At sunset Rāhu enters the west and at dusk moves to the east, where it stays two days: good for pursuing aims, taking a bride, trade, felling trees, white dharma work and brewing; funerals, teaching dharma and settling fights are avoided.
reading.Rahu.6=In the morning Rāhu turns to the west: at its turning, fire offerings of fierce rites and casting hail are good.
reading.Rahu.8=Rāhu enters the south-east from the east and in the forenoon moves to the north-west, where it stays three days: good for lawsuits, attacking enemies, robbery and oaths; washing the hair, sewing clothes, a bride and bathing are bad.
reading.Rahu.11=Rāhu turns back at dusk, with its retinue: killing and heart-curse rites are done.
reading.Rahu.12=At dusk Rāhu enters by the northern gate and at nightfall moves from north to south, where it stays two days: good for bathing, feasts, paying debts, washing the hair and sowing; taking servants and breaking in animals are bad.
reading.Rahu.14=Rāhu turns back at noon, with its retinue: casting hail and burying rites are good.
reading.Rahu.15=In the forenoon Rāhu enters the south-west and at noon moves to the north-east, where it stays two days: good for offerings to deities, rites to keep prosperity, practice, empowerment and dharma practice; paying out, oaths, a bride and giving a child away are bad.
reading.Rahu.17=At midnight Rāhu turns back to the south-west: work that casts lightning and hail succeeds.
reading.Rahu.18=At midnight Rāhu enters the east and after midnight moves to the west, where it stays three days: good for ordination, temples, stupas, setting out and leading an army; oaths, prostrations, building, setting up doors, roofing and door hangings are bad.
reading.Rahu.21=Rāhu turns back at midday, with its retinue: fierce work is good.
reading.Rahu.22=At noon Rāhu enters the north-west and early in the afternoon moves to the south-east, where it stays two days: good for crafts, learning writing and astrology, digging channels, gtad rites and councils; houses, seeking a grave site and breaking in animals are bad.
reading.Rahu.24=Rāhu turns back in the afternoon: work that casts lightning and hail is done.
reading.Rahu.25=At midnight Rāhu enters the south and at dawn moves to the north, where it stays two days: good for buying fields and building; paying out wealth and leading an army are avoided.
reading.Rahu.27=Rāhu turns back at dusk, with its retinue: the rites of Viṣṇu are practised.
reading.Rahu.29=In the afternoon Rāhu enters the north-east and, the sun a spear's length high, moves to the south-west, where it stays two days: good for burying enemies, fire offerings of fierce rites, lightning and hail; dharma work, sowing and brewing are bad.
reading.RahuGeneral=Rāhu's general course. {0} Over the hours of every day it moves too: at first sun from east to north-west, in the warm of the morning from north-west to south, at noon from south to north-east, in the late afternoon from north-east to west, at sunset from west to south-east, at dusk from south-east to north, at midnight from north to south-west, and from dawn to daybreak from south-west to east. In fierce rites go along with its course and never face it. On the other dates the White Beryl gives a more exact course, with what the day is good for.
reading.RahuGeneral.2=After noon Rāhu moves from the east to the west.
reading.RahuGeneral.3=In the warmth of the morning Rāhu moves from the south-west to the north-east.
reading.RahuGeneral.5=In the warmth of the morning Rāhu moves from the east to the west.
reading.RahuGeneral.7=At dusk Rāhu moves from the north to the south.
reading.RahuGeneral.9=At dusk Rāhu moves from the north-east to the south-west.
reading.RahuGeneral.10=At dawn Rāhu moves from the south to the north.
reading.RahuGeneral.13=At daybreak Rāhu moves from the north to the south.
reading.RahuGeneral.16=At sunset Rāhu moves from the north-east to the south-west.
reading.RahuGeneral.19=Early in the morning Rāhu moves from the south to the north.
reading.RahuGeneral.20=At noon Rāhu moves from the south-east to the north-west.
reading.RahuGeneral.23=At noon Rāhu moves from the north-west to the south-east.
reading.RahuGeneral.26=After midnight Rāhu moves from the east to the west.
reading.RahuGeneral.28=At dawn Rāhu moves from the north to the south.
reading.RahuGeneral.30=From the meeting place of the gods Rāhu moves through the whole sky, above and below, in every direction.

# Readings with a shared pattern: {0} takes the entry
reading.KyuSei=Element, direction, trigram and colour: {0} Used in Japanese onmyōdō to read fortunes and directions; the stars have nothing to do with planets.
reading.KyuSei.IPPAKU=Water; north; trigram 坎 (water); white.
reading.KyuSei.JIKOKU=Earth; southwest; trigram 坤 (earth); black.
reading.KyuSei.SANPEKI=Wood; east; trigram 震 (thunder); blue.
reading.KyuSei.SHIROKU=Wood; southeast; trigram 巽 (wind); green.
reading.KyuSei.GOO=Earth; centre; 太極 (the supreme ultimate); yellow.
reading.KyuSei.ROPPAKU=Metal; northwest; trigram 乾 (heaven); white.
reading.KyuSei.SHICHISEKI=Metal; west; trigram 兌 (lake); red.
reading.KyuSei.HAPPAKU=Earth; northeast; trigram 艮 (mountain); white.
reading.KyuSei.KYUSHI=Fire; south; trigram 離 (fire); purple.
reading.StarRelation={0} Your birth star (本命星) is the year star of your birth year, counted from 立春. This reading belongs to 九星気学, fortune-telling by the nine stars, gathered as 気学 in 1909; it is not an annotation of the historical almanac.
reading.StarRelation.SOSHO=相生: the element of one star feeds the other's, as metal feeds water. Read against a person's years, months and days, this counts as good.
reading.StarRelation.HIWA=比和: both stars have the same element. Read against a person's years, months and days, this counts as good.
reading.StarRelation.SOKOKU=相剋: the element of one star overcomes the other's, as earth overcomes water. Read against a person's years, months and days, this counts as bad.
reading.Kinship={0} Your vitality and body, from your birth year, are set against those of the lunar date and, in the hours of the day, of each two-hour period, as in the White Beryl's divination of health, which also reads the month and the year; the month's are set against yours in the month's details, and the year's four aspects in the year's, as in its divination of obstacle years. The hours are counted in clock time at your place, the first from 05:00, as they are standardly taken today (Berzin). The predictions quoted are those for the vitality of the year; the source reads the others in the same way. The full divinations add further pebbles that this app does not calculate.
reading.Kinship.MOTHER=Mother: the other element feeds yours, as water feeds wood. The best of the five relations, marked with three white pebbles. For the vitality, three white pebbles foretell that the tree of life grows and that one is well supported.
reading.Kinship.FRIEND=Friend: your element overcomes the other, as wood overcomes earth. Second to the mother relation, marked with two white pebbles. For the vitality, two white pebbles foretell enough to live on, wishes fulfilled and no threat to life.
reading.Kinship.IDENTITY=Identity: the other element is the same as yours. For earth and water it is marked with one white pebble, which for the vitality foretells no obstacle to long life; for wood, fire and iron with one black pebble, which for the vitality foretells that the sap of the tree of life dries and rites lose their force.
reading.Kinship.SON=Son: your element feeds the other, as wood feeds fire. Marked with one white and one black pebble; for the vitality they foretell good and bad together, so misfortune can still be turned aside by rites.
reading.Kinship.ENEMY=Enemy: the other element overcomes yours, as iron overcomes wood. The worst of the five relations, marked with two black pebbles. For the vitality, two black pebbles foretell punishment and a broken tree of life.
reading.Ehou=Where 歳徳神, the god of the year's fortune, resides. Whatever is done facing this direction is lucky.
