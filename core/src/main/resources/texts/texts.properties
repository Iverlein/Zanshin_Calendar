# A person's own days by the birth date (WB vol. 2, pp. 330, 337–338, 346)
OwnDay.BIRTH_WEEKDAY=Birth weekday
OwnDay.OWN_WEEKDAY=Own weekday
OwnDay.MOTHER_WEEKDAY=Mother weekday
OwnDay.FRIEND_WEEKDAY=Friend weekday
OwnDay.CHILD_WEEKDAY=Child weekday
OwnDay.ENEMY_WEEKDAY=Enemy weekday
OwnDay.BIRTH_MANSION=Birth mansion
reading.OwnDay.BIRTH_WEEKDAY=Today is your birth weekday (སྐྱེས་གཟའ, skyes gza'), the weekday you were born on: peaceful and fierce works in general go well. A person's own weekdays and mansions are of particular importance.
reading.OwnDay.OWN_WEEKDAY=Today is your own weekday (རང་གཟའ, rang gza'), of the element of your birth year's life force (སྲོག, srog): peaceful and fierce works in general go well on it.
reading.OwnDay.OWN_WEEKDAY.also_called=the la weekday (བླ་གཟའ, bla gza') and the power weekday (དབང་གཟའ, dbang gza'), though it is not always the la weekday of your birth animal, the luck day
reading.OwnDay.MOTHER_WEEKDAY=Today is your mother weekday (མ་གཟའ, ma gza'): its element gives birth to yours, counted from the life force (སྲོག, srog) of your birth year. It is a lucky day for you.
reading.OwnDay.FRIEND_WEEKDAY=Today is your friend weekday (གྲོགས་གཟའ, grogs gza'): your element overcomes its element, counted from the life force (སྲོག, srog) of your birth year. It is a lucky day for you.
reading.OwnDay.CHILD_WEEKDAY=Today is your child weekday (བུ་གཟའ, bu gza'): your element gives birth to its element, counted from the life force (སྲོག, srog) of your birth year. It is a middling day for you, neither lucky nor unlucky.
reading.OwnDay.ENEMY_WEEKDAY=Today is your enemy weekday (དགྲ་གཟའ, dgra gza'): its element overcomes yours, counted from the life force (སྲོག, srog) of your birth year. It is an unlucky day, to be avoided.
reading.OwnDay.BIRTH_MANSION=Today the moon is in your birth mansion (སྐྱེས་སྐར, skyes skar), the mansion it was passing through on your birth date: peaceful and fierce works in general go well.
