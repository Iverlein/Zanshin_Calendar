reading.LunarDate.22.also_called=Bhadrā
reading.LunarDate.22.la=the la, the life-spirit (བླ, bla), sits above the kidneys; in horses and other livestock, in the upper and lower palate; no bloodletting, moxibustion or other treatment there
reading.LunarDate.22.birth=a boy is good, a girl bad
reading.LunarDate.22.livestock=bought today, increases fivefold
reading.LunarDate.23=The 23rd of the month is a virtuous day, the victorious day (རྒྱལ་བ, rgyal ba): war, raids, attacking enemies, thread-crosses (མདོས, mdos), tormas (གཏོར་མ, gtor ma) and other fierce rites go well.
reading.LunarDate.23.also_called=Jayā
reading.LunarDate.23.la=the la, the life-spirit (བླ, bla), sits in the hip joint; in horses and other livestock, in the tongue; no bloodletting, moxibustion or other treatment there
reading.LunarDate.23.birth=whoever is born today dies or fares badly
reading.LunarDate.23.death=good
reading.LunarDate.24=The 24th of the month is an empty day (སྟོང་པ, stong pa), not a virtuous one: in general, any work goes badly on it.
reading.LunarDate.24.also_called=Riktā
reading.LunarDate.24.remedy=raise an empty vase into the air as the rite prescribes, recite the Stream of Wealth (ནོར་རྒྱུན, nor rgyun) and bind the wealth pledge
reading.LunarDate.24.la=the la, the life-spirit (བླ, bla), sits in the groove of the thigh; in horses and other livestock, in the forehead; no bloodletting, moxibustion or other treatment there
reading.LunarDate.24.birth=a boy is bad for his mother; girls follow
reading.LunarDate.25=The 25th of the month is a full day (རྫོགས་པ, rdzogs pa), not a virtuous one: in general work goes badly, but building a fort and hiding treasure go well.
reading.LunarDate.25.also_called=Pūrṇā
reading.LunarDate.25.remedy=make rites that raise glory and recite the Heap of Auspiciousness (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa)
reading.LunarDate.25.la=the la, the life-spirit (བླ, bla), sits in the hollow of the knee; in horses and other livestock, in the chest and neck (བྲང་སྐེ, brang ske); no bloodletting, moxibustion or other treatment there
reading.LunarDate.25.birth=a boy will be rich; a girl dies or lives alone
reading.LunarDate.25.livestock=bought today, increases
reading.LunarDate.26=The 26th of the month is a virtuous day, the day of joy (དགའ་བ, dga' ba): pacifying rites, crafts, games and all white work go well.
reading.LunarDate.26.also_called=Nandā
reading.LunarDate.26.la=the la, the life-spirit (བླ, bla), sits above the knee; in horses and other livestock, in the hollow of the throat (ཨོལ་སྟོང, ol stong); no bloodletting, moxibustion or other treatment there
reading.LunarDate.26.birth=girls follow a girl
reading.LunarDate.26.death=bad
reading.LunarDate.27=The 27th of the month is a virtuous day, the excellent day (བཟང་པོ, bzang po): above all, seeking friends and sowing seed go well.
reading.LunarDate.27.also_called=Bhadrā
reading.LunarDate.27.la=the la, the life-spirit (བླ, bla), sits in the calf; in horses and other livestock, in the genitals; no bloodletting, moxibustion or other treatment there
reading.LunarDate.27.birth=a boy has a sharp mind; a girl fares badly and follows her husband away
reading.LunarDate.27.death=good
reading.LunarDate.27.livestock=buying it is middling
reading.LunarDate.28=The 28th of the month is a virtuous day, the victorious day (རྒྱལ་བ, rgyal ba): war, raids, attacking enemies, thread-crosses (མདོས, mdos), tormas (གཏོར་མ, gtor ma) and other fierce rites go well.
reading.LunarDate.28.also_called=Jayā
reading.LunarDate.28.la=the la, the life-spirit (བླ, bla), sits in the ankle joint; in horses and other livestock, in the scrotum (སྒྲོ་བ, sgro ba); no bloodletting, moxibustion or other treatment there
reading.LunarDate.28.birth=a child is hard to raise
reading.LunarDate.28.death=bad
reading.LunarDate.29=The 29th of the month is an empty day (སྟོང་པ, stong pa), not a virtuous one: in general, any work goes badly on it.
reading.LunarDate.29.also_called=Riktā
reading.LunarDate.29.remedy=raise an empty vase into the air as the rite prescribes, recite the Stream of Wealth (ནོར་རྒྱུན, nor rgyun) and bind the wealth pledge
reading.LunarDate.29.la=the la, the life-spirit (བླ, bla), sits in the shin; in horses and other livestock, in the passages of the nostrils; no bloodletting, moxibustion or other treatment there
reading.LunarDate.29.birth=a child brings misfortune
reading.LunarDate.30=The 30th of the month is a full day (རྫོགས་པ, rdzogs pa), not a virtuous one: in general work goes badly, but building a fort and hiding treasure go well. It is a perilous day, when the nāgas gather in turmoil under their king Madrö (མ་དྲོས, ma dros). Falling ill on it is dangerous, and great gatherings and anything grand or forceful go badly.
reading.LunarDate.30.also_called=Pūrṇā
reading.LunarDate.30.remedy=make rites that raise glory and recite the Heap of Auspiciousness (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa)
reading.LunarDate.30.la=the la, the life-spirit (བླ, bla), pervades the whole body, in horses and other livestock too; no bloodletting, moxibustion or other treatment there
reading.LunarDate.30.birth=a child will be poor

# Readings: weekdays (the White Beryl, pp. 308–312)
reading.Weekday.SUNDAY=The Sun's day. Setting out goes badly, above all to the south, the north and the directions between. Hold no funeral on it, even when the Sun is strong: it is the door of heaven. With Tuesday and Saturday it is a day on which virtuous work is avoided.
reading.Weekday.SUNDAY.also_called=the la weekday (བླ་གཟའ, bla gza') of kings; royal caste; peaceful; pale red; fire
reading.Weekday.SUNDAY.strong=in the waning half of the month, by day, and in Leo
reading.Weekday.SUNDAY.birth=a boy who lives through seven days and seven months lives long and is loved by the great; a girl will be rich, but more girls follow her, so some hold her birth bad
reading.Weekday.SUNDAY.death=repeated nine or seven times
reading.Weekday.MONDAY=The Moon's day. Setting out goes badly, above all to the south-west. Burn no fire offering (ཧོམ, hom) on it, even when the Moon is strong: it is the door of the nāgas.
reading.Weekday.MONDAY.also_called=the la weekday (བླ་གཟའ, bla gza') of women and nāgas; noble caste; peaceful; white and yellow; water
reading.Weekday.MONDAY.strong=in Cancer and at night
reading.Weekday.MONDAY.birth=a boy will be rich and very strong; a girl beautiful and pleasing
reading.Weekday.MONDAY.death=not repeated
reading.Weekday.TUESDAY=Mars's day. Setting out goes badly, and very badly to the south, the north and the directions between. With Sunday and Saturday it is a day on which virtuous work is avoided.
reading.Weekday.TUESDAY.also_called=Auspicious (བཀྲ་ཤིས, bkra shis); the la weekday (བླ་གཟའ, bla gza') of asuras and generals; royal caste; fierce; red and black; fire
reading.Weekday.TUESDAY.strong=in Aries and Scorpio
reading.Weekday.TUESDAY.birth=a boy is hard to raise, given to evil, divisive, proud and quick to anger; a girl dies young
reading.Weekday.TUESDAY.death=repeated three times
reading.Weekday.WEDNESDAY=Mercury's day. Setting out goes well in general, but badly to the east, the north and the directions between. Dig no grave on it, even when Mercury is strong: it ends the lineage.
reading.Weekday.WEDNESDAY.also_called=the yakṣa, a neuter planet; the la weekday (བླ་གཟའ, bla gza') of kings; commoner caste; peaceful; blue and green; water
reading.Weekday.WEDNESDAY.strong=at the start of the waxing half of the month and the end of the waning half, and in Gemini and Virgo; increasing rites go especially well then
reading.Weekday.WEDNESDAY.birth=a boy is bad, harsh to his mother and sickly; a girl makes her parents poor but has food, wealth and power herself
reading.Weekday.WEDNESDAY.death=bad five times over; a prisoner is not freed
reading.Weekday.THURSDAY=Jupiter's day. Setting out goes well in general, but badly to the west. Hurl no zor (ཟོར, zor) on it, even when Jupiter is strong: it is the planet of funerals.
reading.Weekday.THURSDAY.also_called=the la weekday (བླ་གཟའ, bla gza') of lamas, bodhisattvas, ministers and monks; brahmin caste; mixed peaceful and fierce; yellow; wind
reading.Weekday.THURSDAY.strong=in Pisces and Sagittarius
reading.Weekday.THURSDAY.birth=a boy is plain of face but clear-minded and learned, and practises the dharma; a girl lives long and has good friends
reading.Weekday.THURSDAY.death=only a little bad for those left behind; funeral rites go badly, but a funeral feast goes well
reading.Weekday.FRIDAY=Venus's day. Setting out goes well in general, but badly to the south, the north and the west. Send no livestock away on it, even when Venus is strong: it is the planet of livestock.
reading.Weekday.FRIDAY.also_called=the la weekday (བླ་གཟའ, bla gza') of kings, ministers and women; brahmin caste; peaceful; many-coloured; earth
reading.Weekday.FRIDAY.strong=in the waning half of the month and in Taurus and Libra; rites of power go well then
reading.Weekday.FRIDAY.birth=a boy lives long and is sharp and rich; a girl is sickly but of great glory
reading.Weekday.FRIDAY.death=repeated seven times
reading.Weekday.SATURDAY=Saturn's day. Setting out goes badly, above all to the directions between, the east and the west. Give no wealth away on it, even when Saturn is strong: it is the planet of earth. With Sunday and Tuesday it is a day on which virtuous work is avoided.
reading.Weekday.SATURDAY.also_called=poor, neuter, a servant; the la weekday (བླ་གཟའ, bla gza') of children; caṇḍāla caste; fierce; grey and yellow; earth
reading.Weekday.SATURDAY.strong=at night, in the waning half of the month, and in Capricorn and Aquarius; killing goes well then
reading.Weekday.SATURDAY.birth=handsome but of little merit; a boy is middling, a girl short-lived
reading.Weekday.SATURDAY.death=not repeated; a prisoner loses all he owns
reading.Trigram.LI=The day of the fire trigram (ལི, li) is the day of Ömbarma (འོད་འབར་མ, 'od 'bar ma), first of the eight goddesses counted through the month. An illness that comes on it is traced to digging up or breaking a hearth, felling trees, going about at dusk or before dawn, or work on water channels.
reading.Trigram.LI.spirits=nāgas (ཀླུ, klu), tsen (བཙན, btsan), drewo (གྲེ་བོ, gre bo) and dremo (གྲེ་མོ, gre mo)
reading.Trigram.LI.illness=swelling of the belly and stabbing pains from the upper body
reading.Trigram.LI.rites=a bongra (བོང་ར, bong ra), a tsen thread-cross (བཙན་མདོས, btsan mdos) and one to drive off the water blade (ཆུ་གྲི, chu gri)
reading.Trigram.KHON=The day of the earth trigram (ཁོན, khon) is the day of Tenma (བསྟན་མ, bstan ma), one of the eight goddesses counted through the month. An illness that comes on it is traced to going to an unclean place or a place of quarrel.
reading.Trigram.KHON.spirits=gods (ལྷ, lha), knife tsen (གྲི་བཙན, gri btsan) and earth lords (ས་བདག, sa bdag)
reading.Trigram.KHON.illness=the stomach and liver are unwell, with stabbing pains, swellings and eruptions (ཤུ་ཐོར, shu thor)
reading.Trigram.KHON.rites=smoke offerings, confession, a tsen thread-cross (བཙན་མདོས, btsan mdos) and a zhonggyé (གཞོང་རྒྱས, gzhong rgyas)
reading.Trigram.DWA=The day of the lake trigram (དྭ, dwa) is the day of Karselma (དཀར་གསལ་མ, dkar gsal ma), one of the eight goddesses counted through the month. An illness that comes on it is traced to cooking or burning flesh and blood on the hearth.
reading.Trigram.DWA.spirits=gods (ལྷ, lha), gyalpo (རྒྱལ་པོ, rgyal po) and drewo (གྲེ་བོ, gre bo)
reading.Trigram.DWA.illness=wasting, swelling of the belly and kidney illness
reading.Trigram.DWA.rites=confession, ablution, water tormas (ཆུ་གཏོར, chu gtor) and a gyalpo thread-cross (རྒྱལ་མདོས, rgyal mdos)
reading.Trigram.KHEN=The day of the sky trigram (ཁེན, khen) is the day of Dangdenma (མདངས་ལྡན་མ, mdangs ldan ma), one of the eight goddesses counted through the month. An illness that comes on it is traced to clean and unclean food.
reading.Trigram.KHEN.spirits=namté (གནམ་ཐེ, gnam the), earth lords (ས་བདག, sa bdag), serak (བསེ་རག, bse rag), gyengong (རྒྱལ་འགོང, rgyal 'gong) and spirits of the dead
reading.Trigram.KHEN.illness=pain in the side, diarrhoea, and trouble in the lungs, the heart and the joints
reading.Trigram.KHEN.rites=a ransom (གླུད, glud) and water tormas (ཆུ་གཏོར, chu gtor)
reading.Trigram.KHAM=The day of the water trigram (ཁམ, kham) is the day of Chambepma (ཆར་འབེབས་མ, char 'bebs ma), one of the eight goddesses counted through the month. An illness that comes on it is traced to beer and the food of a widow's house.
reading.Trigram.KHAM.spirits=mo (མོ, mo), nyen (གཉན, gnyan) and water dre (གྲེ, gre)
reading.Trigram.KHAM.illness=stabbing pains front and back, a dry mouth, cold illness, dropsy, diarrhoea and vomiting
reading.Trigram.KHAM.rites=a blue thread-cross (མདོས, mdos) and the nine-fold rite against the sasin (ས་སྲིན, sa srin)
reading.Trigram.GIN=The day of the mountain trigram (གིན, gin) is the day of Yomema (གཡོ་མེད་མ, g.yo med ma), one of the eight goddesses counted through the month. An illness that comes on it is traced to wandering empty valleys in a storm.
reading.Trigram.GIN.spirits=driptsen (གྲིབ་བཙན, grib btsan) and jetötong (བརྗེ་ཐོད་གཏོང, brje thod gtong)
reading.Trigram.GIN.illness=contagious fever, exhaustion and madness
reading.Trigram.GIN.rites=a thread-cross (མདོས, mdos) against contagion and the rites of fulfilment and confession (བསྐང་བཤགས, bskang bshags)
reading.Trigram.ZIN=The day of the thunder trigram (ཟིན, zin) is the day of Önchangma (འོད་འཆང་མ, 'od 'chang ma), one of the eight goddesses counted through the month. An illness that comes on it is traced to food from an unlucky direction and to flesh and blood.
reading.Trigram.ZIN.spirits=earth lords (ས་བདག, sa bdag), nāgas (ཀླུ, klu), nyen (གཉན, gnyan) and dremo (གྲེ་མོ, gre mo)
reading.Trigram.ZIN.illness=stabbing pains in the liver and ribs, a sick stomach and swellings
reading.Trigram.ZIN.rites=a rite for the nāgas (ཀླུ, klu) and one to drive off the dremo (གྲེ་མོ, gre mo)
reading.Trigram.ZON=The day of the wind trigram (ཟོན, zon) is the day of Kyopjema (སྐྱོབ་བྱེད་མ, skyob byed ma), last of the eight goddesses counted through the month. An illness that comes on it is traced to the property of a temple or of Buddhist or Bon (བོན, bon) priests.
reading.Trigram.ZON.spirits=Pehar (པེ་ཧར, pe har), kordak (དཀོར་བདག, dkor bdag) and the harmful spirits of the dead who broke their pledges (དམ་སྲི, dam sri)
reading.Trigram.ZON.illness=pain in the kidneys and waist, eye illness, heart wind and exhaustion
reading.Trigram.ZON.rites=a gyalpo thread-cross (རྒྱལ་མདོས, rgyal mdos), the rites of fulfilment and confession (བསྐང་བཤགས, bskang bshags) and one to drive off the spirits of the dead who broke their pledges (དམ་སྲི, dam sri)
reading.GreatCombination.KUN_DGA=A lucky combination: wealth is found. Life, lustre and splendour grow, and glory, riches and merit blaze. Work and plans go well, and the jewel of a long life is found.
reading.GreatCombination.DUS_DBYIG=An unlucky combination: great fear. The sky's brightness fades, flowers wither, and trees and waters dry up. A feared enemy comes, and there is killing.
reading.GreatCombination.DUL=A lucky combination: much wealth, and one grows rich. Wishes are fulfilled and the mind is at ease. Happiness, wealth and the dharma come, with long life; its image is the fruit of the wish-granting tree.
reading.GreatCombination.SKYE_DGU=A lucky combination: happiness for women. The work one wishes for goes well, and wisdom and devotion grow greatly. Good fortune comes, with people and wealth.
reading.GreatCombination.GZHON=A lucky combination: every work goes well. The enemy is destroyed and the battle won, and the days of life are sustained. Its image is a tiger's bright stripes.
reading.GreatCombination.BYA_ROG=An unlucky combination: quarrels, fear and hunger. Life's treasure does not last, and its lustre wanes. Food and drink do not nourish, and the joy of gods and men turns to suffering.
reading.GreatCombination.RGYAL_MTSHAN=A lucky combination: wealth and clothes in plenty. Lustre and radiance shine, with glory, good fortune and happiness. People and wealth do well, and the music of virtue sounds.
reading.GreatCombination.DPAL_BEU=A lucky combination: jewels gather. Power comes, and sons. A great glory spreads and stays good to the end, and happiness and the goddess's work go well.
reading.GreatCombination.RDO_RJE=An unlucky combination: fear of lightning and hail. One is ill at ease and others are ruined. Many kinds of non-virtue arise, and enemies, robbers and epidemics bring fear.
reading.GreatCombination.THO_BA=An unlucky combination: fear of death. Hatred cuts life short, with weeping, disputes and ignorance. It is hostile to the lives of four-footed animals.
reading.GreatCombination.GDUGS=A lucky combination: enemies are overcome. Courage and strength of arms come, and the enemy of hatred and disputes is destroyed. Its image is a lion cub at ease.
reading.GreatCombination.GROGS=A lucky combination: one meets friends. Glory and kindness come, wishes are fulfilled, and life is a treasure full of lustre. Glory and the aims one wishes for are achieved.
reading.GreatCombination.YID=A lucky combination: glory is gained. The jewel that is life's treasure comes, with jewels, glory, power and the good path. Glory and the aims one thinks of are achieved.
reading.GreatCombination.DOD=A lucky combination: work goes as one wishes. It is the path to kin, and the jewels one gathers are pleasing. Good fortune and victory come, and what is merely thought of comes about.
reading.GreatCombination.MGAL_ME=An unlucky combination: fights and disputes break out. It is a ground of fear and dread, of gossip and malicious talk, and of quarrels with relatives.
reading.GreatCombination.RTSA_BTON=An unlucky combination: life runs out. Good fortune and plans are ruined, and dharma wealth, empowerment and consecration fail. Even the noble riches are wasted.
reading.GreatCombination.CHI_BDAG=An unlucky combination: death comes. It leads one into places and onto roads of fear. Its image is a beast of prey in the sky.
reading.GreatCombination.MDA=An unlucky combination: the nose and the limbs are weakened, and the senses too. Lustre fades and life is cut short. Work and good fortune decline.
reading.GreatCombination.GRUB=A lucky combination: work that is begun goes well. The highest accomplishment blazes, with good words and possessions. Joy, wisdom and courage are clear, and wishes, good fortune and glory are achieved.
reading.GreatCombination.MDUNG=An unlucky combination: fear of illness comes, and a queen's line is cut off. Yet growth and peace come too, good thoughts from beginning to end, and sons and grandsons.
reading.GreatCombination.BDUD_RTSI=A lucky combination: enemies are ruined. It is mostly pleasing and the best for healing, the bane of enemies and of fear. Enemies are spent, and glory and wealth are gained.
reading.GreatCombination.GTUN_SHING=An unlucky combination: life, wealth and even the gods are spent, good fortune ends, and heads are broken. Its image is the pestle that pounds, the demon's son.
reading.GreatCombination.GLANG_PO=A lucky combination: every aim is achieved. Coming, going, sitting and resting are at ease, and work brings good words and renown. Its image is a great elephant's swift strength.
reading.GreatCombination.RTAG_MYOS=A lucky combination: a mount is found. Life is precious and happy, and everything grows as the ocean's lotuses do. Good work goes well, with mounts, people, wealth and glory.
reading.GreatCombination.ZAD_PA=An unlucky combination: wealth and people run out. Life, wealth, good name and strength are spent, and food, fortress and goods. The fruit of work and of merit is spent too.
reading.GreatCombination.GYO=A lucky combination: the king's work goes well. One becomes a master of people, and the work of a kingdom and its lesser princes goes well. Fierce work goes well, and even the four great kings (རྒྱལ་ཆེན་བཞི, rgyal chen bzhi) grow rich.
reading.GreatCombination.BRTAN=An unlucky combination: the state is ruined. The enemy wins, and it is ill-omened for the retinue and the family line. The aims one thinks of fall to ruin.
reading.GreatCombination.PHEL=A lucky combination: wealth increases. The best of what lasts grows, and the mind grows too. Wisdom and thought widen, and lustre and splendour increase greatly.
reading.CombinationDay={0} The weekday's and the mansion's own results count above it.
reading.CombinationDay.GRUB_SBYOR=The accomplishment combination (འགྲུབ་སྦྱོར, 'grub sbyor) is a lucky day: whatever work is undertaken on it goes well. Pacifying, increasing and controlling work is virtuous on it, harmful fierce work aside.
reading.CombinationDay.GRUB_SBYOR.also_called=the nectar combination (བདུད་རྩི་སྦྱོར་བ, bdud rtsi sbyor ba)
reading.CombinationDay.ZUNG_SBYOR=The paired combination (ཟུང་སྦྱོར, zung sbyor) is a lucky day: pacifying, increasing and controlling work is virtuous on it, its own exceptions and harmful fierce work aside. On every weekday but Thursday it falls with the day to avoid entirely (གཏན་སྤང, gtan spang), so weigh what to take up and what to avoid.
reading.CombinationDay.BDUD_RGYAL=The demon king (བདུད་རྒྱལ, bdud rgyal) is a lucky day for rough, fierce work. Offerings to the war gods (དགྲ་ལྷ, dgra lha) go well on it.
reading.CombinationDay.GRUB_NYI=A day of accomplishment (གྲུབ་ཉི, grub nyi), one of seven, is a lucky day: important work goes well on it, and harmful, sinful work goes badly. With the demon king (བདུད་རྒྱལ, bdud rgyal) it suits attacking.
reading.CombinationDay.BKRA_SHIS_NYI=An auspicious day (བཀྲ་ཤིས་ཉི་མ, bkra shis nyi ma) is a lucky day that brings happiness.
reading.CombinationDay.PHEL_NYI=A day of growth (འཕེལ་ཉི, 'phel nyi), one of seven, is a lucky day.
reading.CombinationDay.CHUB_NYI=A day of fulfilment (ཆུབ་ཉི, chub nyi) is a lucky day, like the paired combination (ཟུང་སྦྱོར, zung sbyor): nearly all good work goes well on it.
reading.CombinationDay.MTHUN_NYI=A day of harmony (མཐུན་ཉི, mthun nyi) is a lucky day for bringing people together.
reading.CombinationDay.SBYOR_NYI=A day of union (སྦྱོར་ཉི, sbyor nyi), one of seven, is a lucky day, and destructive work goes badly on it.
reading.CombinationDay.BDUD_NYI=A demon day (བདུད་ཀྱི་ཉི་མ, bdud kyi nyi ma), one of seven, is an unlucky day: the work it is named for goes badly, and all work of the powerful. A bride harms her father-in-law and husband, and a funeral the dead's family.
reading.CombinationDay.BDUD_NYI.also_called=on Sunday the demon day of offerings to the gods, on Monday of queens, on Tuesday of generals, on Wednesday of grain measurers, on Thursday of priests, on Friday of nobles, on Saturday of horse dealers
reading.CombinationDay.CHI_SBYOR=The death combination (འཆི་སྦྱོར, 'chi sbyor) is an unlucky day: most work goes badly on it, moving the sick above all. Its image is each planet striking its mansion: the Sun burns the fingers of Hasta, the Moon overpowers Kṛttikā.
reading.CombinationDay.MI_PHROD_NYI=A day of incompatibility (མི་འཕྲོད་ཉི་མ, mi 'phrod nyi ma) is an unlucky day that suits harmful work such as causing division. A bride harms the mother-in-law, and a funeral the bride's brothers and sisters.
reading.CombinationDay.MI_MTHUN_NYI=A day of discord (མི་མཐུན་ཉི་མ, mi mthun nyi ma) is an unlucky day: separating and harmful work go well, and most good work goes badly. A marriage harms oneself, one's father and the mother-in-law, and a funeral harms young men.
reading.CombinationDay.JIG_NYI=A day of destruction (འཇིག་པའི་ཉི་མ, 'jig pa'i nyi ma) is an unlucky day that suits harmful work. It is bad for a bride, the relatives and horses, and a funeral harms the household and the nephews.
reading.CombinationDay.GTAN_SPANG=The day to avoid entirely (གཏན་སྤང, gtan spang) is an unlucky day: every important work is to be avoided, bloodletting and moxibustion above all. On every weekday but Thursday it falls with the paired combination (ཟུང་སྦྱོར, zung sbyor), so weigh what to take up and what to avoid.
reading.CombinationDay.GTAN_SPANG.also_called=the burning combination (བསྲེག་སྦྱོར, bsreg sbyor)
reading.BurningDate=A burning date (བསྲེག་ཚེས, bsreg tshes) is an unlucky day: the weekday meets one of its own two dates, and whatever is done then bears no fruit, as burnt silk leaves only ash.
reading.BurningDate.remedy=hoist a large flag in the colour of the day's planet, and make a burnt offering (གསུར, gsur) of white butter
reading.BurningDate.falls=a weekday with one of its two dates, one in each half of the month; today {0}
reading.GreatBlackDay=The great black day (ཉི་མ་ནག་ཆེན, nyi ma nag chen), the first earth lord (ས་བདག, sa bdag) to move by date, falls today. {0} Works for the dead and the living go badly, and avoiding it matters.
reading.GreatBlackDay.0=Circling Mount Meru (རི་རབ, ri rab), Rāhu meets his youngest sister Bamsing (བམ་སྲིང, bam sring), who circles it the other way, and she is defiled: the meeting of the nine bad (ངན་པ་དགུ་འཛོམ, ngan pa dgu 'dzom), the worst of the bad.
reading.GreatBlackDay.1=It is the time of arising.
reading.GreatBlackDay.2=It is the time of bursting.
reading.GreatBlackDay.3=Rāhu's sister Taksing (སྟག་སྲིང, stag sring) is defiled.
reading.GreatBlackDay.4=A belly of blood arises.
reading.GreatBlackDay.5=The belly bursts.
reading.GreatBlackDay.6=Rāhu's sister Kongsing (ཀོང་སྲིང, kong sring) is defiled.
reading.GreatBlackDay.7=A belly of iron arises.
reading.GreatBlackDay.8=The belly bursts.
reading.GreatBlackDay.9=Rāhu's sister Bamsing (བམ་སྲིང, bam sring) is defiled.
reading.GreatBlackDay.10=A belly of water arises.
reading.GreatBlackDay.11=It is the course's last date in the year.
reading.GreatBlackDay.remedy=set up a spear on the side where the sun rises, hung with a black yak tail, five kinds of wood, a white silk scarf and black dog's hair; where a black month or a black day has defiled, hoist white silk and white cloth, make a white burnt offering (གསུར, gsur) and a water torma (ཆུ་གཏོར, chu gtor), and recite the Collected Dhāraṇīs (གཟུངས་བསྡུས, gzungs bsdus); or pour substances against harmful talk out where three roads meet, and leave without looking back
reading.GtsugLagDay={0} The Vajra Treatise (རྡོ་རྗེ་གཙུག་ལག, rdo rje gtsug lag) puts it on other weekdays and mansions than the main table.
reading.GtsugLagDay.GRUB_NYI=Approach and accomplishment (བསྙེན་སྒྲུབ, bsnyen sgrub), a deity's retreat practice, goes well on it.
reading.GtsugLagDay.MI_PHROD_NYI=It is an ill omen.
reading.Rahu={0} Fierce work goes well along Rāhu's course, and whatever faces Rāhu goes badly.
reading.DusSbyor={0} The combination period stands above every factor of the day, since all their works are complete in its house.
reading.DusSbyor.ARIES=Aries rises: a period to be avoided. It brings disputes and loss of wealth, and all keep away from it. Unvirtuous deeds thrive, and only war and fierce work go well.
reading.DusSbyor.TAURUS=Taurus rises: a period to be accomplished. Wealth and glory are found, with good fortune and renown, and offerings and services come.
reading.DusSbyor.GEMINI=Gemini rises: a good period. Wishes and renown are gained, friends are found, and gains come even unlooked for.
reading.DusSbyor.CANCER=Cancer rises: a period to be avoided. Wealth and gains surely decline, and what is merely touched is spoilt. Afflictions, disputes and fear are great.
reading.DusSbyor.LEO=Leo rises: a period to be accomplished. Harmful spirits weaken and one goes in comfort, with no fear in any work, and kings honour one.
reading.DusSbyor.VIRGO=Virgo rises: a period to be accomplished. Wishes are fulfilled as intended, with good fortune and plenty.
reading.DusSbyor.LIBRA=Libra rises: a period to be avoided. Obstacles meet one's aims, sorrow comes among friends, and gains come hard.
reading.DusSbyor.SCORPIO=Scorpio rises: a period to be avoided. Great dangers meet a journey, wealth declines and the mind is weary.
reading.DusSbyor.SAGITTARIUS=Sagittarius rises: a period to be accomplished. Going and coming are sure, and one is brave. Aims are achieved, enemies weaken and disputes are won.
reading.DusSbyor.CAPRICORN=Capricorn rises: a period to be avoided. Fights and disputes arise, with great affliction and harm from the planets.
reading.DusSbyor.AQUARIUS=Aquarius rises: a period to be accomplished. Glory and power are gained, wealth comes later, and every need is met.
reading.DusSbyor.PISCES=Pisces rises: a period to be accomplished. Renown is won where it is needed, every work goes well, and the hardest aims are reached.
reading.WorksSign=While this sign rises, each work it names is in its own hour, its particular case, which stands above the combination period's general reading for that work.
reading.RahuMonth={0} Any fierce work goes well on this day.
reading.RahuMonth.earlySpring.6=Rāhu moves like a messenger turning its head; today it is in its eye.
reading.RahuMonth.earlySpring.9=Rāhu moves like a messenger turning its head; today it is in its right shoulder.
reading.RahuMonth.earlySpring.11=Rāhu moves like a messenger turning its head; today it is in its left shoulder.
reading.RahuMonth.earlySpring.13=Rāhu moves like a messenger turning its head; today it is in its heart.
reading.RahuMonth.midSpring.16=Rāhu moves like a messenger turning its head; today it is in its eye.
reading.RahuMonth.midSpring.9=Rāhu moves like a messenger turning its head; today it is in its head.
reading.RahuMonth.midSpring.11=Rāhu moves like a messenger turning its head; today it is in its heart.
reading.RahuMonth.midSpring.13=Rāhu moves like a messenger turning its head; today it is in its left shoulder.
reading.RahuMonth.midSpring.19=Rāhu moves like a messenger turning its head; today it is in its right shoulder.
reading.RahuMonth.autumn.15=Today, at noon, Rāhu takes the form of the mamo (མ་མོ, ma mo) Bitipatra and moves from north-east to south-west.
reading.RahuMonth.autumn.11=Today, at midnight, Rāhu takes the form of a men (སྨན, sman) and moves from south to north.
reading.RahuMonth.autumn.8=Today, at daybreak, Rāhu takes the form of a demon (བདུད, bdud) and moves from south-west to north-east.
reading.RahuMonth.autumn.4=Today, at nightfall, Rāhu takes the form of a nyen (གཉན, gnyan) and moves from north-west to south-east.
reading.RahuMonth.autumn.22=Today, in the late afternoon, Rāhu takes the form of a mu (དམུ, dmu) and moves from east to west.
reading.RahuMonth.autumn.25=Today, at dusk, Rāhu takes the form of an ogre (སྲིན་པོ, srin po) and moves from north to south.
reading.RahuMonth.autumn.29=Today, in the late afternoon, Rāhu takes the form of the Lord of Death and moves within Lake Madrö (མ་དྲོས, ma dros).
reading.NectarPeriods=This clock hour is a nectar period (བདུད་རྩི་ཐུན་མཚམས, bdud rtsi thun mtshams), a half of a double hour whose lord is Jupiter. It is a lucky time, and the works the activity tables name for it go well.
reading.Rahu.1=Rāhu turns back at daybreak, with its retinue.
reading.Rahu.4=At sunset Rāhu enters the west and at dusk moves to the east, where it stays two days; pursuing one's aims goes well.
reading.Rahu.6=In the morning Rāhu turns to the west, and fire offerings of fierce rites go well at its turning.
reading.Rahu.8=Rāhu enters the south-east from the east and in the forenoon moves to the north-west, where it stays three days.
reading.Rahu.11=Rāhu turns back at dusk, with its retinue.
reading.Rahu.12=At dusk Rāhu enters by the northern gate and at nightfall moves from north to south, where it stays two days.
reading.Rahu.14=Rāhu turns back at noon, with its retinue, and casting hail and burying rites go well.
reading.Rahu.15=In the forenoon Rāhu enters the south-west and at noon moves to the north-east, where it stays two days.
reading.Rahu.17=At midnight Rāhu turns back to the south-west, and work that casts lightning and hail goes well.
reading.Rahu.18=At midnight Rāhu enters the east and after midnight moves to the west, where it stays three days.
reading.Rahu.21=Rāhu turns back at midday, with its retinue.
reading.Rahu.22=At noon Rāhu enters the north-west and early in the afternoon moves to the south-east, where it stays two days; seeking a grave site goes badly.
reading.Rahu.24=Rāhu turns back in the afternoon, and work that casts lightning and hail goes well.
reading.Rahu.25=At midnight Rāhu enters the south and at dawn moves to the north, where it stays two days.
reading.Rahu.27=Rāhu turns back at dusk, with its retinue, and the rites of Viṣṇu are practised.
reading.Rahu.29=In the afternoon Rāhu enters the north-east and, the sun a spear's length high, moves to the south-west, where it stays two days.
reading.Rahu.through_day=from the east to the north-west at first sun, to the south in the warmth of the morning, to the north-east at noon, to the west late in the afternoon, to the south-east at sunset, to the north at dusk, to the south-west at midnight, and back to the east from dawn to daybreak
reading.RahuGeneral.2=After noon Rāhu moves from the east to the west.
reading.RahuGeneral.3=In the warmth of the morning Rāhu moves from the south-west to the north-east.
reading.RahuGeneral.5=In the warmth of the morning Rāhu moves from the east to the west.
reading.RahuGeneral.7=At dusk Rāhu moves from the north to the south.
reading.RahuGeneral.9=At dusk Rāhu moves from the north-east to the south-west.
reading.RahuGeneral.10=At dawn Rāhu moves from the south to the north.
reading.RahuGeneral.13=At daybreak Rāhu moves from the north to the south.
reading.RahuGeneral.16=At sunset Rāhu moves from the north-east to the south-west.
reading.RahuGeneral.19=Early in the morning Rāhu moves from the south to the north.
reading.RahuGeneral.20=At noon Rāhu moves from the south-east to the north-west.
reading.RahuGeneral.23=At noon Rāhu moves from the north-west to the south-east.
reading.RahuGeneral.26=After midnight Rāhu moves from the east to the west.
reading.RahuGeneral.28=At dawn Rāhu moves from the north to the south.
reading.RahuGeneral.30=From the meeting place of the gods Rāhu moves through the whole sky, above and below, in every direction.

# Readings with a shared pattern: {0} takes the entry
reading.KyuSei=Element, direction, trigram and colour: {0} Used in Japanese onmyōdō to read fortunes and directions; the stars have nothing to do with planets.
reading.KyuSei.IPPAKU=Water; north; trigram 坎 (water); white.
reading.KyuSei.JIKOKU=Earth; southwest; trigram 坤 (earth); black.
reading.KyuSei.SANPEKI=Wood; east; trigram 震 (thunder); blue.
reading.KyuSei.SHIROKU=Wood; southeast; trigram 巽 (wind); green.
reading.KyuSei.GOO=Earth; centre; 太極 (the supreme ultimate); yellow.
reading.KyuSei.ROPPAKU=Metal; northwest; trigram 乾 (heaven); white.
reading.KyuSei.SHICHISEKI=Metal; west; trigram 兌 (lake); red.
reading.KyuSei.HAPPAKU=Earth; northeast; trigram 艮 (mountain); white.
reading.KyuSei.KYUSHI=Fire; south; trigram 離 (fire); purple.
reading.StarRelation={0} Your birth star (本命星) is the year star of your birth year, counted from 立春. This reading belongs to 九星気学, fortune-telling by the nine stars, gathered as 気学 in 1909; it is not an annotation of the historical almanac.
reading.StarRelation.SOSHO=相生: the element of one star feeds the other's, as metal feeds water. Read against a person's years, months and days, this counts as good.
reading.StarRelation.HIWA=比和: both stars have the same element. Read against a person's years, months and days, this counts as good.
reading.StarRelation.SOKOKU=相剋: the element of one star overcomes the other's, as earth overcomes water. Read against a person's years, months and days, this counts as bad.
reading.Kinship={0} The other aspects read as the vitality does.
reading.Kinship.MOTHER=The mother relation: the other element feeds yours, as water feeds wood. Three white pebbles mark it. For the vitality they foretell that the tree of life grows and that one is well supported.
reading.Kinship.MOTHER.rank=the best of the five relations
reading.Kinship.FRIEND=The friend relation: your element overcomes the other, as wood overcomes earth. Two white pebbles mark it. For the vitality they foretell enough to live on, wishes fulfilled and no threat to life.
reading.Kinship.FRIEND.rank=second to the mother relation
reading.Kinship.IDENTITY=The identity relation: the other element is yours. For earth and water one white pebble marks it: for the vitality, no obstacle to long life. For wood, fire and iron one black pebble marks it: the sap of the tree of life dries and rites lose their force.
reading.Kinship.SON=The son relation: your element feeds the other, as wood feeds fire. One white and one black pebble mark it. For the vitality they foretell good and bad together, so rites can still turn misfortune aside.
reading.Kinship.ENEMY=The enemy relation: the other element overcomes yours, as iron overcomes wood. Two black pebbles mark it. For the vitality they foretell punishment and a broken tree of life.
reading.Kinship.ENEMY.rank=the worst of the five relations
reading.Ehou=Where 歳徳神, the god of the year's fortune, resides. Whatever is done facing this direction is lucky.
reading.Haircut.GOOD={0}: cutting the hair on this date goes well. It is one of the sixteen lunar dates good for a haircut, while on the other fourteen a haircut is to be avoided.
reading.Haircut.AVOID={0}: cutting the hair on this date goes badly. It is one of the fourteen lunar dates on which a haircut is to be avoided, while the other sixteen are good for it.
