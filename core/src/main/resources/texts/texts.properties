reading.EarthLord.NAG_CHUNG=The lesser black day, Nyima Nakchung (ཉི་མ་ནག་ཆུང, nyi ma nag chung), is the course of Jama Gunggyal (བྱ་མ་གུང་རྒྱལ, bya ma gung rgyal), one of the earth lords (ས་བདག, sa bdag) that the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) moves by date. In the three months of spring it falls on the 8th, 18th and 28th in turn, in summer on the 5th, 15th and 25th, in autumn on the 1st, 11th and 21st, in winter on the 4th, 18th and 16th, the seasons counted as the text's chapter on the earth lords counts them, spring from the 11th month; another view has the 9th, 19th and 29th in winter. Works for the dead, a bride, consecration, feasts and funeral rites are bad on it, above all sending wealth out of the house. As remedy the text names dough figures of a tiger, a horse, a sheep and a dog set to the south, west, north and east with offerings, or white butter burnt, white earth scattered on the roof and red earth to the four sides.
reading.EarthLord.PI_LING=Piling Parma (པི་ལིང་འཕར་མ, pi ling 'phar ma), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) with eleven ministers, moves on one date and at one hour of each month: in spring on the 28th at the pig hour, the 18th at the monkey hour and the 8th at the snake hour; in summer on the 25th at the pig hour, the 15th at the monkey hour and the 5th at the snake hour; in autumn on the 21st at the dog hour, the 11th at the sheep hour and the 1st at the dragon hour; in winter on the 29th at the bird hour, the 19th at the horse hour and the 9th at the hare hour, spring counted from the 11th month. Suppressing, curse objects (གཏད, gtad), sending hail, hurling zor (ཟོར, zor), thread-crosses (མདོས, mdos) and tormas (གཏོར་མ, gtor ma), counter-attack and fierce work are good, and done along with it they strike hard. All works great and small are bad, above all a bride, moving house, building, walls, consecration, stupas, works for the dead, enthronement, burial, funeral rites, spectacles, feasts, maṇḍalas and banner poles; digging the ground then brings deaths. The text adds remedies: reading the scriptures, a yellow banner, a thread-cross for the earth lords.
reading.EarthLord.ZIN_PHUNG=Zinpung (ཟིན་ཕུང, zin phung), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), moves on days of given animals, the date's animal: in spring on tiger and monkey days from south to north, in summer on ox and sheep days from west to east, in autumn on dog and dragon days from north to south, in winter on pig and snake days from east to west, spring counted from the 11th month; in spring on mouse, horse, bird and hare days it sits in the middle. Its hour changes month by month, from the first month of spring: when the birds go to roost, midnight, dawn, late afternoon, the first sun on the peaks, the warmth of the morning, nightfall, sunrise, morning, noon, midnight and evening; it turns back at the hour four back, the downward four-slayer (བཞི་གཤེད, bzhi gshed). While it moves a child born turns back, council turns out badly, a bride brings ruin, spectacles and feasts are bad, building, funeral rites and carrying a corpse bring harm, and no war or robbery may be done: great works bring great harm and small ones small. Bad means go along with it; never face it. The text adds remedies. {0}
reading.EarthLord.ZIN_PHUNG.0=Today, a spring day of the tiger or monkey, Zinpung moves from south to north: building, clay votive images (ཚ་ཚ, tsha tsha), drawing maṇḍalas, blocking holes, roofing and seeking a grave site are avoided.
reading.EarthLord.ZIN_PHUNG.1=Today, a summer day of the ox or sheep, Zinpung moves from west to east: work with earth and water, ponds and canals, sowing, threshing and wells are avoided.
reading.EarthLord.ZIN_PHUNG.2=Today, an autumn day of the dog or dragon, Zinpung moves from north to south: work with earth, what the text calls setting up growth (སྐྱེད་འཛུགས, skyed 'dzugs), building walls and pulling down the yak wood (གཡག་ཤིང་དགོག, g.yag shing dgog), two works rendered word for word, are avoided.
reading.EarthLord.ZIN_PHUNG.3=Today, a winter day of the pig or snake, Zinpung moves from east to west: work with earth, stupas and foundations are avoided.
reading.EarthLord.ZIN_PHUNG.middle=Today, a spring day of the mouse, horse, bird or hare, Zinpung sits in the middle: nothing is to be done.
reading.EarthLord.PHUNG_ZOR=Pungpo Zortok (ཕུང་པོ་ཟོར་ཐོགས, phung po zor thogs), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), moves on one date of each month: the 8th of the tiger and hare months, the 9th of the dragon month, the 3rd of the snake, the 23rd of the horse, the 9th of the sheep, the 7th of the monkey, the 17th of the bird, the 8th of the dog, the 1st of the pig, the 16th of the mouse and the 9th of the ox, the tiger month being the 11th; another view goes by the months of the seasons. Seeking one's aims, moving one's dwelling, feasts, practice, empowerment, teaching, giving vows, council, sending messages, taking a child out, a corpse, a bride, a grave, war and robbery, spectacles, funeral rites, beginning works for the living and the dead, paying debts, virtuous work and building are avoided; destructive mantras against others are good. The text adds remedies: a man with a tiger quiver and a zor (ཟོར, zor), or one turned outward or burnt.
reading.EarthLord.KI_KANG=Kikang (ཀི་ཀང, ki kang), the general demon of the elements, the wild and fierce planet Rāhu, moves in the tiger, horse and dog months on the 15th and 28th, in the pig, sheep and hare months on the 2nd and 3rd, in the mouse, dragon and monkey months on the 18th and 28th, and in the bird, ox and snake months on the 16th and 26th, the tiger month being the 11th; the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) gives two other courses. Beginning works for the living and the dead, war, spectacles, paying debts, and peaceful and virtuous work are avoided: white work then brings a king down, a bride is bad both ways, building soon falls, a feast becomes a funeral feast, a child born soon turns back, and an illness does not heal. Cruel and harsh work is good.
reading.EarthLord.HAL_KHYI=Halkyi Nakpo (ཧལ་ཁྱི་ནག་པོ, hal khyi nag po), the panting black dog, an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), seeks food on one date and at one hour of each month: the tiger month's 8th at the bird hour, the hare's 16th at the horse hour, the dragon's 24th at the tiger hour, the snake's 9th at the ox hour, the horse's 18th at the pig hour, the sheep's 27th at the bird hour, the monkey's 10th at the snake hour, the bird's 20th at the dragon hour, the dog's 30th at the tiger hour, the pig's 11th at the bird hour, the mouse's 22nd at the monkey hour and the ox's 3rd at the hare hour, the tiger month being the 11th. A bride, building, spectacles, feasts, funeral rites, war, a corpse, giving and taking dogs, moving house, speeches and all virtuous work are avoided; directing magic and harmful work are good. The text adds remedies: a whole dog's or sheep's head hung with silk on the roof at its hour, or a black dog of grain pointed its way.
reading.EarthLord.GNAM_KHYI=Namkyi Nakpo (གནམ་ཁྱི་ནག་པོ, gnam khyi nag po), the black sky dog, an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), seeks food on days of given animals, the date's animal, at given times: in the first month of spring on dragon and sheep days in the warmth of the morning, the middle on snake and monkey days at noon, the last on horse and bird days at daybreak; in summer on dog and sheep days late in the afternoon, on pig and snake days at sunrise, on mouse, horse and monkey days at dusk; in autumn on dragon and sheep days at dusk, on tiger, sheep and pig days in the warmth of the morning, on mouse, hare and monkey days at midnight; in winter on ox, tiger and dragon days late in the afternoon, on tiger, dragon and dog days at sunset, on pig, hare and mouse days at dusk, spring counted from the 11th month; the text gives another course too. Great works for the living and the dead, above all a bride, building and carrying out a corpse, are avoided as for Halkyi Nakpo. The text adds remedies.
reading.EarthLord.GNAM_SBYOR=Namjor (གནམ་སྦྱོར, gnam sbyor), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), falls in spring on the 8th, 7th and 4th of the three months in turn, in summer on the 7th, 7th and 26th, in autumn on the 19th, 19th and 7th, in winter on the 16th, 19th and 24th, spring counted from the 11th month. A new couple joining, a bride and a corpse are bad; some add war, spectacles and taking a child out. Its remedies are the Namkyi Nakpo's.
reading.EarthLord.GZA_RGOD=Zagö (གཟའ་རྒོད, gza' rgod), the wild planet, an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), seeks food in the dragon and sheep months on the 18th, in the pig and snake months on the 16th and 22nd, in the horse month on the 13th and in the monkey month on the 9th and 22nd, the tiger month being the 11th. Giving or taking a bride is bad; when a child is born one of the parents dies or the child turns back; an illness then does not heal, and a corpse sent out repeats five times. Thread-crosses (མདོས, mdos), tormas (གཏོར་མ, gtor ma) and fierce work are good. Remedy: silk in the colour of the weekday hoisted and white butter burnt.
reading.EarthLord.DBUL_PO=Ulpo Laktong (དབུལ་པོ་ལག་སྟོང, dbul po lag stong), the empty-handed pauper, an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), moves in the tiger month on the 1st and 11th, the hare's on the 2nd and 21st, the dragon's on the 3rd and 8th, the snake's on the 4th and 8th, the horse's on the 5th and 11th, the sheep's on the 6th and 22nd, the monkey's on the 7th and 19th, the bird's on the 8th and 10th, the dog's on the 22nd and 9th, the pig's on the 1st, the mouse's on the 1st and 16th and the ox's on the 9th and 29th, the tiger month being the 11th; one person's view differs in four months. Feasts and giving out wealth bring poverty; building, a bride, naming a child, a new teaching, consecrating supports, spectacles, roofing, raising banners, carrying out a corpse, sowing fields, opening storehouses and most works for the living and the dead are avoided. The text adds remedies: wealth taken from three rich men, dough figures of a hand and a tortoise, a trader's grain given away.
reading.EarthLord.GZA_BDUN=Zadün (གཟའ་བདུན, gza' bdun), the seven planets seeking food and sending out messengers, an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), moves in the three months of spring on the 8th, 18th and 28th in turn, in summer on the 5th, 15th and 25th, in autumn on the 1st, 11th and 21st and in winter on the 9th, 19th and 29th, spring counted from the 11th month; another view takes the same dates in the reverse order. All white work, a corpse, funeral rites, building, a child born, a boy's feast, a bride and taking a child out are bad; destructive mantras against others are good. Its results are Kikang's (ཀི་ཀང, ki kang). Remedy: the planets' consort and the supreme planet recited, yellow silk hoisted, yellow earth scattered.
reading.EarthLord.NGAM_SHING=Ngamshing (ངམ་ཤིང, ngam shing), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), moves in the first month of spring on the 10th from east to west, in the middle month on the 20th from east to west, in the middle month of summer on the 30th from south to north, in the last on the 12th from east to west, in the first month of autumn on the 10th from west to east, in the middle on the 20th from east to west, in the middle month of winter on the 30th from south to north and in the last on the 12th from east to west, spring counted from the 11th month. On it a spiritual friend is honoured, a throne raised, a new teaching given, abbots and teachers escorted and welcomed, praised and honoured; a bride is not allowed. The text gives no other remedy.
reading.EarthLord.BAR_KHYI=Barkyi (བར་ཁྱི, bar khyi), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), moves on the dates of Zadün (གཟའ་བདུན, gza' bdun): in spring the 8th, 18th and 28th in turn, in summer the 5th, 15th and 25th, in autumn the 1st, 11th and 21st, in winter the 9th, 19th and 29th, spring counted from the 11th month. A bride, burning a corpse, roofing, consecration, building, spectacles, feasts, raising banners and seeking one's aims are avoided. Its remedies are Halkyi Nakpo's, or a wooden tablet with the twelve years and eight trigrams and a black dog on the threshold.
reading.EarthLord.KA_KHYUNG=Kakhyung Kikang (ཀ་ཁྱུང་ཀི་ཀང, ka khyung ki kang), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), moves in the tiger, horse and dog months on the 11th and 27th, in the pig, sheep and hare months on the 24th, in the mouse, dragon and monkey months on the 28th and in the bird, ox and snake months on the 26th, the tiger month being the 11th. Some say that beginning works for the living and the dead, building, spectacles, war, funeral rites, a bride and paying small dues are bad; the text says no good or bad results and no remedies are given for it, but all except fierce work is to be avoided.
reading.EarthLord.DRA_CHEN=Drachen (དྲ་ཆེན, dra chen), an earth lord (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), moves in the snake month on the 25th, in the sheep month on the 15th, in the bird month on the 1st and 21st, in the dog month on the 21st and in the pig month on the 9th, the tiger month being the 11th. Feasts, a bride, moving a corpse, war, and the rough works of the living and the dead are avoided; no remedy is given.
reading.EarthLord.SDE_BRGYAD=The eight classes (སྡེ་བརྒྱད, sde brgyad), which the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) moves by date with the earth lords (ས་བདག, sa bdag), strike (ཐེབས, thebs) and turn back (བཟློག, bzlog) on given dates and hours, each month with a class of its own, spring counted from the 11th month. In the first month of spring they strike on the 14th at the hare hour with the tenma (བསྟན་མ, bstan ma), from west to east, and on the 15th too, and turn back on the 17th and 19th, at noon and at the monkey and ox hours; in the middle month they strike on the 16th at the pig hour with the four demons (བདུད, bdud), from east to west, and turn back on the 1st, 8th, 11th, 21st and 28th; in the last, on the 22nd at the pig hour with the female demons (མ་བདུད, ma bdud), from south to north, turning back on the 9th and 30th. In the first month of summer they strike on the 8th at the hare hour with the eight great planets (གཟའ, gza') and turn back on the 2nd and 5th at the bird and mouse hours; in the middle, on the 15th at the dragon hour with the eight nāgas (ཀླུ, klu), from south-west to north-east, turning back on the 6th, 16th and 18th at the snake hour; in the last, with the mamo (མ་མོ, ma mo), they are taken up with spectacles, turn back on the 11th at the horse hour and strike once on the 9th. In the first month of autumn they strike on the 15th at the dragon hour facing north-east and on the 23rd at the dragon hour with the mamo facing north-west, and turn back on the 25th at the ox hour; in the middle, with the mansions, they strike on the 10th and from the 17th to the 30th but the 23rd, at the hare and mouse hours, facing from west to east, and turn back on the 3rd, 13th and 23rd at the ox hour; in the last they strike with the gods (ལྷ, lha) on the 8th, 28th and 30th at the horse and bird hours, facing north-west (some say from the 8th to the 30th), and turn back on the 1st and 2nd at the hare hour. In the first month of winter they strike from the 13th to the 16th with the yakṣas (གནོད་སྦྱིན, gnod sbyin) at the monkey and ox hours, facing north, and turn back on the 8th, 9th, 18th and 26th at the mouse hour; in the middle, from the 17th and the 22nd to the 30th with Yama's host (གཤིན་རྗེ, gshin rje) at the mouse and horse hours, to the south-east, turning back on the 20th at the bird hour; in the last they turn back on the 27th at the dog hour, and through the rest of the month, when the sun is a spear high, they strike crowds of beings, and on the 29th all eight classes strike together. When they strike, zor (ཟོར, zor), thread-crosses (མདོས, mdos), curse objects (གཏད, gtad), war and robbery, fierce work and counter-attack are good; when they turn back these are avoided. {0}
reading.EarthLord.SDE_BRGYAD.STRIKES=Today the eight classes strike.
reading.EarthLord.SDE_BRGYAD.TURNS_BACK=Today the eight classes turn back.
reading.EarthLord.SA_BDAG_BZLOG=On these dates the earth lords (ས་བདག, sa bdag) of the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) turn back (བཟློག, bzlog): in spring the 17th and 19th, the 1st and 8th, the 30th; in summer the 2nd and 5th, the 3rd, the 11th; in autumn the 25th, the 3rd, the 2nd; in winter the 18th, the 27th, the 14th, month by month, spring counted from the 11th month. Leading an army, sending out curse objects (གཏད, gtad), bringing down hail, rainmaking, breaking ground and rites for the nāgas (ཀླུ, klu) then turn back on whoever begins them: no son, wealth lost, a short life and poverty. Pukton (སྤུག་སྟོན, spug ston) has a further view, with dates of success, of vanishing and of not giving out wealth.
reading.EarthLord.GNYAN=The nyen (གཉན, gnyan), which the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) moves by date with the earth lords (ས་བདག, sa bdag), move in spring on the 8th, 6th and 4th of the three months in turn, in summer on the 7th, 10th and 27th, in autumn on the 9th, 30th and 27th, in winter on the 19th, 10th and 3rd, spring counted from the 11th month: whatever is begun then has to be done again, which is bad, but offerings to the nyen are good. In Pukton's (སྤུག་སྟོན, spug ston) view they strike (ཐེབས, thebs) and turn back (བཟློག, bzlog): in spring they strike on the 7th and turn back on the 19th, strike on the 13th and turn back on the 15th, strike on the 21st and turn back on the 18th; in summer they strike on the 3rd and 23rd and turn back on the 16th, then strike the whole of the next two months; in autumn they strike on the 9th and turn back on the 18th, strike on the 23rd and turn back on the 30th, strike on the 7th and turn back on the 1st; in winter they strike on the 1st and turn back on the 7th, strike on the 25th and turn back on the 30th, and in the last month turn back all month but the 15th. The text judges these as the strikes above. {0}
reading.EarthLord.GNYAN.MOVES=Today the nyen move.
reading.EarthLord.GNYAN.STRIKES=Today the nyen strike.
reading.EarthLord.GNYAN.TURNS_BACK=Today the nyen turn back.
reading.EarthLord.KLU=The nāgas (ཀླུ, klu), which the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) moves by date with the earth lords (ས་བདག, sa bdag), strike (ཐེབས, thebs) and turn back (བཟློག, bzlog), spring counted from the 11th month. In the first month of spring they keep their discipline on the 5th, 10th and 15th and turn back, and strike on the 14th; in the middle they strike on the 10th and, listening to the dharma, turn back on the 8th, 20th, 18th, 22nd and 28th; in the last they strike on the 25th and, their memory dulled, turn back all month but the 2nd and 8th. In the first month of summer they seek food on the 8th and go to their kin on the 15th, striking, and rest on the 20th and 25th, turning back; in the middle they seek food among people on the 20th and 22nd, striking, and turn back on the 8th and 15th; in the last they strike on the 5th, 20th and 25th and turn back on the 11th, 13th and 15th, though some teachings have them strike on the 15th doing the work of the king of existence. In the first month of autumn they seek food on the 9th and 19th, striking, and turn back on the 5th, 6th and 10th; in the middle they gather grain on the 15th, striking, some say on the 5th too, and turn back on the 3rd, 6th, 9th, 13th and 16th; in the last they seek a dwelling and put on clothes on the 1st, 11th, 21st and 22nd, striking, by the authoritative texts on the 23rd too, and turn back on the 9th, 10th and 19th. In the first month of winter they gather sap and wood and strike on the 8th and 18th, some say on the 15th too, and turn back on the 9th, 10th, 19th and 26th; in the middle they strike on the 7th and 17th, some say on the 15th and 21st, gathering grain, and turn back on the 2nd, the 6th, 16th and 26th, and the 20th; in the last month of winter they sleep, and do neither good nor harm. When they strike, nāga tormas (གཏོར་མ, gtor ma), offerings to the eight nāgas, rainmaking, curse objects (གཏད, gtad) and other works with the nāgas go well; when they turn back none of these may be done. {0}
reading.EarthLord.KLU.STRIKES=Today the nāgas strike.
reading.EarthLord.KLU.TURNS_BACK=Today the nāgas turn back.
reading.EarthLord.CLASS_TIMES=Besides their strikes and turnings, the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) gives the classes' own times, when works in accord with each are auspicious, by the first, middle and last months of the four seasons, spring counted from the 11th month: in the first months the nāgas (ཀླུ, klu) on the 7th, 17th and 27th as the sun's rays rise, the gyalpo (རྒྱལ་པོ, rgyal po) on the 8th, 18th and 28th at dawn and the lamo (ལམ་མོ, lam mo) on the 22nd at dusk; in the middle months the tsen (བཙན, btsan) on the 6th, 16th and 26th as the sun's rays rise and the yakṣas (གནོད་སྦྱིན, gnod sbyin) on the 9th, 19th and 29th at midday and midnight; in the last months the demons (བདུད, bdud) on the 29th at dusk and Yama's host (གཤིན་རྗེ, gshin rje) on the 13th late in the afternoon. The planets (གཟའ, gza') and the ogres (སྲིན་པོ, srin po) move on the dates of Viṣṭi, which the text calls the great time: the 4th, 8th, 11th, 15th, 18th, 22nd, 25th and 29th. Of every strike and turning, work done as it approaches flourishes, done ahead of it declines, and done after it has passed meets with neither good nor harm. {0}
reading.EarthLord.CLASS_TIMES.klu=Today is the nāgas' time, as the sun's rays rise.
reading.EarthLord.CLASS_TIMES.rgyal_po=Today is the gyalpo's time, at dawn.
reading.EarthLord.CLASS_TIMES.lam_mo=Today is the lamo's time, at dusk.
reading.EarthLord.CLASS_TIMES.btsan=Today is the tsen's time, as the sun's rays rise.
reading.EarthLord.CLASS_TIMES.gnod_sbyin=Today is the yakṣas' time, at midday and midnight.
reading.EarthLord.CLASS_TIMES.bdud=Today is the demons' time, at dusk.
reading.EarthLord.CLASS_TIMES.gshin_rje=Today is the time of Yama's host, late in the afternoon.
reading.EarthLord.GNAM_SGO=Every date has its sky door (གནམ་སྒོ, gnam sgo), by the last figure of its number: the 1st, 11th and 21st are the guests' door, the 2nds trade's, the 3rds small children's, the 4ths war's, the 5ths alliances', the 6ths forts', the 7ths a bride's, the 8ths the grave's, the 9ths funeral rites' and the 10ths the general one. On each door its own work is avoided; the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) writes it in the day's box of its model almanac, and gives each its remedy. It gives a special reckoning too, from the 3rd in the first months of the seasons, the 2nd in the middle and the 1st in the last, which its almanac does not follow. {0}
reading.EarthLord.GNAM_SGO.mgron_po=Today is the guests' door: seeking one's aims and receiving guests leave the house in want. Remedy: offerings to the gods, harmful talk struck down, the demon's name pressed under one's own handmill, a bird effigy waved to the northern sky and a dhāraṇī recited.
reading.EarthLord.GNAM_SGO.tshong=Today is trade's door: trading brings losses without end. Remedy: figures pressed under an effigy, a trader's flour put in a shoe and pressed under a yak horn, roasted grain scattered in the sky, a dhāraṇī recited and a dharma book waved.
reading.EarthLord.GNAM_SGO.bu_chung=Today is small children's door: a small child born, feasted or first taken out meets with obstacles. Remedy: a child's corpse put in a sack and struck with a killer's weapon, a dhāraṇī recited, and harmful talk sent away.
reading.EarthLord.GNAM_SGO.dmag=Today is war's door: an army led out is defeated nine times over. Remedy: the general's name and effigy held captive, the tip of the armour burnt, the tip of a stallion's ear cut, spears and banners raised and a dhāraṇī recited.
reading.EarthLord.GNAM_SGO.gnyen=Today is alliances' door: an alliance made turns to quarrel, and a feast to loss. Remedy: a cock bound and put in salt and covered with a low-born's shoe, talk of alliance held with someone of no consequence, a long auspicious dhāraṇī recited and good food given to a beggar.
reading.EarthLord.GNAM_SGO.mkhar=Today is the forts' door: building brings disputes before the mortar is dry. Remedy: a basket waved in the sky, a bean figure of a blind old man with the enemy's name inside pressed into the village pen or a wall's foundation, and a dhāraṇī recited.
reading.EarthLord.GNAM_SGO.bag_ma=Today is a bride's door: a bride taken is widowed again and again. Remedy: an old woman finely dressed and given bride's dough and beggar's dough, harmful talk cast into a measure, and a sūtra recited.
reading.EarthLord.GNAM_SGO.dur=Today is the grave's door: a burial brings harmful spirits of the dead (སྲི, sri) from the grave, and ruin in the end. Remedy: a wolf's skull waved to the sky and a pig's skull hidden in the ground, dough and beer given, and dhāraṇīs recited.
reading.EarthLord.GNAM_SGO.shid=Today is the funeral rites' door: funeral rites done bring disputes before the grass has dried. Remedy: the figure of a black ogress mounted on a skull, the black goddess's dhāraṇī recited, and the village cleansed.
reading.EarthLord.GNAM_SGO.spyi=Today is the general door: whatever is done goes wrong, above all the works of the community. Remedy: skulls waved to the four directions and dhāraṇīs recited.
reading.RahuSeason=Among the earth lords (ས་བདག, sa bdag) that move by date the White Beryl (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) gives Rāhu's own dates, when he seeks food: in spring the 11th and 28th of the first month, the 2nd of the middle and the 18th of the last; in summer the 16th and 22nd, the 1st and 13th, and the 2nd; in autumn the 28th, the 16th and the 1st; in winter the 2nd and the 18th, and none in the last month, spring counted from the 11th month. Works great and small for the living and the dead are avoided, above all work with earth and with mud; hurling zor (ཟོར, zor) and fierce work are auspicious. Remedy: the planets' consort recited and Vajrapāṇi's image shown. {0}
reading.RahuSeason.0=In the first month of spring Rāhu seeks food on this day.
reading.RahuSeason.1=In the middle month of spring Rāhu seeks food on this day.
reading.RahuSeason.2=In the last month of spring Rāhu seeks food on this day.
reading.RahuSeason.3=In the first month of summer Rāhu seeks food on this day.
reading.RahuSeason.4=In the middle month of summer Rāhu seeks food on this day.
reading.RahuSeason.5=In the last month of summer Rāhu seeks food on this day.
reading.RahuSeason.6=In the first month of autumn Rāhu seeks food on this day.
reading.RahuSeason.7=In the middle month of autumn Rāhu seeks food on this day.
reading.RahuSeason.8=In the last month of autumn Rāhu seeks food on this day.
reading.RahuSeason.9=In the first month of winter Rāhu seeks food on this day.
reading.RahuSeason.10=In the middle month of winter Rāhu seeks food on this day.
