reading.LunarDate.5.livestock=купленный сегодня, умножается
reading.LunarDate.6=Шестое число месяца — благой день, день радости (དགའ་བ, dga' ba): умиротворяющие обряды, ремёсла, игры и всякое светлое дело идут в этот день хорошо.
reading.LunarDate.6.also_called=Нанда
reading.LunarDate.6.la=ла, жизненный дух (བླ, bla), пребывает в бороздке бедра; у лошадей и другого скота — во впадине тазобедренного сустава; там не делают кровопускания, прижигания и иного лечения
