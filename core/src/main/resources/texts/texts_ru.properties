reading.LunarDate.24.illness=болезнь глаз, боль в почках и пояснице, поднимается ветер сердца; вредят защитники храма и духи гьялпо (རྒྱལ་པོ, rgyal po); отошлите крест гьялпо (རྒྱལ་མདོས, rgyal mdos)
reading.LunarDate.25.illness=отвечает на осквернённый очаг, срубленные деревья и поездки рано и поздно; вредят дрэмо (གྲེ་མོ, gre mo) и наги (ཀླུ, klu) вместе с духами цен (བཙན, btsan); боль в верхней части тела, болезнь глаз и пустота внутри; названный обряд — крест цен (བཙན་མདོས, btsan mdos)
reading.LunarDate.26.illness=отвечает на обиду, пищу умерших и нечистоту; вредят боги (ལྷ, lha), грэцен (གྲེ་བཙན, gre btsan) и владыки земли (ས་བདག, sa bdag); неладно с желудком и печенью, колющие боли, опухоли и шишки; почитайте ма-мо (མ་མོ, ma mo) и совершите обряды восполнения и покаяния (བསྐང་བཤགས, bskang bshags)
reading.LunarDate.27.illness=отвечает на очаг, который трогали и жгли; вредят боги (ལྷ, lha), духи гьялпо (རྒྱལ་པོ, rgyal po) и дрэво (གྲེ་བོ, gre bo); слабость, болезнь внутри, боль в почках и сухость во рту; совершите подношение санг (བསང, bsang), омовение и подношение воды и отошлите крест гьялпо (རྒྱལ་མདོས, rgyal mdos)
reading.LunarDate.28.illness=отвечает на клятву, дом траура и испорченный очаг; вредят гьенгонг (རྒྱལ་འགོང, rgyal 'gong), умершие и владыки земли (ས་བདག, sa bdag); отошлите крест гьялпо (རྒྱལ་མདོས, rgyal mdos) и крест для планет
reading.LunarDate.29.illness=отвечает на пищу из дома траура; грудь и спина горячи, горло сухо; вредят демоницы, демоны страсти и владыки земли (ས་བདག, sa bdag); совершите омовение и отошлите нитяной крест (མདོས, mdos) для ньен (གཉན, gnyan) и крест для владык земли
reading.LunarDate.30.illness=отвечает на поездку; вредят грэцен (གྲེ་བཙན, gre btsan), проклятия и защитники; колющая боль в лёгких, безумие и обмороки, рвота и жар; отошлите нитяные кресты (མདོས, mdos) цен и толпы и почитайте бога войны; сегодня один из четырёх опасных дней, когда плохо заболеть, собираться вместе и браться за большое или грозное дело
reading.Weekday.SUNDAY.illness=вредят демоны (བདུད, bdud), духи цен (བཙན, btsan) и дрэво (གྲེ་བོ, gre bo), пришедшие следом за чем-то белым; отошлите нитяные кресты (མདོས, mdos) цен и демонов, совершите подношения восьми нагам (ཀླུ, klu) и подношение воды, накормите столько детей, сколько лет больному, и в сумерках отошлите выкуп (གླུད, glud), завёрнутый в благоуханное исподнее
reading.Weekday.MONDAY.illness=вредят наги-людоеды и духи умерших, пришедшие следом из дома траура; лечат подношением воды и нитяным крестом ма-мо (མ་མོ, ma mo); налейте в овечий желудок и чашу с водой по мере на каждый год больного, с фигурками рыб и змей и выкупом (གླུད, glud), и в сумерках отошлите туда, где сходятся воды
reading.Weekday.TUESDAY.illness=болезнь от красного, мяса и крови, и от убоя; вредят духи цен (བཙན, btsan) и дрэво (གྲེ་བོ, gre bo), пришедшие за красным осквернённого очага, нечистоты и дурного направления; обряды дхарани, подношения богам и обряд цен
reading.Weekday.WEDNESDAY.illness=болезнь от проклятия монаха или бонпо (བོན་པོ, bon po) или от нагов (ཀླུ, klu), пришедших следом за сыном или сестрой; хороши очищение от скверны и обряд нагам
reading.Weekday.THURSDAY.illness=вредят наги-людоеды и духи гьялпо (རྒྱལ་པོ, rgyal po), пришедшие следом за ночной поездкой; помогают нитяной крест с зор (ཟོར, zor) и подношения восьми нагам (ཀླུ, klu)
reading.Weekday.FRIDAY.illness=вредят духи гьялпо (རྒྱལ་པོ, rgyal po) и цен (བཙན, btsan), пришедшие следом за торговлей; чтение писаний, окуривание и очищение и обряд цен
reading.Weekday.SATURDAY.illness=вредят воинство Ямы (གཤིན་རྗེ, gshin rje), владыки земли (ས་བདག, sa bdag), теуранг (ཐེའུ་བྲང, the'u brang) и ма-мо (མ་མོ, ma mo); отвечает на нарушенный сезонный обряд, ношу и подношение дыма (གསུར, gsur); читайте дхарани и умилостивьте восемь нагов (ཀླུ, klu) и владык земли
reading.TwelveLinks.IGNORANCE.illness=если не смертельна в полмесяца, выздоровление через три дня после; будьте очень осторожны
reading.TwelveLinks.FORMATION.illness=если не смертельна в семь дней, жизнь возвращается через три дня после
reading.TwelveLinks.CONSCIOUSNESS.illness=если не смертельна на третий или пятый день, жизнь возвращается на седьмой или восьмой
reading.TwelveLinks.NAME_AND_FORM.illness=если не смертельна на третий или пятый день, освобождение после седьмого; после восьмого выздоровления нет
reading.TwelveLinks.SOURCES.illness=поражает на третий или четвёртый день; если не смертельна, жизнь возвращается на десятый
reading.TwelveLinks.CONTACT.illness=если не смертельна в три дня, жизнь возвращается с восьмого, и надолго
reading.TwelveLinks.FEELING.illness=если не смертельна в пять дней, на девятый человек встаёт, на десятый выздоравливает
reading.TwelveLinks.CRAVING.illness=если не смертельна на восьмой день, жизнь возвращается на десятый; если к тому времени нет выздоровления, смерть
reading.TwelveLinks.GRASPING.illness=если не смертельна в восемь дней, выздоровление на десятый, и жизнь, если вскоре не последует смерть
reading.TwelveLinks.BECOMING.illness=если не смертельна на третий или девятый день, выздоровление
reading.TwelveLinks.BIRTH.illness=если не смертельна в пять дней, выздоровление на восьмой
reading.TwelveLinks.AGEING_AND_DEATH.illness=если не смертельна на третий или седьмой день, от неё освобождает отвар
