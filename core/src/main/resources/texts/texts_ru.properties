reading.LunarDate.8.la=ла, жизненный дух (བླ, bla), пребывает над почками; у лошадей и другого скота — в почечной впадине; там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.8.birth=ребёнка трудно вырастить
reading.LunarDate.9=Девятое число месяца — пустой день (སྟོང་པ, stong pa), не из благих: в целом всякое дело, за которое берутся в этот день, идёт плохо.
