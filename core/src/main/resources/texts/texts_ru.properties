# Zanshin Calendar — text of the engines and readings (SPEC §8.2), Russian.
# A translation of texts.properties: the same keys and placeholders
# (CatalogTest). Readings are summaries of their cited sources, translated
# from the English and checked against the source (ROADMAP L3). Terms of the
# elemental divination follow Alexander Berzin, «Особенности тибетской
# астрологии», parts 3 and 4 (Study Buddhism): стихии, мать, ребёнок, друг,
# враг, жизненная сила, тело, могущество, конь ветра, камни.

