reading.LunarDate.24=Пустой день (སྟོང་པ, stong pa), Рикта, неблагой: всякое дело названо дурным. Средство — по обряду поднять в воздух пустой сосуд, прочесть «Поток богатства» (ནོར་རྒྱུན, nor rgyun) и закрепить залог богатства. Мальчик, рождённый сегодня, — к худу для матери; следом рождаются девочки. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: бороздка бедра; у лошадей и другого скота — лоб; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.25=Полный день (རྫོགས་པ, rdzogs pa), Пурна: в целом плох для дел, но хорош для постройки крепости и сокрытия клада. Средство — обряды, умножающие славу, и чтение «Груды благополучия» (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa). Мальчик, рождённый сегодня, будет богат; девочка умирает или живёт одна. Купленный сегодня скот умножается. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: подколенная ямка; у лошадей и другого скота — грудь и шея (བྲང་སྐེ, brang ske); там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.26=День радости (དགའ་བ, dga' ba), Нанда, один из благих дней: хорош для умиротворяющих обрядов, ремёсел, игр и всякого светлого дела. За девочкой, рождённой сегодня, следуют девочки. Смерть сегодня — к худу. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: над коленом; у лошадей и другого скота — горловая впадина (ཨོལ་སྟོང, ol stong); там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.27=Превосходный день (བཟང་པོ, bzang po), Бхадра, один из благих дней: хорош для поиска друзей и для сева. Мальчик, рождённый сегодня, наделён острым умом; девочке плохо, она уходит вслед за мужем. Смерть сегодня — к добру. Покупка скота — средне. Избегать также постройки дамб (ཤྭ་རགས, shwa rags) от внезапных паводков. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: икра; у лошадей и другого скота — половые органы; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.28=Победоносный день (རྒྱལ་བ, rgyal ba), Джая, один из благих дней: хорош для войны, набегов, нападения на врагов, обрядов нитяного креста (མདོས, mdos), тормы (གཏོར་མ, gtor ma) и иных гневных обрядов. Рождённого сегодня трудно вырастить. Смерть сегодня — к худу. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: голеностопный сустав; у лошадей и другого скота — мошонка (སྒྲོ་བ, sgro ba); там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.29=Пустой день (སྟོང་པ, stong pa), Рикта, неблагой: всякое дело названо дурным. Средство — по обряду поднять в воздух пустой сосуд, прочесть «Поток богатства» (ནོར་རྒྱུན, nor rgyun) и закрепить залог богатства. Рождённый сегодня приносит несчастье. Хорошим названо также насылание молнии и града (ཐོག་སེར, thog ser), гневный обряд, которое в издании напечатано как «жёлтая верёвка» (ཐག་སེར, thag ser). Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: голень; у лошадей и другого скота — носовые ходы; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.30=Полный день (རྫོགས་པ, rdzogs pa), Пурна: в целом плох для дел, но хорош для постройки крепости и сокрытия клада. Средство — обряды, умножающие славу, и чтение «Груды благополучия» (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa). Рождённый сегодня будет беден. Один из четырёх опасных дней месяца: наги в смятении собираются под началом своего царя Мадрё (མ་དྲོས, ma dros). Заболеть сегодня опасно; большие сборища и всё великое и сильное плохо. Ла, жизненный дух (བླ, bla), сегодня пронизывает всё тело, у лошадей и другого скота тоже; там не делают кровопускания, прижигания и иного лечения.

# Readings: weekdays (the White Beryl, pp. 308–312)
reading.Weekday.SUNDAY=Солнце: день недели ла (བླ་གཟའ, bla gza') царей, царской касты; мирное, бледно-красное, стихии огня. Сильно в убывающую половину месяца, днём и во Льве. Выход в путь в целом плох, прежде всего на юг, на север и в промежуточные стороны. Мальчик, рождённый сегодня, если переживёт семь дней и семь месяцев, живёт долго и любим великими; девочка будет богата, но за ней следуют девочки, и потому некоторые считают её рождение дурным. Смерть сегодня повторяется девять или семь раз. Даже когда Солнце сильно, похорон в этот день не устраивают: это дверь неба. Заключительный стих главы ставит Солнце вместе с Марсом и Сатурном среди дней, когда избегают добродетельных дел.
reading.Weekday.MONDAY=Луна: день недели ла (བླ་གཟའ, bla gza') женщин и нагов, знатной касты; мирная, бело-жёлтая, стихии воды. Сильна в Раке и ночью. Выход в путь в целом плох, прежде всего на юго-запад. Мальчик, рождённый сегодня, будет богат и очень силён; девочка — красива и приятна. Смерть сегодня не повторяется. Даже когда Луна сильна, огненного подношения (ཧོམ, hom) в этот день не сжигают: это дверь нагов.
reading.Weekday.TUESDAY=Марс, называемый Благополучным (བཀྲ་ཤིས, bkra shis): день недели ла (བླ་གཟའ, bla gza') асуров и военачальников, царской касты; гневный, красно-чёрный, стихии огня. Силён в Овне и Скорпионе. Выход в путь в целом плох, очень плох на юг, на север и в промежуточные стороны; умиротворяющие, умножающие и прочие светлые дела большей частью дурны. Мальчика, рождённого сегодня, трудно вырастить, он склонен ко злу, сеет раздор, горд и гневлив; девочка умирает рано. Смерть сегодня повторяется трижды. Добродетельных дел в этот день избегают.
reading.Weekday.WEDNESDAY=Меркурий: якша, бесполая планета, день недели ла (བླ་གཟའ, bla gza') царей, касты простолюдинов; мирный, сине-зелёный, стихии воды. Силён в начале растущей и в конце убывающей половины месяца, в Близнецах и Деве; обряды умножения особенно благоприятны. Выход в путь в целом хорош, но плох на восток, на север и в промежуточные стороны. Мальчик, рождённый сегодня, дурен, суров к матери и болезнен; девочка разоряет родителей, но сама имеет пищу, богатство и власть. Смерть сегодня дурна пятикратно, а узник не выходит на свободу. Некоторые запрещают в этот день погребение, и даже когда Меркурий силён, могил не роют: он пресекает род.
reading.Weekday.THURSDAY=Юпитер: день недели ла (བླ་གཟའ, bla gza') лам, бодхисаттв, министров и монахов, касты брахманов; смешанный, мирный и гневный, жёлтый, стихии ветра. Силён в Рыбах и Стрельце. Выход в путь в целом хорош; избегать запада. Мальчик, рождённый сегодня, некрасив лицом, но ясного ума, учён и практикует дхарму; девочка живёт долго и имеет добрых друзей. Смерть сегодня лишь немного дурна для оставшихся. Погребальные обряды дурны, но поминальный пир хорош. Даже когда Юпитер силён, зор (ཟོར, zor) в этот день не мечут: это планета похорон.
reading.Weekday.FRIDAY=Венера: день недели ла (བླ་གཟའ, bla gza') царей, министров и женщин, касты брахманов; мирная, многоцветная, стихии земли. Сильна в убывающую половину месяца, в Тельце и Весах; обряды власти удаются. Выход в путь в целом хорош, но плох на юг, на север и на запад. Мальчик, рождённый сегодня, живёт долго, остёр умом и богат; девочка болезненна, но велика славой. Смерть сегодня повторяется семь раз. Некоторые запрещают в этот день сжигать огненные подношения (ཧོམ, hom), и даже когда Венера сильна, скот из дома не отправляют: это планета скота.
reading.Weekday.SATURDAY=Сатурн: бедный, бесполый, слуга, день недели ла (བླ་གཟའ, bla gza') детей, касты чандалов; гневный, серо-жёлтый, стихии земли. Силён ночью, в убывающую половину месяца, в Козероге и Водолее; убийство удаётся. Выход в путь в целом плох, прежде всего в промежуточные стороны, на восток и на запад. Рождённый сегодня красив, но мало заслуг; мальчик — средне, девочка недолговечна. Смерть сегодня не повторяется; узник теряет всё имущество. Добродетельных дел в этот день избегают, и даже когда Сатурн силён, богатства не отдают: это планета земли.
reading.Trigram.LI=День Омбарма (འོད་འབར་མ, 'od 'bar ma), первой из восьми богинь, которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) отсчитывает по месяцу; её день — день триграммы огня (ལི, li). Болезнь, начавшаяся сегодня, возводится к тому, что разрыли или разрушили очаг, рубили деревья, ходили в сумерках или до рассвета, работали на водных каналах; вредят наги (ཀླུ, klu), духи цен (བཙན, btsan), дрэво (གྲེ་བོ, gre bo) и дрэмо (གྲེ་མོ, gre mo). Она проявляется вздутием живота и колющими болями в верхней части тела. Названные обряды — бонгра (བོང་ར, bong ra), нитяной крест цен (བཙན་མདོས, btsan mdos) и изгнание «водяного клинка» (ཆུ་གྲི, chu gri).
reading.Trigram.KHON=День Тэнма (བསྟན་མ, bstan ma), одной из восьми богинь, которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) отсчитывает по месяцу; её день — день триграммы земли (ཁོན, khon). Болезнь, начавшаяся сегодня, возводится к посещению нечистого места или места ссоры; вредят боги (ལྷ, lha), «цен ножа» (གྲི་བཙན, gri btsan) и владыки земли (ས་བདག, sa bdag). Нездоровы желудок и печень, бывают колющие боли, опухоли и высыпания (ཤུ་ཐོར, shu thor). Названные обряды — воскурения, покаяние, нитяной крест цен (བཙན་མདོས, btsan mdos) и шонгье (གཞོང་རྒྱས, gzhong rgyas).
reading.Trigram.DWA=День Карсэлма (དཀར་གསལ་མ, dkar gsal ma), одной из восьми богинь, которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) отсчитывает по месяцу; её день — день триграммы озера (དྭ, dwa). Болезнь, начавшаяся сегодня, возводится к тому, что на очаге варили или жгли мясо и кровь; вредят боги (ལྷ, lha), духи гьялпо (རྒྱལ་པོ, rgyal po) и дрэво (གྲེ་བོ, gre bo). Она проявляется истощением, вздутием живота и болезнью почек. Названные обряды — покаяние, омовение, водные торма (གཏོར་མ, gtor ma) и нитяной крест гьялпо (རྒྱལ་མདོས, rgyal mdos).
reading.Trigram.KHEN=День Дангдэнма (མདངས་ལྡན་མ, mdangs ldan ma), одной из восьми богинь, которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) отсчитывает по месяцу; её день — день триграммы неба (ཁེན, khen). Болезнь, начавшаяся сегодня, возводится к чистой и нечистой пище; вредят намтэ (གནམ་ཐེ, gnam the), владыки земли (ས་བདག, sa bdag), серак (བསེ་རག, bse rag), гьенгонг (རྒྱལ་འགོང, rgyal 'gong) и духи умерших. Она проявляется болью в боку, поносом, недугами лёгких, сердца и суставов. Названные обряды — выкуп (གླུད, glud) и водные торма (གཏོར་མ, gtor ma).
reading.Trigram.KHAM=День Чамбэбма (ཆར་འབེབས་མ, char 'bebs ma), одной из восьми богинь, которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) отсчитывает по месяцу; её день — день триграммы воды (ཁམ, kham). Болезнь, начавшаяся сегодня, возводится к пиву и пище из дома вдовы; вредят духи мо (མོ, mo), ньен (གཉན, gnyan) и водные дрэ (གྲེ, gre). Она проявляется колющими болями спереди и сзади, сухостью во рту, болезнью холода, водянкой, поносом и рвотой. Названные обряды — синий нитяной крест (མདོས, mdos) и девятичастный обряд против сасин (ས་སྲིན, sa srin).
reading.Trigram.GIN=День Йомэма (གཡོ་མེད་མ, g.yo med ma), одной из восьми богинь, которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) отсчитывает по месяцу; её день — день триграммы горы (གིན, gin). Болезнь, начавшаяся сегодня, возводится к блужданию по пустым долинам в бурю; вредят духи дриб-цен (གྲིབ་བཙན, grib btsan) и джетётонг (བརྗེ་ཐོད་གཏོང, brje thod gtong). Она проявляется заразной горячкой, изнеможением и безумием. Названные обряды — нитяной крест (མདོས, mdos) против заразы и обряды восполнения и покаяния (བསྐང་བཤགས, bskang bshags).
reading.Trigram.ZIN=День Ончангма (འོད་འཆང་མ, 'od 'chang ma), одной из восьми богинь, которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) отсчитывает по месяцу; её день — день триграммы грома (ཟིན, zin). Болезнь, начавшаяся сегодня, возводится к пище с неблагоприятной стороны и к мясу и крови; вредят владыки земли (ས་བདག, sa bdag), наги (ཀླུ, klu), ньен (གཉན, gnyan) и дрэмо (གྲེ་མོ, gre mo). Она проявляется колющими болями в печени и рёбрах, болезнью желудка и опухолями. Названные обряды — обряд нагов и изгнание дрэмо.
reading.Trigram.ZON=День Кьобджема (སྐྱོབ་བྱེད་མ, skyob byed ma), последней из восьми богинь, которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) отсчитывает по месяцу; её день — день триграммы ветра (ཟོན, zon). Болезнь, начавшаяся сегодня, возводится к имуществу храма или буддийских и бонских (བོན, bon) священников; вредят Пехар (པེ་ཧར, pe har), кордаг (དཀོར་བདག, dkor bdag) и вредоносные духи умерших, нарушивших обеты (དམ་སྲི, dam sri). Она проявляется болью в почках и пояснице, болезнью глаз, ветром сердца и изнеможением. Названные обряды — нитяной крест гьялпо (རྒྱལ་མདོས, rgyal mdos), обряды восполнения и покаяния (བསྐང་བཤགས, bskang bshags) и изгнание нарушивших обеты.
reading.GreatCombination.KUN_DGA=Обретается богатство. Растут жизнь, блеск и величие, пылают слава, достаток и заслуги, дела и замыслы удаются.
reading.GreatCombination.DUS_DBYIG=Великий страх. Меркнет сияние неба и вянут цветы, сохнут деревья и воды; приходит грозный враг, бывают убийства.
reading.GreatCombination.DUL=Много богатства. Желания исполняются, с покоем, долгой жизнью и счастьем.
reading.GreatCombination.SKYE_DGU=Счастье через женщин. Желанное дело удаётся, удача в людях и богатстве.
reading.GreatCombination.GZHON=Всякое начинание удаётся; враг повержен, битва выиграна.
reading.GreatCombination.BYA_ROG=Ссоры, страх и голод. Блеск жизни меркнет, еда и питьё не питают, радость оборачивается страданием.
reading.GreatCombination.RGYAL_MTSHAN=Изобилие богатства и одежд, блеск, слава и удача.
reading.GreatCombination.DPAL_BEU=Собираются драгоценности; власть, сыновья и слава, растущая до конца.
reading.GreatCombination.RDO_RJE=Страх молнии и града. Самому неспокойно, другие разоряются; враги, воры и поветрия несут страх.
reading.GreatCombination.THO_BA=Страх смерти. Ненависть обрывает жизнь; плач и раздоры, вред четвероногим.
reading.GreatCombination.GDUGS=Враги побеждены; сила и мощь одолевают ненависть и раздоры.
reading.GreatCombination.GROGS=Встреча с друзьями; слава, доброта и желанные цели достигаются.
reading.GreatCombination.YID=Обретается слава, с драгоценностями, властью и добрым путём; цели удаются.
reading.GreatCombination.DOD=Дела идут по желанию; сбывается даже задуманное.
reading.GreatCombination.MGAL_ME=Драки и раздоры; страх, сплетни и ссоры с родными.
reading.GreatCombination.RTSA_BTON=Жизнь иссякает; удача и замыслы рушатся, богатство дхармы, посвящения и освящения не удаются.
reading.GreatCombination.CHI_BDAG=Приходит смерть; враги и воры, путь в места и дороги страха.
reading.GreatCombination.MDA=Слабеют нос и члены; блеск меркнет, жизнь обрывается, дела и удача приходят в упадок.
reading.GreatCombination.GRUB=Начатое дело удаётся; добрые слова и имущество, радость, мудрость и отвага.
reading.GreatCombination.MDUNG=Страх болезни.
reading.GreatCombination.BDUD_RTSI=Враги разорены. Большей частью приятен и лучше всего для лечения; враги иссякают, обретаются слава и богатство.
reading.GreatCombination.GTUN_SHING=Понимай как толчение: иссякают жизнь, богатство и боги, кончается удача, разбиваются головы.
reading.GreatCombination.GLANG_PO=Всякая цель удаётся; приходить, уходить и отдыхать легко, есть и слава.
reading.GreatCombination.RTAG_MYOS=Обретается верховое животное; долгая жизнь и счастье, добрые дела удаются, с верховыми животными, людьми и богатством.
reading.GreatCombination.ZAD_PA=Иссякают богатство и люди; тратятся жизнь, сила, еда и имущество, плоды дел и заслуг.
reading.GreatCombination.GYO=Удаются дела царя; становишься господином людей, удаются и грозные дела.
reading.GreatCombination.BRTAN=Власть рушится; враг побеждает, для свиты дурное предзнаменование.
reading.GreatCombination.PHEL=Богатство растёт; растут ум и мудрость, блеск и величие.
reading.CombinationDay.GRUB_SBYOR=Сочетание свершения, которое «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) называет также сочетанием нектара: всякое начатое в этот день дело выходит хорошо.
reading.CombinationDay.ZUNG_SBYOR=Парное сочетание: как и сочетание свершения, в этот день добродетельны все дела умиротворения, приумножения и подчинения, кроме его собственных исключений и вредных грозных дел. Кроме четверга, оно приходится на те же день недели и созвездие, что и день полного запрета, и текст говорит, что тогда важно, что принять и чего избегать.
reading.CombinationDay.BDUD_RGYAL=Царь демонов: хорош для подношений богам войны, для погребения и подавления врагов и нападения на них; грубые, грозные дела удаются.
reading.CombinationDay.GRUB_NYI=Один из семи дней свершения: удаётся всякое важное дело, добродетельное и доброе; вредных, греховных дел избегают. Если он совпадает с царём демонов, хорош для нападения.
reading.CombinationDay.BKRA_SHIS_NYI=Благоприятный день: счастье; хорош для посвящения, освящения, подношений божествам и добродетельных дел.
reading.CombinationDay.PHEL_NYI=Один из семи дней возрастания: хорош для добродетельных дел, учения письму, астрологии и искусствам, проведения воды, рытья колодцев, полевых работ и сева.
reading.CombinationDay.CHUB_NYI=День исполнения, как парное сочетание: почти все добрые дела хороши.
reading.CombinationDay.MTHUN_NYI=День согласия: хорош для улаживания ссор, заключения союзов и полезных дел.
reading.CombinationDay.SBYOR_NYI=Один из семи дней соединения: хорош для подношений божествам, сватовства, зрелищ, добродетельных дел и дел приумножения; вредные, разрушительные дела плохи.
reading.CombinationDay.BDUD_NYI=Один из семи дней демона, каждый назван по делу, которому вредит (подношения богам в воскресенье, царицы в понедельник, военачальники во вторник, мера зерна в среду, священники в четверг, знать в пятницу, торговцы лошадьми в субботу), с обрядом его подавления. Собственное дело дня и все дела власть имущих плохи; взятие невесты плохо для свёкра и мужа, похороны — для семьи умершего, день плох для невесток и главы дома; в путь не выходят. Чёрная магия удаётся.
reading.CombinationDay.CHI_SBYOR=Сочетание смерти, которое стих изображает как удар планеты по её созвездию (Солнце сжигает пальцы, Луна подавляет Плеяды …): строительства, освящения, обрядов долгой жизни, отправки или взятия невесты, выхода в путь и перемещения больных большей частью избегают.
reading.CombinationDay.MI_PHROD_NYI=День несовместимости: хорош для подчинения врагов и внесения раздора; взятие невесты плохо для свекрови, похороны — для братьев и сестёр невесты; лекарств и дел, творящих согласие, избегают.
reading.CombinationDay.MI_MTHUN_NYI=День разлада: хорош для разлучения и вредных дел; брак плох для себя, отца и свекрови, похороны — для молодых мужчин; большинство добрых дел плохи.
reading.CombinationDay.JIG_NYI=День разрушения: плох для невесты, родни и лошадей; похороны плохи для домочадцев и племянников; в путь не выходят. Годится для вредных дел.
reading.CombinationDay.GTAN_SPANG=День полного запрета, называемый также сочетанием сожжения: всех важных дел избегают, а также кровопускания и прижиганий. Кроме четверга, он приходится на те же день недели и созвездие, что и парное сочетание.
reading.BurningDate=Дата сожжения: день недели встречается с одной из двух своих дат, по одной в каждой половине месяца (воскресенье — 12-е и 27-е, понедельник — 11-е и 26-е, вторник — 10-е и 25-е, среда — 3-е и 18-е, четверг — 6-е и 21-е, пятница — 2-е и 17-е, суббота — 7-е и 22-е). Кровопускание, прижигание и добродетельные дела не удаются, и от них сразу отказываются; кремация плоха, но гневные дела удаются. Всё сделанное тогда остаётся без плода: от сожжённого шёлка остаётся лишь пепел. Как средство текст называет поднятие большого флага цвета планеты дня и сжигаемое подношение белого масла. Глава «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) о делах по отдельности относит её к временам, которых избегают для кровопускания и прижигания, похорон, установки опор и храмов и достижения здоровья и богатства.
reading.GreatBlackDay={0} Великий чёрный день (ཉི་མ་ནག་ཆེན, nyi ma nag chen) — первый из владык земли (ས་བདག, sa bdag), которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) ведёт по датам, по одной дате в каждом месяце: весной 7-е, 14-е и 21-е, летом 8-е, 16-е и 24-е, осенью 9-е, 18-е и 27-е, зимой 10-е, 20-е и 30-е; времена года считаются так, как их считает его глава о владыках земли, весна с 11-го месяца. В этот день дурны дела ради умерших и ради живых, прежде всего вынос богатства из дома, посвящение и освящение, взятие невесты, строительство, погребение и торговля; добродетельных дел не совершают, а вредоносные средства идут с ним в лад. Текст называет важным его избегать. Как средства он называет копьё, поставленное со стороны восхода солнца, с привязанными к нему чёрным хвостом яка, пятью видами дерева, белым шёлковым шарфом и шерстью чёрной собаки; а там, где осквернили чёрный месяц или чёрный день, — поднятые белый шёлк и белую ткань и белое подношение дыма (གསུར, gsur), водную торму (ཆུ་གཏོར, chu gtor) и чтение «Собрания дхарани» (གཟུངས་བསྡུས, gzungs bsdus); или вещества против дурных пересудов, вылитые на перекрёстке трёх дорог, после чего уходят, не оглядываясь.
reading.GreatBlackDay.0=В первый месяц весны, 7-го: Раху, обходящий гору Меру (རི་རབ, ri rab) направо, встречает свою младшую сестру Бамсинг (བམ་སྲིང, bam sring), которая обходит её налево, и она осквернена. Это называют встречей девяти дурных (ངན་པ་དགུ་འཛོམ, ngan pa dgu 'dzom): нижний и верхний ветры меняются местами, ровный ветер и пять стихий в смятении, и солнце восходит, как сильный яд. Девять можно перечислить как девять видов, но по сути «девять» — слово для множества, и имя означает худшее из дурного.
reading.GreatBlackDay.1=В средний месяц весны, 14-го: время возникновения.
reading.GreatBlackDay.2=В последний месяц весны, 21-го: время прорыва.
reading.GreatBlackDay.3=В первый месяц лета, 8-го: осквернена сестра Раху Таксинг (སྟག་སྲིང, stag sring).
reading.GreatBlackDay.4=В средний месяц лета, 16-го: возникает чрево крови.
reading.GreatBlackDay.5=В последний месяц лета, 24-го: чрево прорывается.
reading.GreatBlackDay.6=В первый месяц осени, 9-го: осквернена сестра Раху Конгсинг (ཀོང་སྲིང, kong sring).
reading.GreatBlackDay.7=В средний месяц осени, 18-го: возникает чрево железа.
reading.GreatBlackDay.8=В последний месяц осени, 27-го: чрево прорывается.
reading.GreatBlackDay.9=В первый месяц зимы, 10-го: осквернена сестра Раху Бамсинг (བམ་སྲིང, bam sring).
reading.GreatBlackDay.10=В средний месяц зимы, 20-го: возникает чрево воды.
reading.GreatBlackDay.11=В последний месяц зимы, 30-го: прорывается немой.
reading.GtsugLagDay.GRUB_NYI=День свершения по счёту «Ваджрного трактата» (རྡོ་རྗེ་གཙུག་ལག, rdo rje gtsug lag), который «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) приводит после своей таблицы: те же названия, но другие созвездия. Этот текст отводит такой день приближению и свершению — затворнической практике божества. Собственное чтение дня в «Белом берилле»: {0}
reading.GtsugLagDay.BDUD_NYI=День демона по счёту «Ваджрного трактата» (རྡོ་རྗེ་གཙུག་ལག, rdo rje gtsug lag), который «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) приводит после своей таблицы: те же названия, но другие созвездия. Этот текст считает каждый день демона против дела, которому тот вредит. Собственное чтение дня в «Белом берилле»: {0}
reading.GtsugLagDay.MI_PHROD_NYI=День несовместимости по счёту «Ваджрного трактата» (རྡོ་རྗེ་གཙུག་ལག, rdo rje gtsug lag), который «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) приводит после своей таблицы: те же названия, но другие созвездия. Этот текст называет день дурным знамением. Собственное чтение дня в «Белом берилле»: {0}
reading.GtsugLagDay.MI_MTHUN_NYI=День разлада по счёту «Ваджрного трактата» (རྡོ་རྗེ་གཙུག་ལག, rdo rje gtsug lag), который «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) приводит после своей таблицы: те же названия, но другие созвездия. Собственное чтение дня в «Белом берилле»: {0}
reading.GtsugLagDay.JIG_NYI=День разрушения по счёту «Ваджрного трактата» (རྡོ་རྗེ་གཙུག་ལག, rdo rje gtsug lag), который «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) приводит после своей таблицы: те же названия, но другие созвездия. Собственное чтение дня в «Белом берилле»: {0}
reading.Rahu={0} За каждый день он тоже обходит стороны: при первом солнце с востока на северо-запад, в утреннем тепле с северо-запада на юг, в полдень с юга на северо-восток, под вечер с северо-востока на запад, на закате с запада на юго-восток, в сумерках с юго-востока на север, в полночь с севера на юго-запад, а от рассвета до утра с юго-запада на восток. Грозные дела совершают по его ходу, и ничто не должно обращаться к нему лицом.
reading.DusSbyor={0} «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) ставит период сочетания выше всех факторов дня: все их дела завершаются в его доме.
reading.DusSbyor.ARIES=Восходит Овен: период, которого избегают. Он несёт споры и потерю богатства, его сторонятся все; спорятся недобрые дела, и удаются лишь война и грозные дела.
reading.DusSbyor.TAURUS=Восходит Телец: период, который используют. Находят богатство и славу, удачу и доброе имя, приходят подношения и услуги.
reading.DusSbyor.GEMINI=Восходят Близнецы: хороший период. Сбываются желания и приходит слава, находятся друзья, а прибыль приходит даже нежданно.
reading.DusSbyor.CANCER=Восходит Рак: период, которого избегают. Богатство и прибыль непременно убывают, портится всё, к чему лишь прикоснёшься, велики страсти, споры и страх.
reading.DusSbyor.LEO=Восходит Лев: период, который используют. Вредоносные духи слабеют и путь спокоен; ни в каком деле нет страха, и цари оказывают почёт.
reading.DusSbyor.VIRGO=Восходит Дева: период, который используют. Желания исполняются как задумано, с удачей и достатком.
reading.DusSbyor.LIBRA=Восходят Весы: период, которого избегают. Замыслы встречают препятствия, среди друзей приходит горе, а прибыль даётся трудно.
reading.DusSbyor.SCORPIO=Восходит Скорпион: период, которого избегают. Путь встречает большие опасности, богатство убывает, на душе уныло.
reading.DusSbyor.SAGITTARIUS=Восходит Стрелец: период, который используют. Уход и возвращение надёжны, человек храбр, цели достигаются, враги слабеют, а споры выигрываются.
reading.DusSbyor.CAPRICORN=Восходит Козерог: период, которого избегают. Возникают драки и споры, сильные страсти и вред от планет.
reading.DusSbyor.AQUARIUS=Восходит Водолей: период, который используют. Обретаются слава и власть, позже приходит богатство, и всякая нужда восполняется.
reading.DusSbyor.PISCES=Восходят Рыбы: период, который используют. Слава приходит, где она нужна, всякое дело удаётся, и достигаются самые трудные цели.
reading.WorksSign=«Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) в главе о делах по отдельности называет восход этого знака благоприятным или неблагоприятным для этих дел. Для каждого это собственный час дела, его частный случай, который стоит выше общего чтения периода для этого дела.
reading.RahuMonth={0} В этот день хороши любые грозные дела.
reading.RahuMonth.earlySpring.6=В первый месяц весны Раху движется, как посланец, поворачивающий голову; 6-го он в своём глазу.
reading.RahuMonth.earlySpring.9=В первый месяц весны Раху движется, как посланец, поворачивающий голову; 9-го он в своём правом плече.
reading.RahuMonth.earlySpring.11=В первый месяц весны Раху движется, как посланец, поворачивающий голову; 11-го он в своём левом плече.
reading.RahuMonth.earlySpring.13=В первый месяц весны Раху движется, как посланец, поворачивающий голову; 13-го он в своём сердце.
reading.RahuMonth.midSpring.16=В средний месяц весны Раху движется, как посланец, поворачивающий голову; 16-го он в своём глазу.
reading.RahuMonth.midSpring.9=В средний месяц весны Раху движется, как посланец, поворачивающий голову; 9-го он в своей голове.
reading.RahuMonth.midSpring.11=В средний месяц весны Раху движется, как посланец, поворачивающий голову; 11-го он в своём сердце.
reading.RahuMonth.midSpring.13=В средний месяц весны Раху движется, как посланец, поворачивающий голову; 13-го он в своём левом плече.
reading.RahuMonth.midSpring.19=В средний месяц весны Раху движется, как посланец, поворачивающий голову; 19-го он в своём правом плече.
reading.RahuMonth.autumn.15=В три месяца осени, в полдень 15-го, Раху принимает облик ма-мо (མ་མོ, ma mo) Битипатры и движется с северо-востока на юго-запад.
reading.RahuMonth.autumn.11=В три месяца осени, в полночь 11-го, Раху принимает облик духа ман (སྨན, sman) и движется с юга на север.
reading.RahuMonth.autumn.8=В три месяца осени, на рассвете 8-го, Раху принимает облик демона дуд (བདུད, bdud) и движется с юго-запада на северо-восток.
reading.RahuMonth.autumn.4=В три месяца осени, с наступлением ночи 4-го, Раху принимает облик духа ньен (གཉན, gnyan) и движется с северо-запада на юго-восток.
reading.RahuMonth.autumn.22=В три месяца осени, под вечер 22-го, Раху принимает облик духа му (དམུ, dmu) и движется с востока на запад.
reading.RahuMonth.autumn.25=В три месяца осени, в сумерках 25-го, Раху принимает облик ракшаса (སྲིན་པོ, srin po) и движется с севера на юг.
reading.RahuMonth.autumn.29=В три месяца осени, под вечер 29-го, Раху принимает облик Владыки смерти и движется в озере Мадрё (མ་དྲོས, ma dros).
reading.NectarPeriods=Каждый из двенадцати двухчасовых периодов делится надвое, и у каждой половины есть правящая планета. Днём первая половина рассвета принадлежит планете дня недели, а каждая следующая — планете, шестой по порядку дней недели; ночью, с заката, снова планете дня, а каждая следующая — пятой. Половины, которыми правит Юпитер, — периоды нектара; таблицы дел называют их хорошими для перечисленного ниже. Время — часовое время вашего места, от часа зайца в 05:00.
reading.Rahu.1=Раху поворачивает назад на рассвете вместе со свитой: хорошо насылать град и метать зор (ཟོར, zor).
reading.Rahu.4=На закате Раху входит на запад, в сумерках переходит на восток и остаётся там два дня: хорошо добиваться целей, брать невесту, торговать, рубить деревья, для белых дел дхармы и пивоварения; похорон, учения дхарме и улаживания драк избегают.
reading.Rahu.6=Утром Раху поворачивает на запад: в час поворота хороши огненные подношения грозных обрядов и насылание града.
reading.Rahu.8=Раху входит с востока на юго-восток и до полудня переходит на северо-запад, где остаётся три дня: хорошо для тяжб, нападения на врагов, грабежа и клятв; мытьё головы, шитьё одежды, невеста и омовение плохи.
reading.Rahu.11=Раху поворачивает назад в сумерках вместе со свитой: совершают убийство и обряды проклятия сердца.
reading.Rahu.12=В сумерках Раху входит северными воротами и с наступлением ночи переходит с севера на юг, где остаётся два дня: хорошо для омовения, пиров, уплаты долгов, мытья головы и сева; взятие слуг и объездка животных плохи.
reading.Rahu.14=Раху поворачивает назад в полдень вместе со свитой: хороши насылание града и обряды погребения.
reading.Rahu.15=До полудня Раху входит на юго-запад и в полдень переходит на северо-восток, где остаётся два дня: хорошо для подношений божествам, обрядов удержания благополучия, практики, посвящения и практики дхармы; выплаты, клятвы, невеста и отдача ребёнка плохи.
reading.Rahu.17=В полночь Раху поворачивает назад на юго-запад: дела, насылающие молнию и град, удаются.
reading.Rahu.18=В полночь Раху входит на восток и после полуночи переходит на запад, где остаётся три дня: хорошо для пострига, храмов, ступ, выхода в путь и выступления войска; клятвы, простирания, строительство, установка дверей, кровля и дверные завесы плохи.
reading.Rahu.21=Раху поворачивает назад в полдень вместе со свитой: грозные дела хороши.
reading.Rahu.22=В полдень Раху входит на северо-запад и вскоре после полудня переходит на юго-восток, где остаётся два дня: хорошо для ремёсел, учения письму и астрологии, рытья каналов, обрядов с предметом порчи (གཏད, gtad) и советов; дома, поиск места для могилы и объездка животных плохи.
reading.Rahu.24=Раху поворачивает назад после полудня: совершают дела, насылающие молнию и град.
reading.Rahu.25=В полночь Раху входит на юг и на рассвете переходит на север, где остаётся два дня: хорошо покупать поля и строить; выплат богатства и выступления войска избегают.
reading.Rahu.27=Раху поворачивает назад в сумерках вместе со свитой: совершают обряды Вишну.
reading.Rahu.29=После полудня Раху входит на северо-восток и, когда солнце поднимется на длину копья, переходит на юго-запад, где остаётся два дня: хорошо для погребения врагов, огненных подношений грозных обрядов, молнии и града; дела дхармы, сев и пивоварение плохи.
reading.RahuGeneral=Общий путь Раху. {0} За каждый день он тоже обходит стороны: при первом солнце с востока на северо-запад, в утреннем тепле с северо-запада на юг, в полдень с юга на северо-восток, под вечер с северо-востока на запад, на закате с запада на юго-восток, в сумерках с юго-востока на север, в полночь с севера на юго-запад, а от рассвета до утра с юго-запада на восток. В грозных обрядах следуют его пути и никогда не обращаются к нему лицом. На другие числа «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) даёт более точный путь и говорит, для чего хорош день.
reading.RahuGeneral.2=После полудня Раху движется с востока на запад.
reading.RahuGeneral.3=Утром, когда пригреет, Раху движется с юго-запада на северо-восток.
reading.RahuGeneral.5=Утром, когда пригреет, Раху движется с востока на запад.
reading.RahuGeneral.7=В сумерках Раху движется с севера на юг.
reading.RahuGeneral.9=В сумерках Раху движется с северо-востока на юго-запад.
reading.RahuGeneral.10=На рассвете Раху движется с юга на север.
reading.RahuGeneral.13=На рассвете Раху движется с севера на юг.
reading.RahuGeneral.16=На закате Раху движется с северо-востока на юго-запад.
reading.RahuGeneral.19=Рано утром Раху движется с юга на север.
reading.RahuGeneral.20=В полдень Раху движется с юго-востока на северо-запад.
reading.RahuGeneral.23=В полдень Раху движется с северо-запада на юго-восток.
reading.RahuGeneral.26=После полуночи Раху движется с востока на запад.
reading.RahuGeneral.28=На рассвете Раху движется с севера на юг.
reading.RahuGeneral.30=С места собрания богов Раху движется по всему небу, вверху и внизу, во все стороны.

# Readings with a shared pattern: {0} takes the entry
reading.KyuSei=Стихия, направление, триграмма и цвет: {0} Используется в японском онмёдо для предсказания судьбы и выбора направлений; к планетам эти звёзды отношения не имеют.
reading.KyuSei.IPPAKU=Вода; север; триграмма 坎 (вода); белый.
reading.KyuSei.JIKOKU=Земля; юго-запад; триграмма 坤 (земля); чёрный.
reading.KyuSei.SANPEKI=Дерево; восток; триграмма 震 (гром); синий.
reading.KyuSei.SHIROKU=Дерево; юго-восток; триграмма 巽 (ветер); зелёный.
reading.KyuSei.GOO=Земля; центр; 太極 (великий предел); жёлтый.
reading.KyuSei.ROPPAKU=Металл; северо-запад; триграмма 乾 (небо); белый.
reading.KyuSei.SHICHISEKI=Металл; запад; триграмма 兌 (озеро); красный.
reading.KyuSei.HAPPAKU=Земля; северо-восток; триграмма 艮 (гора); белый.
reading.KyuSei.KYUSHI=Огонь; юг; триграмма 離 (огонь); пурпурный.
reading.StarRelation={0} Ваша звезда рождения (本命星) — звезда года вашего рождения, год считается от 立春. Это толкование относится к 九星気学, гаданию по девяти звёздам, сведённому в 気学 в 1909 году; это не пометка исторического альманаха.
reading.StarRelation.SOSHO=相生: стихия одной звезды питает стихию другой, как металл питает воду. Для лет, месяцев и дней человека это считается хорошим.
reading.StarRelation.HIWA=比和: у обеих звёзд одна стихия. Для лет, месяцев и дней человека это считается хорошим.
reading.StarRelation.SOKOKU=相剋: стихия одной звезды одолевает стихию другой, как земля одолевает воду. Для лет, месяцев и дней человека это считается плохим.
reading.Kinship={0} Ваши жизненная сила и тело, по году рождения, сопоставляются с жизненной силой и телом лунного числа, а в часах дня — каждого двухчасового периода, как в гадании о здоровье «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), где рассматриваются также месяц и год; сопоставление с месяцем — в подробностях месяца, а с четырьмя аспектами года — в подробностях года, как в гадании о годах препятствий. Часы считаются по часам вашего места, первый — с 05:00, как их принято отсчитывать сегодня (Берзин). Приведённые предсказания относятся к жизненной силе года; остальное источник толкует так же. Полные гадания добавляют и другие камни, которые это приложение не рассчитывает.
reading.Kinship.MOTHER=Мать: другая стихия питает вашу, как вода питает дерево. Лучшее из пяти отношений, отмечается тремя белыми камнями. Для жизненной силы три белых камня предвещают, что древо жизни растёт и человек хорошо поддержан.
reading.Kinship.FRIEND=Друг: ваша стихия одолевает другую, как дерево одолевает землю. Второе после матери, отмечается двумя белыми камнями. Для жизненной силы два белых камня предвещают достаток, исполнение желаний и отсутствие угрозы жизни.
reading.Kinship.IDENTITY=Совпадение: другая стихия та же, что и ваша. Для земли и воды отмечается одним белым камнем, который для жизненной силы предвещает отсутствие препятствий долгой жизни; для дерева, огня и железа — одним чёрным камнем, который для жизненной силы предвещает, что соки древа жизни иссыхают, а обряды теряют силу.
reading.Kinship.SON=Ребёнок: ваша стихия питает другую, как дерево питает огонь. Отмечается одним белым и одним чёрным камнем; для жизненной силы они предвещают хорошее и плохое вместе, так что несчастье ещё можно отвратить обрядами.
reading.Kinship.ENEMY=Враг: другая стихия одолевает вашу, как железо одолевает дерево. Худшее из пяти отношений, отмечается двумя чёрными камнями. Для жизненной силы два чёрных камня предвещают наказание и сломанное древо жизни.
reading.Ehou=Где пребывает 歳徳神, бог удачи года. Всё, что делается лицом к этому направлению, удачно.
