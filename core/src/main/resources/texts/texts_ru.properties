reading.LunarDate.25.remedy=совершить обряды, умножающие славу, и прочесть «Груду благополучия» (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa)
reading.LunarDate.25.la=ла, жизненный дух (བླ, bla), пребывает в подколенной ямке; у лошадей и другого скота — в груди и шее (བྲང་སྐེ, brang ske); там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.25.birth=мальчик будет богат; девочка умирает или живёт одна
reading.LunarDate.25.livestock=купленный сегодня, умножается
reading.LunarDate.26=Двадцать шестое число месяца — благой день, день радости (དགའ་བ, dga' ba): умиротворяющие обряды, ремёсла, игры и всякое светлое дело идут в этот день хорошо.
reading.LunarDate.26.also_called=Нанда
reading.LunarDate.26.la=ла, жизненный дух (བླ, bla), пребывает над коленом; у лошадей и другого скота — в горловой впадине (ཨོལ་སྟོང, ol stong); там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.26.birth=за девочкой следуют девочки
reading.LunarDate.26.death=к худу
reading.LunarDate.27=Двадцать седьмое число месяца — один из благих дней, превосходный день (བཟང་པོ, bzang po): прежде всего в этот день хорошо идут поиск друзей и посев семян.
reading.LunarDate.27.also_called=Бхадра
reading.LunarDate.27.la=ла, жизненный дух (བླ, bla), пребывает в икре; у лошадей и другого скота — в половых органах; там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.27.birth=мальчик наделён острым умом; девочке плохо, она уходит вслед за мужем
reading.LunarDate.27.death=к добру
reading.LunarDate.27.livestock=покупка — средне
reading.LunarDate.28=Двадцать восьмое число месяца — благой день, победоносный день (རྒྱལ་བ, rgyal ba): война, набеги, нападение на врагов, обряды нитяного креста (མདོས, mdos), торма (གཏོར་མ, gtor ma) и иные гневные обряды идут в этот день хорошо.
reading.LunarDate.28.also_called=Джая
reading.LunarDate.28.la=ла, жизненный дух (བླ, bla), пребывает в голеностопном суставе; у лошадей и другого скота — в мошонке (སྒྲོ་བ, sgro ba); там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.28.birth=ребёнка трудно вырастить
reading.LunarDate.28.death=к худу
reading.LunarDate.29=Двадцать девятое число месяца — пустой день (སྟོང་པ, stong pa), не из благих: в целом всякое дело, за которое берутся в этот день, идёт плохо.
reading.LunarDate.29.also_called=Рикта
reading.LunarDate.29.remedy=по обряду поднять в воздух пустой сосуд, прочесть «Поток богатства» (ནོར་རྒྱུན, nor rgyun) и закрепить залог богатства
reading.LunarDate.29.la=ла, жизненный дух (བླ, bla), пребывает в голени; у лошадей и другого скота — в носовых ходах; там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.29.birth=ребёнок приносит несчастье
reading.LunarDate.30=Тридцатое число месяца — полный день (རྫོགས་པ, rdzogs pa), не из благих: в целом дела в этот день идут плохо, но постройка крепости и сокрытие клада идут хорошо. Это опасный день: наги в смятении собираются под началом своего царя Мадрё (མ་དྲོས, ma dros). Заболеть в этот день опасно, а большие сборища и всякое великое и сильное дело идут плохо.
reading.LunarDate.30.also_called=Пурна
reading.LunarDate.30.remedy=совершить обряды, умножающие славу, и прочесть «Груду благополучия» (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa)
reading.LunarDate.30.la=ла, жизненный дух (བླ, bla), пронизывает всё тело, у лошадей и другого скота тоже; там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.30.birth=ребёнок будет беден

# Readings: weekdays (the White Beryl, pp. 308–312)
reading.Weekday.SUNDAY=День Солнца. Выход в путь идёт плохо, прежде всего на юг, на север и в промежуточные стороны. Похорон в этот день не устраивают, даже когда Солнце сильно: это дверь неба. Вместе со вторником и субботой это день, когда избегают добродетельных дел.
reading.Weekday.SUNDAY.also_called=день недели ла (བླ་གཟའ, bla gza') царей; царская каста; мирное; бледно-красное; огонь
reading.Weekday.SUNDAY.strong=в убывающую половину месяца, днём и во Льве
reading.Weekday.SUNDAY.birth=мальчик, если переживёт семь дней и семь месяцев, живёт долго и любим великими; девочка будет богата, но за ней следуют девочки, и потому некоторые считают её рождение дурным
reading.Weekday.SUNDAY.death=повторяется девять или семь раз
reading.Weekday.MONDAY=День Луны. Выход в путь идёт плохо, прежде всего на юго-запад. Огненного подношения (ཧོམ, hom) в этот день не сжигают, даже когда Луна сильна: это дверь нагов.
reading.Weekday.MONDAY.also_called=день недели ла (བླ་གཟའ, bla gza') женщин и нагов; знатная каста; мирная; бело-жёлтая; вода
reading.Weekday.MONDAY.strong=в Раке и ночью
reading.Weekday.MONDAY.birth=мальчик будет богат и очень силён; девочка — красива и приятна
reading.Weekday.MONDAY.death=не повторяется
reading.Weekday.TUESDAY=День Марса. Выход в путь идёт плохо, а на юг, на север и в промежуточные стороны — очень плохо. Вместе с воскресеньем и субботой это день, когда избегают добродетельных дел.
reading.Weekday.TUESDAY.also_called=Благополучный (བཀྲ་ཤིས, bkra shis); день недели ла (བླ་གཟའ, bla gza') асуров и военачальников; царская каста; гневный; красно-чёрный; огонь
reading.Weekday.TUESDAY.strong=в Овне и Скорпионе
reading.Weekday.TUESDAY.birth=мальчика трудно вырастить, он склонен ко злу, сеет раздор, горд и гневлив; девочка умирает рано
reading.Weekday.TUESDAY.death=повторяется трижды
reading.Weekday.WEDNESDAY=День Меркурия. Выход в путь в целом идёт хорошо, но плохо на восток, на север и в промежуточные стороны. Могил в этот день не роют, даже когда Меркурий силён: он пресекает род.
reading.Weekday.WEDNESDAY.also_called=якша, бесполая планета; день недели ла (བླ་གཟའ, bla gza') царей; каста простолюдинов; мирный; сине-зелёный; вода
reading.Weekday.WEDNESDAY.strong=в начале растущей и в конце убывающей половины месяца, в Близнецах и Деве; тогда особенно хорошо идут обряды умножения
reading.Weekday.WEDNESDAY.birth=мальчик дурен, суров к матери и болезнен; девочка разоряет родителей, но сама имеет пищу, богатство и власть
reading.Weekday.WEDNESDAY.death=дурна пятикратно; узник не выходит на свободу
reading.Weekday.THURSDAY=День Юпитера. Выход в путь в целом идёт хорошо, но плохо на запад. Зор (ཟོར, zor) в этот день не мечут, даже когда Юпитер силён: это планета похорон.
reading.Weekday.THURSDAY.also_called=день недели ла (བླ་གཟའ, bla gza') лам, бодхисаттв, министров и монахов; каста брахманов; смешанный, мирный и гневный; жёлтый; ветер
reading.Weekday.THURSDAY.strong=в Рыбах и Стрельце
reading.Weekday.THURSDAY.birth=мальчик некрасив лицом, но ясного ума, учён и практикует дхарму; девочка живёт долго и имеет добрых друзей
reading.Weekday.THURSDAY.death=лишь немного дурна для оставшихся; погребальные обряды идут плохо, но поминальный пир идёт хорошо
reading.Weekday.FRIDAY=День Венеры. Выход в путь в целом идёт хорошо, но плохо на юг, на север и на запад. Скот из дома в этот день не отправляют, даже когда Венера сильна: это планета скота.
reading.Weekday.FRIDAY.also_called=день недели ла (བླ་གཟའ, bla gza') царей, министров и женщин; каста брахманов; мирная; многоцветная; земля
reading.Weekday.FRIDAY.strong=в убывающую половину месяца, в Тельце и Весах; тогда хорошо идут обряды власти
reading.Weekday.FRIDAY.birth=мальчик живёт долго, остёр умом и богат; девочка болезненна, но велика славой
reading.Weekday.FRIDAY.death=повторяется семь раз
reading.Weekday.SATURDAY=День Сатурна. Выход в путь идёт плохо, прежде всего в промежуточные стороны, на восток и на запад. Богатства в этот день не отдают, даже когда Сатурн силён: это планета земли. Вместе с воскресеньем и вторником это день, когда избегают добродетельных дел.
reading.Weekday.SATURDAY.also_called=бедный, бесполый, слуга; день недели ла (བླ་གཟའ, bla gza') детей; каста чандалов; гневный; серо-жёлтый; земля
reading.Weekday.SATURDAY.strong=ночью, в убывающую половину месяца, в Козероге и Водолее; тогда хорошо идёт убийство
reading.Weekday.SATURDAY.birth=красив, но мало заслуг; мальчик — средне, девочка недолговечна
reading.Weekday.SATURDAY.death=не повторяется; узник теряет всё имущество
reading.Trigram.LI=День триграммы огня (ལི, li) — день Омбарма (འོད་འབར་མ, 'od 'bar ma), первой из восьми богинь, отсчитываемых по месяцу. Болезнь, начавшаяся в этот день, возводится к тому, что разрыли или разрушили очаг, рубили деревья, ходили в сумерках или до рассвета, работали на водных каналах.
reading.Trigram.LI.spirits=наги (ཀླུ, klu), духи цен (བཙན, btsan), дрэво (གྲེ་བོ, gre bo) и дрэмо (གྲེ་མོ, gre mo)
reading.Trigram.LI.illness=вздутие живота и колющие боли в верхней части тела
reading.Trigram.LI.rites=бонгра (བོང་ར, bong ra), нитяной крест цен (བཙན་མདོས, btsan mdos) и изгнание «водяного клинка» (ཆུ་གྲི, chu gri)
reading.Trigram.KHON=День триграммы земли (ཁོན, khon) — день Тэнма (བསྟན་མ, bstan ma), одной из восьми богинь, отсчитываемых по месяцу. Болезнь, начавшаяся в этот день, возводится к посещению нечистого места или места ссоры.
reading.Trigram.KHON.spirits=боги (ལྷ, lha), «цен ножа» (གྲི་བཙན, gri btsan) и владыки земли (ས་བདག, sa bdag)
reading.Trigram.KHON.illness=нездоровы желудок и печень, бывают колющие боли, опухоли и высыпания (ཤུ་ཐོར, shu thor)
reading.Trigram.KHON.rites=воскурения, покаяние, нитяной крест цен (བཙན་མདོས, btsan mdos) и шонгье (གཞོང་རྒྱས, gzhong rgyas)
reading.Trigram.DWA=День триграммы озера (དྭ, dwa) — день Карсэлма (དཀར་གསལ་མ, dkar gsal ma), одной из восьми богинь, отсчитываемых по месяцу. Болезнь, начавшаяся в этот день, возводится к тому, что на очаге варили или жгли мясо и кровь.
reading.Trigram.DWA.spirits=боги (ལྷ, lha), духи гьялпо (རྒྱལ་པོ, rgyal po) и дрэво (གྲེ་བོ, gre bo)
reading.Trigram.DWA.illness=истощение, вздутие живота и болезнь почек
reading.Trigram.DWA.rites=покаяние, омовение, водные тормы (ཆུ་གཏོར, chu gtor) и нитяной крест гьялпо (རྒྱལ་མདོས, rgyal mdos)
reading.Trigram.KHEN=День триграммы неба (ཁེན, khen) — день Дангдэнма (མདངས་ལྡན་མ, mdangs ldan ma), одной из восьми богинь, отсчитываемых по месяцу. Болезнь, начавшаяся в этот день, возводится к чистой и нечистой пище.
reading.Trigram.KHEN.spirits=намтэ (གནམ་ཐེ, gnam the), владыки земли (ས་བདག, sa bdag), серак (བསེ་རག, bse rag), гьенгонг (རྒྱལ་འགོང, rgyal 'gong) и духи умерших
reading.Trigram.KHEN.illness=боль в боку, понос, недуги лёгких, сердца и суставов
reading.Trigram.KHEN.rites=выкуп (གླུད, glud) и водные тормы (ཆུ་གཏོར, chu gtor)
reading.Trigram.KHAM=День триграммы воды (ཁམ, kham) — день Чамбэбма (ཆར་འབེབས་མ, char 'bebs ma), одной из восьми богинь, отсчитываемых по месяцу. Болезнь, начавшаяся в этот день, возводится к пиву и пище из дома вдовы.
reading.Trigram.KHAM.spirits=духи мо (མོ, mo), ньен (གཉན, gnyan) и водные дрэ (གྲེ, gre)
reading.Trigram.KHAM.illness=колющие боли спереди и сзади, сухость во рту, болезнь холода, водянка, понос и рвота
reading.Trigram.KHAM.rites=синий нитяной крест (མདོས, mdos) и девятичастный обряд против сасин (ས་སྲིན, sa srin)
reading.Trigram.GIN=День триграммы горы (གིན, gin) — день Йомэма (གཡོ་མེད་མ, g.yo med ma), одной из восьми богинь, отсчитываемых по месяцу. Болезнь, начавшаяся в этот день, возводится к блужданию по пустым долинам в бурю.
reading.Trigram.GIN.spirits=духи дриб-цен (གྲིབ་བཙན, grib btsan) и джетётонг (བརྗེ་ཐོད་གཏོང, brje thod gtong)
reading.Trigram.GIN.illness=заразная горячка, изнеможение и безумие
reading.Trigram.GIN.rites=нитяной крест (མདོས, mdos) против заразы и обряды восполнения и покаяния (བསྐང་བཤགས, bskang bshags)
reading.Trigram.ZIN=День триграммы грома (ཟིན, zin) — день Ончангма (འོད་འཆང་མ, 'od 'chang ma), одной из восьми богинь, отсчитываемых по месяцу. Болезнь, начавшаяся в этот день, возводится к пище с неблагоприятной стороны и к мясу и крови.
reading.Trigram.ZIN.spirits=владыки земли (ས་བདག, sa bdag), наги (ཀླུ, klu), ньен (གཉན, gnyan) и дрэмо (གྲེ་མོ, gre mo)
reading.Trigram.ZIN.illness=колющие боли в печени и рёбрах, болезнь желудка и опухоли
reading.Trigram.ZIN.rites=обряд для нагов (ཀླུ, klu) и изгнание дрэмо (གྲེ་མོ, gre mo)
reading.Trigram.ZON=День триграммы ветра (ཟོན, zon) — день Кьобджема (སྐྱོབ་བྱེད་མ, skyob byed ma), последней из восьми богинь, отсчитываемых по месяцу. Болезнь, начавшаяся в этот день, возводится к имуществу храма или буддийских и бонских (བོན, bon) священников.
reading.Trigram.ZON.spirits=Пехар (པེ་ཧར, pe har), кордаг (དཀོར་བདག, dkor bdag) и вредоносные духи умерших, нарушивших обеты (དམ་སྲི, dam sri)
reading.Trigram.ZON.illness=боль в почках и пояснице, болезнь глаз, ветер сердца и изнеможение
reading.Trigram.ZON.rites=нитяной крест гьялпо (རྒྱལ་མདོས, rgyal mdos), обряды восполнения и покаяния (བསྐང་བཤགས, bskang bshags) и изгнание духов умерших, нарушивших обеты (དམ་སྲི, dam sri)
reading.GreatCombination.KUN_DGA=Благоприятное сочетание: обретается богатство. Растут жизнь, блеск и величие, пылают слава, достаток и заслуги. Дела и замыслы идут хорошо, и обретается драгоценность долгой жизни.
reading.GreatCombination.DUS_DBYIG=Неблагоприятное сочетание: оно несёт великий страх. Меркнет сияние неба, вянут цветы, сохнут деревья и пересыхают воды. Приходит грозный враг, и начинаются убийства.
reading.GreatCombination.DUL=Благоприятное сочетание: много богатства, и человек становится богат. Желания исполняются, и ум спокоен. Приходят счастье, богатство и дхарма, с долгой жизнью; его образ — плод исполняющего желания дерева.
reading.GreatCombination.SKYE_DGU=Благоприятное сочетание: счастье для женщин. Желанное дело идёт хорошо, а мудрость и преданность сильно растут. Приходит удача, а с ней люди и богатство.
reading.GreatCombination.GZHON=Благоприятное сочетание: всякое дело идёт хорошо. Враг уничтожен, и битва выиграна, а дни жизни поддерживаются. Его образ — яркие полосы тигра.
reading.GreatCombination.BYA_ROG=Неблагоприятное сочетание: ссоры, страх и голод. Сокровище жизни недолговечно, и её блеск меркнет. Еда и питьё не питают, а радость богов и людей оборачивается страданием.
reading.GreatCombination.RGYAL_MTSHAN=Благоприятное сочетание: изобилие богатства и одежд. Сияют блеск и великолепие, приходят слава, удача и счастье. Людям и богатству хорошо, и звучит музыка добродетели.
reading.GreatCombination.DPAL_BEU=Благоприятное сочетание: собираются драгоценности. Приходят власть и сыновья. Великая слава распространяется и остаётся доброй до конца, а счастье и дело богини идут хорошо.
reading.GreatCombination.RDO_RJE=Неблагоприятное сочетание: страх молнии и града. Самому неспокойно, а другие разоряются. Возникает много видов недоброго, и враги, воры и поветрия несут страх.
reading.GreatCombination.THO_BA=Неблагоприятное сочетание: страх смерти. Ненависть обрывает жизнь, а с ней приходят плач, раздоры и невежество. Оно непременно враждебно жизни четвероногих животных.
reading.GreatCombination.GDUGS=Благоприятное сочетание: враги побеждены. Приходят отвага и сила оружия, и враг ненависти и раздоров уничтожен. Его образ — львёнок, которому покойно.
reading.GreatCombination.GROGS=Благоприятное сочетание: встреча с друзьями. Приходят слава и доброта, желания исполняются, и жизнь становится сокровищем, полным блеска. Слава и желанные цели достигаются.
reading.GreatCombination.YID=Благоприятное сочетание: обретается слава. Приходит драгоценность, сокровище жизни, с драгоценностями, славой, властью и добрым путём. Слава и задуманные цели достигаются.
reading.GreatCombination.DOD=Благоприятное сочетание: дела идут по желанию. Это путь к родне, и собранные драгоценности радуют. Приходят удача и победа, и сбывается даже то, что лишь задумано.
reading.GreatCombination.MGAL_ME=Неблагоприятное сочетание: вспыхивают драки и раздоры. Это почва для страха и ужаса, для сплетен и злых речей, для ссор с родными.
reading.GreatCombination.RTSA_BTON=Неблагоприятное сочетание: жизнь иссякает. Удача и замыслы рушатся, а богатство дхармы, посвящения и освящения не удаются. Растрачиваются даже благородные богатства.
reading.GreatCombination.CHI_BDAG=Неблагоприятное сочетание: приходит смерть. Оно ведёт человека в места страха и на дороги страха. Его образ — хищный зверь в небе.
reading.GreatCombination.MDA=Неблагоприятное сочетание: слабеют нос и члены, а также органы чувств. Блеск меркнет, и жизнь обрывается. Дела и удача приходят в упадок.
reading.GreatCombination.GRUB=Благоприятное сочетание: начатое дело идёт хорошо. Пылает высшее свершение, с добрыми словами и имуществом. Радость, мудрость и отвага ясны, а желанное, удача и слава достигаются.
reading.GreatCombination.MDUNG=Неблагоприятное сочетание: приходит страх болезни, и обрывается род царицы. Но приходят и рост, и покой, добрые мысли от начала до конца, сыновья и внуки.
reading.GreatCombination.BDUD_RTSI=Благоприятное сочетание: враги разорены. Оно большей частью приятно и лучше всего для лечения, гибель для врагов и для страха. Враги иссякают, обретаются слава и богатство.
reading.GreatCombination.GTUN_SHING=Неблагоприятное сочетание: иссякают жизнь, богатство и даже боги, кончается удача, и разбиваются головы. Его образ — пест, который толчёт, сын демона.
reading.GreatCombination.GLANG_PO=Благоприятное сочетание: всякая цель достигается. Приходить, уходить, сидеть и отдыхать легко, а дела приносят добрые слова и славу. Его образ — быстрая сила великого слона.
reading.GreatCombination.RTAG_MYOS=Благоприятное сочетание: обретается верховое животное. Жизнь драгоценна и счастлива, и всё растёт, как лотосы океана. Доброе дело идёт хорошо, с верховыми животными, людьми, богатством и славой.
reading.GreatCombination.ZAD_PA=Неблагоприятное сочетание: иссякают богатство и люди. Тратятся жизнь, богатство, доброе имя и сила, еда, крепость и имущество. Иссякает и плод дел и заслуг.
reading.GreatCombination.GYO=Благоприятное сочетание: дело царя идёт хорошо. Человек становится господином людей, а дела царства и его младших князей идут хорошо. Грозные дела идут хорошо, и богатеют даже четыре великих царя (རྒྱལ་ཆེན་བཞི, rgyal chen bzhi).
reading.GreatCombination.BRTAN=Неблагоприятное сочетание: власть рушится. Враг побеждает, и это дурное предзнаменование для свиты и для рода. Задуманные цели обращаются в прах.
reading.GreatCombination.PHEL=Благоприятное сочетание: богатство растёт. Растёт лучшее из того, что прочно, растёт и ум. Мудрость и мысль ширятся, а блеск и величие сильно возрастают.
reading.CombinationDay={0} Собственные плоды дня недели и созвездия весят больше, чем плоды такого дня.
reading.CombinationDay.GRUB_SBYOR=Сочетание свершения (འགྲུབ་སྦྱོར, 'grub sbyor) — благоприятный день: всякое начатое в этот день дело идёт хорошо. Дела умиротворения, приумножения и подчинения в этот день добродетельны, кроме вредных грозных дел.
reading.CombinationDay.GRUB_SBYOR.also_called=сочетание нектара (བདུད་རྩི་སྦྱོར་བ, bdud rtsi sbyor ba)
reading.CombinationDay.ZUNG_SBYOR=Парное сочетание (ཟུང་སྦྱོར, zung sbyor) — благоприятный день: дела умиротворения, приумножения и подчинения в этот день добродетельны, кроме его собственных исключений и вредных грозных дел. В любой день недели, кроме четверга, с ним совпадает день полного запрета (གཏན་སྤང, gtan spang), поэтому взвесьте, что принять и чего избегать.
reading.CombinationDay.BDUD_RGYAL=Царь демонов (བདུད་རྒྱལ, bdud rgyal) — благоприятный день для грубых, грозных дел. Подношения богам-воителям (དགྲ་ལྷ, dgra lha) идут в этот день хорошо.
reading.CombinationDay.GRUB_NYI=День свершения (གྲུབ་ཉི, grub nyi), один из семи, — благоприятный день: важные дела идут в этот день хорошо, а вредные, греховные — плохо. Вместе с царём демонов (བདུད་རྒྱལ, bdud rgyal) он годится для нападения.
reading.CombinationDay.BKRA_SHIS_NYI=Благоприятный день (བཀྲ་ཤིས་ཉི་མ, bkra shis nyi ma) благоприятен: в этот день приходит счастье.
reading.CombinationDay.PHEL_NYI=День возрастания (འཕེལ་ཉི, 'phel nyi) — один из семи дней возрастания, и это благоприятный день.
reading.CombinationDay.CHUB_NYI=День исполнения (ཆུབ་ཉི, chub nyi) — благоприятный день, как и парное сочетание (ཟུང་སྦྱོར, zung sbyor): почти все добрые дела идут в этот день хорошо.
reading.CombinationDay.MTHUN_NYI=День согласия (མཐུན་ཉི, mthun nyi) — благоприятный день: в этот день хорошо сближать людей друг с другом.
reading.CombinationDay.SBYOR_NYI=День соединения (སྦྱོར་ཉི, sbyor nyi), один из семи, — благоприятный день, а разрушительные дела идут в этот день плохо.
reading.CombinationDay.BDUD_NYI=День демона (བདུད་ཀྱི་ཉི་མ, bdud kyi nyi ma), один из семи, — неблагоприятный день: дело, по которому он назван, идёт плохо, как и все дела власть имущих. Невеста вредит свёкру и мужу, а похороны — семье умершего.
reading.CombinationDay.BDUD_NYI.also_called=в воскресенье день демона подношений богам, в понедельник — цариц, во вторник — военачальников, в среду — мерщиков зерна, в четверг — священников, в пятницу — знати, в субботу — торговцев лошадьми
reading.CombinationDay.CHI_SBYOR=Сочетание смерти (འཆི་སྦྱོར, 'chi sbyor) — неблагоприятный день: большинство дел идёт в этот день плохо, а перемещение больных — хуже всего. Его образ — удар каждой планеты по её созвездию: Солнце сжигает пальцы Хасты, Луна подавляет Криттику.
reading.CombinationDay.MI_PHROD_NYI=День несовместимости (མི་འཕྲོད་ཉི་མ, mi 'phrod nyi ma) — неблагоприятный день, который годится для вредных дел, таких как внесение раздора. Невеста вредит свекрови, а похороны — братьям и сёстрам невесты.
reading.CombinationDay.MI_MTHUN_NYI=День разлада (མི་མཐུན་ཉི་མ, mi mthun nyi ma) — неблагоприятный день: разлучение и вредные дела идут хорошо, а большинство добрых дел — плохо. Брак вредит себе, своему отцу и свекрови, а похороны — молодым мужчинам.
reading.CombinationDay.JIG_NYI=День разрушения (འཇིག་པའི་ཉི་མ, 'jig pa'i nyi ma) — неблагоприятный день, который годится для вредных дел. Он плох для невесты, родни и лошадей, а похороны вредят домочадцам и племянникам.
reading.CombinationDay.GTAN_SPANG=День полного запрета (གཏན་སྤང, gtan spang) — неблагоприятный день: всех важных дел следует избегать, а кровопускания и прижиганий — прежде всего. В любой день недели, кроме четверга, с ним совпадает парное сочетание (ཟུང་སྦྱོར, zung sbyor), поэтому взвесьте, что принять и чего избегать.
reading.CombinationDay.GTAN_SPANG.also_called=сочетание сожжения (བསྲེག་སྦྱོར, bsreg sbyor)
reading.BurningDate=Дата сожжения (བསྲེག་ཚེས, bsreg tshes) — неблагоприятный день: день недели встречается с одной из двух своих дат, и всё сделанное тогда остаётся без плода, как от сожжённого шёлка остаётся лишь пепел.
reading.BurningDate.remedy=поднимите большой флаг цвета планеты дня и совершите подношение дыма (གསུར, gsur) из белого масла
reading.BurningDate.falls=день недели с одной из двух своих дат, по одной в каждой половине месяца; сегодня {0}
reading.GreatBlackDay=Великий чёрный день (ཉི་མ་ནག་ཆེན, nyi ma nag chen), первый из владык земли (ས་བདག, sa bdag), движущихся по датам, приходится на сегодня. {0} Дела ради умерших и живых идут плохо, и избегать его важно.
reading.GreatBlackDay.0=Обходя гору Меру (རི་རབ, ri rab), Раху встречает свою младшую сестру Бамсинг (བམ་སྲིང, bam sring), которая обходит её в другую сторону, и она осквернена: это встреча девяти дурных (ངན་པ་དགུ་འཛོམ, ngan pa dgu 'dzom), худшее из дурного.
reading.GreatBlackDay.1=Это время возникновения.
reading.GreatBlackDay.2=Это время прорыва.
reading.GreatBlackDay.3=Осквернена сестра Раху Таксинг (སྟག་སྲིང, stag sring).
reading.GreatBlackDay.4=Возникает чрево крови.
reading.GreatBlackDay.5=Чрево прорывается.
reading.GreatBlackDay.6=Осквернена сестра Раху Конгсинг (ཀོང་སྲིང, kong sring).
reading.GreatBlackDay.7=Возникает чрево железа.
reading.GreatBlackDay.8=Чрево прорывается.
reading.GreatBlackDay.9=Осквернена сестра Раху Бамсинг (བམ་སྲིང, bam sring).
reading.GreatBlackDay.10=Возникает чрево воды.
reading.GreatBlackDay.11=Это последняя дата его пути в году.
reading.GreatBlackDay.remedy=поставить со стороны восхода солнца копьё с привязанными к нему чёрным хвостом яка, пятью видами дерева, белым шёлковым шарфом и шерстью чёрной собаки; там, где осквернили чёрный месяц или чёрный день, поднять белый шёлк и белую ткань, совершить белое подношение дыма (གསུར, gsur) и водную торму (ཆུ་གཏོར, chu gtor) и прочесть «Собрание дхарани» (གཟུངས་བསྡུས, gzungs bsdus); или вылить вещества против дурных пересудов на перекрёстке трёх дорог и уйти, не оглядываясь
reading.GtsugLagDay={0} «Ваджрный трактат» (རྡོ་རྗེ་གཙུག་ལག, rdo rje gtsug lag) ставит его на другие дни недели и созвездия, чем основная таблица.
reading.GtsugLagDay.GRUB_NYI=Приближение и свершение (བསྙེན་སྒྲུབ, bsnyen sgrub), затворническая практика божества, идёт в этот день хорошо.
reading.GtsugLagDay.MI_PHROD_NYI=Это дурное знамение.
reading.Rahu={0} Грозные дела идут хорошо по ходу Раху, а всё, что обращено к нему лицом, идёт плохо.
reading.DusSbyor={0} Период сочетания стоит выше всех факторов дня: все их дела завершаются в его доме.
reading.DusSbyor.ARIES=Восходит Овен: период, которого следует избегать. Он несёт споры и потерю богатства, и все держатся от него в стороне. Недобрые дела процветают, и хорошо идут лишь война и гневные дела.
reading.DusSbyor.TAURUS=Восходит Телец: период, который используют. Находят богатство и славу, удачу и доброе имя, приходят подношения и услуги.
reading.DusSbyor.GEMINI=Восходят Близнецы: хороший период. Сбываются желания и приходит слава, находятся друзья, а прибыль приходит даже нежданно.
reading.DusSbyor.CANCER=Восходит Рак: период, которого следует избегать. Богатство и прибыль непременно убывают, и портится всё, к чему лишь прикоснёшься. Велики страсти, споры и страх.
reading.DusSbyor.LEO=Восходит Лев: период, который используют. Вредоносные духи слабеют и путь спокоен, ни в каком деле нет страха, и цари оказывают почёт.
reading.DusSbyor.VIRGO=Восходит Дева: период, который используют. Желания исполняются как задумано, с удачей и достатком.
reading.DusSbyor.LIBRA=Восходят Весы: период, которого следует избегать. Замыслы встречают препятствия, среди друзей приходит горе, а прибыль даётся трудно.
reading.DusSbyor.SCORPIO=Восходит Скорпион: период, которого следует избегать. Путь встречает большие опасности, богатство убывает, на душе уныло.
reading.DusSbyor.SAGITTARIUS=Восходит Стрелец: период, который используют. Уход и возвращение надёжны, и человек храбр. Цели достигаются, враги слабеют, а споры выигрываются.
reading.DusSbyor.CAPRICORN=Восходит Козерог: период, которого следует избегать. Возникают драки и споры, сильные страсти и вред от планет.
reading.DusSbyor.AQUARIUS=Восходит Водолей: период, который используют. Обретаются слава и власть, позже приходит богатство, и всякая нужда восполняется.
reading.DusSbyor.PISCES=Восходят Рыбы: период, который используют. Слава приходит, где она нужна, всякое дело идёт хорошо, и достигаются самые трудные цели.
reading.WorksSign=Пока восходит этот знак, каждое названное им дело — в своём собственном часе, в своём частном случае, который стоит выше общего чтения периода сочетания для этого дела.
reading.RahuMonth={0} В этот день любые грозные дела идут хорошо.
reading.RahuMonth.earlySpring.6=Раху движется, как посланец, поворачивающий голову; сегодня он находится в своём глазу.
reading.RahuMonth.earlySpring.9=Раху движется, как посланец, поворачивающий голову; сегодня он находится в своём правом плече.
reading.RahuMonth.earlySpring.11=Раху движется, как посланец, поворачивающий голову; сегодня он находится в своём левом плече.
reading.RahuMonth.earlySpring.13=Раху движется, как посланец, поворачивающий голову; сегодня он находится в своём сердце.
reading.RahuMonth.midSpring.16=Раху движется, как посланец, поворачивающий голову; сегодня он находится в своём глазу.
reading.RahuMonth.midSpring.9=Раху движется, как посланец, поворачивающий голову; сегодня он находится в своей голове.
reading.RahuMonth.midSpring.11=Раху движется, как посланец, поворачивающий голову; сегодня он находится в своём сердце.
reading.RahuMonth.midSpring.13=Раху движется, как посланец, поворачивающий голову; сегодня он находится в своём левом плече.
reading.RahuMonth.midSpring.19=Раху движется, как посланец, поворачивающий голову; сегодня он находится в своём правом плече.
reading.RahuMonth.autumn.15=Сегодня, в полдень, Раху принимает облик ма-мо (མ་མོ, ma mo) Битипатры и движется с северо-востока на юго-запад.
reading.RahuMonth.autumn.11=Сегодня, в полночь, Раху принимает облик духа ман (སྨན, sman) и движется с юга на север.
reading.RahuMonth.autumn.8=Сегодня, на рассвете, Раху принимает облик демона (བདུད, bdud) и движется с юго-запада на северо-восток.
reading.RahuMonth.autumn.4=Сегодня, с наступлением ночи, Раху принимает облик духа ньен (གཉན, gnyan) и движется с северо-запада на юго-восток.
reading.RahuMonth.autumn.22=Сегодня, под вечер, Раху принимает облик духа му (དམུ, dmu) и движется с востока на запад.
reading.RahuMonth.autumn.25=Сегодня, в сумерках, Раху принимает облик ракшаса (སྲིན་པོ, srin po) и движется с севера на юг.
reading.RahuMonth.autumn.29=Сегодня, под вечер, Раху принимает облик Владыки смерти и движется в озере Мадрё (མ་དྲོས, ma dros).
reading.NectarPeriods=Этот час — период нектара (བདུད་རྩི་ཐུན་མཚམས, bdud rtsi thun mtshams), половина двухчасового периода, владыка которой — Юпитер. Это благоприятное время, и дела, которые называют для него таблицы дел, идут хорошо.
reading.Rahu.1=Раху поворачивает назад на рассвете вместе со свитой.
reading.Rahu.4=На закате Раху входит на запад, в сумерках переходит на восток и остаётся там два дня; стремление к целям идёт хорошо.
reading.Rahu.6=Утром Раху поворачивает на запад, и в час поворота хорошо идут огненные подношения грозных обрядов.
reading.Rahu.8=Раху входит с востока на юго-восток и до полудня переходит на северо-запад, где остаётся три дня.
reading.Rahu.11=Раху поворачивает назад в сумерках вместе со свитой.
reading.Rahu.12=В сумерках Раху входит северными воротами и с наступлением ночи переходит с севера на юг, где остаётся два дня.
reading.Rahu.14=Раху поворачивает назад в полдень вместе со свитой, и хорошо идут насылание града и обряды погребения.
reading.Rahu.15=До полудня Раху входит на юго-запад и в полдень переходит на северо-восток, где остаётся два дня.
reading.Rahu.17=В полночь Раху поворачивает назад на юго-запад, и дела, насылающие молнию и град, идут хорошо.
reading.Rahu.18=В полночь Раху входит на восток и после полуночи переходит на запад, где остаётся три дня.
reading.Rahu.21=Раху поворачивает назад в полдень вместе со свитой.
reading.Rahu.22=В полдень Раху входит на северо-запад и вскоре после полудня переходит на юго-восток, где остаётся два дня; поиск места для могилы идёт плохо.
reading.Rahu.24=Раху поворачивает назад после полудня, и дела, насылающие молнию и град, идут хорошо.
reading.Rahu.25=В полночь Раху входит на юг и на рассвете переходит на север, где остаётся два дня.
reading.Rahu.27=Раху поворачивает назад в сумерках вместе со свитой, и совершают обряды Вишну.
reading.Rahu.29=После полудня Раху входит на северо-восток и, когда солнце поднимется на длину копья, переходит на юго-запад, где остаётся два дня.
reading.Rahu.through_day=с востока на северо-запад при первом солнце, на юг в утреннем тепле, на северо-восток в полдень, на запад под вечер, на юго-восток на закате, на север в сумерках, на юго-запад в полночь и обратно на восток от зари до рассвета
reading.RahuGeneral.2=После полудня Раху движется с востока на запад.
reading.RahuGeneral.3=Утром, когда пригреет, Раху движется с юго-запада на северо-восток.
reading.RahuGeneral.5=Утром, когда пригреет, Раху движется с востока на запад.
reading.RahuGeneral.7=В сумерках Раху движется с севера на юг.
reading.RahuGeneral.9=В сумерках Раху движется с северо-востока на юго-запад.
reading.RahuGeneral.10=На рассвете Раху движется с юга на север.
reading.RahuGeneral.13=На рассвете Раху движется с севера на юг.
reading.RahuGeneral.16=На закате Раху движется с северо-востока на юго-запад.
reading.RahuGeneral.19=Рано утром Раху движется с юга на север.
reading.RahuGeneral.20=В полдень Раху движется с юго-востока на северо-запад.
reading.RahuGeneral.23=В полдень Раху движется с северо-запада на юго-восток.
reading.RahuGeneral.26=После полуночи Раху движется с востока на запад.
reading.RahuGeneral.28=На рассвете Раху движется с севера на юг.
reading.RahuGeneral.30=С места собрания богов Раху движется по всему небу, вверху и внизу, во все стороны.

# Readings with a shared pattern: {0} takes the entry
reading.KyuSei=Стихия, направление, триграмма и цвет: {0} Используется в японском онмёдо для предсказания судьбы и выбора направлений; к планетам эти звёзды отношения не имеют.
reading.KyuSei.IPPAKU=Вода; север; триграмма 坎 (вода); белый.
reading.KyuSei.JIKOKU=Земля; юго-запад; триграмма 坤 (земля); чёрный.
reading.KyuSei.SANPEKI=Дерево; восток; триграмма 震 (гром); синий.
reading.KyuSei.SHIROKU=Дерево; юго-восток; триграмма 巽 (ветер); зелёный.
reading.KyuSei.GOO=Земля; центр; 太極 (великий предел); жёлтый.
reading.KyuSei.ROPPAKU=Металл; северо-запад; триграмма 乾 (небо); белый.
reading.KyuSei.SHICHISEKI=Металл; запад; триграмма 兌 (озеро); красный.
reading.KyuSei.HAPPAKU=Земля; северо-восток; триграмма 艮 (гора); белый.
reading.KyuSei.KYUSHI=Огонь; юг; триграмма 離 (огонь); пурпурный.
reading.StarRelation={0} Ваша звезда рождения (本命星) — звезда года вашего рождения, год считается от 立春. Это толкование относится к 九星気学, гаданию по девяти звёздам, сведённому в 気学 в 1909 году; это не пометка исторического альманаха.
reading.StarRelation.SOSHO=相生: стихия одной звезды питает стихию другой, как металл питает воду. Для лет, месяцев и дней человека это считается хорошим.
reading.StarRelation.HIWA=比和: у обеих звёзд одна стихия. Для лет, месяцев и дней человека это считается хорошим.
reading.StarRelation.SOKOKU=相剋: стихия одной звезды одолевает стихию другой, как земля одолевает воду. Для лет, месяцев и дней человека это считается плохим.
reading.Kinship={0} Остальные аспекты толкуются так же, как жизненная сила.
reading.Kinship.MOTHER=Отношение матери: другая стихия питает вашу, как вода питает дерево. Его отмечают три белых камня. Для жизненной силы они предвещают, что древо жизни растёт и человек хорошо поддержан.
reading.Kinship.MOTHER.rank=лучшее из пяти отношений
reading.Kinship.FRIEND=Отношение друга: ваша стихия одолевает другую, как дерево одолевает землю. Его отмечают два белых камня. Для жизненной силы они предвещают достаток, исполнение желаний и отсутствие угрозы жизни.
reading.Kinship.FRIEND.rank=второе после отношения матери
reading.Kinship.IDENTITY=Отношение совпадения: другая стихия та же, что и ваша. Для земли и воды его отмечает один белый камень: для жизненной силы — нет препятствий долгой жизни. Для дерева, огня и железа его отмечает один чёрный камень: соки древа жизни иссыхают, а обряды теряют силу.
reading.Kinship.SON=Отношение ребёнка: ваша стихия питает другую, как дерево питает огонь. Его отмечают один белый и один чёрный камень. Для жизненной силы они предвещают хорошее и плохое вместе, так что несчастье ещё можно отвратить обрядами.
reading.Kinship.ENEMY=Отношение врага: другая стихия одолевает вашу, как железо одолевает дерево. Его отмечают два чёрных камня. Для жизненной силы они предвещают наказание и сломанное древо жизни.
reading.Kinship.ENEMY.rank=худшее из пяти отношений
reading.Ehou=Где пребывает 歳徳神, бог удачи года. Всё, что делается лицом к этому направлению, удачно.
reading.Haircut.GOOD={0}: стрижка в эту дату идёт хорошо. Это одна из шестнадцати лунных дат, хороших для стрижки, а в остальные четырнадцать стрижки следует избегать.
reading.Haircut.AVOID={0}: стрижка в эту дату идёт плохо. Это одна из четырнадцати лунных дат, когда стрижки следует избегать, а остальные шестнадцать для неё хороши.
