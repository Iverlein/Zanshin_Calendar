# A person's own days by the birth date (WB vol. 2, pp. 330, 337–338, 346)
OwnDay.BIRTH_WEEKDAY=День недели рождения
OwnDay.OWN_WEEKDAY=Свой день недели
OwnDay.MOTHER_WEEKDAY=День недели матери
OwnDay.FRIEND_WEEKDAY=День недели друга
OwnDay.CHILD_WEEKDAY=День недели ребёнка
OwnDay.ENEMY_WEEKDAY=День недели врага
OwnDay.BIRTH_MANSION=Созвездие рождения
reading.OwnDay.BIRTH_WEEKDAY=День недели, в который вы родились. «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) считает собственные дни недели и созвездия человека особенно важными: в день недели рождения, как и в свой день недели, удаются мирные и гневные дела вообще, а прежде всего перечисленные здесь.
reading.OwnDay.OWN_WEEKDAY=День недели вашей собственной стихии, считаемой по жизненной силе (སྲོག, srog) года рождения; «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) называет его также днём недели ла (བླ་གཟའ, bla gza') и днём недели силы. Это не всегда день удачи вашего животного года рождения, который та же глава тоже называет днём недели ла. В этот день, как и в день недели рождения, удаются мирные и гневные дела вообще, а прежде всего перечисленные здесь.
reading.OwnDay.MOTHER_WEEKDAY=День недели стихии, порождающей вашу, считаемой по жизненной силе (སྲོག, srog) года рождения. «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) называет хорошим что угодно в дни недели матери и друга.
reading.OwnDay.FRIEND_WEEKDAY=День недели стихии, которую одолевает ваша, считаемой по жизненной силе (སྲོག, srog) года рождения. «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) называет хорошим что угодно в дни недели матери и друга.
reading.OwnDay.CHILD_WEEKDAY=День недели стихии, которую порождает ваша, считаемой по жизненной силе (སྲོག, srog) года рождения. «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) называет день недели ребёнка средним.
reading.OwnDay.ENEMY_WEEKDAY=День недели стихии, одолевающей вашу, считаемой по жизненной силе (སྲོག, srog) года рождения. «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) говорит, что в этот день следует избегать любого дела, поэтому, если указана дата рождения, «День вкратце» не даёт вам в этот день списка хороших дел.
reading.OwnDay.BIRTH_MANSION=Созвездие, через которое проходила Луна в день вашего рождения, как альманах даёт его для этого дня; час рождения позволил бы более точный расчёт, которого приложение не делает. Когда Луна снова в нём, удаются мирные и гневные дела вообще, а прежде всего перечисленные здесь.
