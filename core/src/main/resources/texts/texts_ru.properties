# Zanshin Calendar — text of the engines and readings (SPEC §8.2), Russian.
# A translation of texts.properties: the same keys and placeholders
# (CatalogTest). Readings are summaries of their cited sources, translated
# from the English and checked against the source (ROADMAP L3). Terms of the
# elemental divination follow Alexander Berzin, «Особенности тибетской
# астрологии», parts 3 and 4 (Study Buddhism): стихии, мать, ребёнок, друг,
# враг, жизненная сила, тело, могущество, конь ветра, камни.
# The shape of a reading (SPEC §8.1, rules 6 and 13): one Russian for each
# row label and each word of the vocabulary. Rows: Также называется, В силе,
# Избегать начала, Выход в путь, Ранг, Средство, Вредящие духи, Болезнь, Обряды, Ла сегодня,
# Рождение сегодня, Смерть сегодня, Скот, Планета, Пища, В течение дня, Как выпадает.
# Vocabulary: goes well — идёт хорошо (идут хорошо), goes badly — идёт плохо;
# the lists Хорошо для and Избегать; to be avoided — следует избегать; lucky,
# unlucky, mixed, neutral — благоприятно, неблагоприятно, смешанно,
# нейтрально, as the tone labels; Remedy: — Средство: (imperative); its
# image is — его образ.

