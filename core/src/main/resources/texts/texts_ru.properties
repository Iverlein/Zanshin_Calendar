EarthLordCourse.SPUG_STON=Владыки земли по Пуктону
CourseDay.otherView=другой взгляд
reading.EarthLord.SPUG_STON=По мнению Пуктона (སྤུག་སྟོན, spug ston), которое «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) приводит после поворота владык земли (ས་བདག, sa bdag), в каждом месяце есть дата успеха, когда помогают средства для владык земли, дата исчезновения, когда они не помогают и оборачиваются против совершающего, и даты, когда богатство не выдают, потому что выданное тогда богатство или скот опустошают загон: в первый месяц весны успех 5-го и 30-го, исчезновение 8-го и без выдачи богатства 1-го и 6-го; в средний 8-е, 6-е и 12-е; в последний 18-е, 6-е и 8-е; летом 1-е, 6-е и 8-е, 19-е, 26-е и 16-е, 3-е, 26-е и 28-е; осенью 19-е, 29-е и 9-е, 9-е, 12-е и 10-е, 7-е, 4-е и 27-е; зимой 27-е, 9-е и 20-е, 30-е, 2-е и 12-е вместе с 20-м, 19-е, 6-е и 30-е; весна считается с 11-го месяца. У каждого месяца есть и свой путь выкупного подношения (ཡས, yas), к которому хорошо протянуть выкупную нить: весной юго-запад, северо-запад и северо-восток; летом юго-восток, северо-запад и запад; осенью северо-восток, юго-восток и северо-запад; зимой юг, восток и северо-восток. {0}
reading.EarthLord.SPUG_STON.grub=Сегодня дата успеха: средства для владык земли помогают.
reading.EarthLord.SPUG_STON.yal=Сегодня дата исчезновения: средства для владык земли не помогают и оборачиваются вспять.
reading.EarthLord.SPUG_STON.nor=Сегодня богатство не выдают.
reading.EarthLord.NAG_CHUNG.other=Ньима Накчунг (ཉི་མ་ནག་ཆུང, nyi ma nag chung), малый чёрный день «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): этой даты нет в собственном пути текста, она из другого мнения, которое он приводит: зимние месяцы по порядку 9-е, 19-е и 29-е; весна считается с 11-го месяца. В этот день дурны дела ради умерших, невеста, освящение, пиры и погребальные обряды, прежде всего вынос богатства из дома.
reading.EarthLord.PHUNG_ZOR.other=Пунгпо Зорток (ཕུང་པོ་ཟོར་ཐོགས, phung po zor thogs), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): этой даты нет в собственном пути текста, по месяцам животных, она из другого мнения, которое он приводит, по месяцам времён года: весной 18-е, 8-е и 9-е, летом 3-е, 13-е и 9-е, осенью 7-е, 17-е и 28-е, зимой 1-е, 16-е и 9-е; весна считается с 11-го месяца. Избегают того же, что и в его пути; хороши разрушительные мантры против других.
reading.EarthLord.KI_KANG.other=Кикан (ཀི་ཀང, ki kang): этой даты нет в первом пути «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), она из второго: в месяцы тигра, коня и собаки 17-е и 28-е, свиньи, овцы и зайца 2-е и 24-е, мыши, дракона и обезьяны 8-е и 28-е, птицы, быка и змеи 16-е и 26-е; месяц тигра — 11-й. Избегают начала дел ради живых и умерших, войны, зрелищ, уплаты долгов, мирных и добродетельных дел; хороши жестокие и суровые дела.
reading.EarthLord.KI_KANG.third=Кикан (ཀི་ཀང, ki kang): этой даты нет в первом пути «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), она из третьего, который текст называет несогласным мнением и даёт для двух групп месяцев: в месяцы тигра, коня и собаки 17-е и 27-е, свиньи, овцы и зайца 2-е и 22-е; месяц тигра — 11-й. Избегают начала дел ради живых и умерших, войны, зрелищ, уплаты долгов, мирных и добродетельных дел; хороши жестокие и суровые дела.
reading.EarthLord.GNAM_KHYI.other=Намкьи Накпо (གནམ་ཁྱི་ནག་པོ, gnam khyi nag po), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): этого дня нет в первом пути текста, он из другого, по животному даты: весной в дни овцы на рассвете, в дни змеи и обезьяны в полночь, в дни тигра и птицы на заре; летом в дни зайца и обезьяны под вечер, в дни овцы и свиньи на восходе, в дни птицы, обезьяны и коня в сумерки; осенью в дни змеи и овцы с наступлением ночи, в дни дракона, коня и свиньи в утреннем тепле, в дни зайца и обезьяны утром; зимой в дни собаки, быка, дракона и тигра под вечер, в дни быка, тигра, собаки и змеи на закате, в дни тигра, зайца, свиньи и мыши после полудня; весна считается с 11-го месяца. Больших дел ради живых и умерших, прежде всего невесты, строительства и выноса тела, избегают.
reading.EarthLord.GZA_BDUN.other=Задюн (གཟའ་བདུན, gza' bdun), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): этой даты нет в собственном пути текста, она из другого, те же даты в обратном порядке: весной 28-е, 18-е и 8-е, летом 27-е, 17-е и 7-е, осенью 21-е, 11-е и 1-е, зимой 29-е, 19-е и 9-е; весна считается с 11-го месяца. Дурны все белые дела, тело умершего, погребальные обряды, строительство, невеста и первый вынос ребёнка; хороши разрушительные мантры против других.
reading.EarthLord.DBUL_PO.other=Улпо Лактонг (དབུལ་པོ་ལག་སྟོང, dbul po lag stong), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): этой даты нет в собственном пути текста, она из мнения одного человека, которое он приводит и которое расходится в четырёх месяцах: в первый месяц весны 6-е и 16-е, в последний месяц осени 9-е и 21-е, в первый месяц зимы 19-е и в средний 10-е; весна считается с 11-го месяца. Пиры и раздача богатства ведут к бедности, и большинства дел ради живых и умерших избегают.
reading.EarthLord.SDE_BRGYAD.STRIKES_other=Сегодня восемь классов наносят удар, как говорят некоторые: в последний месяц осени с 8-го по 30-е.
reading.EarthLord.KLU.STRIKES_other=Сегодня наги наносят удар, как говорят некоторые учения или тексты.
wording.remedies_for_the_earth_lords=средства для владык земли
reading.EarthLord.CLASS_TIMES.gza=Сегодня, в дату вишти, время планет.
reading.EarthLord.CLASS_TIMES.srin_po=Сегодня, в дату вишти, время ракшасов.
wording.work_with_mud=работы с глиной
wording.setting_up_growth=установка роста (སྐྱེད་འཛུགས, skyed 'dzugs), словами текста
wording.pulling_down_the_yak_wood=разборка «ячьего дерева» (གཡག་ཤིང་དགོག, g.yag shing dgog), словами текста
EarthLordCourse.NAG_CHEN=Ньима Накчен
reading.EarthLord.NAG_CHEN.other=Великий чёрный день, Ньима Накчен (ཉི་མ་ནག་ཆེན, nyi ma nag chen), — первый из владык земли (ས་བདག, sa bdag), которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) ведёт по датам: этой даты нет в собственном пути текста, она из мнения одного человека, которое он приводит: 24-е последних месяцев весны, осени и зимы и 9-е первого месяца зимы; весна считается с 11-го месяца. В этот день дурны дела ради умерших и ради живых, прежде всего вынос богатства, посвящение и освящение, невеста, строительство, погребение и торговля; дурные средства идут заодно с ним.
EarthLordCourse.ZHAG_NAG=Чёрный день
reading.EarthLord.ZHAG_NAG=Чёрный день (ཞག་ནག, zhag nag): так же, как «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) считает чёрные месяцы, — «четвёртый убийца» (བཞི་གཤེད, bzhi gshed) восходящего животного, животные на три по обе стороны от него, — он сводит месяц с днём: в месяцы мыши и коня черны дни птицы и зайца, в месяцы быка и овцы — дни собаки и дракона, в месяцы тигра и обезьяны — дни свиньи и змеи; день — это животное даты, а месяц тигра — 11-й. В чёрный день дурны место для могилы, строительство, пиры, освящение, возведение на престол, преподавание дхармы, занятие новой земли, невеста и все важные дела; грозные дела, сделанные тогда, бьют. Средство: свастика справа от двери, солнце и луна слева.
reading.EarthLord.ZHAG_NAG.other=Чёрный день (ཞག་ནག, zhag nag) по мнению Панчена Мёндровы (པཎ་ཆེན་སྨོན་འགྲོ་བ, paN chen smon 'gro ba), которое приводит «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): одна дата в каждом году — в год мыши 7-е среднего месяца весны, быка 5-е последнего, тигра 7-е первого месяца лета, зайца 7-е среднего месяца зимы, дракона 26-е последнего, змеи 9-е первого месяца осени, коня 19-е среднего, овцы 7-е последнего, обезьяны 16-е первого месяца зимы, птицы 10-е среднего месяца весны, собаки 21-е последнего месяца лета и свиньи 8-е первого месяца весны; год и весна считаются с 11-го месяца. В этот день дурно большинство дел.

# Год жизни: стихийное гадание о году жизни (WB vol. 1, pp. 255-258, 380-411; «Лунные лучи»), SPEC §5.9
