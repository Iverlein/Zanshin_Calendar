reading.ElementQuarter.OWN=Созвездие сегодняшнего дня — одно из ваших собственных: оно стоит в той четверти неба, чья стихия — стихия вашей жизненной силы (སྲོག, srog). Эти созвездия называют также созвездиями силы и ла, жизненного духа (བླ, bla). В них удаются дела и начинания, и хорошо что угодно.
reading.ElementQuarter.MOTHER=Созвездие сегодняшнего дня стоит в четверти стихии, порождающей вашу, считаемой по жизненной силе (སྲོག, srog) года рождения, как вода порождает дерево. Созвездия матери и друга хороши.
reading.ElementQuarter.FRIEND=Созвездие сегодняшнего дня стоит в четверти стихии, которую ваша одолевает, считаемой по жизненной силе (སྲོག, srog) года рождения, как дерево одолевает землю. Созвездия матери и друга хороши.
reading.ElementQuarter.CHILD=Созвездие сегодняшнего дня стоит в четверти стихии, которую ваша порождает, считаемой по жизненной силе (སྲོག, srog) года рождения, как дерево порождает огонь. Созвездия ребёнка средние.
reading.ElementQuarter.ENEMY=Созвездие сегодняшнего дня стоит в четверти стихии, которая одолевает вашу, считаемой по жизненной силе (སྲོག, srog) года рождения, как железо одолевает дерево. В отличие от дня недели врага, когда избегают любого дела, у созвездий врага нет своего толкования.
reading.GraveMansion.GREAT=Созвездие сегодняшнего дня — большое могильное созвездие (དུར་སྐར, dur skar) вашей стихии, считаемой по жизненной силе (སྲོག, srog) года рождения. Могильные созвездия считают для умерших, при похоронах; для живых у них нет своего толкования.
reading.GraveMansion.SMALL=Созвездие сегодняшнего дня — малое могильное созвездие (དུར་སྐར, dur skar) вашей стихии, считаемой по жизненной силе (སྲོག, srog) года рождения. Могильные созвездия считают для умерших, при похоронах; для живых у них нет своего толкования.
reading.LaElement=Ла, жизненный дух (བླ, bla), считается матерью жизненной силы (སྲོག, srog): его стихия порождает стихию жизненной силы, вода — дерево, огонь — землю. Жизненная сила — это сила животного года рождения: тигр и заяц — дерево, лошадь и змея — огонь, птица и обезьяна — железо, мышь и свинья — вода, остальные четыре — земля.
reading.LaHours=В течение любого дня ла, жизненный дух (བླ, bla), движется по телу: от обеих ступней на рассвете вверх до середины груди в полдень, снова вниз к обеим ступням на закате, а ночью он разлит выше пупка. Там, где он пребывает, избегают кровопускания, прижигания и иного лечения.
reading.SevenRedYear=Ваш год возраста приходится на семь-красный, зеркало духов цен (བཙན, btsan): приходят колющие боли, болезни крови и желчи, опухоли и жар. По одному счёту в этот год избегают кровопускания и прижигания, по другому их сделают над телом; не отнимайте жизни, остерегайтесь болезни и совершите крест цен (བཙན་མདོས, btsan mdos).
reading.Humour.WIND=Болезнь ветра (རླུང, rlung) поднимается летом, вечером и перед рассветом. Старики — люди ветра, а холодное ветреное место — страна ветра. При болезни ветра держитесь тёплого места и приятного общества.
reading.Humour.BILE=Болезнь желчи (མཁྲིས་པ, mkhris pa) поднимается осенью, в полдень и в полночь. Взрослые — люди желчи, а сухое и очень жаркое место — страна желчи. При болезни желчи пребывайте в покое в прохладном месте.
reading.Humour.PHLEGM=Болезнь слизи (བད་ཀན, bad kan) поднимается весной, в сумерках и утром. Дети — люди слизи, а сырое и жирное место — страна слизи. При болезни слизи трудитесь и держитесь тёплого места.
reading.ElementIllness={0} Сколько бы видов болезней ни называли, они сходятся в пяти стихиях: дерево — ветер, огонь — кровь, земля — желчь, железо — слизь, вода — холод, и у болезни каждой стихии своё место, своя дверь и свои признаки.
reading.ElementIllness.WOOD=Болезнь дерева — болезнь ветра (རླུང, rlung). Снаружи она лежит в пояснице, внутри — в желудке и печени, а её дверь — глаз: когда она вошла, глаз застилает пелена, он краснеет, и на зубах ложится чёрный налёт. Её больные избегают рыхлой, изрытой земли, трещин, дома на сквозняке и леса.
reading.ElementIllness.WOOD.illness=охватившая во время дерева: сердцу невесело, болезни желудка, рвота, понос и отёки; ветра и слизи (བད་ཀན, bad kan) больше
reading.ElementIllness.FIRE=Болезнь огня — болезнь крови. Снаружи она лежит в верхней части тела, внутри — в сердце и кишках, а её дверь — язык: когда она вошла, корень языка и зубы чернеют, и язык сохнет. Её больные избегают грубой красной земли с колючками, обращённой к солнцу.
reading.ElementIllness.FIRE.illness=охватившая во время огня: во рту сухо, болят грудь и спина; поднимаются желчь (མཁྲིས་པ, mkhris pa), отупение и слизь (བད་ཀན, bad kan), и её знают как болезнь жара
reading.ElementIllness.EARTH=Болезнь земли — болезнь желчи (མཁྲིས་པ, mkhris pa). Снаружи она лежит в голове и конечностях, внутри — в селезёнке и кишках, а её дверь — губы: когда она вошла, губы опухают и шелушатся. Больные слизью (བད་ཀན, bad kan) и желчью избегают ровной, жёлтой, тяжёлой земли.
reading.ElementIllness.EARTH.illness=охватившая во время земли: тяжесть, головокружение и слабость во рту, гниющий род болезни, жжение и боль; днём легче, а ночью поднимаются отупение и желчь (མཁྲིས་པ, mkhris pa)
reading.ElementIllness.IRON=Болезнь железа — болезнь слизи (བད་ཀན, bad kan). Снаружи она ходит в костях, внутри лежит в лёгких, а её дверь — нос: когда она вошла, нос заложен, и сочатся гной и жёлтая вода. Больные дурным ветром (རླུང, rlung) избегают тенистых ям, обрывов и разрушенных стен.
reading.ElementIllness.IRON.illness=охватившая во время железа: тело тяжёлое, верхней части тела неспокойно, жар сжимает сосуды и приходит гной, с гневом и желанием, или одна лишь слизь (བད་ཀན, bad kan)
reading.ElementIllness.WATER=Болезнь воды — холод. Снаружи она лежит ниже пупка, внутри — в почках, а её дверь — ухо: когда она вошла, ухо мокнет, с гноем и шелушением. Её больные избегают мягких тёмных низин, сырой земли, болот и рек, где растёт холод.
reading.ElementIllness.WATER.illness=охватившая во время воды: тело и конечности скованы или дрожат, или тело чувствительно; рвота и невесёлое сердце, жёлтая вода, холод и болезни сосудов
reading.MedicalSeason.EARLY_WINTER=Ранней зимой (དགུན་སྟོད, dgun stod) холод закрывает поры и пищеварительный жар крепнет, а недостаток пищи истощает тело. Ешьте сладкое, кислое и солёное, мясной бульон и жир; натирайтесь кунжутным маслом, носите шкуры и сапоги, грейтесь у огня и на солнце и держитесь внутренней комнаты.
reading.MedicalSeason.LATE_WINTER=Поздняя зима (དགུན་སྨད, dgun smad) ещё холоднее, и для неё тоже хвалят поведение ранней зимы: сладкое, кислое и солёное, мясной бульон и жир, кунжутное масло, шкуры и сапоги, тепло огня и солнца и внутреннюю комнату. За зиму в теле скапливается слизь.
reading.MedicalSeason.SPRING=Весной (དཔྱིད་ཀ, dpyid ka) скопленная за зиму слизь поднимается, когда солнечное тепло ослабляет пищеварительный жар. Ешьте горькое, острое и вяжущее, старый ячмень, мясо сухих земель и мёд, кипячёную воду и имбирный отвар; изгоняйте слизь трудом и растиранием и сидите в тени благоуханного сада.
reading.MedicalSeason.SO_GA=Ранним летом (སོ་ག, so ga) очень жаркое солнце отнимает силы. Ешьте сладкое, лёгкое, жирное и прохладное и откажитесь от солёного, острого и кислого, от трудов и солнца; мойтесь прохладной водой, пейте пиво, разбавленное водой, носите тонкую одежду и держитесь прохладных благоуханных комнат, тени и ветерка.
reading.MedicalSeason.SUMMER=Летом (དབྱར, dbyar), в дожди, тучи и дождь, ветер и холод, испарения земли и мутная вода вредят пищеварительному жару. Ешьте сладкое, кислое и солёное, лёгкое, тёплое и жирное, пейте пиво сухих земель; живите наверху, подальше от прохлады. За дожди в теле скапливается желчь.
reading.MedicalSeason.AUTUMN=Осенью (སྟོན་ཀ, ston ka) скопленная в дожди желчь поднимается. Ешьте сладкое, горькое и вяжущее, носите одежду, надушенную камфарой, сандалом и ветивером, и живите в домах, окроплённых водой. Хвалят очищение слабительным осенью и рвотным весной, а летом — мягкую клизму.

# The year of age's readings that need a relative's signs (ROADMAP P2, SPEC §5.9.1)
KinObstacle.LOG_MEN_ON_WIFE=смещённый знак на году жены
KinObstacle.LOG_MEN_ON_HUSBAND=смещённый знак на году мужа
KinObstacle.LOG_MEN_ON_FATHER=смещённый знак на году отца
KinObstacle.LOG_MEN_ON_SON=смещённый знак на году сына
KinObstacle.LOG_MEN_ON_DEATH=смещённый знак на году смерти родителя
KinObstacle.SPOUSES=препятствие супругов
KinObstacle.BRIDGE_END=конец моста
KinObstacle.SECRET=тайное препятствие
KinObstacle.SPOUSES_TWO_BLACK=супруги на двух чёрных
reading.NatalTrigram={0} Триграмма рождения (སྐྱེས་སྤར, skyes spar) — это триграмма, на которой стоит мать в год рождения, удача матери (མ་ཀླུང, ma klung). Она говорит о вине предков, о нраве рождённого на ней и о богах и духах, что идут с ним.
reading.NatalTrigram.LI=Рождённый на триграмме огня (ལི, li), месте клинков и очага, любит пересуды, занимает место отца и несёт вину без вины. Предки процветали, потом разделились на четыре-пять ветвей, и многие пали от клинка. Земли и могилы рода обращены на юг и запад.
reading.NatalTrigram.LI.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po), духи цен (བཙན, btsan) и демоны (བདུད, bdud) идут впереди как его боги; вредят духи гонгпо (འགོང་པོ, 'gong po), а вред владык земли (ས་བདག, sa bdag) трудно отвратить
reading.NatalTrigram.LI.illness=пороки головы и органов чувств; у мужчины знаки крови, у женщины выкидыш и смерть ребёнка; болезнь ньен (གཉན, gnyan) от ссор из-за очага и большие пороки у детей
reading.NatalTrigram.KHON=Рождённый на триграмме земли (ཁོན, khon), месте духа могилы, говорит мягко, но горд и свиреп, богат в начале жизни и беден в конце. Ошибка при закладке могилы предков два поколения назад принесла большие потери. Детей трудно вырастить, а с покойниками и нечистотой нужна осторожность.
reading.NatalTrigram.KHON.spirits=чёрно-бурые богини нагов (ཀླུ, klu) идут впереди как его боги; вредят владыки земли (ས་བདག, sa bdag) и нагини
reading.NatalTrigram.KHON.illness=род глуп и нем и в раздоре с нагами (ཀླུ, klu), горбат и хром; смерти от клинка; ссоры и болезни, и проклятия, что настигают быстро
reading.NatalTrigram.DWA=Рождённый на триграмме озера (དྭ, dwa), месте клинка родоубийства (དམེ, dme), добр, но скор на гнев, смел и отважен и преуспевает в учении. Три-четыре поколения назад предки убили недобрым способом и приняли в дом осквернённого этим. Богатства мало, а клятва, нарушенная со стороны матери, стоит земли.
reading.NatalTrigram.DWA.spirits=духи цен (བཙན, btsan) идут впереди как его боги; вредят дрэво (གྲེ་བོ, gre bo)
reading.NatalTrigram.DWA.illness=колющие боли и смерть от клинка
reading.NatalTrigram.KHEN=Рождённый на триграмме неба (ཁེན, khen), месте хромых и потерь, горд и умён, но редко доволен, как ни старается. Среди предков два или четыре поколения назад были горбатые, хромые и немые. Дом переезжает, радости теряется больше, чем людей, и появляется несколько врагов.
reading.NatalTrigram.KHEN.spirits=духи гонгпо (འགོང་པོ, 'gong po) идут впереди как его боги; вредят духи гьялпо (རྒྱལ་པོ, rgyal po)
reading.NatalTrigram.KHAM=Рождённый на триграмме воды (ཁམ, kham), месте нечистоты и чёрных даров, скор на страдание, трудно с ним согласиться, внутри смятен, снаружи гладок. Четыре-пять поколений назад предки потеряли одного из своих в чужих руках или приняли его в дом через кровосмешение. Имя отца стоит низко, имя братьев высоко, и невестки уходят.
reading.NatalTrigram.KHAM.spirits=наги (ཀླུ, klu), духи цен (བཙན, btsan), белые богини и ма-мо (མ་མོ, ma mo) идут впереди как его боги; вредят сенмо (བསེན་མོ, bsen mo)
reading.NatalTrigram.GIN=Рождённый на триграмме горы (གིན, gin), месте владык земли (ས་བདག, sa bdag) и очага, упрям, тяжёл телом, немногословен и твёрд в словах. Два-три поколения назад предки умирали от проказы, от болезни ньен (གཉན, gnyan) или от клинка из-за очага. Род тонок: один отец, один сын.
reading.NatalTrigram.GIN.spirits=грозные боги-воители (དགྲ་ལྷ, dgra lha) и воинство Ямы (གཤིན་རྗེ, gshin rje) идут впереди как его боги; вредят владыки земли (ས་བདག, sa bdag)
reading.NatalTrigram.ZIN=Рождённый на триграмме грома (ཟིན, zin), месте прерванного рода и духа основания (རྨང་འདྲེ, rmang 'dre), искусен и хитёр, безрассуден и скуп дома. Дети и богатство приходят с большой силой. Одно или три поколения назад было срублено дерево ньен (གཉན, gnyan), и многие погибли от дерева и клинка.
reading.NatalTrigram.ZIN.spirits=наги (ཀླུ, klu), демоны (བདུད, bdud) и владыки местности идут впереди как его боги; вредит дух основания (རྨང་འདྲེ, rmang 'dre)
reading.NatalTrigram.ZON=Рождённый на триграмме ветра (ཟོན, zon), месте духа порчи (རྦད་འདྲེ, rbad 'dre) и нагов (ཀླུ, klu), любит насмешку и гнев и тянется сравняться с высокими. Два или четыре поколения назад предки поссорились с учителем или насылали духов порчи, и за этим пришли безумие и насильственные смерти. Род теперь очень тонок.
reading.NatalTrigram.ZON.spirits=духи ман (སྨན, sman) идут впереди как его боги; вредят духи гьялпо (རྒྱལ་པོ, rgyal po) и духи гонгпо (འགོང་པོ, 'gong po)
reading.NatalTrigram.ZON.illness=внезапная болезнь в конце жизни
reading.KinObstacle={0} Эти препятствия года жизни приходят от чужих знаков: года рождения супруга, родителя или сына, года смерти родителя или триграммы матери при рождении.
reading.KinObstacle.LOG_MEN_ON_WIFE=Смещённый знак (ལོག་མེན, log men) мужа стоит на году рождения жены. Это не к добру для жены, и его образ — «попала в западню».
reading.KinObstacle.LOG_MEN_ON_HUSBAND=Смещённый знак (ལོག་མེན, log men) жены стоит на году рождения мужа. Это не к добру для мужа, и его образ — «надел шапку демона».
reading.KinObstacle.LOG_MEN_ON_FATHER=Смещённый знак (ལོག་མེན, log men) сына стоит на году рождения отца. Это не к добру для отца, и его образ — «ведёт призрака».
reading.KinObstacle.LOG_MEN_ON_SON=Смещённый знак (ལོག་མེན, log men) отца стоит на году рождения сына. Это не к добру для сына, и его образ — «отец держит тело сына».
reading.KinObstacle.LOG_MEN_ON_DEATH=Смещённый знак (ལོག་མེན, log men) стоит на году, в который умер отец или мать. Это не к добру, и его образ — «ушёл в бытие мёртвых».
reading.KinObstacle.SPOUSES=Муж и жена стоят на одной триграмме (སྤར་ཁ, spar kha) года: суровый год супругов (བཟའ་ཤུག, bza' shug), время, когда приходят и радость, и горе. Помогает, если тот, у кого привязанность, уедет из дома.
reading.KinObstacle.SPOUSES.remedy=совершите обряды триграммы и мева (སྨེ་བ, sme ba), заплатите подать мёртвых и совершите обряд выноса тела
reading.KinObstacle.BRIDGE_END=Двое из одного дома, не муж и жена, стоят на одной триграмме (སྤར་ཁ, spar kha) года. Сурового года супругов (བཟའ་ཤུག, bza' shug) между ними нет, есть лишь меньшая вина конца моста (ཟམ་ཐུག, zam thug).
reading.KinObstacle.SECRET=Триграмма (སྤར་ཁ, spar kha) года пришла на триграмму рождения: тайное препятствие (གསང་ཀེག, gsang keg), вор, которого трудно заметить. Приходят испуг, внезапные поветрия и раздоры, и болезнь тела или ума неизбежна.
reading.KinObstacle.SECRET.remedy=не ходите к изголовью больного, не оплакивайте и избегайте клятв; читайте сутру Амитаюса сто тысяч раз и отошлите нитяной крест (མདོས, mdos) демона
reading.KinObstacle.SECRET.rites=пока мать жива — обряды триграммы и мева (སྨེ་བ, sme ba), согласные с её удачей; после её смерти — обряд удачи с заслугой, сделанной ради неё, и табличкой с её именем
reading.KinObstacle.SPOUSES_TWO_BLACK=Муж и жена оба стоят на мева (སྨེ་བ, sme ba) года «два чёрных». Это не к добру для обоих, год, которого надо остерегаться, и его образ — «держит тело, плечо и клык поменялись местами».
# Расчёт рождения (ROADMAP R2): пять детей по триграмме рождения (WB т. 1, гл. 22, с. 294) и триграммы родителей при рождении (с. 326)
BirthChild.PARENTS_GOD=бог родителей
BirthChild.CHILDRENS_GLORY=слава детей
BirthChild.LIFE=согласие, то есть жизнь
BirthChild.SPIRIT=дух, которого можно пережить
BirthChild.DEMON=демон, которого не пережить
reading.BirthChild={0} Стихия триграммы рождения (སྐྱེས་སྤར, skyes spar), поставленная против жизненной силы (སྲོག, srog) года рождения, говорит, кто из пяти рождённый.
reading.BirthChild.PARENTS_GOD=Рождённый на триграмме матери жизненной силы — бог родителей (ཕ་མ་ལྷ, pha ma lha). Его образ — взошедшее солнце жизни.
reading.BirthChild.CHILDRENS_GLORY=Рождённый на триграмме сына жизненной силы — слава детей (བུ་ཚ་དཔལ, bu tsha dpal). Его образ — солнце без облаков.
reading.BirthChild.LIFE=Рождённый на триграмме той же стихии, что и жизненная сила, — согласие, то есть жизнь (མཐུན་པ་ཚེ, mthun pa tshe). Его образ — солнце, колеблемое ветром, средняя доля жизни.
reading.BirthChild.SPIRIT=Рождённый на триграмме стихии, которую жизненная сила одолевает, — дух, которого можно пережить (ཐུབ་པ་འདྲེ, thub pa 'dre). Его образ — солнце в облаках.
reading.BirthChild.DEMON.WOOD=Рождённый на триграмме врага жизненной силы — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud). Его образ — закатившееся солнце, отрезанная доля жизни: для годов Тигра и Зайца смерть в пятнадцать.
reading.BirthChild.DEMON.IRON=Рождённый на триграмме врага жизненной силы — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud). Его образ — закатившееся солнце, отрезанная доля жизни: для годов Птицы и Обезьяны смерть в двенадцать.
reading.BirthChild.DEMON.FIRE=Рождённый на триграмме врага жизненной силы — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud). Его образ — закатившееся солнце, отрезанная доля жизни: для годов Лошади и Змеи смерть в девять.
reading.BirthChild.DEMON.WATER=Рождённый на триграмме врага жизненной силы — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud). Его образ — закатившееся солнце, отрезанная доля жизни: для годов Мыши и Свиньи смерть в шесть.
reading.BirthChild.DEMON.EARTH=Рождённый на триграмме врага жизненной силы — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud). Его образ — закатившееся солнце, отрезанная доля жизни: для годов Быка, Дракона, Овцы и Собаки смерть в три года.
BirthOmen.FATHER_DIES=смерть отца
BirthOmen.MOTHER_DIES=смерть матери
BirthOmen.SKY_BAD_FOR_FATHER=не к добру для отца, на триграмме неба
BirthOmen.FATHER_SKY_SON_FIRE=не к добру для отца, сын на триграмме огня
BirthOmen.EARTH_BAD_FOR_MOTHER=не к добру для матери, на триграмме земли
BirthOmen.WIND_NO_SISTER=нет сестры, на триграмме ветра
BirthOmen.MOUNTAIN_NO_SISTER=нет сестры, на триграмме горы
BirthOmen.MOUNTAIN_BAD_FOR_BROTHERS=не к добру для братьев
BirthOmen.HEARTHS=счёт очажных камней
reading.BirthOmen={0} Триграммы (སྤར་ཁ, spar kha) родителей в год рождения, где триграмма матери — триграмма рождения, читаются по полу и году ребёнка.
reading.BirthOmen.FATHER_DIES=Сын рождается, когда отец стоит на триграмме грома (ཟིན, zin), а мать — на триграмме озера (དྭ, dwa). Отец скоро умирает.
reading.BirthOmen.MOTHER_DIES=Дочь рождается, когда отец стоит на триграмме горы (གིན, gin), а мать — на триграмме грома (ཟིན, zin). Мать скоро умирает.
reading.BirthOmen.SKY_BAD_FOR_FATHER=Ребёнок, рождённый на триграмме неба (ཁེན, khen), не к добру для отца, если это сын матери года Собаки или Дракона или он сам года Собаки или Дракона.
reading.BirthOmen.FATHER_SKY_SON_FIRE=Сын рождается на триграмме огня (ལི, li), когда отец стоит на триграмме неба (ཁེན, khen). Это не к добру для отца.
reading.BirthOmen.EARTH_BAD_FOR_MOTHER=Дочь, рождённая на триграмме земли (ཁོན, khon), не к добру для матери, если мать года Быка или Овцы или дочь сама этих годов.
reading.BirthOmen.WIND_NO_SISTER=У ребёнка, рождённого на триграмме ветра (ཟོན, zon) от матери года Собаки или Дракона, и у сына года Собаки или Дракона, рождённого на ней, не будет сестры, которую звать сестрой.
reading.BirthOmen.MOUNTAIN_NO_SISTER=У ребёнка, рождённого на триграмме горы (གིན, gin) от матери года Быка или Овцы, не будет сестры, которую звать сестрой.
reading.BirthOmen.MOUNTAIN_BAD_FOR_BROTHERS=Дочь года Быка или Овцы, рождённая на триграмме горы (གིན, gin), не к добру для своих братьев.
reading.BirthOmen.HEARTHS=Дочь этого года, рождённая на этой триграмме, считает очажные камни (སྐྱེད་པོ་བགྲང, skyed po bgrang): она снова и снова заводит свой дом.
Clan.KEG=Кег
Clan.JI=Джи
Clan.KUNGS=Кунг
Clan.SHANG=Шанг
Clan.U=У
ClanYear.GREAT_PENALTY=год большой кары рода
ClanYear.SMALL_PENALTY=год малой кары рода
ClanYear.MOTHER=год-мать рода
ClanYear.POWER=собственный год силы рода
ClanYear.SON=год-сын рода
ClanYear.FRIEND=год-друг рода
ClanYear.ENEMY=год-враг рода
reading.ClanYear={0} Особый камень (སྒོས་རྡེལ, sgos rdel) ставит год рождения против стихии своего рода (རུས, rus), и год выпадает одним из семи.
reading.ClanYear.GREAT_PENALTY=Рождённый в год большой кары рода (ཆད་ཆེན, chad chen) становится большим человеком, добрым и сильным, вождём пятерых и пастухом пяти загонов. Не принимайте монашества: оставайтесь мирянином.
reading.ClanYear.SMALL_PENALTY=Рождённый в год малой кары рода (ཆད་ཆུང, chad chung) видит, как прерываются многие линии отцовского рода, и большие взлёты и падения. Взять врага в родню — к разорению.
reading.ClanYear.MOTHER=Рождённый в год-мать рода получает большую силу от доброй материнской стороны. Ссоры с роднёй едва не уводят его из дома, и в отцовском роду копятся обиды.
reading.ClanYear.POWER=Рождённый в собственный год силы рода (དབང་ལོ, dbang lo) получает достижение (དངོས་གྲུབ, dngos grub) силы и вкушает удачу отцовского рода. Слишком искусная речь ведёт к разорению.
reading.ClanYear.SON=Рождённый в год-сын рода поднимается на опоре отца, и в старости у него пища, богатство и сила. Отцовский род его защищает, и жить посреди селения хорошо.
reading.ClanYear.FRIEND=Рождённый в год-друг рода, год, который бьёт стихия, не получает пользы от богатства родителей. Пища и богатство встают врагами, и взлётов, падений и переездов много.
reading.ClanYear.ENEMY=Рождённый в год-враг рода встречает врагов, которых не исчерпать убийством: его образ — сто сыновей, встающих за сто убитых отцов. Немного сдерживать свои желания — хорошо.
PowerYear.KHA_YAN=жизненная сила и могущество едины
PowerYear.KHONG_NONG=могущество порождает жизненную силу
PowerYear.SE_ZHIG=жизненная сила порождает могущество
PowerYear.DUN_KHUR=могущество отсекает жизненную силу
PowerYear.KHA_RAL=жизненная сила отсекает могущество
reading.PowerYear={0} Могущество (དབང་ཐང, dbang thang) года рождения, поставленное против его жизненной силы (སྲོག, srog), делает его одним из пяти годов — камнем, без которого нельзя.
reading.PowerYear.KHA_YAN=Рождённый в год кха-ян (ཁ་ཡན, kha yan), где жизненная сила и могущество одной стихии, никем не возвышен и сам низко не стоит. Взлёты и падения велики, и приходит слава.
reading.PowerYear.KHA_YAN.spirits=призраки убитых клинком и владыки земли (ས་བདག, sa bdag)
reading.PowerYear.KHONG_NONG=Рождённый в год кхонг-нонг (ཁོང་ནོང, khong nong), где могущество порождает жизненную силу, живёт долго, но дети и богатство редко приходят вместе. Первая половина жизни пуста, затем восходит счастье.
reading.PowerYear.KHONG_NONG.spirits=владыки земли (ས་བདག, sa bdag) и дух, ушедший вслед за вынесенным из дома богатством
reading.PowerYear.SE_ZHIG=Рождённый в год се-шиг (སེ་ཞིག, se zhig), где жизненная сила порождает могущество, стоит выше многих, и боги-воители (དགྲ་ལྷ, dgra lha) его хранят. Удача полей и богатства убывает.
reading.PowerYear.SE_ZHIG.illness=болезни холода
reading.PowerYear.DUN_KHUR=Рождённый в год дюн-кхур (འདུན་ཁུར, 'dun khur), где могущество отсекает жизненную силу, ясен умом. Но как ни торгуй, богатство не растёт, близкие становятся врагами, и горя много.
reading.PowerYear.DUN_KHUR.spirits=владыки земли (ས་བདག, sa bdag), наги (ཀླུ, klu) и ньен (གཉན, gnyan)
reading.PowerYear.KHA_RAL=Рождённый в год кха-рэл (ཁ་རལ, kha ral), где жизненная сила отсекает могущество, видит, как распадается его славный род. Время с матерью коротко; его образ — снежный лев, разлучённый со снегами.
reading.PowerYear.KHA_RAL.remedy=отошлите крест гьялпо (རྒྱལ་མདོས, rgyal mdos)
reading.PowerYear.KHA_RAL.spirits=духи умерших, нарушивших обеты (དམ་སྲི, dam sri), и духи гонгпо (འགོང་པོ, 'gong po), что уносят детей
reading.PowerYearOf={0} По своей стихии каждый вид года падает на одну сторону семьи.
reading.PowerYearOf.KHA_YAN.WOOD=Этот кха-ян (ཁ་ཡན, kha yan) — братьев отца. Предки разделили землю или могилы, и грозит смерть от клинка или опасность родоубийства (དམེ, dme); сильный дядя рядом лишь недолго.
reading.PowerYearOf.KHA_YAN.FIRE=Этот кха-ян (ཁ་ཡན, kha yan) — домочадцев. Рождённый сильным, мужчина или женщина, всё же видит раскол дома; люди и богатство то растут, то убывают, радость и горе чередуются, детей трудно вырастить.
reading.PowerYearOf.KHA_YAN.WATER=Этот кха-ян (ཁ་ཡན, kha yan) — детей. Многие дети теряются, а выжившим может недоставать чувства; одна жизнь знает три радости и горя, и родителя можно рано потерять.
reading.PowerYearOf.KHA_YAN.IRON=Этот кха-ян (ཁ་ཡན, kha yan) — родни и дяди по матери. Дядя хороший, но приходят ссоры с роднёй из-за доспехов и оружия; вторая половина жизни счастливее первой.
reading.PowerYearOf.KHA_YAN.EARTH=Этот кха-ян (ཁ་ཡན, kha yan) — матери и бабушки. Пока они живы, всего вдоволь, и время с ними долгое; дурно выбранная для них могила вредит, так что выбирайте её тщательно.
reading.PowerYearOf.KHONG_NONG.WATER=Этот кхонг-нонг (ཁོང་ནོང, khong nong) — детей: ребёнок от кровосмешения или скверны может родиться без какого-то чувства. Поле прервавшегося рода или разорённый дом, если их взять, приносят пользу.
reading.PowerYearOf.KHONG_NONG.WOOD=Этот кхонг-нонг (ཁོང་ནོང, khong nong) — братьев отца: они могут умереть на чужбине, от клинка или не оставить рода. Сыновей рождается много, но остаются немногие.
reading.PowerYearOf.KHONG_NONG.EARTH=Этот кхонг-нонг (ཁོང་ནོང, khong nong) — матери и бабушки: они расстались со своим домом, или ребёнок от скверны рождается без какого-то чувства.
reading.PowerYearOf.KHONG_NONG.IRON=Этот кхонг-нонг (ཁོང་ནོང, khong nong) — дяди по матери: на его стороне взлёты и падения очень велики.
reading.PowerYearOf.KHONG_NONG.FIRE=Этот кхонг-нонг (ཁོང་ནོང, khong nong) — свой и домочадцев: некоторых детей трудно вырастить, или остаёшься один; клятвы, нарушенные из-за людей и богатства, подтачивают стада и дом.
reading.PowerYearOf.SE_ZHIG.FIRE=Этот се-шиг (སེ་ཞིག, se zhig) — домочадцев: предки процветали, но при тебе потери велики, как волк в отаре. Супруг уходит первым, но и в одиночестве добываешь доброе имя.
reading.PowerYearOf.SE_ZHIG.EARTH=Этот се-шиг (སེ་ཞིག, se zhig) — матери и бабушки: на их стороне дом раскололся, или кто-то умер от клинка или изнуряющей болезни. Сила детей мала: рождается много, остаются немногие.
reading.PowerYearOf.SE_ZHIG.WATER=Этот се-шиг (སེ་ཞིག, se zhig) — богатства: предки были богаты, а ты голодаешь. Заслугу за твои дела присваивают другие, а могилы и дома часто переносят.
reading.PowerYearOf.SE_ZHIG.WOOD=Этот се-шиг (སེ་ཞིག, se zhig) — братьев отца: в их время потери, взлёты и падения очень велики. Твоя доброта больше доброты предков, и чужие любят тебя больше своих.
reading.PowerYearOf.SE_ZHIG.IRON=Этот се-шиг (སེ་ཞིག, se zhig) — дяди по матери: на его стороне велики взлёты, падения и потери, дома переносят и делят, приходят ссоры с роднёй.
reading.PowerYearOf.DUN_KHUR.IRON=Этот дюн-кхур (འདུན་ཁུར, 'dun khur) — дяди по матери и родни: взлёты и падения с ними велики. Богатый живёт недолго, долгоживущий беден.
reading.PowerYearOf.DUN_KHUR.WATER=Этот дюн-кхур (འདུན་ཁུར, 'dun khur) — богатства: потери, взлёты и падения добра очень велики, близкие становятся враждебны, а в доме горе и радость чередуются.
reading.PowerYearOf.DUN_KHUR.FIRE=Этот дюн-кхур (འདུན་ཁུར, 'dun khur) — домочадцев: дом раскалывается, или приходят смерти, или рано теряешь родителя; детей очень трудно вырастить, и грозит внезапный испуг.
reading.PowerYearOf.DUN_KHUR.EARTH=Этот дюн-кхур (འདུན་ཁུར, 'dun khur) — матери и бабушки: они умирают рано, от клинка или от болезни ньен (གཉན, gnyan), и помощь от них мала.
reading.PowerYearOf.DUN_KHUR.WOOD=Этот дюн-кхур (འདུན་ཁུར, 'dun khur) — братьев отца: время с ними коротко и помощь мала. Родня отца держит разные земли, близкие встают врагами, детей трудно вырастить.
reading.PowerYearOf.KHA_RAL.EARTH=Этот кха-рэл (ཁ་རལ, kha ral) — матери и бабушки: помощь от них мала, время с ними коротко. Задуманное не выходит, а незадуманное случается.
reading.PowerYearOf.KHA_RAL.IRON=Этот кха-рэл (ཁ་རལ, kha ral) — дяди по матери и родни: время с ними коротко, или грозит обида. Вредят владыки земли (ས་བདག, sa bdag) и духи гьялпо (རྒྱལ་པོ, rgyal po).
reading.PowerYearOf.KHA_RAL.WOOD=Этот кха-рэл (ཁ་རལ, kha ral) — братьев отца: время с ними коротко, или грозит обида. В их роду есть опасность родоубийства (དམེ, dme), пресечения рода, смерти от клинка или мора.
reading.PowerYearOf.KHA_RAL.FIRE=Этот кха-рэл (ཁ་རལ, kha ral) — свой: в род может прийти кровосмешение, и его детям может недоставать чувства. Даже богатому трудно помочь.
reading.PowerYearOf.KHA_RAL.WATER=Этот кха-рэл (ཁ་རལ, kha ral) — богатства и друзей: добро то растёт, то убывает, приходят ссоры с роднёй и обвинения без вины, а собранное не становится богатством.
reading.LuckTriad={0} Тройка года рождения — три животных одного коня ветра (ཀླུང་རྟ, klung rta) — читается отдельно.
reading.LuckTriad.WOOD=Рождённый в год Мыши, Дракона или Обезьяны имеет отца, дядей и деда, сильных, как духи цен (བཙན, btsan), мудрых и наделённых заслугами. Под их защитой клевета не вредит, и ниже других не опустишься.
reading.LuckTriad.IRON=Рождённый в год Тигра, Лошади или Собаки владеет богатством — железной горой, которую не пробьёт долото вора. Добрые боги-хранители вытащат даже из очага, а на стороне родни много заслуг.
reading.LuckTriad.WATER=Рождённый в год Птицы, Быка или Змеи подобен царю, взошедшему на трон: свита и родня его берегут и хвалят. Хоть собственные заслуги малы, богатство и удача при нём.
reading.LuckTriad.FIRE=Рождённый в год Свиньи, Овцы или Зайца может лишь на время пользоваться собранным матерью и бабушкой, и духи гонгпо (འགོང་པོ, 'gong po) бедности не дают ему прирасти. Дети процветают.
YearPlace.FIRST=первый год
YearPlace.MIDDLE=средний год
YearPlace.LAST=последний год
reading.YearPlace={0} Двенадцать годов делятся на первые, средние и последние (ར་འབྲིང་ཐ་མ, ra 'bring tha ma), по четыре года в каждом ряду.
reading.YearPlace.FIRST=Рождённому в первый год — Тигра, Обезьяны, Свиньи или Змеи — грозит в конце остаться сиротой без братьев и родителей. Предки поссорились со жрецами, и сын может не удержать отцовский дом.
reading.YearPlace.MIDDLE=Рождённый в средний год — Мыши, Лошади, Птицы или Зайца — мало обязан отцу и матери и много самому себе. Первая половина жизни пуста, конец хорош; приходят ссоры с роднёй и скитания на чужбине.
reading.YearPlace.LAST=Рождённый в последний год — Быка, Овцы, Собаки или Дракона — видит, как дом и крепость переносят или рушат, и ссоры из-за полей и дома. Сын не удерживает отцовский дом, но в работе и земледелии он усерден.
reading.YearPlaceFull={0} Это полное чтение первых, средних и последних (ར་འབྲིང་ཐ་མ, ra 'bring tha ma) годов.
reading.YearPlaceFull.FIRST=У рождённого в первый год жизненная сила поедает мать, тело — отца, а могущество — богатство. Грубый на руку и резкий на слово, он рано слышит много упрёков, но поздняя жизнь счастлива, тепла, как солнце в старости.
reading.YearPlaceFull.MIDDLE=У рождённого в средний год собственная доброта больше родительской, и богатство родителей не помогает. Он не подмешивает яд в пищу и не лжёт; вспыльчивый, ясный на слово и светлый сердцем, он и после смерти не попадает в ад.
reading.YearPlaceFull.LAST=Рождённому в последний год сильно грозит переезд с земли и из дома, и он живёт в двух местах. Он любит благородных учителей и не терпит жены низкого рода; близкие его ненавидят, а дальние любят.
BirthCut.VITALITY_BODY=жизненная сила отсекает тело
BirthCut.VITALITY_DESTINY=жизненная сила отсекает могущество
BirthCut.VITALITY_LUCK=жизненная сила отсекает коня ветра
BirthCut.BODY_VITALITY=тело отсекает жизненную силу
BirthCut.BODY_DESTINY=тело отсекает могущество
BirthCut.BODY_LUCK=тело отсекает коня ветра
BirthCut.DESTINY_BODY=могущество отсекает тело
BirthCut.DESTINY_VITALITY=могущество отсекает жизненную силу
BirthCut.DESTINY_LUCK=могущество отсекает коня ветра
BirthCut.LUCK_BODY=конь ветра отсекает тело
reading.BirthCut={0} Аспекты собственного года рождения отсекают друг друга — отсечение и разрыв (གཅོད་འདྲལ, gcod 'dral); где один вместо этого порождает другой, чтение обращается к добру.
reading.BirthCut.VITALITY_BODY=Когда жизненная сила отсекает тело, мало воздаёшь за доброту родителей и в юности живёшь добротой родни по матери. Начинаешь много, достигаешь мало, и многие дети теряются.
reading.BirthCut.VITALITY_DESTINY=Когда жизненная сила отсекает могущество, земли и поля предков уходят к чужим, а собственное богатство утекает. Переездов много, и в собственных делах не хватает ума.
reading.BirthCut.VITALITY_LUCK=Когда жизненная сила отсекает коня ветра, другим трудно угодить, как ни старайся, и на стороне родни по матери велики взлёты и падения. Одна жизнь знает две радости и горя, выживает половина детей.
reading.BirthCut.BODY_VITALITY=Когда тело отсекает жизненную силу, из рода четырёх братьев корень держат теперь лишь трое, и детей трудно вырастить: половина живёт, половина умирает. Внезапных испугов и болезней много.
reading.BirthCut.BODY_DESTINY=Когда тело отсекает могущество, близкие из отцовского рода встают врагами, богатство иссякает, дом раскалывается. Многие дети теряются, и в отцовском роду живут большие обиды.
reading.BirthCut.BODY_LUCK=Когда тело отсекает коня ветра, родня по матери встаёт врагами, а духи разорения вредят матери и ребёнку. Те, кому помогаешь, не благодарны, и за один день приходят две радости и горя.
reading.BirthCut.DESTINY_BODY=Когда могущество отсекает тело, старшие рода рассеиваются, близкие становятся врагами, пища обращается ядом. Вредят духи гонгпо (འགོང་པོ, 'gong po), и болезней много.
reading.BirthCut.DESTINY_VITALITY=Когда могущество отсекает жизненную силу, в семью входит дурная пара, и ребёнок может быть немым или слепым. Дом раскалывается, а в старости встают колющие боли или болезни крови.
reading.BirthCut.DESTINY_LUCK=Когда могущество отсекает коня ветра, нажитое предками теряется, у братьев и сестёр дурная слава, а богатство всегда приносит ссоры.
reading.BirthCut.LUCK_BODY=Когда конь ветра отсекает тело, потеря богатства велика, и род детей пустеет.
GroupCut.PAIR_BODY=могущество и жизненная сила отсекают тело
GroupCut.PAIR_DESTINY=жизненная сила и тело отсекают могущество
GroupCut.PAIR_LUCK=могущество и жизненная сила отсекают коня ветра
GroupCut.STAR_DESTINY=трое отсекают могущество
GroupCut.STAR_VITALITY=трое отсекают жизненную силу
GroupCut.STAR_LUCK=трое отсекают коня ветра
GroupCut.STAR_NOURISH=трое питают жизненную силу
reading.GroupCut={0} Два или три аспекта года рождения могут действовать на один вместе, и это читается отдельно от одиночных отсечений.
reading.GroupCut.PAIR_BODY=Когда могущество и жизненная сила вместе отсекают тело, сила тела так и не приходит, детей трудно вырастить, и в конце становишься слугой. Его образ — бык при трупе.
reading.GroupCut.PAIR_DESTINY=Когда жизненная сила и тело вместе отсекают могущество, дети беднеют, хоть родители и оставили большое богатство. Пища и богатство — радуга в небе, и в конце служишь другим.
reading.GroupCut.PAIR_LUCK=Когда могущество и жизненная сила вместе отсекают коня ветра, многие сыновья держат каждый свой очаг, и болезней много.
reading.GroupCut.STAR_DESTINY=Когда жизненная сила, тело и конь ветра вместе отсекают могущество, можно владеть сотней яков и тысячей овец, а в конце уйти нищим. Его образ — звезда колеса тысячи лучей.
reading.GroupCut.STAR_VITALITY=Когда тело, могущество и конь ветра вместе отсекают жизненную силу, можно всю жизнь медитировать и практиковать, а в конце умереть от клинка.
reading.GroupCut.STAR_LUCK=Когда жизненная сила, тело и могущество вместе отсекают коня ветра, сыновей и внуков может быть много, а в конце роду грозит пресечение. Его образ — звезда красной птицы, берущей огонь.
reading.GroupCut.STAR_NOURISH=Когда тело, могущество и конь ветра вместе питают жизненную силу, даже у женщины, дожившей до шестидесяти, род не прерывается. Его образ — звезда, переходящая реку мёртвых.
reading.YearNature={0} Каждое из двенадцати животных года даёт рождённому в нём нрав — меру жизненной силы (སྲོག, srog) при рождении.
reading.YearNature.MOUSE=Рождённый в год мыши таит глубокие обиды и не находит уму покоя. Скорый на ночную кражу, он имеет много врагов. Беспечный снаружи и осторожный внутри, лёгкий на язык и скупой на руку, он бросает большие дела ради малых.
reading.YearNature.OX=Рождённый в год быка упрям и неохотно берётся за работу, любит лежать и плохо обращается с вещами. Его трудно переубедить, и советы его тяжелы. Он медлителен и терпелив, широк умом и любит поесть.
reading.YearNature.TIGER=Рождённый в год тигра храбр, ловок и свиреп, ясен умом и велик сердцем и говорит, что нет никого лучше. Он опирается на родню, груб в поведении и резок на слово и любит торговлю и кости.
reading.YearNature.RABBIT=Рождённый в год зайца ест мало и довольствуется малым: ему хватает горсти еды и одежды от холода. Он хитёр и искусен в средствах, дурен внутри, но улыбчив.
reading.YearNature.RABBIT.illness=слизь и желчь, недуги рта и зубов
reading.YearNature.DRAGON=Рождённый в год дракона не свиреп и не громок, но его не презирают, и он никогда не откладывает работу. Быстро устающий, белый сердцем и шумный, он слушает других и мало верит в себя. Болеет он редко, но тяжело.
reading.YearNature.SNAKE=Рождённый в год змеи жесток, груб и полон гнева и сжигает собственный ум. Сила сидит в его сердце, и чужая зависть ему не вредит. Упрямый и тёмный сердцем, он не отступает от решённого.
reading.YearNature.SNAKE.illness=болезни желудка и печени
reading.YearNature.HORSE=Рождённый в год лошади наделён силой чудес и великим усердием и кончает жизнь счастливо, как бы ни преследовали его злодеи. Он любит лошадей и игры, ходит быстро, ставит чужие дела выше своих и мало спит. Взлёты и падения велики.
reading.YearNature.SHEEP=Рождённый в год овцы немногословен, туп умом, упрям и любит поесть. Он никому не вредит, никому не помогает и не платит за добро. Терпеливый и белый сердцем, он медлителен, и с едой ему везёт.
reading.YearNature.MONKEY=Рождённый в год обезьяны нетерпелив, лёгок телом и слаб сердцем, и ум его — как перо на горном перевале. Он любит шутки, не держит слова, много говорит и лжёт и высоко ставит себя.
reading.YearNature.BIRD=Рождённый в год птицы растрачивает отцовское богатство и зарывает материнское. Гордый и хвастливый, он знает чужую меру, но не свою. Страстный, он не может без друзей, любит мыться, мало спит и выходит нарядным.
reading.YearNature.DOG=Рождённый в год собаки горд, гневлив и свиреп, мало любит своих и чужих и идёт к цели напрямик. Не находя уму покоя, он сжигает себя, как дрова. Он держится правил, хоть и упрям, и любит благородных.
reading.YearNature.PIG=Рождённый в год свиньи туп умом и мало разбирает, чиста ли еда, а это хорошая основа для йогина. Он любит поесть, говорит грубо и никого не боится, хвастает и лжёт без нужды.
reading.SixtyYear={0} Каждый из шестидесяти годов даёт рождённому в нём нрав, срок жизни, число препятствий (བར་ཆད, bar chad) и долю детей.
reading.SixtyYear.WOOD_MOUSE=Рождённый в год деревянной мыши ясен умом и искусен в ремёслах, хитёр и речист и обманывает людей уловками. Пища и богатство средние. Жизнь длится 75 лет, препятствий семь, детей пять или трое.
reading.SixtyYear.WOOD_MOUSE.illness=многие болезни нагов (ཀླུ་ནད, klu nad)
reading.SixtyYear.WOOD_OX=Рождённый в год деревянного быка много спит по ночам, честен умом, но очень скуп. Пища и богатство собираются. Жизнь длится полных 60 лет, препятствий шесть.
reading.SixtyYear.WOOD_OX.spirits=владыки земли (ས་བདག, sa bdag), потревоженные рытьём могилы, или владыки земли деревьев
reading.SixtyYear.FIRE_TIGER=Рождённый в год огненного тигра гневлив и свиреп, силён телом, круглоглаз и очень горд, мало верит и мало терпит. Он не помогает ни себе, ни друзьям и становится мужем двух жён. Жизнь длится 79 лет, препятствий пять, детей четверо.
reading.SixtyYear.FIRE_TIGER.illness=хроническая внутренняя болезнь, раны от клинка, проказа, болезни нагов (ཀླུ་ནད, klu nad) и слизь
reading.SixtyYear.FIRE_RABBIT=Рождённый в год огненного зайца порочен умом и резок речью, хитёр и неправдив. Он следит за чужими пороками, хвалит свои достоинства и любит женщин. Пища, богатство и блага велики. Жизнь длится 75 лет, препятствий семь.
reading.SixtyYear.FIRE_RABBIT.spirits=владыки земли (ས་བདག, sa bdag) и духи гьялпо (རྒྱལ་པོ, rgyal po)
reading.SixtyYear.FIRE_RABBIT.illness=болезни лимфы и холода и сильный ветер сердца
reading.SixtyYear.EARTH_DRAGON=Рождённый в год земляного дракона неправдив и ленив, любит пиво и чужих жён, но доволен умом. Лёгкий умом и хитрый, он мало страдает от болезней. Жизнь длится 55 лет, препятствий шесть, детей пять или семь.
reading.SixtyYear.EARTH_SNAKE=Рождённый в год земляной змеи силён сердцем и искусен, пища, богатство и блага велики, но стоит бояться воров, грабителей и врагов. Гордый, гневливый и завистливый, он любит дурных друзей или обращается к Дхарме. Жизнь длится 79 лет, препятствий четыре, детей шестеро.
reading.SixtyYear.EARTH_SNAKE.spirits=владыки земли (ས་བདག, sa bdag) воды и дерева
reading.SixtyYear.IRON_HORSE=Рождённый в год железной лошади очень ленив и любит родню, смотрит на чужие пороки и забывает свои и любит поесть. Богатство сильно теряется, детей трудно вырастить. Жизнь длится 57 лет, препятствий девять, детей четверо.
reading.SixtyYear.IRON_HORSE.spirits=владыки земли (ས་བདག, sa bdag), потревоженные постройкой крепости
reading.SixtyYear.IRON_HORSE.illness=больше всего холод и ветер
reading.SixtyYear.IRON_SHEEP=Рождённый в год железной овцы полон телом и смирен чувствами, но слаб памятью. Враги вредят много, и клеветы часты. Жизнь длится 81 год, препятствий четыре, детей мало.
reading.SixtyYear.IRON_SHEEP.spirits=лу-цены (ཀླུ་བཙན, klu btsan)
reading.SixtyYear.IRON_SHEEP.illness=болезни глаз
reading.SixtyYear.WATER_MONKEY=Рождённый в год водяной обезьяны искусен, остёр чувствами и памятлив и становится хозяином пяти городов. Владыка земли (ས་བདག, sa bdag), подобный пылающей куче огня, не вредит, а хранит. Грозят родоубийство (དམེ, dme) и насилие. Жизнь длится 57 лет, препятствий семь, детей около трёх.
reading.SixtyYear.WATER_BIRD=Рождённый в год водяной птицы рассеян телом и умом, непостоянен и забывчив, любит странствовать и имеет много друзей. Друзья, соседи и близкие встают врагами, и он попадает под чужую власть. Жизнь длится 60 лет, препятствий девять, детей двое.
reading.SixtyYear.WATER_BIRD.spirits=владыки земли (ས་བདག, sa bdag) деревьев, лу-ман (ཀླུ་སྨན, klu sman) родников и лугов и духи гонгпо (འགོང་པོ, 'gong po) горожан
reading.SixtyYear.WATER_BIRD.illness=ветер и жар
reading.SixtyYear.WOOD_DOG=Рождённый в год деревянной собаки искусен, остёр чувствами, памятлив и хорош телом и становится владыкой города. Добрые лу-цены (ཀླུ་བཙན, klu btsan) ему друзья. Грозят родоубийство (དམེ, dme) и грязные дела. Жизнь длится 79 лет, препятствий пять, детей трое.
reading.SixtyYear.WOOD_PIG=Рождённый в год деревянной свиньи велик телом и плотью, очень гневлив и свиреп и втайне легко гордится. Друзья и любовники его обманывают, и он рискует стать дурным. Помогает богатство пресёкшегося рода. Жизнь длится 64 года, препятствий пять.
reading.SixtyYear.FIRE_MOUSE=Рождённый в год огненной мыши решителен и памятлив, сильно жаждет богатства и пищи и умеет говорить о чужих пороках. Он усерден в краже и убийстве. Жизнь длится 68 лет, препятствий пять.
reading.SixtyYear.FIRE_MOUSE.spirits=лу-ман (ཀླུ་སྨན, klu sman) с вершин сланцевых и снежных гор
reading.SixtyYear.FIRE_MOUSE.illness=болезнь желудка, расходящийся жар и болезнь сердца
reading.SixtyYear.FIRE_OX=Рождённый в год огненного быка велик телом, много спит и туп умом, и глаза его слабеют. Пища и блага велики, зерно и слуги умножаются. Жизнь длится 71 год, препятствий восемь, один сын и две дочери.
reading.SixtyYear.FIRE_OX.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po) храмов
reading.SixtyYear.FIRE_OX.illness=больше всего слизь
reading.SixtyYear.EARTH_TIGER=Рождённый в год земляного тигра полон телом, гневлив и любит убивать, жаден до еды и искусен во лжи. Вред от врагов и демонов мал. Жизнь длится 72 года, препятствий семь, детей около двух.
reading.SixtyYear.EARTH_TIGER.spirits=владыки земли (ས་བདག, sa bdag) полей и лу-цены (ཀླུ་བཙན, klu btsan) от подножия скалистых гор
reading.SixtyYear.EARTH_TIGER.illness=опухоли и водянка
reading.SixtyYear.EARTH_RABBIT=Рождённый в год земляного зайца говорлив и очень мудр и знает грамматику и трактаты. Пища и богатство малы. Он сходится с чужими жёнами, и ссор с роднёй со всех сторон много. Жизнь длится 50 лет, препятствий шесть, ребёнок один.
reading.SixtyYear.EARTH_RABBIT.illness=болезнь лёгких
reading.SixtyYear.IRON_DRAGON=Рождённый в год железного дракона полон телом и силён, горд и искусен в речи. Он усерден во зле и откладывает добродетель, гладок языком и дурен сердцем. Богатство сильно теряется, но блага очень велики. Жизнь длится 80 лет, препятствий три, детей один или пять.
reading.SixtyYear.IRON_DRAGON.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po) и другие, что насылают безумие и припадки
reading.SixtyYear.IRON_SNAKE=Рождённый в год железной змеи ясен умом и искусен в ремёслах и любит выведывать чужие пороки. Грабители и враги вредят много. Пища и богатство сперва малы, потом велики, а время с родителями коротко. Жизнь длится 78 лет, препятствий шесть, детей трое.
reading.SixtyYear.IRON_SNAKE.spirits=направленное на него колдовство (གཏད་ཕུར, gtad phur)
reading.SixtyYear.IRON_SNAKE.illness=болезнь горла, внезапная болезнь или безумие и припадки
reading.SixtyYear.WATER_HORSE=Рождённый в год водяной лошади очень мудр, мало заблуждается и славен. Прямой внутри и мало лживый, он не попадает под чужую власть. Урожай то есть, то нет, но пища и богатство велики. Жизнь длится 77 или 57 лет, препятствий восемь, детей три или четыре.
reading.SixtyYear.WATER_HORSE.spirits=владыки земли (ས་བདག, sa bdag) и дух разорения (འཕུང་འདྲེ, 'phung 'dre) богатства пресёкшегося рода
reading.SixtyYear.WATER_HORSE.illness=блуждающий ветер сердца
reading.SixtyYear.WATER_SHEEP=Рождённый в год водяной овцы мало мудр, любит странствовать и много жаждет. Пища и блага невелики, стоит бояться воров и врагов. Лошади и скот теряются. Жизнь длится 73 года, препятствий пять, детей мало.
reading.SixtyYear.WATER_SHEEP.spirits=владыки земли (ས་བདག, sa bdag), что есть ньен (གཉན, gnyan) дерева и воды
reading.SixtyYear.WATER_SHEEP.illness=много слизи
reading.SixtyYear.WOOD_MONKEY=Рождённый в год деревянной обезьяны полон телом и очень печален, любит дурных друзей, мало спит, имеет много врагов и хитёр. Мало заботясь о себе, он держит два дома. Пища то прибывает, то убывает. Жизнь длится 78 лет, препятствий семь, детей пять или один.
reading.SixtyYear.WOOD_MONKEY.spirits=духи цен (བཙན, btsan), владыки земли (ས་བདག, sa bdag) и духи гьялпо (རྒྱལ་པོ, rgyal po) речных долин и крутых вершин
reading.SixtyYear.WOOD_MONKEY.illness=много болезней
reading.SixtyYear.WOOD_BIRD=Рождённый в год деревянной птицы бледен телом и страдает многими хроническими болезнями. Родня ссорится, друзья и близкие встают врагами. Он любит драки. Жизнь длится полных 60 лет, детей один или трое.
reading.SixtyYear.WOOD_BIRD.spirits=демоницы (འདྲེ་མོ, 'dre mo) и дрэмо (གྲེ་མོ, gre mo), нарушившие обеты
reading.SixtyYear.FIRE_DOG=Рождённый в год огненной собаки много болеет, словно род пресекается, но добродетелен умом и прежде всего терпелив. Огонь грозит сжечь его дом. Жизнь длится 68 лет, препятствий семь, детей трое.
reading.SixtyYear.FIRE_DOG.spirits=владыки земли (ས་བདག, sa bdag) уединённых мест, дрэво (གྲེ་བོ, gre bo) и духи цен (བཙན, btsan)
reading.SixtyYear.FIRE_DOG.illness=жар и желчь
reading.SixtyYear.FIRE_PIG=Рождённый в год огненной свиньи слаб телом и много страдает от болезней, а знатные в роду встают врагами. Огонь грозит сжечь его дом. Жизнь длится 68 лет, препятствий семь, детей трое.
reading.SixtyYear.FIRE_PIG.spirits=дрэво (གྲེ་བོ, gre bo), духи цен (བཙན, btsan) и владыки земли (ས་བདག, sa bdag)
reading.SixtyYear.FIRE_PIG.illness=больше всего жар и желчь
reading.SixtyYear.EARTH_MOUSE=Рождённый в год земляной мыши мал ростом и любит убивать, честен, но порочен умом, гладок языком и своеволен. Грозит смерть от оружия или клинка. Жизнь длится 68 лет, препятствий семь, ребёнок один.
reading.SixtyYear.EARTH_MOUSE.illness=слизь, давящая на желудок
reading.SixtyYear.EARTH_OX=Рождённый в год земляного быка тяжёл телом, горд и придирчив, груб, упрям и свиреп умом, и люди его немного не любят. Пища и богатство малы. Жизнь длится полных 50 лет, препятствий семь, ребёнок один.
reading.SixtyYear.EARTH_OX.spirits=владыки земли (ས་བདག, sa bdag) поместья
reading.SixtyYear.IRON_TIGER=Рождённый в год железного тигра гневлив и свиреп, любит убивать и раздавать, хорош телом и светел кожей. Он жаждет мяса, пива и наслаждений и говорит резко. Пища и блага непостоянны. Жизнь длится 60 лет, внезапных бед пять, детей двое или четверо.
reading.SixtyYear.IRON_TIGER.spirits=духи цен (བཙན, btsan) и духи гьялпо (རྒྱལ་པོ, rgyal po)
reading.SixtyYear.IRON_RABBIT=Рождённый в год железного зайца широк умом, верен и честен, усерден и остёр мудростью, любящ и щедр, с большими достоинствами. Грозит смерть от клинка. Пища и богатство скромны. Жизнь длится 61 год, препятствий пять, детей пятеро.
reading.SixtyYear.IRON_RABBIT.spirits=родоубийство (དམེ, dme), владыки земли (ས་བདག, sa bdag) и сенмо (བསེན་མོ, bsen mo) пустых крепостей и храмов
reading.SixtyYear.IRON_RABBIT.illness=много колющих болей
reading.SixtyYear.WATER_DRAGON=Рождённый в год водяного дракона носит на теле родинку, снова и снова меняет землю и дом и любит стрельбу из лука и игры. Многие линии богатства и детей пресекаются. Пища и богатство качаются от полноты к пустоте. Жизнь длится 62 года, препятствий шесть, детей пять или один.
reading.SixtyYear.WATER_SNAKE=Рождённый в год водяной змеи носит в сердце великий гнев и клевещет. Многие линии рода пресекаются. Лёгкий на язык и мелкий сердцем, он имеет мало детей. Жизнь длится 68 лет.
reading.SixtyYear.WATER_SNAKE.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po), вредящие богатству, и владыки земли (ས་བདག, sa bdag) красных скал
reading.SixtyYear.WATER_SNAKE.illness=холод и ветер
reading.SixtyYear.WOOD_HORSE=Рождённый в год деревянной лошади хитёр и тяжёл в общении, гневлив и туп умом, мало верит и мало стремится. Он наделён большой силой и выносливостью в подвижничестве, любит друзей и много говорит. Жизнь длится 60 лет, ребёнок один.
reading.SixtyYear.WOOD_HORSE.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po) и владыки земли (ས་བདག, sa bdag)
reading.SixtyYear.WOOD_HORSE.illness=ветер и слизь
reading.SixtyYear.WOOD_SHEEP=Рождённый в год деревянной овцы полон телом и ясен чувствами, но туп умом и любит поесть. Жизнь длится 60 лет, препятствий три, детей двое.
reading.SixtyYear.FIRE_MONKEY=Рождённый в год огненной обезьяны любит одежду и украшения и становится караванщиком пяти городов. Смелый лицом и сильный, он страстен, горд, плох с богатством и скор на чужие пороки. Пища и блага велики. Жизнь длится 67 лет, препятствий пять, детей пятеро.
reading.SixtyYear.FIRE_MONKEY.illness=много ветра и желчи
reading.SixtyYear.FIRE_BIRD=Рождённый в год огненной птицы многодумен, хитёр и говорлив, ловок руками и смел лицом и усерден в краже и убийстве. Забывчивый и полный желаний, он очень любит кошек. Клинка и болезни стоит сильно бояться. Жизнь длится 65 лет, препятствий шесть.
reading.SixtyYear.FIRE_BIRD.spirits=демоницы (འདྲེ་མོ, 'dre mo) кладбищ и храмов
reading.SixtyYear.EARTH_DOG=Рождённый в год земляной собаки нетерпелив и гневлив, полон замыслов и больших желаний и любит насмехаться над людьми. Ему снится, что он водится с мёртвыми, сердце его невесело, и благ мало. Жизнь длится 70 лет, препятствий семь, детей трое или четверо.
reading.SixtyYear.EARTH_DOG.spirits=пожирающий дух (ཟ་འདྲེ, za 'dre) прадеда
reading.SixtyYear.EARTH_DOG.illness=очень много ветра и желчи
reading.SixtyYear.EARTH_PIG=Рождённый в год земляной свиньи мало знает, много терпит от врагов и мало получает помощи от родни и друзей. Пища и блага велики. Жизнь длится 67 лет, препятствий шесть, детей двое.
reading.SixtyYear.EARTH_PIG.spirits=мужской дух (ཕོ་འདྲེ, pho 'dre), которому служили прежде, и владыки земли (ས་བདག, sa bdag) поля в форме рыбы
reading.SixtyYear.IRON_MOUSE=Рождённый в год железной мыши полон телом и ясен умом, любит шутки, верен, способен помочь и навредить, и врагов у него мало. Он любит драки, трудится больше для других, чем для себя, и все его чтут. Жизнь длится 57 лет, препятствий шесть, детей пятеро.
reading.SixtyYear.IRON_OX=Рождённый в год железного быка лёгок телом, знает всякое ремесло и многое понимает. Болезни и враги вредят мало. Он много спит и ленив, свиреп и очень упрям, но друзья и царь им довольны. Жизнь длится 55 лет, препятствий семь, детей двое.
reading.SixtyYear.IRON_OX.spirits=владыки земли (ས་བདག, sa bdag) вод
reading.SixtyYear.WATER_TIGER=Рождённый в год водяного тигра груб телом и бодр, любуется собой и любит похвалу, и пороки его ума трудно исправить. Белый на словах и чёрный в глубине, он крадёт чужих жён и расстаётся со своей. Жизнь длится 71 год, препятствий семь, ребёнок один.
reading.SixtyYear.WATER_RABBIT=Рождённый в год водяного зайца никому не доверяет, отворачивается, говоря, и водится с дурными друзьями. Любящий пиво и сон, забывчивый и скупой, он занимает отцовское место. Ему снятся великие пропасти. Жизнь длится 72 года.
reading.SixtyYear.WATER_RABBIT.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po) кладбищ и храмов
reading.SixtyYear.WOOD_DRAGON=Рождённый в год деревянного дракона искусен в ремёслах, мягок и красноречив, лёгок в общении, всё время в разъездах и очень завистлив. Приходят пища, богатство и могущество. Жизнь длится 66 лет, препятствий шесть, детей мало.
reading.SixtyYear.WOOD_DRAGON.spirits=владыки земли (ས་བདག, sa bdag) малых родников
reading.SixtyYear.WOOD_DRAGON.illness=больше всего желчь
reading.SixtyYear.WOOD_SNAKE=Рождённый в год деревянной змеи мелок умом, худ телом и очень своеволен, любит благородных и не любит низких. Болезни легки, дети приходят, и блага велики. Широкий на словах и узкий в глубине, он плох с богатством. Жизнь длится 77 лет, препятствий четыре.
reading.SixtyYear.FIRE_HORSE=Рождённый в год огненной лошади гневлив, свиреп и легко гордится, велик выгодой и славой и любит драки. Любя лошадей и собак, он вредит людям, но усердно трудится для друзей. Под конец богатство мало. Жизнь длится 78 лет, препятствий семь, детей двое.
reading.SixtyYear.FIRE_HORSE.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po)
reading.SixtyYear.FIRE_HORSE.illness=колющие боли в лёгких и сильный жар
reading.SixtyYear.FIRE_SHEEP=Рождённый в год огненной овцы полон телом, прям и дальновиден и достигает задуманного. Приятный голосом, он жаждет богатства. Детей и внуков много, но враги и духи вредят много. Жизнь длится 77 лет, препятствий семь.
reading.SixtyYear.FIRE_SHEEP.spirits=владыки земли (ས་བདག, sa bdag) треугольного поля
reading.SixtyYear.FIRE_SHEEP.illness=болезнь почек и хроническая болезнь
reading.SixtyYear.EARTH_MONKEY=Рождённый в год земляной обезьяны лёгок в общении и красив в поведении, спокоен умом и искусен в речи. Каждое дело приносит плод, гордости мало, и все считают его достойным почёта. Жизнь длится 78 лет, смертельных опасностей девять, детей трое.
reading.SixtyYear.EARTH_MONKEY.spirits=владыки земли (ས་བདག, sa bdag) круглых полей, господского рода
reading.SixtyYear.EARTH_MONKEY.illness=ветер и слизь
reading.SixtyYear.EARTH_BIRD=Рождённый в год земляной птицы ясен умом и любит людей, но завистлив, скуп, горд и страстен. Глаза и чувства слабеют. Жизнь длится 70 лет, препятствий семь, детей шестеро.
reading.SixtyYear.EARTH_BIRD.spirits=владыки земли (ས་བདག, sa bdag) домов и полей
reading.SixtyYear.EARTH_BIRD.illness=больше всего желчь
reading.SixtyYear.IRON_DOG=Рождённый в год железной собаки ясен умом и красив в поведении, бел сердцем и усерден в добродетели, но мало знает о мире. Он знает стыд, много спит, и зерно и богатство у него умножаются. Стоит бояться грабителей. Жизнь длится 77 лет, препятствий семь, детей трое или четверо.
reading.SixtyYear.IRON_PIG=Рождённый в год железной свиньи ясен умом и красив в поведении, все приносят ему подношения, у него две жены и очень большая слава. Жизнь длится 70 лет, препятствий семь, детей двое или четверо.
reading.SixtyYear.WATER_MOUSE=Рождённый в год водяной мыши очень красив и вынослив умом, страстен и любит кошек. Внутри он полон обмана и очень жаден до пищи и богатства. Жизнь длится 72 года, препятствий семь, детей двое или пятеро.
reading.SixtyYear.WATER_MOUSE.spirits=владыки земли (ས་བདག, sa bdag), что есть ньен (གཉན, gnyan) деревьев, с востока
reading.SixtyYear.WATER_OX=Рождённый в год водяного быка очень туп, много спит и ленив, недоброжелателен и резок речью и очень своеволен. Он видит смерть многих детей. Жизнь длится 70 лет, препятствий семь.
reading.SixtyYear.WATER_OX.spirits=владыки земли (ས་བདག, sa bdag) мест сожжения
reading.SixtyYear.WOOD_TIGER=Рождённый в год деревянного тигра гневлив и свиреп и любит драки. Страстный, завистливый и своевольный, он заставляет молчать всех, кто не свой. Пища и богатство велики. Грозит смерть от клинка. Жизнь длится 66 лет, препятствий пять, детей трое.
reading.SixtyYear.WOOD_TIGER.spirits=владыки земли (ས་བདག, sa bdag), а также духи гьялпо (རྒྱལ་པོ, rgyal po) и теуранг (ཐེའུ་བྲང, the'u brang), пришедшие вслед за козами и ослами
reading.SixtyYear.WOOD_TIGER.illness=опухоли, водянка и болезнь горла
reading.SixtyYear.WOOD_RABBIT=Рождённый в год деревянного зайца очень хитёр, очень любит женщин и крадёт чужих жён. Любуясь собой, он строит много замыслов. Болезней и врагов стоит сильно бояться. Жизнь длится 67 лет, препятствий шесть, а дети приходят и рано, и поздно.
reading.SixtyYear.WOOD_RABBIT.spirits=серак (བསེ་རག, bse rag) и другие, пришедшие вслед за козами и ослами
reading.SixtyYear.FIRE_DRAGON=Рождённый в год огненного дракона полон телом и богат. Родня ссорится, воры и враги вредят много. Жадный и небрежный с вещами, он ловок руками. Пища и блага велики. Жизнь длится 71 год, препятствий семь, детей двое.
reading.SixtyYear.FIRE_DRAGON.spirits=теуранг (ཐེའུ་བྲང, the'u brang), пришедший вслед за богатством
reading.SixtyYear.FIRE_DRAGON.illness=ветер и желчь
reading.SixtyYear.FIRE_SNAKE=Рождённый в год огненной змеи полон телом, редко болеет и богат спутниками. Богатый, он становится владыкой города, и все его поддерживают. Он искусен в ремёслах и трактатах. Под конец приходит смерть от клинка. Жизнь длится 71 год, препятствий семь, детей двое.
reading.SixtyYear.FIRE_SNAKE.spirits=наги (ཀླུ, klu) и владыки земли (ས་བདག, sa bdag) пустых крепостей и развалин и могилы предка, разрытой птицами и собаками
reading.SixtyYear.FIRE_SNAKE.illness=ветер и желчь
reading.SixtyYear.EARTH_HORSE=Рождённый в год земляной лошади храбр, нетерпелив и непостоянен в словах, и учёные и простые одинаково на него надеются. Заслуги встречают большие препятствия, враги и болезни вредят много. Жизнь длится 75 лет, препятствий семь, детей двое.
reading.SixtyYear.EARTH_HORSE.spirits=владыки земли (ས་བདག, sa bdag) поля в форме полумесяца
reading.SixtyYear.EARTH_SHEEP=Рождённый в год земляной овцы часто болеет и боится врагов, а братья и сёстры враждуют из-за богатства. Радость и горе чередуются. Он смел, своеволен и горд, и ум его тянется к другому полу. Жизнь длится 60 лет, препятствий четыре.
reading.SixtyYear.EARTH_SHEEP.spirits=духи проказы и клинка
reading.SixtyYear.IRON_MONKEY=Рождённый в год железной обезьяны красив и приятен, радует всех, кто его видит, и очень богат. Искусный, но расточительный, он может совершить родоубийство (དམེ, dme). Стоит бояться войны и врагов, но старость счастлива. Жизнь длится 70 лет, препятствий восемь, детей пять или один.
reading.SixtyYear.IRON_MONKEY.spirits=ма-мо (མ་མོ, ma mo) и вред от обид и скверны (གྲིབ, grib)
reading.SixtyYear.IRON_BIRD=Рождённый в год железной птицы велик славой и могуществом, богат богатством и зерном и много ест и пьёт. Страстный, он становится главой людей и всегда живёт в достатке. Жизнь длится 70 лет, препятствий семь, детей четверо.
reading.SixtyYear.IRON_BIRD.spirits=дух родоубийства (དམེ་འདྲེ, dme 'dre) и дух проказы (མཛེ་འདྲེ, mdze 'dre)
reading.SixtyYear.IRON_BIRD.illness=ветер и жар
reading.SixtyYear.WATER_DOG=Рождённый в год водяной собаки всегда скуп, носит много некрасивых отметин и усерден в злых делах. Стоит бояться болезней, оружия, врагов и царя, а родня и друзья его не признают. Доля детей и богатства мала. Жизнь длится 63 года.
reading.SixtyYear.WATER_DOG.spirits=препятствующие духи (བགེགས, bgegs), владыки земли (ས་བདག, sa bdag), серак (བསེ་རག, bse rag) и духи гьялпо (རྒྱལ་པོ, rgyal po)
reading.SixtyYear.WATER_PIG=Рождённый в год водяной свиньи широк знанием и твёрд умом, открыто горд и завистлив и богат. Он становится хозяином скота, пищи и зерна. Жизнь длится 60 лет, препятствий пять, детей четверо.
reading.SixtyYear.WATER_PIG.spirits=наги (ཀླུ, klu), задетые при рытье могилы, или владыки земли (ས་བདག, sa bdag) деревьев, или вред со стороны дяди по матери
reading.BodyNature={0} Стихия тела (ལུས, lus) года рождения даёт одно из пяти тел, и у каждого своя доля для рождённого с ним.
reading.BodyNature.WOOD=Тело дерева — блуждающее богатство: полое внутри, оно бродит повсюду. Вред богам предков не даёт делу принести плод. Что есть — кажется неправдой, чего нет — кажется ложью, и богатство качается от полноты к пустоте. Его образ — разорённый город гандхарвов (དྲི་ཟ, dri za).
reading.BodyNature.FIRE=Тело огня — блуждающее бытие: мужчина или женщина, он вдовеет рано или поздно. Его образы — труп птицы, унесённый ветром, труп рыбы, унесённый водой, разбитая чаша, сломанный черпак и сломанные стрелы и лук, связанные вместе.
reading.BodyNature.EARTH=Тело земли движется, как песчаный холм, и его дом стоит на колесе могил. В верховьях и низовьях долины рода раскрываются могилы. Как кони, покидающие конюшню, семья расходится вслед за чужим кровом и стадами, и удержать свой дом до конца трудно.
reading.BodyNature.IRON=Тело железа — широкое и полое небо, любящее родоубийство (དམེ, dme) и драку. Как ни свирепо оно, своя жизнь коротка. Среди отцовской родни кого-то убили клинком на пустом перевале; если нет, клинок обращается к нему самому. Его образ — солнце и луна, упавшие на землю.
reading.BodyNature.IRON.remedy=наденьте защиту от оружия, подавите вредящего духа клинка и много делайте для продления жизни и спасения жизней
reading.BodyNature.WATER=Тело воды — река, кружащаяся страданием, блуждающая среди болезней и духов; прежняя жизнь кончилась во чреве. На теле должен проступить знак — глаз солнца или узор пламени или ваджры. Без него нагиня обеими руками держит желудок, и позвоночник и рёбра в опасности.
reading.BodyNature.WATER.remedy=с великим усердием подносите торму нагам (ཀླུ་གཏོར, klu gtor) и водную торму (ཆུ་གཏོར, chu gtor)
reading.KhaSrog={0} Тридцать стихий парных годов (ཁ་སྲོག, kha srog) дают каждой паре годов тело, отсечённое от части черепахи (རུས་སྦལ, rus sbal), и вину предков за её недуги.
reading.KhaSrog.WOOD_MOUSE=Рождённый в год деревянной мыши или деревянного быка имеет тело железа, выплавленного из камня, отсечённое от бедра и ляжки черепахи. Предки провинились перед чем-то железным. Дом приходит в упадок, дети умирают молодыми. Рождённый на триграмме озера (དྭ, dwa) слаб в ногах и пояснице.
reading.KhaSrog.WOOD_MOUSE.spirits=дух рода (རུས་འདྲེ, rus 'dre), от духа собственной выделки, живущего в доме
reading.KhaSrog.WOOD_MOUSE.illness=понос, боль бёдер и ляжек, подагра, хромота и водянка
reading.KhaSrog.FIRE_TIGER=Рождённый в год огненного тигра или огненного зайца имеет тело огня, самого грубого, отсечённое от тепла кишок черепахи. Предки были свирепы, но мужчину поразил яд, женщина осквернила очаг, и бог был отвергнут. Рождённый на триграмме воды (ཁམ, kham) мало тёпел телом.
reading.KhaSrog.FIRE_TIGER.spirits=наги (ཀླུ, klu), что держатся за бабку по матери
reading.KhaSrog.FIRE_TIGER.illness=заразная лихорадка
reading.KhaSrog.EARTH_DRAGON=Рождённый в год земляного дракона или земляной змеи имеет тело дерева, лежащего в лесу, отсечённое от чрева черепахи. Предки срубили топором дерево ньен (གཉན, gnyan) или сожгли дерево старого святилища. Рождаются близнецы или слабые дети. Рождённый на триграмме грома (ཟིན, zin) хронически болеет.
reading.KhaSrog.EARTH_DRAGON.spirits=духи и земные демоны, что держатся за треснувшие корыта и сосуды
reading.KhaSrog.EARTH_DRAGON.illness=опухоли, внезапные беды и слабая поясница
reading.KhaSrog.IRON_HORSE=Рождённый в год железной лошади или железной овцы имеет тело земли из глубокой середины, отсечённое от мяса горла черепахи. Предки потревожили землю и камни немого родника. Дом время от времени переезжает. Рождённый на триграмме воды (ཁམ, kham) болеет сердцем и ветром сердца.
reading.KhaSrog.IRON_HORSE.spirits=наги (ཀླུ, klu), владыки земли (ས་བདག, sa bdag) или лу-цены (ཀླུ་བཙན, klu btsan) дома и полей дяди по матери
reading.KhaSrog.IRON_HORSE.illness=боль в горле, опухоли, заикание и немота
reading.KhaSrog.WATER_MONKEY=Рождённый в год водяной обезьяны или водяной птицы имеет тело железа острия меча, отсечённое от костей шеи черепахи. Отец и дед торговали мечом и удерживали богатство матери. Дом строится и разваливается. Рождённому на триграмме огня (ལི, li) идёт плохо.
reading.KhaSrog.WATER_MONKEY.spirits=боги и духи, что держатся за поля
reading.KhaSrog.WATER_MONKEY.illness=болезни головы и щёк, опухоли, боль шеи и раны от стрел в шею
reading.KhaSrog.WOOD_DOG=Рождённый в год деревянной собаки или деревянной свиньи имеет тело огня на горной вершине, отсечённое от желчи черепахи. Предки довели скверну очага до родника на скрещении трёх дорог. Малые дети умирают. Рождённая на триграмме земли (ཁོན, khon) женщина страстна и ненасытна.
reading.KhaSrog.WOOD_DOG.spirits=наги (ཀླུ, klu) и духи гонгпо (འགོང་པོ, 'gong po)
reading.KhaSrog.WOOD_DOG.illness=желчь, болезни жара и заразные болезни
reading.KhaSrog.FIRE_MOUSE=Рождённый в год огненной мыши или огненного быка имеет тело излитой воды, отсечённое от воды глаз черепахи. Предки осквернили очаг, взяли вдову в невесты или отпустили своих людей к другим. Обиды и скверна (གྲིབ, grib) пристают к семье.
reading.KhaSrog.FIRE_MOUSE.spirits=духи гонгпо (འགོང་པོ, 'gong po) и дрэво (གྲེ་བོ, gre bo)
reading.KhaSrog.FIRE_MOUSE.illness=раны от стрел в глаза, слепота и слабеющее зрение
reading.KhaSrog.EARTH_TIGER=Рождённый в год земляного тигра или земляного зайца имеет тело земли сломанного порога, отсечённое от мяса черепахи. Предки дали дому разрушиться или рыли обрыв. Дети умирают взрослыми, и линии среди близкой родни могут пресечься. Рождённому на триграмме огня (ལི, li) плохо приходится братьям.
reading.KhaSrog.EARTH_TIGER.spirits=демон пресёкшихся линий со времён деда и дяди
reading.KhaSrog.EARTH_TIGER.illness=болезнь от водных богов и демоническая болезнь у женщин
reading.KhaSrog.IRON_DRAGON=Рождённый в год железного дракона или железной змеи имеет тело белого серебряного железа, отсечённое от кости у сердца черепахи. Предки пользовались имуществом старой общины Дхармы, и вредит дух присвоенных подношений. Рождённого на триграмме огня (ལི, li) голову всегда держит болезнь.
reading.KhaSrog.IRON_DRAGON.spirits=демон безумия и владыки земли (ས་བདག, sa bdag)
reading.KhaSrog.IRON_DRAGON.illness=разбитое сердце, болезни сердца и лёгких и безумие
reading.KhaSrog.WATER_HORSE=Рождённый в год водяной лошади или водяной овцы имеет тело ивового дерева, отсечённое от сухожилий конечностей черепахи. Предки рубили деревья ньен (གཉན, gnyan) на поле ньен и тревожили его межи и проходы. Рождённый на триграмме озера (དྭ, dwa) имеет плохие волосы.
reading.KhaSrog.WATER_HORSE.spirits=земные демоны вместе с нагами (ཀླུ, klu), владыками земли (ས་བདག, sa bdag) и ньен (གཉན, gnyan)
reading.KhaSrog.WATER_HORSE.illness=хромота и переломы конечностей
reading.KhaSrog.WOOD_MONKEY=Рождённый в год деревянной обезьяны или деревянной птицы имеет тело воды в канале, отсечённое от воды в каналах черепахи. Предки прорыли канал поперёк земли или потревожили луг. Рождённый на триграмме горы (གིན, gin) имеет некрасивый нос.
reading.KhaSrog.WOOD_MONKEY.spirits=демоны нагов и владыки земли (ས་བདག, sa bdag)
reading.KhaSrog.WOOD_MONKEY.illness=изъяны чувств и смерть от перерезанных каналов тела
reading.KhaSrog.FIRE_DOG=Рождённый в год огненной собаки или огненной свиньи имеет тело земли, держащей богов, отсечённое от мяса селезёнки черепахи. Предки забрали изображение бога, ступу или храм. Рождённого на триграмме воды (ཁམ, kham) сильно поднимается ветер сердца.
reading.KhaSrog.FIRE_DOG.spirits=духи богов и духи гьялпо (རྒྱལ་པོ, rgyal po)
reading.KhaSrog.FIRE_DOG.illness=безумие и припадки, заразные болезни и колющие боли в верхней части тела
reading.KhaSrog.EARTH_MOUSE=Рождённый в год земляной мыши или земляного быка имеет тело огня, рождённого молнией, отсечённое от кишок и дыхания черепахи. Предки пускали огонь на горе или у слияния трёх долин или сожгли город. У рождённого на триграмме воды (ཁམ, kham) в голове нет тепла.
reading.KhaSrog.EARTH_MOUSE.spirits=духи цен (བཙན, btsan), духи гонгпо (འགོང་པོ, 'gong po) или владыки земли (ས་བདག, sa bdag)
reading.KhaSrog.EARTH_MOUSE.illness=несварение и отравление
reading.KhaSrog.IRON_TIGER=Рождённый в год железного тигра или железного зайца имеет тело можжевельника на равнине, отсечённое от каналов почек и ног черепахи. Предки строили на разрушенном доме или поле или завалили чёрную скалу. У рождённого на триграмме озера (དྭ, dwa) всегда болят суставы.
reading.KhaSrog.IRON_TIGER.spirits=духи стихий и духи гонгпо (འགོང་པོ, 'gong po)
reading.KhaSrog.IRON_TIGER.illness=боль суставов в четырёх поколениях и болезнь почек
reading.KhaSrog.WATER_DRAGON=Рождённый в год водяного дракона или водяной змеи имеет тело воды с горных вершин, отсечённое от воды ног черепахи. Предки потревожили родник и рыли влажные поля. У рождённого на триграмме воды (ཁམ, kham) силён холод и болеют почки.
reading.KhaSrog.WATER_DRAGON.spirits=владыки земли (ས་བདག, sa bdag) и демоны нагов
reading.KhaSrog.WATER_DRAGON.illness=боль мочевого пузыря, задержка мочи и затяжные болезни холода
reading.KhaSrog.WOOD_HORSE=Рождённый в год деревянной лошади или деревянной овцы имеет тело железа в земле, отсечённое от лодыжек черепахи. Предки потревожили отмеченное место ньен (གཉན, gnyan) с камнями, межами или лугами. У рождённого на триграмме озера (དྭ, dwa) тело принимает изъяны и рано стареет.
reading.KhaSrog.WOOD_HORSE.spirits=дух, поднявшийся с места ньен (གཉན, gnyan)
reading.KhaSrog.WOOD_HORSE.illness=боль костей лодыжек и болезни нагов (ཀླུ་ནད, klu nad)
reading.KhaSrog.FIRE_MONKEY=Рождённый в год огненной обезьяны или огненной птицы имеет тело огня, пылающего в очаге, отсечённое от тепла носа черепахи. Предки присвоили добро человека без хозяина или спрятали останки трупа в доме. Рождённый на триграмме воды (ཁམ, kham) заикается.
reading.KhaSrog.FIRE_MONKEY.spirits=владыка места ньен (གཉན, gnyan)
reading.KhaSrog.FIRE_MONKEY.illness=синие оспины на лице
reading.KhaSrog.EARTH_DOG=Рождённый в год земляной собаки или земляной свиньи имеет тело можжевельника ровной земли, отсечённое от каналов лёгких, печени и паха черепахи. Предки рубили деревья на трёх вершинах или вырыли камень ньен (གཉན, gnyan) у слияния трёх долин. Рождённый на триграмме грома (ཟིན, zin) мало блистает.
reading.KhaSrog.EARTH_DOG.spirits=лу-цены (ཀླུ་བཙན, klu btsan) и лу-сены (ཀླུ་བསེན, klu bsen)
reading.KhaSrog.EARTH_DOG.illness=болезнь сердца, недуги желудка и печени и сильная боль в желудке
reading.KhaSrog.IRON_MOUSE=Рождённый в год железной мыши или железного быка имеет тело земли на горной вершине, отсечённое от желудка и селезёнки черепахи. Предки тревожили межи полей или рыли развалины и могилы. Рождённому на триграмме огня (ལི, li) плохо приходится желудку.
reading.KhaSrog.IRON_MOUSE.spirits=могильные демоны и владыки земли (ས་བདག, sa bdag)
reading.KhaSrog.IRON_MOUSE.illness=опухание селезёнки, яд в желудке и боль в почках и пояснице
reading.KhaSrog.WATER_TIGER=Рождённый в год водяного тигра или водяного зайца имеет тело железа, живущего в воде, отсечённое от рёбер черепахи. Могилу положили на валун ньен (གཉན, gnyan), или кости рода были разбросаны. Молодым или старым он может погибнуть от клинка. У рождённого на триграмме огня (ལི, li) зубы растут плохими и кривыми.
reading.KhaSrog.WATER_TIGER.spirits=духи, что держатся за отмеченные землю и камни вокруг дома
reading.KhaSrog.WATER_TIGER.illness=искалеченные плечи и руки
reading.KhaSrog.WOOD_DRAGON=Рождённый в год деревянного дракона или деревянной змеи имеет тело огня небесного дождя, отсечённое от тепла мозга черепахи. Родоубийство (དམེ, dme) осквернило очаг предков, и хранящая удача была утрачена. Рождённый на триграмме грома (ཟིན, zin) болеет лёгкими и печенью.
reading.KhaSrog.WOOD_DRAGON.spirits=демон очага и наги (ཀླུ, klu) внизу
reading.KhaSrog.WOOD_DRAGON.illness=боль в мозгу и болезни головы
reading.KhaSrog.FIRE_HORSE=Рождённый в год огненной лошади или огненной овцы имеет тело воды небесного дождя, отсечённое от костного мозга черепахи. Предки разрушили канал или старый пруд. Молодые умирают раньше старших, дети остаются сиротами. У рождённого на триграмме земли (ཁོན, khon) рот и нос всегда сухи.
reading.KhaSrog.FIRE_HORSE.spirits=демоны прудов и каналов
reading.KhaSrog.EARTH_MONKEY=Рождённый в год земляной обезьяны или земляной птицы имеет тело земли внутри горы, отсечённое от груди и рёбер черепахи. Предки бродили по ночам и проливали кровь. У рождённого на триграмме грома (ཟིན, zin) тело всегда скованно.
reading.KhaSrog.EARTH_MONKEY.spirits=духи, что держатся за луга, где сходятся три или четыре пути
reading.KhaSrog.EARTH_MONKEY.illness=скованность, боль в верхней части спины и рвота кровью
reading.KhaSrog.IRON_DOG=Рождённый в год железной собаки или железной свиньи имеет тело железа острия клинка, отсечённое от зубов во рту черепахи. Предки держали одержимый меч или копьё, или в доме незамеченным лежал колючий камень ньен (གཉན, gnyan). У рождённого на триграмме огня (ལི, li) зубы неровные.
reading.KhaSrog.IRON_DOG.spirits=демон приюта или владыки земли (ས་བདག, sa bdag)
reading.KhaSrog.IRON_DOG.illness=болезни щёк и зубов, скованная шея и рвота
reading.KhaSrog.WATER_MOUSE=Рождённый в год водяной мыши или водяного быка имеет тело древа исполнения желаний с водой, отсечённое от каналов печени черепахи. Предки рубили деревья ньен (གཉན, gnyan), дрались на месте ньен или пользовались добром старого храма. У рождённого на триграмме озера (དྭ, dwa) болеет позвоночник.
reading.KhaSrog.WATER_MOUSE.spirits=наги-ньен старых храмов и родников, где сходятся три пути
reading.KhaSrog.WATER_MOUSE.illness=болезнь печени, хромота, искалеченная рука и опухоли желудка
reading.KhaSrog.WOOD_TIGER=Рождённый в год деревянного тигра или деревянного зайца имеет тело воды в пыли, отсечённое от воды пыли в черепахе. Предки скитались на чужбине и бросили старый канал ради нового. Сын может умереть раньше отца. У рождённого на триграмме земли (ཁོན, khon) болят почки и поясница.
reading.KhaSrog.WOOD_TIGER.spirits=земные демоны
reading.KhaSrog.FIRE_DRAGON=Рождённый в год огненного дракона или огненной змеи имеет тело болотной земли, отсечённое от каналов головы черепахи. Предки разбивали яйца, рубили деревья, полные сока, и копали у родника, где сходятся три пути. Рождённый на триграмме грома (ཟིན, zin) болеет лёгкими.
reading.KhaSrog.FIRE_DRAGON.spirits=наги (ཀླུ, klu) и владыки земли (ས་བདག, sa bdag)
reading.KhaSrog.EARTH_HORSE=Рождённый в год земляной лошади или земляной овцы имеет тело огня пылающей птицы, отсечённое от тепла мозга черепахи. Огонь очага вырвался, и его скверна навлекла опасность.
reading.KhaSrog.EARTH_HORSE.spirits=демон собственного дома
reading.KhaSrog.EARTH_HORSE.illness=болезнь мозга, скованная шея и раны от стрел в шею и голову
reading.KhaSrog.IRON_MONKEY=Рождённый в год железной обезьяны или железной птицы имеет тело китайского можжевельника, отсечённое от позвоночника и поясницы черепахи. Скверна разгневала нагов (ཀླུ, klu). У рождённого на триграмме озера (དྭ, dwa) на лице не растут волосы.
reading.KhaSrog.IRON_MONKEY.spirits=духи нагов
reading.KhaSrog.IRON_MONKEY.illness=болезни нагов (ཀླུ་ནད, klu nad), опухания, зуд, подагра и скованность
reading.KhaSrog.WATER_DOG=Рождённый в год водяной собаки или водяной свиньи имеет тело воды великого океана, отсечённое от крови каналов нижней части живота черепахи. В могилу положили ребёнка от кровосмешения, или предки совершили кровосмешение. Рождаются близнецы, или берут в семью ребёнка от кровосмешения.
reading.KhaSrog.WATER_DOG.spirits=великие духи могил и мест казни
reading.KhaSrog.WATER_DOG.illness=понос и зудящая болезнь
reading.BirthMewa={0} Мева (སྨེ་བ, sme ba) года рождения говорит, чьё дитя рождённый, о его прошлой и будущей жизни и об изображении, которое стоит создать ради лучшего рождения.
reading.BirthMewa.N1=Рождённый под одной белой — дитя, данное богами, прежде царь среди людей, а затем бог. Род продолжается одним ребёнком. Словно гонимый ветром, он всё время в пути. Ранняя жизнь знает много горя, поздняя — счастье. Жизнь длится 71 год, смертельных опасностей четыре.
reading.BirthMewa.N1.remedy=создайте изображение Авалокитешвары (སྤྱན་རས་གཟིགས, spyan ras gzigs), чтобы следующая жизнь была жизнью богача, бога или брахмана
reading.BirthMewa.N1.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po), теуранг (ཐེའུ་བྲང, the'u brang) и духи гонгпо (འགོང་པོ, 'gong po), смущающие ум
reading.BirthMewa.N1.illness=хромота, подагра, изъяны глаз и боли в верхней части тела, в носу и глазах
reading.BirthMewa.N2=Рождённый под двумя чёрными — дитя демонов (བདུད, bdud), пришедшее из ада, прежде демон и ракшас. Рано разлучённый с родителями, он снова и снова переезжает. Гладкий языком и упрямый внутри, он проливает много слёз горя. Жизнь длится 61 год, препятствий три, детей двое или трое.
reading.BirthMewa.N2.remedy=создайте изображение Ваджрапани (ཕྱག་རྡོར, phyag rdor) и ступу и практикуйте Дхарму в меру, чтобы родиться в мире Брахмы или министром
reading.BirthMewa.N2.spirits=демоны со стороны отца и матери, владыки земли (ས་བདག, sa bdag) и дрэво (གྲེ་བོ, gre bo)
reading.BirthMewa.N2.illness=много болезней в детстве; позже болеет редко, но поразившая болезнь — на жизнь или смерть
reading.BirthMewa.N3=Рождённый под тремя синими — дитя сенмо (བསེན་མོ, bsen mo) и демонов-нагов, прежде скальный демон, а затем слон. Он любит лежать и спать, силён сердцем, скуп и хитёр. Благополучие убывает с рождения, и нажитое подобно пузырю. Жизнь длится 50 лет, помех три.
reading.BirthMewa.N3.remedy=щедро давайте и создавайте изображения Ваджрасаттвы (རྡོར་སེམས, rdor sems), чтобы родиться дочерью богача на западе
reading.BirthMewa.N3.spirits=дрэво (གྲེ་བོ, gre bo) и сенмо (བསེན་མོ, bsen mo) с рождения, земные демоны и владыки земли (ས་བདག, sa bdag) очага, дома и полей
reading.BirthMewa.N4=Рождённый под четырьмя зелёными — дитя, данное белой нагиней, прежде наг, а затем белый олень. Любящий странствовать и строить большие замыслы, он глубок и ядовит внутри. Ссор и тяжб много, и изъяны касаются чувств детей. Жизнь длится 65 лет, помех четыре, детей четверо.
reading.BirthMewa.N4.remedy=подносите нагам (ཀླུ, klu) зерно, лу-ман (ཀླུ་སྨན, klu sman) и молоко и не оскверняйте их; создайте изображение Ваджрапани (ཕྱག་རྡོར, phyag rdor) и читайте его мантру
reading.BirthMewa.N4.spirits=ньен (གཉན, gnyan) и владыки земли (ས་བདག, sa bdag), и владыка земли, живущий в вашем поле или доме
reading.BirthMewa.N4.illness=подагра, кривые конечности, опухания, язвы, безумие и припадки и боли в боку
reading.BirthMewa.N5=Рождённый под пятью жёлтыми — дитя царского рода, данное владыкой демонов, в прошлой жизни монах. Твёрдый умом, учёный и верный Дхарме, он остаётся в роду отца. Будучи белым в Дхарме, он живёт долго. Жизнь длится 50 лет или кончается двумя годами позже, детей пятеро.
reading.BirthMewa.N5.remedy=совершите сильные обряды восполнения и покаяния (བསྐང་བཤགས, bskang bshags) забытым защитникам; создайте изображение Будды и «Ваджрной резчицы» (རྡོར་གཅོད, rdor gcod), чтобы родиться мантрином
reading.BirthMewa.N5.spirits=владыки земли (ས་བདག, sa bdag) и духи гьялпо (རྒྱལ་པོ, rgyal po) рода предков, стражи храмового имущества и защитники Дхармы
reading.BirthMewa.N5.illness=лимфа и желчь, заразные болезни, безумие и припадки
reading.BirthMewa.N6=Рождённый под шестью белыми — дитя божественных духов гонгпо (འགོང་པོ, 'gong po), пришедшее от голодных духов. Мудрый, но непостоянный лицом, он любит странствовать и держит дом в двух местах. Род отца пресекается. Болеет редко, но тяжело. Жизнь длится 70 лет, помех пять, детей пятеро или трое.
reading.BirthMewa.N6.remedy=совершите обряд Ушниши (གཙུག་ཏོར, gtsug tor) и создайте изображение ламы, чтобы родиться учёным на юге или среди богов
reading.BirthMewa.N6.spirits=духи богов, духи гонгпо (འགོང་པོ, 'gong po), серак (བསེ་རག, bse rag) и вредящие духи умерших, нарушивших обеты (དམ་སྲི, dam sri)
reading.BirthMewa.N7=Рождённый под семью красными — дитя цен (བཙན, btsan), мясник с клинком, и клинок грозит ему под конец. Тысячи людей и коней приходят и уходят. Смелый, забывчивый, любящий красное мясо и своевольный, он любит драки. Жизнь длится 80 лет, препятствий четыре, детей семеро.
reading.BirthMewa.N7.remedy=создайте изображение Тары (སྒྲོལ་མ, sgrol ma), чтобы обрести мужское тело и держать Винаю
reading.BirthMewa.N7.spirits=духи цен (བཙན, btsan) и дрэво (གྲེ་བོ, gre bo), которых чтят как демонов, и цен клинка
reading.BirthMewa.N7.illness=язвы и волдыри в детстве, внезапные боли крови и колики
reading.BirthMewa.N8=Рождённый под восемью белыми — дитя богов Тушиты (དགའ་ལྡན, dga' ldan), прежде рождённое в Мон (མོན, mon), а затем среди богов. Терпеливый и сдержанный внутри, гордый и светлый, он счастлив в старости, как река, что полноводнее всего у конца. Обид много. Жизнь длится 50 лет, препятствий три.
reading.BirthMewa.N8.remedy=создайте изображение Учителя, чтобы родиться мастером изображений или практиком, а затем снова среди богов; берегитесь скверны (གྲིབ, grib) и всегда молитесь богам
reading.BirthMewa.N8.spirits=разгневанные защитники, а также духи гонгпо (འགོང་པོ, 'gong po) и духи гьялпо (རྒྱལ་པོ, rgyal po) соседей
reading.BirthMewa.N9=Рождённый под девятью красными — дитя духов ман (སྨན, sman), данное великими небесными ман. Держа в обеих руках семь цветов благополучия, он богатеет своим умением. Ранняя жизнь тяжела, поздняя счастлива, но близкие становятся враждебны. Жизнь длится 73 года, препятствий пять, два сына и много дочерей.
reading.BirthMewa.N9.remedy=создайте изображение Манджушри (འཇམ་དབྱངས, 'jam dbyangs) и читайте дхарани, чтобы родиться богатым сыном в Мон (མོན, mon) на юге; совершайте обряды призывания благополучия
reading.BirthMewa.N9.spirits=духи мысов, родников и зарослей
reading.BirthAspect={0} Стихия триграммы рождения, поставленная против стихии каждого из аспектов года рождения, делает долю этого аспекта одной из тех же пяти; стихия мева рождения ставится против жизненной силы (སྲོག, srog) так же.
reading.BirthAspect.BODY.PARENTS_GOD=Рождённый на триграмме матери тела: его тело — бог родителей (ཕ་མ་ལྷ, pha ma lha), доля тела с избытком. Он хорош обликом и лицом и полон сил.
reading.BirthAspect.BODY.CHILDRENS_GLORY=Рождённый на триграмме сына тела: его тело — слава детей (བུ་ཚ་དཔལ, bu tsha dpal), доля тела полна. Малым его легко растить, и силы приходят легко.
reading.BirthAspect.BODY.LIFE=Рождённый на триграмме той же стихии, что и тело: его тело — согласие, то есть жизнь (མཐུན་པ་ཚེ, mthun pa tshe), доля тела средняя. Он хорош обликом и лицом и сам несёт своё тело.
reading.BirthAspect.BODY.SPIRIT=Рождённый на триграмме стихии, которую тело одолевает: его тело — дух, которого можно пережить (ཐུབ་པ་འདྲེ, thub pa 'dre), доля тела слаба. Малым его трудно растить, и он часто болеет.
reading.BirthAspect.BODY.DEMON.IRON=Рождённый на триграмме врага тела: его тело — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля тела отсечена. Он нескладен, без жира и мяса, и его держит хроническая болезнь. Его образ — сломанное дерево.
reading.BirthAspect.BODY.DEMON.IRON.illness=хроническая болезнь лёгких
reading.BirthAspect.BODY.DEMON.FIRE=Рождённый на триграмме врага тела: его тело — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля тела отсечена. Он нескладен, без жира и мяса, и его держит хроническая болезнь. Его образ — сломанное дерево.
reading.BirthAspect.BODY.DEMON.FIRE.illness=жар, болезнь сердца и болезнь плоти
reading.BirthAspect.BODY.DEMON.WATER=Рождённый на триграмме врага тела: его тело — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля тела отсечена. Он нескладен, без жира и мяса, и его держит хроническая болезнь. Его образ — сломанное дерево.
reading.BirthAspect.BODY.DEMON.WATER.illness=болезнь почек, болезни воды и водянка
reading.BirthAspect.BODY.DEMON.EARTH=Рождённый на триграмме врага тела: его тело — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля тела отсечена. Он нескладен, без жира и мяса, и его держит хроническая болезнь. Его образ — сломанное дерево.
reading.BirthAspect.BODY.DEMON.EARTH.illness=болезнь селезёнки и геморрой
reading.BirthAspect.BODY.DEMON.WOOD=Рождённый на триграмме врага тела: его тело — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля тела отсечена. Он нескладен, без жира и мяса, и его держит хроническая болезнь. Его образ — сломанное дерево.
reading.BirthAspect.BODY.DEMON.WOOD.illness=болезнь печени, увечье и колики
reading.BirthAspect.DESTINY.PARENTS_GOD=Рождённый на триграмме матери могущества: его могущество — бог родителей (ཕ་མ་ལྷ, pha ma lha), доля с избытком. Словно полное озеро, у него есть дети и богатство, и братьев и слуг много.
reading.BirthAspect.DESTINY.CHILDRENS_GLORY=Рождённый на триграмме сына могущества: его могущество — слава детей (བུ་ཚ་དཔལ, bu tsha dpal), доля силы полна. Дети хороши, богатство среднее, и обряды призывания благополучия всегда идут хорошо.
reading.BirthAspect.DESTINY.LIFE=Рождённый на триграмме той же стихии, что и могущество: его могущество — согласие, то есть жизнь (མཐུན་པ་ཚེ, mthun pa tshe), доля пищи и богатства средняя. Богатство хорошее, дети средние, и он обретает колышек, возвышающий славу.
reading.BirthAspect.DESTINY.SPIRIT=Рождённый на триграмме стихии, которую могущество одолевает: его могущество — дух, которого можно пережить (ཐུབ་པ་འདྲེ, thub pa 'dre), доля силы низка. Многие дети умирают молодыми, и богатство качается от полноты к пустоте.
reading.BirthAspect.DESTINY.DEMON.IRON=Рождённый на триграмме врага могущества: его могущество — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля отсечена, как высохшее озеро. Даже с семью сыновьями род пресекается; даже с сотнями голов скота он кончает нищим. Детей годов тигра и зайца не рождается.
reading.BirthAspect.DESTINY.DEMON.FIRE=Рождённый на триграмме врага могущества: его могущество — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля отсечена, как высохшее озеро. Даже с семью сыновьями род пресекается; даже с сотнями голов скота он кончает нищим. Детей годов птицы и обезьяны не рождается.
reading.BirthAspect.DESTINY.DEMON.WATER=Рождённый на триграмме врага могущества: его могущество — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля отсечена, как высохшее озеро. Даже с семью сыновьями род пресекается; даже с сотнями голов скота он кончает нищим. Детей годов лошади и змеи не рождается.
reading.BirthAspect.DESTINY.DEMON.EARTH=Рождённый на триграмме врага могущества: его могущество — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля отсечена, как высохшее озеро. Даже с семью сыновьями род пресекается; даже с сотнями голов скота он кончает нищим. Детей годов мыши и свиньи не рождается.
reading.BirthAspect.DESTINY.DEMON.WOOD=Рождённый на триграмме врага могущества: его могущество — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля отсечена, как высохшее озеро. Даже с семью сыновьями род пресекается; даже с сотнями голов скота он кончает нищим. Детей годов быка, дракона, овцы и собаки не рождается.
reading.BirthAspect.LUCK.PARENTS_GOD=Рождённый на триграмме матери коня ветра: его конь ветра (ཀླུང་རྟ, klung rta) — бог родителей (ཕ་མ་ལྷ, pha ma lha), доля с избытком. Он ведёт за собой, на него надеются все вокруг, и он обретает всё нужное. Никакое заклятие его не берёт: его образ — железный столп.
reading.BirthAspect.LUCK.CHILDRENS_GLORY=Рождённый на триграмме сына коня ветра: его конь ветра (ཀླུང་རྟ, klung rta) — слава детей (བུ་ཚ་དཔལ, bu tsha dpal), доля полна. Ясный умом, он поднимается среди благородных, его любят, и он трудится для существ, не принимая сторон.
reading.BirthAspect.LUCK.LIFE=Рождённый на триграмме той же стихии, что и конь ветра: его конь ветра (ཀླུང་རྟ, klung rta) — согласие, то есть жизнь (མཐུན་པ་ཚེ, mthun pa tshe), доля средняя. Он обретает средства и довольство, решает сам и не отдаёт повод в чужие руки.
reading.BirthAspect.LUCK.SPIRIT=Рождённый на триграмме стихии, которую конь ветра одолевает: его конь ветра (ཀླུང་རྟ, klung rta) — дух, которого можно пережить (ཐུབ་པ་འདྲེ, thub pa 'dre), доля слаба. Что он ни делает, никому не угодно, покоя нет, и его слов не слушают.
reading.BirthAspect.LUCK.DEMON.IRON=Рождённый на триграмме врага коня ветра: его конь ветра (ཀླུང་རྟ, klung rta) — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля отсечена. Как листва дерева, он растёт вверх, а плоды падают под землю. Желания не сбываются, близкие становятся врагами. Собирается оружие раздора.
reading.BirthAspect.LUCK.DEMON.FIRE=Рождённый на триграмме врага коня ветра: его конь ветра (ཀླུང་རྟ, klung rta) — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля отсечена. Как листва дерева, он растёт вверх, а плоды падают под землю. Желания не сбываются, близкие становятся врагами. Горят земля и дом.
reading.BirthAspect.LUCK.DEMON.WATER=Рождённый на триграмме врага коня ветра: его конь ветра (ཀླུང་རྟ, klung rta) — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля отсечена. Как листва дерева, он растёт вверх, а плоды падают под землю. Желания не сбываются, близкие становятся врагами. Вред приходит от воды.
reading.BirthAspect.LUCK.DEMON.EARTH=Рождённый на триграмме врага коня ветра: его конь ветра (ཀླུང་རྟ, klung rta) — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля отсечена. Как листва дерева, он растёт вверх, а плоды падают под землю. Желания не сбываются, близкие становятся врагами. Он переходит с земли на землю.
reading.BirthAspect.LUCK.DEMON.WOOD=Рождённый на триграмме врага коня ветра: его конь ветра (ཀླུང་རྟ, klung rta) — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud), доля отсечена. Как листва дерева, он растёт вверх, а плоды падают под землю. Желания не сбываются, близкие становятся врагами. Дом гниёт.
reading.BirthAspect.MEWA.PARENTS_GOD=Рождённый под мева матери жизненной силы — бог родителей (ཕ་མ་ལྷ, pha ma lha) по мева (སྨེ་བ, sme ba), доля с избытком. Боги и духи благосклонны, жизнь не встречает препятствий, и блага очень велики.
reading.BirthAspect.MEWA.CHILDRENS_GLORY=Рождённый под мева сына жизненной силы — слава детей (བུ་ཚ་དཔལ, bu tsha dpal) по мева (སྨེ་བ, sme ba), доля полна. Он никогда не разлучается со счастьем, и оно длится долго и прочно.
reading.BirthAspect.MEWA.LIFE=Рождённый под мева той же стихии, что и жизненная сила, — согласие, то есть жизнь (མཐུན་པ་ཚེ, mthun pa tshe) по мева (སྨེ་བ, sme ba): доля и блага средние, и жизнь на одном месте его утомляет.
reading.BirthAspect.MEWA.SPIRIT=Рождённый под мева стихии, которую жизненная сила одолевает, — дух, которого можно пережить (ཐུབ་པ་འདྲེ, thub pa 'dre) по мева (སྨེ་བ, sme ba), доля слаба. Тело много болеет, и богатство качается от полноты к пустоте.
reading.BirthAspect.MEWA.DEMON.IRON=Рождённый под мева врага жизненной силы — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud) по мева (སྨེ་བ, sme ba): доля отсечена, и боги и духи враждебны. Половина богатства уходит к духам, половина — к врагам. Счастье не длится, и женщина вдовеет снова и снова.
reading.BirthAspect.MEWA.DEMON.IRON.spirits=духи цен (བཙན, btsan) и дрэво (གྲེ་བོ, gre bo)
reading.BirthAspect.MEWA.DEMON.FIRE=Рождённый под мева врага жизненной силы — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud) по мева (སྨེ་བ, sme ba): доля отсечена, и боги и духи враждебны. Половина богатства уходит к духам, половина — к врагам. Счастье не длится, и женщина вдовеет снова и снова.
reading.BirthAspect.MEWA.DEMON.FIRE.spirits=демоны (བདུད, bdud) и ма-мо (མ་མོ, ma mo)
reading.BirthAspect.MEWA.DEMON.WATER=Рождённый под мева врага жизненной силы — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud) по мева (སྨེ་བ, sme ba): доля отсечена, и боги и духи враждебны. Половина богатства уходит к духам, половина — к врагам. Счастье не длится, и женщина вдовеет снова и снова.
reading.BirthAspect.MEWA.DEMON.WATER.spirits=наги (ཀླུ, klu) и духи ман (སྨན, sman) озёр
reading.BirthAspect.MEWA.DEMON.EARTH=Рождённый под мева врага жизненной силы — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud) по мева (སྨེ་བ, sme ba): доля отсечена, и боги и духи враждебны. Половина богатства уходит к духам, половина — к врагам. Счастье не длится, и женщина вдовеет снова и снова.
reading.BirthAspect.MEWA.DEMON.EARTH.spirits=ньен (གཉན, gnyan) и владыки земли (ས་བདག, sa bdag)
reading.BirthAspect.MEWA.DEMON.WOOD=Рождённый под мева врага жизненной силы — демон, которого не пережить (མི་ཐུབ་བདུད, mi thub bdud) по мева (སྨེ་བ, sme ba): доля отсечена, и боги и духи враждебны. Половина богатства уходит к духам, половина — к врагам. Счастье не длится, и женщина вдовеет снова и снова.
reading.BirthAspect.MEWA.DEMON.WOOD.spirits=планеты (གཟའ, gza') и духи гьялпо (རྒྱལ་པོ, rgyal po)
DpalByur.GLORY=нисхождение славы
DpalByur.MISFORTUNE=нисхождение беды
DpalByur.OWN_FOOT=на своей ноге
DpalByur.LUSTRE_LOST=утрата блеска
DpalByur.LIFE_TAKEN=взятие жизни
reading.DpalByur={0} Слава и беда (དཔལ་བྱུར, dpal byur) ставят жизненную силу и коня ветра рождённого против отцовских, а тело и могущество — против материнских: каждая встреча — одна из пяти.
reading.DpalByur.VITALITY.GLORY=Жизненная сила отца — мать жизненной силы рождённого, и на жизненную силу нисходит слава (དཔལ་བབས, dpal babs). Знатного слушают в совете; простой всё же видит небо. На сходе он выигрывает спор, и господин благосклонен. Жизнь стоит твёрже горы.
reading.DpalByur.BODY.GLORY=Тело матери — мать тела рождённого, и на тело нисходит слава (དཔལ་བབས, dpal babs). Тело процветает, и болезни редки. Его образ — крепость на высокой горе, окружённая рвом, которую не устрашат враги, собравшиеся с четырёх сторон.
reading.DpalByur.DESTINY.GLORY=Могущество матери — мать могущества рождённого, и на могущество нисходит слава (དཔལ་བབས, dpal babs). Пища, богатство и блага велики. Его образ — тот, кто находит пищу на сухом склоне и воду в сухой долине.
reading.DpalByur.LUCK.GLORY=Конь ветра (ཀླུང་རྟ, klung rta) отца — мать коня ветра рождённого, и на коня ветра нисходит слава (དཔལ་བབས, dpal babs). На чужбине его чтят больше, чем дома; три сказанных слова весомы, и люди добры, куда бы он ни пошёл. Заслуги велики.
reading.DpalByur.VITALITY.MISFORTUNE=Жизненная сила отца — враг жизненной силы рождённого, и на жизненную силу нисходит беда (བྱུར་བབས, byur babs), и долгая жизнь трудна. Предок умер на чужбине непогребённым и сетует, что у него нет места. Жизненная сила тоскует по трём: по жизни, по сыновьям и по добру.
reading.DpalByur.VITALITY.MISFORTUNE.remedy=вращайте колесо Дхармы телом, создайте золотого Амитаюса (ཚེ་དཔག་མེད, tshe dpag med), читайте дхарани долгой жизни раз в день, вонзите кинжал жизни и считайте практику долгой жизни; отпускайте жизни и не отнимайте ни одной
reading.DpalByur.BODY.MISFORTUNE=Тело матери — враг тела рождённого, и на тело нисходит беда (བྱུར་བབས, byur babs). Могилы предков разошлись на три, и семья — на три линии: одна процветает, одна едва держится, одна почти пресеклась. Тело немного болеет.
reading.DpalByur.BODY.MISFORTUNE.remedy=выкупите тело и поднесите одежду ступе
reading.DpalByur.DESTINY.MISFORTUNE=Могущество матери — враг могущества рождённого, и на могущество нисходит беда (བྱུར་བབས, byur babs). Что во рту, язык отдаёт, а что в руке, падает на землю. Богатство мало.
reading.DpalByur.DESTINY.MISFORTUNE.remedy=восстановите могущество и чтите посвящённых в монашество
reading.DpalByur.LUCK.MISFORTUNE=Конь ветра (ཀླུང་རྟ, klung rta) отца — враг коня ветра рождённого, и на коня ветра нисходит беда (བྱུར་བབས, byur babs). Что он ни делает, никому не угодно, господин недоволен, и заслугу за его добро присваивают другие. Люди не любят его без причины.
reading.DpalByur.LUCK.MISFORTUNE.remedy=восстановите коня ветра и почините опасную тропу
reading.DpalByur.VITALITY.OWN_FOOT.WOOD=Жизненная сила отца той же стихии, что и у рождённого, дерево, и жизненная сила стоит на своей ноге (རང་རྐང, rang rkang). Род предков продолжается одним наследником, и вредит колдовство, направленное на семью.
reading.DpalByur.VITALITY.OWN_FOOT.FIRE=Жизненная сила отца той же стихии, что и у рождённого, огонь, и жизненная сила стоит на своей ноге (རང་རྐང, rang rkang). Муж и жена расстаются, и он снова и снова заводит дом.
reading.DpalByur.VITALITY.OWN_FOOT.EARTH=Жизненная сила отца той же стихии, что и у рождённого, земля, и жизненная сила стоит на своей ноге (རང་རྐང, rang rkang). Он часто меняет землю и дом и держит два места или больше.
reading.DpalByur.VITALITY.OWN_FOOT.IRON=Жизненная сила отца той же стихии, что и у рождённого, железо, и жизненная сила стоит на своей ноге (རང་རྐང, rang rkang). Взлёты и падения велики со стороны дяди по матери, или богатство качается от полноты к пустоте.
reading.DpalByur.VITALITY.OWN_FOOT.WATER=Жизненная сила отца той же стихии, что и у рождённого, вода, и жизненная сила стоит на своей ноге (རང་རྐང, rang rkang). Невеста и сёстры хронически больны, а у него самого болят желудок и печень.
reading.DpalByur.VITALITY.OWN_FOOT.WATER.spirits=владыки земли (ས་བདག, sa bdag), наги (ཀླུ, klu) и ньен (གཉན, gnyan)
reading.DpalByur.BODY.OWN_FOOT=Тело матери той же стихии, что и у рождённого, и тело стоит на своей ноге (རང་རྐང, rang rkang): его взлёты и падения средние.
reading.DpalByur.DESTINY.OWN_FOOT=Могущество матери той же стихии, что и у рождённого, и могущество стоит на своей ноге (རང་རྐང, rang rkang): пища и богатство средние.
reading.DpalByur.LUCK.OWN_FOOT=Конь ветра (ཀླུང་རྟ, klung rta) отца той же стихии, что и у рождённого, и конь ветра стоит на своей ноге (རང་རྐང, rang rkang): заслуги средние.
reading.DpalByur.VITALITY.LUSTRE_LOST=Жизненная сила рождённого — мать отцовской, и жизненная сила теряет блеск (མདངས་ཤོར, mdangs shor), отдавая его ей. Жизнь коротка.
reading.DpalByur.VITALITY.LUSTRE_LOST.remedy=отпускайте жизни и не отнимайте ни одной
reading.DpalByur.BODY.LUSTRE_LOST=Тело рождённого — мать материнского тела, и тело теряет блеск (མདངས་ཤོར, mdangs shor), отдавая его ему. Болезни часты.
reading.DpalByur.BODY.LUSTRE_LOST.remedy=выкупите тело и поднесите одежду ступе
reading.DpalByur.DESTINY.LUSTRE_LOST=Могущество рождённого — мать материнского могущества, и могущество теряет блеск (མདངས་ཤོར, mdangs shor), отдавая его ему. Пища и богатство малы.
reading.DpalByur.DESTINY.LUSTRE_LOST.remedy=восстановите могущество и чтите посвящённых в монашество
reading.DpalByur.LUCK.LUSTRE_LOST=Конь ветра (ཀླུང་རྟ, klung rta) рождённого — мать отцовского, и конь ветра теряет блеск (མདངས་ཤོར, mdangs shor), отдавая его ему. Люди его не любят.
reading.DpalByur.LUCK.LUSTRE_LOST.remedy=восстановите коня ветра и почините опасную тропу
reading.DpalByur.VITALITY.LIFE_TAKEN=Жизненная сила рождённого одолевает отцовскую и берёт у неё жизнь (ཚེ་ལེན, tshe len). Он живёт до верхней середины полного срока.
reading.DpalByur.BODY.LIFE_TAKEN=Тело рождённого одолевает материнское и берёт у него жизнь (ཚེ་ལེན, tshe len). Он редко болеет, и телу хорошо.
reading.DpalByur.DESTINY.LIFE_TAKEN=Могущество рождённого одолевает материнское и берёт у него жизнь (ཚེ་ལེན, tshe len). Пища и богатство велики.
reading.DpalByur.LUCK.LIFE_TAKEN=Конь ветра (ཀླུང་རྟ, klung rta) рождённого одолевает отцовского и берёт у него жизнь (ཚེ་ལེན, tshe len). Люди к нему добры.
LineStage.CROWDED=теснота
LineStage.EMPTY=пустота
LineStage.STAYING=пребывание
LineStage.TORN=разрыв
reading.BirthLine={0} Линия рождений (རྒྱ་མ, rgya ma) отсчитывает жизненную силу (སྲོག, srog) предка по её двенадцати стадиям до года рождения: на болезни линия тесна, на смерти пуста, на седьмом от могилы она пребывает, а на могиле разорвана.
reading.BirthLine.EMPTY=Жизненная сила предка, отсчитанная до года рождения, падает на свою смерть: линия пуста. Её удача уходит к дочерям.
reading.BirthLine.EMPTY.remedy=пошлите быстрый обряд девяти колёс, наполняющий пустое, как вода наполняет сосуд
reading.BirthLine.STAYING=Жизненная сила предка, отсчитанная до года рождения, падает на седьмой год от своей могилы: линия пребывает (སྡོད་པ, sdod pa). Её бытие иссыхает, приют рождений отсечён, и уста смерти открываются, когда небесный год или смещённый знак (ལོག་མེན, log men) приносит этот год.
reading.BirthLine.STAYING.remedy=пошлите обряд, встряхивающий владык земли (ས་བདག, sa bdag), словно удар кнута; в такой год совершите обряд, отсекающий приют смерти (ཤི་སྒབ་གཅོད, shi sgab gcod)
reading.BirthLine.TORN=Жизненная сила предка, отсчитанная до года рождения, падает на свою могилу: линия — кха-рэл (ཁ་རལ, kha ral), разорвана. Она поворачивает вспять, и уста смерти открываются там, где приют смерти не отсечён, прежде всего когда небесный год или смещённый знак (ལོག་མེན, log men) приносит этот год.
reading.BirthLine.TORN.remedy=пошлите быстрый обряд пяти колёс, связывающий линию; в такой год совершите обряд, отсекающий приют смерти (ཤི་སྒབ་གཅོད, shi sgab gcod)
reading.BirthLine.CROWDED.HORSE_SNAKE=Рождённый в год обезьяны у предка годов лошади или змеи теснит линию (འཚོམས་པ, 'tshoms pa). Если тесноту не разрешить, проявляется вина линии: колдовство жрецов, кровосмешение между братьями и сёстрами и богатство, купленное у пресёкшихся линий. Число людей теснится на десяти и четырнадцати и никогда не переходит шестнадцати.
reading.BirthLine.CROWDED.HORSE_SNAKE.remedy=пошлите изображения лошади и змеи со счётом лет; придавите демонов тесноты и нужды на черепах птицы, обезьяны, собаки и дракона; свяжите уста линии на голове льва; пошлите обряд всесобирающей тайны (གསང་བ་ཀུན་འདུས, gsang ba kun 'dus)
reading.BirthLine.CROWDED.TIGER_RABBIT=Рождённый в год змеи у предка годов тигра или зайца теснит линию (འཚོམས་པ, 'tshoms pa). Если тесноту не разрешить, проявляется вина линии: вредят наги-демоны (ཀླུ་བདུད, klu bdud) чёрного родника, и в доме одержимое дерево и чёрное добро. Число людей держится на семи и девяти и никогда не переходит одиннадцати.
reading.BirthLine.CROWDED.TIGER_RABBIT.remedy=пошлите изображения тигра и зайца со счётом лет; придавите демонов тесноты и нужды на черепах лошади, змеи, быка и овцы; пошлите обряд донгце (དོང་ཙེ, dong tse); свяжите уста линии на правом плече льва
reading.BirthLine.CROWDED.BIRD_MONKEY=Рождённый в год свиньи у предка годов птицы или обезьяны теснит линию (འཚོམས་པ, 'tshoms pa). Если тесноту не разрешить, проявляется вина линии: одержимый кусок железа и линия дяди по матери, пресечённая родоубийством (དམེ, dme); поэтому вредят духи гьялпо (རྒྱལ་པོ, rgyal po). Число людей теснится на четырёх и шести, держится на десяти и никогда не переходит двенадцати.
reading.BirthLine.CROWDED.BIRD_MONKEY.remedy=отведите острие клинка и свяжите клинок; придавите демонов тесноты и нужды на черепах мыши, свиньи, быка и овцы; свяжите уста линии на левом плече льва; совершите обряд донгце (དོང་ཙེ, dong tse) тысячелепесткового лотоса
reading.BirthLine.CROWDED.MOUSE_PIG=Рождённый в год тигра у предка годов мыши или свиньи теснит линию (འཚོམས་པ, 'tshoms pa). Если тесноту не разрешить, проявляется вина линии: чёрное добро, ссора с владыками земли (ས་བདག, sa bdag) и нагами (ཀླུ, klu) и дитя кровосмешения. Число людей теснится на пяти и семи и никогда их не переходит.
reading.BirthLine.CROWDED.MOUSE_PIG.remedy=пошлите изображения мыши и свиньи со счётом лет; придавите демона тесноты на черепе мула; свяжите уста линии у бедра льва; пошлите в обряде голову чёрной свиньи
reading.BirthLine.CROWDED.OX=Рождённый в год тигра у предка года быка теснит линию (འཚོམས་པ, 'tshoms pa). Если тесноту не разрешить, проявляется вина линии: нарушенная клятва возвращается, и могила была положена дурно. Число людей не растёт: держится на четырёх и шести и теснится на шестнадцати.
reading.BirthLine.CROWDED.OX.spirits=белый теуранг (ཐེའུ་བྲང, the'u brang), духи гонгпо (འགོང་པོ, 'gong po), водные демоны и наги (ཀླུ, klu) дома
reading.BirthLine.CROWDED.OX.remedy=пошлите изображение быка со счётом лет; придавите демонов тесноты и нужды на черепе; свяжите уста линии справа на брюхе льва; совершите золотой мдо (གསེར་མདོས, gser mdos) владык земли и обряд донгце (དོང་ཙེ, dong tse)
reading.BirthLine.CROWDED.SHEEP=Рождённый в год тигра у предка года овцы теснит линию (འཚོམས་པ, 'tshoms pa). Если тесноту не разрешить, проявляется вина линии: старая ступа и владыки земли (ས་བདག, sa bdag) старых разрушенных холмов, квадратных полей и стен. Число людей держится на одном и трёх, теснится на пяти и семи и никогда не переходит восьми или десяти.
reading.BirthLine.CROWDED.SHEEP.remedy=пошлите изображение дракона со счётом лет; придавите демонов тесноты и нужды на черепе; свяжите уста линии в руках льва; совершите обряд, отводящий владык земли
reading.BirthLine.CROWDED.DOG=Рождённый в год тигра у предка года собаки теснит линию (འཚོམས་པ, 'tshoms pa). Если тесноту не разрешить, проявляется вина линии: подношения богам-воителям (དགྲ་ལྷ, dgra lha) и защитникам прекратились, обет учителю нарушен, клятвы съедены. Число людей держится на девяти и одиннадцати, теснится на пятнадцати и семнадцати и никогда не переходит девятнадцати.
reading.BirthLine.CROWDED.DOG.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po) с востока, а также духи гьялпо и гонгпо (འགོང་པོ, 'gong po) дома и на чужбине
reading.BirthLine.CROWDED.DOG.remedy=придавите демонов тесноты и нужды на черепе мула; придавите черепа тигра, зайца и дракона под правой ногой льва; совершите обряд, выправляющий стихии
reading.BirthLine.CROWDED.DRAGON=Рождённый в год тигра у предка года дракона теснит линию (འཚོམས་པ, 'tshoms pa). Если тесноту не разрешить, проявляется вина линии: брат или сестра от кровосмешения пришли в дом братьев отца, и хранилось богатство пресёкшейся линии. Число людей держится на четырёх и шести и никогда не переходит одиннадцати.
reading.BirthLine.CROWDED.DRAGON.spirits=демоны нагов и земные демоны
reading.BirthLine.CROWDED.DRAGON.remedy=придавите демонов тесноты и нужды на осквернённом черепе; свяжите уста линии с тигром, зайцем и драконом на левой руке льва; пошлите обряд всесобирающей тайны (གསང་བ་ཀུན་འདུས, gsang ba kun 'dus) и обряд донгце (དོང་ཙེ, dong tse)
MatchMeeting.AGREE=согласны
MatchMeeting.MIDDLING=средне
MatchMeeting.DISAGREE=не согласны
reading.MatchAspect={0} Одиночное сопоставление (རྐྱང་པ, rkyang pa) ставит жизненную силу и коня ветра мужчины против женских, а тело и могущество женщины — против мужских: мать, сын и друг встречаются хорошо, враг — плохо, а одна стихия — хорошо для земли и воды.
reading.MatchAspect.VITALITY.AGREE=Жизненная сила мужчины хорошо встречает женскую: оба живут долго, и их совместная жизнь очень долгая. Что один скажет, другой подхватит, о чём один заботится, другой несёт.
reading.MatchAspect.VITALITY.DISAGREE=Жизненная сила мужчины плохо встречает женскую: вместе они недолго, жизнь коротка, болезней много, и ничто из задуманного не удаётся.
reading.MatchAspect.VITALITY.DISAGREE.remedy=наденьте на мужчину колесо, поднимающее жизненную силу; выкупите жизнь, придавите вредящего духа могилы, совершите обряд долгой жизни и возведите крепость жизни
reading.MatchAspect.BODY.AGREE=Тело женщины хорошо встречает мужское: дети множатся, ни один не умирает в колыбели, и рождаются они со здоровыми чувствами и красивыми лицами.
reading.MatchAspect.BODY.DISAGREE=Тело женщины плохо встречает мужское: приходят хронические болезни, и дети рождаются с изъянами чувств.
reading.MatchAspect.BODY.DISAGREE.remedy=женщина носит колесо, поднимающее тело; совершите обряды, восстанавливающие тело, и возведите крепость бытия
reading.MatchAspect.DESTINY.AGREE=Могущество женщины хорошо встречает мужское: богатство, урожаи и скот множатся, руку протягивать к другим не нужно, и пищи и богатства в изобилии.
reading.MatchAspect.DESTINY.DISAGREE=Могущество женщины плохо встречает мужское: богатство не держится. Его образ — золотой песок, найденный снаружи, что дома обращается в землю и камни.
reading.MatchAspect.DESTINY.DISAGREE.remedy=совершите обряды, поднимающие могущество и призывающие благополучие, установите опору богов богатства, копите заслуги и щедро давайте и поднесите торму Вайшраване (རྣམ་སྲས, rnam sras)
reading.MatchAspect.LUCK.AGREE=Конь ветра (ཀླུང་རྟ, klung rta) мужчины хорошо встречает женского: люди добры, и чужие, и свои, и прежде всего их хранят благородные. Лошади и ослы плодятся.
reading.MatchAspect.LUCK.DISAGREE=Конь ветра (ཀླུང་རྟ, klung rta) мужчины плохо встречает женского: люди их не любят, наговоры не прекращаются, и заслугу за их добро присваивают другие.
reading.MatchAspect.LUCK.DISAGREE.remedy=наденьте на мужчину колесо, поднимающее коня ветра; отведите врагов коня ветра и почините дороги и мосты
reading.MatchAspect.MIDDLING=Два аспекта встречаются в одной стихии — огне, железе или дереве: такая встреча средняя, тогда как одна стихия в земле или воде встречается хорошо.
reading.MatchAspect.KARMA=Все четыре аспекта встречаются как мать и сын: женщина — жена кармы (ལས་ཀྱི་ཆུང་མ, las kyi chung ma), союз, который свели прежние деяния.
reading.MatchDestiny={0} Стихии двух могуществ, поставленные вместе, говорят о детях, что родятся у пары, и об удаче дома.
reading.MatchDestiny.WOOD_FIRE=Когда могущества — дерево и огонь, земледелие на равнине идёт счастливо, и рождаются три сына и две дочери. Лучше всего, когда могущество мужчины порождает женское.
reading.MatchDestiny.FIRE_EARTH=Когда могущества — огонь и земля, рождаются около трёх сыновей и трёх дочерей. Лучше всего, когда могущество мужчины порождает женское, средне — наоборот.
reading.MatchDestiny.EARTH_IRON=Когда могущества — земля и железо, рождаются около трёх сыновей и трёх дочерей. Лучше всего, когда могущество мужчины порождает женское, средне — наоборот.
reading.MatchDestiny.IRON_WATER=Когда могущества — железо и вода, рождаются около трёх сыновей и трёх дочерей, и богатство собирается, так что дом счастлив. Лучше всего, когда могущество мужчины порождает женское.
reading.MatchDestiny.WOOD_WATER=Когда могущества — вода и дерево, рождаются один сын и одна дочь, и пользы много. Лучше всего, когда могущество мужчины порождает женское, средне — наоборот.
reading.MatchDestiny.WOOD_WOOD=Когда оба могущества — дерево, рождаются один смелый сын и одна дочь. Его образ — ивовая роща, растущая вместе.
reading.MatchDestiny.FIRE_FIRE=Когда оба могущества — огонь, двое не подходят друг другу, бедны и терпят невзгоды; рождаются три сына.
reading.MatchDestiny.EARTH_EARTH=Когда оба могущества — земля, двое становятся владыками земли, и рождаются три сына и три дочери. Его образ — возведение земляной крепости.
reading.MatchDestiny.IRON_IRON=Когда оба могущества — железо, рождаются один смелый сын и одна дочь. Жить трудно, и слуги и скот теряются.
reading.MatchDestiny.WATER_WATER=Когда оба могущества — вода, рождаются брат и сестра. Его образ — малые ручьи, что вместе достигают моря.
reading.MatchDestiny.FIRE_IRON=Когда могущества — огонь и железо, рождаются пять сыновей и четверо умирают, и совместная жизнь пары коротка. Хуже всего, когда могущество мужчины отсекает женское.
reading.MatchDestiny.WOOD_IRON=Когда могущества — дерево и железо, рождаются три сына и двое умирают, рождаются и две дочери. Хуже всего, когда могущество мужчины отсекает женское.
reading.MatchDestiny.EARTH_WATER=Когда могущества — земля и вода, рождаются пять сыновей и трое умирают. Хуже всего, когда могущество мужчины отсекает женское.
reading.MatchDestiny.WOOD_EARTH=Когда могущества — дерево и земля, рождаются шесть сыновей и четверо умирают; бабке по матери плохо, и урожаи не родятся. Хуже всего, когда могущество мужчины отсекает женское.
reading.MatchDestiny.FIRE_WATER=Когда могущества — огонь и вода, рождаются три дочери, а единственный сын умирает; земледелие трудно, урожаи скудны. Хуже всего, когда могущество мужчины отсекает женское.
reading.MatchNiSha={0} Расчёт ниша (ཎི་ཤ, Ni sha) хочет, чтобы мужчина был года мужского пола и старше, а женщина — года женского пола и моложе.
reading.MatchNiSha.GOOD=Мужчина года мужского пола и старше, женщина года женского пола и моложе: союз не перевёрнут и идёт хорошо.
reading.MatchNiSha.REVERSED=Союз перевёрнут: мужчина моложе женщины, или её год мужского пола, а его — женского. Мужской род мал, женский растёт, и её слово берёт верх над его словом.
reading.MatchNiSha.REVERSED.remedy=создайте для мужчины изображение Ваджрапани (ཕྱག་རྡོར, phyag rdor) и наденьте на него его охранный амулет
BadYear.HARSH_RNGA_ZOR=суровый год
BadYear.HARSH_RO_KHUR=суровый год
BadYear.HARSH_RUS_GCOD=суровый год
BadYear.HARSH_MDUN_BSDEBS=суровый год
BadYear.HARSH_GRU_KHYER=суровый год
BadYear.HARSH_BYE_BRAL=суровый год
BadYear.BAD_OMEN=год дурного знамения
BadYear.LITTLE_WHITE=малый белый год
BadYear.THAN=год дурной приметы
BadYear.BYA_RA=страж неба и земли
BadYear.GRAVE_MEN=чёрный человек могилы
BadYear.LDING_NAG=чёрный сын лдинг
BadYear.SRIN_KHYER=унесённый ракшасами
BadYear.THER_DRE=год тер-дре (ཐེར་འདྲེ, ther 'dre)
BadYear.WIDOWHOOD=год вдовства
BadYear.AVOID=год, которого избегать
BadYear.BLACK_FANGS=чёрный год с клыками
reading.BadYear={0} Дурные годы (ལོ་ངན, lo ngan) — именованные ряды годов рождения, каждый вреден в браке; рождённый в одном из них приносит его вред в союз.
reading.BadYear.HARSH_RNGA_ZOR=Рождённый в год железной собаки или железной свиньи — из годов нга-сор (རྔ་ཟོར, rnga zor). Четыре года железа и восемь огня — суровые годы (རྩུབ་པ, rtsub pa), злые для брака.
reading.BadYear.HARSH_RNGA_ZOR.remedy=сложите семь каменных туров, поднесите меру зерна и пять долей пищи; когда прибывает невеста, поднимите крик, как при набеге врага, и гоняйтесь друг за другом по очереди; каждый из супругов совершает свой обряд
reading.BadYear.HARSH_RO_KHUR=Рождённый в год железной мыши или железного быка — из годов носильщика трупов (རོ་ཁུར, ro khur). Четыре года железа и восемь огня — суровые годы (རྩུབ་པ, rtsub pa), злые для брака.
reading.BadYear.HARSH_RO_KHUR.remedy=сложите семь каменных туров, поднесите меру зерна и пять долей пищи; когда прибывает невеста, поднимите крик, как при набеге врага, и гоняйтесь друг за другом по очереди; каждый из супругов совершает свой обряд
reading.BadYear.HARSH_RUS_GCOD=Рождённый в год огненного тигра или огненного зайца — из годов, отсекающих род (རུས་གཅོད, rus gcod). Четыре года железа и восемь огня — суровые годы (རྩུབ་པ, rtsub pa), злые для брака.
reading.BadYear.HARSH_RUS_GCOD.remedy=сложите семь каменных туров, поднесите меру зерна и пять долей пищи; когда прибывает невеста, поднимите крик, как при набеге врага, и гоняйтесь друг за другом по очереди; каждый из супругов совершает свой обряд
reading.BadYear.HARSH_MDUN_BSDEBS=Рождённый в год огненного дракона или огненной змеи — из годов дюн-деб (མདུན་བསྡེབས, mdun bsdebs). Четыре года железа и восемь огня — суровые годы (རྩུབ་པ, rtsub pa), злые для брака.
reading.BadYear.HARSH_MDUN_BSDEBS.remedy=сложите семь каменных туров, поднесите меру зерна и пять долей пищи; когда прибывает невеста, поднимите крик, как при набеге врага, и гоняйтесь друг за другом по очереди; каждый из супругов совершает свой обряд
reading.BadYear.HARSH_GRU_KHYER=Рождённый в год огненной лошади или огненной овцы — из годов дру-кхьер (གྲུ་ཁྱེར, gru khyer). Четыре года железа и восемь огня — суровые годы (རྩུབ་པ, rtsub pa), злые для брака.
reading.BadYear.HARSH_GRU_KHYER.remedy=сложите семь каменных туров, поднесите меру зерна и пять долей пищи; когда прибывает невеста, поднимите крик, как при набеге врага, и гоняйтесь друг за другом по очереди; каждый из супругов совершает свой обряд
reading.BadYear.HARSH_BYE_BRAL=Рождённый в год огненной обезьяны или огненной птицы — из годов разлуки (བྱེ་བྲལ, bye bral). Четыре года железа и восемь огня — суровые годы (རྩུབ་པ, rtsub pa), злые для брака.
reading.BadYear.HARSH_BYE_BRAL.remedy=сложите семь каменных туров, поднесите меру зерна и пять долей пищи; когда прибывает невеста, поднимите крик, как при набеге врага, и гоняйтесь друг за другом по очереди; каждый из супругов совершает свой обряд
reading.BadYear.BAD_OMEN=Огненная змея, водяная свинья, водяная птица, деревянная птица, железная овца, земляная птица и железная свинья, все женские годы, — семь годов дурного знамения (ལྟས་ངན, ltas ngan), у каждого своё имя, среди дурных годов для брака.
reading.BadYear.LITTLE_WHITE=Железная собака, железная птица, огненный бык, огненная обезьяна, земляной дракон и водяная змея — шесть малых белых годов (དཀར་ཆུང, dkar chung), у каждого своё имя, среди дурных годов для брака.
reading.BadYear.THAN=Земляной дракон, железная овца, земляная обезьяна, железная птица, железная собака, огненная свинья и огненный бык — семь людей дурной приметы (ཐན་པ, than pa), среди дурных годов для брака.
reading.BadYear.BYA_RA=Огненная лошадь и водяная мышь — стражи неба и земли (བྱ་ར, bya ra), два года среди дурных годов для брака.
reading.BadYear.GRAVE_MEN=Железный бык, деревянная овца, огненная собака и водяной дракон — четыре чёрных человека могилы (དུར་མི་ནག་པོ, dur mi nag po), среди дурных годов для брака.
reading.BadYear.LDING_NAG=Водяной тигр, водяная змея и железная обезьяна — три чёрных сына лдинг (ལྡིང་ནག, lding nag), среди дурных годов для брака.
reading.BadYear.SRIN_KHYER=Водяные мышь, лошадь, птица и заяц, земляные свинья, змея, птица и заяц, огненные дракон и птица и водяной бык — одиннадцать годов, унесённых ракшасами (སྲིན་ཁྱེར, srin khyer). Они дурны для рождённого в них.
reading.BadYear.THER_DRE=Огненная лошадь, водяная птица, деревянный заяц и железная птица — четыре года тер-дре (ཐེར་འདྲེ, ther 'dre). Они дурны для рождённого в них.
reading.BadYear.WIDOWHOOD=Железные обезьяна и свинья, огненные дракон и змея, земляная овца, железная собака, деревянная змея и земляная птица — восемь годов вдовства (ཡུགས་ས, yugs sa), среди дурных годов для брака.
reading.BadYear.AVOID=Деревянный тигр, железная обезьяна, водяной тигр, водяная обезьяна, огненный тигр, водяная змея, водяная собака и водяная свинья — восемь дурных годов: союза, соединяющего один из них, следует избегать прежде всего.
reading.BadYear.BLACK_FANGS=Рождённая под двумя чёрными — из чёрных годов с клыками (ལོ་ནག་མཆེ་བ་ཅན, lo nag mche ba can). Взятая в невесты, она проходит девять домов или расстаётся девять раз; или муж гибнет от клинка, вдовство приходит пять раз, или её род пресекается.
MewaPathYear.FIVE_ELEMENTS=год всех пяти стихий
MewaPathYear.TWO_ELEMENTS=год двух стихий
reading.MewaPathYear={0} Годы читаются также по пути мевы (སྨེ་ལམ, sme lam) — первым, средним или нижним шестидесяти годам круга мевы — и по тому, сколько стихий держит год.
reading.MewaPathYear.FIVE_ELEMENTS=Рождённая в такой год пути мевы — из годов, что держат все пять стихий: очень сурова и дурна как невеста, она пожирает мужа и скалит на него клыки.
reading.MewaPathYear.TWO_ELEMENTS=Рождённый в такой год пути мевы — из девяти годов, что держат две стихии: даже при сотне сыновей под конец род пресекается.
reading.MatchSameKind={0} Двух супругов одного вида года по могуществу против жизненной силы не соединяют: каждый вид несёт свой вред.
reading.MatchSameKind.KHA_YAN=Оба рождены в годы кха-ян (ཁ་ཡན, kha yan), которых не соединяют: дети рождаются слепыми, глухими, хромыми или заикающимися, или родители рано расстаются. Даже если род выживет, живут лишь дочери.
reading.MatchSameKind.KHA_YAN.remedy=если их соединили, совершите нитяной крест крыла гаруды и читайте «Ратнакуту» (དཀོན་བརྩེགས, dkon brtsegs)
reading.MatchSameKind.KHONG_NONG=Оба рождены в годы кхонг-нонг (ཁོང་ནོང, khong nong), которых не соединяют: трое сыновей умирают. Первая половина жизни дурна, поздняя счастлива.
reading.MatchSameKind.KHONG_NONG.remedy=пошлите выкуп за первых детей
reading.MatchSameKind.SE_ZHIG=Оба рождены в годы се-шиг (སེ་ཞིག, se zhig), которых не соединяют: дом сливается с чужим, земля и дом меняются, и приходят наговоры.
reading.MatchSameKind.SE_ZHIG.remedy=совершите обряд кинжала и пять сутр и читайте «Кшитигарбху» (ས་སྙིང, sa snying)
reading.MatchSameKind.KHA_RAL=Оба рождены в годы кха-рэл (ཁ་རལ, kha ral), которых не соединяют: сыновей трудно вырастить, и живут лишь дочери.
reading.MatchSameKind.KHA_RAL.remedy=совершите обряд белой коровы бытия, устраняющий беду
reading.MatchSameKind.DUN_KHUR=Оба рождены в годы дюн-кхур (འདུན་ཁུར, 'dun khur), которых не соединяют: пара разбита, и братья отца гибнут от клинка.
reading.MatchSameKind.DUN_KHUR.remedy=читайте «Белый лотос сострадания» (སྙིང་རྗེ་པདྨ་དཀར་པོ, snying rje padma dkar po) и совершите крест цен (བཙན་མདོས, btsan mdos)
reading.MatchPlanet={0} Муж и жена, рождённые в один день недели, соединены в одной из планет (གཟའ, gza'), и каждая планета приносит дому свой вред.
reading.MatchPlanet.SATURDAY=Муж и жена оба рождены в субботу и соединены в Сатурне: многие в доме умирают, и детей трудно вырастить.
reading.MatchPlanet.SUN_TUE=Муж и жена оба рождены в воскресенье или оба во вторник и соединены в Солнце или Марсе: людям и богатству плохо, жизнь коротка, детей трудно вырастить, и добро теряется.
reading.MatchPlanet.THURSDAY=Муж и жена оба рождены в четверг и соединены в Юпитере: в доме рождается мало детей.
reading.MatchPlanet.MON_WED=Муж и жена оба рождены в понедельник или оба в среду и соединены в Луне или Меркурии: скот теряется, сухое добро не держится в руках, и земледелие не удаётся.
reading.MatchPlanet.FRIDAY=Муж и жена оба рождены в пятницу и соединены в Венере: люди говорят против них, и врагов и тяжб много.
YearSexes.MALE_MALE=оба мужских года
YearSexes.FEMALE_FEMALE=оба женских года
YearSexes.MIXED=мужской и женский год
reading.MatchSameAnimal={0} Муж и жена одного животного года встречаются в нём (ནང་ཕྲད, nang phrad), и каждое животное приносит дому свою долю.
reading.MatchSameAnimal.MOUSE=Муж и жена оба рождены в годы мыши и встречаются в одном животном: рождается много детей, но дом беден.
reading.MatchSameAnimal.OX=Муж и жена оба рождены в годы быка и встречаются в одном животном: у детей изъяны, еда не насыщает, накопленное не копится, болезней много и жизнь коротка.
reading.MatchSameAnimal.TIGER=Муж и жена оба рождены в годы тигра и встречаются в одном животном: дом переходит с земли на землю, и жилище загорается.
reading.MatchSameAnimal.RABBIT=Муж и жена оба рождены в годы зайца и встречаются в одном животном: умирает сын, и могущество, пища и богатство не удаются; дочерей много и жить легко, но под конец род пресекается.
reading.MatchSameAnimal.DRAGON=Муж и жена оба рождены в годы дракона и встречаются в одном животном: пища и богатство качаются от полноты к пустоте.
reading.MatchSameAnimal.SNAKE=Муж и жена оба рождены в годы змеи и встречаются в одном животном: сперва сурово, под конец хорошо, но стоит бояться ссор и разлуки.
reading.MatchSameAnimal.HORSE=Муж и жена оба рождены в годы лошади и встречаются в одном животном: добывать пропитание — долгая погоня, болезней и смертей много, а детей мало.
reading.MatchSameAnimal.SHEEP=Муж и жена оба рождены в годы овцы и встречаются в одном животном: первая половина жизни счастлива, но в старости нет покоя и стоит бояться упадка.
reading.MatchSameAnimal.BIRD=Муж и жена оба рождены в годы птицы и встречаются в одном животном: детей трудно растить, богатство и скот скудны, и половину добра уносит демон.
reading.MatchSameAnimal.DOG=Муж и жена оба рождены в годы собаки и встречаются в одном животном: драк много, совместная жизнь коротка, и половина сыновей умирает.
reading.MatchSameAnimal.PIG=Муж и жена оба рождены в годы свиньи и встречаются в одном животном: нрав мягок, детей много, а богатство и блага велики.
reading.MatchSameElement={0} Муж и жена одной стихии встречаются в ней, и каждая стихия приносит свою долю по полу их годов; годы, во всём одинаковые, оставляют мало пищи.
reading.MatchSameElement.IRON_MALE_MALE=Муж и жена оба рождены в годы железа, оба мужских годов, и встречаются в одной стихии: сыновьям плохо, и богатство терпит потери, от средних до малых.
reading.MatchSameElement.IRON_FEMALE_FEMALE=Муж и жена оба рождены в годы железа, оба женских годов, и встречаются в одной стихии: дочерям плохо.
reading.MatchSameElement.WATER_MALE_MALE=Муж и жена оба рождены в годы воды, оба мужских годов, и встречаются в одной стихии: дочерей много, и пища и богатство терпят потери.
reading.MatchSameElement.EARTH_MALE_MALE=Муж и жена оба рождены в годы земли, оба мужских годов, и встречаются в одной стихии: детей много, но дочерей мало и их трудно растить.
reading.MatchSameElement.EARTH_FEMALE_FEMALE=Муж и жена оба рождены в годы земли, оба женских годов, и встречаются в одной стихии: дочерей много.
reading.MatchSameElement.FIRE_MALE_MALE=Муж и жена оба рождены в годы огня, оба мужских годов, и встречаются в одной стихии: двое ладят, но сыновья умирают, и богатство терпит большие потери.
reading.MatchSameElement.FIRE_FEMALE_FEMALE=Муж и жена оба рождены в годы огня, оба женских годов, и встречаются в одной стихии: детей много, и дом велик.
reading.MatchSameElement.WOOD_FEMALE_FEMALE=Муж и жена оба рождены в годы дерева, оба женских годов, и встречаются в одной стихии: дети не удаются и их трудно растить.
reading.MatchSameElement.WOOD_MIXED=Муж и жена оба рождены в годы дерева, один мужского, другой женского года, и встречаются в одной стихии: есть опасность переломов рук и ног.
reading.MatchSameElement.FIRE_MIXED=Муж и жена оба рождены в годы огня, один мужского, другой женского года, и встречаются в одной стихии: первая половина жизни хороша, а поздняя дурна.
reading.MatchSameElement.EARTH_MIXED=Муж и жена оба рождены в годы земли, один мужского, другой женского года, и встречаются в одной стихии: детей много.
reading.MatchSameElement.IRON_MIXED=Муж и жена оба рождены в годы железа, один мужского, другой женского года, и встречаются в одной стихии: благополучие, за которое они держатся, мало.
reading.MatchSameElement.WATER_MIXED=Муж и жена оба рождены в годы воды, один мужского, другой женского года, и встречаются в одной стихии: это хорошо.
PairList.HEART=близкие сердцем
PairList.CHILDREN=много детей
PairList.WEALTH=богаты и сильны
PairList.PARTING=разлука
PairList.HARD_CHILDREN=детей трудно растить
PairList.RUIN=шесть разорения
PairList.DESTRUCTION=шесть гибели
PairList.OMEN_GREAT=великое дурное знамение
PairList.OMEN_MIDDLING=среднее дурное знамение
reading.MatchPairList={0} Пары животных года также входят в именованные ряды: супруги, чьи два года составляют одну из пар ряда, разделяют её долю, кто бы из двоих ни был мужчиной.
reading.MatchPairList.HEART=Мышь, дракон и обезьяна — трое, близкие сердцем, что ладят: любые двое из них, соединённые как муж и жена, подходят друг другу.
reading.MatchPairList.CHILDREN=Заяц и свинья, птица и змея, бык и овца, обезьяна и дракон, лошадь и собака, соединённые по двое, приносят, как сказано, много детей.
reading.MatchPairList.WEALTH=Птица и бык, тигр и лошадь, заяц и овца, дракон и свинья, обезьяна и змея, соединённые по двое, считаются богатыми и сильными.
reading.MatchPairList.PARTING=Птица и тигр, обезьяна и заяц, дракон и бык, мышь и змея, собака и овца, тигр и свинья, соединённые по очереди, приносят разлуку, и их избегают.
reading.MatchPairList.HARD_CHILDREN=Бык и собака, свинья и овца, дракон и змея, соединённые по двое: детей трудно растить.
reading.MatchPairList.RUIN=Птица и собака, лошадь и бык, змея и тигр — пары шести разорения (འཕུང་དྲུག, 'phung drug): соединённые, они считаются дурными.
reading.MatchPairList.DESTRUCTION=Собака и овца, бык и заяц, птица и мышь — пары шести гибели (འཇིག་དྲུག, 'jig drug), и они дурны.
reading.MatchPairList.OMEN_GREAT=Овца и змея, соединённые, — великое дурное знамение (ལྟས་ངན, ltas ngan): что ни делай, не удаётся.
reading.MatchPairList.OMEN_GREAT.remedy=совершите средний обряд девяти кругов владык земли
reading.MatchPairList.OMEN_MIDDLING=Лошадь и дракон, лошадь и змея, соединённые, — среднее дурное знамение (ལྟས་ངན, ltas ngan): желаемое не сбывается.
reading.MatchPairList.OMEN_MIDDLING.remedy=совершите очищающий обряд ворона (ཕོ་རོག་གི་རྐྱང་སེལ, pho rog gi rkyang sel) и поставьте торму (གཏོར་མ, gtor ma) — образ местного бога
reading.MatchPairLine={0} Пары животных года читаются по одной; где сказано, что один берёт другого, первый — мужчина, а второй — женщина, а в прочих любой может быть мужчиной.
reading.MatchPairLine.DOG_MONKEY=Мужчина года собаки берёт женщину года обезьяны: они живут долго и богаты, и рождается много детей.
reading.MatchPairLine.BIRD_SNAKE=Мужчина года птицы берёт женщину года змеи: рождается много детей, они богаты, приходят долгая жизнь и благо.
reading.MatchPairLine.PIG_MOUSE=Мужчина года свиньи берёт женщину года мыши: ссор много.
reading.MatchPairLine.TIGER_SNAKE=Мужчина года тигра берёт женщину года змеи: рождается много детей, но возникает вражда.
reading.MatchPairLine.SNAKE_TIGER=Мужчина года змеи берёт женщину года тигра: тяжб много, и под конец тяжбы и ссоры их разоряют.
reading.MatchPairLine.SHEEP_MOUSE=Мужчина года овцы берёт женщину года мыши: родителям плохо.
reading.MatchPairLine.MONKEY_MOUSE=Мужчина года обезьяны берёт женщину года мыши: могущество мало, и под конец род пресекается.
reading.MatchPairLine.RABBIT_PIG_MOUSE=Мужчина года зайца берёт женщину года свиньи или мыши: они живут долго, рождается много детей, и средства к жизни велики.
reading.MatchPairLine.DRAGON_BIRD_MONKEY=Мужчина года дракона берёт женщину года птицы или обезьяны: родителям плохо.
reading.MatchPairLine.SHEEP_OX=Мужчина года овцы берёт женщину года быка: родителям плохо: оба живут недолго, и дети остаются сиротами.
reading.MatchPairLine.MONKEY_WITH_DRAGON=Муж и жена годов обезьяны и дракона соединены: они живут долго, рождается много детей, и они богаты.
reading.MatchPairLine.DOG_WITH_HORSE=Муж и жена годов собаки и лошади соединены: рождается много детей, они богаты и живут долго.
reading.MatchPairLine.PIG_RABBIT=Мужчина года свиньи берёт женщину года зайца: они живут долго, и рождается много детей.
reading.MatchPairLine.OX_MOUSE_BIRD=Мужчина года быка берёт женщину года мыши или птицы: они живут долго, богаты добром, детей много, а врагов мало.
reading.MatchPairLine.TIGER_HORSE=Мужчина года тигра берёт женщину года лошади: рождается много детей, они богаты и живут долго.
reading.MatchPairLine.DRAGON_WITH_MOUSE_PIG=Муж и жена годов дракона и мыши или свиньи соединены: оба родителя живут долго, но детям плохо.
reading.MatchPairLine.MONKEY_SNAKE=Мужчина года обезьяны берёт женщину года змеи: они живут долго, рождается много детей, и они богаты.
reading.MatchPairLine.BIRD_OX=Мужчина года птицы берёт женщину года быка: рождается много детей, они богаты, и приходит долгая жизнь.
reading.MatchPairLine.SHEEP_SNAKE=Мужчина года овцы берёт женщину года змеи: они обретают довольство.
reading.MatchPairLine.SNAKE_SHEEP=Мужчина года змеи берёт женщину года овцы: они живут долго и богаты.
reading.MatchPairLine.DRAGON_OX=Мужчина года дракона берёт женщину года быка: они богаты добром.
reading.MatchPairLine.SNAKE_MOUSE=Мужчина года змеи берёт женщину года мыши: ничего из того, что они делают, не удаётся.
reading.MatchPairLine.HORSE_OX=Мужчина года лошади берёт женщину года быка: они процветают и богаты.
reading.MatchPairLine.OX_WITH_RABBIT=Муж и жена годов быка и зайца соединены: они живут долго, богатство велико, и они обретают довольство.
reading.MatchPairLine.DOG_TIGER=Мужчина года собаки берёт женщину года тигра: это благоприятно.
reading.MatchPairLine.MOUSE_SNAKE=Мужчина года мыши берёт женщину года змеи: дети умирают, и выживших трудно растить.
reading.MatchPairLine.OX_DRAGON=Мужчина года быка берёт женщину года дракона: под конец дом разоряется.
reading.MatchPairLine.SHEEP_DOG=Мужчина года овцы берёт женщину года собаки: родителям плохо.
reading.MatchPairLine.DOG_SHEEP=Мужчина года собаки берёт женщину года овцы: приходят враги и смерти.
reading.MatchPairLine.DOG_OX=Мужчина года собаки берёт женщину года быка: наговоры и споры не прекращаются.
reading.MatchPairLine.OX_DOG=Мужчина года быка берёт женщину года собаки: под конец дом разоряется.
reading.MatchPairLine.DRAGON_SHEEP=Мужчина года дракона берёт женщину года овцы: они расстаются и так и не видят детей.
reading.MatchPairLine.SHEEP_DRAGON=Мужчина года овцы берёт женщину года дракона: приходят смерти, и на них падает кара господ и начальников.
reading.MatchPairLine.PIG_WITH_SNAKE=Муж и жена годов свиньи и змеи соединены: род пресекается, и ссор много.
reading.MatchPairLine.DOG_WITH_DRAGON=Муж и жена годов собаки и дракона соединены: потери не прекращаются.
reading.MatchPairLine.DOG_DRAGON=Мужчина года собаки берёт женщину года дракона: вражды и споров много.
reading.MatchPairLine.MOUSE_WITH_HORSE=Муж и жена годов мыши и лошади соединены: нет покоя на душе, и страданий много.
reading.MatchPairLine.HORSE_MOUSE=Мужчина года лошади берёт женщину года мыши: потери велики, и дети не выживают.
reading.MatchPairLine.OX_WITH_SHEEP=Муж и жена годов быка и овцы соединены: урожаи не удаются, и торговля терпит потери.
reading.MatchPairLine.TIGER_WITH_MONKEY=Муж и жена годов тигра и обезьяны соединены: собираются враги, и жизнь тигра обрывается; не ладя ни с кем, под конец они разоряются.
reading.MatchPairLine.MONKEY_TIGER=Мужчина года обезьяны берёт женщину года тигра: дети не приходят.
reading.MatchPairLine.SNAKE_HORSE=Мужчина года змеи берёт женщину года лошади: род пресекается.
reading.MatchPairLine.MOUSE_WITH_SHEEP=Муж и жена годов мыши и овцы соединены: приходят ссоры и потери.
reading.MatchPairLine.SHEEP_PIG=Мужчина года овцы берёт женщину года свиньи: рождается много детей.
MatchMewa.SAME=одна мева
MatchMewa.BYUR_DUS=собранная беда
MatchMewa.MOTHER_SON=мать и сын
MatchMewa.ENEMY=враги
MatchMewa.DEMON=демон мевы
reading.MatchMewa={0} Мевы (སྨེ་བ, sme ba) рождения мужа и жены сопоставляются: хотя можно сравнивать мевы всех четырёх аспектов, главная — мева рождения.
reading.MatchMewa.SAME=Муж и жена рождены на одной меве и соединены в ней: пищи у них будет мало.
reading.MatchMewa.BYUR_DUS=Мужчина и женщина оба рождены на двух чёрных: рождённые там вместе, они собирают беду (བྱུར་འདུས, byur 'dus).
reading.MatchMewa.MOTHER_SON=Две мевы рождения встречаются как мать и сын, стихия одной порождает стихию другой, и такая встреча хороша.
reading.MatchMewa.ENEMY=Две мевы рождения встречаются как враги, стихия одной одолевает стихию другой, и такая встреча дурна.
reading.MatchMewa.DEMON=Мужчина рождён на семи красных, а женщина на трёх синих: их мевы встречаются как враги, и это демон мевы (སྨེ་བའི་བདུད, sme ba'i bdud), поэтому двоих не соединяют.
reading.MatchMewa.DEMON.remedy=если их соединили, совершите обряд семи (བདུན་ཚོག, bdun tshog)
MatchTrigramKind.GNAM_SMAN=небесная богиня
MatchTrigramKind.DPAL_BSKYED=приумножение славы
MatchTrigramKind.SROG_TSHO=поддержание жизни
MatchTrigramKind.BDUD_GCOD=разрез демона
MatchTrigramKind.LUS_CHAD=разрез тела
MatchTrigramKind.DRE_LNGA=пять демонов
MatchTrigramKind.GNOD_PA=вред
MatchTrigramKind.ONE=одна триграмма
reading.MatchTrigram={0} Триграммы рождения (སྐྱེས་སྤར, skyes spar) мужа и жены сопоставляются: встретившись хорошими способами, они благословенны в сыновьях и внуках, а четырьмя дурными — под конец детям плохо.
reading.MatchTrigram.GNAM_SMAN=Две триграммы рождения встречаются как небесная богиня (གནམ་སྨན, gnam sman): огонь с водой, земля с небом, озеро с горой или гром с ветром. Это хорошее соединение, украшенное, как золотые глаза бирюзой, благоприятное, великой славы, с детьми и богатством.
reading.MatchTrigram.DPAL_BSKYED=Две триграммы рождения встречаются как приумножение славы (དཔལ་བསྐྱེད, dpal bskyed): огонь с ветром, земля с озером, небо с горой или вода с громом. Это тоже хорошо: слава богов нисходит на людей, боги и люди добры, приходят дети и богатство.
reading.MatchTrigram.SROG_TSHO=Две триграммы рождения встречаются как поддержание жизни (སྲོག་འཚོ, srog 'tsho): огонь с громом, земля с горой или озеро с небом. Приходят долгая жизнь и заслуги — благоприятная свастика, свернувшаяся кольцом.
reading.MatchTrigram.BDUD_GCOD.LI_KHEN=Триграммы огня и неба встречаются как разрез демона (བདུད་གཅོད, bdud gcod), и это дурно: каждый сторожит другому пустой дом; богатые сейчас, под конец они нищие, и прорывается озеро горя и страданий.
reading.MatchTrigram.BDUD_GCOD.LI_KHEN.remedy=отвратите перекрёсток демонов; в дар дайте пищу, одежду, лекарства и питание; прогоните умерших, нарушивших обеты (དམ་སྲི, dam sri), и поднесите водяные тормы (ཆུ་གཏོར, chu gtor)
reading.MatchTrigram.BDUD_GCOD.DWA_ZIN=Триграммы озера и грома встречаются как разрез демона (བདུད་གཅོད, bdud gcod), и это дурно: вонзаются нож и кинжал, и под конец один из супругов гибнет от клинка.
reading.MatchTrigram.BDUD_GCOD.DWA_ZIN.remedy=читайте «Восемь явлений неба и земли» (སྣང་བརྒྱད, snang brgyad) и «Перечисление имён Манджушри» (མཚན་བརྗོད, mtshan brjod)
reading.MatchTrigram.BDUD_GCOD.KHON_KHAM=Триграммы земли и воды встречаются как разрез демона (བདུད་གཅོད, bdud gcod), и это дурно: рождённые в рушащемся доме, они всегда корень потерь.
reading.MatchTrigram.BDUD_GCOD.KHON_KHAM.remedy=совершите поворот лица, отвращение на перекрёстке и общий нитяной крест (མདོས, mdos); читайте «Дхарани Ратнакету» (ཏོག་གཟུངས, tog gzungs) и совершите очищающее омовение; обмотайте иву ростом с тело чёрной нитью с узлом на каждый год возраста и воткните её у воды на севере
reading.MatchTrigram.BDUD_GCOD.GIN_ZON=Триграммы горы и ветра встречаются как разрез демона (བདུད་གཅོད, bdud gcod), и это дурно: чёрный небесный пёс: даже при сотне сыновей род под конец пресекается.
reading.MatchTrigram.BDUD_GCOD.GIN_ZON.remedy=читайте «Аватамсаку» (ཕལ་པོ་ཆེ, phal po che) и «Дхарани Ратнакету» (ཏོག་གཟུངས, tog gzungs) и совершите нитяной крест (མདོས, mdos) чёрного небесного пса
reading.MatchTrigram.LUS_CHAD.LI_KHON=Триграммы огня и земли встречаются как разрез тела (ལུས་ཆད, lus chad), и это дурно: они расстаются, будто их уносит ветер, и в конце поля не родят, а супруги разлучены.
reading.MatchTrigram.LUS_CHAD.LI_KHON.remedy=читайте «Праджняпарамиту» и «Ушнишу» (གཙུག་ཏོར, gtsug tor); начертите печать триграммы огня на черепе лошади, наденьте шапку на выкупную фигурку и отправьте их на юг; череп овцы с печатью и выкуп одеждой отправьте на юго-запад
reading.MatchTrigram.LUS_CHAD.DWA_ZON=Триграммы озера и ветра встречаются как разрез тела (ལུས་ཆད, lus chad), и это дурно: мясник с ножом, что под конец приходит верхом на осле, ведя собаку.
reading.MatchTrigram.LUS_CHAD.DWA_ZON.remedy=совершите нитяной крест-сокровище (གཏེར་མདོས, gter mdos) владык земли и обряд долгой жизни и устройте пир светильников, не ждущий возврата; начертите печати озера и ветра на черепе козла и отправьте его с выкупной фигуркой по счёту лет
reading.MatchTrigram.LUS_CHAD.GIN_ZIN=Триграммы горы и грома встречаются как разрез тела (ལུས་ཆད, lus chad), и это дурно: тяжбы смешиваются со скверной, и хоть сейчас они ладят, под конец расстаются.
reading.MatchTrigram.LUS_CHAD.GIN_ZIN.remedy=воткните перо ястреба в красную выкупную фигурку в пядь высотой и отправьте её в сторону врага; начертите печать грома на черепе осла и отправьте его на восток с фигуркой, шёлком и лоскутами; читайте о пользе обхода ступы
reading.MatchTrigram.LUS_CHAD.KHEN_KHAM=Триграммы неба и воды встречаются как разрез тела (ལུས་ཆད, lus chad), и это дурно: связанные разбойниками духов цен (བཙན, btsan), они в опасности потерять людей и коней.
reading.MatchTrigram.LUS_CHAD.KHEN_KHAM.remedy=придавите вредоносных духов умерших (སྲི, sri), что приносят врагов и отвратите врагов; повяжите на собаку полоски шёлка, посадите на неё выкупную фигурку и отправьте на северо-запад; посадите фигурку на свинью, наденьте на неё нижнюю одежду и отправьте на север
reading.MatchTrigram.DRE_LNGA.LI_DWA=Триграммы огня и озера встречаются как пять демонов (འདྲེ་ལྔ, 'dre lnga), и это дурно: дети, богатство и блага сметаются, словно метлой, и потери и пустота очень велики.
reading.MatchTrigram.DRE_LNGA.LI_DWA.remedy=читайте «Пять дхарани» и «Поток богатства»; придавите вредоносных духов умерших (སྲི, sri), что приносят потери и прогоните демонов цен; отправьте черепа лошади и козла с печатями и выкупными фигурками на юг и запад
reading.MatchTrigram.DRE_LNGA.KHON_ZON=Триграммы земли и ветра встречаются как пять демонов (འདྲེ་ལྔ, 'dre lnga), и это дурно: могила жаждет их ночью: жизни вредится, они расстаются, и наследников мало.
reading.MatchTrigram.DRE_LNGA.KHON_ZON.remedy=читайте «Пять дхарани» и сутру долгой жизни и совершите обряд против разлуки; повяжите шёлк на овцу, посадите на неё фигурку, покройте её тканью справа и слева, начертите печать каждого и отправьте каждую в свою сторону
reading.MatchTrigram.DRE_LNGA.GIN_KHAM=Триграммы горы и воды встречаются как пять демонов (འདྲེ་ལྔ, 'dre lnga), и это дурно: дом демонов (བདུད, bdud): их счастье обрывается посередине.
reading.MatchTrigram.DRE_LNGA.GIN_KHAM.remedy=отвратите Владыку смерти черепами быка и свиньи; придавите вредоносных духов умерших (སྲི, sri), что приносят врагов и поднесите светильники
reading.MatchTrigram.DRE_LNGA.KHEN_ZIN=Триграммы неба и грома встречаются как пять демонов (འདྲེ་ལྔ, 'dre lnga), и это дурно: могила жаждет их жизни, и приходят тяжбы, наговоры и смерти.
reading.MatchTrigram.DRE_LNGA.KHEN_ZIN.remedy=читайте «Благую эпоху», «Великую силу» и «Ушнишу» (གཙུག་ཏོར, gtsug tor); делайте цаца и подносите светильники; вылепите фигуру старика из земли обрушившегося берега на северо-западе и отправьте её с фигуркой по счёту лет и черепом собаки с печатью на северо-запад
reading.MatchTrigram.GNOD_PA.LI_GIN=Триграммы огня и горы встречаются как вред (གནོད་པ, gnod pa), и это дурно: это зовётся огнём, пылающим в небе: могущество пожирает богатство.
reading.MatchTrigram.GNOD_PA.LI_GIN.remedy=устройте пир, не ждущий возврата, и призовите благополучие богатства; посадите фигурки на изображения лошади и быка, покройте их верхней одеждой и одеждой для правой ноги и отправьте на юг и северо-восток
reading.MatchTrigram.GNOD_PA.KHEN_ZON=Триграммы неба и ветра встречаются как вред (གནོད་པ, gnod pa), и это дурно: чёрный пёс неба и земли: род пресекается, и людоеды уносят тело.
reading.MatchTrigram.GNOD_PA.KHEN_ZON.remedy=читайте «Пять дхарани», «Дхарани Ратнакету» (ཏོག་གཟུངས, tog gzungs) и «Аватамсаку» (ཕལ་པོ་ཆེ, phal po che)
reading.MatchTrigram.GNOD_PA.DWA_KHAM=Триграммы озера и воды встречаются как вред (གནོད་པ, gnod pa), и это дурно: река, перерезанная посередине: роды распадаются, и разлук и разорений много.
reading.MatchTrigram.GNOD_PA.DWA_KHAM.remedy=совершите обряд против разлуки и читайте «Ратнакуту» (དཀོན་བརྩེགས, dkon brtsegs); посадите фигурки на изображения козла и свиньи, воткните в них их собственные оперённые стрелы и отправьте на северо-запад
reading.MatchTrigram.GNOD_PA.KHON_ZIN=Триграммы земли и грома встречаются как вред (གནོད་པ, gnod pa), и это дурно: словно разбойники выходят в путь: люди и кони теряются разом.
reading.MatchTrigram.GNOD_PA.KHON_ZIN.remedy=придавите вредоносных духов умерших (སྲི, sri), что приносят врагов и отвратите врагов; повяжите полоски шёлка на изображение зайца, посадите на него выкупную фигурку и отправьте на восток; посадите фигурку на желтоголовую овцу, наденьте на неё ворот и овчину и отправьте на юго-запад
reading.MatchTrigram.ONE.LI=Муж и жена оба рождены на триграмме огня, а одна триграмма, соединённая в себе, дурна: уста опрокинуты. У такого соединения могущество уносится, словно разбойниками.
reading.MatchTrigram.ONE.KHON=Муж и жена оба рождены на триграмме земли, а одна триграмма, соединённая в себе, дурна: земля взбаламучена. У такого соединения могущество уносится, словно разбойниками.
reading.MatchTrigram.ONE.DWA=Муж и жена оба рождены на триграмме озера, а одна триграмма, соединённая в себе, дурна: вонзены нож и кинжал. У такого соединения могущество уносится, словно разбойниками.
reading.MatchTrigram.ONE.KHEN=Муж и жена оба рождены на триграмме неба, а одна триграмма, соединённая в себе, дурна: исчезло в небе. У такого соединения могущество уносится, словно разбойниками.
reading.MatchTrigram.ONE.KHAM=Муж и жена оба рождены на триграмме воды, а одна триграмма, соединённая в себе, дурна: прорвалось у подножия. У такого соединения могущество уносится, словно разбойниками.
reading.MatchTrigram.ONE.GIN=Муж и жена оба рождены на триграмме горы, а одна триграмма, соединённая в себе, дурна: унесено на гору. У такого соединения могущество уносится, словно разбойниками.
reading.MatchTrigram.ONE.ZIN=Муж и жена оба рождены на триграмме грома, а одна триграмма, соединённая в себе, дурна: потеряно в гнезде. У такого соединения могущество уносится, словно разбойниками.
reading.MatchTrigram.ONE.ZON=Муж и жена оба рождены на триграмме ветра, а одна триграмма, соединённая в себе, дурна: поражено скверной. У такого соединения могущество уносится, словно разбойниками.
reading.MatchTrigramChildren={0} Соединённые триграммы рождения говорят и о числе детей. Некоторые считают, что две мужские триграммы приносят много сыновей, а две женские — много дочерей, и это надо проверить.
reading.MatchTrigramChildren.LI_KHON=Когда триграммы рождения — огонь и земля, рождаются пятеро детей.
reading.MatchTrigramChildren.KHON_DWA=Когда триграммы рождения — земля и озеро, рождается восемь или девять детей.
reading.MatchTrigramChildren.DWA_GIN=Когда триграммы рождения — озеро и гора, приходят трое или пятеро детей.
reading.MatchTrigramChildren.GIN_KHAM=Когда триграммы рождения — гора и вода, рождаются трое или двое детей, а то и пять сыновей.
reading.MatchTrigramChildren.GIN_ZIN=Когда триграммы рождения — гора и гром, рождаются один сын и одна дочь.
reading.MatchTrigramChildren.ZON_ZIN=Когда триграммы рождения — ветер и гром, рождаются два сына.
reading.MatchTrigramChildren.KHAM_ZON=Когда триграммы рождения — вода и ветер, приходят три сына.
reading.MatchTrigramChildren.DWA_KHEN=Когда триграммы рождения — озеро и небо, приходят трое или пятеро детей.
reading.MatchTrigramChildren.LI_KHEN=Когда триграммы рождения — огонь и небо, приходят два брата.
reading.MatchTrigramChildren.LI_ZON=Когда триграммы рождения — огонь и ветер, рождается много дочерей.
reading.MatchTrigramChildren.KHAM_ZIN=Когда триграммы рождения — вода и гром, рождаются один сын и две дочери.
reading.MatchHandWaver={0} Восемь рождений, каждое — пара животных года на одной триграмме, зовутся восемью машущими рукой (ལག་གཡབ་བརྒྱད, lag g.yab brgyad), и соединение с одним из них дурно.
reading.MatchHandWaver.GIN=Рождённый в год быка или тигра на триграмме горы — из восьми машущих рукой (ལག་གཡབ་བརྒྱད, lag g.yab brgyad): соединение с ним дурно.
reading.MatchHandWaver.ZON=Рождённый в год дракона или змеи на триграмме ветра — из восьми машущих рукой (ལག་གཡབ་བརྒྱད, lag g.yab brgyad): соединение с ним дурно.
reading.MatchHandWaver.KHON=Рождённый в год овцы или обезьяны на триграмме земли — из восьми машущих рукой (ལག་གཡབ་བརྒྱད, lag g.yab brgyad): соединение с ним дурно.
reading.MatchHandWaver.KHEN=Рождённый в год мыши или свиньи на триграмме неба — из восьми машущих рукой (ལག་གཡབ་བརྒྱད, lag g.yab brgyad): соединение с ним дурно.
MatchTrigramLine.WOOD_WOMAN_KHON=деревянная женщина на триграмме земли
MatchTrigramLine.IRON_HUSBAND_GIN=железный муж на триграмме горы
MatchTrigramLine.KHEN_WOMAN_ZON_MAN=небо и ветер
reading.MatchTrigramLine={0} Некоторые рождения на триграмме рождения читаются по одному: через владык земли (ས་བདག, sa bdag) они вредят супругу или вредят богатству дома.
reading.MatchTrigramLine.WOOD_WOMAN_KHON=Женщина года деревянного тигра или деревянного зайца, рождённая на триграмме земли: владыки земли вредят её мужу.
reading.MatchTrigramLine.WOOD_WOMAN_KHON.remedy=совершите обряд, улаживающий владык земли
reading.MatchTrigramLine.IRON_HUSBAND_GIN=Муж года железной птицы или железной обезьяны, рождённый на триграмме горы: владыки земли вредят его жене.
reading.MatchTrigramLine.IRON_HUSBAND_GIN.remedy=совершите обряд, улаживающий владык земли, и читайте «Восемь явлений неба и земли» (སྣང་བརྒྱད, snang brgyad)
reading.MatchTrigramLine.KHEN_WOMAN_ZON_MAN=Женщина рождена на триграмме неба, а мужчина на триграмме ветра: поздние годы идут дурно, и богатство тоже.
reading.MatchTrigramLine.KHEN_WOMAN_ZON_MAN.remedy=совершите практику, собирающую богатство
HiddenWheel.GNAM_SMAN=небесная богиня
HiddenWheel.SROG_TSHO=поддержание жизни
HiddenWheel.DPAL_BSKYED=приумножение славы
HiddenWheel.PHYWA_LON=обретённая удача
HiddenWheel.PHYWA_MNYAM=равная удача
HiddenWheel.GNOD_PA=вред
HiddenWheel.DRE_LNGA=пять демонов
HiddenWheel.BDUD_GCOD=разрез демона
HiddenWheel.LUS_CHAD=разрез тела
SiblingsWin.EQUAL=поровну
SiblingsWin.MAN=мужчина побеждает
SiblingsWin.WOMAN=мужчина побеждён
BadYearPebble.BLACK=чёрный камешек
BadYearPebble.SPECKLED_WOMAN=пёстрый камешек
BadYearPebble.SPECKLED_MAN=пёстрый камешек
BadYearPebble.WHITE=белый камешек
SpouseKind.KARMA=жена кармы
SpouseKind.KIN=жена родства
SpouseKind.ENMITY=жена вражды
reading.MatchHidden={0} Скрытое (ཁུག་པ, khug pa) ставит мевы каждого аспекта мужа и жены на девять колёс: каждая мева стоит за свою триграмму, пять жёлтых мужчины считаются двумя чёрными, а женщины — семью красными.
reading.MatchDeepHidden={0} Глубже скрытое (ཡང་ཁུག, yang khug) оставляет мевы мужчины на месте и перетягивает мевы женщины: одну и две, три и девять, четыре и восемь друг к другу. Жизненная сила говорит, долго ли они будут вместе, тело — о болезнях и детях, могущество — о пище и богатстве, конь ветра — о расположении людей.
reading.MatchHidden.GNAM_SMAN=Две мевы падают на колесо небесной богини (གནམ་སྨན, gnam sman), одно из первых трёх, словно солнце восходит в безоблачном небе: двоим спокойно, конец хорош, вместе они долго; вредоносные духи не могут их поразить, и детей у них много.
reading.MatchHidden.SROG_TSHO=Две мевы падают на колесо поддержания жизни (སྲོག་འཚོ, srog 'tsho), одно из первых трёх, словно солнце восходит в безоблачном небе: жизнь долгая, болезни редки, вредоносные духи держатся в стороне, и домочадцев становится больше.
reading.MatchHidden.DPAL_BSKYED=Две мевы падают на колесо приумножения славы (དཔལ་བསྐྱེད, dpal bskyed), одно из первых трёх, словно солнце восходит в безоблачном небе: слава растёт, дети любящие, богатство множится, болезни редки, и дом крепок и богат.
reading.MatchHidden.PHYWA_LON=Две мевы одни и те же — девять, восемь, семь или шесть — и падают на колесо обретённой удачи (ཕྱྭ་ལོན, phywa lon), словно солнце между облаками: жизнь долгая, богатство и добро множатся, боги и люди добры, дети средние, и желания исполняются.
reading.MatchHidden.PHYWA_MNYAM=Две мевы одни и те же — одна, две, три или четыре, — встреча внутри, и падают на колесо равной удачи (ཕྱྭ་མཉམ, phywa mnyam), словно солнце между облаками: богатство находят, когда ищут.
reading.MatchHidden.PHYWA_MNYAM.remedy=делайте подношения богиням земли (སྨན་མོ, sman mo) и доброму местному богу (ཡུལ་ལྷ, yul lha)
reading.MatchHidden.GNOD_PA=Две мевы падают на колесо вреда (གནོད་པ, gnod pa), словно солнце между облаками, и это идёт плохо: потери богатства велики, и под конец они нищие; детей мало, друзья уходят, и приходят ноши, которых не снести.
reading.MatchHidden.GNOD_PA.remedy=пятеро жрецов из родов, не родственных паре, собирают благоприятные вещества и призывают благополучие; сильное отвращение идёт хорошо
reading.MatchHidden.DRE_LNGA=Две мевы падают на колесо пяти демонов (འདྲེ་ལྔ, 'dre lnga), одно из последних трёх, словно иней на земле: демоны и вредоносные духи вошли навсегда; род прерывается, пища и богатство теряются, многие умирают, и тяжбы и обвинения приходят без конца.
reading.MatchHidden.DRE_LNGA.remedy=отнесите в святое место масляные светильники по числу лет и усердствуйте в обрядах, умножающих заслуги
reading.MatchHidden.BDUD_GCOD=Две мевы падают на колесо разреза демона (བདུད་གཅོད, bdud gcod), одно из последних трёх, словно иней на земле: муж умирает рано, болезни не уходят, добро не копится, и женщина всегда в горе.
reading.MatchHidden.BDUD_GCOD.remedy=отвратите врагов, сделайте нитяной крест (མདོས, mdos) против врагов и придавите их; помогает оттиснуть тысячу глиняных обетных изображений (ཚ་ཚ, tsha tsha)
reading.MatchHidden.LUS_CHAD=Две мевы падают на колесо разреза тела (ལུས་ཆད, lus chad), одно из последних трёх, словно иней на земле: могущество уходит из-под ног, враги вредят, приходят тяжбы и наказания, болезни не уходят, и ничто не удаётся.
reading.MatchHidden.LUS_CHAD.remedy=придавите и отвратите врагов и усердствуйте в средствах, исправляющих бытие и умножающих заслуги
reading.MatchSiblings={0} Число братьев (སྤུན་གྲངས, spun grangs) считает жизненную силу, тело, могущество, коня ветра и меву рождения каждого супруга по их стихиям — дерево один камешек, земля два, вода три, огонь четыре, железо пять — и ставит две суммы друг против друга.
reading.MatchSiblings.EQUAL=Мужчина и женщина насчитывают одинаковое число камешков: больше и меньше поровну, и число братьев идёт хорошо.
reading.MatchSiblings.MAN=Мужчина насчитывает больше камешков, чем женщина, и в числе братьев мужчина побеждает.
reading.MatchSiblings.WOMAN=Женщина насчитывает больше камешков, чем мужчина, и в числе братьев мужчина побеждён.
reading.MatchSiblings.WOMAN.remedy=повесьте на мужчину колесо Манджушри (འཇམ་དབྱངས, 'jam dbyangs)
reading.MatchSiblings.AGREE=Две суммы вместе дают чётное число, и число братьев согласно: каждый держится мыслей другого и вошёл в его сердце; ссорятся они мало, и потери их малы.
reading.MatchSiblings.DISAGREE=Две суммы вместе дают нечётное число, и число братьев несогласно: они всё время ссорятся из-за пустого, и те, кто днём ссорится, а ночью любит, под конец приходят к великой обиде.
reading.MatchSiblings.DISAGREE.remedy=читайте писания о прежних жизнях Победителя (སྐྱེས་རབས, skyes rabs)
reading.BadYearPebble={0} Дурные годы для брака не сводят пару за парой, а читают один раз для пары, одним решающим камешком (བཏང་གཅོད, btang gcod): чёрным, если оба рождены в них, пёстрым, если один, белым, если ни один.
reading.BadYearPebble.BLACK=Мужчина и женщина оба рождены в дурные для брака годы, и решающий камешек чёрный: это идёт плохо.
reading.BadYearPebble.SPECKLED_WOMAN=Из двоих только женщина рождена в дурной для брака год, и решающий камешек пёстрый; но дурной год женщины прежде всего идёт плохо.
reading.BadYearPebble.SPECKLED_MAN=Из двоих только мужчина рождён в дурной для брака год, и решающий камешек пёстрый.
reading.BadYearPebble.WHITE=Ни мужчина, ни женщина не рождены в дурной для брака год, и решающий камешек белый.
reading.SpouseKind={0} Каждый из четырёх аспектов одиночного сопоставления даёт свой род жены, в трёх степенях — лучшей, средней и последней; затем союз судят по ним в целом.
reading.SpouseKind.KARMA=В этих аспектах женщина — жена кармы (ལས་ཀྱི་ཆུང་མ, las kyi chung ma), лучший род: двое встречаются как мать и сын или как земля или вода, встречающая саму себя.
reading.SpouseKind.KIN=В этих аспектах женщина — жена родства (གཉེན་གྱི་ཆུང་མ, gnyen gyi chung ma), средний род: двое встречаются как друзья или как огонь, железо или дерево, встречающее само себя.
reading.SpouseKind.ENMITY=В этих аспектах женщина — жена вражды (དགྲའི་ཆུང་མ, dgra'i chung ma), последний род: двое встречаются как враги.
MatchWhole.KARMA=жена кармы
MatchWhole.KIN=жена родства
MatchWhole.ENMITY=жена вражды
MatchWhole.MIXED=роды смешаны
reading.MatchTogether={0} Союз судят в целом, а не суммой: четыре рода с пунктами ниже, один камешек пары за дурные годы и число братьев. Те, чья жизнь или жизненная сила исчерпана, хронически больные, бедные, те, кому грозит дурная молва, и те, у кого дурная карма, плохи, даже когда союз согласен.
reading.MatchTogether.KARMA=Все четыре аспекта дают жену кармы (ལས་ཀྱི་ཆུང་མ, las kyi chung ma), лучший род, и союз стоит в лучшей степени; пункты ниже говорят, где он всё же идёт плохо.
reading.MatchTogether.KIN=Все четыре аспекта дают жену родства (གཉེན་གྱི་ཆུང་མ, gnyen gyi chung ma), средний род, и союз стоит в средней степени; пункты ниже говорят, где он идёт хорошо или плохо.
reading.MatchTogether.ENMITY=Все четыре аспекта дают жену вражды (དགྲའི་ཆུང་མ, dgra'i chung ma), последний род, и союз стоит в последней степени; ему отвечают обряды, которые дают пункты ниже.
reading.MatchTogether.MIXED=Аспекты дают жён разных родов — лучшего, среднего и последнего, — и их взвешивают вместе, в целом, с пунктами ниже.
reading.MatchRiseDecline={0} Жизненная сила (སྲོག, srog) каждого из супругов переносится на год рождения другого и отсчитывается по двенадцати стадиям: попав на дурную стадию, она непременно приносит внезапный испуг, а иначе даёт счастье.
reading.MatchRiseDecline.TAKING_BREATH=Жизненная сила падает на стадию вдоха, среднюю; при таком соединении детей трудно растить.
reading.MatchRiseDecline.IN_THE_WOMB=Жизненная сила падает на стадию в утробе, среднюю; при таком соединении болезней много.
reading.MatchRiseDecline.BODY_COMPLETE=Жизненная сила падает на стадию, когда тело сложилось, одну из лучших; при таком соединении всё равно приходят болезни многих видов.
reading.MatchRiseDecline.BIRTH=Жизненная сила падает на стадию рождения, среднюю; при таком соединении дети выживают.
reading.MatchRiseDecline.BATHING=Жизненная сила падает на стадию омовения, одну из лучших; при таком соединении люди добры.
reading.MatchRiseDecline.DRESSING=Жизненная сила падает на стадию облачения, одну из лучших; при таком соединении богатства и пищи вдоволь.
reading.MatchRiseDecline.WORKING=Жизненная сила падает на стадию труда, среднюю; при таком соединении полнота и пустота сильно качаются.
reading.MatchRiseDecline.FLOURISHING=Жизненная сила падает на стадию расцвета, одну из лучших; при таком соединении это хорошо.
reading.MatchRiseDecline.DECLINE=Жизненная сила падает на стадию упадка, одну из дурных; при таком соединении люди враждебны.
reading.MatchRiseDecline.ILLNESS=Жизненная сила падает на стадию болезни, одну из дурных; при таком соединении приходят болезни многих видов.
reading.MatchRiseDecline.DEATH=Жизненная сила падает на стадию смерти, одну из дурных; при таком соединении приходят смерти.
reading.MatchRiseDecline.ENTERING_THE_TOMB=Жизненная сила падает на стадию могилы, одну из дурных; при таком соединении это дурно.
reading.MatchParentStage={0} Вдох берётся от года отца каждого из супругов и отсчитывается до собственного года супруга: внешний способ — от животного года отца, тайный — от его жизненной силы (སྲོག, srog); матери отсчитываются так же, и главная — сторона женщины.
reading.MatchParentStage.FATHER.GOOD=При отсчёте от отца стадия падает на одну из шести хороших: соединение в них хорошо, благоприятно и счастливо, и приходит много детей.
reading.MatchParentStage.FATHER.BAD=При отсчёте от отца стадия падает на одну из шести дурных: соединение в них дурно, и под конец роду грозит пресечение.
reading.MatchParentStage.FATHER.BAD.remedy=читайте «Великую тысячу, всё сокрушающую» (སྟོང་ཆེན་རབ་འཇོམས, stong chen rab 'joms) и совершите нитяной крест бытия (སྲིད་མདོས, srid mdos) бога Брахмы
reading.MatchParentStage.MOTHER.GOOD=При отсчёте от матери стадия согласна: дети приходят в согласном числе.
reading.MatchParentStage.MOTHER.BAD=При отсчёте от матери стадия не согласна: от детей нет помощи.
reading.MatchParentStage.MOTHER.BAD.remedy=читайте «Ушнишу» (གཙུག་ཏོར, gtsug tor)
reading.RiseDecline={0} Стадия подъёма и упадка (དར་གུད, dar gud) каждого аспекта, отсчитанная до собственного рождения, — одна из шести светлых и шести тёмных, и у каждой своё имя для этого аспекта.
reading.RiseDecline.VITALITY.FLOURISHING=В стадии расцвета жизненная сила обретает великое сокровище (གཏེར་ཆེན, gter chen). Это сокровище жизни. Его образ — хорошо выросшее дерево.
reading.RiseDecline.BODY.FLOURISHING=В стадии расцвета тело обретает великое сокровище (གཏེར་ཆེན, gter chen). Это сокровище тела. Его образ — десять коз, вышедших на перевал.
reading.RiseDecline.DESTINY.FLOURISHING=В стадии расцвета могущество обретает великое сокровище (གཏེར་ཆེན, gter chen). Это сокровище пищи и богатства: сила и достаток сходятся вместе. Его образ — знамя, привязанное к копью.
reading.RiseDecline.LUCK.FLOURISHING=В стадии расцвета конь ветра обретает великое сокровище (གཏེར་ཆེན, gter chen). Это сокровище довольства: на него надеются все, и всякая нужда удовлетворена. Его образ — золото, украшенное бирюзой.
reading.RiseDecline.VITALITY.DRESSING=В стадии облачения жизненная сила обретает стойкость (སོ་ཐུབ, so thub). Жизненная сила не прерывается. Его образ — жизнь, подобная великой реке.
reading.RiseDecline.BODY.DRESSING=В стадии облачения тело обретает стойкость (སོ་ཐུབ, so thub). Болезни уходят. Его образ — лицо, подобное цветку в цвету.
reading.RiseDecline.DESTINY.DRESSING=В стадии облачения могущество обретает стойкость (སོ་ཐུབ, so thub). Он пользуется сокровищем. Его образ — богатство, подобное волнам океана. Это одно из шести светлых солнц.
reading.RiseDecline.LUCK.DRESSING=В стадии облачения конь ветра обретает стойкость (སོ་ཐུབ, so thub). Довольство растёт. Его образ — золотая сеть. Это одно из шести светлых солнц.
reading.RiseDecline.VITALITY.BIRTH=В стадии рождения жизненная сила обретает достаток (ལོངས་སྤྱོད, longs spyod). Жизненная сила не прерывается. Его образ — гора, неизменная и твёрдая.
reading.RiseDecline.BODY.BIRTH=В стадии рождения тело обретает достаток (ལོངས་སྤྱོད, longs spyod). Блага растут. Его образ — древо исполнения желаний, выросшее в полную силу. Это одно из шести светлых солнц.
reading.RiseDecline.DESTINY.BIRTH=В стадии рождения могущество обретает достаток (ལོངས་སྤྱོད, longs spyod). Добро и имущество умножаются. Это одно из шести светлых солнц.
reading.RiseDecline.LUCK.BIRTH=В стадии рождения конь ветра обретает достаток (ལོངས་སྤྱོད, longs spyod). Довольство собирается. Его образ — яркие полосы тигра. Это одно из шести светлых солнц.
reading.RiseDecline.VITALITY.BODY_COMPLETE=В стадии, когда тело сложилось, жизненная сила обретает благополучие (བདེ་ལྡན, bde ldan). Жизнь и жизненная сила крепки. Это одно из шести светлых солнц.
reading.RiseDecline.BODY.BODY_COMPLETE=В стадии, когда тело сложилось, тело обретает благополучие (བདེ་ལྡན, bde ldan). Тело обладает великой силой. Это одно из шести светлых солнц.
reading.RiseDecline.DESTINY.BODY_COMPLETE=В стадии, когда тело сложилось, могущество обретает благополучие (བདེ་ལྡན, bde ldan). Блага умножаются. Это одно из шести светлых солнц.
reading.RiseDecline.LUCK.BODY_COMPLETE=В стадии, когда тело сложилось, конь ветра обретает благополучие (བདེ་ལྡན, bde ldan). Он твёрд в мудрости. Это одно из шести светлых солнц.
reading.RiseDecline.VITALITY.BATHING=В стадии омовения жизненная сила обретает исполнение желаний (བསམ་འགྲུབ, bsam 'grub). Жизнь не укорачивается. Его образ — железные бобы, скатанные туго.
reading.RiseDecline.BODY.BATHING=В стадии омовения тело обретает исполнение желаний (བསམ་འགྲུབ, bsam 'grub). Тело созревает. Его образ — лотос в полном цвету.
reading.RiseDecline.DESTINY.BATHING=В стадии омовения могущество обретает исполнение желаний (བསམ་འགྲུབ, bsam 'grub). Задуманное достигается, и дела искусных средств исполняются.
reading.RiseDecline.LUCK.BATHING=В стадии омовения конь ветра обретает исполнение желаний (བསམ་འགྲུབ, bsam 'grub). Довольство обретено. Его образ — тот, кто держит в руках драгоценное золото.
reading.RiseDecline.VITALITY.WORKING=В стадии труда жизненная сила обретает долгую линию (བརྒྱུད་རིང, brgyud ring). Линия предков и внуков длится долго. Его образ — текущая великая река.
reading.RiseDecline.BODY.WORKING=В стадии труда тело обретает долгую линию (བརྒྱུད་རིང, brgyud ring). Дети и род умножаются. Его образ — дерево с раскидистыми ветвями.
reading.RiseDecline.DESTINY.WORKING=В стадии труда могущество обретает долгую линию (བརྒྱུད་རིང, brgyud ring). Род хранит своё богатство, и крылья детей раскрываются. Его образ — тот, кто достиг острова драгоценностей.
reading.RiseDecline.LUCK.WORKING=В стадии труда конь ветра обретает долгую линию (བརྒྱུད་རིང, brgyud ring). Довольство растёт, и он правит краем, как правят колесницей. Его образ — раскинутый шатёр мудрости.
reading.RiseDecline.VITALITY.TAKING_BREATH=В стадии вдоха жизненная сила обретает исчерпанную долю (སྐལ་ཟད, skal zad). Жизнь обрывается в спешке. Его образ — смятый пучок цветов.
reading.RiseDecline.BODY.TAKING_BREATH=В стадии вдоха тело обретает исчерпанную долю (སྐལ་ཟད, skal zad). Страданий много. Его образ — цветы, убитые морозом.
reading.RiseDecline.DESTINY.TAKING_BREATH=В стадии вдоха могущество обретает исчерпанную долю (སྐལ་ཟད, skal zad). Доли нет, и благ мало. Это один из шести тёмных сыновей.
reading.RiseDecline.LUCK.TAKING_BREATH=В стадии вдоха конь ветра обретает исчерпанную долю (སྐལ་ཟད, skal zad). Довольство утрачено. Его образ — слепой, выпустивший хвост быка.
reading.RiseDecline.VITALITY.IN_THE_WOMB=В стадии в утробе жизненная сила обретает великую беду (བྱུར་ཆེན, byur chen). Жизнь коротка. Его образ — тот, кого сбросили с крутой вершины.
reading.RiseDecline.BODY.IN_THE_WOMB=В стадии в утробе тело обретает великую беду (བྱུར་ཆེན, byur chen). Болезнь берёт верх. Его образ — тот, кого ракшас унёс из пещеры на перевале.
reading.RiseDecline.DESTINY.IN_THE_WOMB=В стадии в утробе могущество обретает великую беду (བྱུར་ཆེན, byur chen). Он разлучён с богатством. Его образ — пчела в конце года.
reading.RiseDecline.LUCK.IN_THE_WOMB=В стадии в утробе конь ветра обретает великую беду (བྱུར་ཆེན, byur chen). Люди обращают против него свои слова. Его образ — жук, завёрнутый в шерсть.
reading.RiseDecline.VITALITY.DECLINE=В стадии упадка жизненная сила обретает разлуку (བྱེ་བྲལ, bye bral). Тело и жизненная сила расстаются. Это один из шести тёмных сыновей.
reading.RiseDecline.BODY.DECLINE=В стадии упадка тело обретает разлуку (བྱེ་བྲལ, bye bral). Страданий много. Его образ — рыба, вынутая на сушу.
reading.RiseDecline.DESTINY.DECLINE=В стадии упадка могущество обретает разлуку (བྱེ་བྲལ, bye bral). Богатство сметено. Его образ — зерно, склёванное птицами. Это один из шести тёмных сыновей.
reading.RiseDecline.LUCK.DECLINE=В стадии упадка конь ветра обретает разлуку (བྱེ་བྲལ, bye bral). Средства для его дела утрачены. Это один из шести тёмных сыновей.
reading.RiseDecline.VITALITY.ILLNESS=В стадии болезни жизненная сила обретает разорение и тяжбы (འཕུང་གྱོད, 'phung gyod). Он сам обрывает свою жизнь. Его образ — собственный судья, что выносит приговор против него.
reading.RiseDecline.BODY.ILLNESS=В стадии болезни тело обретает разорение и тяжбы (འཕུང་གྱོད, 'phung gyod). Хроническая болезнь берёт верх. Его образ — нищий, которого держат к расчёту золотом.
reading.RiseDecline.DESTINY.ILLNESS=В стадии болезни могущество обретает разорение и тяжбы (འཕུང་གྱོད, 'phung gyod). Разорение падает на него самого. Его образ — охотничья собака, бросившаяся на хозяина.
reading.RiseDecline.LUCK.ILLNESS=В стадии болезни конь ветра обретает разорение и тяжбы (འཕུང་གྱོད, 'phung gyod). Дорогое сердцу сбивается с пути, и родня становится врагами. Его образ — лужа воды под пещерой.
reading.RiseDecline.VITALITY.DEATH=В стадии смерти жизненная сила обретает утрату удачи (ཕྱྭ་ཉམས, phywa nyams). Жизнь развеяна ветром. Его образ — сломанная ваджра изо льда.
reading.RiseDecline.BODY.DEATH=В стадии смерти тело обретает утрату удачи (ཕྱྭ་ཉམས, phywa nyams). Сила тела утрачена. Его образ — краска, выжженная солнцем.
reading.RiseDecline.DESTINY.DEATH=В стадии смерти могущество обретает утрату удачи (ཕྱྭ་ཉམས, phywa nyams). Богатство уносит, как ветром. Его образ — увиденный город гандхарвов (དྲི་ཟ, dri za).
reading.RiseDecline.LUCK.DEATH=В стадии смерти конь ветра обретает утрату удачи (ཕྱྭ་ཉམས, phywa nyams). Довольство утрачено. Его образ — радуга, что встаёт и гаснет.
reading.RiseDecline.VITALITY.ENTERING_THE_TOMB=В стадии могилы жизненная сила обретает прерванную линию (རྒྱུན་ཆད, rgyun chad). Приходят препятствия. Его образ — дерево со сгнившими корнями.
reading.RiseDecline.BODY.ENTERING_THE_TOMB=В стадии могилы тело обретает прерванную линию (རྒྱུན་ཆད, rgyun chad). Лицо теряет блеск. Его образ — труп собаки, брошенный в зольную яму.
reading.RiseDecline.DESTINY.ENTERING_THE_TOMB=В стадии могилы могущество обретает прерванную линию (རྒྱུན་ཆད, rgyun chad). Богатство и добро гибнут. Его образ — белый жир, положенный на пламя.
reading.RiseDecline.LUCK.ENTERING_THE_TOMB=В стадии могилы конь ветра обретает прерванную линию (རྒྱུན་ཆད, rgyun chad). Дело обращается в ничто. Его образ — солнце, зашедшее на небе.
RaisingMonth.FATHER=тяжёл для отца
RaisingMonth.MOTHER=тяжёл для матери
RaisingMonth.OWN=тяжёл для ребёнка
RaisingMonth.GOOD=месяц расцвета
RaisingDay.HARD=трудно вырастить
RaisingDay.EASY=легко вырастить
reading.RaisingMonth={0} Жизненная сила (སྲོག, srog) ребёнка, отсчитанная до месяца рождения, показывает, на кого ложится месяц: её могила — на отца, её утроба — на мать, её болезнь и смерть — на самого ребёнка.
reading.RaisingMonth.FATHER=Рождённый в месяц, когда жизненная сила ребёнка входит в могилу, рождён в месяц отца, тяжёлый для отца. Таков ребёнок года мыши, рождённый в месяц дракона.
reading.RaisingMonth.MOTHER=Рождённый в месяц, когда жизненная сила ребёнка пребывает в утробе, рождён в месяц матери, тяжёлый для матери. Таков ребёнок года мыши, рождённый в месяц лошади.
reading.RaisingMonth.OWN=Рождённый в месяц болезни или смерти жизненной силы ребёнка рождён в свой собственный месяц, дурной для самого ребёнка. Таков ребёнок года мыши, рождённый в месяц тигра или зайца.
reading.RaisingMonth.GOOD=Рождённый в месяц, когда жизненная сила ребёнка расцветает, рождён в хороший месяц: всякий месяц расцвета хорош для рождения.
reading.RaisingDay={0} Животное дня рождения, поставленное против животного года ребёнка по их стихиям, показывает, трудно или легко его вырастить.
reading.RaisingDay.HARD=Рождённого в день, чья стихия одолевает стихию животного его года, как быка, овцу, собаку или дракона в день тигра или зайца, трудно вырастить.
reading.RaisingDay.EASY=Рождённого в день, чья стихия порождает стихию животного его года, как лошадь или змею в день тигра или зайца, рождение идёт хорошо, и его легко вырастить.
PreciousPebble.YEAR=камень царя
PreciousPebble.MONTH=камень министра
PreciousPebble.DAY=камень воина
PreciousPebble.HOUR=камень оружия
reading.PreciousPebble={0} Четыре драгоценных камня (གཅེས་རྡེལ, gces rdel) берут год рождения как царя, месяц — как министра, день — как воина, а час — как оружие; каждый бел или чёрен по своему животному, без соперника в схватке.
reading.PreciousPebble.YEAR.WHITE=Камень царя, камень года рождения, бел: слово царя его не порицает. Мужчина берёт верх на сходе, а о женщине идёт добрая молва.
reading.PreciousPebble.YEAR.BLACK=Камень царя, камень года рождения, чёрен: его поражает царская кара. Радостей и горестей много, горестей больше, и болезни не покидают тела.
reading.PreciousPebble.MONTH.WHITE=Камень министра, камень месяца рождения, бел, и он не отбивается от общества министров.
reading.PreciousPebble.MONTH.BLACK=Камень министра, камень месяца рождения, чёрен: он любит высоких и ненавидит низких и без конца ссорится с врагами.
reading.PreciousPebble.DAY.WHITE=Камень воина, камень дня рождения, бел: его силы ширятся со всех сторон, болезни слабы, жизнь не встречает препятствий, и ни дух, ни демон не вредят.
reading.PreciousPebble.DAY.BLACK=Камень воина, камень дня рождения, чёрен: приходят раздоры с людьми, он платит или получает цену тысячи людей, и наговоры не прекращаются.
reading.PreciousPebble.HOUR.WHITE=Камень оружия, камень часа рождения, бел: то, что предвещают люди и камни, хорошо, и люди и богатство множатся со всех сторон.
reading.PreciousPebble.HOUR.BLACK=Камень оружия, камень часа рождения, чёрен: оружие съедено ржавчиной, копьё славы сломано посередине, и это дурно для всех людей и богатства.
UnchangingLuck.PARENT_YEAR=год родителя
UnchangingLuck.MOTHER_LOG_MEN=смещённый знак матери
UnchangingLuck.TRIGRAM=триграмма рождения
UnchangingLuck.MEWA=мева рождения
UnchangingLuck.MONTH=месяц рождения
HundredKin.OWN=своё
HundredKin.MOTHER=мать
HundredKin.SON=сын
HundredKin.FRIEND=друг
HundredKin.ENEMY=враг
reading.HundredPebble={0} Свой элемент каждого аспекта, его мать, сын, друг и враг встречают пять неизменных удач (མི་འགྱུར་ཀླུང, mi 'gyur klung) пятью камешками, и большее из пяти служит решающим камешком (བཏང་གཅོད, btang gcod).
reading.HundredPebble.VITALITY.OWN.WHITE=Свой камешек жизненной силы белый — это зовётся драгоценной сокровищницей жизни: ребёнка легко вырастить, жизнь долгая до старости, и это тяжело для отца и всех дядей по отцу.
reading.HundredPebble.VITALITY.MOTHER.WHITE=Камешек матери жизненной силы белый: человек из рода, где процветают отец и дяди по отцу, и его опора не уходит к другим.
reading.HundredPebble.VITALITY.SON.WHITE=Камешек сына жизненной силы белый: долгая жизнь, кол, держащий жизнь, вбит крепко, и рождаются сыновья.
reading.HundredPebble.VITALITY.FRIEND.WHITE=Камешек друга жизненной силы белый: богатство в копытных стадах процветает.
reading.HundredPebble.VITALITY.ENEMY.WHITE=Камешек врага жизненной силы белый, дурной: берегитесь истощения и старой болезни, приходят дурная пища и водянка.
reading.HundredPebble.VITALITY.OWN.BLACK=Свой камешек жизненной силы чёрный: ребёнка трудно вырастить, и жизнь короткая.
reading.HundredPebble.VITALITY.OWN.BLACK.remedy=выполняйте практику долгой жизни, читайте дхарани долгой жизни и совершайте обряд долгой жизни
reading.HundredPebble.VITALITY.MOTHER.BLACK=Камешек матери жизненной силы чёрный: род отца и дядей по отцу прерывается, их дверь пустеет, их судьба то поднимается, то сильно падает.
reading.HundredPebble.VITALITY.SON.BLACK=Камешек сына жизненной силы чёрный: кол, держащий ла, жизненный дух (བླ, bla), и жизнь, выдернут, и стада не процветают.
reading.HundredPebble.VITALITY.FRIEND.BLACK=Камешек друга жизненной силы чёрный: много начинаний и беспокойный ум, не сидится на месте и тянет в путь; образ — ноги, кружимые колесом ветра.
reading.HundredPebble.VITALITY.ENEMY.BLACK=Камешек врага жизненной силы чёрный, добрый: нет вреда от вредоносных духов умерших (སྲི, sri) — ни стариков, ни молодых, ни зрелых.
reading.HundredPebble.BODY.OWN.WHITE=Свой камешек тела белый: тело процветает и высоко стоит, красиво лицом и статью, дом и его земля удерживаются.
reading.HundredPebble.BODY.MOTHER.WHITE=Камешек матери тела белый: человек долго остаётся вместе с тётями по матери.
reading.HundredPebble.BODY.SON.WHITE=Камешек сына тела белый: сыновей и дочерей легко вырастить.
reading.HundredPebble.BODY.FRIEND.WHITE=Камешек друга тела белый: мужчина сходится с женщиной старше себя, а женщине хорошо подходит мужчина.
reading.HundredPebble.BODY.ENEMY.WHITE=Камешек врага тела белый, дурной: много болезней и изъяны органов чувств, смерть приходит от несварения, опухоли или водянки.
reading.HundredPebble.BODY.OWN.BLACK=Свой камешек тела чёрный: много болезней, и органы чувств с изъяном.
reading.HundredPebble.BODY.OWN.BLACK.remedy=преобразите и породите тело заново и носите охранный амулет
reading.HundredPebble.BODY.MOTHER.BLACK=Камешек матери тела чёрный: время, проведённое вместе с тётями по матери, коротко.
reading.HundredPebble.BODY.SON.BLACK=Камешек сына тела чёрный: сыновей и дочерей трудно вырастить.
reading.HundredPebble.BODY.FRIEND.BLACK=Камешек друга тела чёрный: образ — труп, оставленный на кладбище, старая мать, упавшая посреди равнины.
reading.HundredPebble.BODY.ENEMY.BLACK=Камешек врага тела чёрный, добрый: тело свободно от болезни и истощения.
reading.HundredPebble.DESTINY.OWN.WHITE=Свой камешек могущества белый: большие блага, умножаются скот, пища, богатство и всё желаемое.
reading.HundredPebble.DESTINY.MOTHER.WHITE=Камешек матери могущества белый: человек из рода, где процветает родня дяди по матери, долго вместе с дядями и племянниками.
reading.HundredPebble.DESTINY.SON.WHITE=Камешек сына могущества белый: рождается дочь мудрее матери, и дочери находят много друзей.
reading.HundredPebble.DESTINY.FRIEND.WHITE=Камешек друга могущества белый: хорошие урожаи и любящие слуги, мужчины и женщины.
reading.HundredPebble.DESTINY.ENEMY.WHITE=Камешек врага могущества белый, дурной: богатство убывает и уходит в руки врагов.
reading.HundredPebble.DESTINY.OWN.BLACK=Свой камешек могущества чёрный: бесполезные траты на расплату с живыми и большие потери богатства и стад в старости.
reading.HundredPebble.DESTINY.OWN.BLACK.remedy=держите дом в двух местах
reading.HundredPebble.DESTINY.MOTHER.BLACK=Камешек матери могущества чёрный: козы, собаки, лошади и ослы сводятся к одной линии, и родня дяди по матери то поднимается, то сильно падает.
reading.HundredPebble.DESTINY.SON.BLACK=Камешек сына могущества чёрный: из дочерей приходит разве что одна смышлёная.
reading.HundredPebble.DESTINY.FRIEND.BLACK=Камешек друга могущества чёрный: посевы в целом хороши, но урожай не собирается, а зятья и племянники приходят издалека и изблизи.
reading.HundredPebble.DESTINY.ENEMY.BLACK=Камешек врага могущества чёрный, добрый: богатство не уходит в руки врагов, и собранным человек пользуется сам.
reading.HundredPebble.LUCK.OWN.WHITE=Свой камешек коня ветра белый: ламы и благородные предки благосклонны, боги-воители (དགྲ་ལྷ, dgra lha) и защитники (སྲུང་མ, srung ma) идут впереди.
reading.HundredPebble.LUCK.MOTHER.WHITE=Камешек матери коня ветра белый: владыки и министры покровительствуют, и другие приходят к человеку с просьбами.
reading.HundredPebble.LUCK.SON.WHITE=Камешек сына коня ветра белый: лошади и ослы умножаются.
reading.HundredPebble.LUCK.FRIEND.WHITE=Камешек друга коня ветра белый: человек подобен министру, искусному в средствах.
reading.HundredPebble.LUCK.ENEMY.WHITE=Камешек врага коня ветра белый, дурной: нет удовлетворения от сделанной работы, и сколько ни ешь — не насыщаешься.
reading.HundredPebble.LUCK.OWN.BLACK=Свой камешек коня ветра чёрный: мало чести даже за собственные дела, и среди родни по отцу есть недоброжелатели.
reading.HundredPebble.LUCK.OWN.BLACK.remedy=держитесь крепкого места
reading.HundredPebble.LUCK.MOTHER.BLACK=Камешек матери коня ветра чёрный: мало почёта от учителей и владык, доброта не вознаграждается, и приходится искать опору.
reading.HundredPebble.LUCK.SON.BLACK=Камешек сына коня ветра чёрный: образ — солнце, закрытое облаками, гриф, упавший на равнину.
reading.HundredPebble.LUCK.FRIEND.BLACK=Камешек друга коня ветра чёрный: лошади и ослы не умножаются, и спутник жизни мало значит.
reading.HundredPebble.LUCK.ENEMY.BLACK=Камешек врага коня ветра чёрный, добрый: человек не попадает под чужое ярмо.
BirthWhole.GOOD=перевешивает доброе
BirthWhole.BAD=перевешивает дурное
BirthWhole.EVEN=поровну
reading.BirthTogether={0} Ни один или два результата не решают рождение: доброе и дурное взвешиваются по силе и числу во всём, обряды своего времени могут повернуть дурное, а преходящие условия — доброе.
reading.BirthTogether.GOOD=Добрых решающих камешков из ста больше, чем дурных, и по силе и числу рождение перевешивает в доброе.
reading.BirthTogether.BAD=Дурных решающих камешков из ста больше, чем добрых, и по силе и числу рождение перевешивает в дурное.
reading.BirthTogether.EVEN=Добрых и дурных решающих камешков из ста поровну, и по силе и числу рождение выходит средним.
reading.BirthSet={0} Набор читает решающие камешки вместе по четырём аспектам и перевешивает отдельные чтения, которые соединяет.
reading.BirthSet.MOTHERS_WHITE=Решающие камешки четырёх матерей — жизненной силы, тела, могущества и коня ветра — белые: родители процветают, и благородный род продолжается.
reading.BirthSet.MOTHERS_BLACK=Решающие камешки четырёх матерей чёрные: предки приходят в упадок, доброты от отца мало, и опору приходится искать у других.
reading.BirthSet.MOTHERS_HALF=Решающие камешки четырёх матерей наполовину белые, наполовину чёрные: предки знают и радость, и горе, и подъём и упадок их велики.
reading.BirthSet.MANY_WHITE=Большинство из двадцати решающих камешков белые: другие несут человека, дела исполняются, и всё он понимает сам.
reading.BirthSet.MANY_BLACK=Большинство из двадцати решающих камешков чёрные: заслуг мало, и приходится служить другим.
reading.BirthSet.MANY_BLACK.remedy=опирайтесь на Дхарму
reading.BirthSet.SONS_WHITE=Решающие камешки четырёх сыновей белые: приходит сын лучше отца, который удержит землю и крепость предков.
reading.BirthSet.SONS_BLACK=Решающие камешки четырёх сыновей чёрные: детей трудно вырастить, и они не достигают зрелости.
reading.BirthSet.SONS_MIXED=Решающие камешки четырёх сыновей смешанные: из детей половина выживает, половина нет.
reading.BirthSet.FRIENDS_WHITE=Решающие камешки четырёх друзей белые: положение и большая доля пищи; образ — полосы тигра.
reading.BirthSet.FRIENDS_BLACK=Решающие камешки четырёх друзей чёрные: богатство то растёт, то падает, с большими потерями.
reading.BirthSet.FRIENDS_MIXED=Решающие камешки четырёх друзей смешанные: то, что есть, ненастоящее, то, чего нет, приходит, и богатство среднее.
reading.BirthSet.VITALITY_RISES=Свой решающий камешек жизненной силы белый, а врага — чёрный: своё поднимается, пока враг в упадке, и это хорошо.
reading.BirthSet.VITALITY_FALLS=Свой решающий камешек жизненной силы чёрный, а врага — белый: своё в упадке, пока враг поднимается, и в конце человек гибнет от клинка.
reading.BirthSet.DESTINY_RISES=Свой решающий камешек могущества белый, а врага — чёрный: своё поднимается, пока враг в упадке, и это хорошо.
reading.BirthSet.DESTINY_FALLS=Свой решающий камешек могущества чёрный, а врага — белый: своё в упадке, пока враг поднимается, и это плохо.
reading.BirthSet.LUCK_RISES=Свой решающий камешек коня ветра белый, а врага — чёрный: своё поднимается, пока враг в упадке, и это хорошо.
reading.BirthSet.LUCK_FALLS=Свой решающий камешек коня ветра чёрный, а врага — белый: своё в упадке, пока враг поднимается, и это плохо.
reading.BirthBoard=Доска читается целиком по тому, где лежат белые и чёрные. Много белых узором четырёх континентов — ограда счастья: вверху — в первой части жизни, в середине — во власти и богатстве, внизу — в старости. Много чёрных квадратами — дом, чей род прерывается: вверху — радость и горе, в середине — богатство, бесполезное в нужде, внизу — потери.
BirthSet.MOTHERS_WHITE=четыре матери белые
BirthSet.MOTHERS_BLACK=четыре матери чёрные
BirthSet.MOTHERS_HALF=четыре матери пополам
BirthSet.MANY_WHITE=много белых
BirthSet.MANY_BLACK=много чёрных
BirthSet.SONS_WHITE=четыре сына белые
BirthSet.SONS_BLACK=четыре сына чёрные
BirthSet.SONS_MIXED=четыре сына смешанные
BirthSet.FRIENDS_WHITE=четыре друга белые
BirthSet.FRIENDS_BLACK=четыре друга чёрные
BirthSet.FRIENDS_MIXED=четыре друга смешанные
BirthSet.VITALITY_RISES=жизненная сила поднимается, враг в упадке
BirthSet.VITALITY_FALLS=жизненная сила в упадке, враг поднимается
BirthSet.DESTINY_RISES=могущество поднимается, враг в упадке
BirthSet.DESTINY_FALLS=могущество в упадке, враг поднимается
BirthSet.LUCK_RISES=конь ветра поднимается, враг в упадке
BirthSet.LUCK_FALLS=конь ветра в упадке, враг поднимается
DeadRoot.DEATH_YEAR=год смерти
DeadRoot.LOG_MEN=смещённый знак
DeadRoot.TRIGRAM=триграмма
DeadRoot.SME_BA=мева
DeadRoot.SECTOR=подъём и упадок
DeadRoot.MONTH=месяц смерти
DeadRoot.DATE=день смерти
DeadRoot.HOUR=час смерти
DeadWhole.SPENT=жизнь исчерпана
DeadWhole.UNTIMELY=безвременная смерть
reading.DeadPebble={0} Первое исследование расчёта для умершего (གཤིན་རྩིས, gshin rtsis) спрашивает решающий камешек каждого аспекта, пришло ли время смерти.
reading.DeadPebble.VITALITY.BLACK=Решающий камешек жизненной силы чёрный: столб жизни сломан, колесо жизни разрушено, ла, жизненный дух (བླ, bla), и жизнь перерезаны демоном три года назад, и время смерти пришло; образ — чёрная птица, кружащая сверху, и зубы чёрной собаки, впившиеся в тело.
reading.DeadPebble.VITALITY.WHITE=Решающий камешек жизненной силы белый: время смерти не пришло. Бог, идущий впереди, был обманут, и чёрный демон незаметно унёс человека; образ — глаз, вырванный из головы, сердце из тела и жила из ноги, и ничего не почувствовано.
reading.DeadPebble.BODY.BLACK=Решающий камешек тела чёрный: тело желало могилы. Болезнь ударила иллюзорное тело, как топор дерево исполнения желаний; половина тела вошла в могилу, половина жизни ушла от удачи, и время смерти пришло.
reading.DeadPebble.BODY.WHITE=Решающий камешек тела белый: тело не желало могилы. Думалось, что ни топор, ни серп, ни аркан не придут за деревом исполнения желаний тела; демон захватил место бога, и человек умер, не желая могилы.
reading.DeadPebble.DESTINY.BLACK=Решающий камешек могущества чёрный: счёт пищи исполнился. Что было во рту, язык вытолкнул, что было дома, ушло за дверь, доля пищи и одежды кончилась, и время смерти пришло.
reading.DeadPebble.DESTINY.WHITE=Решающий камешек могущества белый: счёт пищи не исполнился. Пригоршня пищи и одежда на спине не износились, положение и могущество не исчерпаны, но запасы оборвались разом, прежде времени смерти.
reading.DeadPebble.LUCK.BLACK=Решающий камешек коня ветра чёрный: ветвь дерева восьмилепесткового лотоса сломана. Знамя заслуг упало, прежде накопленные заслуги исчерпаны и нет времени накопить новые, извне пришли недоброжелатели, и человек умер, не властный над этим.
reading.DeadPebble.LUCK.WHITE=Решающий камешек коня ветра белый: ветвь не сломана. Думалось, что огонь её не сожжёт, вода не унесёт и земля не сгноит; демон незаметно украл заслуги, и человек умер прежде, чем пришло время.
reading.DeadWhole={0} Первое исследование читается в целом по камешкам: много чёрных — жизнь иссякла, много белых — человек умер прежде.
reading.DeadWhole.SPENT=Большинство решающих камешков чёрные: как земля кончается в воде, а дерево в огне, жизнь иссякла, и сотня врачей не помогла бы тому, чья жизнь исчерпана; живым не о чем горевать.
reading.DeadWhole.UNTIMELY=Большинство решающих камешков белые: как солнце и луна, зашедшие посреди открытого неба, и цветок, унесённый заморозком, тот, кому не время было умирать, внезапно унесён вредоносным духом в ответ за дурной поступок мгновения, прежде чем жизнь исчерпалась.
reading.MomentTrigram={0} Триграмма мгновения отсчитывается от собственной триграммы даты на рассвете, по одной на каждые три четверти часа, и показывает дом спрашивающего.
reading.MomentTrigram.LI=В мгновение триграммы огня (ལི, li) дверь дома смотрит на юг или на север; есть белые лошади или краснолицые люди, и что-то красное, принесённое извне, вредит. Женщина этого дома румяная и крепкая, с красными жилками в глазах и частыми зубами, с дурными приметами и острым языком.
reading.MomentTrigram.LI.spirits=теуранг (ཐེའུ་བྲང, the'u brang) и духи гонгпо (འགོང་པོ, 'gong po)
reading.MomentTrigram.LI.remedy=отсеките гьялпо (རྒྱལ་པོ, rgyal po), гонгпо и теуранга, отошлите крест гьялпо (རྒྱལ་མདོས, rgyal mdos) и выкуп теурангу и свяжите им уста
reading.MomentTrigram.KHON=У пришедшего в мгновение триграммы земли (ཁོན, khon) семья из двух или четырёх, любит мясо, с большими подъёмами и падениями; дверь смотрит на юг или на север, лошади, люди и скот пёстрые или с отметинами, и что-то пёстрое, принесённое извне, вредит. Женщины желтоватые, у старухи слабеют чувства.
reading.MomentTrigram.KHON.remedy=придавите женских духов и отсеките их
reading.MomentTrigram.DWA=У пришедшего в мгновение триграммы озера (དྭ, dwa) дверь смотрит на запад или на север, лошади, ослы и коровы с белыми отметинами. Женщина светлая, с родимым пятном, вспыльчивая, без отца и брата.
reading.MomentTrigram.KHEN=В мгновение триграммы неба (ཁེན, khen) дверь смотрит на северо-запад или юго-запад, лошади, собаки и скот пёстрые. Женщина с синеватым лицом, хромая или увечная рукой, недобрая и свирепая, сварливая и вечно занятая.
reading.MomentTrigram.KHAM=У пришедшего в мгновение триграммы воды (ཁམ, kham) дверь смотрит на север или на запад, лошади, собаки и коровы с чёрными отметинами; что-то чёрное извне вредит. Женщина смуглая, крупная и быстрая на ходу, невнятная речью, третья жена, чей ребёнок умер, шумная и нечистоплотная, учтивая в речи и любит пиво.
reading.MomentTrigram.GIN=У пришедшего в мгновение триграммы горы (གིན, gin) дверь смотрит на запад или на север, лошади, собаки и коровы чёрно-пёстрые; чёрный скот извне вредит. Женщина с красивыми волосами и полным телом, отец и братья недолговечны, в семье трое или один, добрая сердцем и ласковая к окружающим.
reading.MomentTrigram.ZIN=В мгновение триграммы грома (ཟིན, zin) дверь смотрит на восток или на север, лошади, собаки и коровы с синими отметинами. Женщина длиннозубая и вспыльчивая, красивая лицом; род дяди по матери прерван, братьев один или трое, и есть человек, любящий дядю и отца.
reading.MomentTrigram.ZON=В мгновение триграммы ветра (ཟོན, zon) дверь смотрит на юго-восток или на юг. Женщина разлучена с мужем или вдова, скот непременно пёстрый, в роду безумие или припадки, в семье двое или четверо, и семья шумная.
reading.MomentMewa={0} Мева (སྨེ་བ, sme ba) мгновения отсчитывается от собственной мевы даты на рассвете, по одной на каждые две трети часа, и узнаётся как человек, как богатство и как дух.
reading.MomentMewa.1=В мгновение 1 белой речь о человеке, покинувшем свою страну, о госте, а богатство — овцы и козы.
reading.MomentMewa.1.spirits=теуранг (ཐེའུ་བྲང, the'u brang)
reading.MomentMewa.2=В мгновение 2 чёрной речь о вдове, о прервавшемся роде, а богатство — дзо (མཛོ, mdzo).
reading.MomentMewa.2.spirits=демоны (བདུད, bdud)
reading.MomentMewa.3=В мгновение 3 синей речь о молодой женщине, а богатство — крупный скот.
reading.MomentMewa.3.spirits=дух му (དམུ, dmu) и дух сен (བསེན, bsen)
reading.MomentMewa.4=В мгновение 4 зелёной речь о больном болезнью нагов, а богатство — сухие товары.
reading.MomentMewa.4.spirits=наги (ཀླུ, klu)
reading.MomentMewa.5=В мгновение 5 жёлтой речь о царском человеке, а богатство — предметы подношения.
reading.MomentMewa.5.spirits=владыки земли (ས་བདག, sa bdag)
reading.MomentMewa.6=В мгновение 6 белой речь о простолюдине, а богатство — доспехи и грозное оружие.
reading.MomentMewa.6.spirits=боги (ལྷ, lha)
reading.MomentMewa.7=В мгновение 7 красной речь о бонпо (བོན་པོ, bon po), а богатство — шёлк и парча.
reading.MomentMewa.7.spirits=духи цен (བཙན, btsan)
reading.MomentMewa.8=В мгновение 8 белой речь о человеке из рода владык, а богатство — драгоценности и сияющее богатство.
reading.MomentMewa.8.spirits=кордаг (དཀོར་བདག, dkor bdag) и духи гьялпо (རྒྱལ་པོ, rgyal po)
reading.MomentMewa.9=В мгновение 9 красной речь об одиноком мужчине или женщине, а богатство — скот.
reading.MomentMewa.9.spirits=тёмно-пурпурные ма-мо (མ་མོ, ma mo)
reading.DeadMewa={0} Шестая проверка первого исследования спрашивает меву (སྨེ་བ, sme ba) умершего в год смерти, пришло ли время смерти.
reading.DeadMewa.TIME=Мева умершего в тот год пала на свои малые препятствия — дома, ложа, земли или царских врат: по меве время смерти пришло.
reading.DeadMewa.NONE=Мева умершего в тот год не пала ни на одно из четырёх малых препятствий: по меве смерть пришла прежде времени.
reading.DeadCourse={0} Седьмая проверка первого исследования читает ход годов в год смерти.
reading.DeadCourse.TIME=В год смерти ход годов пал на свои препятствия, и время смерти пришло; образ — царь года отдаёт приказ, министр месяца говорит своё слово, воин дня ведёт войско и оружие часа наносит удар, как ветер времени валит дерево исполнения желаний.
reading.MomentPeriod={0} Время дня, когда приходит спрашивающий, отсчитанное от рассвета в час зайца, называет бога, идущего впереди него, и каков его дом.
reading.MomentPeriod.DAWN=У пришедшего на рассвете впереди идёт бог местности. Из двух домов один пустует, семья раскалывается из-за пересудов, гостям дают мало, женщины много говорят, а мужчины любят бродить, и крупный скот несёт потери.
reading.MomentPeriod.DAWN.spirits=теуранг (ཐེའུ་བྲང, the'u brang) и владыки земли (ས་བདག, sa bdag); духи нарушенных клятв (མནའ་འདྲེ, mna' 'dre) — на родне по отцу
reading.MomentPeriod.SUNRISE=У пришедшего на восходе впереди идут духи цен (བཙན, btsan). В роду внезапные смерти, земель много, а удержано мало, семья сварлива, женщины ловки в пересудах, мужчины дурного нрава и мелочны; одна ветвь рода пресеклась, и скот несёт потери.
reading.MomentPeriod.SUNRISE.spirits=пожирающий демон пустого дома
reading.MomentPeriod.WARMTH=У пришедшего, когда солнце пригревает, впереди идут владыки богатства (ནོར་བདག, nor bdag). Семья держит два или три дома, старые и молодые вместе, или разделилась; братья, сёстры и сборища приносят пересуды, едят тайком, скот и урожай средние.
reading.MomentPeriod.WARMTH.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po) — на роде, владыки земли (ས་བདག, sa bdag) — на предках
reading.MomentPeriod.NOON=У пришедшего в полдень впереди идут наги (ཀླུ, klu) и духи цен (བཙན, btsan). Дом держит земли в верховье и низовье долины, многие болеют, родня по отцу стеснена; чужие добры, свои враждебны, удача слабеет, женщины много говорят, детей трудно вырастить, и смерти близко.
reading.MomentPeriod.NOON.spirits=духи проказы и духи гонгпо (འགོང་པོ, 'gong po), и владыки земли (ས་བདག, sa bdag)
reading.MomentPeriod.PAST_NOON=У пришедшего после полудня впереди идут боги-цен (ལྷ་བཙན, lha btsan). Поднявшись высоко, дом опускается низко; муж стар, жена молода, богатство растёт рано и утекает позже, много тратится на других, и в старости много дел и нет дхармы.
reading.MomentPeriod.PAST_NOON.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po) и гонгпо (འགོང་པོ, 'gong po) — на роде, со смертями от воды, клинка и яда
reading.MomentPeriod.LATE=У пришедшего на исходе дня впереди идут наги (ཀླུ, klu) горных отрогов. Молодые умирают в расцвете, могилы семьи раскрыты, дети тупы, богатство копится, как запасы вороны, едят многие, работают немногие, и среди полей и богатства есть вор.
reading.MomentPeriod.LATE.spirits=голодные духи гьялпо (རྒྱལ་པོ, rgyal po) монастыря; порча на жрецах рода
reading.MomentPeriod.SUNSET=У пришедшего на закате впереди идут скальные цен (བཙན, btsan). Родня по отцу ссорится и её род рвётся, дом сгорел, семья снова и снова переезжает и служит чужому господину, детей много, а еды мало, и ссоры внутри и снаружи.
reading.MomentPeriod.SUNSET.spirits=дрэво (གྲེ་བོ, gre bo), со смертями от клинка в женской линии; дух самоубийцы (ལྕེབ་འདྲེ, lceb 'dre) — на женщинах
MomentPeriod.DAWN=рассвет
MomentPeriod.SUNRISE=восход
MomentPeriod.WARMTH=солнце пригревает
MomentPeriod.NOON=полдень
MomentPeriod.PAST_NOON=после полудня
MomentPeriod.LATE=исход дня
MomentPeriod.SUNSET=закат
reading.MomentElement={0} Стихия могущества часа — сын стихии дня на рассвете и каждый час сын предыдущей — говорит о роде, доме и богатстве спрашивающего.
reading.MomentElement.WOOD=В час дерева отец и дяди из благородного рода, хотя некоторые ветви пресеклись; они крупные, громкоголосые и длинноволосые; враги падают, родня поднимается, детей мало, и половина умирает, а богатство то приходит, то уходит: то триста вьюков, то мера гречихи.
reading.MomentElement.WOOD.livestock=бледно-жёлтые с синим пёстрые сторожевой пёс и верховая лошадь
reading.MomentElement.WOOD.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po), демоны (བདུད, bdud) и духи цен (བཙན, btsan) на своём пути; владыка земли в поле
reading.MomentElement.FIRE=В час огня люди из благородного рода или рода гончаров, в котором была смерть от клинка; вспыльчивые и чистосердечные, гордые речью, с большими подъёмами и падениями, братья в согласии; дети румяные, трое или около того, дела удаются, а ссор много.
reading.MomentElement.FIRE.livestock=сторожевой пёс и верховая лошадь с красными отметинами или белые
reading.MomentElement.FIRE.illness=внезапные беды, разбитая голова или ожог
reading.MomentElement.FIRE.spirits=наги (ཀླུ, klu) и духи цен (བཙན, btsan), духи гьялпо (རྒྱལ་པོ, rgyal po)
reading.MomentElement.FIRE.remedy=пошлите духам гьялпо и цен нитяной крест (མདོས, mdos) из ста кусков мяса и ста кусков теста
reading.MomentElement.EARTH=В час земли человек с жёлтым лицом, из рода нгагпа или цен, держит землю, с родимым пятном, как у предков; детей мало, с изъяном в членах или чувствах, богатство теряется, отец и дяди мало добры, удача ушла на восток, дела средние, врагов нет.
reading.MomentElement.EARTH.livestock=жёлто-чёрные собаки и лошади; овцы и коровы удаются
reading.MomentElement.EARTH.spirits=владыки земли (ས་བདག, sa bdag) и духи гьялпо (རྒྱལ་པོ, rgyal po), наги (ཀླུ, klu) и дух сен (བསེན, bsen)
reading.MomentElement.EARTH.remedy=исправьте обиду владык земли, призовите богов и поднесите им подношения
reading.MomentElement.IRON=В час железа человек светлолицый, из рода с пятном, громкий и разговорчивый; сыновей трудно вырастить, дочерей легко, удача убывает к западу, родня обижает владык земли, в доме горбун, калека или чахоточный, дела удаются, а ссоры приходят.
reading.MomentElement.IRON.livestock=белые или синие сторожевой пёс и верховая лошадь, скот с белыми отметинами; козы удаются
reading.MomentElement.IRON.illness=болезни лёгких, колющие боли и внезапная болезнь, испуг в сумерках
reading.MomentElement.IRON.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po), ньен (གཉན, gnyan) и владыки земли (ས་བདག, sa bdag), дрэво (གྲེ་བོ, gre bo)
reading.MomentElement.IRON.remedy=белые обряды, отошлите крест гьялпо (རྒྱལ་མདོས, rgyal mdos) и торму цен, отвратите толпу и выкупите жизнь
reading.MomentElement.WATER=В час воды человек смуглый, из рода бонпо (བོན་པོ, bon po) или низкого рода, странствующий и переменчивый; женщины вдовеют или расходятся, дальняя родня добрее ближней, на чужбине лучше, чем дома, приходят враги и ссоры, пищи и богатства хватает.
reading.MomentElement.WATER.livestock=чёрно-красные сторожевой пёс и верховая лошадь; самки яка и яки удаются
reading.MomentElement.WATER.illness=холод в животе, жёлтая жидкость и опухоли
reading.MomentElement.WATER.spirits=женский дух умерших, нарушивших обеты (དམ་སྲི, dam sri), наги (ཀླུ, klu) и владыки земли (ས་བདག, sa bdag)
reading.MomentElement.WATER.remedy=девять нитяных крестов богинь озёр, возвратите долги и доброту нагам и их богиням и примирите роды
