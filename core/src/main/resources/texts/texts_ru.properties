reading.LunarDate.14=Пустой день (སྟོང་པ, stong pa), Рикта, неблагой: всякое дело названо дурным. Средство — по обряду поднять в воздух пустой сосуд, прочесть «Поток богатства» (ནོར་རྒྱུན, nor rgyun) и закрепить залог богатства. Мальчик, рождённый сегодня, — к худу для матери; следом рождаются девочки. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: за ухом и челюсть; у лошадей и другого скота — плечо; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.15=Полный день (རྫོགས་པ, rdzogs pa), Пурна: в целом плох для дел, но хорош для постройки крепости и сокрытия клада. Средство — обряды, умножающие славу, и чтение «Груды благополучия» (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa). Мальчик, рождённый сегодня, будет богат; девочка умирает или живёт одна. Купленный сегодня скот умножается всемеро. Хороши и «шесть обрядов» (དྲུག་ལས, drug las). Один из четырёх опасных дней месяца: царь мар Гараб Вангчуг (དགའ་རབ་དབང་ཕྱུག, dga' rab dbang phyug) ведёт свои войска против богов. Заболеть сегодня опасно; большие сборища и всё великое и сильное плохо. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: лопатка; у лошадей и другого скота — всё тело; там не делают кровопускания, прижигания и иного лечения.
