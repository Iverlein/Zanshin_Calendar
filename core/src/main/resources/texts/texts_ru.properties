# Readings: ROKUYO
reading.Rokuyo={0} Шесть дней (六曜) в нынешнем виде впервые встречаются в альманахе 1747 года. В эпоху Эдо они были лишь одной из многих пометок; вес они обрели после 1873 года, когда правительство Мэйдзи убрало из альманаха пометки об удаче, а 六曜 остались при нём.
reading.Rokuyo.SENSHO=Действуйте рано: утро благоприятно, после полудня — нет. Считается хорошим днём для срочных дел и тяжб.
reading.Rokuyo.TOMOBIKI=Ничья: ни одна сторона не выигрывает. Хорош для торжеств; утро и вечер благоприятны, полдень — нет. Похорон по обычаю избегают — народное поверье по созвучию с 友曳, «увести друга».
reading.Rokuyo.SENBU=Ждите спокойно и не спешите: утро неблагоприятно, после полудня — благоприятно. Споров и срочных дел лучше избегать.
reading.Rokuyo.BUTSUMETSU=Ничто не приносит плодов; худший из шести, свадеб избегают. Несмотря на название («кончина Будды»), к буддизму не относится: старое название значило «пустой».
reading.Rokuyo.TAIAN=Великий покой: успех во всём — поездки, переезд, брак, открытие лавки.
reading.Rokuyo.SHAKKO=Неблагоприятен для торжеств; благоприятен лишь час Лошади, около 11:00–13:00. Осторожнее с огнём и клинками.

# Readings: CHOKU
reading.Choku.TATSU=Очень благоприятный, хорош для всего.
reading.Choku.NOZOKU=День, чтобы отвратить дурное.
reading.Choku.MITSU=Полный день.
reading.Choku.TAIRA=Хорошее и плохое уравновешены; очень хорош для переговоров.
reading.Choku.SADAN=День, чтобы определиться.
reading.Choku.TORU=День, чтобы принимать.
reading.Choku.YABURU=День разрушения.
reading.Choku.AYAUSHI=Шаткий день.
reading.Choku.NARU=День завершения.
reading.Choku.OSAN=День сбора; обычным делам не мешает.
reading.Choku.HIRAKU=День открытия: начатое найдёт свой путь.
reading.Choku.TOZU=День закрытия, плох для большинства дел.

# Readings: SHUKU
reading.Shuku.BO=Очень благоприятный.
reading.Shuku.KI=Похороны и погребения приносят большое несчастье.
reading.Shuku.TO=Колодцы и амбары, построенные сегодня, наполнятся сокровищами.
reading.Shuku.GYU=Хорош для всего.
reading.Shuku.JO=Плохой день.
reading.Shuku.KYO=Несчастье следует сразу.
reading.Shuku.KIH=Очень плохой день: это приносит бедность.
reading.Shuku.RO=Очень хорош для свадеб.
reading.Shuku.I=Особенно следует избегать похорон.
reading.Shuku.SHI=Плохой день: свадьба рассеивает богатство и приносит болезнь. Будьте сдержанны.
reading.Shuku.SEI=Спокойный, благоприятный день.
reading.Shuku.KI2=Очень благоприятный день, хорош для всего.
reading.Shuku.RYU=Похороны приносят семь несчастий.
reading.Shuku.SEI2=Очень плохой день для этого.
reading.Shuku.CHO=Это закладывает основу процветания семьи.
reading.Shuku.YOKU=Плохой день.

# Readings: SENJITSU
reading.Senjitsu.TENSHA=Сто богов восходят на небо, и небо прощает все проступки: лучший день года, отмеченный как «хорош для всего». Пять-шесть раз в год.
reading.Senjitsu.ICHIRYU_MANBAI=Одно зерно вырастает в десять тысяч: считается хорошим для начинаний. Японский избранный день без классического китайского источника; доверие к нему невелико.
reading.Senjitsu.DAIMYO=Небо и земля открыты, и солнце достигает каждого уголка: очень хорош для всех добрых дел.
reading.Senjitsu.TENON=День небесной милости: очень хорош для радостных событий, не для печальных.
reading.Senjitsu.BOSO=Небо лелеет людей, как мать своё дитя: хорош для всего, особенно для брака.
reading.Senjitsu.SETTOKU=Хорош для работ, касающихся земли, например пристройки или перестройки дома.
reading.Senjitsu.KISHUKU=День стоянки 鬼, которую альманах считает очень благоприятной.
reading.Senjitsu.TORA=День Тигра двенадцатидневного цикла. Тигр уходит на тысячу ри и возвращается на тысячу ри, поэтому свадеб избегали. Праздничный день Бисямонтэна.
reading.Senjitsu.MI=День Змеи двенадцатидневного цикла.
reading.Senjitsu.TSUCHINOTO_MI=Праздничный день Бэндзайтэн, раз в шестьдесят дней.
reading.Senjitsu.KINOE_NE=Первый из шестидесяти дней и праздничный день Дайкокутэна. В 甲子待 не спали до часа Крысы и подносили соевые бобы, чёрные бобы и раздвоенную редьку ради мирской удачи.
reading.Senjitsu.TENICHI_TENJO=В эти шестнадцать дней бог направлений Тэнъити-дзин пребывает на небе, поэтому ни одно направление не закрыто и любая поездка хороша. Вместо него в доме находится Нитию-дзин: держите дом в чистоте.
reading.Senjitsu.JUSHI=Чёрный день, худший из всех: остальные пометки можно не читать, и в нижней полосе альманаха в этот день больше ничего не печатали. Болезнь, начавшаяся сегодня, считается смертельной. Лишь похорон это не касается.
reading.Senjitsu.JISSHI=Следующий после чёрного дня: плох для всего, в том числе для похорон. Как и чёрный день, стоял в нижней полосе альманаха один.
reading.Senjitsu.KIKO=Дух звезды Тяньбан стоит у дверей и не даёт людям вернуться домой.
reading.Senjitsu.CHIIMI=Видеть кровь — к несчастью.
reading.Senjitsu.TENKA=Небесный огонь свиреп: крыша, поднятая сегодня, говорят, навлечёт пожар.
reading.Senjitsu.JIKA=Земной огонь свиреп.
reading.Senjitsu.OMO=«Уйти и погибнуть»: когда-то в этот день войска не выступали.
reading.Senjitsu.FUJOJU=Ничего не свершится: начинать что-либо — к несчастью.
reading.Senjitsu.SANRINBO=Строительство сегодня, говорят, погубит трёх соседей. Некоторые альманахи добавляют, что подъём на высоту приводит к травме.
reading.Senjitsu.JIPPOGURE=Десять дней, когда силы неба и земли сталкиваются и ничего не ладится: много труда, мало толку.
reading.Senjitsu.HASSEN=Двенадцать дней, из которых у восьми ствол и ветвь одной стихии: хорошее становится лучше, плохое — хуже; поздние альманахи подчёркивали только плохое.
reading.Senjitsu.HASSEN_MABI=Один из четырёх дней внутри 八専, у которых ствол и ветвь разных стихий: свободен от его влияния.
reading.Senjitsu.OTSUCHI=Бог земли Докудзин находится в земле: не тревожьте почву.
reading.Senjitsu.KOTSUCHI=Бог земли Докудзин находится в земле: не тревожьте почву.
reading.Senjitsu.TSUCHI_MABI=День между большим и малым земляными запретами, без их ограничений.
reading.Senjitsu.SAIGEJIKI=Звёздный дух Тэнко спускается поесть; то, что едят люди, теряет силу. Лёгкий плохой день: если другая пометка называет день хорошим, его можно не соблюдать, но вместе с другим дурным днём он тяжелее. Руководство 1901 года говорит так: он не вредит в день, чьи знак и ветвь питают друг друга и на который не падает иной дурной день.
reading.Senjitsu.JUNICHI=Сделанное сегодня повторится: хорошо для хорошего, плохо для плохого. Свадеб избегают, так как они повторились бы.
reading.Senjitsu.FUKUNICHI=Добрые дела сегодня удваиваются, как и дурные. Свадеб избегают, так как они повторились бы.
reading.Senjitsu.KANOE_SARU=Ночь косин: три червя в теле, пока человек спит, поднимаются на небо и докладывают о его проступках, поэтому люди бодрствовали вместе (庚申待).
reading.Senjitsu.TAIKA=Худший из трёх плохих дней для вашего года рождения. Классическое правило даёт три дурных дня по солнечному месяцу, каждый — человеку, рождённому в год ветви этого месяца, как их и показывает приложение; позднейшие альманахи чаще считают их дурными для всех.
reading.Senjitsu.ROSHAKU=Один из трёх плохих дней для вашего года рождения: всё, говорят, терпит неудачу. Классическое правило даёт три дурных дня по солнечному месяцу, каждый — человеку, рождённому в год ветви этого месяца, как их и показывает приложение; позднейшие альманахи чаще считают их дурными для всех.
reading.Senjitsu.METSUMON=Один из трёх плохих дней для вашего года рождения: говорят, губит весь дом. Классическое правило даёт три дурных дня по солнечному месяцу, каждый — человеку, рождённому в год ветви этого месяца, как их и показывает приложение; позднейшие альманахи чаще считают их дурными для всех.

# Readings: ZASSETSU
reading.Zassetsu.SETSUBUN=Канун 立春. Когда-то канун каждого сезона, теперь только весны; разбрасывание бобов восходит к китайскому обряду изгнания 追儺.
reading.Zassetsu.HIGAN_IRI=Первый из семи дней вокруг равноденствия.
reading.Zassetsu.HIGAN=Внутри семи дней вокруг равноденствия.
reading.Zassetsu.HIGAN_AKE=Последний день хиган.
reading.Zassetsu.SHANICHI=День 戊, ближайший к равноденствию, посвящённый божеству земли. После войны исключён из официальных эфемерид.
reading.Zassetsu.HACHIJUHACHIYA=88-й день от 立春: конец поры заморозков — берегитесь поздних заморозков.
reading.Zassetsu.NYUBAI=Солнце на долготе 80°: календарное начало сезона дождей.
reading.Zassetsu.HANGESHO=Солнце на долготе 100°.
reading.Zassetsu.DOYO_IRI=Начало примерно восемнадцати дней перед началом сезона, которые учение о пяти стихиях отдаёт земле.
reading.Zassetsu.DOYO=Внутри сезона земли перед началом нового сезона.
reading.Zassetsu.DOYO_USHI=День Быка внутри доё.
reading.Zassetsu.NIHYAKUTOKA=210-й день от 立春, когда рис цветёт и приближаются тайфуны.
reading.Zassetsu.NIHYAKUHATSUKA=220-й день от 立春, ещё в сезон тайфунов.

# Readings: the 24 solar terms (ROADMAP K6, block 56)
reading.SolarTerm.RISSHUN=Начало весны и 1-го солнечного месяца, 寅月: поднимается ци весны, хотя холода лишь миновали свой пик. С этого дня меняются 干支 года, звезда года и 恵方, а 節分 — день накануне.
reading.SolarTerm.RISSHUN.also_called=正月節, 節 1-го месяца
reading.SolarTerm.USUI=Ци ян выходит над землёй: снег и лёд тают в воду, снег сменяется дождём. Лунный месяц, в который попадает 雨水, — 1-й, месяц 旧正月.
reading.SolarTerm.USUI.also_called=正月中, 中 1-го месяца
reading.SolarTerm.KEICHITSU=Начало 2-го солнечного месяца, 卯月: ци ян шевелится в земле. Насекомые, зимовавшие под землёй, открывают свои норы и выходят наружу.
reading.SolarTerm.KEICHITSU.also_called=二月節, 節 2-го месяца
reading.SolarTerm.SHUNBUN=Весеннее равноденствие: Солнце восходит точно на востоке и заходит точно на западе, день и ночь почти равны. Это средний день весеннего 彼岸, а весенний 社日 — ближайший к нему день 戊. Лунный месяц, в который оно попадает, — 2-й.
reading.SolarTerm.SHUNBUN.also_called=二月中, 中 2-го месяца
reading.SolarTerm.SEIMEI=Начало 3-го солнечного месяца, 辰月: всё выходит наружу чистым и ясным, так что по каждой почке видно, что за растение из неё вырастет. Название значит «чисто и ясно».
reading.SolarTerm.SEIMEI.also_called=三月節, 節 3-го месяца
reading.SolarTerm.KOKUU=Весенний дождь выпадает и пробуждает к жизни сто злаков. Весенний 土用 начинается примерно за три дня до него и длится до дня накануне 立夏, а 八十八夜 приходится на его срок. Лунный месяц, в который он попадает, — 3-й.
reading.SolarTerm.KOKUU.also_called=三月中, 中 3-го месяца
reading.SolarTerm.RIKKA=Начало лета и 4-го солнечного месяца, 巳月: поднимается лето, и длится оно до дня накануне 立秋. Весенний 土用 кончается накануне.
reading.SolarTerm.RIKKA.also_called=四月節, 節 4-го месяца
reading.SolarTerm.SHOMAN=Всё растёт и начинает наполнять небо и землю, растения густеют ветвями и листьями. Всё наполняется понемногу, отсюда название. Лунный месяц, в который он попадает, — 4-й.
reading.SolarTerm.SHOMAN.also_called=四月中, 中 4-го месяца
reading.SolarTerm.BOSHU=Начало 5-го солнечного месяца, 午月: время сеять остистые злаки, такие как рис. На его срок приходится 入梅, календарное начало сезона дождей.
reading.SolarTerm.BOSHU.also_called=五月節, 節 5-го месяца
reading.SolarTerm.GESHI=Летнее солнцестояние: жар ян достигает пика, день — самый длинный в году. С ближайшего к нему дня 甲子 счёт звёзд дня идёт вниз. На его срок приходится 半夏生, а лунный месяц, в который оно попадает, — 5-й.
reading.SolarTerm.GESHI.also_called=五月中, 中 5-го месяца
reading.SolarTerm.SHOSHO=Начало 6-го солнечного месяца, 未月: наступает жара, ещё до большой жары, и примерно тогда кончается сезон дождей. Летние приветствия посылают отсюда до дня накануне 立秋.
reading.SolarTerm.SHOSHO.also_called=六月節, 節 6-го месяца
reading.SolarTerm.TAISHO=Летняя жара в самом разгаре. Летний 土用 начинается примерно за три дня до него и длится до дня накануне 立秋, а его дни Быка — это 土用の丑の日. Лунный месяц, в который он попадает, — 6-й.
reading.SolarTerm.TAISHO.also_called=六月中, 中 6-го месяца
reading.SolarTerm.RISSHU=Начало осени и 7-го солнечного месяца, 申月: впервые поднимается ци осени. Он приходится на самые жаркие недели, но отсюда жара только убывает. Летний 土用 кончается накануне.
reading.SolarTerm.RISSHU.also_called=七月節, 節 7-го месяца
reading.SolarTerm.SHOSHO_HEAT=Ци ян останавливается и начинает отступать, жара спадает. На его срок приходится 二百十日, день бурь. Лунный месяц, в который он попадает, — 7-й, месяц 七夕.
reading.SolarTerm.SHOSHO_HEAT.also_called=七月中, 中 7-го месяца
reading.SolarTerm.HAKURO=Начало 8-го солнечного месяца, 酉月: ци инь собирается, и роса ложится на траву белой. На его срок приходится 二百二十日, ещё в сезон бурь.
reading.SolarTerm.HAKURO.also_called=八月節, 節 8-го месяца
reading.SolarTerm.SHUBUN=Осеннее равноденствие: инь и ян делятся поровну, день и ночь почти равны. Это средний день осеннего 彼岸, а осенний 社日 — ближайший к нему день 戊. Лунный месяц, в который оно попадает, — 8-й, месяц 十五夜.
reading.SolarTerm.SHUBUN.also_called=八月中, 中 8-го месяца
reading.SolarTerm.KANRO=Начало 9-го солнечного месяца, 戌月: осень углубляется, холодает. Встречая холодную ци инь, роса выпадает на дикие травы и вот-вот замёрзнет.
reading.SolarTerm.KANRO.also_called=九月節, 節 9-го месяца
reading.SolarTerm.SOKO=Роса, скованная ци инь, становится инеем и выпадает. Осенний 土用 начинается примерно за три дня до него и длится до дня накануне 立冬. Лунный месяц, в который он попадает, — 9-й, месяц 重陽 и 十三夜.
reading.SolarTerm.SOKO.also_called=九月中, 中 9-го месяца
reading.SolarTerm.RITTO=Начало зимы и 10-го солнечного месяца, 亥月: начинает подниматься ци зимы, и становится всё холоднее. Зима длится до дня накануне 立春, а осенний 土用 кончается накануне.
reading.SolarTerm.RITTO.also_called=十月節, 節 10-го месяца
reading.SolarTerm.SHOSETSU=Холодает, так что и дождь выпадает снегом, но в этом месяце снега ещё мало. Лунный месяц, в который он попадает, — 10-й.
reading.SolarTerm.SHOSETSU.also_called=十月中, 中 10-го месяца
reading.SolarTerm.TAISETSU=Начало 11-го солнечного месяца, 子月: снег всё падает и падает, ложится на снег и копится. Он — пара к 小雪, малым снегам.
reading.SolarTerm.TAISETSU.also_called=十一月節, 節 11-го месяца
reading.SolarTerm.TOJI=Зимнее солнцестояние: Солнце идёт у своего южного предела, день — самый короткий в году. С ближайшего к нему дня 甲子 счёт звёзд дня идёт вверх. Лунный месяц, в который оно попадает, — 11-й.
reading.SolarTerm.TOJI.also_called=十一月中, 中 11-го месяца
reading.SolarTerm.SHOKAN=Начало 12-го солнечного месяца, 丑月, и вступление в холода. С 冬至 поднялся один ян и идёт против ци инь, поэтому становится ещё холоднее. Пора холодов длится отсюда до 節分.
reading.SolarTerm.SHOKAN.also_called=十二月節, 節 12-го месяца
reading.SolarTerm.DAIKAN=Холод достигает предела, а после него начинает теплеть. Зимний 土用 начинается примерно за три дня до него и длится до 節分, дня накануне 立春. Лунный месяц, в который он попадает, — 12-й.
reading.SolarTerm.DAIKAN.also_called=十二月中, 中 12-го месяца

# Readings: ELEMENT_PAIR
reading.ElementPair={0} Пара делает любое дело хорошим или плохим: даже когда день недели и созвездие хороши каждый сам по себе, плохая пара даёт свой плод, а хорошая даёт свой там, где они плохи.
reading.ElementPair.EARTH_EARTH=Земля встречает землю: достижение (དངོས་གྲུབ, dngos grub), и с ним удаётся всё желаемое.
reading.ElementPair.EARTH_EARTH.rank=одна из трёх хороших
reading.ElementPair.WATER_WATER=Вода встречает воду: нектар (བདུད་རྩི, bdud rtsi), он умножает жизнь и силу.
reading.ElementPair.WATER_WATER.rank=одна из трёх хороших
reading.ElementPair.EARTH_WATER=Земля встречает воду: юность (ལང་ཚོ, lang tsho), она приносит большое счастье.
reading.ElementPair.EARTH_WATER.rank=одна из трёх хороших
reading.ElementPair.FIRE_FIRE=Огонь встречает огонь: возрастание (འཕེལ་འགྱུར, 'phel 'gyur), оно приносит еду и одежду.
reading.ElementPair.FIRE_FIRE.rank=одна из трёх поддерживающих (གསོ་ཐུབ, gso thub), после трёх хороших
reading.ElementPair.WIND_WIND=Ветер встречает ветер: совершенство (ཕུན་ཚོགས, phun tshogs), с ним желания исполняются быстро. Всё, что надо сделать быстро, идёт хорошо.
reading.ElementPair.WIND_WIND.rank=одна из трёх поддерживающих (གསོ་ཐུབ, gso thub), после трёх хороших
reading.ElementPair.FIRE_WIND=Огонь встречает ветер: сила (སྟོབས་ལྡན, stobs ldan), она приносит добрые знамения.
reading.ElementPair.FIRE_WIND.rank=одна из трёх поддерживающих (གསོ་ཐུབ, gso thub), после трёх хороших
reading.ElementPair.EARTH_WIND=Земля встречает ветер: несовместимость (མི་འཕྲོད, mi 'phrod), она истощает еду и богатство. Приходят грабёж и горе, и цели не достигаются.
reading.ElementPair.EARTH_WIND.rank=одна из трёх плохих
reading.ElementPair.WATER_WIND=Вода встречает ветер: разлад (མི་མཐུན, mi mthun), он разлучает родных и друзей. Он годится, чтобы сеять раздор и изгонять врагов.
reading.ElementPair.WATER_WIND.rank=одна из трёх плохих
reading.ElementPair.EARTH_FIRE=Земля встречает огонь: сожжение (སྲེག་པ, sreg pa), оно порождает страдание. Дела, что причиняют страдание другим, идут в этот день хорошо.
reading.ElementPair.EARTH_FIRE.rank=одна из трёх плохих
reading.ElementPair.FIRE_WATER=Огонь встречает воду: смерть (འཆི་བ, 'chi ba), она отнимает жизнь.
reading.ElementPair.FIRE_WATER.rank=худшая (ཐ་ཆད, tha chad) из десяти

# Readings: SPECIAL_DAY
reading.SpecialDay.EIGHTH=Восьмое число месяца — особый день для любого благого действия, как и полнолуние, новолуние и дни затмений. Мирянам рекомендуется принимать в этот день восемь обетов.
reading.SpecialDay.TENTH=Гуру Ринпоче (གུ་རུ་རིན་པོ་ཆེ, gu ru rin po che) обещал приходить в Тибет каждый десятый день, поэтому каждый десятый день — праздник его просветлённой деятельности. Его отмечают подношениями цог (ཚོགས, tshogs) и гуру-пуджей.
reading.SpecialDay.FULL_MOON=Полнолуние — особый день для любого благого действия, и мирянам рекомендуется принимать в этот день восемь обетов. Это день Соджонг (གསོ་སྦྱོང, gso sbyong), когда монашеские общины совершают исповедь.
reading.SpecialDay.TWENTY_FIFTH=Двадцать пятое число месяца, как и десятое, — день, когда совершают подношения цог (ཚོགས, tshogs) тантры. В этот день особенно рекомендуется совершать гуру-пуджу.
reading.SpecialDay.NEW_MOON=Новолуние — особый день для любого благого действия, и мирянам рекомендуется принимать в этот день восемь обетов. Это день Соджонг (གསོ་སྦྱོང, gso sbyong), когда монашеские общины совершают исповедь.

# Readings: TIBETAN_FESTIVAL
reading.TibetanFestival={0} Это одно из великих событий (དུས་ཆེན, dus chen), которые альманах записывает в начале их месяца.
reading.TibetanFestival.LOSAR=Лосар (ལོ་གསར, lo gsar), первый день тибетского года, празднуют всеми радостными способами. Первые пятнадцать дней — дни чудес Будды.
reading.TibetanFestival.CHOTRUL_DUCHEN=Чотрул Дючен (ཆོ་འཕྲུལ་དུས་ཆེན, cho 'phrul dus chen) — день великих чудес Будды Шакьямуни. Любое благое или неблагое действие в этот день многократно умножается.
reading.TibetanFestival.KALACAKRA=Полнолуние третьего месяца — это день, когда была провозглашена Калачакра-тантра (དུས་ཀྱི་འཁོར་ལོའི་རྒྱུད, dus kyi 'khor lo'i rgyud).
reading.TibetanFestival.BIRTH=Седьмое число четвёртого месяца — это день, когда родился Будда.
reading.TibetanFestival.SAGA_DAWA_DUCHEN=Полнолуние Сага Дава (ས་ག་ཟླ་བ, sa ga zla ba), четвёртого месяца, — день, когда Будда родился, достиг просветления и ушёл в паринирвану. Любое благое или неблагое действие в этот день многократно умножается.
reading.TibetanFestival.ZAMLING_CHISANG=Дзамлинг Чисанг (འཛམ་གླིང་སྤྱི་བསང, 'dzam gling spyi bsang), пятнадцатое число пятого месяца, — день всеобщего дымного подношения санг (བསང, bsang) всем защитникам.
reading.TibetanFestival.CHOKHOR_DUCHEN=Чокор Дючен (ཆོས་འཁོར་དུས་ཆེན, chos 'khor dus chen) — день, когда Будда Шакьямуни впервые повернул колесо Дхармы. Любое благое или неблагое действие в этот день многократно умножается.
reading.TibetanFestival.ENTRY_INTO_WOMB=Полнолуние шестого месяца — день вхождения Будды в лоно его матери.
reading.TibetanFestival.LHABAB_DUCHEN=Лхабаб Дючен (ལྷ་བབས་དུས་ཆེན, lha babs dus chen) — день, когда Будда Шакьямуни вернулся из мира богов. Любое благое или неблагое действие в этот день многократно умножается.
reading.TibetanFestival.GADEN_NGAMCHO=Ганден Нгамчо (དགའ་ལྡན་ལྔ་མཆོད, dga' ldan lnga mchod) — день паринирваны Дже Цонкапы (རྗེ་ཙོང་ཁ་པ, rje tsong kha pa). Любое благое или неблагое действие в этот день многократно умножается.
reading.TibetanFestival.PROTECTORS=Двадцать девятое число двенадцатого месяца, в конце года, — день благодарения защитникам Дхармы.

# Readings: PERSONAL_DAY
reading.PersonalDay.LUCK=Сегодня ваш день недели ла (བླ་གཟའ, bla gza'), день удачи животного вашего года рождения: благоприятный день, чтобы начинать дела и устраивать торжества. Когда его планета в силе, дела идут хорошо.
reading.PersonalDay.LIFE=Сегодня ваш день недели жизненной силы (སྲོག་གཟའ, srog gza'), по животному вашего года рождения: благоприятный и благой день, чтобы начинать дела и устраивать торжества.
reading.PersonalDay.ANTI=Сегодня ваш день недели губителя (གཤེད་གཟའ, gshed gza'), по животному вашего года рождения: неблагоприятный день, в который следует избегать начинать дела и устраивать торжества. Обряды силы против врага действуют быстро, когда ваш день недели губителя в силе, а день недели ла (བླ་གཟའ, bla gza') врага слаб.
reading.PersonalMansion={0} Это одно из шести личных созвездий животного вашего года рождения.
reading.PersonalMansion.BLA=Сегодня Луна в вашем созвездии ла (བླ་སྐར, bla skar), созвездии жизненного духа: дела, начинания и всё прочее идут хорошо.
reading.PersonalMansion.BLA.birth=ребёнок, для которого это собственное созвездие ла, живёт долго
reading.PersonalMansion.SROG=Сегодня Луна в вашем созвездии жизни (སྲོག་སྐར, srog skar): всё в этот день идёт хорошо.
reading.PersonalMansion.DBANG=Сегодня Луна в вашем созвездии силы (དབང་སྐར, dbang skar): всё в этот день идёт хорошо.
reading.PersonalMansion.DBANG.birth=ребёнок, для которого это собственное созвездие силы, обретает великие заслуги
reading.PersonalMansion.SKEG=Сегодня Луна в вашем созвездии препятствий (སྐེག་སྐར, skeg skar): это неблагоприятное для вас созвездие, в котором всё идёт плохо.
reading.PersonalMansion.BDUD=Сегодня Луна в вашем созвездии демона (བདུད་སྐར, bdud skar): это неблагоприятное для вас созвездие.
reading.PersonalMansion.GSHED=Сегодня Луна в вашем созвездии губителя (གཤེད་སྐར, gshed skar), а это созвездие смерти (འཆི་བའི་སྐར་མ, 'chi ba'i skar ma): всё идёт плохо, но усмирение препятствующих духов идёт хорошо.
reading.PersonalMansion.GSHED.birth=ребёнок, для которого это собственное созвездие губителя, живёт недолго

# Readings: JAPANESE_FESTIVAL
reading.Festival.旧正月=Первый день первого месяца старого лунно-солнечного календаря.
reading.Festival.人日の節句=Один из пяти сезонных праздников (五節句), 7-й день 1-го месяца. До 1872 года все пять были официальными праздниками.
reading.Festival.上巳の節句=Один из пяти сезонных праздников, 3-й день 3-го месяца.
reading.Festival.端午の節句=Один из пяти сезонных праздников, 5-й день 5-го месяца.
reading.Festival.七夕=Один из пяти сезонных праздников, 7-й день 7-го месяца. Отмечаемый по старому календарю, он называется «традиционной Танабатой».
reading.Festival.十五夜=Луна середины осени, пятнадцатая ночь 8-го месяца, ночь любования луной.
reading.Festival.重陽の節句=Один из пяти сезонных праздников, 9-й день 9-го месяца.
reading.Festival.十三夜=Второе любование луной, в 13-ю ночь 9-го месяца; обычай есть только в Японии и, как считается, начался с любования луной у отрёкшегося императора Уда в 919 году. Её называют также поздней луной, каштановой луной или бобовой луной.
reading.Festival.お盆=Праздник духов предков, прежде приходившийся на дни около 15-го числа 7-го месяца старого календаря. После перехода на солнечный календарь в эпоху Мэйдзи большинство областей отмечает его на месяц позже (月遅れ), 13–16 августа, около показанного здесь 15-го, потому что середина июля пришлась на страдную пору; Токио отмечает 15 июля, а Окинава и Амами — по старому календарю.

# Readings: lunar mansions (Henning's kind of work and nature, in the White Beryl's seven classes, pp. 328–329; its class alone where Henning's line contradicts it)
reading.Mansion.ASHVINI=Ашвини — одно из четырёх неустойчивых и переменчивых созвездий, лёгкое и быстрое по природе: торговля, искусства и тому подобное идут хорошо. Его природа связана с врагами.
reading.Mansion.ASHVINI.planet=Солнце
reading.Mansion.ASHVINI.foods=мясо и мёд
reading.Mansion.BHARANI=Бхарани — созвездие, успешное в устойчивых целях и суровое по природе: разрушение, обман и тому подобное идут хорошо. Его природа связана с осквернением.
reading.Mansion.BHARANI.planet=Луна
reading.Mansion.BHARANI.foods=кунжут и рис
reading.Mansion.KRITTIKA=Криттика — одно из двух нейтральных созвездий, уравновешенное и смешанное по природе: смешанные дела идут хорошо. Его природа связана с повторением.
reading.Mansion.KRITTIKA.planet=Марс
reading.Mansion.KRITTIKA.foods=простокваша
reading.Mansion.ROHINI=Рохини — одно из четырёх очень устойчивых созвездий, постоянное по природе: коронации, сев и другие долговечные дела идут хорошо. Его природа связана с удачей.
reading.Mansion.ROHINI.planet=Меркурий
reading.Mansion.ROHINI.foods=йогурт или мёд
reading.Mansion.MRIGASHIRAS=Мригашира — одно из четырёх быстрых и благих созвездий, мягкое и нежное по природе: любовь, дружба, украшения и брак идут хорошо. Его природа связана с осквернением.
reading.Mansion.MRIGASHIRAS.planet=Юпитер
reading.Mansion.MRIGASHIRAS.foods=дичь
reading.Mansion.ARDRA=Ардра — одно из четырёх созвездий дурного плода, ужасное по природе: нападения, заклинания, убийство и разлучение друзей идут хорошо. Его природа связана с путником.
reading.Mansion.ARDRA.planet=Венера
reading.Mansion.ARDRA.foods=кровь и вода
reading.Mansion.PUNARVASU=Пунарвасу — одно из пяти быстрых и переменчивых созвездий, мимолётное по природе: временные дела идут хорошо. Его природа связана с удачей.
reading.Mansion.PUNARVASU.planet=Сатурн
reading.Mansion.PUNARVASU.foods=выпечка
reading.Mansion.PUSHYA=Пушья — одно из четырёх неустойчивых и переменчивых созвездий, лёгкое и быстрое по природе: торговля, любовь, искусства и тому подобное идут хорошо. Его природа связана со свершением.
reading.Mansion.PUSHYA.planet=Солнце
reading.Mansion.PUSHYA.foods=мёд и зайчатина
reading.Mansion.ASHLESHA=Ашлеша — одно из четырёх созвездий дурного плода, ужасное по природе: заклинания, нападения и тому подобное идут хорошо. Его природа связана с путником.
reading.Mansion.ASHLESHA.planet=Луна
reading.Mansion.ASHLESHA.foods=змеиное мясо
reading.Mansion.MAGHA=Магха — одно из четырёх устойчивых и свершающих созвездий, суровое по природе: разрушение, обман и тому подобное идут хорошо. Его природа связана с врагами.
reading.Mansion.MAGHA.planet=Марс
reading.Mansion.MAGHA.foods=кунжутный суп
reading.Mansion.PURVAPHALGUNI=Пурвапхалгуни — одно из четырёх устойчивых и свершающих созвездий, суровое по природе: разрушение, обман и тому подобное идут хорошо. Его природа связана с осквернением.
reading.Mansion.PURVAPHALGUNI.planet=Меркурий
reading.Mansion.PURVAPHALGUNI.foods=рис и жареный кунжут
reading.Mansion.UTTARAPHALGUNI=Уттарапхалгуни — одно из четырёх очень устойчивых созвездий, постоянное по природе: коронации, сев и другие долговечные дела идут хорошо. Его природа связана с врагами.
reading.Mansion.UTTARAPHALGUNI.planet=Юпитер
reading.Mansion.UTTARAPHALGUNI.foods=просо
reading.Mansion.HASTA=Хаста — одно из четырёх неустойчивых и переменчивых созвездий, лёгкое и быстрое по природе: торговля, любовь, искусства и тому подобное идут хорошо. Его природа связана со смертью.
reading.Mansion.HASTA.planet=Венера
reading.Mansion.HASTA.foods=птичье мясо и колосья
reading.Mansion.CITRA=Читра — одно из четырёх быстрых и благих созвездий, мягкое и нежное по природе: брак, украшения, любовь и тому подобное идут хорошо. Его природа связана с повторением.
reading.Mansion.CITRA.planet=Сатурн
reading.Mansion.CITRA.foods=фрукты
reading.Mansion.SVATI=Свати — одно из пяти быстрых и переменчивых созвездий, мимолётное по природе: временные дела идут хорошо. Его природа связана со свершением.
reading.Mansion.SVATI.planet=Солнце
reading.Mansion.SVATI.foods=мука, кунжутный суп и непальский дал
reading.Mansion.VISHAKHA=Вишакха — одно из двух нейтральных созвездий, уравновешенное и смешанное по природе: смешанные дела идут хорошо. Его природа связана с врагами.
reading.Mansion.VISHAKHA.planet=Луна
reading.Mansion.VISHAKHA.foods=кунжут, цветы и индийский дал
reading.Mansion.ANURADHA=Анурадха — одно из четырёх быстрых и благих созвездий, мягкое и нежное по природе: любовь, дружба, украшения и брак идут хорошо. Его природа связана с повторением.
reading.Mansion.ANURADHA.planet=Марс
reading.Mansion.ANURADHA.foods=алкоголь, мелкие бобовые и мёд
reading.Mansion.JYESHTHA=Джьештха — одно из четырёх созвездий дурного плода, ужасное по природе: заклинания, нападения и тому подобное идут хорошо. Его природа связана с путником.
reading.Mansion.JYESHTHA.planet=Меркурий
reading.Mansion.JYESHTHA.foods=красный рис и рисовый суп
reading.Mansion.MULA=Мула — одно из четырёх созвездий дурного плода, ужасное по природе: заклинания, нападения и тому подобное идут хорошо. Его природа связана с осквернением.
reading.Mansion.MULA.planet=Юпитер
reading.Mansion.MULA.foods=молоко и другое
reading.Mansion.PURVASHADHA=Пурвашадха — одно из четырёх устойчивых и свершающих созвездий, суровое по природе: разрушение, обман и тому подобное идут хорошо. Его природа связана с удачей.
reading.Mansion.PURVASHADHA.planet=Венера
reading.Mansion.PURVASHADHA.foods=баньян
reading.Mansion.UTTARASHADHA=Уттарашадха — одно из четырёх очень устойчивых созвездий, постоянное по природе: коронации, сев и другие долговечные дела идут хорошо. Его природа связана со свершением.
reading.Mansion.UTTARASHADHA.planet=Сатурн
reading.Mansion.UTTARASHADHA.foods=мёд и зайчатина
reading.Mansion.SHRAVANA=Шравана — одно из пяти быстрых и переменчивых созвездий, мимолётное по природе: временные дела идут хорошо. Его природа связана с повторением.
reading.Mansion.SHRAVANA.planet=Солнце
reading.Mansion.SHRAVANA.foods=свежее масло и птичье мясо
reading.Mansion.DHANISHTHA=Дхаништха — одно из пяти быстрых и переменчивых созвездий, мимолётное по природе: временные дела идут хорошо. Его природа связана с путником.
reading.Mansion.DHANISHTHA.planet=Марс
reading.Mansion.DHANISHTHA.foods=индийский дал и мышиное мясо
reading.Mansion.SHATABHISHAJ=Шатабхиша — одно из четырёх очень устойчивых созвездий: занятие новых земель, назначение новых начальников, обряды великой устойчивости, сады и рощи и строительство идут хорошо. Его природа связана с удачей.
reading.Mansion.SHATABHISHAJ.planet=Меркурий
reading.Mansion.SHATABHISHAJ.foods=козлятина
reading.Mansion.PURVABHADRAPADA=Пурвабхадрапада — одно из четырёх устойчивых и свершающих созвездий, суровое по природе: разрушение, обман и тому подобное идут хорошо. Его природа связана со смертью.
reading.Mansion.PURVABHADRAPADA.planet=Юпитер
reading.Mansion.PURVABHADRAPADA.foods=баранина с кровью
reading.Mansion.UTTARABHADRAPADA=Уттарабхадрапада — одно из четырёх быстрых и благих созвездий: украшения, игры, полевые работы и всякое быстрое дело идут хорошо. Его природа связана со смертью.
reading.Mansion.UTTARABHADRAPADA.planet=Венера
reading.Mansion.UTTARABHADRAPADA.foods=непальский дал
reading.Mansion.REVATI=Ревати — одно из четырёх неустойчивых и переменчивых созвездий: обряды подношения, проповедь дхармы, дарование обетов, прошения и дары старшим и быстрые собственные цели идут хорошо. Его природа связана со свершением.
reading.Mansion.REVATI.planet=Сатурн
reading.Mansion.REVATI.foods=фарш
reading.EarthLord={0} Этот расчёт — для умерших, и учёные толкователи применяют его только к похоронам; для других дел действуют собственные плоды животного дня.
reading.EarthLord.MOUSE=Владыка земли сидит в кувшине с пивом: цедить пиво для умершего — к худу для пивовара и детей.
reading.EarthLord.MOUSE.remedy=разбросать в подношение первое от сусла и закрыть кувшин
reading.EarthLord.MOUSE.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в северной части дома; бог очага в переулке (སྲང, srang), гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.MOUSE.death=повторится трижды, как свидетельствует Гньен-тха (གཉན་ཁྲ, gnyan khra); тело, отправленное на нижний север, приносит вред
reading.EarthLord.OX=Владыка земли сидит в амбаре: брать из него ячмень для умершего — к худу для берущего и для мерщика.
reading.EarthLord.OX.remedy=разбросать первое зерно на четыре стороны и брать через пробитое в амбаре отверстие
reading.EarthLord.OX.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в северо-восточной части дома; бог очага под очагом, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.OX.death=повторится, как свидетельствует Гньен-джанг (གཉན་ལྗང, gnyan ljang); могилу не рыть, поминального сбора избегать
reading.EarthLord.TIGER=Владыка земли сидит в двери: выносить через неё тело — к худу для хозяина дома.
reading.EarthLord.TIGER.remedy=выносить тело через крышу или пролом
reading.EarthLord.TIGER.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в восточной части дома, на верхнем востоке; бог очага на юге, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.TIGER.death=свидетельствует белая гаруда: не сжигать тело, путь тела — не на верхний восток
reading.EarthLord.RABBIT=Владыка земли сидит в дверном засове: если носильщик тела возьмётся за него — к худу для сыновей, внуков и дочерей.
reading.EarthLord.RABBIT.remedy=носильщику не касаться засова, или вынуть засов заранее
reading.EarthLord.RABBIT.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в восточной части дома; бог очага на востоке, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.RABBIT.death=свидетельствует земная черепаха: погребальный путь — не на нижний восток
reading.EarthLord.DRAGON=Владыка земли сидит в мельнице: если молоть на ней цампу (རྩམ་པ, rtsam pa) для умершего, умрут мельник и дядя по матери.
reading.EarthLord.DRAGON.remedy=открыть мельницу и разбросать муку из её середины
reading.EarthLord.DRAGON.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в юго-восточной части дома; бог очага на западе, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.DRAGON.death=свидетельствует Гньен-тха-бадэн (གཉན་ཁྲ་བ་དན, gnyan khra ba dan): не голосить в трауре, путь тела — не на юго-восток
reading.EarthLord.SNAKE=Владыка земли сидит в верёвке: если тащить тело верёвкой, умрёт носильщик.
reading.EarthLord.SNAKE.remedy=разрезать верёвку на три части, связать снова, чтобы нести, и разрезать вновь там, где начинается дорога
reading.EarthLord.SNAKE.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в южной части дома; бог очага на севере, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.SNAKE.death=свидетельствует Цанг-кюн (ཙང་ཀུན, tsang kun): избегать забоя и погребальной двери на верхний юг, а тело нести большой дорогой
reading.EarthLord.HORSE=Владыка земли сидит в седле: тело, положенное на седло, — к худу для коня.
reading.EarthLord.HORSE.death=повторится, как свидетельствует Чи-лам (བྱི་ལམ, byi lam); вестник, несущий весть, идёт без коня, а двери для выноса тела и езды верхом избегают
reading.EarthLord.HORSE.remedy=везти тело без седла
reading.EarthLord.HORSE.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в южной части дома; бог очага на востоке, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.SHEEP=Владыка земли сидит в корыте: месить в нём тесто для умершего — к худу для месящего.
reading.EarthLord.SHEEP.remedy=месить в медном сосуде или на ткани и поставить на месте смерти человеческую фигуру из теста
reading.EarthLord.SHEEP.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в юго-западной части дома; бог очага на западе, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.SHEEP.death=повторится, как свидетельствует Бе-на (བེ་སྣ, be sna); если вскрыть землю, умрут семеро; к худу для умерших и могил; тело и погребальная дверь — не на юго-запад
reading.EarthLord.MONKEY=Владыка земли сидит в ноже и топоре: кто рубит ими мясо, умрёт.
reading.EarthLord.MONKEY.remedy=провести ножи и топоры через огонь
reading.EarthLord.MONKEY.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в западной части дома; бог очага на севере, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.MONKEY.death=свидетельствует Зиг-джуг (གཟིག་མཇུག, gzig mjug): не собираться на похороны, погребальный путь — не на верхний запад
reading.EarthLord.BIRD=Владыка земли сидит в тарелках: подавать пищу для умершего на тарелках — к худу для хозяина или к внезапной беде.
reading.EarthLord.BIRD.remedy=взять плоские камни или положить тесто на войлок
reading.EarthLord.BIRD.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в западной части дома; бог очага на западе, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.BIRD.death=свидетельствует Хетон-гьялпо (ཧེ་ཐོན་རྒྱལ་པོ, he thon rgyal po): поминальный пир — к худу для богатства, тело — не на нижний запад
reading.EarthLord.DOG=Владыка земли сидит в притолоке и пороге: тело, коснувшееся порога, — к худу для носильщика-отца, или умрёт сам носильщик.
reading.EarthLord.DOG.remedy=обмотать порог тканью и не пить поминального пива
reading.EarthLord.DOG.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в северо-западной части дома; бог очага на севере, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.DOG.death=повторится на чужбине, как свидетельствует Тхе-кхьим (ཐེ་ཁྱིམ, the khyim); погребальный путь — не на северо-запад
reading.EarthLord.PIG=Владыка земли сидит в мотыге: если копать могильную яму киркой, умрут бабушка и тот, кто вскрывает землю; то же — при строительстве.
reading.EarthLord.PIG.remedy=вскрывать землю костью
reading.EarthLord.PIG.spirits=Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), владыка земли, в северной части дома; бог очага на юге, гневающийся на работу там, а больше всего на тело умершего
reading.EarthLord.PIG.death=свидетельствует Гньен-бе (གཉན་བེ, gnyan be): не носить траур, путь тела — не на верхний север
reading.BlaMkhyen=Дух-астролог (བླ་མཁྱེན, bla mkhyen) дня пребывает там, где стоят «семь красных» мева (སྨེ་བ, sme ba) этого дня, сегодня: {0}. Дела в его сторону идут плохо, как говорят о нём правила года. Он гневается на астрологов, на главу дома и на учителей ваджры.
reading.BlaMkhyen.also_called=Сева Лакхьен (སེ་བ་བླ་མཁྱེན, se ba bla mkhyen), астролог среди духов года, в облике монаха, красно-жёлтый, с волшебным зеркалом в руке
reading.BlaMkhyen.remedy=если ему навредили, пошлите торму (གཏོར་མ, gtor ma) в его сторону и прочтите пять текстов: «Белый зонт из ушниши» (གཙུག་ཏོར, gtsug tor), «Восемь явлений неба и земли» (སྣང་བརྒྱད, snang brgyad), «Перечисление имён Манджушри» (མཚན་བརྗོད, mtshan brjod), «Собрание дхарани» (གཟུངས་བསྡུས, gzungs bsdus) и «Дхарани Ратнакету» (ཏོག་གཟུངས, tog gzungs); все пять есть в одном печатном «Собрании дхарани»

# Readings: yogas (the White Beryl, pp. 347–349): the short reading, the gist of the longer verse, the avoidance verse (whole length in the paragraph, the start as a row)
reading.Yoga.VISHKAMBHA=Смешанная йога: она расчищает путь, и устранение препятствий идёт хорошо. Освящение, подношения богам, покаяние и совет с друзьями тоже идут хорошо.
reading.Yoga.VISHKAMBHA.avoid_start=первые три чуцо (ཆུ་ཚོད, chu tshod), 1 ч 12 мин
reading.Yoga.PRITI=Благоприятная йога дружбы со всеми: всякое дело идёт хорошо, прежде всего чистое, приятное и ради удачи. Музыка и празднество идут особенно хорошо.
reading.Yoga.AYUSHMAN=Благоприятная йога долголетия и славы: под ней обретаются известность, люди, богатство, скот, сила, драгоценности и сыновья. Дела ради заработка идут хорошо.
reading.Yoga.SAUBHAGYA=Благоприятная йога изобилия: поездки идут хорошо, украшения и драгоценности долговечны, а собранное приносит приятный плод. Под ней растут долголетие, дхарма, богатство и счастье.
reading.Yoga.SHOBHANA=Благоприятная йога, приятная всем: украшения, песни и танцы идут хорошо. Сила приходит от прежних заслуг, а добродетель и исполнение желаний растут.
reading.Yoga.ATIGANDA=Неблагоприятная йога: под ней иссякают богатство и скот. Вступление на дурной путь идёт хорошо, а доведение доброго до конца идёт плохо. Доброе поведение приносит дурной плод.
reading.Yoga.ATIGANDA.avoid_start=первые шесть чуцо (ཆུ་ཚོད, chu tshod), 2 ч 24 мин
reading.Yoga.SUKARMAN=Благоприятная йога, обеспечивающая путь к следующей жизни: устремление и вступление идут хорошо, как и дружба, одежда и поездки. Победа над вражеской силой и защита тоже идут хорошо.
reading.Yoga.DHRITI=Благоприятная йога: обретаются драгоценности и богатство, устраняются беды. Война, женщины, захват земель и крепостей, извлечение кладов и сильные, властные дела идут хорошо.
reading.Yoga.SHULA=Неблагоприятная йога: начатое приносит большой вред. Детям, учителям, украшениям и одежде она во вред. Приходят война и воры, больные умирают, а от разговоров беда.
reading.Yoga.SHULA.avoid_start=первые пять чуцо (ཆུ་ཚོད, chu tshod), 2 ч
reading.Yoga.GANDA=Неблагоприятная йога: под ней вспыхивают болезни от нагов. Утрачиваются ла, жизненный дух (བླ, bla), и срок жизни, а места власти переходят к врагам.
reading.Yoga.GANDA.avoid_start=первые шесть чуцо (ཆུ་ཚོད, chu tshod), 2 ч 24 мин
reading.Yoga.VRIDDHI=Благоприятная йога возрастания: богатство растёт, и всякое дело идёт хорошо. Враги усмирены, доброе сохранено, а дела с друзьями и близкими идут хорошо.
reading.Yoga.DHRUVA=Благоприятная йога: под ней враги всегда побеждены, и всякое желание исполняется. Она — сокровищница разума, красоты, долголетия и прекрасного голоса, слава богов и людей.
reading.Yoga.VYAGHATA=Смешанная йога: под ней вспыхивает проказа. Рождение и смерть идут плохо, как и дела с землёй, крепостями и имуществом. Учёба не удаётся, приходят ссоры и раны.
reading.Yoga.VYAGHATA.avoid_start=первые девять чуцо (ཆུ་ཚོད, chu tshod), 3 ч 36 мин
reading.Yoga.HARSHANA=Смешанная йога радости жизни: под ней растут дхарма, богатство и довольный ум. Обретаются место, опора, дорога и друзья, умножаются дом, заслуги и слава.
reading.Yoga.VAJRA=Смешанная йога: под ней исполняется всякое желание, и её образ — небесная молния. Гневные обряды против других идут хорошо, а мирные дела ради удачи идут плохо. Она несёт страх и ужас.
reading.Yoga.VAJRA.avoid_start=первые девять чуцо (ཆུ་ཚོད, chu tshod), 3 ч 36 мин
reading.Yoga.SIDDHI=Благоприятная йога: задуманное свершается. Под ней приходят слава, доброе имя, ясные способности и искусность в средствах, и победа пылает силой.
reading.Yoga.VYATIPATA=Неблагоприятная йога, которой следует избегать на всём протяжении: поездка на чужбину идёт плохо. Искусными средствами она одолевает демонов и войска. Под неё подпадают монашеское посвящение, храмы и дела богов, с несчастьями и пересудами.
reading.Yoga.VARIYAS=Благоприятная йога победы над врагами: учитель хранит дисциплину, обретается власть в дхарме и на пути. Она ведёт в город освобождения, с мудростью.
reading.Yoga.PARIGHA=Неблагоприятная йога, которой следует избегать на всём протяжении: её образ — смерть в заточении. Под ней приходят связь с марами, страх перед врагами, похищенная слава, болезни и нежданное разорение.
reading.Yoga.SHIVA=Благоприятная йога покоя: результат непременно достигается, и она мягка внутри и снаружи. Жизнь, богатство и род в сохранности, враги усмирены, цели достигнуты.
reading.Yoga.SIDDHA=Благоприятная йога: свершается всякое намерение. Под ней исполняются желания, жизнь и богатство, вера и устремление приносят славу, а род — сокровищница жизни.
reading.Yoga.SADHYA=Благоприятная йога: поездка по торговым делам идёт хорошо, как и всякий приход и уход. Под ней приходят красота, вера, лекарства, дхарма, богатство, счастье, прибежище и союзники.
reading.Yoga.SHUBHA=Благоприятная йога, благая по природе: пир в честь живых идёт хорошо. Всё сделанное имеет смысл, обретаются люди, богатство и счастье дхармы.
reading.Yoga.SHUKLA=Благоприятная йога: и поездка, и пребывание на месте идут хорошо. Под ней приходят светлые способности, свет, известность и слава, с неистощимым разумом.
reading.Yoga.BRAHMA=Благоприятная йога: достигается положение бога. Обретаются долголетие, слава, известность, счастье и богатство, а обряды власти и практики долголетия идут хорошо.
reading.Yoga.INDRA=Благоприятная йога: учёба идёт хорошо, желания свершаются и обретается богатство, а дела ради удачи полны смысла. Царь благосклонен, а министры находят гирлянду драгоценностей.
reading.Yoga.VAIDHRITI=Неблагоприятная йога, которой следует избегать на всём протяжении: её образ — встреча с подругой. Свита убывает, известность и власть под угрозой, слуги, дети и имущество приходят в упадок, а дела кончаются плохо.

# Readings: karaṇas (the White Beryl, pp. 349–351), where the verse says more than its list, and Viṣṭi's common remedy
reading.Karana.VISHTI=Неблагоприятная карана: суровые дела в ней идут хорошо, а добродетельные идут плохо. Её гневные обряды идут хорошо, но стороны, куда она обращена, следует избегать.
reading.Karana.VISHTI.remedy=поставьте изображение или живописный свиток (ཐང་ཀ, thang ka) Ваджрапани (ཕྱག་རྡོར, phyag rdor), прочтите «Восемь явлений неба и земли» (སྣང་བརྒྱད, snang brgyad) и совершите обряды отвращения

# Readings: lunar dates (the White Beryl, pp. 297–304): the five-fold cycle, a birth and death, the perilous dates, the place of the la (bla gnas)
reading.LunarDate.1=Первое число месяца — благой день, день радости (དགའ་བ, dga' ba): умиротворяющие обряды, ремёсла, игры и всякое светлое дело идут в этот день хорошо.
reading.LunarDate.1.also_called=Нанда
reading.LunarDate.1.la=ла, жизненный дух (བླ, bla), пребывает в большом пальце ноги; у лошадей и другого скота — в подошве ноги; там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.1.birth=дети следуют один за другим, широкая учёность
reading.LunarDate.1.death=к худу
reading.LunarDate.1.livestock=купленный сегодня, умножается в тысячу раз
reading.LunarDate.2=Второе число месяца — один из благих дней, превосходный день (བཟང་པོ, bzang po): прежде всего в этот день хорошо идут поиск друзей и посев семян.
reading.LunarDate.2.also_called=Бхадра
reading.LunarDate.2.la=ла, жизненный дух (བླ, bla), пребывает в голеностопном суставе; у лошадей и другого скота — в жире; там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.2.birth=мальчик — к добру, девочка — к худу
reading.LunarDate.2.livestock=купленный сегодня, умножается в тысячу раз
reading.LunarDate.3=Третье число месяца — благой день, победоносный день (རྒྱལ་བ, rgyal ba): война, набеги, нападение на врагов, обряды нитяного креста (མདོས, mdos), торма (གཏོར་མ, gtor ma) и иные гневные обряды идут в этот день хорошо.
reading.LunarDate.3.also_called=Джая
reading.LunarDate.3.la=ла, жизненный дух (བླ, bla), пребывает в икре; у лошадей и другого скота — в дардонге (དར་གདོང, dar gdong); там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.3.birth=рождённый сегодня умирает или живёт плохо
reading.LunarDate.3.death=к добру
reading.LunarDate.3.livestock=купленный сегодня, умножается
reading.LunarDate.4=Четвёртое число месяца — пустой день (སྟོང་པ, stong pa), не из благих: в целом всякое дело, за которое берутся в этот день, идёт плохо.
reading.LunarDate.4.also_called=Рикта
reading.LunarDate.4.remedy=по обряду поднять в воздух пустой сосуд, прочесть «Поток богатства» (ནོར་རྒྱུན, nor rgyun) и закрепить залог богатства
reading.LunarDate.4.la=ла, жизненный дух (བླ, bla), пребывает в пояснице; у лошадей и другого скота — в скакательном суставе (སྲེ་ལོང, sre long); там не делают кровопускания, прижигания и иного лечения
reading.LunarDate.4.birth=мальчик — к худу для матери; следом рождаются девочки
reading.LunarDate.4.livestock=купленный сегодня, умножается
reading.LunarDate.5=Пятое число месяца — полный день (རྫོགས་པ, rdzogs pa), не из благих: в целом дела в этот день идут плохо, но постройка крепости и сокрытие клада идут хорошо.
reading.LunarDate.5.also_called=Пурна
reading.LunarDate.5.remedy=совершить обряды, умножающие славу, и прочесть «Груду благополучия» (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa)
reading.LunarDate.5.la=ла, жизненный дух (བླ, bla), пребывает в подколенной ямке; у лошадей и другого скота — в кости сера (སེ་ར, se ra); там не делают кровопускания, прижигания и иного лечения
