reading.YearPebble={0} «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) кладёт на год двадцать четыре камня: каждый из четырёх аспектов года рождения против текущего года, смещённого знака (ལོག་མེན, log men), триграммы (སྤར་ཁ, spar kha) и мева (སྨེ་བ, sme ba) этого года, сектора роста и упадка и часа, в который ведётся расчёт. Мать — три белых, друг — два белых, ребёнок — белый и чёрный, враг — два чёрных; то же стихия — один белый для земли и воды, один чёрный для дерева, огня и железа; секторы — по своему рангу. Приведено предсказание, которое текст даёт для таких камней этого аспекта.
reading.YearPebble.VITALITY.W3=Три белых на жизненной силе: древо жизни растёт, возводится золотой мост из драгоценностей; добрая родня по отцу греет спину, мелкие демоны (བདུད, bdud) подавлены, впереди восходит солнце славы, а боги-защитники парят над головой, как птицы. Нет тревоги о смерти и утрате: жизненная сила крепка, как скованный железом ствол, который не пошатнёт никакой дух.
reading.YearPebble.VITALITY.W2=Два белых на жизненной силе: она встречает друга. Пища наполняет рот, зрелища — глаза, желания исполняются, заслуга на всё нужное растёт; добрые боги-защитники выходят навстречу. Колесо жизни цело, и препятствий жизни быть не может.
reading.YearPebble.VITALITY.W1=Один белый на жизненной силе: ничто не мешает жизни, которую она держит.
reading.YearPebble.VITALITY.B2=Два чёрных на жизненной силе: в году — царская кара, в месяце — войско министра; стихия встречает конец своего срока, древо жизни ломается, золотой мост рушится с основания. Над головой кружит чёрная птица демонов (བདུད, bdud), внизу кусает чёрный пёс вредоносных духов умерших, нарушивших обеты (དམ་སྲི, dam sri); снится ночлег на чужбине; есть лик ножа и темницы, и на сердце нет радости, хотя вины нет. Средства: спасать жизни обречённых, чтить могилы и подавлять их духов, обряды долгой жизни и выкуп ла, жизненного духа (བླ, bla), дхарани долгой жизни и никакого убийства.
reading.YearPebble.VITALITY.B1=Один чёрный на жизненной силе: корень древа жизни сохнет; с вершин снегов поднимается дух разорения, которого не видит гадание и не находит расчёт, и обряды не действуют. Средства: стократный выкуп ла, жизненного духа (བླ, bla), с обрядами долгой жизни, подавить духа разорения и перенести постель.
reading.YearPebble.VITALITY.WB=Белый и чёрный на жизненной силе: добрые богини и чёрные птицы демонов (བདུད, bdud) вместе играют в кости о драгоценной жизни; белое и чёрное ещё не разделены, и рты препираются. Скорее совершите обряды за себя и отвратите беду и потери.
reading.YearPebble.BODY.W3=Три белых на теле: растут сила и бодрость, впереди идут помогающие боги; нет болезни тела и печали ума. Пусть поветрия пылают, как огонь, — вы не сляжете; пусть сыплется оружие — кровь не прольётся; пусть край страдает — вам покойно и нет тяжб; ребёнок рождается мальчиком.
reading.YearPebble.BODY.W2=Два белых на теле: болезнь проходит, ум свободен от печали; горе уходит, ссоры утихают. Опора тела хороша: недугов нет.
reading.YearPebble.BODY.W1=Один белый на теле: бог его не охраняет, но и вредящего духа нет; оно стоит, как раскидистое дерево.
reading.YearPebble.BODY.B2=Два чёрных на теле: болезнь кружит вокруг, ум много страдает; постель изнашивается, лекари — постоянные гости, духам служат, как богам; болезнь затягивается. Средства: принять обеты или сменить облик, хранить обеты и носить защиту, чинить дороги, делать глиняные обетные изображения (ཚ་ཚ, tsha tsha), обновлять облачение ступ и подносить светильники.
reading.YearPebble.BODY.B1=Один чёрный на теле: его стихия слабеет; приходят болезнь и острое страдание; половина запасов уходит духам, половина пищи — на лекарства; плоть, кости и кожа неспокойны, ум мятется. Средства: сменить облик и имя, подавать и подносить, хранить обеты и усердно совершать обряды, укрепляющие тело.
reading.YearPebble.BODY.WB=Белый и чёрный на теле: боги и иные духи спорят о нём, как в кости; могут прийти страх и испуг, доброе и дурное ещё не разделены. Смените облик и носите защиту; для женщины это знак родов, которые она перенесёт.
reading.YearPebble.DESTINY.W3=Три белых на могуществе: в его ограду падает нектар; плоды желаний зреют, урожай и скот хороши, доход велик и торговля прибыльна; на золотой земле бирюзовые ростки дают плоды, нисходит благоденствие богов и духов, вы обретаете поле, дом и землю. Богатство прибывает, как молоко через край белой медной чаши.
reading.YearPebble.DESTINY.W2=Два белых на могуществе: оно встречает друга. Урожай и скот хороши, задуманное сбывается; люди, богатство, скот и дети прибывают; находится всё нужное, желания исполняются.
reading.YearPebble.DESTINY.W1=Один белый на могуществе: ищешь снаружи — не находишь, но то, что внутри, не теряется; кладовая богача не пустеет; доход средний.
reading.YearPebble.DESTINY.B2=Два чёрных на могуществе: ограда рушится с краю, богатство утекает, кладовая пустеет; поднимается дух разорения, отнимающий богатство, вещи теряются; пища падает с тарелки, ребёнок — с колен, гибнет конь под седлом и пёс у двери; неурожай и малая прибыль в торговле. Средства: чтить монахов чистой дисциплины, подносить светильники в храмах, устроить угощение для детей, выпускать животных, чинить дороги, делать много глиняных обетных изображений (ཚ་ཚ, tsha tsha), подносить воду и раздавать милостыню.
reading.YearPebble.DESTINY.B1=Один чёрный на могуществе: его пища и богатство опрокинуты; поднимаются духи голода и утраты; скот не даёт молока, а гоблины крадут из запасов; пищи и богатства не найти, заслуга убывает. Обряды, поднимающие могущество, почитание монахов и щедрое угощение тем, кто не может отплатить.
reading.YearPebble.DESTINY.WB=Белый и чёрный на могуществе: пища и богатство переливаются через край и утекают, приходят потери; богатство зыбко, как марево в зной, — то есть, то нет, как сокровища во сне; на него нельзя положиться.
reading.YearPebble.LUCK.W3=Три белых на коне ветра: он полон, заслуга растёт; вождь удерживает своё место, жрец занимает место среди богов, сила знатока мантр проявляется, а всякий человек находит место среди людей; положение выше неба, власть длиннее реки; пути удачны, слово весомо; задуманное исполняется, работе ничто не мешает.
reading.YearPebble.LUCK.W2=Два белых на коне ветра: вас не унижают, и в расцвете сил положение выше неба; в этом году мужчина побеждает в собрании, женщина обретает добрую славу; находится искомое богатство, удаётся уйти от врагов, соперников нет. Молитесь — боги помогают; совершайте обряды против врагов — они падут.
reading.YearPebble.LUCK.W1=Один белый на коне ветра: он как нить золота с бирюзой; нет ни врагов, ни грабителей, ни внезапных бед, ни пересудов и ссор.
reading.YearPebble.LUCK.B2=Два чёрных на коне ветра: заслуга удачи ломается, солнце могущества заходит у порога; в масле находится кость, царь зубов ломает клык, вор поднимается из сокровищницы, и запирать наружную дверь мало толку; те, кого считали родными, становятся врагами, друзья — недоброжелателями, враги являются из близких, к вашему стыду. Средства: подавлять духов вражды и отвращать врагов, строить мосты и чинить дороги, чтить монахов и поднимать коня ветра.
reading.YearPebble.LUCK.B1=Один чёрный на коне ветра: одежда носится, а счастья нет, половина пищи портится; родня, о которой заботились, становится врагом, служба не угодна господину, упрёк ламы умаляет заслугу; сотня мужчин и сотня женщин судачат о вас. Средства: чинить дороги и мосты, отвращать пересуды, подавлять духов вражды и поднимать коня ветра.
reading.YearPebble.LUCK.WB=Белый и чёрный на коне ветра: на знамени его заслуги белое и чёрное играют в кости; великие милостивы, но поднимаются дурные; сотня мужчин говорит, но к одному концу; вас не слушают и не дают высокого места, удар может прийти от своей родни. Держитесь подальше от врагов и читайте защитные дхарани.
reading.YearPredictive={0} Для каждого аспекта «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) считает белые и чёрные из шести его камней — «не тройки и двойки, а те, что есть», — и кладёт предсказательный камень туда, где их больше; если поровну, его не кладут.
reading.YearPredictive.VITALITY.WHITE=Предсказательный камень жизненной силы белый: древо жизни не ломается; нет чёрной птицы вверху и чёрного пса внизу; препятствий жизни нет, духи не цепляются, нет лика смерти и утраты.
reading.YearPredictive.BODY.WHITE=Предсказательный камень тела белый: древо тела не падает; нет лика болезни и жара; пути удачны, задуманное сбывается сразу, внезапных болезней нет.
reading.YearPredictive.DESTINY.WHITE=Предсказательный камень могущества белый: пища наполняет рот, богатство — руку, одежда покрывает спину; урожай и скот хороши, пища и богатство прибывают; даже в пустой долине найдётся своя доля пищи.
reading.YearPredictive.LUCK.WHITE=Предсказательный камень коня ветра белый: сеть удачи не падает, заслугу можно поднять; нет ни врагов, ни пересудов; беда не обрушивается, слава остаётся, и что бы вы ни делали, удаётся.
reading.YearPredictive.VITALITY.BLACK=Предсказательный камень жизненной силы чёрный: древо жизни ломается, колесо жизни распадается; вверху кружит птица, внизу кусает чёрный пёс; дурные гадания и сны, суровость к жизни и лик ножа. Средства: спасать обречённых животных, выкупать узников и строить мосты; выкупать ла, жизненного духа (བླ, bla), и призывать жизнь; облачать ступы, чинить дороги и совершать обряды, восстанавливающие ослабевшую жизненную силу.
reading.YearPredictive.BODY.BLACK=Предсказательный камень тела чёрный: древо тела падает; приходит болезнь, вечера и утра безрадостны; одна нога на сухом, другая в мокром; хочешь остаться — тянет уйти, болезнь затягивается. Средства: пригласить общину для наставления, носить одежду матери, сменить имя, соблюдать пост и совершать обряды при ослабевшем теле.
reading.YearPredictive.DESTINY.BLACK=Предсказательный камень могущества чёрный: ограда его счастья рушится; плохо мужскому добру — коням и быкам, женскому — коровам и якам, детскому — козам и овцам; неурожай, неудачная торговля, потери и воры, неожиданно поднимаются враги. Средства: подавлять духов вражды и остерегаться ссор; призывать жизнь и благоденствие, совершать обряды, восстанавливающие могущество.
reading.YearPredictive.LUCK.BLACK=Предсказательный камень коня ветра чёрный: сеть его защиты падает, на вас обрушивается беда; близкие становятся врагами, соседи — ворами; пересуды и обвинения без вины; на вас ложится непосильная ноша или чужой долг; голова и верх тела неспокойны. Средства: глиняные обетные изображения (ཚ་ཚ, tsha tsha) и подношения воды по числу лет, изображения людей и скота, отсылаемые в сторону врага, осторожность в речах и поступках, особенно вдали от дома, и обряды, восстанавливающие коня ветра.
reading.YearPredictive.ALL_WHITE=Все четыре предсказательных камня белые: «перевал счастья пройден». Это очень плохо, если выпадает старому; молодому — потери и горе рядом.
reading.YearPredictive.ALL_BLACK=Все четыре предсказательных камня чёрные: очень плохо. Смените имя, практикуйте ради долгой жизни, получите посвящение долгой жизни и подавайте чисто, не держась ни за дающего, ни за дар, ни за принимающего.
reading.YearSector={0} У каждой стихии двенадцать секторов роста и упадка по кругу двенадцати животных: земля и вода делают вдох на змее, огонь — на свинье, железо — на тигре, дерево — на обезьяне, остальные идут по порядку. Каждый из четырёх аспектов года рождения попадает в сектор животного текущего года. «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) называет шесть добрыми и шесть дурными; «Лунные лучи» (འབྱུང་རྩིས་མན་ངག་ཟླ་བའི་འོད་ཟེར, 'Byung rtsis man ngag zla ba'i 'od zer) Лочена Дхармашри (ལོ་ཆེན་དྷརྨ་ཤྲཱི, lo chen d+har+ma shrI) ранжируют их для камней.
reading.YearSector.FLOURISHING=Расцвет: найти великое сокровище. Лучший из добрых: три белых камня.
reading.YearSector.WORKING=Труд: долговечность. Лучший из добрых: три белых камня.
reading.YearSector.DRESSING=Облачение: способность поддержать. Средний из добрых: два белых камня.
reading.YearSector.BATHING=Омовение: желания исполняются. Средний из добрых: два белых камня.
reading.YearSector.BODY_COMPLETE=Тело сложилось: наделён счастьем. Младший из добрых: один белый камень.
reading.YearSector.BIRTH=Рождение: большое богатство. Младший из добрых: один белый камень.
reading.YearSector.TAKING_BREATH=Вдох: удача исчерпана. Лучший из дурных: белый и чёрный камень.
reading.YearSector.IN_THE_WOMB=В утробе: впасть в беду. Лучший из дурных: белый и чёрный камень.
reading.YearSector.DECLINE=Упадок: разлука. Средний из дурных: один чёрный камень.
reading.YearSector.ILLNESS=Болезнь: разорение и тяжбы. Средний из дурных: один чёрный камень.
reading.YearSector.DEATH=Смерть: благоденствие утрачено. Худший: два чёрных камня.
reading.YearSector.ENTERING_THE_TOMB=Вход в могилу: род пресекается; это великая кара, а седьмой от своего — малая. Худший: два чёрных камня.
reading.LogMen={0} Смещённый знак (ལོག་མེན, log men) идёт по шестидесяти на один знак в год: у мужчины — от тигра той стихии, которую питает стихия года рождения, вперёд; у женщины — от обезьяны той стихии, что питает стихию года рождения, назад. Его стихия показывает, чьих дел он касается: дерево — отца, его братьев и деда; огонь — детей, внуков и женской линии; земля — бабушки, дома и усадьбы; железо — богатства, друзей и богов-защитников; вода — ньен (གཉན, gnyan), дорог и четырёх рубежей.
reading.LogMen.SKY_DOOR=На небесных вратах (у мужчины собака, у женщины дракон): с неба может сойти мор. Закройте небесные врата обрядом; не ставьте новую кровлю, не давайте клятв, остерегайтесь молнии и очага, не берите новую собаку, читайте сто имён Акашагарбхи и отвращающую Ушнишу.
reading.LogMen.EARTH_DOOR=На земных вратах (у мужчины свинья, у женщины змея): поднимаются духи разорения, вред приходит с низин; распространяются болезни нагов (ཀླུ, klu), проказа, язвы и нарывы. Не закладывайте фундамент и не копайте землю; читайте дхарани Кшитигарбхи, подавляйте духов разорения и закрывайте земные врата; трое людей разных родов читают «Махамаюри» тринадцать раз.
reading.LogMen.RUIN=На разорении (бык и овца): приходят тяжбы; осторожнее с торговлей на чужбине, с врагами, ворами и грабителями. Делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha), отвращайте врагов, читайте «Стотысячную», чтите богов богатства и местного бога, подавляйте духов утраты.
reading.LogMen.SEPARATION=На разлуке (птица и обезьяна): супруги могут расстаться; остерегайтесь драк, ссор и раздоров между супругами, а также болезни и темницы. Совершайте обряды против разлуки, оставьте свою мельницу открытой на три дня, получите посвящение долгой жизни и отошлите обряд нитяного креста (མདོས, mdos).
reading.LogMen.LINEAGE_CUT=На пресечении рода (мышь и конь): пересуды и беды в отцовской линии; оставьте грабёж и засады, воровство, драки, тяжбы и тайные дела, большие и малые. Читайте Ушнишу «Ваджрный коготь» и отвращающие обряды, пресекайте пересуды, подавляйте и отвращайте врагов.
reading.LogMen.GAIN=На достатке (тигр и заяц): очень хорошо. Молитесь — боги помогают; ищите — богатство находится; совершайте обряды против врагов — они падут.
reading.LogMen.NONE=Его животное для вас ни врата, ни одна из пятёрок.
reading.Harsh={0} «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) называет суровые годы для драгоценного человеческого тела: год своего животного, его седьмой, свою триаду, четвёртый вверх и четвёртый вниз, а также годы, когда смещённый знак (ལོག་མེན, log men) приходит на свой знак, на его седьмой или на врага жизненной силы. Другие требуют знаков супруга, родителей или умерших, которых в приложении нет.
reading.Harsh.OWN_YEAR.SON=Ваше животное взошло годом. Не навещайте скорбящих и не садитесь у изголовья больного, избегайте строительства; оставьте развлечения и усердствуйте в добродетели; усердно призывайте жизнь и благоденствие, чтите общину монахов и читайте «Стотысячную», «Двадцатитысячную» и Ушнишу. В 13-м году (и в 73-м), его стихия — ребёнок вашей: болезнь, и враги поднимаются против благоденствия; главное — тело и могущество. Читайте «Восемь явлений» и пять великих дхарани, поднимайте славу, отвращайте и подавляйте врагов.
reading.Harsh.OWN_YEAR.FRIEND=Ваше животное взошло годом. Не навещайте скорбящих и не садитесь у изголовья больного, избегайте строительства; оставьте развлечения и усердствуйте в добродетели; усердно призывайте жизнь и благоденствие, чтите общину монахов и читайте «Стотысячную», «Двадцатитысячную» и Ушнишу. В 25-м году, его стихия — друг вашей: препятствие возвращающегося дыхания, то хорошо, то худо; поднимаются разорение, тяжбы и духи бед. Для мужчины главное — жизненная сила, для женщины — могущество; читайте «Дхваджагру», «Ваджравидарану» и сутру Амитаюса.
reading.Harsh.OWN_YEAR.ENEMY=Ваше животное взошло годом. Не навещайте скорбящих и не садитесь у изголовья больного, избегайте строительства; оставьте развлечения и усердствуйте в добродетели; усердно призывайте жизнь и благоденствие, чтите общину монахов и читайте «Стотысячную», «Двадцатитысячную» и Ушнишу. В 37-м году, его стихия — враг вашей: препятствие отсечения демоном; у молодых — болезни и потери; главное — могущество. Читайте Праджняпарамиту и «Дхваджагру», выкупайте жизнь дхарани долгой жизни, подавляйте и изгоняйте духов утраты.
reading.Harsh.OWN_YEAR.MOTHER=Ваше животное взошло годом. Не навещайте скорбящих и не садитесь у изголовья больного, избегайте строительства; оставьте развлечения и усердствуйте в добродетели; усердно призывайте жизнь и благоденствие, чтите общину монахов и читайте «Стотысячную», «Двадцатитысячную» и Ушнишу. В 49-м году, его стихия — мать вашей: нисходит слава; торговля, друзья и доход велики; главное — конь ветра.
reading.Harsh.OWN_YEAR.IDENTITY=Ваше животное взошло годом. Не навещайте скорбящих и не садитесь у изголовья больного, избегайте строительства; оставьте развлечения и усердствуйте в добродетели; усердно призывайте жизнь и благоденствие, чтите общину монахов и читайте «Стотысячную», «Двадцатитысячную» и Ушнишу. В 61-м году, его стихия — ваша же: препятствие разлуки; приходят разлука, болезнь и страдание; для мужчины — отсечение демоном; главное — жизненная сила. Люди пяти родов читают «Стотысячную», делают глиняные обетные изображения (ཚ་ཚ, tsha tsha) и обряды против разлуки, отвращают болезнь и поднимают славу.
reading.Harsh.SEVENTH.ENEMY=Седьмое от вашего животного взошло годом — как год коня для рождённого в год мыши: суров врагами и убийцами; шевелится демон и требует выкупа. Приходят внезапные страхи и обвинения; читайте защитные дхарани, чтите богов-воителей и отвращайте врагов, чините дороги, делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) и угощайте тех, кто не может отплатить. В 7-м году (и в 67-м): убийца, отсекающий жизнь; подходит выкуп жизни с молитвами.
reading.Harsh.SEVENTH.MOTHER=Седьмое от вашего животного взошло годом — как год коня для рождённого в год мыши: суров врагами и убийцами; шевелится демон и требует выкупа. Приходят внезапные страхи и обвинения; читайте защитные дхарани, чтите богов-воителей и отвращайте врагов, чините дороги, делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) и угощайте тех, кто не может отплатить. В 19-м году (и в 79-м): обретение славы, время, когда удаются торговля и богатство.
reading.Harsh.SEVENTH.IDENTITY=Седьмое от вашего животного взошло годом — как год коня для рождённого в год мыши: суров врагами и убийцами; шевелится демон и требует выкупа. Приходят внезапные страхи и обвинения; читайте защитные дхарани, чтите богов-воителей и отвращайте врагов, чините дороги, делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) и угощайте тех, кто не может отплатить. В 31-м году: разлука; совершайте обряды против разлуки и общие средства.
reading.Harsh.SEVENTH.SON=Седьмое от вашего животного взошло годом — как год коня для рождённого в год мыши: суров врагами и убийцами; шевелится демон и требует выкупа. Приходят внезапные страхи и обвинения; читайте защитные дхарани, чтите богов-воителей и отвращайте врагов, чините дороги, делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) и угощайте тех, кто не может отплатить. В 43-м году: враг благоденствия; призывайте благоденствие и поднимайте могущество.
reading.Harsh.SEVENTH.FRIEND=Седьмое от вашего животного взошло годом — как год коня для рождённого в год мыши: суров врагами и убийцами; шевелится демон и требует выкупа. Приходят внезапные страхи и обвинения; читайте защитные дхарани, чтите богов-воителей и отвращайте врагов, чините дороги, делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) и угощайте тех, кто не может отплатить. В 55-м году: враг возвращающегося дыхания, время, когда доброе и дурное меняются местами.
reading.Harsh.TRIAD=Взошло годом одно из двух других животных вашей триады (у тигра — конь и собака и так далее), с тем же конём ветра, что и ваш: теряются богатство и питание, беда приходит со стороны матери, с пересудами, болезнями и тяжбами. Не разрушайте тёмные дома и избегайте дальних дорог; остерегайтесь убийства и скверны мёртвых; чтите мужского бога и богов-воителей, совершайте обряды, отвращающие врагов.
reading.Harsh.FOURTH_UP=Взошло годом четвёртое животное, считая вверх от вашего (бык для дракона): один из четырёх убийц, он несёт болезнь. Читайте за больных и совершайте белые обряды; отвращайте выкупом и читайте «Двадцатитысячную».
reading.Harsh.FOURTH_DOWN=Взошло годом четвёртое животное, считая вниз от вашего (овца для дракона): один из четырёх убийц, он несёт смерть. Выкупайте жизнь и отвращайте, читайте «Двадцатитысячную».
reading.Harsh.LOG_MEN_OWN=Смещённый знак пришёл на ваш знак рождения: собственное тело вас не несёт, и на вас ложится непосильная ноша.
reading.Harsh.LOG_MEN_SEVENTH=Смещённый знак стоит на седьмом от вашего знака рождения: он доходит до места перед отсекающим жизнь; плохо.
reading.Harsh.LOG_MEN_ENEMY=Стихия смещённого знака — враг вашей жизненной силы: отсечение демоном; плохо.
reading.NineMultiple={0} Девятки (དགུ་མིག, dgu mig) — 9-й, 18-й и каждый девятый год до 81-го; у мужчины их считают вверх от мыши, у женщины — от птицы, у каждой своё животное и своя триграмма (སྤར་ཁ, spar kha). Год хуже, если его знак к тому же враг, убийца или могила.
reading.NineMultiple.MALE.9=9-й (дракон, под триграммой огня (ལི, li)): небесное лекарство роняет ребёнка с колен; плохо для малых детей, великий позор юных: площадка для игр у богов пустеет.
reading.NineMultiple.MALE.18=18-й (овца, под триграммой земли (ཁོན, khon)): благоденствие убывает, ведро течёт снизу; мужчине в расцвете — ножи и колющие боли.
reading.NineMultiple.MALE.27=27-й (собака, под триграммой озера (དྭ, dwa)): гриф, привязанный к камню; могущество уносят воры; лик ножей и оружия.
reading.NineMultiple.MALE.36=36-й (бык, под триграммой неба (ཁེན, khen)): внезапный испуг и утрата богатства; у бирюзовой пчелы ломается крыло, удача убывает; приходят скверна и беды, с ликом ножей. Великий позор мужчины в расцвете: враги, и три вещи утрачены.
reading.NineMultiple.MALE.45=45-й (дракон, под триграммой воды (ཁམ, kham)): поднимается тяжёлая болезнь; лев упал в яму с водой; скверна и яд.
reading.NineMultiple.MALE.54=54-й (овца, под триграммой горы (གིན, gin)): болезнь от богов; время смерти и утраты.
reading.NineMultiple.MALE.63=63-й (собака, под триграммой грома (ཟིན, zin)): время колющих болей и закупорок; небесная ноша рвётся в узком месте. Великий позор старика: старый пёс умирает.
reading.NineMultiple.MALE.72=72-й (бык, под триграммой ветра (ཟོན, zon)): безумие и обмороки; враги, угроза войны и ножи в засаде.
reading.NineMultiple.MALE.81=81-й (дракон, под триграммой огня (ལི, li)): лик красного и крови; старые боятся поветрий; время, когда падает то, что падает с неба.
reading.NineMultiple.FEMALE.9=9-й (бык, под триграммой воды (ཁམ, kham)): рвётся нить бирюзовых чёток; пересуды, скверна, болезни и поветрия; опасность для матери и ребёнка.
reading.NineMultiple.FEMALE.18=18-й (дракон, под триграммой неба (ཁེན, khen)): клятва женщины несёт смерть ребёнку; поднимается пожирающий дух гьялпо (རྒྱལ་པོ, rgyal po); падение с коня или с кручи, оползни и ножи. Великий позор молодой женщины: высыхает источник жизни.
reading.NineMultiple.FEMALE.27=27-й (овца, под триграммой озера (དྭ, dwa)): колющие боли, беды, раздоры и скверна; женская линия прерывается, ребёнок умирает.
reading.NineMultiple.FEMALE.36=36-й (собака, под триграммой земли (ཁོན, khon)): кусает железная волчица; язвы вредят деторождению; приходит горе.
reading.NineMultiple.FEMALE.45=45-й (бык, под триграммой огня (ལི, li)): старая владычица земли былых времён доходит до узкого места: разорвите узы; ножи, оползни и выкидыш. Великий позор женщины в расцвете: белая шёлковая юбка протекает по краю.
reading.NineMultiple.FEMALE.54=54-й (дракон, под триграммой ветра (ཟོན, zon)): поветрия, пересуды, выкидыш и болезнь. Великий позор старой женщины: заходит солнце славы.
reading.NineMultiple.FEMALE.63=63-й (овца, под триграммой грома (ཟིན, zin)): паралич, болезни голода, потери; хозяйка дома может погибнуть от ножа.
reading.NineMultiple.FEMALE.72=72-й (собака, под триграммой горы (གིན, gin)): вредят владыки земли (ས་བདག, sa bdag) и порча, приходят опухоли; стихия сына падает, рождённый сын умирает.
reading.NineMultiple.FEMALE.81=81-й (бык, под триграммой воды (ཁམ, kham)): вдовство приходит к вашей двери.
reading.MewaObstacle={0} «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) называет четыре малых препятствия мева (སྨེ་བ, sme ba) вашего года жизни.
reading.MewaObstacle.HOUSE=Оно падает на мева текущего года: препятствие дома. Строительство и починка, установка ворот и притолоки под запретом; есть лик болезни: читайте «Золотой свет» и совершайте отвращающие обряды.
reading.MewaObstacle.BED=Оно падает на ваше мева рождения: препятствие ложа, кости самого мева собираются. Перенесите место сна и место родов. Рождённому под белым и падающему на белое — ссоры и опасность, нисходит собственный демон (བདུད, bdud), женщине вредит гьялпо (རྒྱལ་པོ, rgyal po); чёрное на чёрном — вредят мужские демоны; синее на синем — боги и духи насылают болезнь; зелёное на зелёном — рубка деревьев и нечистота гневят царей нагов (ཀླུ, klu); жёлтое на жёлтом — стройка тревожит ньен (གཉན, gnyan) и владык земли (ས་བདག, sa bdag); красное на красном — пересуды, мужчине лик красного, женщине выкидыш.
reading.MewaObstacle.LAND=Оно падает на два чёрных: препятствие земли, «чёрный шатёр, раскинутый над головой»: желание мертвеца грозит старому или молодому, с внезапной болезнью и испугом. Совершайте обряды своего мева.
reading.MewaObstacle.ROYAL_GATE=Оно враг вашего мева рождения или они — огонь и железо: царские врата закрыты. Берегите это направление и отошлите туда выкупное изображение — по одному на каждый год жизни.
reading.YearTrigram={0} Триграмма (སྤར་ཁ, spar kha) вашего года жизни сдвигается на одно место в год: у мужчины от триграммы огня (ལི, li) к триграмме земли (ཁོན, khon), у женщины от триграммы воды (ཁམ, kham) к триграмме неба (ཁེན, khen). «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) говорит, что под каждой запрещено и чего избегать, какие духи вредят, какие болезни, какие стороны беречь и какие средства.
reading.YearTrigram.LI=Год под триграммой огня (ལི, li): под запретом пересуды и драки, кровля дома, отправка и приём невесты, осквернение очага, сожжение покойников и обжиг глины. Вредят демоны (བདུད, bdud), наги (ཀླུ, klu), духи цен (བཙན, btsan), ма-мо (མ་མོ, ma mo) и духи гьялпо (རྒྱལ་པོ, rgyal po), а также призраки убитых ножом или конём; болезни головы и органов чувств, глаз и сердца, кровяной жар и горло, у женщины кровотечения и выкидыш. Не покупайте красного, меди и красной глиняной посуды; опасное время — осень, когда желтеет трава; берегите запад и северо-запад. Читайте Ушнишу, «Ваджравидарану» и сутру Амитаюса и отошлите нитяной крест (མདོས, mdos).
reading.YearTrigram.KHON=Год под триграммой земли (ཁོན, khon): под запретом возводить стены, закладывать фундамент, вскрывать землю и ставить наружные ворота; держитесь подальше от могил и скверны мёртвых. Вредят владыки земли (ས་བདག, sa bdag), ма-мо (མ་མོ, ma mo), демоны (བདུད, bdud), ньен (གཉན, gnyan) и наги (ཀླུ, klu); болезни селезёнки, желчи и слизи, опухоли, кожные болезни и долгие внутренние недуги. Избегайте старого скота и овец и золота с бирюзой старухи; берегите север и юго-восток. Читайте «Панчаракшу», «Кшитигарбху» и «Аватамсаку» и отошлите выкуп в виде овцы на юго-запад.
reading.YearTrigram.DWA=Год под триграммой озера (དྭ, dwa): под запретом колдовство, огненные подношения, война, ломка скал, сожжение покойников, походы в кузницу, свадьбы, драки и красные горы. Вредят духи цен (བཙན, btsan) и призраки насильственно убитых, со стрелами и ножами; колющие боли, болезни лёгких, сердца и костей, внезапные опухоли и боли в левом боку. Не покупайте железа, оружия и доспехов; остерегайтесь кузнечных орудий и полуночи; берегите восток и юг. Читайте «Нама-сангити» и дхарани долгой жизни, делайте много глиняных обетных изображений (ཚ་ཚ, tsha tsha) и отошлите выкуп в виде птицы или обезьяны на запад.
reading.YearTrigram.KHEN=Год под триграммой неба (ཁེན, khen): под запретом жечь на горах, война, опасные тропы, снос дома и кровля, погребальные обряды. Вредят духи гьялпо (རྒྱལ་པོ, rgyal po), порча, духи разорения и духи могил предков; травмы головы, укусы собак в левую ногу, падения, молния, болезни лёгких, тугоподвижность суставов и поветрия. Не торгуйте собаками и белыми конями и не ночуйте в храмах; берегите юг и восток. Читайте «Золотой свет», «Аватамсаку» и «Сутру сердца», подавляйте духов могил, ставьте ступы и глиняные обетные изображения (ཚ་ཚ, tsha tsha) и отошлите выкуп в виде собаки на северо-запад.
reading.YearTrigram.KHAM=Год под триграммой воды (ཁམ, kham): не трогайте озёра и источники ньен (གཉན, gnyan), не прокладывайте новых каналов и не переходите великих рек; не оскверняйте воду и не ходите ночью. Вредят богини озёр, наги (ཀླུ, klu) и боги, оскорблённые нечистотой; водянка, болезни почек, холодные опухоли и понос. Не носите чёрной нижней одежды, не ешьте рыбы и свинины; берегите юго-запад и северо-восток. Читайте «Сутру Великого облака» и «Золотой свет», совершайте обряды нагам, омывайтесь омовением «Видараны» и отошлите выкуп в виде мыши или свиньи на север.
reading.YearTrigram.GIN=Год под триграммой горы (གིན, gin): под запретом вредить храмам и ступам, метать зор (ཟོར, zor), ломать скалы, строить и работать в земле. Вредят владыки земли (ས་བདག, sa bdag), наги (ཀླུ, klu), порча и духи заброшенных подношений; болезни селезёнки и лимфы, проказа, язвы, нарывы и зуд, боли в правой ноге. Не торгуйте свиньями, быками и монашеским добром; остерегайтесь быков на восходе; берегите юго-восток и север. Читайте «Стотысячную» и «Махамаюри», подносите много торм (གཏོར་མ, gtor ma), делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) по числу лет и отошлите выкуп в виде быка на северо-восток.
reading.YearTrigram.ZIN=Год под триграммой грома (ཟིན, zin): не рубите деревья и не ломайте скалы ньен (གཉན, gnyan), не выносите чёрное дерево и не покупайте плотницких орудий; избегайте клятв и самострела. Вредят наги (ཀླུ, klu), голодные духи, демоны (བདུད, bdud) самоубийц и духи цен (བཙན, btsan); колющие боли, слизь, болезни печени, боли в правом боку и внезапные недуги. Не покупайте ослов и не ешьте зайчатины; остерегайтесь стрел поутру; берегите запад и северо-запад. Читайте «Гандавьюху» и покаяние в падениях, совершайте обряды нагам и водные тормы (གཏོར་མ, gtor ma), копайте пруды и колодцы и отошлите выкуп в виде тигра или зайца на восток или на запад.
reading.YearTrigram.ZON=Год под триграммой ветра (ཟོན, zon): под запретом отправка и приём невесты, клятвы, ношение золота и бирюзы и подъём знамён; остерегайтесь заразных болезней. Вредят ма-мо (མ་མོ, ma mo), духи безумия и духи гьялпо (རྒྱལ་པོ, rgyal po); поветрия, дрожь сердца и дыхания, расстройства каналов и ветров, головокружение, безумие и обмороки. Не покупайте помесей яка и мулов; берегите северо-восток и юго-запад. Читайте Ушнишу и дхарани, отвращающие поветрия, отсылайте нитяные кресты (མདོས, mdos) и водные подношения, устройте угощение для детей и отошлите выкуп в виде дракона на юго-восток.
reading.YearMewa={0} Ваше мева (སྨེ་བ, sme ba) рождения, мева года рождения, стоит в середине квадрата, и мева каждого года жизни выходит из него на восток, на одно место в год: в мужской год рождения дальше на северо-восток, в женский — на юго-восток, «будь человек мужчиной или женщиной». «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует, куда оно падает, по мева, под которым вы родились.
reading.YearMewa.N2.C3=Рождённому под двумя чёрными, падающему на три синих: теряется скот, потери пугают; вредят призраки зарезанных животных, есть опасность удара камнем. Избегайте ссор и драк, читайте «Дхваджагру» и дхарани долгой жизни.
reading.YearMewa.N2.C4=Рождённому под двумя чёрными, падающему на четыре зелёных: наги (ཀླུ, klu) вместе с демонами (བདུད, bdud) вредят от ручья или из долины. Помогают обряды покаяния и восполнения; при болезни — подношения лекарств и нитяной крест (མདོས, mdos) нагам.
reading.YearMewa.N2.C5=Рождённому под двумя чёрными, падающему на пять жёлтых: болезни жёлтой жидкости, желудка и печени от холода; старая болезнь возвращается, приходит горе. При болезни вредит дух рисованного образа или скита: сутры долгой жизни, омовение из сосуда и выкуп долгой жизни; не ссорьтесь с монахами.
reading.YearMewa.N2.C7=Рождённому под двумя чёрными, падающему на семь красных: хищные звери, удар оружия, раны и кровь; вредят вредоносные духи умерших, нарушивших обеты (དམ་སྲི, dam sri); неспокоен верх тела, рвота; прижигание полезно, кровопускание вредно. Враги и воры в засаде; совершайте обряды покаяния и восполнения.
reading.YearMewa.N2.C6=Рождённому под двумя чёрными, падающему на шесть белых: на жизнь не ложится; малые прибытки растут; при болезни — осквернение с северо-востока: покаяние и очищение.
reading.YearMewa.N2.C18=Рождённому под двумя чёрными, падающему на один белый или восемь белых: на жизнь не ложится; ссоры в доме или опасность от красного; вредит собственный дух каждого мева. Помогают нитяной крест (མདོས, mdos) нагам (ཀླུ, klu) и золотой нитяной крест.
reading.YearMewa.N2.C9=Рождённому под двумя чёрными, падающему на девять красных: мужчине — драки и враги, женщине — роды, обоим — лик красного; при болезни вредят защитники, и главное — обряды покаяния и восполнения.
reading.YearMewa.N3.C2=Рождённому под тремя синими, падающему на два чёрных: вместе вредят демоны (བདུད, bdud) и духи очага; безумие и обмороки; болезнь пугает, но не убивает; духи земли старых развалин вызывают боли в верхней части тела. Совершайте обряды против демонов.
reading.YearMewa.N3.C4=Рождённому под тремя синими, падающему на четыре зелёных: мужчину настигает страдание; при болезни — долгий недуг со стороны матери; совершайте обряды нагам (ཀླུ, klu), держитесь подальше от забоя скота и избегайте красных людей и коней с северо-востока; кровотечения из носа и рта.
reading.YearMewa.N3.C5=Рождённому под тремя синими, падающему на пять жёлтых: поднимаются желчь и ветер; горе приходит к мужчинам рода; вред с юга и востока; не ешьте пищи от пришедших оттуда.
reading.YearMewa.N3.C7=Рождённому под тремя синими, падающему на семь красных: отвращайте врагов; вредит колдовство с юга или востока; подавляйте вредоносных духов умерших (སྲི, sri); при болезни — призраки северо-востока.
reading.YearMewa.N3.C68=Рождённому под тремя синими, падающему на шесть белых или восемь белых: вредит дух дерева на юго-западе — жар сверху и понос снизу; совершайте обряды богам и подносите светильники.
reading.YearMewa.N3.C19=Рождённому под тремя синими, падающему на один белый или девять красных: дух, связанный с вредоносными духами умерших (སྲི, sri), вредит из-за двух рек, поднимаются погибшие в воде или от ножа; дайте воде выкуп (གླུད, glud) и подавите её духов; болезнь проходит за девять дней.
reading.YearMewa.N4.C2=Рождённому под четырьмя зелёными, падающему на два чёрных: вред от чёрной скалы и с востока; болезни и смерти от нагов (ཀླུ, klu); помогают обряды восполнения и отвращения.
reading.YearMewa.N4.C3=Рождённому под четырьмя зелёными, падающему на три синих: колющие боли и тугоподвижность суставов; жить трудно, хотя и не умрёшь; подносите богам и исправляйте вред водных духов; дрожь в верхней части тела.
reading.YearMewa.N4.C4=Рождённому под четырьмя зелёными, падающему на четыре зелёных: очаг осквернён на северо-востоке или вскопана земля ньен (གཉན, gnyan); смерти нет, но вредят духи нагов (ཀླུ, klu) и боги недовольны; очищайтесь и читайте «Дхваджагру».
reading.YearMewa.N4.C5=Рождённому под четырьмя зелёными, падающему на пять жёлтых: поднимаются опухоли и жар; при болезни — от очага или вскопанной земли; читайте «Дхваджагру» и «Ваджрные уста»; выздоравливают за двенадцать дней.
reading.YearMewa.N4.C7=Рождённому под четырьмя зелёными, падающему на семь красных: с юга вредят духи предков, убитых ножом, а женщине — дух умершей в родах.
reading.YearMewa.N4.C18=Рождённому под четырьмя зелёными, падающему на один белый или восемь белых: поднимаются враги; болезни сухожилий и костей; вредят наги (ཀླུ, klu) и духи гьялпо (རྒྱལ་པོ, rgyal po); дайте выкуп зерном и совершите обряды покаяния и восполнения.
reading.YearMewa.N4.C69=Рождённому под четырьмя зелёными, падающему на шесть белых или девять красных: на жизнь не ложится; при болезни вредит кислый или горький дух; помогают очищение, омовение и обряды восполнения.
reading.YearMewa.N5.C2=Рождённому под пятью жёлтыми, падающему на два чёрных: вредят дух скалы или призраки братьев матери; с севера они приходят с чёрным конём в чёрной одежде, неся пищу; отошлите на север выкуп из теста.
reading.YearMewa.N5.C3=Рождённому под пятью жёлтыми, падающему на три синих: боли в желудке, безумие и обмороки; читайте «Махамаюри» и совершайте омовение из сосуда; к женщинам приходит синее колдовство.
reading.YearMewa.N5.C4=Рождённому под пятью жёлтыми, падающему на четыре зелёных: владыки земли (ས་བདག, sa bdag) и наги (ཀླུ, klu) насылают болезнь; подавляйте владык земли и снимайте колдовство нагов.
reading.YearMewa.N5.C5=Рождённому под пятью жёлтыми, падающему на пять жёлтых: поветрия и обвинения; при болезни вредит дух разорённой долины и старая вдова с юго-запада; знаток мантр отвращает это тормами (གཏོར་མ, gtor ma).
reading.YearMewa.N5.C7=Рождённому под пятью жёлтыми, падающему на семь красных: воры и враги в засаде; отвращайте врагов на северо-востоке в полночь; при болезни вредят демоны (བདུད, bdud) владык.
reading.YearMewa.N5.C1689=Рождённому под пятью жёлтыми, падающему на один из трёх белых или девять красных: чтите богов, призывайте благоденствие в свои сроки и остерегайтесь нечистоты и осквернения.
reading.YearMewa.N7.C2=Рождённому под семью красными, падающему на два чёрных: рассмотрите внимательно: при болезни ньен (གཉན, gnyan) несут лик красного, есть опасность убийства.
reading.YearMewa.N7.C3=Рождённому под семью красными, падающему на три синих: испуг и внезапная беда; опасность гибели из-за коня; вредят владыки подношений, и средство — пресечь их притязания.
reading.YearMewa.N7.C4=Рождённому под семью красными, падающему на четыре зелёных: холодные болезни желудка и тугоподвижность суставов; вредит дух безумия соседей; с обрядами освобождаются за двадцать один день.
reading.YearMewa.N7.C5=Рождённому под семью красными, падающему на пять жёлтых: конечности, паралич и жёлтая жидкость; вредит дух, привязанный к сухому богатству; помогают омовение и отвращающие обряды.
reading.YearMewa.N7.C7=Рождённому под семью красными, падающему на семь красных: с красной скалистой горы вредит призрак цен (བཙན, btsan); при болезни — с юга, где кто-то убит ножом; лик крови и разлуки.
reading.YearMewa.N7.C1689=Рождённому под семью красными, падающему на один из трёх белых или девять красных: богатство тратится и снова прибывает; остерегайтесь нечистоты; болезнь легко пережить; подносите нагам (ཀླུ, klu).
reading.YearMewa.NW.C2=Рождённому под одним из трёх белых, падающему на два чёрных: встреча с чёрным человеком, ведущим чёрного пса, с юго-востока; совершайте обряды духам гьялпо (རྒྱལ་པོ, rgyal po); болезнь не убивает, но берегитесь восемнадцать дней.
reading.YearMewa.NW.C3=Рождённому под одним из трёх белых, падающему на три синих: вредят ньен (གཉན, gnyan) и духи гьялпо (རྒྱལ་པོ, rgyal po) юго-запада, с юго-запада поднимается опасность от красного; исправляйте вред нагов (ཀླུ, klu), ньен и гьялпо.
reading.YearMewa.NW.C4=Рождённому под одним из трёх белых, падающему на четыре зелёных: болезнь лёгких изнутри; вредят духи гьялпо (རྒྱལ་པོ, rgyal po) и боги-воители; вредит колдовство — снимите его и оставьте вражду.
reading.YearMewa.NW.C5=Рождённому под одним из трёх белых, падающему на пять жёлтых: оспа и боли в суставах; вредит дух востока; нитяной крест (མདོས, mdos) для ма-мо (མ་མོ, ma mo) спасает за три дня.
reading.YearMewa.NW.C7=Рождённому под одним из трёх белых, падающему на семь красных: красный очаг: избегайте гончарства, огненных подношений и кузницы; вредят призраки убитой дичи; выздоравливают за девять или десять дней.
reading.YearMewa.NW.C168=Рождённому под одним из трёх белых, падающему на один из трёх белых: хорошо; при болезни вредит старуха в серой одежде из близкой родни, и причиной становится пища.
reading.YearMewa.NW.C9=Рождённому под одним из трёх белых, падающему на девять красных: встречаются пища и богатство; избегайте нечистоты и осквернения; при болезни совершайте нитяной крест восполнения для ма-мо (མ་མོ, ma mo).
reading.YearMewa.N9.C2=Рождённому под девятью красными, падающему на два чёрных: встречаются дурные знамения; поднимаются поветрия и вредоносные духи умерших (སྲི, sri); отвращайте их и исправляйте вред огня, ножей и владык подношений.
reading.YearMewa.N9.C3=Рождённому под девятью красными, падающему на три синих: сброшен конём, поражает стрела врага; приходят потери; натяните нить и призывайте благоденствие.
reading.YearMewa.N9.C4=Рождённому под девятью красными, падающему на четыре зелёных: болезни лёгких, слизи и желчи от ссор; главное — снять колдовство.
reading.YearMewa.N9.C5=Рождённому под девятью красными, падающему на пять жёлтых: долгая болезнь, оспа, язвы и зуд; поражает трупная скверна; очищайтесь и совершайте омовение.
reading.YearMewa.N9.C7=Рождённому под девятью красными, падающему на семь красных: шевелятся защитники; отошлите выкуп (གླུད, glud) на юго-запад; при болезни лик крови и призраки насильственно убитых; исправляйте их вред.
reading.YearMewa.N9.C168=Рождённому под девятью красными, падающему на один из трёх белых: желания исполняются; на чужбине удачно; при болезни — обряды покаяния и восполнения; выздоравливают за девять или тринадцать дней.
reading.YearMewa.N9.C9=Рождённому под девятью красными, падающему на девять красных: лик очага, и всё же желания сбываются.
HarshYear.LOG_MEN_TOMB=смещённый знак на могиле
HarshYear.COMBINED_NINE=составная девятка
HarshYear.NINE_TOMB=девятка встречает могилу
HarshYear.TRIGRAM_NINE=девятка триграммы
HarshYear.MEWA_NINE=девятка мева
HarshYear.TOMB_OWN_GREAT=ваша большая могила
HarshYear.TOMB_OWN_SMALL=ваша малая могила
HarshYear.TOMB_SLAYER_GREAT=большая могила убийцы
HarshYear.TOMB_SLAYER_SMALL=малая могила убийцы
HarshYear.BLACK_UNDERTAKER=чёрный могильщик
HarshYear.TOMB_SIGN=знак могилы
SmeBaObstacle.SKY_DOOR=небесные врата мева
SmeBaObstacle.EARTH_DOOR=земные врата мева
reading.YearDecline.VITALITY={0} Жизненная сила в одном из дурных секторов, в упадке: смерти приходят по две и потери по две. Вытягивайте жизнь, оставьте отнятие жизни, выкупайте смерть и ла, жизненного духа (བླ, bla), обрядами долгой жизни и благоденствия.
reading.YearDecline.BODY={0} Тело в одном из дурных секторов, в упадке: могут прийти горе, раны и тугоподвижность суставов. Отошлите собачью тушу как изображение в благоприятную сторону.
reading.YearDecline.DESTINY={0} Могущество в одном из дурных секторов, в упадке: теряется богатство, гибнет конь под седлом, детей трудно вырастить, приходят враги, грабители и воры. Подавляйте духов утраты и вражды и угощайте тех, кто не может отплатить.
reading.YearDecline.LUCK={0} Конь ветра в одном из дурных секторов, в упадке: обвинения без вины и внезапные удары на высоком месте и на низком. Чините дороги и узкие тропы, делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) и подавляйте духов вражды.
reading.Harsh.COMBINED_NINE.EARTH.1=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для земли и воды, первая: бьют демоны (བདུད, bdud); совершите обряд, отворачивающий лик демонов.
reading.Harsh.COMBINED_NINE.EARTH.2=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для земли и воды, вторая: время внезапного испуга; поднесите сто долей мяса и сто долей теста.
reading.Harsh.COMBINED_NINE.EARTH.3=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для земли и воды, третья: бирюзовый слон бесится, к окружающим приходят поветрия; очистительные омовения и Ушниша.
reading.Harsh.COMBINED_NINE.EARTH.4=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для земли и воды, четвёртая: голубая бирюзовая скала трескается; мужчине — лик врагов и воров; отвращайте, сокрушайте и подавляйте врагов, с дхарани и множеством глиняных обетных изображений (ཚ་ཚ, tsha tsha).
reading.Harsh.COMBINED_NINE.EARTH.5=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для земли и воды, пятая: золотое дерево падает — плохо старшим отцовской линии; выкупайте ла, жизненного духа (བླ, bla), читайте сутры долгой жизни и выкупайте жизнь.
reading.Harsh.COMBINED_NINE.WOOD.1=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для дерева, первая: птица садится на острие копья, мужчина попадает в руки врагов; отвращайте, сокрушайте и подавляйте врагов.
reading.Harsh.COMBINED_NINE.WOOD.2=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для дерева, вторая: два демона (བདུད, bdud) и два человека бьются — плохо для близких; отвращайте беду от демонов.
reading.Harsh.COMBINED_NINE.WOOD.3=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для дерева, третья: стрела ломается посередине — сурово для сыновей, внуков и учителей; дайте выкуп (གླུད, glud) и почтите общину монахов.
reading.Harsh.COMBINED_NINE.WOOD.4=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для дерева, четвёртая: стрела уходит под землю, поднимаются владыки земли (ས་བདག, sa bdag) и земляные духи — плохо для ламы и отцовской родни; водные тормы (གཏོར་མ, gtor ma) и «Золотой свет».
reading.Harsh.COMBINED_NINE.WOOD.5=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для дерева, пятая: гриф падает на равнину — время пересудов и толков; изгоняйте гоблинов и подавляйте пересуды.
reading.Harsh.COMBINED_NINE.FIRE.1=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для огня, первая: демоны (བདུད, bdud) насылают беду и бросают камень мёртвых — плохо тому, на кого он падёт; отвращайте демонов, отошлите нитяной крест (མདོས, mdos) с зор (ཟོར, zor) и читайте «Аватамсаку».
reading.Harsh.COMBINED_NINE.FIRE.2=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для огня, вторая: вредит колдовство жрецов, приходит внезапная тяжёлая болезнь; стократный обряд, сто долей мяса и теста.
reading.Harsh.COMBINED_NINE.FIRE.3=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для огня, третья: ребёнок падает с колен, малые дети тяжело болеют; дайте малый выкуп (གླུད, glud) и подавите духов.
reading.Harsh.COMBINED_NINE.FIRE.4=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для огня, четвёртая: встреча с врагами, лик тяжб; отвращайте врагов и подавляйте их духов.
reading.Harsh.COMBINED_NINE.FIRE.5=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для огня, пятая: стрела жизни ломается в сочленении — тяжёлая болезнь и много пересудов; читайте «Дхваджагру» и призывайте долгую жизнь и благоденствие.
reading.Harsh.COMBINED_NINE.IRON.1=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для железа, первая: золото выходит из-под земли, но богатство может опустеть; призывайте благоденствие, подавляйте духов утраты и устройте угощение для детей.
reading.Harsh.COMBINED_NINE.IRON.2=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для железа, вторая: непосильная ноша, большие тяжбы и откуп от врагов; сильные отвращающие обряды с тормами (གཏོར་མ, gtor ma).
reading.Harsh.COMBINED_NINE.IRON.3=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для железа, третья: золотое ярмо ломается, великие люди встают врагами; изгоняйте беду и совершите обряд мужского бога.
reading.Harsh.COMBINED_NINE.IRON.4=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для железа, четвёртая: бьёт аркан демонов (བདུད, bdud), суровое время для окружающих; отвращающие тормы (གཏོར་མ, gtor ma).
reading.Harsh.COMBINED_NINE.IRON.5=Составная девятка: если считать вверх от ключа каждой стихии (земля и вода — от деревянной мыши, дерево — от огненного зайца, огонь — от железного коня, железо — от водяной птицы), каждый аспект года рождения доходит до своей могилы в 9-й, 21-й, 33-й, 45-й, 57-й, 69-й и 81-й годы, и «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует каждую по её стихии; 6-я и 7-я читаются как 1-я и 2-я. Для железа, пятая: дом могилы; смерть и утрата для вас или родни отца или матери, мало заслуги или потрясения; освобождают выкупы (གླུད, glud), нитяные кресты (མདོས, mdos) для богинь озёр и подношения воды.
reading.Harsh.NINE_TOMB=В этом году ваша девятка встречает могилу (по животному рождения и полу, с. 410): очень вредно, словно вы сами входите в могилу. Подносите тормы (གཏོར་མ, gtor ma), подношения земле и угощение всем владыкам кладбища и запечатайте устье могилы (с. 415).
reading.Harsh.TRIGRAM_NINE=Ваша триграмма года вернулась туда, откуда начала, — на триграмму огня (ལི, li) у мужчины или воды (ཁམ, kham) у женщины: девятка триграммы (с. 413). Средства от девяток (с. 414): светильники, пищевые подношения богам, глиняные обетные изображения (ཚ་ཚ, tsha tsha), Ушниша и водные тормы (གཏོར་མ, gtor ma), по девять; мужчине — стрела, женщине — веретено; девять камней, сложенных с девятью простираниями, со словами «освобождён от девятки болезни и смерти».
reading.Harsh.MEWA_NINE=Ваше мева (སྨེ་བ, sme ba) года вернулось в середину, на мева рождения: девятка мева (с. 413). Средства от девяток (с. 414): светильники, пищевые подношения богам, глиняные обетные изображения (ཚ་ཚ, tsha tsha), Ушниша и водные тормы (གཏོར་མ, gtor ma), по девять; мужчине — стрела, женщине — веретено; девять камней, сложенных с девятью простираниями, со словами «освобождён от девятки болезни и смерти».
reading.Harsh.TOMB_OWN_GREAT=Текущий год — большая могила стихии вашего года рождения, животное могилы в вашей же стихии: из восьмидесяти домов могилы — своя могила, большая (с. 412); вход в могилу — великая кара (с. 258). Средства (с. 415): вытянуть из могилы, подносить у могил и запечатать их устье, великие обряды выкупа смерти.
reading.Harsh.TOMB_OWN_SMALL=Текущий год — малая могила стихии вашего года рождения, седьмой от большой (с. 412). Средства (с. 415): вытянуть из могилы, подносить у могил и запечатать их устье, великие обряды выкупа смерти.
reading.Harsh.TOMB_SLAYER_GREAT=Текущий год — большая могила стихии, убивающей вашу: животное могилы в этой стихии (с. 412). Средства (с. 415): вытянуть из могилы, подносить у могил и запечатать их устье, великие обряды выкупа смерти.
reading.Harsh.TOMB_SLAYER_SMALL=Текущий год — малая могила стихии, убивающей вашу, седьмой от её большой (с. 412). Средства (с. 415): вытянуть из могилы, подносить у могил и запечатать их устье, великие обряды выкупа смерти.
reading.Harsh.BLACK_UNDERTAKER=Ваша большая могила — один из четырёх чёрных могильщиков: водяной дракон, деревянная овца, огненная собака и железный бык; когда могила своей стихии восходит одним из них, это плохо (с. 412).
reading.Harsh.LOG_MEN_TOMB=Ваш смещённый знак (ལོག་མེན, log men) стоит на одном из четырёх ваших годов могилы: немного плохо (с. 412).
reading.Harsh.TOMB_SIGN=Ваша триграмма года стоит на триграмме могилы вашей жизненной силы: для дерева — триграмма земли (ཁོན, khon), для огня — неба (ཁེན, khen), для железа — горы (གིན, gin), для земли и воды — ветра (ཟོན, zon); вы попадаете в знак могилы (с. 415). Средства: вытянуть из знака могилы, подносить у могил и запечатать их устье, обряд трёх костей и великие обряды выкупа смерти.
reading.MewaObstacle.SKY_DOOR=Оно падает на небесные врата мева: шесть белых у мужчины, один белый у женщины (с. 409). «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует небесные врата при смещённом знаке (с. 387): с неба может сойти мор; закройте небесные врата обрядом, не давайте клятв, остерегайтесь молнии и очага.
reading.MewaObstacle.EARTH_DOOR=Оно падает на земные врата мева: два чёрных у мужчины, четыре зелёных у женщины (с. 409). «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) толкует земные врата при смещённом знаке (с. 387): поднимаются духи разорения, вред приходит с низин; не закладывайте фундамент, не копайте землю и закройте земные врата.
SunTermKind.DBUGS_THOB=срок дыхания
SunTermKind.KHYIM_PHO=вход в знак
SunTermKind.SGANG=средний срок
reading.SunTerm=Альманах записывает сроки солнца в ту дату, на которую они приходятся, а срок, наступивший до рассвета, — в предыдущую дату, как их рассчитывает «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) в пятнадцатой главе. У каждого срока своя мера — место истинного солнца в лунных стоянках и чуцо (ཆུ་ཚོད, chu tshod), и срок наступает, когда солнце его достигает. Солнце берётся по самому альманаху, на конец каждой лунной даты; если к концу даты оно прошло меру, чуцо избытка, умноженные, как говорит глава, на четырнадцать, вычитают в чуцо из конца даты, и срок может прийтись на предыдущий день. Время грубое, в чуцо по 24 минуты от рассвета в 5 часов. {0} «Белый берилл» оставляет открытым, какой обычай держать — нынешний или прежний, считавший сроки по среднему солнцу; приложение держит меры, которые он перечисляет. Дел для них он не называет.
reading.SunTerm.DBUGS_THOB=Срок дыхания (དབུགས་ཐོབ, dbugs thob) — первый из двух сроков каждого месяца: глава даёт по одному на каждый месяц хор, срок 3-го месяца — на 26 стоянках 28 чуцо, каждый на двенадцатую часть пути солнца позже предыдущего, с приметами времени года, например прилётом кукушки со сроком 4-го месяца.
reading.SunTerm.KHYIM_PHO=Вход в знак (ཁྱིམ་འཕོ, khyim 'pho) — переход солнца в следующий из двенадцати знаков, через каждые 2 стоянки 15 чуцо его пути; в Овна оно входит, когда круг стоянок завершён, и альманах пишет имя знака в эту дату.
reading.SunTerm.SGANG=Средний срок (སྒང, sgang) каждого месяца хор наступает чуть больше чем через стоянку после его срока дыхания: срок 3-го месяца — на 36 чуцо первой стоянки. Глава называет срок 5-го месяца летним солнцестоянием, а 11-го — зимним и считает день и ночь равными в сроки 2-го и 8-го; она добавляет, что точное солнцестояние для Тибета рассчитывается отдельно.
reading.HourEarthLords=Хозяева земли (ས་བདག, sa bdag) часа, как их даёт «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) после тех, что движутся по датам. Юдзё Нгёнмо (གཡུ་མཛོད་སྔོན་མོ, g.yu mdzod sngon mo), бог часов, с телом человека и головой тигра, пребывает снаружи, обходит налево и сидит на месте того часа, который идёт: на рассвете, в час тигра, — на месте тигра, в верхнем востоке, и так далее по кругу. Хозяева земли Кхангцек (ཁང་བརྩེགས, khang brtsegs) и Цонгён (མཚོ་སྔོན, mtsho sngon) так же держатся каждый места своего часа. При Юдзё Нгёнмо плохо отдавать или принимать невесту, обряды над телом, очаг, погребение, строить крепость и переезжать; при Кхангцеке избегают обрядов, многоэтажных домов и рядов сидений; при Цонгёне плохи невеста и работа с телом умершего. Юдзё Нгёнмо гневается на детей и на тех, кто хранит или несёт умерших; если ему навредили, средство — читать «Восемь явлений неба и земли» (སྣང་བརྒྱད, snang brgyad) и «Белый зонт Ушнишы» (གཙུག་ཏོར, gtsug tor), среди прочего, а чтобы заслонить его — поставить синее шёлковое знамя и медную лопату. Двое других гневаются на главу дома и родню по отцу; если им навредили, читают «Дхарани Ратнакету» (ཏོག་གཟུངས, tog gzungs), «Восемь явлений» и «Собрание дхарани» (གཟུངས་བསྡུས, gzungs bsdus).
reading.BlackHour=Чёрный час: как чёрные дни сводят месяц с датой, так чёрные часы сводят дату с часом — это час «четвёртого убийцы» (བཞི་གཤེད, bzhi gshed) животного даты, на три по обе стороны от него; в день мыши или коня черны часы птицы и зайца. «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) называет в нём плохим всякое важное дело: место для могилы, постройку крепости, пиры, освящение, возведение на престол, учение дхарме, взятие новой земли, невесту. Гневное дело, совпавшее с часом, достигает цели. Средство — нарисовать свастику справа от двери, а солнце и луну слева.
wording.important_works=все важные дела
Animal.TIGER.place=верхний восток
Animal.RABBIT.place=нижний восток
Animal.DRAGON.place=юго-восток
Animal.SNAKE.place=верхний юг
Animal.HORSE.place=нижний юг
Animal.SHEEP.place=юго-запад
Animal.MONKEY.place=верхний запад
Animal.BIRD.place=нижний запад
Animal.DOG.place=северо-запад
Animal.PIG.place=верхний север
Animal.MOUSE.place=нижний север
Animal.OX.place=северо-восток
reading.HourBlaMkhyen=Дух-астролог (བླ་མཁྱེན, bla mkhyen) часа, как его помещает «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): на коне ветра (ཀླུང་རྟ, klung rta) тройки часа, как годовой — на коне ветра года. «Белый берилл» называет коня ветра каждой тройки: у тигра, лошади и собаки — железная обезьяна, у свиньи, овцы и зайца — огненная змея, у мыши, дракона и обезьяны — деревянный тигр, у птицы, быка и змеи — водяная свинья, каждый на месте своего животного: обезьяна — верхний запад, змея — верхний юг, тигр — верхний восток, свинья — верхний север. Чего избегают в его сторону, кому он вредит и средство — как у годового: он гневается на астрологов, на главу дома и на учителей ваджры; если ему навредили, в его сторону посылают торму (གཏོར་མ, gtor ma) и читают пять текстов: «Белый зонт Ушнишы» (གཙུག་ཏོར, gtsug tor), «Восемь явлений неба и земли» (སྣང་བརྒྱད, snang brgyad), «Перечисление имён Манджушри» (མཚན་བརྗོད, mtshan brjod), «Собрание дхарани» (གཟུངས་བསྡུས, gzungs bsdus) и «Дхарани Ратнакету» (ཏོག་གཟུངས, tog gzungs).
reading.HourSaRgyal=Царь земли (ས་རྒྱལ, sa rgyal) часа, как его помещает «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): на «четвёртом убийце» (བཞི་གཤེད, bzhi gshed) впереди часа. «Белый берилл» считает «четвёртых убийц» животного вверх и вниз: у мыши верхний — заяц, нижний — птица; тот, что впереди, принят за верхний, через три животных, так что в час зайца он сидит на месте лошади. Избегают зрелищ, обрядов над телом и постройки крепости; если ему навредили, это плохо для главы и правителя края, а совершивший обряды над телом скоро умирает. Средства для него текст не называет, но совершают посвящение, стадии зарождения и завершения и большое собрание подношений (ཚོགས, tshogs). Другой способ, который дают некоторые, ставит его по месяцу сезона на один час и одно место — это путь Пилинг Пармы (པི་ལིང་འཕར་མ, pi ling 'phar ma), которому приложение не следует.
reading.HourHidden.MOUSE=Гньен-тха
reading.HourHidden.OX=Гньен-джанг
reading.HourHidden.TIGER=гаруда
reading.HourHidden.RABBIT=жёлтая черепаха
reading.HourHidden.DRAGON=жёлтое знамя
reading.HourHidden.SNAKE=Цанг-кюн
reading.HourHidden.HORSE=Чи-лам
reading.HourHidden.SHEEP=Бе-на-лаг-чен
reading.HourHidden.MONKEY=Зиг-джуг
reading.HourHidden.BIRD=Хетон
reading.HourHidden.DOG=Чи-дур
reading.HourHidden.PIG=Чхуг-по
reading.HourHidden=Скрытые владыки земли (གབ་པའི་ས་བདག, gab pa'i sa bdag), двенадцать, как их даёт «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) для года, месяца, дня и часа каждого животного, каждый на месте своего животного: во время мыши Гньен-тха (གཉན་ཁྲ, gnyan khra), быка — Гньен-джанг (གཉན་ལྗང, gnyan ljang), тигра — гаруда (བྱ་ཁྱུང, bya khyung), зайца — жёлтая черепаха (རུས་སྦལ་སེར་པོ, rus sbal ser po), дракона — жёлтое знамя (བ་དན་སེར་པོ, ba dan ser po), змеи — Цанг-кюн (ཙང་ཀུན, tsang kun), коня — Чи-лам (བྱི་ལམ, byi lam), овцы — Бе-на-лаг-чен (བེ་སྣ་ལག་ཆེན, be sna lag chen), обезьяны — Зиг-джуг (གཟིག་མཇུག, gzig mjug), птицы — Хетон (ཧེ་ཐོན, he thon), собаки — Чи-дур (བྱི་དུར, byi dur), свиньи — Чхуг-по (ཕྱུག་པོ, phyug po). Владыку часа считают как владыку месяца. Этого часа: {0}. Они свирепы, и тело умершего не ведут в их сторону; если кому-то из них навредили, помогают общие средства.
reading.HourGnamKhyi=Чёрный небесный пёс (གནམ་ཁྱི་ནག་པོ, gnam khyi nag po) часа, как его считает «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) для года, месяца, дня и часа одинаково по новому китайскому счёту: голова лежит на месте животного самого часа, хвост — на седьмом от него, тело по порядку обходит двенадцать мест, и приложение считает вперёд, как идут часы: 1 голова, 2 пасть, 3 горло (གྲེ་བ, gre ba) и под ним нам-дзонг (ནམ་འཛོང, nam 'dzong), 4 тро-тё (སྤྲོ་སྟོད, spro stod), 5 брюхо и срам, 6 панг-кхунг (སྤང་ཁུང, spang khung), 7 хвост, 8 зад, 9 нижняя часть спины, 10 шюль-па (ཤུལ་པ, shul pa), 11 верхняя часть спины, 12 шея. Вообще при нём плохи обряды, постройка крепостей, похороны и тела умерших, а больше всего невеста, и он гневается на всех, сильнее всего на носильщиков тел. У головы не хоронить и не трогать тело, не строить крепость и не выводить войско; невеста, взятая там, теряет мужа или вредит обоим родителям. У пасти плохи торговля и сев, и невеста умирает; у горла — выплата богатства; под горлом плохи война и изгнание, хотя желания невесты исполняются; на четвёртом месте — вести войско и смешивать яд, хотя у невесты много сыновей и это очень хорошо; у брюха невеста к худу для рода отца; у срама избегают закладки дома, и невеста становится распутной; на шестом месте плохо переносить могилу или дом, и невеста рожает тупых детей; у хвоста плохи вынос тела, война и разбой, и род невесты прерывается; у зада плохи ступы и крепости; у нижней части спины — пахота и добродетельные дела, и невеста разлучается, хотя авторитетные тексты называют это хорошим; на десятом месте плохи поиск места для могилы и большие обряды, и родители невесты умирают, хотя и это, говорят, приносит добро; у верхней части спины плохи вынос тела, крепости и хлопоты о деле, а невеста хороша; у шеи плохи крепости, ступы, постройка домов и ткачество, и невеста к худу для обеих семей. Если ему навредили, среди средств названы обряд нитяного креста (མདོས, mdos) небесного пса и «Белый зонт Ушнишы» (གཙུག་ཏོར, gtsug tor). Старый китайский счёт кладёт хвост на собственное животное месяца, а голову на седьмое; «Белый берилл» даёт новый для всех четырёх времён.
reading.HourSaRgyalOther=Царь земли (ས་རྒྱལ, sa rgyal) часа по другому способу, который даёт «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po): в каждый месяц сезона он приходит на один час и одно место — это путь Пилинг Пармы (པི་ལིང་འཕར་མ, pi ling 'phar ma). В первый месяц весны — час змеи на верхнем юге, в средний — час коня на месте обезьяны, в последний — час овцы на месте свиньи; летом — час обезьяны на месте змеи, час птицы на месте свиньи, час собаки на верхнем севере; осенью — час свиньи на месте дракона, час мыши на юго-западе, час быка на месте собаки; зимой — час тигра на нижнем востоке, час зайца на нижнем юге, час дракона на месте птицы. Сезоны считаются так, как их считает глава о владыках земли, весна — с 11-го месяца. Избегают зрелищ, обрядов над телом и постройки крепости, как и при царе земли.
