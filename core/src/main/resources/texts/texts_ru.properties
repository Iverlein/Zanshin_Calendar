reading.DateSmeBa=Мева (སྨེ་བ, sme ba) даты — одно из девяти чисел магического квадрата, у каждого свой цвет, и альманах пишет его под триграммой даты. Перечни действий называют для каждого из девяти дела хорошие и дурные. Они учитываются после всех остальных факторов дня, как дела триграммы и звена.
reading.HundredFeet.DEATH=Сегодня клыки (མཆེ་བ, mche ba) ста стоп (རྐང་བརྒྱ, rkang brgya) грозят вам смертью. Три злые планеты поражают ваше созвездие рождения, или злые планеты разом поражают его, место дела (ལས་ཀྱི་ས, las kyi sa) и Губитель (བི་ན་ཤ་ག, bi na sha ga).
reading.HundredFeet.ILLNESS=Сегодня клыки (མཆེ་བ, mche ba) двух злых планет ста стоп (རྐང་བརྒྱ, rkang brgya) поражают ваше созвездие рождения: они приносят болезнь.
reading.HundredFeet.AIMS_FAIL=Сегодня клык (མཆེ་བ, mche ba) одной злой планеты ста стоп (རྐང་བརྒྱ, rkang brgya) поражает ваше созвездие рождения: ваши цели расстраиваются.
reading.HundredFeet.EPIDEMIC=Сегодня клыки (མཆེ་བ, mche ba) трёх благих планет ста стоп (རྐང་བརྒྱ, rkang brgya) поражают ваше созвездие рождения: они приносят поветрия и потерю богатства.
reading.HundredFeet.WANT=Сегодня клыки (མཆེ་བ, mche ba) одной или двух благих планет ста стоп (རྐང་བརྒྱ, rkang brgya) поражают ваше созвездие рождения: не хватает еды и питья.
reading.Spear=«Лицом к лицу» (གདོང་ཚུགས, gdong tshugs) благой планеты падает сегодня на созвездие луны: это копьё (མདུང་སྦྱོར, mdung sbyor), его следует избегать. Пришедший враг побеждает, цели расстраиваются, ум в смятении. {0}
reading.Spear.MERCURY=При Меркурии невеста остаётся без еды и питья.
reading.Spear.JUPITER=При Юпитере богатство невесты убывает и приходит небывалое страдание.
reading.Spear.VENUS=При Венере невеста оставляет мужа и бреет голову.
reading.Spear.setting_out=на чужбину — смерть через два месяца
reading.Spear.birth=ребёнок скоро умирает
reading.GreatSpear=«Лицом к лицу» (གདོང་ཚུགས, gdong tshugs) злой планеты падает сегодня на созвездие луны: это великое копьё (མདུང་ཆེན, mdung chen), его следует избегать. Пришедший враг побеждает, цели расстраиваются, ум в смятении. {0}
reading.GreatSpear.SUN=При Солнце у невесты умирает муж.
reading.GreatSpear.MARS=При Марсе невеста бездетна или её ребёнок умирает.
reading.GreatSpear.SATURN=При Сатурне невеста доходит до продажи себя.
reading.GreatSpear.RAHU=При Раху невесту разлучают с друзьями и роднёй.
reading.GreatSpear.setting_out=на чужбину — смерть через два месяца
reading.GreatSpear.birth=ребёнок скоро умирает

# The Health screen (SPEC §10.10, ROADMAP H1; docs/sources/health.md): the day's illness rows of the date,
# weekday and link, the element's mansions, the la, the year on the seven-red, the Four Tantras' humours and seasons
reading.LunarDate.1.illness=отвечает на осквернённый очаг, срубленные деревья и поездки рано и поздно; вредят дрэмо (གྲེ་མོ, gre mo) и наги (ཀླུ, klu) вместе с духами цен (བཙན, btsan); боль в верхней части тела, болезнь глаз и пустота внутри; названный обряд — крест цен (བཙན་མདོས, btsan mdos)
reading.LunarDate.2.illness=отвечает на обиду, пищу умерших и нечистоту; вредят боги (ལྷ, lha), грэцен (གྲེ་བཙན, gre btsan) и владыки земли (ས་བདག, sa bdag); неладно с желудком и печенью, колющие боли, опухоли и шишки; почитайте ма-мо (མ་མོ, ma mo) и совершите обряды восполнения и покаяния (བསྐང་བཤགས, bskang bshags)
reading.LunarDate.3.illness=отвечает на очаг, который трогали и жгли; вредят боги (ལྷ, lha), духи гьялпо (རྒྱལ་པོ, rgyal po) и дрэво (གྲེ་བོ, gre bo); слабость, болезнь внутри, боль в почках и сухость во рту; совершите подношение санг (བསང, bsang), омовение и подношение воды и отошлите крест гьялпо (རྒྱལ་མདོས, rgyal mdos)
reading.LunarDate.4.illness=отвечает на клятву, дом траура и испорченный очаг; вредят гьенгонг (རྒྱལ་འགོང, rgyal 'gong), умершие и владыки земли (ས་བདག, sa bdag); отошлите крест гьялпо (རྒྱལ་མདོས, rgyal mdos) и крест для планет
reading.LunarDate.5.illness=отвечает на пищу из дома траура; грудь и спина горячи, горло сухо; вредят демоницы, демоны страсти и владыки земли (ས་བདག, sa bdag); совершите омовение и отошлите нитяной крест (མདོས, mdos) для ньен (གཉན, gnyan) и крест для владык земли
reading.LunarDate.6.illness=отвечает на поездку; вредят грэцен (གྲེ་བཙན, gre btsan), проклятия и защитники; колющая боль в лёгких, безумие и обмороки, рвота и жар; отошлите нитяные кресты (མདོས, mdos) цен и толпы и почитайте бога войны
reading.LunarDate.7.illness=отвечает на дурное направление и пищу из мяса и масла; боли в груди, печени и рёбрах; вредят наги (ཀླུ, klu); отошлите общий нитяной крест (མདོས, mdos), почитайте нагов и поразите дрэмо (གྲེ་མོ, gre mo)
reading.LunarDate.8.illness=болезнь глаз, боль в почках и пояснице, поднимается ветер сердца; вредят защитники храма и духи гьялпо (རྒྱལ་པོ, rgyal po); отошлите крест гьялпо (རྒྱལ་མདོས, rgyal mdos); сегодня один из четырёх опасных дней, когда плохо заболеть, собираться вместе и браться за большое или грозное дело
reading.LunarDate.9.illness=отвечает на осквернённый очаг, срубленные деревья и поездки рано и поздно; вредят дрэмо (གྲེ་མོ, gre mo) и наги (ཀླུ, klu) вместе с духами цен (བཙན, btsan); боль в верхней части тела, болезнь глаз и пустота внутри; названный обряд — крест цен (བཙན་མདོས, btsan mdos)
