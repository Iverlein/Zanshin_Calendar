# A person's own days by the birth date (WB vol. 2, pp. 330, 337–338, 346)
OwnDay.BIRTH_WEEKDAY=День недели рождения
OwnDay.OWN_WEEKDAY=Свой день недели
OwnDay.MOTHER_WEEKDAY=День недели матери
OwnDay.FRIEND_WEEKDAY=День недели друга
OwnDay.CHILD_WEEKDAY=День недели ребёнка
OwnDay.ENEMY_WEEKDAY=День недели врага
OwnDay.BIRTH_MANSION=Созвездие рождения
reading.OwnDay.BIRTH_WEEKDAY=Сегодня ваш день недели рождения (སྐྱེས་གཟའ, skyes gza'), день недели, в который вы родились: мирные и гневные дела вообще идут хорошо. Собственные дни недели и созвездия человека особенно важны.
reading.OwnDay.OWN_WEEKDAY=Сегодня ваш собственный день недели (རང་གཟའ, rang gza'), день стихии жизненной силы (སྲོག, srog) вашего года рождения: в этот день мирные и гневные дела вообще идут хорошо.
reading.OwnDay.OWN_WEEKDAY.also_called=день недели ла (བླ་གཟའ, bla gza') и день недели силы (དབང་གཟའ, dbang gza'), хотя это не всегда день недели ла животного вашего года рождения — день удачи
reading.OwnDay.MOTHER_WEEKDAY=Сегодня ваш день недели матери (མ་གཟའ, ma gza'): его стихия порождает вашу, считаемую по жизненной силе (སྲོག, srog) вашего года рождения. Это благоприятный для вас день.
reading.OwnDay.FRIEND_WEEKDAY=Сегодня ваш день недели друга (གྲོགས་གཟའ, grogs gza'): его стихию одолевает ваша, считаемая по жизненной силе (སྲོག, srog) вашего года рождения. Это благоприятный для вас день.
reading.OwnDay.CHILD_WEEKDAY=Сегодня ваш день недели ребёнка (བུ་གཟའ, bu gza'): его стихию порождает ваша, считаемая по жизненной силе (སྲོག, srog) вашего года рождения. Это средний для вас день, ни благоприятный, ни неблагоприятный.
reading.OwnDay.ENEMY_WEEKDAY=Сегодня ваш день недели врага (དགྲ་གཟའ, dgra gza'): его стихия одолевает вашу, считаемую по жизненной силе (སྲོག, srog) вашего года рождения. Это неблагоприятный день, которого следует избегать.
reading.OwnDay.BIRTH_MANSION=Сегодня Луна в вашем созвездии рождения (སྐྱེས་སྐར, skyes skar), в котором она проходила в день вашего рождения: мирные и гневные дела вообще идут хорошо.
