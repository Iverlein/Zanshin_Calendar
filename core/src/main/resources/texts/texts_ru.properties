wording.board_games=настольные игры (མིག་མངས, mig mangs)
wording.lawsuits_in_the_east_and_north=тяжбы на востоке и севере
wording.music_and_play=музыка и забавы
wording.ceremonies_of_honour=чествования
wording.treating_the_sick_and_children=лечение больных и маленьких детей
wording.elopement=побег возлюбленных
wording.caring_for_children=уход за детьми
wording.taking_in_a_child_born_out_of_wedlock=принятие внебрачного ребёнка
wording.abducting_women=похищение женщин
wording.setting_up_a_forge=устройство кузнечного горна
wording.councils_and_gatherings=советы и сборища
wording.building_a_throne=сооружение трона
wording.raising_flags=поднятие шёлковых флагов
wording.stupas=ступы
wording.making_clothes=шитьё одежды
wording.meeting_the_lama=встреча с ламой (བླ་མ, bla ma)
wording.taking_a_town=взятие города
wording.hiding_treasure=сокрытие клада
wording.punishing=наказание
wording.meeting_friends=встречи с друзьями
wording.gathering_food_and_wealth=сбор пищи и богатства
wording.gathering_wealth_and_goods=сбор богатства и имущества
