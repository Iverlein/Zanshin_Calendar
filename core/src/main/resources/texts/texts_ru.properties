reading.EarthLord.NAG_CHUNG=Малый чёрный день, Ньима Накчунг (ཉི་མ་ནག་ཆུང, nyi ma nag chung), — путь Джама Гунгьяла (བྱ་མ་གུང་རྒྱལ, bya ma gung rgyal), одного из владык земли (ས་བདག, sa bdag), которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) ведёт по датам. В три весенних месяца он приходится по порядку на 8-е, 18-е и 28-е, летом на 5-е, 15-е и 25-е, осенью на 1-е, 11-е и 21-е, зимой на 4-е, 18-е и 16-е; времена года считаются так, как их считает глава текста о владыках земли, весна с 11-го месяца; по другому мнению, зимой это 9-е, 19-е и 29-е. В этот день дурны дела ради умерших, невеста, освящение, пиры и погребальные обряды, прежде всего вынос богатства из дома. Как средство текст называет фигурки тигра, коня, овцы и собаки из теста, поставленные на юг, запад, север и восток с подношениями, или сожжённое белое масло, белую землю, рассыпанную по крыше, и красную — на четыре стороны.
reading.EarthLord.PI_LING=Пилинг Парма (པི་ལིང་འཕར་མ, pi ling 'phar ma), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) с одиннадцатью министрами, движется в одну дату и в один час каждого месяца: весной 28-го в час свиньи, 18-го в час обезьяны и 8-го в час змеи; летом 25-го в час свиньи, 15-го в час обезьяны и 5-го в час змеи; осенью 21-го в час собаки, 11-го в час овцы и 1-го в час дракона; зимой 29-го в час птицы, 19-го в час коня и 9-го в час зайца; весна считается с 11-го месяца. Хороши подавление, предметы порчи (གཏད, gtad), насылание града, метание зор (ཟོར, zor), нитяные кресты (མདོས, mdos) и торма (གཏོར་མ, gtor ma), ответный удар и грозные дела, и сделанные заодно с ним, они бьют сильно. Дурны все дела, большие и малые, прежде всего невеста, переезд, строительство, стены, освящение, ступы, дела ради умерших, возведение на престол, погребение, погребальные обряды, зрелища, пиры, мандалы и древки знамён; копать землю тогда — к смертям. Текст добавляет средства: чтение писаний, жёлтое знамя, нитяной крест для владык земли.
reading.EarthLord.ZIN_PHUNG=Зинпунг (ཟིན་ཕུང, zin phung), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), движется в дни определённых животных, по животному даты: весной в дни тигра и обезьяны с юга на север, летом в дни быка и овцы с запада на восток, осенью в дни собаки и дракона с севера на юг, зимой в дни свиньи и змеи с востока на запад; весна считается с 11-го месяца; весной в дни мыши, коня, птицы и зайца он сидит в середине. Его час меняется от месяца к месяцу, начиная с первого месяца весны: когда птицы садятся на ночлег, полночь, заря, под вечер, первое солнце на вершинах, утреннее тепло, наступление ночи, восход, утро, полдень, полночь и вечер; поворачивает он в час на четыре назад, нижний «четвёртый убийца» (བཞི་གཤེད, bzhi gshed). Пока он движется, рождённый ребёнок умирает, совет кончается дурно, невеста приносит разорение, зрелища и пиры дурны, строительство, погребальные обряды и перенос тела приносят вред, а войны и грабежа не бывать: большие дела приносят большой вред, малые — малый. Дурные средства идут заодно с ним; никогда не стоять к нему лицом. Текст добавляет средства. {0}
reading.EarthLord.ZIN_PHUNG.0=Сегодня, в весенний день тигра или обезьяны, Зинпунг движется с юга на север: избегают строительства, глиняных обетных изображений (ཚ་ཚ, tsha tsha), рисования мандал, заделывания дыр, кровли и поиска места для могилы.
reading.EarthLord.ZIN_PHUNG.1=Сегодня, в летний день быка или овцы, Зинпунг движется с запада на восток: избегают работ с землёй и водой, прудов и каналов, сева, молотьбы и колодцев.
reading.EarthLord.ZIN_PHUNG.2=Сегодня, в осенний день собаки или дракона, Зинпунг движется с севера на юг: избегают работ с землёй, того, что текст называет установкой роста (སྐྱེད་འཛུགས, skyed 'dzugs), постройки стен и разборки «ячьего дерева» (གཡག་ཤིང་དགོག, g.yag shing dgog) — два дела переданы дословно.
reading.EarthLord.ZIN_PHUNG.3=Сегодня, в зимний день свиньи или змеи, Зинпунг движется с востока на запад: избегают работ с землёй, ступ и закладки фундаментов.
reading.EarthLord.ZIN_PHUNG.middle=Сегодня, в весенний день мыши, коня, птицы или зайца, Зинпунг сидит в середине: ничего не делают.
reading.EarthLord.PHUNG_ZOR=Пунгпо Зорток (ཕུང་པོ་ཟོར་ཐོགས, phung po zor thogs), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), движется в одну дату каждого месяца: 8-го в месяцы тигра и зайца, 9-го в месяц дракона, 3-го змеи, 23-го коня, 9-го овцы, 7-го обезьяны, 17-го птицы, 8-го собаки, 1-го свиньи, 16-го мыши и 9-го быка; месяц тигра — 11-й; по другому мнению, счёт идёт по месяцам времён года. Избегают стремления к своим целям, переселения, пиров, практики, посвящения, преподавания, передачи обетов, совета, отправки вестей, первого выноса ребёнка из дома, тела умершего, невесты, могилы, войны и грабежа, зрелищ, погребальных обрядов, начала дел ради живых и умерших, уплаты долгов, добродетельных дел и строительства; хороши разрушительные мантры против других. Текст добавляет средства: человек с колчаном из тигровой шкуры и зор (ཟོར, zor), или зор, обращённый наружу или сожжённый.
reading.EarthLord.KI_KANG=Кикан (ཀི་ཀང, ki kang), общий демон стихий, дикая и грозная планета Раху, движется в месяцы тигра, коня и собаки 15-го и 28-го, в месяцы свиньи, овцы и зайца 2-го и 3-го, в месяцы мыши, дракона и обезьяны 18-го и 28-го, в месяцы птицы, быка и змеи 16-го и 26-го; месяц тигра — 11-й; «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) приводит ещё два пути. Избегают начала дел ради живых и умерших, войны, зрелищ, уплаты долгов, мирных и добродетельных дел: белые дела тогда низводят царя, невеста дурна в обе стороны, постройка скоро рушится, пир становится поминальным, рождённый ребёнок скоро умирает, болезнь не проходит. Хороши жестокие и суровые дела.
reading.EarthLord.HAL_KHYI=Халкьи Накпо (ཧལ་ཁྱི་ནག་པོ, hal khyi nag po), чёрный задыхающийся пёс, владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), ищет пищу в одну дату и в один час каждого месяца: в месяц тигра 8-го в час птицы, зайца 16-го в час коня, дракона 24-го в час тигра, змеи 9-го в час быка, коня 18-го в час свиньи, овцы 27-го в час птицы, обезьяны 10-го в час змеи, птицы 20-го в час дракона, собаки 30-го в час тигра, свиньи 11-го в час птицы, мыши 22-го в час обезьяны и быка 3-го в час зайца; месяц тигра — 11-й. Избегают невесты, строительства, зрелищ, пиров, погребальных обрядов, войны, тела умершего, отдачи и взятия собак, переезда, речей и всех добродетельных дел; хороши направление магической силы и вредоносные дела. Текст добавляет средства: целая голова собаки или овцы, увешанная шёлком, на крыше в его час, или чёрный пёс из зерна, обращённый в его сторону.
reading.EarthLord.GNAM_KHYI=Намкьи Накпо (གནམ་ཁྱི་ནག་པོ, gnam khyi nag po), чёрный небесный пёс, владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), ищет пищу в дни определённых животных, по животному даты, в определённое время: в первый месяц весны в дни дракона и овцы в утреннем тепле, в средний в дни змеи и обезьяны в полдень, в последний в дни коня и птицы на рассвете; летом в дни собаки и овцы под вечер, в дни свиньи и змеи на восходе, в дни мыши, коня и обезьяны в сумерки; осенью в дни дракона и овцы в сумерки, в дни тигра, овцы и свиньи в утреннем тепле, в дни мыши, зайца и обезьяны в полночь; зимой в дни быка, тигра и дракона под вечер, в дни тигра, дракона и собаки на закате, в дни свиньи, зайца и мыши в сумерки; весна считается с 11-го месяца; текст даёт и другой путь. Больших дел ради живых и умерших, прежде всего невесты, строительства и выноса тела, избегают так же, как при Халкьи Накпо. Текст добавляет средства.
reading.EarthLord.GNAM_SBYOR=Намджор (གནམ་སྦྱོར, gnam sbyor), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), приходится весной по порядку на 8-е, 7-е и 4-е трёх месяцев, летом на 7-е, 7-е и 26-е, осенью на 19-е, 19-е и 7-е, зимой на 16-е, 19-е и 24-е; весна считается с 11-го месяца. Дурны соединение новой пары, невеста и тело умершего; некоторые добавляют войну, зрелища и первый вынос ребёнка. Средства — те же, что при Намкьи Накпо.
reading.EarthLord.GZA_RGOD=Загё (གཟའ་རྒོད, gza' rgod), дикая планета, владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), ищет пищу в месяцы дракона и овцы 18-го, в месяцы свиньи и змеи 16-го и 22-го, в месяц коня 13-го и в месяц обезьяны 9-го и 22-го; месяц тигра — 11-й. Дурно отдавать или брать невесту; если родится ребёнок, умирает один из родителей или сам ребёнок; болезнь тогда не проходит, а вынесенное тело повторяется пять раз. Хороши нитяные кресты (མདོས, mdos), торма (གཏོར་མ, gtor ma) и грозные дела. Средство: поднять шёлк цвета дня недели и сжечь белое масло.
reading.EarthLord.DBUL_PO=Улпо Лактонг (དབུལ་པོ་ལག་སྟོང, dbul po lag stong), нищий с пустыми руками, владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), движется в месяц тигра 1-го и 11-го, зайца 2-го и 21-го, дракона 3-го и 8-го, змеи 4-го и 8-го, коня 5-го и 11-го, овцы 6-го и 22-го, обезьяны 7-го и 19-го, птицы 8-го и 10-го, собаки 22-го и 9-го, свиньи 1-го, мыши 1-го и 16-го, быка 9-го и 29-го; месяц тигра — 11-й; по мнению одного человека, в четыре месяца иначе. Пиры и раздача богатства ведут к бедности; избегают строительства, невесты, наречения ребёнка, нового учения, освящения опор, зрелищ, кровли, поднятия знамён, выноса тела, сева на полях, открытия кладовых и большинства дел ради живых и умерших. Текст добавляет средства: богатство, взятое у трёх богачей, фигурки руки и черепахи из теста, зерно торговца, отданное прочь.
reading.EarthLord.GZA_BDUN=Задюн (གཟའ་བདུན, gza' bdun), семь планет, ищущих пищу и рассылающих гонцов, владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), движется в три весенних месяца по порядку 8-го, 18-го и 28-го, летом 5-го, 15-го и 25-го, осенью 1-го, 11-го и 21-го, зимой 9-го, 19-го и 29-го; весна считается с 11-го месяца; по другому мнению, те же даты в обратном порядке. Дурны все белые дела, тело умершего, погребальные обряды, строительство, рождение ребёнка, пир в честь мальчика, невеста и первый вынос ребёнка; хороши разрушительные мантры против других. Его плоды — те же, что у Кикана (ཀི་ཀང, ki kang). Средство: читать о супруге планет и высшей планете, поднять жёлтый шёлк, рассыпать жёлтую землю.
reading.EarthLord.NGAM_SHING=Нгамшинг (ངམ་ཤིང, ngam shing), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), движется в первый месяц весны 10-го с востока на запад, в средний 20-го с востока на запад, в средний месяц лета 30-го с юга на север, в последний 12-го с востока на запад, в первый месяц осени 10-го с запада на восток, в средний 20-го с востока на запад, в средний месяц зимы 30-го с юга на север и в последний 12-го с востока на запад; весна считается с 11-го месяца. В этот день чтят духовного друга, воздвигают трон, дают новое учение, провожают и встречают настоятелей и учителей, восхваляют и чтут их; невесты не допускают. Других средств текст не даёт.
reading.EarthLord.BAR_KHYI=Баркьи (བར་ཁྱི, bar khyi), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), движется в даты Задюна (གཟའ་བདུན, gza' bdun): весной по порядку 8-го, 18-го и 28-го, летом 5-го, 15-го и 25-го, осенью 1-го, 11-го и 21-го, зимой 9-го, 19-го и 29-го; весна считается с 11-го месяца. Избегают невесты, сожжения тела, кровли, освящения, строительства, зрелищ, пиров, поднятия знамён и стремления к своим целям. Средства — те же, что при Халкьи Накпо, или деревянная дощечка с двенадцатью годами и восемью триграммами и чёрный пёс на пороге.
reading.EarthLord.KA_KHYUNG=Какьюнг Кикан (ཀ་ཁྱུང་ཀི་ཀང, ka khyung ki kang), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), движется в месяцы тигра, коня и собаки 11-го и 27-го, в месяцы свиньи, овцы и зайца 24-го, в месяцы мыши, дракона и обезьяны 28-го и в месяцы птицы, быка и змеи 26-го; месяц тигра — 11-й. Некоторые говорят, что дурны начало дел ради живых и умерших, строительство, зрелища, война, погребальные обряды, невеста и уплата мелких податей; текст говорит, что ни хороших и дурных плодов, ни средств для него не дано, но избегать следует всего, кроме грозных дел.
reading.EarthLord.DRA_CHEN=Драчен (དྲ་ཆེན, dra chen), владыка земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po), движется в месяц змеи 25-го, в месяц овцы 15-го, в месяц птицы 1-го и 21-го, в месяц собаки 21-го и в месяц свиньи 9-го; месяц тигра — 11-й. Избегают пиров, невесты, переноса тела, войны и грубых дел ради живых и умерших; средства не даны.
reading.EarthLord.SDE_BRGYAD=Восемь классов (སྡེ་བརྒྱད, sde brgyad), которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) ведёт по датам вместе с владыками земли (ས་བདག, sa bdag), наносят удар (ཐེབས, thebs) и поворачивают назад (བཟློག, bzlog) в определённые даты и часы, каждый месяц со своим классом; весна считается с 11-го месяца. В первый месяц весны они бьют 14-го в час зайца вместе с тенма (བསྟན་མ, bstan ma), с запада на восток, и 15-го тоже, а поворачивают 17-го и 19-го, в полдень и в часы обезьяны и быка; в средний месяц бьют 16-го в час свиньи с четырьмя демонами (བདུད, bdud), с востока на запад, а поворачивают 1-го, 8-го, 11-го, 21-го и 28-го; в последний — 22-го в час свиньи с демоницами (མ་བདུད, ma bdud), с юга на север, поворачивая 9-го и 30-го. В первый месяц лета бьют 8-го в час зайца с восемью великими планетами (གཟའ, gza') и поворачивают 2-го и 5-го в часы птицы и мыши; в средний — 15-го в час дракона с восемью нагами (ཀླུ, klu), с юго-запада на северо-восток, поворачивая 6-го, 16-го и 18-го в час змеи; в последний, с ма-мо (མ་མོ, ma mo), они заняты зрелищами, поворачивают 11-го в час коня и бьют один раз 9-го. В первый месяц осени бьют 15-го в час дракона, обратясь на северо-восток, и 23-го в час дракона с ма-мо, обратясь на северо-запад, а поворачивают 25-го в час быка; в средний, с созвездиями, бьют 10-го и с 17-го по 30-е, кроме 23-го, в часы зайца и мыши, с запада на восток, а поворачивают 3-го, 13-го и 23-го в час быка; в последний бьют с богами (ལྷ, lha) 8-го, 28-го и 30-го в часы коня и птицы, обратясь на северо-запад (некоторые говорят — с 8-го по 30-е), а поворачивают 1-го и 2-го в час зайца. В первый месяц зимы бьют с 13-го по 16-е с якшами (གནོད་སྦྱིན, gnod sbyin) в часы обезьяны и быка, обратясь на север, а поворачивают 8-го, 9-го, 18-го и 26-го в час мыши; в средний — 17-го и с 22-го по 30-е с воинством Ямы (གཤིན་རྗེ, gshin rje) в часы мыши и коня, на юго-восток, поворачивая 20-го в час птицы; в последний поворачивают 27-го в час собаки, а весь остальной месяц, когда солнце поднимается на копьё, бьют по толпам существ, и 29-го все восемь классов бьют вместе. Когда они бьют, хороши зор (ཟོར, zor), нитяные кресты (མདོས, mdos), предметы порчи (གཏད, gtad), война и грабёж, грозные дела и ответный удар; когда поворачивают, всего этого избегают. {0}
reading.EarthLord.SDE_BRGYAD.STRIKES=Сегодня восемь классов наносят удар.
reading.EarthLord.SDE_BRGYAD.TURNS_BACK=Сегодня восемь классов поворачивают назад.
reading.EarthLord.SA_BDAG_BZLOG=В эти даты владыки земли (ས་བདག, sa bdag) «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) поворачивают назад (བཟློག, bzlog): весной 17-го и 19-го, 1-го и 8-го, 30-го; летом 2-го и 5-го, 3-го, 11-го; осенью 25-го, 3-го, 2-го; зимой 18-го, 27-го, 14-го, месяц за месяцем; весна считается с 11-го месяца. Поход войска, насылание предметов порчи (གཏད, gtad), насылание града, вызывание дождя, вскрытие земли и обряды для нагов (ཀླུ, klu) тогда оборачиваются против начавшего: нет сына, утрата богатства, короткая жизнь и бедность. У Пуктона (སྤུག་སྟོན, spug ston) есть ещё одно мнение, с датами успеха, исчезновения и невыдачи богатства.
reading.EarthLord.GNYAN=Ньен (གཉན, gnyan), которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) ведёт по датам вместе с владыками земли (ས་བདག, sa bdag), движутся весной по порядку 8-го, 6-го и 4-го трёх месяцев, летом 7-го, 10-го и 27-го, осенью 9-го, 30-го и 27-го, зимой 19-го, 10-го и 3-го; весна считается с 11-го месяца: всё начатое тогда придётся делать заново, и это дурно, но подношения ньен хороши. По мнению Пуктона (སྤུག་སྟོན, spug ston), они наносят удар (ཐེབས, thebs) и поворачивают назад (བཟློག, bzlog): весной бьют 7-го и поворачивают 19-го, бьют 13-го и поворачивают 15-го, бьют 21-го и поворачивают 18-го; летом бьют 3-го и 23-го и поворачивают 16-го, а два следующих месяца бьют целиком; осенью бьют 9-го и поворачивают 18-го, бьют 23-го и поворачивают 30-го, бьют 7-го и поворачивают 1-го; зимой бьют 1-го и поворачивают 7-го, бьют 25-го и поворачивают 30-го, а в последний месяц поворачивают весь месяц, кроме 15-го. Текст судит о них так же, как об ударах выше. {0}
reading.EarthLord.GNYAN.MOVES=Сегодня ньен движутся.
reading.EarthLord.GNYAN.STRIKES=Сегодня ньен наносят удар.
reading.EarthLord.GNYAN.TURNS_BACK=Сегодня ньен поворачивают назад.
reading.EarthLord.KLU=Наги (ཀླུ, klu), которых «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) ведёт по датам вместе с владыками земли (ས་བདག, sa bdag), наносят удар (ཐེབས, thebs) и поворачивают назад (བཟློག, bzlog); весна считается с 11-го месяца. В первый месяц весны 5-го, 10-го и 15-го они блюдут свою дисциплину и поворачивают, а 14-го бьют; в средний бьют 10-го и, слушая дхарму, поворачивают 8-го, 20-го, 18-го, 22-го и 28-го; в последний бьют 25-го и, с помутнённой памятью, поворачивают весь месяц, кроме 2-го и 8-го. В первый месяц лета 8-го ищут пищу и 15-го идут к родне, нанося удар, а 20-го и 25-го отдыхают, поворачивая; в средний 20-го и 22-го ищут пищу среди людей, нанося удар, а поворачивают 8-го и 15-го; в последний бьют 5-го, 20-го и 25-го и поворачивают 11-го, 13-го и 15-го, хотя по некоторым учениям 15-го они бьют, делая работу царя бытия. В первый месяц осени 9-го и 19-го ищут пищу, нанося удар, а поворачивают 5-го, 6-го и 10-го; в средний 15-го собирают зерно, нанося удар, по некоторым — и 5-го, а поворачивают 3-го, 6-го, 9-го, 13-го и 16-го; в последний 1-го, 11-го, 21-го и 22-го ищут жилище и одеваются, нанося удар, по авторитетным текстам и 23-го, а поворачивают 9-го, 10-го и 19-го. В первый месяц зимы собирают соки и дерево и бьют 8-го и 18-го, по некоторым — и 15-го, а поворачивают 9-го, 10-го, 19-го и 26-го; в средний бьют 7-го и 17-го, по некоторым — 15-го и 21-го, собирая зерно, а поворачивают 2-го, 6-го, 16-го и 26-го и 20-го; в последний месяц зимы они спят и не приносят ни пользы, ни вреда. Когда они бьют, удаются торма (གཏོར་མ, gtor ma) нагам, подношения восьми нагам, вызывание дождя, предметы порчи (གཏད, gtad) и прочие дела с нагами; когда поворачивают, ничего из этого делать нельзя. {0}
reading.EarthLord.KLU.STRIKES=Сегодня наги наносят удар.
reading.EarthLord.KLU.TURNS_BACK=Сегодня наги поворачивают назад.
reading.EarthLord.CLASS_TIMES=Помимо ударов и поворотов, «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) даёт собственные времена классов, когда благоприятны дела, согласные с каждым из них, по первым, средним и последним месяцам четырёх времён года; весна считается с 11-го месяца: в первые месяцы наги (ཀླུ, klu) 7-го, 17-го и 27-го, когда восходят лучи солнца, гьялпо (རྒྱལ་པོ, rgyal po) 8-го, 18-го и 28-го на рассвете и ламо (ལམ་མོ, lam mo) 22-го в сумерки; в средние месяцы цен (བཙན, btsan) 6-го, 16-го и 26-го, когда восходят лучи солнца, и якши (གནོད་སྦྱིན, gnod sbyin) 9-го, 19-го и 29-го в полдень и в полночь; в последние месяцы демоны (བདུད, bdud) 29-го в сумерки и воинство Ямы (གཤིན་རྗེ, gshin rje) 13-го под вечер. Планеты (གཟའ, gza') и ракшасы (སྲིན་པོ, srin po) движутся в даты вишти, которые текст называет великим временем: 4-е, 8-е, 11-е, 15-е, 18-е, 22-е, 25-е и 29-е. Из каждого удара и поворота дело, сделанное при его приближении, процветает, сделанное впереди него — угасает, а сделанное после того, как он прошёл, не приносит ни пользы, ни вреда. {0}
reading.EarthLord.CLASS_TIMES.klu=Сегодня время нагов, когда восходят лучи солнца.
reading.EarthLord.CLASS_TIMES.rgyal_po=Сегодня время гьялпо, на рассвете.
reading.EarthLord.CLASS_TIMES.lam_mo=Сегодня время ламо, в сумерки.
reading.EarthLord.CLASS_TIMES.btsan=Сегодня время цен, когда восходят лучи солнца.
reading.EarthLord.CLASS_TIMES.gnod_sbyin=Сегодня время якшей, в полдень и в полночь.
reading.EarthLord.CLASS_TIMES.bdud=Сегодня время демонов, в сумерки.
reading.EarthLord.CLASS_TIMES.gshin_rje=Сегодня время воинства Ямы, под вечер.
reading.EarthLord.GNAM_SGO=У каждой даты своя небесная дверь (གནམ་སྒོ, gnam sgo), по последней цифре её числа: 1-е, 11-е и 21-е — дверь гостей, вторые — торговли, третьи — малых детей, четвёртые — войны, пятые — союзов, шестые — крепостей, седьмые — невесты, восьмые — могилы, девятые — погребальных обрядов, десятые — общая. В двери каждого дела этого дела избегают; «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) пишет её в клетке дня своего образцового альманаха и даёт каждой своё средство. Он даёт и особый счёт — с 3-го в первые месяцы времён года, со 2-го в средние и с 1-го в последние, — которому его альманах не следует. {0}
reading.EarthLord.GNAM_SGO.mgron_po=Сегодня дверь гостей: стремление к своим целям и приём гостей оставляют дом в нужде. Средство: подношения богам, сокрушение дурных толков, имя демона, придавленное собственной ручной мельницей, фигурка птицы, взмахнутая к северному небу, и чтение дхарани.
reading.EarthLord.GNAM_SGO.tshong=Сегодня дверь торговли: торговля приносит убытки без конца. Средство: фигурки, придавленные под изображением, мука торговца в башмаке под рогом яка, жареное зерно, рассыпанное в небо, чтение дхарани и взмахи книгой дхармы.
reading.EarthLord.GNAM_SGO.bu_chung=Сегодня дверь малых детей: рождение малого ребёнка, пир в его честь или первый вынос встречают препятствия. Средство: тело ребёнка в мешке, по которому бьют оружием убийцы, чтение дхарани и изгнание дурных толков.
reading.EarthLord.GNAM_SGO.dmag=Сегодня дверь войны: выведенное войско терпит поражение девять раз кряду. Средство: имя и изображение полководца, взятые в плен, сожжённый край доспеха, срезанный кончик уха жеребца, поднятые копья и знамёна и чтение дхарани.
reading.EarthLord.GNAM_SGO.gnyen=Сегодня дверь союзов: заключённый союз оборачивается ссорой, пир — убытком. Средство: петух, связанный и положенный в соль под башмак простолюдина, разговор о союзе с ничтожным человеком, чтение длинной благой дхарани и хорошая еда нищему.
reading.EarthLord.GNAM_SGO.mkhar=Сегодня дверь крепостей: постройка приносит тяжбы прежде, чем высохнет раствор. Средство: корзина, взмахнутая в небо, фигурка слепого старика из бобов с именем врага внутри, придавленная в загоне деревни или в основании стены, и чтение дхарани.
reading.EarthLord.GNAM_SGO.bag_ma=Сегодня дверь невесты: взятая невеста вдовеет снова и снова. Средство: старуха, нарядно одетая, которой дают тесто невесты и тесто нищего, дурные толки, брошенные в меру, и чтение сутры.
reading.EarthLord.GNAM_SGO.dur=Сегодня дверь могилы: погребение приносит из могилы вредоносных духов умерших (སྲི, sri), а в конце — разорение. Средство: волчий череп, взмахнутый к небу, свиной череп, спрятанный в землю, тесто и пиво в дар и чтение дхарани.
reading.EarthLord.GNAM_SGO.shid=Сегодня дверь погребальных обрядов: совершённые обряды приносят тяжбы прежде, чем высохнет дёрн. Средство: изображение чёрной ракшаси верхом на черепе, чтение дхарани чёрной богини и очищение деревни.
reading.EarthLord.GNAM_SGO.spyi=Сегодня общая дверь: что бы ни делали, всё идёт не так, прежде всего общие дела. Средство: черепа, взмахнутые на четыре стороны, и чтение дхарани.
reading.RahuSeason=Среди владык земли (ས་བདག, sa bdag), которые движутся по датам, «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) даёт собственные даты Раху, когда он ищет пищу: весной 11-е и 28-е первого месяца, 2-е среднего и 18-е последнего; летом 16-е и 22-е, 1-е и 13-е, 2-е; осенью 28-е, 16-е и 1-е; зимой 2-е и 18-е, а в последний месяц ни одной; весна считается с 11-го месяца. Избегают дел, больших и малых, ради живых и умерших, прежде всего работ с землёй и глиной; благоприятны метание зор (ཟོར, zor) и грозные дела. Средство: читать о супруге планет и показать образ Ваджрапани. {0}
reading.RahuSeason.0=В первый месяц весны Раху ищет пищу в этот день.
reading.RahuSeason.1=В средний месяц весны Раху ищет пищу в этот день.
reading.RahuSeason.2=В последний месяц весны Раху ищет пищу в этот день.
reading.RahuSeason.3=В первый месяц лета Раху ищет пищу в этот день.
reading.RahuSeason.4=В средний месяц лета Раху ищет пищу в этот день.
reading.RahuSeason.5=В последний месяц лета Раху ищет пищу в этот день.
reading.RahuSeason.6=В первый месяц осени Раху ищет пищу в этот день.
reading.RahuSeason.7=В средний месяц осени Раху ищет пищу в этот день.
reading.RahuSeason.8=В последний месяц осени Раху ищет пищу в этот день.
reading.RahuSeason.9=В первый месяц зимы Раху ищет пищу в этот день.
reading.RahuSeason.10=В средний месяц зимы Раху ищет пищу в этот день.
