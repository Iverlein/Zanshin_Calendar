# Readings: ROKUYO
reading.Rokuyo.SENSHO=Действуйте рано: утро благоприятно, после полудня — нет. Считается хорошим днём для срочных дел и тяжб.
reading.Rokuyo.TOMOBIKI=Ничья: ни одна сторона не выигрывает. Хорош для торжеств; утро и вечер благоприятны, полдень — нет. Похорон по обычаю избегают — народное поверье по созвучию с 友曳, «увести друга».
reading.Rokuyo.SENBU=Ждите спокойно и не спешите: утро неблагоприятно, после полудня — благоприятно. Споров и срочных дел лучше избегать.
reading.Rokuyo.BUTSUMETSU=Ничто не приносит плодов; худший из шести, свадеб избегают. Несмотря на название («гибель Будды»), к буддизму не относится: старое название значило «пустой».
reading.Rokuyo.TAIAN=Великий покой: успех во всём — поездки, переезд, брак, открытие лавки.
reading.Rokuyo.SHAKKO=Неблагоприятен для торжеств; благоприятен лишь час Лошади, около 11:00–13:00. Осторожнее с огнём и клинками.

# Readings: CHOKU
reading.Choku.TATSU=Очень благоприятный, хорош для всего.
reading.Choku.NOZOKU=День, чтобы отвратить дурное.
reading.Choku.MITSU=Полный день.
reading.Choku.TAIRA=Хорошее и плохое уравновешены; очень хорош для переговоров.
reading.Choku.SADAN=День, чтобы определиться.
reading.Choku.TORU=День, чтобы принимать.
reading.Choku.YABURU=День разрушения.
reading.Choku.AYAUSHI=Шаткий день.
reading.Choku.NARU=День завершения.
reading.Choku.OSAN=День сбора; обычным делам не мешает.
reading.Choku.HIRAKU=День открытия: начатое найдёт свой путь.
reading.Choku.TOZU=День закрытия, плох для большинства дел.

# Readings: SHUKU
reading.Shuku.BO=Очень благоприятный.
reading.Shuku.KI=Похороны и погребения приносят большое несчастье.
reading.Shuku.TO=Колодцы и амбары, построенные сегодня, наполнятся сокровищами.
reading.Shuku.GYU=Хорош для всего.
reading.Shuku.JO=Плохой день.
reading.Shuku.KYO=Несчастье следует сразу.
reading.Shuku.KIH=Очень плохой день: это приносит бедность.
reading.Shuku.RO=Очень хорош для свадеб.
reading.Shuku.I=Особенно следует избегать похорон.
reading.Shuku.SHI=Плохой день: свадьба рассеивает богатство и приносит болезнь. Будьте сдержанны.
reading.Shuku.SEI=Спокойный, благоприятный день.
reading.Shuku.KI2=Очень благоприятный день, хорош для всего.
reading.Shuku.RYU=Похороны приносят семь несчастий.
reading.Shuku.SEI2=Очень плохой день для этого.
reading.Shuku.CHO=Это закладывает основу процветания семьи.
reading.Shuku.YOKU=Плохой день.

# Readings: SENJITSU
reading.Senjitsu.TENSHA=Сто богов восходят на небо, и небо прощает все проступки: лучший день года, отмеченный как «хорош для всего». Пять-шесть раз в год.
reading.Senjitsu.ICHIRYU_MANBAI=Одно зерно вырастает в десять тысяч: считается хорошим для начинаний. Японский избранный день без классического китайского источника; доверие к нему невелико.
reading.Senjitsu.DAIMYO=Небо и земля открыты, и солнце достигает каждого уголка: очень хорош для всех добрых дел.
reading.Senjitsu.TENON=День небесной милости: очень хорош для радостных событий, не для печальных.
reading.Senjitsu.BOSO=Небо лелеет людей, как мать своё дитя: хорош для всего, особенно для брака.
reading.Senjitsu.SETTOKU=Хорош для работ, касающихся земли, например пристройки или перестройки дома.
reading.Senjitsu.KISHUKU=День стоянки 鬼, которую альманах считает очень благоприятной.
reading.Senjitsu.TORA=День Тигра двенадцатидневного цикла. Тигр уходит на тысячу ри и возвращается на тысячу ри, поэтому свадеб избегали. Праздничный день Бисямонтэна.
reading.Senjitsu.MI=День Змеи двенадцатидневного цикла.
reading.Senjitsu.TSUCHINOTO_MI=Праздничный день Бэндзайтэн, раз в шестьдесят дней.
reading.Senjitsu.KINOE_NE=Первый из шестидесяти дней и праздничный день Дайкокутэна. В 甲子待 не спали до часа Крысы и подносили соевые бобы, чёрные бобы и раздвоенную редьку ради мирской удачи.
reading.Senjitsu.TENICHI_TENJO=В эти шестнадцать дней бог направлений Тэнъити-дзин пребывает на небе, поэтому ни одно направление не закрыто и любая поездка хороша. Вместо него в доме находится Нитию-дзин: держите дом в чистоте.
reading.Senjitsu.JUSHI=Чёрный день, худший из всех: остальные пометки можно не читать, и в нижней полосе альманаха в этот день больше ничего не печатали. Болезнь, начавшаяся сегодня, считается смертельной. Лишь похорон это не касается.
reading.Senjitsu.JISSHI=Следующий после чёрного дня: плох для всего, в том числе для похорон. Как и чёрный день, стоял в нижней полосе альманаха один.
reading.Senjitsu.KIKO=Дух звезды Тяньбан стоит у дверей и не даёт людям вернуться домой.
reading.Senjitsu.CHIIMI=Видеть кровь — к несчастью.
reading.Senjitsu.TENKA=Небесный огонь свиреп: крыша, поднятая сегодня, говорят, навлечёт пожар.
reading.Senjitsu.JIKA=Земной огонь свиреп.
reading.Senjitsu.OMO=«Уйти и погибнуть»: когда-то в этот день войска не выступали.
reading.Senjitsu.FUJOJU=Ничего не свершится: начинать что-либо — к несчастью.
reading.Senjitsu.SANRINBO=Строительство сегодня, говорят, погубит трёх соседей. Некоторые альманахи добавляют, что подъём на высоту приводит к травме.
reading.Senjitsu.JIPPOGURE=Десять дней, когда силы неба и земли сталкиваются и ничего не ладится: много труда, мало толку.
reading.Senjitsu.HASSEN=Двенадцать дней, из которых у восьми ствол и ветвь одной стихии: хорошее становится лучше, плохое — хуже; поздние альманахи подчёркивали только плохое.
reading.Senjitsu.HASSEN_MABI=Один из четырёх дней внутри 八専, у которых ствол и ветвь разных стихий: свободен от его влияния.
reading.Senjitsu.OTSUCHI=Бог земли Докудзин находится в земле: не тревожьте почву.
reading.Senjitsu.KOTSUCHI=Бог земли Докудзин находится в земле: не тревожьте почву.
reading.Senjitsu.TSUCHI_MABI=День между большим и малым земляными запретами, без их ограничений.
reading.Senjitsu.SAIGEJIKI=Звёздный дух Тэнко спускается поесть; то, что едят люди, теряет силу. Лёгкий плохой день: если другая пометка называет день хорошим, его можно не соблюдать, но вместе с другим дурным днём он тяжелее. Руководство 1901 года говорит так: он не вредит в день, чьи знак и ветвь питают друг друга и на который не падает иной дурной день.
reading.Senjitsu.JUNICHI=Сделанное сегодня повторится: хорошо для хорошего, плохо для плохого. Свадеб избегают, так как они повторились бы.
reading.Senjitsu.FUKUNICHI=Добрые дела сегодня удваиваются, как и дурные. Свадеб избегают, так как они повторились бы.
reading.Senjitsu.KANOE_SARU=Ночь косин: три червя в теле, пока человек спит, поднимаются на небо и докладывают о его проступках, поэтому люди бодрствовали вместе (庚申待).
reading.Senjitsu.TAIKA=Худший из трёх плохих дней для вашего года рождения. «Хоки найдэн», классический источник, даёт три дурных дня по солнечному месяцу, каждый — человеку, рождённому в год ветви этого месяца, как их и показывает приложение; позднейшие альманахи чаще считают их дурными для всех.
reading.Senjitsu.ROSHAKU=Один из трёх плохих дней для вашего года рождения: всё, говорят, терпит неудачу. «Хоки найдэн», классический источник, даёт три дурных дня по солнечному месяцу, каждый — человеку, рождённому в год ветви этого месяца, как их и показывает приложение; позднейшие альманахи чаще считают их дурными для всех.
reading.Senjitsu.METSUMON=Один из трёх плохих дней для вашего года рождения: говорят, губит весь дом. «Хоки найдэн», классический источник, даёт три дурных дня по солнечному месяцу, каждый — человеку, рождённому в год ветви этого месяца, как их и показывает приложение; позднейшие альманахи чаще считают их дурными для всех.

# Readings: ZASSETSU
reading.Zassetsu.SETSUBUN=Канун 立春. Когда-то канун каждого сезона, теперь только весны; разбрасывание бобов восходит к китайскому обряду изгнания 追儺.
reading.Zassetsu.HIGAN_IRI=Первый из семи дней вокруг равноденствия.
reading.Zassetsu.HIGAN=Внутри семи дней вокруг равноденствия.
reading.Zassetsu.HIGAN_CHUNICHI=Само равноденствие, средний день хиган.
reading.Zassetsu.HIGAN_AKE=Последний день хиган.
reading.Zassetsu.SHANICHI=День 戊, ближайший к равноденствию, посвящённый божеству земли. После войны исключён из официальных эфемерид.
reading.Zassetsu.HACHIJUHACHIYA=88-й день от 立春: конец поры заморозков — берегитесь поздних заморозков.
reading.Zassetsu.NYUBAI=Солнце на долготе 80°: календарное начало сезона дождей.
reading.Zassetsu.HANGESHO=Солнце на долготе 100°.
reading.Zassetsu.DOYO_IRI=Начало примерно восемнадцати дней перед началом сезона, которые учение о пяти стихиях отдаёт земле.
reading.Zassetsu.DOYO=Внутри сезона земли перед началом нового сезона.
reading.Zassetsu.DOYO_USHI=День Быка внутри доё.
reading.Zassetsu.NIHYAKUTOKA=210-й день от 立春, когда рис цветёт и приближаются тайфуны.
reading.Zassetsu.NIHYAKUHATSUKA=220-й день от 立春, ещё в сезон тайфунов.

# Readings: ELEMENT_PAIR
reading.ElementPair.EARTH_EARTH=Земля встречает землю: достижение (དངོས་གྲུབ, dngos grub), и с ним удаётся всё желаемое; хорошо возводить опоры, строить, покупать поля, для обрядов приумножения, советов и прочных дел. Из десяти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к трём хорошим.
reading.ElementPair.WATER_WATER=Вода встречает воду: нектар (བདུད་རྩི, bdud rtsi), он умножает жизнь и силу; хорошо для торговли, полевых работ, приготовления лекарств, омовения, взятия невесты и обрядов долгой жизни. Из десяти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к трём хорошим.
reading.ElementPair.EARTH_WATER=Земля встречает воду: юность (ལང་ཚོ, lang tsho), она приносит большое счастье; хорошо надевать нарядную одежду и украшения, для игр и музыки, для пиров. Из десяти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к трём хорошим.
reading.ElementPair.FIRE_FIRE=Огонь встречает огонь: возрастание (འཕེལ་འགྱུར, 'phel 'gyur), оно приносит еду и одежду; хорошо для торговли, сева, раздачи, обрядов богатства и добродетельных дел. Из десяти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к трём поддерживающим (གསོ་ཐུབ, gso thub), что идут после трёх хороших.
reading.ElementPair.WIND_WIND=Ветер встречает ветер: совершенство (ཕུན་ཚོགས, phun tshogs), быстрое исполнение желаний; хорошо для путешествий, улаживания ссор, дел в движении, грозных дел и всего, что надо сделать быстро. Из десяти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к трём поддерживающим (གསོ་ཐུབ, gso thub), что идут после трёх хороших.
reading.ElementPair.FIRE_WIND=Огонь встречает ветер: сила (སྟོབས་ལྡན, stobs ldan), она приносит добрые знамения; хорошо для обрядов, подношений божествам, практики дхармы и обрядов умиротворения, приумножения и подчинения. Из десяти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к трём поддерживающим (གསོ་ཐུབ, gso thub), что идут после трёх хороших.
reading.ElementPair.EARTH_WIND=Земля встречает ветер: несовместимость (མི་འཕྲོད, mi 'phrod), она истощает еду и богатство; приходят грабёж и горе, цели не достигаются. Из десяти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к трём плохим.
reading.ElementPair.WATER_WIND=Вода встречает ветер: разлад (མི་མཐུན, mi mthun), он разлучает родных и друзей; годен сеять раздор и изгонять врагов. Из десяти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к трём плохим.
reading.ElementPair.EARTH_FIRE=Земля встречает огонь: сожжение (སྲེག་པ, sreg pa), оно порождает страдание; годен для войны, победы над врагами, грозных дел и тяжб. Из десяти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к трём плохим.
reading.ElementPair.FIRE_WATER=Огонь встречает воду: смерть (འཆི་བ, 'chi ba), она отнимает жизнь; годен для убийства, направления магии и яда. Из десяти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) называет её худшей (ཐ་ཆད, tha chad).

# Readings: SPECIAL_DAY
reading.SpecialDay.EIGHTH=Особый день для любого благого действия; мирянам рекомендуется принимать восемь обетов.
reading.SpecialDay.TENTH=Гуру Ринпоче (གུ་རུ་རིན་པོ་ཆེ, gu ru rin po che) обещал приходить в Тибет каждый десятый день, поэтому каждый десятый день — праздник его просветлённой деятельности, который отмечают подношениями цог (ཚོགས, tshogs) и гуру-пуджей. Так говорит «Молитва, призывающая блага праздника десятого дня» (ཚེས་བཅུའི་ཕན་ཡོན་གསོལ་འདེབས, tshes bcu'i phan yon gsol 'debs) Джигме Лингпы (འཇིགས་མེད་གླིང་པ, 'jigs med gling pa).
reading.SpecialDay.FULL_MOON=Полнолуние: особый день для любого благого действия и день Соджонг (གསོ་སྦྱོང, gso sbyong), монашеской исповеди.
reading.SpecialDay.TWENTY_FIFTH=День подношений цог (ཚོགས, tshogs), особенно рекомендуемый для гуру-пуджи.
reading.SpecialDay.NEW_MOON=Новолуние: особый день для любого благого действия и день Соджонг (གསོ་སྦྱོང, gso sbyong), монашеской исповеди.

# Readings: TIBETAN_FESTIVAL
reading.TibetanFestival.LOSAR=Первый день тибетского года, который празднуют всеми благоприятными и радостными способами; первые пятнадцать дней посвящены чудесам Будды.
reading.TibetanFestival.CHOTRUL_DUCHEN=День великих чудес Будды Шакьямуни. Благие и неблагие поступки в такие дни умножаются.
reading.TibetanFestival.KALACAKRA=Провозглашение Калачакра-тантры (དུས་ཀྱི་འཁོར་ལོའི་རྒྱུད, dus kyi 'khor lo'i rgyud).
reading.TibetanFestival.BIRTH=Рождение Будды.
reading.TibetanFestival.SAGA_DAWA_DUCHEN=Полнолуние Сага Дава (ས་ག་ཟླ་བ, sa ga zla ba), четвёртого месяца: день, когда Будда родился, достиг просветления и ушёл в паринирвану.
reading.TibetanFestival.ZAMLING_CHISANG=Всеобщее дымное подношение санг (བསང, bsang) всем защитникам.
reading.TibetanFestival.CHOKHOR_DUCHEN=Будда Шакьямуни впервые поворачивает колесо Дхармы.
reading.TibetanFestival.ENTRY_INTO_WOMB=Вхождение Будды в лоно его матери.
reading.TibetanFestival.LHABAB_DUCHEN=Будда Шакьямуни возвращается из мира богов.
reading.TibetanFestival.GADEN_NGAMCHO=Паринирвана Дже Цонкапы (རྗེ་ཙོང་ཁ་པ, rje tsong kha pa).
reading.TibetanFestival.PROTECTORS=Благодарение защитникам Дхармы в конце года.

# Readings: PERSONAL_DAY
reading.PersonalDay.LUCK=Гармоничный день недели для вашего года рождения: подходит, чтобы начинать дела и отмечать благоприятные события.
reading.PersonalDay.LIFE=Гармоничный день недели для вашего года рождения: подходит, чтобы начинать дела и отмечать благоприятные события.
reading.PersonalDay.ANTI=Негармоничный день недели для вашего года рождения: обычно не подходит, чтобы начинать дела или устраивать торжества.
reading.PersonalMansion.BLA=Одно из шести ваших личных созвездий, по животному года рождения. В нём удаются дела и начинания, оно хорошо для всего. Рождённый, когда Луна стоит в его собственном созвездии ла (བླ་སྐར, bla skar), созвездии жизненного духа, живёт долго.
reading.PersonalMansion.SROG=Одно из шести ваших личных созвездий, по животному года рождения. Оно хорошо для всего.
reading.PersonalMansion.DBANG=Одно из шести ваших личных созвездий, по животному года рождения. Оно хорошо для всего. Рождённый, когда Луна стоит в его собственном созвездии силы, обретает великие заслуги.
reading.PersonalMansion.SKEG=Одно из шести ваших личных созвездий, по животному года рождения. Оно дурное; сакьяское руководство называет его дурным для всего.
reading.PersonalMansion.BDUD=Одно из шести ваших личных созвездий, по животному года рождения. Оно дурное.
reading.PersonalMansion.GSHED=Одно из шести ваших личных созвездий, по животному года рождения. Оно хорошо для усмирения препятствующих духов и дурно для прочего. Рождённый, когда Луна стоит в его собственном созвездии губителя, живёт недолго: это то же, что созвездие смерти (འཆི་སྐར, 'chi skar). О созвездии смерти «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) говорит, что в нём всё дурно, поэтому, если указана дата рождения, «День вкратце» не даёт вам в этот день списка хороших дел.

# Readings: JAPANESE_FESTIVAL
reading.Festival.旧正月=Первый день первого месяца старого лунно-солнечного календаря.
reading.Festival.人日の節句=Один из пяти сезонных праздников (五節句), 7-й день 1-го месяца. До 1872 года все пять были официальными праздниками.
reading.Festival.上巳の節句=Один из пяти сезонных праздников, 3-й день 3-го месяца.
reading.Festival.端午の節句=Один из пяти сезонных праздников, 5-й день 5-го месяца.
reading.Festival.七夕=Один из пяти сезонных праздников, 7-й день 7-го месяца. Отмечаемый по старому календарю, он называется «традиционной Танабатой».
reading.Festival.十五夜=Луна середины осени, пятнадцатая ночь 8-го месяца, ночь любования луной.
reading.Festival.重陽の節句=Один из пяти сезонных праздников, 9-й день 9-го месяца.
reading.Festival.十三夜=Второе любование луной, в 13-ю ночь 9-го месяца; обычай есть только в Японии и, как считается, начался с любования луной у отрёкшегося императора Уда в 919 году. Её называют также поздней луной, каштановой луной или бобовой луной.
reading.Festival.お盆=Праздник духов предков, прежде приходившийся на дни около 15-го числа 7-го месяца старого календаря. После перехода на солнечный календарь в эпоху Мэйдзи большинство областей отмечает его на месяц позже (月遅れ), 13–16 августа, около показанного здесь 15-го, потому что середина июля пришлась на страдную пору; Токио отмечает 15 июля, а Окинава и Амами — по старому календарю.

# Readings: lunar mansions and the activity lists (Henning)
reading.Mansion={0} Перечни объединяют стих «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) об этом созвездии, первым, с тем, для чего его называет хорошим список лунных созвездий, и с перечнями действий, следующими «Белому бериллу»; где они расходятся, показаны обе стороны, и краткий обзор дня не учитывает ни одну. Не названные действия нейтральны.
reading.Mansion.ASHVINI=Подходит для торговли, искусств и тому подобного. Природа: непостоянная, лёгкая и быстрая; связано с врагами. Планета: Солнце. Пища: мясо и мёд.
reading.Mansion.BHARANI=Подходит для разрушения, обмана и тому подобного. Природа: успешная в устойчивых целях и суровая; связано с осквернением. Планета: Луна. Пища: кунжут и рис.
reading.Mansion.KRITTIKA=Подходит для смешанных дел. Природа: уравновешенная и смешанная; связано с повторением. Планета: Марс. Пища: простокваша.
reading.Mansion.ROHINI=Подходит для коронаций, сева и других долговечных дел. Природа: очень устойчивая и постоянная; связано с удачей. Планета: Меркурий. Пища: йогурт или мёд.
reading.Mansion.MRIGASHIRAS=Подходит для любви, дружбы, украшений и брака. Природа: быстро благая, мягкая и нежная; связано с осквернением. Планета: Юпитер. Пища: дичь.
reading.Mansion.ARDRA=Подходит для нападений, заклинаний, убийства и разлучения друзей. Природа: дурная и ужасная; связано с путником. Планета: Венера. Пища: кровь и вода.
reading.Mansion.PUNARVASU=Подходит для временных дел. Природа: быстро меняющаяся и мимолётная; связано с удачей. Планета: Сатурн. Пища: выпечка.
reading.Mansion.PUSHYA=Подходит для торговли, любви, искусств и тому подобного. Природа: непостоянная, лёгкая и быстрая; связано со свершением. Планета: Солнце. Пища: мёд и зайчатина.
reading.Mansion.ASHLESHA=Подходит для заклинаний, нападений и тому подобного. Природа: дурная и ужасная; связано с путником. Планета: Луна. Пища: змеиное мясо.
reading.Mansion.MAGHA=Подходит для разрушения, обмана и тому подобного. Природа: успешная в устойчивых целях и суровая; связано с врагами. Планета: Марс. Пища: кунжутный суп.
reading.Mansion.PURVAPHALGUNI=Подходит для разрушения, обмана и тому подобного. Природа: успешная в устойчивых целях и суровая; связано с осквернением. Планета: Меркурий. Пища: рис и жареный кунжут.
reading.Mansion.UTTARAPHALGUNI=Подходит для коронаций, сева и других долговечных дел. Природа: очень устойчивая и постоянная; связано с врагами. Планета: Юпитер. Пища: просо.
reading.Mansion.HASTA=Подходит для торговли, любви, искусств и тому подобного. Природа: непостоянная, лёгкая и быстрая; связано со смертью. Планета: Венера. Пища: птичье мясо и колосья.
reading.Mansion.CITRA=Подходит для брака, украшений, любви и тому подобного. Природа: быстро благая, мягкая и нежная; связано с повторением. Планета: Сатурн. Пища: фрукты.
reading.Mansion.SVATI=Подходит для временных дел. Природа: быстро меняющаяся и мимолётная; связано со свершением. Планета: Солнце. Пища: мука, кунжутный суп и непальский дал.
reading.Mansion.VISHAKHA=Подходит для смешанных дел. Природа: уравновешенная и смешанная; связано с врагами. Планета: Луна. Пища: кунжут, цветы и индийский дал.
reading.Mansion.ANURADHA=Подходит для любви, дружбы, украшений и брака. Природа: быстро благая, мягкая и нежная; связано с повторением. Планета: Марс. Пища: алкоголь, мелкие бобовые и мёд.
reading.Mansion.JYESHTHA=Подходит для заклинаний, нападений и тому подобного. Природа: дурная и ужасная; связано с путником. Планета: Меркурий. Пища: красный рис и рисовый суп.
reading.Mansion.MULA=Подходит для заклинаний, нападений и тому подобного. Природа: дурная и ужасная; связано с осквернением. Планета: Юпитер. Пища: молоко и другое.
reading.Mansion.PURVASHADHA=Подходит для разрушения, обмана и тому подобного. Природа: успешная в устойчивых целях и суровая; связано с удачей. Планета: Венера. Пища: баньян.
reading.Mansion.UTTARASHADHA=Подходит для коронаций, сева и других долговечных дел. Природа: очень устойчивая и постоянная; связано со свершением. Планета: Сатурн. Пища: мёд и зайчатина.
reading.Mansion.SHRAVANA=Подходит для временных дел. Природа: быстро меняющаяся и мимолётная; связано с повторением. Планета: Солнце. Пища: свежее масло и птичье мясо.
reading.Mansion.DHANISHTHA=Подходит для временных дел. Природа: быстро меняющаяся и мимолётная; связано с путником. Планета: Марс. Пища: индийский дал и мышиное мясо.
reading.Mansion.SHATABHISHAJ=Подходит для временных дел. Природа: очень устойчивая и мимолётная; связано с удачей. Планета: Меркурий. Пища: козлятина. Собственный перечень классов «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к четырём очень устойчивым стоянкам вместе с Рохини, Уттарапхалгуни и Уттарашадхой: хороша для занятия новых земель, назначения начальников и дел на долгий срок; природа, названная вначале, соединяет этот класс с другим.
reading.Mansion.PURVABHADRAPADA=Подходит для разрушения, обмана и тому подобного. Природа: успешная в устойчивых целях и суровая; связано со смертью. Планета: Юпитер. Пища: баранина с кровью.
reading.Mansion.UTTARABHADRAPADA=Подходит для коронаций, сева и других долговечных дел. Природа: быстро меняющаяся и постоянная; связано со смертью. Планета: Венера. Пища: непальский дал. Собственный перечень классов «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к четырём быстрым и благим стоянкам вместе с Мригаширой, Читрой и Анурадхой: хороша для украшений, игр, полевых работ и всякого быстрого дела; природа, названная вначале, соединяет этот класс с другим.
reading.Mansion.REVATI=Подходит для любви, дружбы, украшений и брака. Природа: быстро благая, мягкая и нежная; связано со свершением. Планета: Сатурн. Пища: фарш. Собственный перечень классов «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) относит её к неустойчивым и переменчивым стоянкам вместе с Ашвини, Пушьей и Хастой: хороша для обрядов подношения, проповеди, принятия обетов, даров старшим и быстрых собственных целей.
reading.Electional={0} Не названные действия нейтральны. Перечни следуют методам «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) и учитывают также восходящий знак, который приложение не рассчитывает, поэтому они не дают оценки дню в целом.
reading.Electional.weekday=Для чего перечни действий называют этот день недели хорошим или плохим.
reading.Electional.date=Для чего перечни действий называют это лунное число хорошим или плохим.
reading.Electional.animal=Для чего перечни действий называют день этого животного хорошим или плохим.
reading.Electional.trigram=Для чего перечни действий называют эту триграмму хорошей или плохой.
reading.EarthLord=Расчёт «Белого берилла» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) для умерших в день этого животного; его учёные толкователи применяют его только к похоронам. {0} Перечни — то, что перечни дел называют хорошим или плохим для дня этого животного; не названные действия нейтральны.
reading.EarthLord.MOUSE=Владыка земли сидит в кувшине с пивом: цедить пиво для умершего — к худу для пивовара и детей, если не разбросать в подношение первое от сусла и не закрыть кувшин. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится северной части дома, а бог очага — в переулке (སྲང, srang); он гневается на работу там, а больше всего на тело умершего. День свидетельствует владыка земли Гньен-тха (གཉན་ཁྲ, gnyan khra): смерть повторится трижды, а тело, отправленное на нижний север, приносит вред.
reading.EarthLord.OX=Владыка земли сидит в амбаре: брать из него ячмень для умершего — к худу для берущего и для мерщика; первое зерно разбросать на четыре стороны, а брать через пробитое в амбаре отверстие. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится северо-восточной части дома, а бог очага — под очагом; он гневается на работу там, а больше всего на тело умершего. День свидетельствует Гньен-джанг (གཉན་ལྗང, gnyan ljang): смерть повторится, могилу не роют, поминального сбора избегают.
reading.EarthLord.TIGER=Владыка земли сидит в двери: выносить через неё тело — к худу для хозяина дома; выносить через крышу или пролом. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится восточной части дома, верхнего востока, а бог очага — на юге; он гневается на работу там, а больше всего на тело умершего. День свидетельствует белая гаруда: не сжигать тело, путь тела — не на верхний восток.
reading.EarthLord.RABBIT=Владыка земли сидит в дверном засове: если носильщик тела возьмётся за него — к худу для сыновей, внуков и дочерей; носильщик его не касается, или засов вынимают заранее. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится восточной части дома, а бог очага — на востоке; он гневается на работу там, а больше всего на тело умершего. День свидетельствует земная черепаха: погребальный путь — не на нижний восток.
reading.EarthLord.DRAGON=Владыка земли сидит в мельнице: если молоть на ней цампу (རྩམ་པ, rtsam pa) для умершего, умрут мельник и дядя по матери; открыть мельницу и разбросать муку из её середины. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится юго-восточной части дома, а бог очага — на западе; он гневается на работу там, а больше всего на тело умершего. День свидетельствует Гньен-тха-бадэн (གཉན་ཁྲ་བ་དན, gnyan khra ba dan): не голосить в трауре, путь тела — не на юго-восток.
reading.EarthLord.SNAKE=Владыка земли сидит в верёвке: если тащить тело верёвкой, умрёт носильщик; разрезать верёвку на три части, связать снова, чтобы нести, и разрезать вновь там, где начинается дорога. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится южной части дома, а бог очага — на севере; он гневается на работу там, а больше всего на тело умершего. День свидетельствует Цанг-кюн (ཙང་ཀུན, tsang kun): избегать забоя и погребальной двери на верхний юг; тело лучше нести большой дорогой.
reading.EarthLord.HORSE=Владыка земли сидит в седле: тело, положенное на седло, — к худу для коня; везти без седла. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится южной части дома, а бог очага — на востоке; он гневается на работу там, а больше всего на тело умершего. День свидетельствует Чи-лам (བྱི་ལམ, byi lam): смерть повторится.
reading.EarthLord.SHEEP=Владыка земли сидит в корыте: месить в нём тесто для умершего — к худу для месящего; месить в медном сосуде или на ткани и поставить на месте смерти человеческую фигуру из теста. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится юго-западной части дома, а бог очага — на западе; он гневается на работу там, а больше всего на тело умершего. День свидетельствует Бе-на (བེ་སྣ, be sna): смерть повторится; если вскрыть землю, умрут семеро; к худу для умерших и могил; тело и погребальная дверь — не на юго-запад.
reading.EarthLord.MONKEY=Владыка земли сидит в ноже и топоре: кто рубит ими мясо, умрёт; ножи и топоры провести через огонь. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится западной части дома, а бог очага — на севере; он гневается на работу там, а больше всего на тело умершего. День свидетельствует Зиг-джуг (གཟིག་མཇུག, gzig mjug): не собираться на похороны, погребальный путь — не на верхний запад.
reading.EarthLord.BIRD=Владыка земли сидит в тарелках: подавать пищу для умершего на тарелках — к худу для хозяина или к внезапной беде; взять плоские камни или положить тесто на войлок. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится западной части дома, а бог очага — на западе; он гневается на работу там, а больше всего на тело умершего. День свидетельствует Хетон-гьялпо (ཧེ་ཐོན་རྒྱལ་པོ, he thon rgyal po): поминальный пир — к худу для богатства, тело — не на нижний запад.
reading.EarthLord.DOG=Владыка земли сидит в притолоке и пороге: тело, коснувшееся порога, — к худу для носильщика-отца, или умрёт сам носильщик; обмотать порог тканью и не пить поминального пива. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится северо-западной части дома, а бог очага — на севере; он гневается на работу там, а больше всего на тело умершего. День свидетельствует Тхе-кхьим (ཐེ་ཁྱིམ, the khyim): смерть повторится на чужбине, погребальный путь — не на северо-запад.
reading.EarthLord.PIG=Владыка земли сидит в мотыге: если копать могильную яму киркой, умрут бабушка и тот, кто вскрывает землю; вскрывать землю костью; то же — для строительства. Этот владыка земли, Сер-дзо сер-по (གསེར་མཛོད་སེར་པོ, gser mdzod ser po), держится северной части дома, а бог очага — на юге; он гневается на работу там, а больше всего на тело умершего. День свидетельствует Гньен-бе (གཉན་བེ, gnyan be): не носить траур, путь тела — не на верхний север.
reading.BlaMkhyen=Дух-астролог (བླ་མཁྱེན, bla mkhyen) дня пребывает в стороне «семи красного» этого дня — числа мева (སྨེ་བ, sme ba) 7 там, где оно стоит, когда мева самого дня поставлено в середину квадрата девяти. Сегодня: {0}. Это Сева Лакхьен (སེ་བ་བླ་མཁྱེན, se ba bla mkhyen), астролог среди духов года, в облике монаха, красно-жёлтый, с волшебным зеркалом в руке; «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) переносит на день правила года. В его сторону избегают перечисленного ниже. Он гневается на астрологов, на главу дома и на учителей ваджры; если ему навредили, посылают торму (གཏོར་མ, gtor ma) в его сторону и читают пять текстов, которые «Белый берилл» называет кратко: «Белый зонт из ушниши» (གཙུག་ཏོར, gtsug tor), «Восемь явлений неба и земли» (སྣང་བརྒྱད, snang brgyad), «Перечисление имён Манджушри» (མཚན་བརྗོད, mtshan brjod), «Собрание дхарани» (གཟུངས་བསྡུས, gzungs bsdus) и «Дхарани Ратнакету» (ཏོག་གཟུངས, tog gzungs). Девятью страницами далее первые три названы полностью (གཙུག་ཏོར་གདུགས་དཀར་མོ, gtsug tor gdugs dkar mo; གནམ་ས་སྣང་བརྒྱད, gnam sa snang brgyad; འཇམ་དཔལ་མཚན་བརྗོད, 'jam dpal mtshan brjod); все пять есть в одном печатном «Собрании дхарани», их полные названия — в источниках. Мева дня отсчитывается день за днём от дня дерева-мыши: после зимнего солнцестояния вперёд, после летнего назад.

# Readings: yogas (the White Beryl, pp. 347–349): the short reading, the gist of the longer verse, the avoidance verse
reading.Yoga.VISHKAMBHA=Расчищает путь: хорошо для устранения препятствий. Пространный стих добавляет наречение имени, согласие и славу, освящение, подношения богам, покаяние и совет с друзьями. Первых трёх чуцо (ཆུ་ཚོད, chu tshod), 1 ч 12 мин от её начала, следует избегать.
reading.Yoga.PRITI=Дружба со всеми. Удаётся всякое дело, прежде всего чистое, благоприятное и приятное; музыка и празднество.
reading.Yoga.AYUSHMAN=Долгая жизнь и слава. Известность, люди, богатство, скот и сила; хорошо для заработка.
reading.Yoga.SAUBHAGYA=Изобилие. Благоприятно для поездок; богатство прочно, растут долголетие, дхарма и счастье.
reading.Yoga.SHOBHANA=Приятна всем. Украшения, песни и танцы; сила прежних заслуг; добродетель растёт.
reading.Yoga.ATIGANDA=Богатство и скот иссякают. Хорошо для вступления на дурной путь, плохо для доведения доброго до конца: поведение доброе, плод дурной. Первых шести чуцо (ཆུ་ཚོད, chu tshod), 2 ч 24 мин от её начала, следует избегать.
reading.Yoga.SUKARMAN=Обеспечивает путь к следующей жизни. Хорошо для устремлений и выхода в путь, для друзей, одежды и поездок, для победы над вражеской силой и для защиты.
reading.Yoga.DHRITI=Обретение драгоценностей и богатства. Устраняет беды; хорошо для войны, женщин, захвата земель и крепостей, извлечения кладов и для сильных, властных дел.
reading.Yoga.SHULA=Начатое приносит большой вред. Плохо для детей, учителей, украшений и одежды; война и воры; больные умирают; беда от разговоров. Первых пяти чуцо (ཆུ་ཚོད, chu tshod), 2 ч от её начала, следует избегать.
reading.Yoga.GANDA=Вспыхивают болезни от нагов. Утрачиваются ла, жизненный дух (བླ, bla), и срок жизни, а места власти переходят к врагам. Первых шести чуцо (ཆུ་ཚོད, chu tshod), 2 ч 24 мин от её начала, следует избегать.
reading.Yoga.VRIDDHI=Богатство растёт; хорошо для всего. Враги усмирены, доброе сохранено, дела с друзьями удаются.
reading.Yoga.DHRUVA=Враги всегда побеждены. Сокровищница разума; красота, долголетие и прекрасный голос; удаётся всякое желание.
reading.Yoga.VYAGHATA=Средняя: вспыхивает проказа. Плохо для рождения и смерти, для земли, крепостей и имущества; учёба не удаётся; ссоры и раны. Первых девяти чуцо (ཆུ་ཚོད, chu tshod), 3 ч 36 мин от её начала, следует избегать.
reading.Yoga.HARSHANA=Средняя: радость жизни. Дхарма, богатство и довольный ум; место, опора, дорога и друзья; дом и заслуги.
reading.Yoga.VAJRA=Исполняется всякое желание. Страх и ужас; хорошо для гневных обрядов против других, а мирные и благоприятные дела не удаются. Первых девяти чуцо (ཆུ་ཚོད, chu tshod), 3 ч 36 мин от её начала, следует избегать.
reading.Yoga.SIDDHI=Задуманное удаётся. Слава, доброе имя и ясные способности; искусность в средствах; победа.
reading.Yoga.VYATIPATA=Плохо для поездки на чужбину. Искусными средствами одолевает демонов и войска; монашеское посвящение, храмы и дела богов; несчастья и пересуды. Избегать на всём её протяжении.
reading.Yoga.VARIYAS=Победа над врагами. Учитель с дисциплиной; власть в дхарме; достижение освобождения; мудрость.
reading.Yoga.PARIGHA=Смерть в заточении. Связь с марами, страх перед врагами, похищенная слава, болезни и разорение ниоткуда. Избегать на всём её протяжении.
reading.Yoga.SHIVA=Результат непременно достигается. Мягкость внутри и снаружи; жизнь, богатство и род в сохранности; враги усмирены, цели достигнуты.
reading.Yoga.SIDDHA=Удаётся всякое намерение. Исполнение желаний, жизнь и богатство; вера; род.
reading.Yoga.SADHYA=Хорошо для поездки по торговым делам. Красота, вера и лекарства; дхарма, богатство, прибежище и союзники; всякий приход и уход.
reading.Yoga.SHUBHA=Хорошо для пира в честь живых. Всё сделанное имеет смысл: люди, богатство, дхарма.
reading.Yoga.SHUKLA=Хорошо и для поездки, и для пребывания на месте. Светлые способности; свет, известность и слава; неистощимый разум.
reading.Yoga.BRAHMA=Достигается положение бога. Обретаются слава и известность; счастье и богатство.
reading.Yoga.INDRA=Хорошо для учёбы. Благоприятно и осмысленно; милость царя; обретается гирлянда драгоценностей.
reading.Yoga.VAIDHRITI=Встреча с подругой. Свита убывает; известность и власть под угрозой; слуги, дети и имущество приходят в упадок; дела кончаются плохо. Избегать на всём её протяжении.

# Readings: karaṇas (the White Beryl, pp. 349–351), where the verse says more than its list
reading.Karana.VISHTI=Гневные обряды в неё удаются, но стороны, куда она обращена, следует избегать; подробности и средства защиты «Белый берилл» (བཻཌཱུར་དཀར་པོ, bai DUr dkar po) оставляет «Свародая-тантре» (དབྱངས་འཆར, dbyangs 'char).
reading.Karana.CATUSHPADA=«Торма-оружие» (མཚོན་གཏོར, mtshon gtor) читается так в дэргэском издании и во «Всеблагом зерцале» (ཀུན་ཕན་མེ་ལོང, kun phan me long), где слово оканчивается, как «оружие» (མཚོན, mtshon); пекинское издание печатает его мелко.

# Readings: lunar dates (the White Beryl, pp. 297–304): the five-fold cycle, a birth and death, the perilous dates, the place of the la (bla gnas)
reading.LunarDate.1=День радости (དགའ་བ, dga' ba), Нанда, один из благих дней: хорош для умиротворяющих обрядов, ремёсел, игр и всякого светлого дела. Ребёнок, рождённый сегодня: дети следуют один за другим, широкая учёность. Смерть сегодня — к худу. Купленный сегодня скот умножается в тысячу раз. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: большой палец ноги; у лошадей и другого скота — подошва ноги; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.2=Превосходный день (བཟང་པོ, bzang po), Бхадра, один из благих дней: хорош для поиска друзей и для сева. Мальчик, рождённый сегодня, — к добру, девочка — к худу. Купленный сегодня скот умножается в тысячу раз. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: голеностопный сустав; у лошадей и другого скота — жир; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.3=Победоносный день (རྒྱལ་བ, rgyal ba), Джая, один из благих дней: хорош для войны, набегов, нападения на врагов, обрядов нитяного креста (མདོས, mdos), тормы (གཏོར་མ, gtor ma) и иных гневных обрядов. Рождённый сегодня умирает или живёт плохо. Смерть сегодня — к добру. Купленный сегодня скот умножается. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: икра; у лошадей и другого скота — дардонг (དར་གདོང, dar gdong), не опознано; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.4=Пустой день (སྟོང་པ, stong pa), Рикта, неблагой: всякое дело названо дурным. Средство — по обряду поднять в воздух пустой сосуд, прочесть «Поток богатства» (ནོར་རྒྱུན, nor rgyun) и закрепить залог богатства. Мальчик, рождённый сегодня, — к худу для матери; следом рождаются девочки. Купленный сегодня скот умножается. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: поясница; у лошадей и другого скота — скакательный сустав (སྲེ་ལོང, sre long); там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.5=Полный день (རྫོགས་པ, rdzogs pa), Пурна: в целом плох для дел, но хорош для постройки крепости и сокрытия клада. Средство — обряды, умножающие славу, и чтение «Груды благополучия» (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa). Мальчик, рождённый сегодня, будет богат; девочка умирает или живёт одна. Купленный сегодня скот умножается. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: подколенная ямка; у лошадей и другого скота — кость сера (སེ་ར, se ra), не опознана; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.6=День радости (དགའ་བ, dga' ba), Нанда, один из благих дней: хорош для умиротворяющих обрядов, ремёсел, игр и всякого светлого дела. За рождённым сегодня больше детей не будет. Смерть сегодня — к худу. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: бороздка бедра; у лошадей и другого скота — впадина тазобедренного сустава; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.7=Превосходный день (བཟང་པོ, bzang po), Бхадра, один из благих дней: хорош для поиска друзей и для сева. Мальчик, рождённый сегодня, наделён острыми способностями; девочка уходит вслед за мужем. Смерть сегодня — к добру для оставшихся. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: тазобедренный сустав; у лошадей и другого скота — локтевой бугор; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.8=Победоносный день (རྒྱལ་བ, rgyal ba), Джая, один из благих дней: хорош для войны, набегов, нападения на врагов, обрядов нитяного креста (མདོས, mdos), тормы (གཏོར་མ, gtor ma) и иных гневных обрядов. Рождённого сегодня трудно вырастить. Один из четырёх опасных дней месяца: Индра устраивает среди богов пир дхармы. Заболеть сегодня опасно; большие сборища и всё великое и сильное плохо. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: над почками; у лошадей и другого скота — почечная впадина; там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.9=Пустой день (སྟོང་པ, stong pa), Рикта, неблагой: всякое дело названо дурным. Средство — по обряду поднять в воздух пустой сосуд, прочесть «Поток богатства» (ནོར་རྒྱུན, nor rgyun) и закрепить залог богатства. Рождённый сегодня приносит несчастье. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: бок рёбер; у лошадей и другого скота — «ладонь» передней ноги (ལག་མཐིལ, lag mthil); там не делают кровопускания, прижигания и иного лечения.
reading.LunarDate.10=Полный день (རྫོགས་པ, rdzogs pa), Пурна: в целом плох для дел, но хорош для постройки крепости и сокрытия клада. Средство — обряды, умножающие славу, и чтение «Груды благополучия» (བཀྲ་ཤིས་བརྩེགས་པ, bkra shis brtsegs pa). Рождённый сегодня будет беден. Смерть сегодня — к худу. Ла, жизненный дух (བླ, bla), сегодня пребывает здесь: верх плеча; у лошадей и другого скота — затылок (ལྟག་སྒོར, ltag sgor); там не делают кровопускания, прижигания и иного лечения.
