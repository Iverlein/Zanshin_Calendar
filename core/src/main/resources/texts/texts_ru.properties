# Readings: weekdays (the White Beryl, pp. 308–312)
reading.Weekday.SUNDAY=Солнце: bla gza' царей, царской касты; мирное, бледно-красное, стихии огня. Сильно в убывающую половину месяца, днём и во Льве. Выход в путь в целом плох, прежде всего на юг, на север и в промежуточные стороны. Мальчик, рождённый сегодня, если переживёт семь дней и семь месяцев, живёт долго и любим великими; девочка будет богата, но за ней следуют девочки, и потому некоторые считают её рождение дурным. Смерть сегодня повторяется девять или семь раз. Даже когда Солнце сильно, похорон в этот день не устраивают: это дверь неба. Заключительный стих главы ставит Солнце вместе с Марсом и Сатурном среди дней, когда избегают добродетельных дел.
reading.Weekday.MONDAY=Луна: bla gza' женщин и нагов, знатной касты; мирная, бело-жёлтая, стихии воды. Сильна в Раке и ночью. Выход в путь в целом плох, прежде всего на юго-запад. Мальчик, рождённый сегодня, будет богат и очень силён; девочка — красива и приятна. Смерть сегодня не повторяется. Даже когда Луна сильна, огненного подношения hom в этот день не сжигают: это дверь нагов.
reading.Weekday.TUESDAY=Марс, называемый bkra shis: bla gza' асуров и военачальников, царской касты; гневный, красно-чёрный, стихии огня. Силён в Овне и Скорпионе. Выход в путь в целом плох, очень плох на юг, на север и в промежуточные стороны; умиротворяющие, умножающие и прочие светлые дела большей частью дурны. Мальчика, рождённого сегодня, трудно вырастить, он склонен ко злу, сеет раздор, горд и гневлив; девочка умирает рано. Смерть сегодня повторяется трижды. Добродетельных дел в этот день избегают.
reading.Weekday.WEDNESDAY=Меркурий: якша, бесполая планета, bla gza' царей, касты простолюдинов; мирный, сине-зелёный, стихии воды. Силён в начале растущей и в конце убывающей половины месяца, в Близнецах и Деве; обряды умножения особенно благоприятны. Выход в путь в целом хорош, но плох на восток, на север и в промежуточные стороны. Мальчик, рождённый сегодня, дурен, суров к матери и болезнен; девочка разоряет родителей, но сама имеет пищу, богатство и власть. Смерть сегодня дурна пятикратно, а узник не выходит на свободу. Некоторые запрещают в этот день погребение, и даже когда Меркурий силён, могил не роют: он пресекает род.
reading.Weekday.THURSDAY=Юпитер: bla gza' лам, бодхисаттв и министров, касты брахманов; смешанный, мирный и гневный, жёлтый, стихии ветра. Силён в Рыбах и Стрельце. Выход в путь в целом хорош; избегать запада. Мальчик, рождённый сегодня, некрасив лицом, но ясного ума, учён и практикует дхарму; девочка живёт долго и имеет добрых друзей. Смерть сегодня лишь немного дурна для оставшихся. Погребальные обряды дурны, но поминальный пир хорош. Даже когда Юпитер силён, зор в этот день не мечут: это планета похорон.
reading.Weekday.FRIDAY=Венера: bla gza' царей, министров и женщин, касты брахманов; мирная, многоцветная, стихии земли. Сильна в убывающую половину месяца, в Тельце и Весах; обряды власти удаются. Выход в путь в целом хорош, но плох на юг, на север и на запад. Мальчик, рождённый сегодня, живёт долго, остёр умом и богат; девочка болезненна, но велика славой. Смерть сегодня повторяется семь раз. Некоторые запрещают в этот день сжигать подношения hom, и даже когда Венера сильна, скот из дома не отправляют: это планета скота.
reading.Weekday.SATURDAY=Сатурн: бедный, бесполый, слуга, bla gza' детей, касты чандалов; гневный, серо-жёлтый, стихии земли. Силён ночью, в убывающую половину месяца, в Козероге и Водолее; убийство удаётся. Выход в путь в целом плох, прежде всего в промежуточные стороны, на восток и на запад. Рождённый сегодня красив, но мало заслуг; мальчик — средне, девочка недолговечна. Смерть сегодня не повторяется; узник теряет всё имущество. Добродетельных дел в этот день избегают, и даже когда Сатурн силён, богатства не отдают: это планета земли.

