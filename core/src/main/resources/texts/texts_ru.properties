Link.GRASPING=обретение
Link.BECOMING=дальнейшее существование
Link.BIRTH=рождение
Link.AGEING_AND_DEATH=старение и смерть
reading.TwelveLinks.IGNORANCE=День неосознанности (མ་རིག་པ, ma rig pa), первого из двенадцати звеньев, — день для строительства и подношений; его изображают слепой старухой. Мытьё головы и тела идёт хорошо, новая одежда идёт плохо.
reading.TwelveLinks.IGNORANCE.setting_out=восток идёт хорошо; юг приносит споры, запад — неприятные речи, и в обоих цель не достигается; север приносит приятные вести
reading.TwelveLinks.IGNORANCE.birth=ребёнок, переживший девятый год, месяц и день, богат и многоречив, ссорится с родными, несчастлив и похотлив, учится письму, счёту и наукам; живёт 81 год и умирает в день формирующих факторов
reading.TwelveLinks.IGNORANCE.remedy=сделайте из пяти зёрен фигуру старухи, напишите на бумаге на её спине, чтобы вред неосознанности, сильной привязанности и опасностей обратился на неё, и отошлите её; поставьте на востоке белую торму (གཏོར་མ, gtor ma), белую стрелу с шёлком и зёрна
reading.TwelveLinks.FORMATION=День формирующих факторов (འདུ་བྱེད, 'du byed), второго звена, — день для учения, строительства и добродетельных дел; его изображают гончаром. Мытьё головы или новая одежда сегодня приносят болезнь и внезапный испуг.
reading.TwelveLinks.FORMATION.setting_out=восток приносит богатство и счастливое возвращение; юг развеивает печаль и возвращает невредимым; запад приносит пищу; на севере цель достигается
reading.TwelveLinks.FORMATION.birth=ребёнок, переживший восьмой год, месяц и день, богатеет, у него двое братьев или сестёр; он редко болеет и долго живёт, у него много друзей, но он целомудрен и искусен в ремёслах; живёт 81 год и умирает в день сознания
reading.TwelveLinks.FORMATION.remedy=сделайте из теста фигуру гончара; поднимите шёлк, зёрна и жёлтую стрелу с шёлком и совершите подношение дыма (གསུར, gsur) из муки и масла
reading.TwelveLinks.CONSCIOUSNESS=День сознания (རྣམ་པར་ཤེས་པ, rnam par shes pa), третьего звена, — день для обрядов, посвящений, лечения и усмирения врагов; его изображают обезьяной. Мытьё головы приятно, мытьё тела приносит испуг.
reading.TwelveLinks.CONSCIOUSNESS.setting_out=восток приносит страдание, запад — спор; юг проходит без вреда; север приносит богатство изнутри и извне
reading.TwelveLinks.CONSCIOUSNESS.birth=ребёнок, переживший пятый год, месяц и день без внезапной смерти, долго весел; он учён и очень горд, склонен к дурному, резок на слово, храбр и беден, мал в уме пробуждения; живёт 62 года и умирает от оружия в день имени и формы
reading.TwelveLinks.CONSCIOUSNESS.remedy=сделайте из глины фигуру обезьяны с отвращающей мантрой внутри и отошлите её с лекарствами и зёрнами на перекрёсток трёх дорог; поднимите к небу красный шёлк
reading.TwelveLinks.NAME_AND_FORM=День имени и формы (མིང་གཟུགས, ming gzugs), четвёртого звена, — день для благопожеланий, белых дел и лекарств; его изображают лодкой. Мытьё головы седит волосы, мытьё тела пугает родных, новая одежда быстро изнашивается.
reading.TwelveLinks.NAME_AND_FORM.setting_out=восток приносит славу, юг исполняет желания; запад не приносит находок; север приносит потери и смятение
reading.TwelveLinks.NAME_AND_FORM.birth=ребёнок, переживший двенадцатый год, месяц и шестой день, редко болеет, но живётся ему трудно, в нём много ненависти и вечный страх, а сын не выживает; он свиреп и горд, богатеет к концу жизни, у него три жены, живёт торговлей; живёт 81 год и умирает от истощающей болезни в день источников восприятия
reading.TwelveLinks.NAME_AND_FORM.remedy=сделайте из теста лодочника и фигуру у мастера изображений и поставьте их к югу с шёлком, лекарствами, зёрнами, тремя белыми и синей стрелой с шёлком, с дымом белого благовония
reading.TwelveLinks.SOURCES=День источников восприятия (སྐྱེ་མཆེད, skye mched), пятого звена, — день для царского престола, невесты и возведения опор; его изображают пустым домом. Мытьё головы даёт величие, новая одежда — красоту, но мытьё тела пугает родителей.
reading.TwelveLinks.SOURCES.setting_out=восток бесплоден; юг приносит славу и радость; запад и север исполняют надежды
reading.TwelveLinks.SOURCES.birth=ребёнок, переживший восьмой или десятый год, третий месяц и пятый день, очень скуп, храбр, беден и полон влечения; живёт 64 года и умирает дома в день контакта
reading.TwelveLinks.SOURCES.remedy=сделайте из чёрной муки фигуру замка; поднимите к небу шёлк, лекарства, зёрна и зелёный шёлк и бросьте на дорогу сломанную стрелу
reading.TwelveLinks.CONTACT=День контакта (རེག་པ, reg pa), шестого звена, — день для суровых и жёстких дел; его изображают обнимающейся парой. Мытьё головы уменьшает споры. Новая одежда приносит вред от друга: если её нужно надеть, сначала поклонитесь монаху, и вред смягчится.
reading.TwelveLinks.CONTACT.setting_out=восток приносит болезнь, запад — шум и испуг; юг приносит красоту; на севере искомое находится, но поздно
reading.TwelveLinks.CONTACT.birth=ребёнок, переживший девятый год, пятый день и девятый, пятый или третий месяц, всегда во власти болезни; у него много друзей, он красноречив, умён и очень горд, нечист на руку, любит дхарму, очень завистлив, богат и похотлив; живёт 63 года и умирает от наказания в день ощущения
reading.TwelveLinks.CONTACT.remedy=сделайте из теста оленя и синюю гончую и выбросьте их с шёлком, лекарствами, зёрнами и веществами против дурных толков; заверните шёлк, лекарства, драгоценности и железные опилки и положите под основание священного изображения
reading.TwelveLinks.FEELING=День ощущения (ཚོར་བ, tshor ba), седьмого звена, — день для умиротворяющих дел, друзей, торговли и переправы через воду; его изображают стрелой в глазу. Мытьё головы, бритьё и мытьё тела приносят уныние, новая одежда — испуг.
reading.TwelveLinks.FEELING.setting_out=восток развеивает печаль и приносит довольство; юг приносит болезнь; запад — дурную весть о смерти; север — приятные вести и покой
reading.TwelveLinks.FEELING.birth=ребёнок, переживший восьмой год и восьмой месяц или второй месяц и двенадцатый день, почитаем другими и служит местом подношений, но склонен к хитрости и дурному; он богат зерном, искусен в ремёслах, у него две жены; живёт 60 лет и умирает от жара в день влечения
reading.TwelveLinks.FEELING.remedy=сделайте из теста мастера стрел, поднимите вместе зёрна, маленький нож и стрелу с шёлком и воскурите гуггул
reading.TwelveLinks.CRAVING=День влечения (སྲེད་པ, sred pa), восьмого звена, — день для невесты, накопления богатства и торговли; его изображают пьющим. Новую одежду, хорошую в другое время, сегодня не надевают, а мытьё и бритьё приносят большой страх.
reading.TwelveLinks.CRAVING.setting_out=восток приносит нужду; юг — богатство с мелкими печалями; запад — весть о смерти; север — беспокойство
reading.TwelveLinks.CRAVING.birth=ребёнок, переживший девятый год, пятый месяц и третий или десятый день, становится главой города, у него много детей и большое богатство, он редко болеет и хорош собой, у него много врагов и друзей; живёт 84 года и умирает от яда в день обретения
reading.TwelveLinks.CRAVING.remedy=напишите на бумаге предметы желания, вложите её в соломенный факел с зёрнами и шёлком и отнесите на перекрёсток; поднимите к небу красный шёлк и воскурите жир
reading.TwelveLinks.GRASPING=День обретения (ལེན་པ, len pa), девятого звена, — день для лекарств, послов и действий против врагов; его изображают собирающим плоды. Всё прочее, что начато, не приносит плода. Мытьё головы даёт удачу, мытьё тела — богатство, но новая одежда сокращает жизнь.
reading.TwelveLinks.GRASPING.setting_out=восток приносит страх, запад — некоторый страх; юг приносит красоту; север исполняет желания
reading.TwelveLinks.GRASPING.birth=ребёнок, переживший девятый день, второй месяц и восьмой или девятый год, некрасив и малодушен, скрытен, склонен к хитрости, очень похотлив и нарушает обеты; живёт 64 года и умирает от воды или проказы в своей земле в день дальнейшего существования
reading.TwelveLinks.GRASPING.remedy=положите книгу дхармы на шерстяную ткань, на неё — меру белого ячменя, перед ней — масляный светильник и воскурите благовоние
reading.TwelveLinks.BECOMING=День дальнейшего существования (སྲིད་པ, srid pa), десятого звена, — день для встречи женщин и друзей, и всякое другое дело идёт хорошо; его изображают парой. Мытьё головы приносит пищу и припасы, мытьё тела — красоту. Новую одежду не надевают, ссор избегают.
reading.TwelveLinks.BECOMING.setting_out=восток бесплоден и встречает страх; юг исполняет всякое желание; запад приносит большой страх; север приносит богатство
reading.TwelveLinks.BECOMING.birth=ребёнок, переживший девятый день, второй или третий месяц и девятый год, вожделеет чужих жён, мало спит, становится вождём и военачальником, могущественным и богатым, искусным в ремёслах, у него две жены; живёт 60 лет и умирает от оружия на чужбине в день рождения
reading.TwelveLinks.BECOMING.remedy=сделайте из теста пьющего пиво с зёрнами, шёлком, драгоценностями и чёрной тканью и поднимите можжевельник
reading.TwelveLinks.BIRTH=День рождения (སྐྱེ་བ, skye ba), одиннадцатого звена, — день для отвращающих обрядов, дома и государственных дел; его изображают роженицей. Мытьё головы приносит почёт, мытьё тела — друзей, но новая одежда недолговечна.
reading.TwelveLinks.BIRTH.setting_out=восток приносит богатство, которое скоро теряется; юг — приятные вести; запад проходит без вреда; север приносит богатство
reading.TwelveLinks.BIRTH.birth=ребёнок, переживший девятый день, девятый месяц и десятый год, всегда болезнен, не держит ни стад, ни поместья и становится местом подношений для других; живёт 60 лет и умирает от воды в день старения и смерти
reading.TwelveLinks.BIRTH.remedy=сделайте из глины роженицу; поднимите вместе сверху шёлк, зёрна, лекарства, скрученную цветную шерсть и пять стрел с шёлком и совершите подношение дыма (གསུར, gsur) из патоки
reading.TwelveLinks.AGEING_AND_DEATH=День старения и смерти (རྒ་ཤི, rga shi), последнего из двенадцати звеньев, — день для приёма в дом и подношений; его изображают стариком. Мытьё головы приносит одежду, еду и питьё, мытьё тела — большие потери; новая одежда недолговечна.
reading.TwelveLinks.AGEING_AND_DEATH.setting_out=восток приносит скорое возвращение; юг — друзей и приятные вести; запад — испуг; север — покой
reading.TwelveLinks.AGEING_AND_DEATH.birth=ребёнок, переживший второй день, первый месяц и девятый год, много болеет в детстве, но болезнь проходит, когда он растёт; он прям, любит родных, у него много врагов; живёт 64 года и умирает от оружия в день неосознанности
reading.TwelveLinks.AGEING_AND_DEATH.remedy=сделайте из теста фигуру врага, вложите в неё надпись «старение и смерть», заверните в чёрную ткань, обвяжите пятью драгоценностями и придавите ручной мельницей; поднимите к небу жёлтый шёлк и прочтите великие дхарани силы
reading.HundredFeet={0} Солнце, Марс, Сатурн и Раху — злые планеты; Луна, Меркурий, Юпитер и Венера — благие.
reading.HundredFeet.falls=правый клык (མཆེ་བ, mche ba) каждого светила идёт по диагонали колеса четвертей созвездий, из восьмидесяти одной клетки, от созвездия, где стоит светило, и поражает созвездие, на котором кончается
reading.Eclipse.MOON=Лунное затмение (ཟླ་འཛིན, zla 'dzin): Раху (སྒྲ་གཅན, sgra gcan) хватает луну в полнолуние. Всё, что сделано сегодня, доброе или дурное, умножается в семьдесят миллионов раз, тогда как в обычные благие дни — в сто раз.
reading.Eclipse.MOON.falls=луна полнолуния, в половине круга от солнца счёта караны (བྱེད་རྩིས, byed rtsis), не дальше 57 чуцо (ཆུ་ཚོད, chu tshod) за головой Раху (གདོང, gdong), 50 перед головой или хвостом (དུས་མེ, dus me) или 45 за хвостом
reading.Eclipse.SUN=Солнечное затмение (ཉི་འཛིན, nyi 'dzin): Раху (སྒྲ་གཅན, sgra gcan) хватает солнце в новолуние. Всё, что сделано сегодня, доброе или дурное, умножается в миллион миллионов раз, тогда как в обычные благие дни — в сто раз.
reading.Eclipse.SUN.falls=солнце новолуния по счёту караны (བྱེད་རྩིས, byed rtsis) не дальше 52 чуцо (ཆུ་ཚོད, chu tshod) за головой Раху (གདོང, gdong) или 5 перед ней, 7 за хвостом (དུས་མེ, dus me) или 40 перед ним
reading.HourEarthLords=Юдзё Нгёнмо (གཡུ་མཛོད་སྔོན་མོ, g.yu mdzod sngon mo) сидит на месте этого часа вместе с владыками земли (ས་བདག, sa bdag) Кхангцеком (ཁང་བརྩེགས, khang brtsegs) и Цонгёном (མཚོ་སྔོན, mtsho sngon). Дела невесты, умерших и строительства идут плохо, а при Кхангцеке — многоэтажные дома и ряды сидений. Юдзё Нгёнмо гневается на детей и на тех, кто хранит или несёт умерших, двое других — на главу дома и родню по отцу.
reading.HourEarthLords.also_called=бог часов, Юдзё Нгёнмо (གཡུ་མཛོད་སྔོན་མོ, g.yu mdzod sngon mo), с телом человека и головой тигра
reading.HourEarthLords.remedy=если навредили Юдзё Нгёнмо (གཡུ་མཛོད་སྔོན་མོ, g.yu mdzod sngon mo), прочтите «Восемь явлений неба и земли» (སྣང་བརྒྱད, snang brgyad) и «Белый зонт из ушниши» (གཙུག་ཏོར, gtsug tor), а чтобы заслонить его, поставьте синее шёлковое знамя и медную лопату; если навредили двум другим, прочтите «Дхарани Ратнакету» (ཏོག་གཟུངས, tog gzungs), «Восемь явлений» и «Собрание дхарани» (གཟུངས་བསྡུས, gzungs bsdus)
reading.BlackHour=Это чёрный час, час «четвёртого убийцы» (བཞི་གཤེད, bzhi gshed) животного даты: всякое важное дело в нём идёт плохо. Гневное дело, совпавшее с часом, достигает цели.
reading.BlackHour.remedy=нарисуйте свастику справа от двери, а солнце и луну — слева
wording.important_works=все важные дела
Animal.TIGER.place=верхний восток
Animal.RABBIT.place=нижний восток
Animal.DRAGON.place=юго-восток
Animal.SNAKE.place=верхний юг
Animal.HORSE.place=нижний юг
Animal.SHEEP.place=юго-запад
Animal.MONKEY.place=верхний запад
Animal.BIRD.place=нижний запад
Animal.DOG.place=северо-запад
Animal.PIG.place=верхний север
Animal.MOUSE.place=нижний север
Animal.OX.place=северо-восток
reading.HourBlaMkhyen=Дух-астролог (བླ་མཁྱེན, bla mkhyen) часа пребывает на коне ветра (ཀླུང་རྟ, klung rta) трёх животных часа, как годовой — на коне ветра года. Дела в его сторону идут плохо, как говорят о нём правила года. Он гневается на астрологов, на главу дома и на учителей ваджры.
reading.HourBlaMkhyen.remedy=если ему навредили, пошлите торму (གཏོར་མ, gtor ma) в его сторону и прочтите пять текстов, как для духа-астролога дня
reading.HourSaRgyal=Царь земли (ས་རྒྱལ, sa rgyal) часа стоит на «четвёртом убийце» (བཞི་གཤེད, bzhi gshed) впереди часа, через три животных. Если ему навредили, страдают глава и правитель края, а совершивший обряды над телом скоро умирает.
reading.HourSaRgyal.remedy=хотя средство для него не названо, совершите посвящение, практикуйте стадии зарождения и завершения и соберите большое подношение цог (ཚོགས, tshogs)
reading.HourHidden.MOUSE=Гньен-тха (གཉན་ཁྲ, gnyan khra)
reading.HourHidden.OX=Гньен-джанг (གཉན་ལྗང, gnyan ljang)
reading.HourHidden.TIGER=гаруда (བྱ་ཁྱུང, bya khyung)
reading.HourHidden.RABBIT=жёлтая черепаха (རུས་སྦལ་སེར་པོ, rus sbal ser po)
reading.HourHidden.DRAGON=жёлтое знамя (བ་དན་སེར་པོ, ba dan ser po)
reading.HourHidden.SNAKE=Цанг-кюн (ཙང་ཀུན, tsang kun)
reading.HourHidden.HORSE=Чи-лам (བྱི་ལམ, byi lam)
reading.HourHidden.SHEEP=Бе-на-лаг-чен (བེ་སྣ་ལག་ཆེན, be sna lag chen)
reading.HourHidden.MONKEY=Зиг-джуг (གཟིག་མཇུག, gzig mjug)
reading.HourHidden.BIRD=Хетон (ཧེ་ཐོན, he thon)
reading.HourHidden.DOG=Чи-дур (བྱི་དུར, byi dur)
reading.HourHidden.PIG=Чхуг-по (ཕྱུག་པོ, phyug po)
reading.HourHidden=Скрытый владыка земли (གབ་པའི་ས་བདག, gab pa'i sa bdag) животного этого часа, {0}, сидит на его месте. Скрытые владыки земли свирепы, и тело умершего не ведут в их сторону.
reading.HourHidden.remedy=если ему навредили, примените общие средства
reading.HourGnamKhyi=Чёрный небесный пёс (གནམ་ཁྱི་ནག་པོ, gnam khyi nag po) лежит вокруг двенадцати мест, голова — на месте этого часа, хвост — на седьмом. В сторону головы плохо идут погребение, крепости и выход войска, в сторону хвоста — вынос тела, война и разбой. Хуже всего идёт невеста, и он гневается на всех, сильнее всего на носильщиков тел.
reading.HourGnamKhyi.remedy=если ему навредили, совершите обряд нитяного креста (མདོས, mdos) небесного пса и прочтите «Белый зонт из ушниши» (གཙུག་ཏོར, gtsug tor)
RoughTime.SUNRISE=лучи восходящего солнца
RoughTime.NOON=полдень
RoughTime.SUNSET=лучи заходящего солнца
RoughTime.MIDNIGHT=полночь
wording.guarding_curd_and_beer=оберегание простокваши и пива
wording.binding_the_gongpo=связывание уст духов гонгпо (འགོང་པོ, 'gong po)
wording.raising_fortune_and_prosperity=подъём удачи и благоденствия (ཕྱྭ་གཡང, phywa g.yang)
wording.mantras_taming_the_earth_lords=чтение мантр, усмиряющих владык земли (ས་བདག, sa bdag)
wording.fierce_averting_recitation=гневное чтение, отвращающее вред
wording.taming_madness_and_fainting=дела, усмиряющие безумие и обмороки
wording.expelling_adversity=дела, изгоняющие противодействие
wording.fulfilling_the_protectors=обряды восполнения защитников (སྲུང་མ, srung ma) и подношения им
wording.binding_the_serak=связывание уст серак (བསེ་རག, bse rag)
wording.taming_the_gremo=усмирение дрэмо (གྲེ་མོ, gre mo)
wording.mantras_summoning_fortune_and_prosperity=чтение мантр, призывающих удачу и благоденствие (ཕྱྭ་གཡང, phywa g.yang)
wording.fierce_mantras=гневные мантры
wording.mantras_slaying_enemies=мантры, сражающие врагов
wording.averting_killing_and_fierce_work=отвращение, убиение и гневные дела
wording.confrontations=столкновения
wording.great_displays=большие показы силы
reading.HourWorks={0} Где час и животное дня (ཉི་མ, nyi ma) расходятся, в своё время главенствует час: час — острое оружие.
reading.HourWorks.RABBIT=В час зайца хорошо идут оберегание простокваши и пива и связывание уст духов гонгпо (འགོང་པོ, 'gong po).
reading.HourWorks.DRAGON=В час дракона, на восходе (ཉི་ཤར, nyi shar), хорошо идёт поднятие удачи и благоденствия (ཕྱྭ་གཡང, phywa g.yang).
reading.HourWorks.SNAKE=В час змеи, когда солнце пригревает (ཉི་དྲོས, nyi dros), хорошо идёт чтение мантр, усмиряющих владык земли (ས་བདག, sa bdag).
reading.HourWorks.HORSE=В час лошади, в полдень (ཉི་ཕྱེད, nyi phyed), хорошо идёт гневное чтение, отвращающее вред.
reading.HourWorks.SHEEP=В час овцы, после половины (ཕྱེད་ཡོལ, phyed yol), когда солнце клонится, хорошо идут дела, усмиряющие безумие и обмороки.
reading.HourWorks.MONKEY=В час обезьяны, под вечер (མྱུར་སྨད, myur smad), хорошо идут дела, изгоняющие противодействие.
reading.HourWorks.BIRD=В час птицы, когда солнце стареет (ཉི་རྒས, nyi rgas), хорошо идут обряды восполнения защитников (སྲུང་མ, srung ma) и подношения им.
reading.HourWorks.DOG=Когда приходит час собаки, в сумерки (ས་སྲོད, sa srod), хорошо идут дела, связывающие уста серак (བསེ་རག, bse rag).
reading.HourWorks.PIG=В час свиньи, когда наступает ночь (སྲོད་འཁོར, srod 'khor), хорошо идут дела, усмиряющие дрэмо (གྲེ་མོ, gre mo).
reading.HourWorks.MOUSE=Когда в полночь (ནམ་ཕྱེད, nam phyed) восходит мышь, хорошо идёт чтение мантр, призывающих удачу и благоденствие (ཕྱྭ་གཡང, phywa g.yang).
reading.HourWorks.OX=В час быка, после половины (ཕྱེད་ཡོལ, phyed yol), за полночь, хорошо идут гневные мантры.
reading.HourWorks.TIGER=В час тигра хорошо идут мантры, сражающие врагов.
reading.RoughTime=Это одно из четырёх суровых времён (དུས་རྩུབ་མོ, dus rtsub mo), когда движутся четыре мары (བདུད་བཞི, bdud bzhi). Ничто не идёт в нём хорошо, кроме отвращения, убиения и гневных дел: час — острое оружие.
reading.OwnYearHour=Это час вашего собственного года — час животного года вашего рождения. Гневные и грубые дела, собрания, столкновения и большие показы силы идут в нём плохо.
reading.HourOverDay=Где животное дня (ཉི་མ, nyi ma) и час расходятся, главенствует час: час — острое оружие. В этот час дело, которое решало одно животное дня, встаёт на ту сторону, которую даёт ему час.

