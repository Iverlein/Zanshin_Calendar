reading.EarthLord.NAG_CHUNG=Малый чёрный день, Ньима Накчунг (ཉི་མ་ནག་ཆུང, nyi ma nag chung), — путь Джама Гунгьяла (བྱ་མ་གུང་རྒྱལ, bya ma gung rgyal). Избегайте дел ради умерших, невесты, освящения, пиров и погребальных обрядов, а прежде всего выноса богатства из дома.
reading.EarthLord.NAG_CHUNG.remedy=поставить фигурки тигра, коня, овцы и собаки из теста на юг, запад, север и восток с подношениями; или сжечь белое масло, рассыпать белую землю по крыше и красную — на четыре стороны
reading.EarthLord.PI_LING=Пилинг Парма (པི་ལིང་འཕར་མ, pi ling 'phar ma), владыка земли (ས་བདག, sa bdag) с одиннадцатью министрами, движется сегодня. Все дела, большие и малые, идут плохо, а копать землю — к смертям; грозные дела, сделанные заодно с ним, бьют сильно.
reading.EarthLord.PI_LING.remedy=читать писания, поднять жёлтое знамя и сделать нитяной крест (མདོས, mdos) для владык земли
reading.EarthLord.ZIN_PHUNG=Зинпунг (ཟིན་ཕུང, zin phung), владыка земли (ས་བདག, sa bdag), {0} Большие дела приносят большой вред, малые — малый; дурные средства идут заодно с ним, и к нему никогда не стоят лицом.
reading.EarthLord.ZIN_PHUNG.0=движется сегодня с юга на север.
reading.EarthLord.ZIN_PHUNG.1=движется сегодня с запада на восток.
reading.EarthLord.ZIN_PHUNG.2=движется сегодня с севера на юг.
reading.EarthLord.ZIN_PHUNG.3=движется сегодня с востока на запад.
reading.EarthLord.ZIN_PHUNG.middle=сидит сегодня в середине, и ничего не делают.
reading.EarthLord.ZIN_PHUNG.birth=ребёнок умирает
reading.EarthLord.PHUNG_ZOR=Пунгпо Зорток (ཕུང་པོ་ཟོར་ཐོགས, phung po zor thogs), владыка земли (ས་བདག, sa bdag), движется сегодня. Дела ради живых и умерших идут плохо, в том числе добродетельные, а разрушительные мантры против других идут хорошо.
reading.EarthLord.PHUNG_ZOR.remedy=поставить человека с колчаном из тигровой шкуры и зор (ཟོར, zor), или обратить его наружу или сжечь
reading.EarthLord.KI_KANG=Кикан (ཀི་ཀང, ki kang), общий демон стихий, дикая и грозная планета Раху, движется сегодня. Белые дела низводят царя, невеста идёт плохо в обе стороны, постройка скоро рушится, а пир становится поминальным.
reading.EarthLord.KI_KANG.illness=болезнь, пришедшая сегодня, не проходит
reading.EarthLord.KI_KANG.birth=ребёнок скоро умирает
reading.EarthLord.HAL_KHYI=Халкьи Накпо (ཧལ་ཁྱི་ནག་པོ, hal khyi nag po), чёрный задыхающийся пёс, владыка земли (ས་བདག, sa bdag), ищет пищу сегодня. Все добродетельные дела идут плохо; направление магической силы и вредоносные дела идут хорошо.
reading.EarthLord.HAL_KHYI.remedy=в его час повесить на крыше целую голову собаки или овцы с шёлком или обратить в его сторону чёрного пса из зерна
reading.EarthLord.GNAM_KHYI=Чёрный небесный пёс (གནམ་ཁྱི་ནག་པོ, gnam khyi nag po), владыка земли (ས་བདག, sa bdag), ищет пищу сегодня. Большие дела ради живых и умерших идут плохо, как в дни Халкьи Накпо (ཧལ་ཁྱི་ནག་པོ, hal khyi nag po).
reading.EarthLord.GNAM_SBYOR=Намджор (གནམ་སྦྱོར, gnam sbyor), владыка земли (ས་བདག, sa bdag), приходится на сегодня. Он касается брака и умерших: всё, что соединяет пару или переносит тело умершего, идёт плохо.
reading.EarthLord.GZA_RGOD=Загё (གཟའ་རྒོད, gza' rgod), дикая планета, владыка земли (ས་བདག, sa bdag), ищет пищу сегодня. Отдать или взять невесту в этот день — к худу, а грозные дела идут хорошо.
reading.EarthLord.GZA_RGOD.remedy=поднять шёлк цвета дня недели и сжечь белое масло
reading.EarthLord.GZA_RGOD.illness=болезнь, пришедшая сегодня, не проходит
reading.EarthLord.GZA_RGOD.birth=умирает один из родителей или сам ребёнок
reading.EarthLord.GZA_RGOD.death=вынесенное тело повторяется пять раз
reading.EarthLord.DBUL_PO=Улпо Лактонг (དབུལ་པོ་ལག་སྟོང, dbul po lag stong), нищий с пустыми руками, владыка земли (ས་བདག, sa bdag), движется сегодня. Пиры и раздача богатства ведут к бедности, а большинство дел ради живых и умерших идёт плохо.
reading.EarthLord.DBUL_PO.remedy=взять богатство у трёх богачей, сделать из теста фигурки руки и черепахи и отдать прочь зерно торговца
reading.EarthLord.GZA_BDUN=Задюн (གཟའ་བདུན, gza' bdun), семь планет, ищущих пищу и рассылающих гонцов, владыка земли (ས་བདག, sa bdag), движется сегодня. Белые дела идут плохо, а разрушительные мантры против других идут хорошо; его плоды — те же, что у Кикана (ཀི་ཀང, ki kang).
reading.EarthLord.GZA_BDUN.remedy=читать о супруге планет и высшей планете, поднять жёлтый шёлк и рассыпать жёлтую землю
reading.EarthLord.GZA_BDUN.birth=идёт плохо, как и пир в честь мальчика
reading.EarthLord.NGAM_SHING=Нгамшинг (ངམ་ཤིང, ngam shing), владыка земли (ས་བདག, sa bdag), движется сегодня. В этот день хорошо идут почитание духовного друга, учителя и учение, а невесту не допускают.
reading.EarthLord.BAR_KHYI=Баркьи (བར་ཁྱི, bar khyi), владыка земли (ས་བདག, sa bdag), движется сегодня, в даты Задюна (གཟའ་བདུན, gza' bdun). Большие дела, такие как невеста, строительство и освящение, идут плохо, как и стремление к своим целям.
reading.EarthLord.BAR_KHYI.remedy=повесить на крыше голову собаки или овцы с шёлком или обратить в его сторону чёрного пса из зерна, как при Халкьи Накпо (ཧལ་ཁྱི་ནག་པོ, hal khyi nag po); или положить на порог деревянную дощечку с двенадцатью годами и восемью триграммами и чёрного пса
reading.EarthLord.KA_KHYUNG=Какьюнг Кикан (ཀ་ཁྱུང་ཀི་ཀང, ka khyung ki kang), владыка земли (ས་བདག, sa bdag), движется сегодня. В этот день не делают ничего, кроме грозных дел: всех остальных дел следует избегать.
reading.EarthLord.DRA_CHEN=Драчен (དྲ་ཆེན, dra chen), владыка земли (ས་བདག, sa bdag), движется в этот день. Грубые дела ради живых и умерших идут плохо, а прежде всего пиры, невеста и война.
reading.EarthLord.SDE_BRGYAD=Восемь классов (སྡེ་བརྒྱད, sde brgyad) движутся по датам вместе с владыками земли (ས་བདག, sa bdag). {0} Когда они наносят удар (ཐེབས, thebs), грозные дела идут хорошо; когда поворачивают назад (བཟློག, bzlog), они идут плохо.
reading.EarthLord.SDE_BRGYAD.STRIKES=Сегодня они наносят удар.
reading.EarthLord.SDE_BRGYAD.TURNS_BACK=Сегодня они поворачивают назад.
reading.EarthLord.SA_BDAG_BZLOG=Владыки земли (ས་བདག, sa bdag) поворачивают назад (བཟློག, bzlog) сегодня. Дела против других и дела с нагами (ཀླུ, klu) тогда оборачиваются против начавшего: нет сына, утрата богатства, короткая жизнь и бедность.
reading.EarthLord.GNYAN=Ньен (གཉན, gnyan) движутся по датам вместе с владыками земли (ས་བདག, sa bdag). {0}
reading.EarthLord.GNYAN.MOVES=Сегодня они движутся: всё начатое придётся делать заново, поэтому дела идут плохо, но подношения ньен идут хорошо.
reading.EarthLord.GNYAN.STRIKES=Сегодня они наносят удар, и о дне судят так же, как об ударах восьми классов: грозные дела идут хорошо.
reading.EarthLord.GNYAN.TURNS_BACK=Сегодня они поворачивают назад, и о дне судят так же, как о поворотах восьми классов: грозные дела идут плохо.
reading.EarthLord.KLU=Наги (ཀླུ, klu) движутся по датам вместе с владыками земли (ས་བདག, sa bdag). {0} Когда они наносят удар (ཐེབས, thebs), торма (གཏོར་མ, gtor ma) для нагов, вызывание дождя и прочие дела с ними идут хорошо; когда поворачивают назад (བཟློག, bzlog), ничего из этого делать нельзя.
reading.EarthLord.KLU.STRIKES=Сегодня они наносят удар.
reading.EarthLord.KLU.TURNS_BACK=Сегодня они поворачивают назад.
reading.EarthLord.CLASS_TIMES=У классов есть и свои времена, когда хорошо идут дела, согласные с каждым из них. {0} Дело, сделанное при приближении удара или поворота, процветает, сделанное впереди него — угасает.
reading.EarthLord.CLASS_TIMES.klu=Сегодня время нагов (ཀླུ, klu), когда восходят лучи солнца.
reading.EarthLord.CLASS_TIMES.rgyal_po=Сегодня время гьялпо (རྒྱལ་པོ, rgyal po), на рассвете.
reading.EarthLord.CLASS_TIMES.lam_mo=Сегодня время ламо (ལམ་མོ, lam mo), в сумерки.
reading.EarthLord.CLASS_TIMES.btsan=Сегодня время цен (བཙན, btsan), когда восходят лучи солнца.
reading.EarthLord.CLASS_TIMES.gnod_sbyin=Сегодня время якшей (གནོད་སྦྱིན, gnod sbyin), в полдень и в полночь.
reading.EarthLord.CLASS_TIMES.bdud=Сегодня время демонов (བདུད, bdud), в сумерки.
reading.EarthLord.CLASS_TIMES.gshin_rje=Сегодня время воинства Ямы (གཤིན་རྗེ, gshin rje), под вечер.
reading.EarthLord.GNAM_SGO=У каждой даты своя небесная дверь (གནམ་སྒོ, gnam sgo), по последней цифре её числа, и в каждую дверь её собственное дело идёт плохо. {0}
reading.EarthLord.GNAM_SGO.mgron_po=Сегодня дверь гостей: стремление к своим целям и приём гостей оставляют дом в нужде.
reading.EarthLord.GNAM_SGO.mgron_po.remedy=совершить подношения богам, сокрушить дурные толки, придавить имя демона собственной ручной мельницей, взмахнуть фигуркой птицы к северному небу и прочесть дхарани
reading.EarthLord.GNAM_SGO.tshong=Сегодня дверь торговли: торговля приносит убытки без конца.
reading.EarthLord.GNAM_SGO.tshong.remedy=придавить фигурки под изображением, положить муку торговца в башмак под рог яка, рассыпать жареное зерно в небо, прочесть дхарани и взмахнуть книгой дхармы
reading.EarthLord.GNAM_SGO.bu_chung=Сегодня дверь малых детей: рождение малого ребёнка, пир в его честь или первый вынос встречают препятствия.
reading.EarthLord.GNAM_SGO.bu_chung.remedy=положить тело ребёнка в мешок и бить по нему оружием убийцы, прочесть дхарани и изгнать дурные толки
reading.EarthLord.GNAM_SGO.dmag=Сегодня дверь войны: выведенное войско терпит поражение девять раз кряду.
reading.EarthLord.GNAM_SGO.dmag.remedy=взять в плен имя и изображение полководца, сжечь край доспеха, срезать кончик уха жеребца, поднять копья и знамёна и прочесть дхарани
reading.EarthLord.GNAM_SGO.gnyen=Сегодня дверь союзов: заключённый союз оборачивается ссорой, пир — убытком.
reading.EarthLord.GNAM_SGO.gnyen.remedy=связать петуха, положить в соль и накрыть башмаком простолюдина, говорить о союзе с ничтожным человеком, прочесть длинную благую дхарани и дать нищему хорошей еды
reading.EarthLord.GNAM_SGO.mkhar=Сегодня дверь крепостей: постройка приносит тяжбы прежде, чем высохнет раствор.
reading.EarthLord.GNAM_SGO.mkhar.remedy=взмахнуть корзиной в небо, придавить в загоне деревни или в основании стены фигурку слепого старика из бобов с именем врага внутри и прочесть дхарани
reading.EarthLord.GNAM_SGO.bag_ma=Сегодня дверь невесты: взятая невеста вдовеет снова и снова.
reading.EarthLord.GNAM_SGO.bag_ma.remedy=нарядно одеть старуху и дать ей тесто невесты и тесто нищего, бросить дурные толки в меру и прочесть сутру
reading.EarthLord.GNAM_SGO.dur=Сегодня дверь могилы: погребение приносит из могилы вредоносных духов умерших (སྲི, sri), а в конце — разорение.
reading.EarthLord.GNAM_SGO.dur.remedy=взмахнуть волчьим черепом к небу и спрятать в землю свиной череп, дать тесто и пиво и прочесть дхарани
reading.EarthLord.GNAM_SGO.shid=Сегодня дверь погребальных обрядов: совершённые обряды приносят тяжбы прежде, чем высохнет дёрн.
reading.EarthLord.GNAM_SGO.shid.remedy=сделать изображение чёрной ракшаси верхом на черепе, прочесть дхарани чёрной богини и очистить деревню
reading.EarthLord.GNAM_SGO.spyi=Сегодня общая дверь: что бы ни делали, всё идёт не так, прежде всего общие дела.
reading.EarthLord.GNAM_SGO.spyi.remedy=взмахнуть черепами на четыре стороны и прочесть дхарани
reading.RahuSeason=Раху ищет пищу сегодня среди владык земли (ས་བདག, sa bdag), которые движутся по датам. Дела, большие и малые, ради живых и умерших идут плохо, прежде всего работа с землёй и глиной, а грозные дела идут хорошо.
reading.RahuSeason.remedy=читать о супруге планет и показать образ Ваджрапани
wording.sending_hail=насылание града
wording.making_tsatsas=глиняные обетные изображения (ཚ་ཚ, tsha tsha)
wording.seeking_a_grave_site=поиск места для могилы
wording.seeking_ones_aims=стремление к своим целям
wording.taking_a_child_out=первый вынос ребёнка из дома
wording.a_new_couple_joining=соединение новой пары
wording.giving_and_taking_dogs=отдача и взятие собак
wording.a_small_childs_birth_feast_and_first_outing=рождение малого ребёнка, пир в его честь и первый вынос
wording.offerings_to_the_gnyan=подношения ньен (གཉན, gnyan)
wording.naga_tormas_and_offerings=торма (གཏོར་མ, gtor ma) нагам и подношения восьми нагам
EarthLordCourse.SPUG_STON=Владыки земли по Пуктону
reading.EarthLord.SPUG_STON=Пуктон (སྤུག་སྟོན, spug ston) отмечает в каждом месяце даты для владык земли (ས་བདག, sa bdag): успеха, исчезновения и невыдачи богатства. {0}
reading.EarthLord.SPUG_STON.grub=Сегодня дата успеха: средства для владык земли помогают.
reading.EarthLord.SPUG_STON.yal=Сегодня дата исчезновения: средства для владык земли не помогают и оборачиваются против совершающего.
reading.EarthLord.SPUG_STON.nor=Сегодня богатство не выдают: выданные богатство или скот опустошают загон.
wording.remedies_for_the_earth_lords=средства для владык земли
reading.EarthLord.CLASS_TIMES.gza=Сегодня, в дату вишти, время планет (གཟའ, gza').
reading.EarthLord.CLASS_TIMES.srin_po=Сегодня, в дату вишти, время ракшасов (སྲིན་པོ, srin po).
wording.work_with_mud=работы с глиной
wording.setting_up_growth=установка роста (སྐྱེད་འཛུགས, skyed 'dzugs), дословно
wording.pulling_down_the_yak_wood=разборка «ячьего дерева» (གཡག་ཤིང་དགོག, g.yag shing dgog), дословно
EarthLordCourse.NAG_CHEN=Ньима Накчен
EarthLordCourse.ZHAG_NAG=Чёрный день
reading.EarthLord.ZHAG_NAG=Сегодня чёрный день (ཞག་ནག, zhag nag): животное дня — «четвёртый убийца» (བཞི་གཤེད, bzhi gshed) животного месяца. Все важные дела идут плохо, а грозные дела, сделанные сегодня, бьют.
reading.EarthLord.ZHAG_NAG.remedy=нарисовать свастику справа от двери, а солнце и луну слева
EarthLordCourse.ZLA_NAG=Чёрный месяц
reading.EarthLord.ZLA_NAG=Чёрный месяц (ཟླ་ནག, zla nag): треть этого месяца черна, как у месяцев «четвёртых убийц» (བཞི་གཤེད, bzhi gshed) года. Дела ради живых и умерших идут плохо, а грозные обряды идут хорошо.
reading.EarthLord.ZLA_NAG.remedy=отнести на перекрёсток три фигурки чёрных месяцев из теста вместе с веществами против пересудов, сказав: «Это не чёрный месяц, а белый, да будут дела благоприятны», и прочесть молитву богини Маричи (འོད་ཟེར་ཅན་མ, 'od zer can ma); или поднять белый шёлк, совершить белое подношение дыма (གསུར, gsur), разбросать красную землю на четыре стороны, украсить белым шёлком яка или овцу с белой головой, сделать много водных подношений и прочесть «Собрание дхарани» (གཟུངས་བསྡུས, gzungs bsdus)
reading.EarthLord.ZLA_NAG.UPPER.falls=верхняя треть, с 1-го по 10-е, в первом месяце сезона
reading.EarthLord.ZLA_NAG.MIDDLE.falls=середина (སྒང, sgang), с 11-го по 20-е, в среднем месяце сезона
reading.EarthLord.ZLA_NAG.LOWER.falls=нижняя треть, с 21-го по 30-е, в последнем месяце сезона
EarthLordCourse.KI_KANG_ZLA_NAG=Чёрный месяц Кикана
reading.EarthLord.KI_KANG_ZLA_NAG=Чёрный месяц Кикана (ཀི་ཀང་ཟླ་ནག, ki kang zla nag) приходится на сегодня: один день в двух месяцах каждого года, когда одно дело идёт плохо. Он очень силён, поэтому важна осторожность. {0}
reading.EarthLord.KI_KANG_ZLA_NAG.TIGER=Погребальные обряды сегодня вновь открывают смерть для дома умершего.
reading.EarthLord.KI_KANG_ZLA_NAG.TIGER.falls=8-е первых месяцев лета и зимы в год тигра, на рассвете
reading.EarthLord.KI_KANG_ZLA_NAG.RABBIT=Погребальные обряды сегодня несут разорение.
reading.EarthLord.KI_KANG_ZLA_NAG.RABBIT.falls=18-е средних месяцев лета и зимы в год зайца, на восходе солнца
reading.EarthLord.KI_KANG_ZLA_NAG.DRAGON=Погребальные обряды сегодня идут плохо.
reading.EarthLord.KI_KANG_ZLA_NAG.DRAGON.falls=полнолуние последних месяцев лета и зимы в год дракона
reading.EarthLord.KI_KANG_ZLA_NAG.SNAKE=Погребальные обряды сегодня идут плохо.
reading.EarthLord.KI_KANG_ZLA_NAG.SNAKE.falls=30-е первых месяцев осени и весны в год змеи
reading.EarthLord.KI_KANG_ZLA_NAG.HORSE=Строить крепость сегодня — к худу для астролога, духовного наставника и хозяина дома.
reading.EarthLord.KI_KANG_ZLA_NAG.HORSE.falls=полнолуние средних месяцев осени и весны в год коня
reading.EarthLord.KI_KANG_ZLA_NAG.SHEEP=Торговля сегодня приносит потерю богатства.
reading.EarthLord.KI_KANG_ZLA_NAG.SHEEP.falls=22-е последних месяцев осени и весны в год овцы, в сумерках, когда засыпают птицы
reading.EarthLord.KI_KANG_ZLA_NAG.MONKEY=Погребение сегодня разоряет дом.
reading.EarthLord.KI_KANG_ZLA_NAG.MONKEY.falls=8-е первых месяцев лета и зимы в год обезьяны, на рассвете
reading.EarthLord.KI_KANG_ZLA_NAG.BIRD=Добродетельные дела сегодня идут плохо.
reading.EarthLord.KI_KANG_ZLA_NAG.BIRD.falls=18-е средних месяцев лета и зимы в год птицы, на восходе солнца
reading.EarthLord.KI_KANG_ZLA_NAG.DOG=Работа с землёй, камнем и глиной сегодня идёт плохо.
reading.EarthLord.KI_KANG_ZLA_NAG.DOG.falls=8-е последних месяцев лета и зимы в год собаки
reading.EarthLord.KI_KANG_ZLA_NAG.PIG=Работа с деревом и вынос покойника сегодня идут плохо.
reading.EarthLord.KI_KANG_ZLA_NAG.PIG.falls=30-е первых месяцев осени и весны в год свиньи
reading.EarthLord.KI_KANG_ZLA_NAG.MOUSE=Погребальные обряды сегодня идут плохо.
reading.EarthLord.KI_KANG_ZLA_NAG.MOUSE.falls=полнолуние средних месяцев осени и весны в год мыши
reading.EarthLord.KI_KANG_ZLA_NAG.OX=Богатство, выведенное сегодня из дома, ослабляет удачу дома (གཡང, g.yang), и он впадает в бедность.
reading.EarthLord.KI_KANG_ZLA_NAG.OX.falls=22-е последних месяцев осени и весны в год быка, в сумерках, когда засыпают птицы
reading.EarthLord.KI_KANG_ZLA_NAG.remedy=нарисовать свастику справа от двери, а солнце и луну слева, как для чёрных дней
reading.SeasonSign.RISHI=Семь дней мудреца (དྲང་སྲོང་རི་ཏི, drang srong ri ti): когда звезда мудреца впервые восходит на рассвете, все семь дней воды обретают свои восемь качеств — по проклятию мудреца.
reading.SeasonSign.RISHI.falls=с даты, в которую среднее солнце точного счёта достигает 10 лунных созвездий, 43 чуцо (ཆུ་ཚོད, chu tshod) и 30 чусанг (ཆུ་སྲང, chu srang)
reading.SeasonSign.PIG=Семь дней свиньи (ཕག་ཞག, phag zhag): дождь падает ядом, а сила зерна слабеет. В рассказе сутры «Мудрый и глупый» (མཛངས་བླུན, mdzangs blun) свинья кладбища (དུར་ཕག, dur phag) взбирается на дерево у горы Меру (རི་རབ, ri rab). Три дня она лезет вверх, день проводит на вершине и три дня спускается.
reading.SeasonSign.PIG.falls=с даты, в которую среднее солнце точного счёта достигает 5 лунных созвездий, 46 чуцо (ཆུ་ཚོད, chu tshod) и 30 чусанг (ཆུ་སྲང, chu srang)
reading.Comet=Комета с длинным хвостом (དུ་བ་མཇུག་རིང, du ba mjug ring) отмечена на этот месяц счётом — знамение доброго и дурного. Она может появиться и тогда, когда счёт её не отмечает. Придя, она видна сперва как звезда, потом с дымным хвостом, потом снова как звезда и не гаснет раньше трёх месяцев.
reading.Comet.falls=из лет, прошедших с начала рабджунга (རབ་བྱུང, rab byung), и месяцев с 3-го исправленное число месяцев с прибавленными 3 делится на 75 без остатка

# Год жизни: стихийное гадание о году жизни (WB vol. 1, pp. 255-258, 380-411; «Лунные лучи»), SPEC §5.9
BasicSign.PRESENT_YEAR=текущий год
BasicSign.LOG_MEN=смещённый знак
BasicSign.TRIGRAM=триграмма
BasicSign.SME_BA=мева
BasicSign.SECTOR=стадия энергии
BasicSign.HOUR=час расчёта
Sector.TAKING_BREATH=стадия вдоха
Sector.IN_THE_WOMB=стадия в утробе
Sector.BODY_COMPLETE=стадия, когда тело сложилось
Sector.BIRTH=стадия рождения
Sector.BATHING=стадия омовения
Sector.DRESSING=стадия облачения
Sector.WORKING=стадия труда
Sector.FLOURISHING=стадия расцвета
Sector.DECLINE=стадия упадка
Sector.ILLNESS=стадия болезни
Sector.DEATH=стадия смерти
Sector.ENTERING_THE_TOMB=стадия могилы
HarshYear.OWN_YEAR=свой год
HarshYear.SEVENTH=седьмой
HarshYear.TRIAD=своя триада
HarshYear.FOURTH_UP=четвёртый вверх
HarshYear.FOURTH_DOWN=четвёртый вниз
HarshYear.LOG_MEN_OWN=смещённый знак на своём
HarshYear.LOG_MEN_SEVENTH=смещённый знак на седьмом
HarshYear.LOG_MEN_ENEMY=смещённый знак против жизненной силы
LogMenPlace.SKY_DOOR=небесные врата
LogMenPlace.EARTH_DOOR=земные врата
LogMenPlace.RUIN=разорение
LogMenPlace.SEPARATION=разлука
LogMenPlace.LINEAGE_CUT=пресечение рода
LogMenPlace.GAIN=достаток
SmeBaObstacle.HOUSE=препятствие дома
SmeBaObstacle.BED=препятствие ложа
SmeBaObstacle.LAND=препятствие земли
SmeBaObstacle.ROYAL_GATE=царские врата закрыты
reading.YearCare={0} Что бы ни показал год, его чёрные камни следует лечить всерьёз, а обряды соразмерять с тем, что важнее всего, со своим достатком, местом и временем. Для людей высокого положения или учёности важнее всего конь ветра.
reading.YearCare.MAN=Для мужчины драгоценнее всего жизненная сила: её камни считают первыми и её чёрные камни исправляют первыми.
reading.YearCare.WOMAN=Для женщины драгоценнее всего могущество: его камни считают первыми и его чёрные камни исправляют первыми.
reading.YearCare.CHILD=Для ребёнка драгоценнее всего тело: его камни считают первыми и его чёрные камни исправляют первыми.
reading.YearCare.GENERAL=Для мужчины драгоценнее всего жизненная сила, для ребёнка тело, для женщины могущество.
reading.YearPebble={0} Каждый знак года кладёт свои камни на аспект: белые, где он питает стихию аспекта или ей друг, чёрные, где он с ней борется.
reading.YearPebble.VITALITY.W3=Три белых камня на жизненной силе, лучшее, что она может нести: жизненная сила процветает. Её образ — растущее древо жизни и воздвигнутый золотой мост из драгоценностей. Добрая родня по отцу за спиной, демоны (བདུད, bdud) подавлены, божества-защитники парят над головой. Тревоги о смерти и потерях нет.
reading.YearPebble.VITALITY.W2=Два белых камня на жизненной силе: она встречает друга, и препятствие для жизни прийти не может. Пища наполняет рот, зрелища — глаза. Желания исполняются, заслуги растут, добрые божества-защитники выходят навстречу.
reading.YearPebble.VITALITY.W1=Один белый камень на жизненной силе: благоприятно. Ничто не стоит на пути жизни, которую она держит.
reading.YearPebble.VITALITY.B2=Два чёрных камня на жизненной силе, худшее, что она может нести: в этом году жизненная сила под гнётом, и её следует лечить всерьёз. Её образ — ломающееся древо жизни и золотой мост, рушащийся с основания. Стихия встречает конец своего срока, и печаль приходит, хотя вины нет.
reading.YearPebble.VITALITY.B2.remedy=спасайте жизни обречённых и не убивайте; чтите могилы и подавляйте их духов; совершайте обряды долгой жизни, выкупайте ла, жизненный дух (བླ, bla), и читайте дхарани долгой жизни
reading.YearPebble.VITALITY.B2.spirits=над головой кружит чёрная птица демонов (བདུད, bdud), внизу кусает чёрный пёс вредоносных духов умерших, нарушивших обеты (དམ་སྲི, dam sri)
reading.YearPebble.VITALITY.B1=Один чёрный камень на жизненной силе: неблагоприятно, и это следует исправить. Её образ — сохнущий корень древа жизни. Дух разорения поднимается со снежных вершин, скрытый от гадания и расчёта.
reading.YearPebble.VITALITY.B1.remedy=стократно выкупайте ла, жизненный дух (བླ, bla), обрядами долгой жизни, подавите духа разорения и перенесите постель
reading.YearPebble.VITALITY.WB=Один белый и один чёрный камень на жизненной силе: смешанно, и ещё не решено. Её образ — добрые богини и чёрные птицы демонов (བདུད, bdud), играющие в кости на драгоценную жизнь, пока уста препираются.
reading.YearPebble.VITALITY.WB.remedy=поскорее совершите обряды за себя и отвратите несчастья и потери
reading.YearPebble.BODY.W3=Три белых камня на теле, лучшее, что оно может нести: сила и бодрость растут, божества-помощники идут впереди. Хоть лихорадки пылают, вы не слегаете. Хоть льётся оружие, кровь ваша не пролита. Вам покойно и нет тяжб, а ребёнок рождается мальчиком.
reading.YearPebble.BODY.W2=Два белых камня на теле: благоприятно. Болезнь уходит, ум свободен от печали. Горе проходит, ссоры утихают, опора тела хороша.
reading.YearPebble.BODY.W1=Один белый камень на теле: божество его не хранит, но и вредоносный дух не трогает. Оно стоит как раскидистое дерево.
reading.YearPebble.BODY.B2=Два чёрных камня на теле, худшее, что оно может нести: в этом году болезнь кружит вокруг него, и её следует лечить всерьёз. Ум страдает, ложе болезни изнашивается. Врачи — постоянные гости, духов чтят как богов, и болезнь длится долго.
reading.YearPebble.BODY.B2.remedy=примите обеты или смените облик, храните обеты и носите защиту; чините дороги, делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha), обновляйте облачения ступ и подносите светильники
reading.YearPebble.BODY.B1=Один чёрный камень на теле: его стихия слабеет, приходят болезнь и острое страдание. Половина запасов уходит духам, половина пищи — на лекарства. Плоти, костям и коже неспокойно, ум тревожен.
reading.YearPebble.BODY.B1.remedy=смените облик и имя, давайте и подносите, храните обеты и совершайте сильные обряды для укрепления тела
reading.YearPebble.BODY.WB=Один белый и один чёрный камень на теле: смешанно. Боги и другие духи спорят за него, как в игре в кости, и могут прийти страх и испуг. Для женщины это знак родов, которые она переживёт.
reading.YearPebble.BODY.WB.remedy=смените облик и носите защиту
reading.YearPebble.DESTINY.W3=Три белых камня на могуществе, лучшее, что оно может нести: плоды желаний зреют. Урожай и стада хороши, доход велик, торговля приносит большую прибыль. Вы обретаете поле, дом и землю, а богатство набухает, как молоко, переливающееся через белую медную чашу.
reading.YearPebble.DESTINY.W2=Два белых камня на могуществе: оно встречает друга. Урожай и стада хороши, задуманное достигается. Люди, богатство, стада и дети умножаются, желания исполняются.
reading.YearPebble.DESTINY.W1=Один белый камень на могуществе: искомое вовне не находится, но то, что внутри, не теряется. Кладовая богача не пустеет, доход средний.
reading.YearPebble.DESTINY.B2=Два чёрных камня на могуществе, худшее, что оно может нести: в этом году богатство утекает, и это следует лечить всерьёз. Поднимается дух разорения, отнимающий богатство. Запас пищи пустеет, гибнет конь под седлом, урожай не родится, торговля приносит мало.
reading.YearPebble.DESTINY.B2.remedy=чтите монахов чистой нравственности, подносите светильники в храмах, устройте угощение для детей и отпускайте животных; чините дороги, делайте много глиняных обетных изображений (ཚ་ཚ, tsha tsha), давайте водные подношения и милостыню
reading.YearPebble.DESTINY.B1=Один чёрный камень на могуществе: его пища и богатство перевёрнуты. Поднимаются духи голода и утраты, стада не дают молока, домовые крадут из кладовых. Пищи и богатства не найти, заслуги убывают.
reading.YearPebble.DESTINY.B1.remedy=совершайте обряды, поднимающие могущество, чтите посвящённых монахов и устройте большое угощение для тех, кто не может отплатить
reading.YearPebble.DESTINY.WB=Один белый и один чёрный камень на могуществе: смешанно. Пища и богатство переливаются через край и проливаются, приходят потери. Богатство зыбко, как мираж в зной, сегодня есть, завтра нет, и на него нельзя положиться.
reading.YearPebble.LUCK.W3=Три белых камня на коне ветра, лучшее, что он может нести: заслуги растут, ваше положение выше неба. Правители держат свои престолы, сила держателя мантр проявляется. Путешествия идут хорошо, ваши слова весомы, и ничто не мешает делу.
reading.YearPebble.LUCK.W2=Два белых камня на коне ветра: никто вас не унижает, и в расцвете лет ваше положение выше неба. Мужчина побеждает в собрании, женщина обретает доброе имя. Молитвы богам услышаны, а практика против врагов действует.
reading.YearPebble.LUCK.W1=Один белый камень на коне ветра: он как золото и бирюза на одной нити. Не приходят ни враги, ни грабители, ни внезапные несчастья, ни сплетни, ни ссоры.
reading.YearPebble.LUCK.B2=Два чёрных камня на коне ветра, худшее, что он может нести: в этом году его заслуги ломаются, и это следует лечить всерьёз. Те, кого вы считали роднёй или друзьями, обращаются против вас, враги приходят из близких. Вор поднимается из сокровищницы, и запертая внешняя дверь мало помогает.
reading.YearPebble.LUCK.B2.remedy=подавляйте духов вражды и отвращайте врагов, стройте мосты и чините дороги, чтите монахов и поднимайте коня ветра
reading.YearPebble.LUCK.B1=Один чёрный камень на коне ветра: одежда носится, но удача пуста. Родня, о которой вы заботились, становится врагами, служба не по нраву господину, упрёк ламы умаляет заслуги. Многие о вас сплетничают.
reading.YearPebble.LUCK.B1.remedy=чините дороги и мосты, отвращайте сплетни, подавляйте духов вражды и поднимайте коня ветра
reading.YearPebble.LUCK.WB=Один белый и один чёрный камень на коне ветра: смешанно. Белое и чёрное играют в кости на знамени его заслуг. Великие люди добры, но дурные восстают против вас, и удар может прийти от своей же родни.
reading.YearPebble.LUCK.WB.remedy=держитесь подальше от врагов и читайте защитные дхарани
reading.YearPredictive={0} Предсказательный камень считает место каждого знака на аспекте один раз, по его цвету, а место двух цветов — ни за одну сторону; его кладут на то, каких мест больше, белых или чёрных, пёстрым — если их поровну, и он даёт предсказание аспекта на год.
reading.YearPredictive.VITALITY.WHITE=Предсказательный камень жизненной силы белый: благоприятно. Древо жизни не ломается, вверху не кружит чёрная птица, внизу не кусает чёрный пёс. Препятствие для жизни не приходит, дух не хватает, и нет лика смерти или потери.
reading.YearPredictive.BODY.WHITE=Предсказательный камень тела белый: благоприятно. Древо тела не падает, нет лика болезни или лихорадки. Путешествия идут хорошо, задуманное достигается сразу, внезапная болезнь не приходит.
reading.YearPredictive.DESTINY.WHITE=Предсказательный камень могущества белый: благоприятно. Пища наполняет рот, богатство — руку, одежда покрывает спину. Урожай и стада хороши, и даже в пустой долине вы находите свою долю пищи.
reading.YearPredictive.LUCK.WHITE=Предсказательный камень коня ветра белый: благоприятно. Сеть удачи не падает, заслуги можно поднять, не приходят ни враги, ни сплетни. Несчастье на вас не падает, слава остаётся, и всё, что вы делаете, удаётся.
reading.YearPredictive.VITALITY.BLACK=Предсказательный камень жизненной силы чёрный: неблагоприятно, и жизненную силу в этом году следует исправить. Её образ — ломающееся древо жизни и распадающееся колесо жизни. Гадания и сны дурны, и есть лик ножа.
reading.YearPredictive.VITALITY.BLACK.remedy=спасайте обречённых животных, выкупайте узников и стройте мосты; выкупайте ла, жизненный дух (བླ, bla), и призывайте жизнь; облачайте ступы, чините дороги и совершайте обряды, восстанавливающие ослабевшую жизненную силу
reading.YearPredictive.VITALITY.BLACK.spirits=вверху кружит птица, внизу кусает чёрный пёс
reading.YearPredictive.BODY.BLACK=Предсказательный камень тела чёрный: неблагоприятно, и тело в этом году следует исправить. Болезнь приходит и задерживается, вечера и утра безрадостны. Одна нога на сухом, другая в мокром, и когда хочется остаться, тянет уйти.
reading.YearPredictive.BODY.BLACK.remedy=пригласите Сангху учить, носите одежду матери, смените имя, храните обет поста и совершайте обряды для ослабевшего тела
reading.YearPredictive.DESTINY.BLACK=Предсказательный камень могущества чёрный: неблагоприятно, и могущество в этом году следует исправить. Ограда его счастья ломается. Стадам и урожаю плохо, торговля приносит потери, приходят воры, нежданно поднимаются враги.
reading.YearPredictive.DESTINY.BLACK.remedy=подавляйте духов вражды и остерегайтесь ссор; призывайте жизнь и благоденствие и совершайте обряды, восстанавливающие могущество
reading.YearPredictive.LUCK.BLACK=Предсказательный камень коня ветра чёрный: неблагоприятно, и коня ветра в этом году следует исправить. Сеть его защиты падает. Близкие становятся врагами, соседи ворами, приходят обвинения без вины, и на вас падает непосильная ноша или чужой долг.
reading.YearPredictive.LUCK.BLACK.remedy=делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) и водные подношения, по одному на каждый год жизни; отсылайте изображения людей и зверей в сторону врага; будьте осторожны в речи и поведении, особенно вдали от дома, и совершайте обряды, восстанавливающие коня ветра
reading.YearPredictive.LUCK.BLACK.illness=неспокойно голове и верхней части тела
reading.YearPredictive.VITALITY.SPECKLED=Предсказательный камень жизненной силы пёстрый: белых и чёрных мест поровну. Он читается как один белый и один чёрный камень: смешанно, и ещё не решено; добрые богини и чёрные птицы демонов (བདུད, bdud) играют в кости на драгоценную жизнь. Не засчитанный ни за одну сторону, он несколько слаб и клонится к дурному.
reading.YearPredictive.VITALITY.SPECKLED.remedy=поскорее совершите обряды за себя и отвратите несчастья и потери
reading.YearPredictive.BODY.SPECKLED=Предсказательный камень тела пёстрый: белых и чёрных мест поровну. Он читается как один белый и один чёрный камень: смешанно; боги и другие духи спорят за тело, как в игре в кости, и могут прийти страх и испуг; для женщины — роды, которые она переживёт. Не засчитанный ни за одну сторону, он несколько слаб и клонится к дурному.
reading.YearPredictive.BODY.SPECKLED.remedy=смените облик и носите защиту
reading.YearPredictive.DESTINY.SPECKLED=Предсказательный камень могущества пёстрый: белых и чёрных мест поровну. Он читается как один белый и один чёрный камень: смешанно; пища и богатство переливаются через край и проливаются, и богатство зыбко, как мираж в зной. Не засчитанный ни за одну сторону, он несколько слаб и клонится к дурному.
reading.YearPredictive.LUCK.SPECKLED=Предсказательный камень коня ветра пёстрый: белых и чёрных мест поровну. Он читается как один белый и один чёрный камень: смешанно; белое и чёрное играют в кости на знамени его заслуг, и удар может прийти от своей же родни. Не засчитанный ни за одну сторону, он несколько слаб и клонится к дурному.
reading.YearPredictive.LUCK.SPECKLED.remedy=держитесь подальше от врагов и читайте защитные дхарани
reading.YearPredictive.ALL_WHITE=Все четыре предсказательных камня белые: образ этого — перевал счастья. Очень плохо, если это приходит к старым. Молодым это приносит потери и горе поблизости.
reading.YearPredictive.ALL_BLACK=Все четыре предсказательных камня чёрные: очень плохо, и весь год следует лечить всерьёз.
reading.YearPredictive.ALL_BLACK.remedy=смените имя, практикуйте ради долгой жизни и получите посвящение долгой жизни, давайте чисто, не цепляясь за дающего, дар и получающего
# The year of age together (ROADMAP R4, D17): the four classes gathered (WB vol. 1, p. 385) and each obstacle graded by the notes (vol. 2, pp. 492–495).
ObstacleGrade.GRAVE=тяжело
ObstacleGrade.MILD=мягко
ObstacleGrade.GRAVE.HARSH=суров для вас
ObstacleGrade.GRAVE.TOMB=великая опасность
ObstacleGrade.MILD.TOMB=малая опасность
ObstacleGrade.GRAVE.NINE_TOMB=плохо
ObstacleGrade.MILD.NINE_TOMB=мягко
ObstacleGrade.GRAVE.UNDERTAKER=плохо
reading.YearTogether={0} Препятствий года много, но вкратце они сводятся к четырём: жизненной силе, телу, могуществу и коню ветра. Прежде всего собирают приговоры этих четырёх классов (སྡེ་བཞི, sde bzhi).
reading.YearTogether.WHITE=Аспект, который для вас важнее всего, в этом году белый: благоприятно, и остальные приговоры года читаются рядом с ним.
reading.YearTogether.BLACK=Аспект, который для вас важнее всего, в этом году чёрный: неблагоприятно, и его следует исправить первым.
reading.YearTogether.SPECKLED=Аспект, который для вас важнее всего, в этом году пёстрый: смешанно, с наклоном к дурному, и его следует исправить первым.
reading.YearGrade={0} Каждое препятствие года взвешивают, сталкивая его год с вашими жизненной силой, телом, могуществом и конём ветра, как кладут камень. Главной берут жизненную силу.
reading.YearGrade.HARSH.GRAVE=Этот суровый год встречает один или несколько ваших аспектов как их враг, и потому для вас он суров всерьёз.
reading.YearGrade.TOMB.GRAVE=Могильный год встречает вашу жизненную силу как её же саму, вашу собственную могилу, или как её врага, могилу убийцы: великая опасность.
reading.YearGrade.TOMB.MILD=Могильный год встречает вашу жизненную силу как её мать, друга или ребёнка: лишь малая опасность.
reading.YearGrade.NINE_TOMB.GRAVE=Ваша жизненная сила сталкивается с могуществом могильного года этой девятки и встречает его как себя саму или как своего врага: плохо.
reading.YearGrade.NINE_TOMB.MILD=Ваша жизненная сила сталкивается с могуществом могильного года этой девятки и встречает его как свою мать, друга или ребёнка: мягко.
reading.YearGrade.UNDERTAKER.GRAVE=Год могильщика встречает один или несколько ваших аспектов как их враг: плохо, прежде всего для жизненной силы.
reading.YearSector={0} Энергия стихии проходит двенадцать стадий, как жизнь, от вдоха до могилы, по одной на каждое животное года. Шесть стадий хороши, шесть дурны.
reading.YearSector.FLOURISHING=Энергия стихии в этом году в стадии расцвета: найдено великое сокровище. Лучшая из хороших стадий, она кладёт три белых камня.
reading.YearSector.WORKING=Энергия стихии в этом году в стадии труда: долговечность. Лучшая из хороших стадий, она кладёт три белых камня.
reading.YearSector.DRESSING=Энергия стихии в этом году в стадии облачения: способность выдержать. Средняя из хороших стадий, она кладёт два белых камня.
reading.YearSector.BATHING=Энергия стихии в этом году в стадии омовения: желания исполняются. Средняя из хороших стадий, она кладёт два белых камня.
reading.YearSector.BODY_COMPLETE=Энергия стихии в этом году в стадии, когда тело сложилось: наделённость счастьем. Низшая из хороших стадий, она кладёт один белый камень.
reading.YearSector.BIRTH=Энергия стихии в этом году в стадии рождения: великое богатство. Низшая из хороших стадий, она кладёт один белый камень.
reading.YearSector.TAKING_BREATH=Энергия стихии в этом году в стадии вдоха: удача исчерпана. Лучшая из дурных стадий, она кладёт один белый и один чёрный камень.
reading.YearSector.TAKING_BREATH.remedy=отошлите девять нитяных крестов (མདོས, mdos) чёрной женщины или нитяной крест восполнения
reading.YearSector.TAKING_BREATH.spirits=за вредом стоит большая чёрная женщина на чёрной овце, с чёрной птицей, желающая красных торм (གཏོར་མ, gtor ma) и пира; вредит чёрная женщина с красной тормой, дух разорения родни по матери
reading.YearSector.IN_THE_WOMB=Энергия стихии в этом году в стадии в утробе: падение в несчастье. Лучшая из дурных стадий, она кладёт один белый и один чёрный камень.
reading.YearSector.IN_THE_WOMB.remedy=отошлите тайный нитяной крест (མདོས, mdos) мужа
reading.YearSector.IN_THE_WOMB.spirits=за вредом стоит Дордже Легпа (རྡོ་རྗེ་ལེགས་པ, rdo rje legs pa) на большом баране, с девятиконечной железной ваджрой; вредит великий кордаг (དཀོར་བདག, dkor bdag) на синем льве, пожирающий стада
reading.YearSector.DECLINE=Энергия стихии в этом году в стадии упадка: разлука. Средняя из дурных стадий, она кладёт один чёрный камень.
reading.YearSector.DECLINE.remedy=прежде всего совершите обряд, отвращающий лик демонов (བདུད, bdud), и придавите их ступой
reading.YearSector.DECLINE.spirits=за вредом стоит тусклый чёрный демон (བདུད, bdud), чёрный человек на чёрном коне с арканом; вредит чёрный демон с верёвкой из золота и бирюзы, владыка препятствующих духов
reading.YearSector.ILLNESS=Энергия стихии в этом году в стадии болезни: разорение и тяжбы. Средняя из дурных стадий, она кладёт один чёрный камень.
reading.YearSector.ILLNESS.remedy=отошлите крест гьялпо (རྒྱལ་མདོས, rgyal mdos), метните гневную торму (གཏོར་མ, gtor ma) и совершите огненное подношение
reading.YearSector.ILLNESS.spirits=за вредом стоят духи гьялпо (རྒྱལ་པོ, rgyal po) промежутка, белый человек на белом коне с белым шёлком; чёрный человек с железной бородой набрасывает чёрный аркан на людей и скот
reading.YearSector.DEATH=Энергия стихии в этом году в стадии смерти, одиннадцатой из двенадцати: благоденствие убывает. Худшая из стадий, она кладёт два чёрных камня.
reading.YearSector.DEATH.remedy=совершайте подношения небесному псу (གནམ་ཁྱི, gnam khyi) и выполняйте его практику приближения (བསྙེན་པ, bsnyen pa)
reading.YearSector.DEATH.spirits=за вредом стоит чёрный сын демонов (བདུད, bdud) в белой маске, ведущий красного лу-цена (ཀླུ་བཙན, klu btsan); духи, прыгающие как тигры, обезьяны и грифы, пляшут на месте богов
reading.YearSector.ENTERING_THE_TOMB=Энергия стихии в этом году в стадии могилы, последней из двенадцати: род прерывается, великая кара. Худшая из стадий, она кладёт два чёрных камня.
reading.YearSector.ENTERING_THE_TOMB.remedy=отошлите нитяной крест (མདོས, mdos) трёх ма-мо (མ་མོ, ma mo), главной и её свиты; совершите девять кругов против вредоносных духов умерших, нарушивших обеты (དམ་སྲི, dam sri), и сенмо (བསེན་མོ, bsen mo) и метните гневную торму (གཏོར་མ, gtor ma)
reading.YearSector.ENTERING_THE_TOMB.spirits=за вредом стоит славная чёрная Ремати (རེ་མ་ཏི, re ma ti) на трёхногом муле, с мешком болезней; чёрные женщины-духи со спутанными волосами и красными глазами вредят детям
reading.LogMen={0} Смещённый знак (ལོག་མེན, log men) движется на один знак в год по шестидесяти. Его стихия показывает, чьих дел он касается: дерево — рода отца, огонь — детей и женской линии, земля — дома и жилища, железо — богатства, друзей и божеств-защитников, вода — ньен (གཉན, gnyan), дорог и четырёх рубежей.
reading.LogMen.SKY_DOOR=На небесных вратах, у мужчины собака, у женщины дракон, с неба может сойти мор. Не кладите новую кровлю на дом, не клянитесь и не берите новую собаку. Остерегайтесь молнии и очага.
reading.LogMen.SKY_DOOR.remedy=закройте небесные врата их обрядом и читайте сто имён Акашагарбхи и отвращение Ушниши
reading.LogMen.EARTH_DOOR=На земных вратах, у мужчины свинья, у женщины змея, поднимаются духи разорения, и вред приходит с низин. Распространяются болезни нагов (ཀླུ, klu), проказа, язвы и нарывы. Не закладывайте фундаментов и не копайте землю.
reading.LogMen.EARTH_DOOR.remedy=читайте дхарани Кшитигарбхи, подавите духов разорения и закройте земные врата; пусть трое людей разных родов прочтут «Махамаюри» тринадцать раз
reading.LogMen.RUIN=На разорениях, бык и овца, приходят тяжбы. Будьте осторожны в торговле на чужбине, с врагами, ворами и грабителями.
reading.LogMen.RUIN.remedy=делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha), отвращайте врагов, читайте «Стотысячную», чтите божеств богатства и местное божество и подавляйте духов утраты
reading.LogMen.SEPARATION=На разлуках, птица и обезьяна, супруги могут расстаться. Остерегайтесь драк, ссор и раздоров между супругами, болезни и темницы.
reading.LogMen.SEPARATION.remedy=совершите обряды против разлуки, оставьте свою мельницу открытой на три дня, получите посвящение долгой жизни и отошлите нитяной крест (མདོས, mdos)
reading.LogMen.LINEAGE_CUT=На пресечениях рода, мышь и лошадь, сплетни и несчастья приходят в род отца. Оставьте грабёж и засады, кражу, драки, тяжбы и тайные дела, большие и малые.
reading.LogMen.LINEAGE_CUT.remedy=читайте «Ушнишу ваджрного когтя» и обряды отвращения, побивайте сплетни, подавляйте и отвращайте врагов
reading.LogMen.GAIN=На прибылях, тигр и заяц, год очень хорош. Молитвы богам услышаны, искомое богатство находится, а практика против врагов действует.
reading.LogMen.NONE=Его животное для вас ни врата, ни одна из пятёрок.
reading.Harsh={0} Это одно из препятствий, падающих в году на драгоценное человеческое тело.
reading.Harsh.OWN_YEAR.SON=Ваше животное взошло годом, в 13-м или 73-м году, его стихия — ребёнок вашей. Приходит болезнь, и враги поднимаются против благоденствия. Важнее всего тело и могущество.
reading.Harsh.OWN_YEAR.SON.remedy=читайте «Восемь явлений» и пять великих дхарани, поднимайте славу, отвращайте и подавляйте врагов
reading.Harsh.OWN_YEAR.FRIEND=Ваше животное взошло годом, в 25-м, его стихия — друг вашей: препятствие возвращающегося дыхания, сегодня здоров, завтра нет. Поднимаются разорение, тяжбы и духи несчастья. Для мужчины важнее всего жизненная сила, для женщины могущество.
reading.Harsh.OWN_YEAR.FRIEND.remedy=читайте «Дхваджагру», «Ваджравидарану» и «Сутру Амитаюса»
reading.Harsh.OWN_YEAR.ENEMY=Ваше животное взошло годом, в 37-м, его стихия — враг вашей: препятствие демонского пресечения. Молодым оно приносит болезни и потери. Важнее всего могущество.
reading.Harsh.OWN_YEAR.ENEMY.remedy=читайте «Праджняпарамиту» и «Дхваджагру», выкупайте жизнь дхарани долгой жизни, подавляйте и изгоняйте духов утраты
reading.Harsh.OWN_YEAR.MOTHER=Ваше животное взошло годом, в 49-м, его стихия — мать вашей: нисходит слава. Торговля, друзья и доход велики, важнее всего конь ветра.
reading.Harsh.OWN_YEAR.IDENTITY=Ваше животное взошло годом, в 61-м, его стихия — ваша же: препятствие разлуки. Приходят разлука, болезнь и страдание, а для мужчины демонское пресечение. Важнее всего жизненная сила.
reading.Harsh.OWN_YEAR.IDENTITY.remedy=пусть люди пяти родов прочтут «Стотысячную»; делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) и обряды против разлуки, отвращайте болезнь и поднимайте славу
reading.Harsh.SEVENTH.ENEMY=Седьмое от вашего животного взошло годом, как год лошади для рождённого в год мыши. В 7-м или 67-м году это убийца, пресекающий жизнь.
reading.Harsh.SEVENTH.ENEMY.remedy=выкупайте жизнь молитвами
reading.Harsh.SEVENTH.MOTHER=Седьмое от вашего животного взошло годом, как год лошади для рождённого в год мыши. В 19-м или 79-м году оно приносит славу, время, когда удаются торговля и богатство.
reading.Harsh.SEVENTH.IDENTITY=Седьмое от вашего животного взошло годом, как год лошади для рождённого в год мыши. В 31-м году оно приносит разлуку.
reading.Harsh.SEVENTH.IDENTITY.remedy=совершите обряды против разлуки
reading.Harsh.SEVENTH.SON=Седьмое от вашего животного взошло годом, как год лошади для рождённого в год мыши. В 43-м году это враг благоденствия.
reading.Harsh.SEVENTH.SON.remedy=призывайте благоденствие и поднимайте могущество
reading.Harsh.SEVENTH.FRIEND=Седьмое от вашего животного взошло годом, как год лошади для рождённого в год мыши. В 55-м году это враг возвращающегося дыхания, время, когда хорошее и дурное меняются местами.
reading.Harsh.TRIAD=Одно из двух других животных вашей тройки взошло годом, с той же удачей, что и ваша: теряются богатство и пропитание, беда приходит со стороны матери, со сплетнями, болезнями и тяжбами. Не разрушайте тёмных домов и избегайте дальних путешествий.
reading.Harsh.TRIAD.remedy=остерегайтесь убийства и осквернения от мёртвых; чтите мужское божество и божеств войны и совершайте обряды, отвращающие врагов
reading.Harsh.FOURTH_UP=Четвёртое животное, отсчитанное вверх от вашего, взошло годом, как бык для дракона. Это один из четырёх убийц, тот, что приносит болезнь.
reading.Harsh.FOURTH_UP.remedy=читайте за больных и совершайте белые обряды; отвратите его выкупом и читайте «Двадцатитысячную»
reading.Harsh.FOURTH_DOWN=Четвёртое животное, отсчитанное вниз от вашего, взошло годом, как овца для дракона. Это один из четырёх убийц, тот, что грозит смертью.
reading.Harsh.FOURTH_DOWN.remedy=выкупайте жизнь и отвращайте его, читайте «Двадцатитысячную»
reading.Harsh.LOG_MEN_OWN=Смещённый знак пришёл на ваш знак рождения: собственное тело вас не несёт, и на вас падает непосильная ноша.
reading.Harsh.LOG_MEN_SEVENTH=Смещённый знак стоит на седьмом от вашего знака рождения: он достигает места перед пресекающим жизнь, и год плох.
reading.Harsh.LOG_MEN_ENEMY=Стихия смещённого знака — враг вашей жизненной силы: демонское пресечение, и год плох.
reading.NineMultiple={0} Каждый девятый год жизни, с 9-го по 81-й, — девятка (དགུ་མིག, dgu mig). Она тяжелее, когда её знак ещё и враг, убийца или могила.
reading.NineMultiple.MALE.9=9-й, дракон под триграммой огня (ལི, li), — великий позор юных, плохо для малых детей. Его образ — небесное лекарство, роняющее ребёнка с колен, и опустевшая площадка для игр у богов.
reading.NineMultiple.MALE.18=18-й, овца под триграммой земли (ཁོན, khon), приносит мужчине в расцвете ножи и колющие боли. Благоденствие убывает, его образ — ведро, текущее со дна.
reading.NineMultiple.MALE.27=27-й, собака под триграммой озера (དྭ, dwa), уносит могущество к ворам, с ликом ножей и оружия. Его образ — гриф, привязанный к камню.
reading.NineMultiple.MALE.36=36-й, бык под триграммой неба (ཁེན, khen), — великий позор мужчины в расцвете: враги и три утраты. Приходят внезапный испуг и потеря богатства, с осквернением и ликом ножей. Его образ — сломанное крыло бирюзовой пчелы.
reading.NineMultiple.MALE.45=45-й, дракон под триграммой воды (ཁམ, kham), поднимает тяжёлую болезнь, с осквернением и ядом. Его образ — лев, упавший в водяную яму.
reading.NineMultiple.MALE.54=54-й, овца под триграммой горы (གིན, gin), приносит болезнь от богов, время смерти и потерь.
reading.NineMultiple.MALE.63=63-й, собака под триграммой грома (ཟིན, zin), — великий позор старика, время колющих болей и закупорок. Его образ — небесная ноша, рвущаяся в узком месте, и умирающий старый пёс.
reading.NineMultiple.MALE.72=72-й, бык под триграммой ветра (ཟོན, zon), приносит безумие и обмороки, врагов, угрозы войны и подстерегающие ножи.
reading.NineMultiple.MALE.81=81-й, дракон под триграммой огня (ལི, li), приносит лик красного и крови, и старые страшатся поветрий. Это время, когда падающее с неба сходит вниз.
reading.NineMultiple.FEMALE.9=9-й, бык под триграммой воды (ཁམ, kham), приносит пересуды, осквернение, болезни и поветрия и опасность для матери и ребёнка. Его образ — рвущаяся нить бирюзовых чёток.
reading.NineMultiple.FEMALE.18=18-й, дракон под триграммой неба (ཁེན, khen), — великий позор молодой женщины: источник жизни пересыхает. Поднимается пожирающий гьялпо (རྒྱལ་པོ, rgyal po), клятва женщины приносит смерть ребёнка, грозят падение с коня или обрыва, оползни и ножи.
reading.NineMultiple.FEMALE.27=27-й, овца под триграммой озера (དྭ, dwa), приносит колющие боли, несчастья, раздоры и осквернение. Женская линия обрывается, и ребёнок умирает.
reading.NineMultiple.FEMALE.36=36-й, собака под триграммой земли (ཁོན, khon), приносит горе, и язвы вредят деторождению. Его образ — кусающая железная волчица.
reading.NineMultiple.FEMALE.45=45-й, бык под триграммой огня (ལི, li), — великий позор женщины в расцвете, с ножами, оползнями и выкидышем. Его образ — старуха — владыка земли прежних времён, дошедшая до узкого места, и белая шёлковая юбка, текущая по подолу.
reading.NineMultiple.FEMALE.45.remedy=когда она дойдёт до узкого места, затворите границы (མཚམས་གཅོད, mtshams gcod)
reading.NineMultiple.FEMALE.54=54-й, дракон под триграммой ветра (ཟོན, zon), — великий позор старухи, с поветриями, сплетнями, выкидышем и болезнью. Его образ — заходящее солнце славы.
reading.NineMultiple.FEMALE.63=63-й, овца под триграммой грома (ཟིན, zin), приносит паралич, болезни голода и потери. Хозяйка дома может погибнуть от ножа.
reading.NineMultiple.FEMALE.72=72-й, собака под триграммой горы (གིན, gin), приносит вред от владык земли (ས་བདག, sa bdag) и проклятий, и опухоли. Стихия сына падает, и рождённый сын умирает.
reading.NineMultiple.FEMALE.81=81-й, бык под триграммой воды (ཁམ, kham), приводит вдовство к вашей двери.
reading.NineMultiple.remedy=поднесите светильники, пищу богам, глиняные обетные изображения (ཚ་ཚ, tsha tsha), Ушнишу и водные тормы (ཆུ་གཏོར, chu gtor), по девять каждого; поставьте стрелу для мужчины, веретено для женщины; сложите девять камней с девятью простираниями, говоря: «освобождён от девятки болезни и смерти»
reading.MewaObstacle={0} У мева (སྨེ་བ, sme ba) вашего года жизни четыре малых препятствия и двое врат.
reading.MewaObstacle.HOUSE=Оно падает на мева нынешнего года: препятствие дома. Стройка и починка, возведение ворот или притолоки связаны, и есть лик болезни.
reading.MewaObstacle.HOUSE.remedy=читайте «Золотой свет» и совершайте обряды отвращения
reading.MewaObstacle.BED=Оно падает на ваше натальное мева: препятствие ложа, собственные кости мева собраны. Вред, который оно приносит, идёт по цвету, под которым вы родились.
reading.MewaObstacle.BED.remedy=перенесите место сна и место родов
reading.MewaObstacle.BED.spirits=родившемуся под белым и падающему на белое нисходит собственный демон (བདུད, bdud), со ссорами и опасностью, а женщине вредит гьялпо (རྒྱལ་པོ, rgyal po); чёрное на чёрное — мужские демоны; синее на синее — боги и духи насылают болезнь; зелёное на зелёное — цари нагов (ཀླུ, klu), разгневанные рубкой деревьев и нечистотой; жёлтое на жёлтое — ньен (གཉན, gnyan) и владыки земли (ས་བདག, sa bdag), растревоженные стройкой; красное на красное — сплетни, для мужчины лик красного, для женщины выкидыш
reading.MewaObstacle.LAND=Оно падает на два чёрных: препятствие земли, его образ — чёрный шатёр, разбитый над головой. Желание трупа грозит старым или молодым, с внезапной болезнью и испугом.
reading.MewaObstacle.LAND.remedy=совершите собственные обряды мева
reading.MewaObstacle.ROYAL_GATE=Оно — враг вашего натального мева, или эти два — огонь и железо: царские ворота закрыты, и эту сторону следует охранять.
reading.MewaObstacle.ROYAL_GATE.remedy=отошлите туда выкупное изображение, по одному на каждый год жизни
reading.YearTrigram={0} Триграмма (སྤར་ཁ, spar kha) вашего года жизни сдвигается на одно место в год, у мужчины от триграммы огня (ལི, li), у женщины от триграммы воды (ཁམ, kham).
reading.YearTrigram.LI=Год под триграммой огня (ལི, li) связывает сплетни и драки, кровлю дома, отправку или приём невесты, осквернение очага, сожжение трупов и обжиг посуды. Не покупайте красных товаров, меди и красной посуды. Опасное время — осень, когда трава желтеет, и следует охранять запад и северо-запад.
reading.YearTrigram.LI.remedy=читайте Ушнишу, «Ваджравидарану» и «Сутру Амитаюса» и отошлите нитяной крест (མདོས, mdos)
reading.YearTrigram.LI.spirits=демоны (བདུད, bdud), наги (ཀླུ, klu), духи цен (བཙན, btsan), ма-мо (མ་མོ, ma mo) и духи гьялпо (རྒྱལ་པོ, rgyal po), и призраки убитых ножом или конём
reading.YearTrigram.LI.illness=болезни головы и органов чувств, глаз и сердца, кровяные лихорадки и горло, а у женщины кровотечения и выкидыш
reading.YearTrigram.KHON=Год под триграммой земли (ཁོན, khon) связывает возведение стен, закладку фундамента, вскрытие земли и возведение внешних ворот. Держитесь подальше от могил и осквернения от мёртвых, избегайте старого скота и овец и золота и бирюзы старухи. Следует охранять север и юго-восток.
reading.YearTrigram.KHON.remedy=читайте «Панчаракшу», «Кшитигарбху» и «Аватамсаку» и отошлите выкуп в виде овцы на юго-запад
reading.YearTrigram.KHON.spirits=владыки земли (ས་བདག, sa bdag), ма-мо (མ་མོ, ma mo), демоны (བདུད, bdud), ньен (གཉན, gnyan) и наги (ཀླུ, klu)
reading.YearTrigram.KHON.illness=болезни селезёнки, желчи и слизи, опухоли, кожные болезни и долгие внутренние болезни
reading.YearTrigram.DWA=Год под триграммой озера (དྭ, dwa) связывает колдовство, огненные подношения, войну, раскалывание скал, сожжение трупов, хождение в кузницу, брак, драки и красные горы. Не покупайте железных изделий, оружия и доспехов, остерегайтесь кузнечных орудий и полночи. Следует охранять восток и юг.
reading.YearTrigram.DWA.remedy=читайте «Намасангити» и дхарани долгой жизни, делайте много глиняных обетных изображений (ཚ་ཚ, tsha tsha) и отошлите выкуп в виде птицы или обезьяны на запад
reading.YearTrigram.DWA.spirits=духи цен (བཙན, btsan) и призраки насильственно убитых, со стрелами и ножами
reading.YearTrigram.DWA.illness=колющие боли, болезни лёгких, сердца и костей, внезапные опухоли и боли в левом боку
reading.YearTrigram.KHEN=Год под триграммой неба (ཁེན, khen) связывает пал в горах, войну, опасные тропы, снос или кровлю дома и погребальные обряды. Не торгуйте собаками и белыми конями и не спите в храмах. Следует охранять юг и восток.
reading.YearTrigram.KHEN.remedy=читайте «Золотой свет», «Аватамсаку» и «Сутру сердца», подавляйте духов могил, стройте ступы и глиняные обетные изображения (ཚ་ཚ, tsha tsha) и отошлите выкуп в виде собаки на северо-запад
reading.YearTrigram.KHEN.spirits=духи гьялпо (རྒྱལ་པོ, rgyal po), проклятия, духи разорения и духи могил предков
reading.YearTrigram.KHEN.illness=раны головы, укусы собаки в левую ногу, падения, молния, болезни лёгких, тугоподвижность суставов и поветрия
reading.YearTrigram.KHAM=Год под триграммой воды (ཁམ, kham) связывает раскапывание озёр и источников ньен (གཉན, gnyan), прокладку новых каналов и переправу через большие реки. Избегайте осквернения воды и ночных переходов. Не носите чёрной нижней одежды и не ешьте рыбы и свинины. Следует охранять юго-запад и северо-восток.
reading.YearTrigram.KHAM.remedy=читайте «Сутру великого облака» и «Золотой свет», совершайте обряды нагов (ཀླུ, klu), омывайтесь омовением Видараны и отошлите выкуп в виде мыши или свиньи на север
reading.YearTrigram.KHAM.spirits=богини озёр, наги (ཀླུ, klu) и боги, оскорблённые нечистотой
reading.YearTrigram.KHAM.illness=водянка, болезни почек, холодные опухоли и понос
reading.YearTrigram.GIN=Год под триграммой горы (གིན, gin) связывает порчу храмов и ступ, метание зор (ཟོར, zor), раскалывание скал, стройку и работы в земле. Не торгуйте свиньями, быками и монашеским имуществом, остерегайтесь быков на восходе. Следует охранять юго-восток и север.
reading.YearTrigram.GIN.remedy=читайте «Стотысячную» и «Махамаюри», подносите много торм (གཏོར་མ, gtor ma), делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha), по одному на каждый год жизни, и отошлите выкуп в виде быка на северо-восток
reading.YearTrigram.GIN.spirits=владыки земли (ས་བདག, sa bdag), наги (ཀླུ, klu), колдовство и духи забытых подношений
reading.YearTrigram.GIN.illness=болезни селезёнки и лимфы, проказа, язвы, нарывы и зуд, боли в правой ноге
reading.YearTrigram.ZIN=Год под триграммой грома (ཟིན, zin) связывает рубку деревьев и раскалывание скал ньен (གཉན, gnyan), вынос чёрного дерева и покупку плотницких орудий. Избегайте клятв и арбалета, не покупайте ослов и не ешьте зайца, остерегайтесь стрел по утрам. Следует охранять запад и северо-запад.
reading.YearTrigram.ZIN.remedy=читайте «Гандавьюху» и покаяние в падениях, совершайте обряды нагов (ཀླུ, klu) и водные тормы (ཆུ་གཏོར, chu gtor), копайте пруды и колодцы и отошлите выкуп в виде тигра или зайца на восток или запад
reading.YearTrigram.ZIN.spirits=наги (ཀླུ, klu), голодные духи, демоны (བདུད, bdud) самоубийц и духи цен (བཙན, btsan)
reading.YearTrigram.ZIN.illness=колющие боли, слизь, болезни печени, боли в правом боку и внезапная болезнь
reading.YearTrigram.ZON=Год под триграммой ветра (ཟོན, zon) связывает отправку или приём невесты, клятвы, ношение золота и бирюзы и подъём знамён. Остерегайтесь заразной болезни и не покупайте яко-коровьих помесей и мулов. Следует охранять северо-восток и юго-запад.
reading.YearTrigram.ZON.remedy=читайте Ушнишу и дхарани, отвращающие поветрия, отсылайте нитяные кресты (མདོས, mdos) и водные подношения, устройте угощение для детей и отошлите выкуп в виде дракона на юго-восток
reading.YearTrigram.ZON.spirits=ма-мо (མ་མོ, ma mo), духи безумия и духи гьялпо (རྒྱལ་པོ, rgyal po)
reading.YearTrigram.ZON.illness=поветрия, дрожь сердца и дыхания, расстройства каналов и ветров, головокружение, безумие и обмороки
reading.YearMewa={0} Ваше мева (སྨེ་བ, sme ba) года выходит из натального, на одно место в год, и то, куда оно падает, читается по мева, под которым вы родились.
reading.YearMewa.N2.C3=Рождённому под двумя чёрными, падающему на три синих: теряется скот, потери пугают. Вредят призраки зарезанных животных, и есть опасность удара камнем.
reading.YearMewa.N2.C3.remedy=избегайте ссор и драк, читайте «Дхваджагру» и дхарани долгой жизни
reading.YearMewa.N2.C4=Рождённому под двумя чёрными, падающему на четыре зелёных: наги (ཀླུ, klu) и демоны (བདུད, bdud) вместе вредят из ручья или долины.
reading.YearMewa.N2.C4.remedy=совершайте обряды покаяния и восполнения; при болезни — подношения лекарств и нитяной крест (མདོས, mdos) нагов (ཀླུ, klu)
reading.YearMewa.N2.C5=Рождённому под двумя чёрными, падающему на пять жёлтых: приходят жёлтая жидкость, холодные болезни желудка и печени, возвращается старая болезнь, приходит горе. При болезни вредит дух расписного образа или скита.
reading.YearMewa.N2.C5.remedy=читайте сутры долгой жизни, совершите омовение из сосуда и выкуп долгой жизни и не ссорьтесь с монахами
reading.YearMewa.N2.C7=Рождённому под двумя чёрными, падающему на семь красных: хищные звери, удары оружия, раны и кровь. Вредят вредоносные духи умерших, нарушивших обеты (དམ་སྲི, dam sri), и подстерегают враги и воры.
reading.YearMewa.N2.C7.remedy=совершайте обряды покаяния и восполнения; прижигание помогает, кровопускание вредит
reading.YearMewa.N2.C7.illness=неспокойно верхней части тела, с рвотой
reading.YearMewa.N2.C6=Рождённому под двумя чёрными, падающему на шесть белых: оно не падает на жизнь, малые прибыли растут. При болезни скверна приходит с северо-востока.
reading.YearMewa.N2.C6.remedy=покаяние и очищение
reading.YearMewa.N2.C18=Рождённому под двумя чёрными, падающему на одно белое или восемь белых: оно не падает на жизнь. Дома приходят ссоры или опасность от красного, и вредит собственный дух каждого мева.
reading.YearMewa.N2.C18.remedy=отошлите нитяной крест (མདོས, mdos) нагов (ཀླུ, klu) и золотой нитяной крест
reading.YearMewa.N2.C9=Рождённому под двумя чёрными, падающему на девять красных: для мужчины драки и враги, для женщины роды, для обоих лик красного. При болезни вредят защитники.
reading.YearMewa.N2.C9.remedy=прежде всего обряды покаяния и восполнения
reading.YearMewa.N3.C2=Рождённому под тремя синими, падающему на два чёрных: демоны (བདུད, bdud) и духи очага вредят вместе, с безумием и обмороками. Болезнь пугает, но не убивает, а земные духи старых развалин причиняют боли в верхней части тела.
reading.YearMewa.N3.C2.remedy=совершайте обряды против демонов (བདུད, bdud)
reading.YearMewa.N3.C4=Рождённому под тремя синими, падающему на четыре зелёных: страдание приходит к мужчине, болезнь долгая, со стороны матери. Избегайте красных людей и коней с северо-востока.
reading.YearMewa.N3.C4.remedy=совершайте обряды нагов (ཀླུ, klu) и держитесь подальше от забоя скота
reading.YearMewa.N3.C4.illness=кровотечение из носа и рта
reading.YearMewa.N3.C5=Рождённому под тремя синими, падающему на пять жёлтых: поднимаются желчь и ветер, горе приходит к мужчинам вашей родни. Вред идёт с юга и востока: не ешьте пищи от тех, кто приходит оттуда.
reading.YearMewa.N3.C7=Рождённому под тремя синими, падающему на семь красных: вредит колдовство с юга или востока. При болезни вредят призраки северо-востока.
reading.YearMewa.N3.C7.remedy=отвращайте врагов и подавляйте вредоносных духов умерших (སྲི, sri)
reading.YearMewa.N3.C68=Рождённому под тремя синими, падающему на шесть белых или восемь белых: вредит дух дерева с юго-запада, с жаром вверху и поносом внизу.
reading.YearMewa.N3.C68.remedy=совершайте обряды для богов и подносите светильники
reading.YearMewa.N3.C19=Рождённому под тремя синими, падающему на одно белое или девять красных: дух, соединённый с вредоносными духами умерших (སྲི, sri), вредит из-за двух рек, и поднимаются погибшие от воды или ножа. Болезнь проходит за девять дней.
reading.YearMewa.N3.C19.remedy=дайте выкуп (གླུད, glud) воде и подавите её духов
reading.YearMewa.N4.C2=Рождённому под четырьмя зелёными, падающему на два чёрных: вред приходит от чёрной скалы и с востока, с болезнями и смертями от нагов (ཀླུ, klu).
reading.YearMewa.N4.C2.remedy=обряды восполнения и отвращения
reading.YearMewa.N4.C3=Рождённому под четырьмя зелёными, падающему на три синих: колющие боли и тугоподвижность суставов, дрожь верхней части тела. Жить тяжело, хотя и не умирают.
reading.YearMewa.N4.C3.remedy=совершайте подношения богам и устраняйте вред водяных духов
reading.YearMewa.N4.C4=Рождённому под четырьмя зелёными, падающему на четыре зелёных: очаг осквернён на северо-востоке или раскопана земля ньен (གཉན, gnyan). Смерть не приходит, но вредят духи нагов (ཀླུ, klu), и боги недовольны.
reading.YearMewa.N4.C4.remedy=очищайтесь и читайте «Дхваджагру»
reading.YearMewa.N4.C5=Рождённому под четырьмя зелёными, падающему на пять жёлтых: поднимаются опухоли и лихорадки, болезнь от очага или раскопанной земли. Выздоравливают за двенадцать дней.
reading.YearMewa.N4.C5.remedy=читайте «Дхваджагру» и «Ваджрные уста»
reading.YearMewa.N4.C7=Рождённому под четырьмя зелёными, падающему на семь красных: с юга вредят духи предков, убитых ножом, а женщине — дух умершей в родах.
reading.YearMewa.N4.C18=Рождённому под четырьмя зелёными, падающему на одно белое или восемь белых: поднимаются враги, с болезнями сухожилий и костей. Вредят наги (ཀླུ, klu) и духи гьялпо (རྒྱལ་པོ, rgyal po).
reading.YearMewa.N4.C18.remedy=дайте выкуп зерном и совершайте обряды покаяния и восполнения
reading.YearMewa.N4.C69=Рождённому под четырьмя зелёными, падающему на шесть белых или девять красных: оно не падает на жизнь. При болезни вредит кислый или горький дух.
reading.YearMewa.N4.C69.remedy=очищение, омовение и обряды восполнения
reading.YearMewa.N5.C2=Рождённому под пятью жёлтыми, падающему на два чёрных: вредят дух скалы или призраки братьев матери. Они приходят с севера, с чёрным конём и в чёрной одежде, неся пищу.
reading.YearMewa.N5.C2.remedy=отошлите выкуп из теста на север
reading.YearMewa.N5.C3=Рождённому под пятью жёлтыми, падающему на три синих: боли в желудке, безумие и обмороки, а к женщинам приходит синее колдовство.
reading.YearMewa.N5.C3.remedy=читайте «Махамаюри» и совершите омовение из сосуда
reading.YearMewa.N5.C4=Рождённому под пятью жёлтыми, падающему на четыре зелёных: владыки земли (ས་བདག, sa bdag) и наги (ཀླུ, klu) насылают болезнь.
reading.YearMewa.N5.C4.remedy=подавите владык земли (ས་བདག, sa bdag) и снимите колдовство нагов (ཀླུ, klu)
reading.YearMewa.N5.C5=Рождённому под пятью жёлтыми, падающему на пять жёлтых: поветрия и обвинения. При болезни вредит дух разорённой долины и старая вдова с юго-запада.
reading.YearMewa.N5.C5.remedy=пусть тантрический жрец отвратит это тормами (གཏོར་མ, gtor ma)
reading.YearMewa.N5.C7=Рождённому под пятью жёлтыми, падающему на семь красных: подстерегают воры и враги. При болезни вредят демоны (བདུད, bdud) владык.
reading.YearMewa.N5.C7.remedy=отвращайте врагов на северо-востоке в полночь
reading.YearMewa.N5.C1689=Рождённому под пятью жёлтыми, падающему на одно из трёх белых или девять красных: остерегайтесь нечистоты и скверны.
reading.YearMewa.N5.C1689.remedy=чтите богов и призывайте благоденствие в его время
reading.YearMewa.N7.C2=Рождённому под семью красными, падающему на два чёрных: рассмотрите это внимательно. При болезни ньен (གཉན, gnyan) приносят лик красного, и есть опасность убийства.
reading.YearMewa.N7.C3=Рождённому под семью красными, падающему на три синих: испуг и внезапное несчастье, опасность гибели через коня. Вредят владыки поднесённого богатства.
reading.YearMewa.N7.C3.remedy=отсеките их притязания
reading.YearMewa.N7.C4=Рождённому под семью красными, падающему на четыре зелёных: холодные болезни желудка и тугоподвижность суставов. Вредит дух безумия соседей, и с обрядами освобождаются за двадцать один день.
reading.YearMewa.N7.C5=Рождённому под семью красными, падающему на пять жёлтых: конечности, паралич и жёлтая жидкость. Вредит дух, привязанный к сухому богатству.
reading.YearMewa.N7.C5.remedy=омовение и обряды отвращения
reading.YearMewa.N7.C7=Рождённому под семью красными, падающему на семь красных: призрак цен (བཙན, btsan) вредит с красной скалистой горы. При болезни он приходит с юга, где кто-то был убит ножом, с ликом крови и разлуки.
reading.YearMewa.N7.C1689=Рождённому под семью красными, падающему на одно из трёх белых или девять красных: богатство тратится и снова растёт. Остерегайтесь нечистоты, а болезнь легко пережить.
reading.YearMewa.N7.C1689.remedy=совершайте подношения нагам (ཀླུ, klu)
reading.YearMewa.NW.C2=Рождённому под одним из трёх белых, падающему на два чёрных: вы встречаете чёрного человека, ведущего чёрного пса с юго-востока. Болезнь не убивает, но будьте осторожны восемнадцать дней.
reading.YearMewa.NW.C2.remedy=совершите обряды гьялпо (རྒྱལ་པོ, rgyal po)
reading.YearMewa.NW.C3=Рождённому под одним из трёх белых, падающему на три синих: вредят ньен (གཉན, gnyan) и духи гьялпо (རྒྱལ་པོ, rgyal po) юго-запада, и опасность поднимается от красного на юго-западе.
reading.YearMewa.NW.C3.remedy=устраните вред нагов (ཀླུ, klu), ньен (གཉན, gnyan) и гьялпо (རྒྱལ་པོ, rgyal po)
reading.YearMewa.NW.C4=Рождённому под одним из трёх белых, падающему на четыре зелёных: болезнь лёгких приходит изнутри. Вредят духи гьялпо (རྒྱལ་པོ, rgyal po), божества войны и колдовство.
reading.YearMewa.NW.C4.remedy=снимите колдовство и оставьте распри
reading.YearMewa.NW.C5=Рождённому под одним из трёх белых, падающему на пять жёлтых: оспа и боли в суставах, от вредоносного духа востока.
reading.YearMewa.NW.C5.remedy=нитяной крест (མདོས, mdos) для ма-мо (མ་མོ, ma mo) спасает за три дня
reading.YearMewa.NW.C7=Рождённому под одним из трёх белых, падающему на семь красных: красный очаг. Вредят призраки добытой на охоте дичи, выздоравливают за девять или десять дней.
reading.YearMewa.NW.C7.remedy=избегайте гончарного дела, огненных подношений и кузницы
reading.YearMewa.NW.C168=Рождённому под одним из трёх белых, падающему на одно из трёх белых: хорошо. При болезни вредит старуха из близкой родни в серой одежде, и навлекает это пища.
reading.YearMewa.NW.C9=Рождённому под одним из трёх белых, падающему на девять красных: встречаются пища и богатство. Избегайте нечистоты и скверны.
reading.YearMewa.NW.C9.remedy=при болезни совершите нитяной крест (མདོས, mdos) восполнения для ма-мо (མ་མོ, ma mo)
reading.YearMewa.N9.C2=Рождённому под девятью красными, падающему на два чёрных: встречаются дурные знамения, поднимаются поветрия и вредоносные духи умерших (སྲི, sri).
reading.YearMewa.N9.C2.remedy=отвратите их и устраните вред огня, ножей и владык поднесённого богатства
reading.YearMewa.N9.C3=Рождённому под девятью красными, падающему на три синих: сброшенного конём поражает стрела врага, приходят потери.
reading.YearMewa.N9.C3.remedy=протяните нить и призывайте благоденствие
reading.YearMewa.N9.C4=Рождённому под девятью красными, падающему на четыре зелёных: болезни лёгких, слизи и желчи приходят от ссор.
reading.YearMewa.N9.C4.remedy=прежде всего снимайте колдовство
reading.YearMewa.N9.C5=Рождённому под девятью красными, падающему на пять жёлтых: долгая болезнь, оспа, язвы и зуд, поражает трупная скверна.
reading.YearMewa.N9.C5.remedy=очищайтесь и омывайтесь
reading.YearMewa.N9.C7=Рождённому под девятью красными, падающему на семь красных: защитники шевелятся. При болезни есть лик крови, и вредят призраки насильственно убитых.
reading.YearMewa.N9.C7.remedy=отошлите выкуп (གླུད, glud) на юго-запад и устраните вред призраков
reading.YearMewa.N9.C168=Рождённому под девятью красными, падающему на одно из трёх белых: желания исполняются, на чужбине идёт хорошо. От болезни выздоравливают за девять или тринадцать дней.
reading.YearMewa.N9.C168.remedy=при болезни — обряды покаяния и восполнения
reading.YearMewa.N9.C9=Рождённому под девятью красными, падающему на девять красных: лик очага, и всё же желания достигаются.
HarshYear.LOG_MEN_TOMB=смещённый знак на могиле
HarshYear.COMBINED_NINE=составная девятка
HarshYear.NINE_TOMB=девятка встречает могилу
HarshYear.TRIGRAM_NINE=девятка триграммы
HarshYear.MEWA_NINE=девятка мева
HarshYear.TOMB_OWN_GREAT=ваша большая могила
HarshYear.TOMB_OWN_SMALL=ваша малая могила
HarshYear.TOMB_SLAYER_GREAT=большая могила убийцы
HarshYear.TOMB_SLAYER_SMALL=малая могила убийцы
HarshYear.BLACK_UNDERTAKER=чёрный могильщик
HarshYear.TOMB_SIGN=знак могилы
SmeBaObstacle.SKY_DOOR=небесные врата мева
SmeBaObstacle.EARTH_DOOR=земные врата мева
reading.YearDecline.VITALITY={0} Когда энергия жизненной силы убывает, смерти и потери могут приходить по две, и год следует лечить всерьёз.
reading.YearDecline.VITALITY.remedy=вытягивайте жизнь и оставьте отнятие жизни; выкупайте смерть и ла, жизненный дух (བླ, bla), обрядами долгой жизни и благоденствия
reading.YearDecline.BODY={0} Когда энергия тела убывает, могут прийти горе, раны и тугоподвижность суставов.
reading.YearDecline.BODY.remedy=отошлите собачью тушу как изображение в благоприятную сторону
reading.YearDecline.DESTINY={0} Когда энергия могущества убывает, теряется богатство, может погибнуть конь под седлом, детей трудно вырастить. Приходят враги, грабители и воры.
reading.YearDecline.DESTINY.remedy=подавляйте духов утраты и вражды и угощайте тех, кто не может отплатить
reading.YearDecline.LUCK={0} Когда энергия коня ветра убывает, приходят обвинения без вины и внезапные удары на высоком месте и на низком.
reading.YearDecline.LUCK.remedy=чините дороги и узкие тропы, делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) и подавляйте духов вражды
reading.Harsh.COMBINED_NINE.EARTH.1=Для земли и воды первая: бьют демоны (བདུད, bdud).
reading.Harsh.COMBINED_NINE.EARTH.1.remedy=совершите обряд, отвращающий лик демонов (བདུད, bdud)
reading.Harsh.COMBINED_NINE.EARTH.2=Для земли и воды вторая: время внезапного испуга.
reading.Harsh.COMBINED_NINE.EARTH.2.remedy=поднесите сто частей мяса и сто частей теста
reading.Harsh.COMBINED_NINE.EARTH.3=Для земли и воды третья: бирюзовый слон бесится, и к окружающим приходят поветрия.
reading.Harsh.COMBINED_NINE.EARTH.3.remedy=совершайте очистительные омовения и читайте Ушнишу
reading.Harsh.COMBINED_NINE.EARTH.4=Для земли и воды четвёртая: синяя бирюзовая скала трескается, и для мужчины есть лик врагов и воров.
reading.Harsh.COMBINED_NINE.EARTH.4.remedy=отвращайте, сокрушайте и подавляйте врагов дхарани и множеством глиняных обетных изображений (ཚ་ཚ, tsha tsha)
reading.Harsh.COMBINED_NINE.EARTH.5=Для земли и воды пятая: золотое дерево падает, плохо для старших рода отца.
reading.Harsh.COMBINED_NINE.EARTH.5.remedy=выкупайте ла, жизненный дух (བླ, bla), читайте сутры долгой жизни и выкупайте жизнь
reading.Harsh.COMBINED_NINE.WOOD.1=Для дерева первая: птица садится на острие копья, и человек попадает в руки врагов.
reading.Harsh.COMBINED_NINE.WOOD.1.remedy=отвращайте, сокрушайте и подавляйте врагов
reading.Harsh.COMBINED_NINE.WOOD.2=Для дерева вторая: два демона (བདུད, bdud) и два человека бьются, плохо для близких.
reading.Harsh.COMBINED_NINE.WOOD.2.remedy=отвратите несчастье от демонов (བདུད, bdud)
reading.Harsh.COMBINED_NINE.WOOD.3=Для дерева третья: стрела ломается посередине, сурово для сыновей, внуков и учителей.
reading.Harsh.COMBINED_NINE.WOOD.3.remedy=дайте выкуп (གླུད, glud) и чтите общину монахов
reading.Harsh.COMBINED_NINE.WOOD.4=Для дерева четвёртая: стрела уходит под землю, поднимаются владыки земли (ས་བདག, sa bdag) и духи земли, плохо для ламы и родни отца.
reading.Harsh.COMBINED_NINE.WOOD.4.remedy=поднесите водные тормы (ཆུ་གཏོར, chu gtor) и читайте «Золотой свет»
reading.Harsh.COMBINED_NINE.WOOD.5=Для дерева пятая: гриф падает на равнину, время сплетен и пересудов.
reading.Harsh.COMBINED_NINE.WOOD.5.remedy=изгоняйте домовых и подавляйте сплетни
reading.Harsh.COMBINED_NINE.FIRE.1=Для огня первая: демоны (བདུད, bdud) насылают несчастье и бросают камень мёртвых, плохо для того, на кого он падает.
reading.Harsh.COMBINED_NINE.FIRE.1.remedy=отвращайте демонов (བདུད, bdud), отошлите нитяной крест (མདོས, mdos) с зор (ཟོར, zor) и читайте «Аватамсаку»
reading.Harsh.COMBINED_NINE.FIRE.2=Для огня вторая: вредит колдовство жрецов, приходит внезапная тяжёлая болезнь.
reading.Harsh.COMBINED_NINE.FIRE.2.remedy=совершите стократный обряд со ста частями мяса и теста
reading.Harsh.COMBINED_NINE.FIRE.3=Для огня третья: ребёнок падает с колен, малые дети тяжело заболевают.
reading.Harsh.COMBINED_NINE.FIRE.3.remedy=дайте малый выкуп (གླུད, glud) и подавляйте духов
reading.Harsh.COMBINED_NINE.FIRE.4=Для огня четвёртая: встречаются враги, с ликом тяжб.
reading.Harsh.COMBINED_NINE.FIRE.4.remedy=отвращайте врагов и подавляйте их духов
reading.Harsh.COMBINED_NINE.FIRE.5=Для огня пятая: стрела жизни ломается в сочленении, с тяжёлой болезнью и множеством сплетен.
reading.Harsh.COMBINED_NINE.FIRE.5.remedy=читайте «Дхваджагру» и призывайте долгую жизнь и благоденствие
reading.Harsh.COMBINED_NINE.IRON.1=Для железа первая: золото выходит из-под земли, но богатство может опустеть.
reading.Harsh.COMBINED_NINE.IRON.1.remedy=призывайте благоденствие, подавляйте духов утраты и устройте угощение для детей
reading.Harsh.COMBINED_NINE.IRON.2=Для железа вторая: непосильная ноша, большие тяжбы и враги, от которых надо откупаться.
reading.Harsh.COMBINED_NINE.IRON.2.remedy=совершайте сильные обряды отвращения с тормами (གཏོར་མ, gtor ma)
reading.Harsh.COMBINED_NINE.IRON.3=Для железа третья: золотое ярмо ломается, великие люди поднимаются врагами.
reading.Harsh.COMBINED_NINE.IRON.3.remedy=изгоняйте несчастье и совершите обряд мужского божества
reading.Harsh.COMBINED_NINE.IRON.4=Для железа четвёртая: бьёт аркан демонов (བདུད, bdud), суровое время для окружающих.
reading.Harsh.COMBINED_NINE.IRON.4.remedy=поднесите отвращающие тормы (གཏོར་མ, gtor ma)
reading.Harsh.COMBINED_NINE.IRON.5=Для железа пятая: дом могилы. Смерть и потери могут прийти к вам или к родне отца или матери, со скудостью заслуг или потрясениями.
reading.Harsh.COMBINED_NINE.IRON.5.remedy=освобождают выкупы (གླུད, glud), нитяные кресты (མདོས, mdos) богиням озёр и водные подношения
reading.Harsh.NINE_TOMB=Ваша девятка в этом году встречается с могилой, по животному вашего рождения и полу: очень вредно, словно вы сами входите в могилу.
reading.Harsh.NINE_TOMB.remedy=поднесите тормы (གཏོར་མ, gtor ma), подношения земле и пир всем владыкам кладбища и запечатайте устье могилы
reading.Harsh.TRIGRAM_NINE=Ваша триграмма года вернулась туда, откуда начала, на триграмму огня (ལི, li) у мужчины или триграмму воды (ཁམ, kham) у женщины: девятка триграммы.
reading.Harsh.MEWA_NINE=Ваше мева (སྨེ་བ, sme ba) года вернулось в середину, на ваше натальное мева: девятка мева.
reading.Harsh.TOMB_OWN_GREAT=Нынешний год — великая могила стихии вашего года рождения, могильное животное в вашей собственной стихии. Из восьмидесяти могильных домов это ваша собственная могила, большая, и вход в неё — великая кара.
reading.Harsh.TOMB_OWN_SMALL=Нынешний год — малая могила стихии вашего года рождения, седьмой от великой.
reading.Harsh.TOMB_SLAYER_GREAT=Нынешний год — великая могила стихии, убивающей вашу, её могильное животное в этой стихии.
reading.Harsh.TOMB_SLAYER_SMALL=Нынешний год — малая могила стихии, убивающей вашу, седьмой от её великой.
reading.Harsh.BLACK_UNDERTAKER=Ваша великая могила — один из четырёх чёрных могильщиков: водяной дракон, деревянная овца, огненная собака и железный бык. Когда могила собственной стихии восходит одним из них, это плохо.
reading.Harsh.LOG_MEN_TOMB=Ваш смещённый знак (ལོག་མེན, log men) стоит на одном из ваших четырёх могильных годов: немного плохо.
reading.Harsh.TOMB_SIGN=Ваша триграмма года стоит на могильной триграмме вашей жизненной силы, и вы попадаете в могильный знак. Для дерева это триграмма земли (ཁོན, khon), для огня триграмма неба (ཁེན, khen), для железа триграмма горы (གིན, gin), для земли и воды триграмма ветра (ཟོན, zon).
reading.Harsh.TOMB_SIGN.remedy=выйдите из могильного знака и совершите обряд трёх костей
reading.Harsh.OWN_YEAR={0} В год своего животного не навещайте скорбящих, не садитесь у изголовья больного и избегайте строительства.
reading.Harsh.OWN_YEAR.remedy=оставьте развлечения и усердствуйте в добродетели; усердно призывайте жизнь и благоденствие, чтите общину монахов и читайте «Стотысячную», «Двадцатитысячную» и Ушнишу
reading.Harsh.SEVENTH={0} Седьмой суров врагами и убийцами: демон шевелится и хочет выкупа, приходят внезапные испуги, страх и обвинения.
reading.Harsh.SEVENTH.remedy=читайте защитные дхарани, чтите божеств войны и отвращайте врагов, чините дороги, делайте глиняные обетные изображения (ཚ་ཚ, tsha tsha) и угощайте тех, кто не может отплатить
reading.Harsh.COMBINED_NINE={0} Это сводная девятка, в которой аспект вашего года рождения достигает могилы своей стихии.
reading.Harsh.TOMB.remedy=выйдите из могилы, поднесите припасы могилам и запечатайте их устье; совершите великие обряды выкупа смерти и примите глубокие помогающие обряды
reading.MewaObstacle.SKY_DOOR=Оно падает на небесные врата мева, шесть белых у мужчины и одно белое у женщины: с неба может сойти мор. Не клянитесь и остерегайтесь молнии и очага.
reading.MewaObstacle.SKY_DOOR.remedy=закройте небесные врата их обрядом
reading.MewaObstacle.EARTH_DOOR=Оно падает на земные врата мева, два чёрных у мужчины и четыре зелёных у женщины: поднимаются духи разорения, и вред приходит с низин. Не закладывайте фундаментов и не копайте землю.
reading.MewaObstacle.EARTH_DOOR.remedy=закройте земные врата их обрядом
SunTermKind.DBUGS_THOB=срок дыхания
SunTermKind.KHYIM_PHO=вход в знак
SunTermKind.SGANG=средний срок
